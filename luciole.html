const TAU = Math.PI * 2;

/* ============================================================
   UTILS + PRNG
   ============================================================ */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function approach(cur, target, rate, dt) { return cur + (target - cur) * (1 - Math.exp(-rate * dt)); }
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }
function smoothstep(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* --- accès tolérant au contenu narratif --- */
function sArr(v, fb) { return (Array.isArray(v) && v.length) ? v.slice() : (fb || []); }
function sStr(v, fb) { return (typeof v === 'string' && v.length) ? v : (fb || ''); }
function pick(rng, arr, fb) { const a = sArr(arr, fb ? [fb] : []); return a.length ? a[Math.floor(rng() * a.length)] : ''; }

function nightStory(n) {
  const S = (typeof STORY === 'object' && STORY) ? STORY : {};
  const raw = (S.nights && S.nights[n]) ? S.nights[n] : null;
  if (raw) {
    return {
      title: sStr(raw.title, 'Nuit ' + n),
      before: sArr(raw.before, ['La nuit s\'ouvre.']),
      after: sArr(raw.after, ['Encore une nuit derrière toi.']),
      hint: sStr(raw.hint, '')
    };
  }
  const e = S.endless || {};
  return {
    title: sStr(e.title, 'Veille éternelle'),
    before: sArr(e.before, ['La veille continue.']),
    after: ['La veille continue.'],
    hint: ''
  };
}

/* ============================================================
   SAUVEGARDE
   ============================================================ */
const save = { bestScore: 0, bestNight: 0, unlockedNight: 1, muted: false };

function loadSave() {
  try {
    const raw = localStorage.getItem(CFG.SAVE_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && typeof o === 'object') {
      save.bestScore = Math.max(0, Number(o.bestScore) || 0);
      save.bestNight = Math.max(0, Number(o.bestNight) || 0);
      save.unlockedNight = Math.max(1, Number(o.unlockedNight) || 1);
      save.muted = !!o.muted;
    }
  } catch (e) { /* stockage indisponible : on joue sans sauvegarde */ }
}
function writeSave() {
  try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignoré */ }
}
loadSave();

/* ============================================================
   AUDIO (WebAudio synthétisé, aucun fichier)
   ============================================================ */
const Audio_ = {
  ac: null, master: null, noise: null, humOsc: null, humGain: null, ready: false
};

function audioInit() {
  if (Audio_.ready) {
    if (Audio_.ac && Audio_.ac.state === 'suspended') Audio_.ac.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const ac = new AC();
    const master = ac.createGain();
    master.gain.value = save.muted ? 0 : 0.32;
    master.connect(ac.destination);

    const len = Math.floor(ac.sampleRate * 0.5);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    const humGain = ac.createGain(); humGain.gain.value = 0; humGain.connect(master);
    const humOsc = ac.createOscillator(); humOsc.type = 'sine'; humOsc.frequency.value = 116;
    const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 5.2;
    const lfoG = ac.createGain(); lfoG.gain.value = 4.5;
    lfo.connect(lfoG); lfoG.connect(humOsc.frequency);
    humOsc.connect(humGain);
    humOsc.start(); lfo.start();

    Audio_.ac = ac; Audio_.master = master; Audio_.noise = buf;
    Audio_.humOsc = humOsc; Audio_.humGain = humGain; Audio_.ready = true;
  } catch (e) { /* audio indisponible */ }
}

function audioMuteApply() {
  if (!Audio_.ready) return;
  Audio_.master.gain.setTargetAtTime(save.muted ? 0 : 0.32, Audio_.ac.currentTime, 0.05);
}

function setHum(v) {
  if (!Audio_.ready) return;
  Audio_.humGain.gain.setTargetAtTime(v, Audio_.ac.currentTime, 0.18);
}

function blip(f, dur, type, vol, slideTo, delay) {
  if (!Audio_.ready) return;
  const ac = Audio_.ac, t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + Math.min(0.03, dur * 0.25));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(Audio_.master);
  o.start(t); o.stop(t + dur + 0.05);
}

function noiseBurst(dur, filter, f0, f1, vol) {
  if (!Audio_.ready) return;
  const ac = Audio_.ac, t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = Audio_.noise; s.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = filter; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(f0, t);
  bp.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(bp); bp.connect(g); g.connect(Audio_.master);
  s.start(t); s.stop(t + dur + 0.05);
}

}, { passive: false });

/* ============================================================

   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const maskCanvas = document.createElement('canvas');
const mctx = maskCanvas.getContext('2d');
let VW = 1280, VH = 720, DPR = 1, uiScale = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = Math.max(320, window.innerWidth);
  VH = Math.max(240, window.innerHeight);
  canvas.width = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Le masque d'obscurité n'est fait que de dégradés doux : résolution 1x suffit et coûte moins cher.
  maskCanvas.width = VW;
  maskCanvas.height = VH;
  uiScale = clamp(Math.min(VW / 1280, VH / 720), 0.72, 1.7);
  if (!input.hasMouse) { input.mx = VW * 0.5; input.my = VH * 0.5; }
}
window.addEventListener('resize', resize);

canvas.addEventListener('mousemove', (e) => {
  const r = canvas.getBoundingClientRect();
  const nx = e.clientX - r.left, ny = e.clientY - r.top;
  if (nx !== input.mx || ny !== input.my) input.moved = true;
  input.mx = nx;
  input.my = ny;
  input.hasMouse = true;
});
canvas.addEventListener('mouseleave', () => {
  if (G.state === 'playing' && !G.paused) togglePause(true);
});
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  audioInit();
  onPointerDown();
}, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* ============================================================
   SOL — texture procédurale pré-rendue une fois par nuit
   (herbe / mousse / cailloux / racines ; jamais recalculée en jeu)
   ============================================================ */
let groundCanvas = null;

function buildGround(w, h, seed) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  const g = c.getContext('2d');
  const r = mulberry32((seed ^ 0x9e3779b9) >>> 0);
  const area = w * h;

  g.fillStyle = COL.ground;
  g.fillRect(0, 0, w, h);

  // 1. Grandes plaques de mousse et de terre, très diffuses
  const patches = Math.round(area / 26000);
  for (let i = 0; i < patches; i++) {
    const x = r() * w, y = r() * h, rr = 60 + r() * 150;
    const moss = r() < 0.58;
    const gr = g.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, (moss ? 'rgba(72,92,58,' : 'rgba(92,72,48,') + (0.30 + r() * 0.32) + ')');
    gr.addColorStop(1, moss ? 'rgba(72,92,58,0)' : 'rgba(92,72,48,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, rr, 0, TAU); g.fill();
  }

  // 2. Racines : longues courbes sombres qui traversent le sol
  const roots = Math.round(area / 40000);
  g.lineCap = 'round';
  for (let i = 0; i < roots; i++) {
    let x = r() * w, y = r() * h;
    let a = r() * TAU;
    const segs = 4 + Math.floor(r() * 5);
    const wd = 2 + r() * 3.5;
    g.strokeStyle = 'rgba(28,20,14,0.62)';
    g.lineWidth = wd;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < segs; k++) {
      a += (r() - 0.5) * 0.9;
      const l = 26 + r() * 40;
      x += Math.cos(a) * l; y += Math.sin(a) * l;
      g.lineTo(x, y);
    }
    g.stroke();
    // liseré clair sur le dessus de la racine
    g.strokeStyle = 'rgba(150,124,90,0.35)';
    g.lineWidth = Math.max(0.8, wd * 0.35);
    g.stroke();
  }

  // 3. Touffes d'herbe : petits traits verticaux groupés
  const tufts = Math.round(area / 1500);
  g.lineWidth = 1;
  for (let pass = 0; pass < 2; pass++) {
    g.strokeStyle = pass === 0 ? 'rgba(108,134,84,0.55)' : 'rgba(84,108,68,0.45)';
    g.beginPath();
    for (let i = 0; i < tufts; i++) {
      const x = r() * w, y = r() * h;
      const n = 2 + Math.floor(r() * 3);
      const keep = (r() < 0.62) === (pass === 0);
      for (let k = 0; k < n; k++) {
        const bx = x + (r() - 0.5) * 7, by = y + (r() - 0.5) * 4;
        const hh = 3 + r() * 5, bend = (r() - 0.5) * 4;
        if (!keep) continue;
        g.moveTo(bx, by);
        g.quadraticCurveTo(bx + bend * 0.5, by - hh * 0.6, bx + bend, by - hh);
      }
    }
    g.stroke();
  }

  // 4. Cailloux : petit disque clair + base sombre (donne du relief)
  const stones = Math.round(area / 6000);
  for (let i = 0; i < stones; i++) {
    const x = r() * w, y = r() * h, rr = 1.4 + r() * 3.2;
    g.fillStyle = 'rgba(18,16,14,0.55)';
    g.beginPath(); g.ellipse(x, y + rr * 0.5, rr * 1.05, rr * 0.55, 0, 0, TAU); g.fill();
    g.fillStyle = COL.pebble;
    g.globalAlpha = 0.34 + r() * 0.3;
    g.beginPath(); g.ellipse(x, y, rr, rr * 0.82, r() * TAU, 0, TAU); g.fill();
    g.globalAlpha = 1;
  }

  // 5. Grain fin, pour que le halo ne révèle jamais une surface plate
  const specks = Math.round(area / 900);
  for (let pass = 0; pass < 3; pass++) {
    g.globalAlpha = 0.13 + pass * 0.1;
    g.fillStyle = pass === 2 ? COL.dirt : COL.groundSpeck;
    g.beginPath();
    for (let i = 0; i < specks; i++) {
      const x = r() * w, y = r() * h, ss = 0.4 + r() * 1.3;
      if (Math.floor(r() * 3) !== pass) continue;
      g.moveTo(x + ss, y);
      g.arc(x, y, ss, 0, TAU);
    }
    g.fill();
  }
  g.globalAlpha = 1;
  return c;
}

/* ============================================================
   GÉNÉRATION DU MONDE
   ============================================================ */
function nightParams(n) {
  return {
    beacons: Math.min(6, 3 + Math.floor(n / 2)),
    w: Math.min(2200, 1400 + 120 * (n - 1)),
    h: Math.min(1600, 1000 + 120 * (n - 1)),
    spawnInterval: Math.max(0.9, 4.2 - 0.34 * (n - 1)),
    maxShadows: Math.min(30, Math.round(4 + 2.6 * (n - 1))),
    speedMul: Math.min(1.4, 1 + 0.05 * (n - 1)),
    watchers: n >= 3 ? Math.min(4, n - 2) : 0,
    traps: n >= 5 ? Math.min(4, n - 4) : 0,
    startShadows: Math.min(8, 1 + Math.floor(n * 0.7))
  };
}

function buildGrid(w, h, trees) {
  const cs = CFG.GRID;
  const gw = Math.ceil(w / cs), gh = Math.ceil(h / cs);
  const blocked = new Uint8Array(gw * gh);
  for (let i = 0; i < trees.length; i++) {
    const t = trees[i];
    const rr = t.r + CFG.ILO_R + 3;
    const x0 = Math.max(0, Math.floor((t.x - rr) / cs)), x1 = Math.min(gw - 1, Math.floor((t.x + rr) / cs));
    const y0 = Math.max(0, Math.floor((t.y - rr) / cs)), y1 = Math.min(gh - 1, Math.floor((t.y + rr) / cs));
    for (let gy = y0; gy <= y1; gy++) {
      for (let gx = x0; gx <= x1; gx++) {
        const cx = gx * cs + cs / 2, cy = gy * cs + cs / 2;
        if (dist2(cx, cy, t.x, t.y) < rr * rr) blocked[gy * gw + gx] = 1;
      }
    }
  }
  return { cs, gw, gh, blocked };
}

function floodFill(grid, sx, sy) {
  const { cs, gw, gh, blocked } = grid;
  const seen = new Uint8Array(gw * gh);
  const start = clamp(Math.floor(sy / cs), 0, gh - 1) * gw + clamp(Math.floor(sx / cs), 0, gw - 1);
  if (blocked[start]) return seen;
  const stack = [start];
  seen[start] = 1;
  while (stack.length) {
    const i = stack.pop();
    const gx = i % gw, gy = (i / gw) | 0;
    if (gx > 0) { const j = i - 1; if (!seen[j] && !blocked[j]) { seen[j] = 1; stack.push(j); } }
    if (gx < gw - 1) { const j = i + 1; if (!seen[j] && !blocked[j]) { seen[j] = 1; stack.push(j); } }
    if (gy > 0) { const j = i - gw; if (!seen[j] && !blocked[j]) { seen[j] = 1; stack.push(j); } }
    if (gy < gh - 1) { const j = i + gw; if (!seen[j] && !blocked[j]) { seen[j] = 1; stack.push(j); } }
  }
  return seen;
}

function cellReachable(grid, seen, x, y) {
  const gx = clamp(Math.floor(x / grid.cs), 0, grid.gw - 1);
  const gy = clamp(Math.floor(y / grid.cs), 0, grid.gh - 1);
  return !!seen[gy * grid.gw + gx];
}

function generateWorld(night, seed) {
  const P = nightParams(night);
  const margin = 70;
  const treeTarget = clamp(Math.round((P.w * P.h) / 15500), 80, 130);

  for (let attempt = 0; attempt < 16; attempt++) {
    const rng = mulberry32((seed + attempt * 7919) >>> 0);
    const start = {
      x: margin + rng() * (P.w - margin * 2),
      y: margin + rng() * (P.h - margin * 2)
    };

    // Balises : échantillonnage par rejet
    const beacons = [];
    let guard = 0;
    while (beacons.length < P.beacons && guard++ < 4000) {
      const bx = margin + rng() * (P.w - margin * 2);
      const by = margin + rng() * (P.h - margin * 2);
      if (dist2(bx, by, start.x, start.y) < 230 * 230) continue;
      let ok = true;
      for (const b of beacons) if (dist2(bx, by, b.x, b.y) < 250 * 250) { ok = false; break; }
      if (!ok) continue;
      beacons.push({ x: bx, y: by, lit: false, prog: 0, phase: rng() * TAU });
    }
    if (beacons.length < P.beacons) continue;

    // Porte : le point le plus éloigné du départ parmi des candidats
    let door = null, bestD = -1;
    for (let i = 0; i < 80; i++) {
      const dx = margin + rng() * (P.w - margin * 2);
      const dy = margin + rng() * (P.h - margin * 2);
      const d = dist2(dx, dy, start.x, start.y);
      if (d > bestD) { bestD = d; door = { x: dx, y: dy }; }
    }
    if (Math.sqrt(bestD) < 380) continue;

    // Arbres, en épargnant les zones utiles
    const clears = [{ x: start.x, y: start.y, r: 130 }, { x: door.x, y: door.y, r: 120 }];
    for (const b of beacons) clears.push({ x: b.x, y: b.y, r: 115 });
    const trees = [];
    guard = 0;
    while (trees.length < treeTarget && guard++ < treeTarget * 40) {
      const tx = 20 + rng() * (P.w - 40);
      const ty = 20 + rng() * (P.h - 40);
      const tr = 13 + rng() * 13;
      let ok = true;
      for (const c of clears) if (dist2(tx, ty, c.x, c.y) < (c.r + tr) * (c.r + tr)) { ok = false; break; }
      // Écart minimal entre troncs : toujours plus large qu'Ilo, pour qu'aucun passage ne le coince.
      const gap = CFG.ILO_R * 2 + 14;
      if (ok) for (const t of trees) if (dist2(tx, ty, t.x, t.y) < (t.r + tr + gap) * (t.r + tr + gap)) { ok = false; break; }
      if (!ok) continue;
      const crowns = [];
      const nc = 2 + Math.floor(rng() * 2);
      for (let k = 0; k < nc; k++) {
        crowns.push({
          dx: (rng() - 0.5) * tr * 1.5,
          dy: (rng() - 0.5) * tr * 1.5 - tr * 0.35,
          r: tr * (0.62 + rng() * 0.55),
          c: rng() < 0.5 ? COL.crownA : COL.crownB
        });
      }
      trees.push({ x: tx, y: ty, r: tr, crowns, lean: (rng() - 0.5) * 0.35 });
    }

    // Accessibilité : flood-fill sur grille 40 px
    const grid = buildGrid(P.w, P.h, trees);
    const seen = floodFill(grid, start.x, start.y);
    let allOk = cellReachable(grid, seen, door.x, door.y);
    if (allOk) for (const b of beacons) if (!cellReachable(grid, seen, b.x, b.y)) { allOk = false; break; }
    if (!allOk) continue;

    // Pièges lumineux (nuit 5+) et postes de veilleuses
    const traps = [];
    guard = 0;
    while (traps.length < P.traps && guard++ < 900) {
      const tx = margin + rng() * (P.w - margin * 2);
      const ty = margin + rng() * (P.h - margin * 2);
      if (dist2(tx, ty, start.x, start.y) < 300 * 300) continue;
      let ok = true;
      for (const b of beacons) if (dist2(tx, ty, b.x, b.y) < 150 * 150) { ok = false; break; }
      if (!ok) continue;
      traps.push({ x: tx, y: ty, cd: 0, phase: rng() * TAU });
    }

    return {
      w: P.w, h: P.h, params: P, rng,
      start, beacons, door, trees, traps,
      motes: makeMotes(rng, P.w, P.h)
    };
  }

  // Repli : forêt clairsemée garantie praticable
  const rng = mulberry32((seed + 4242) >>> 0);
  const beacons = [];
  for (let i = 0; i < P.beacons; i++) {
    const a = (i / P.beacons) * TAU;
    beacons.push({
      x: P.w / 2 + Math.cos(a) * P.w * 0.32,
      y: P.h / 2 + Math.sin(a) * P.h * 0.32,
      lit: false, prog: 0, phase: rng() * TAU
    });
  }
  return {
    w: P.w, h: P.h, params: P, rng,
    start: { x: P.w / 2, y: P.h / 2 },
    beacons,
    door: { x: P.w - 120, y: P.h - 120 },
    trees: [], traps: [],
    motes: makeMotes(rng, P.w, P.h)
  };
}

function makeMotes(rng, w, h) {
  const n = 90, out = [];
  for (let i = 0; i < n; i++) out.push({ x: rng() * w, y: rng() * h, p: rng() * TAU, s: 0.4 + rng() * 0.8 });
  return out;
}

/* ============================================================
   ENTITÉS + ÉTAT DE JEU
   ============================================================ */
const G = {
  state: 'title',           // title | help | intro | nightBefore | playing | nightAfter | epilogue | gameOver
  paused: false,
  night: 1,
  score: 0,
  scoreAtNightStart: 0,
  nightPoints: 0,
  beaconPts: 0,
  shadowPts: 0,
  hearts: CFG.HEARTS_MAX,
  seed: 1,
  world: null,
  time: 0,
  nightTime: 0,
  tookDamage: false,
  doorOpen: false,
  ilo: null, nim: null,
  shadows: [], particles: [], floats: [], bursts: [],
  cam: { x: 0, y: 0 },
  shake: 0,
  flash: 0,
  spawnTimer: 0,
  light: CFG.LIGHT_MAX,
  burstCd: 0,
  lastResult: null,
  menuIndex: 0,
  menuItems: [],
  menuHit: [],
  story: null,
  gameOverLine: '',
  hintText: '', hintT: 0,
  uiT: 0
};

function makeIlo(x, y) {
  return { x, y, vx: 0, vy: 0, r: CFG.ILO_R, face: 1, walk: 0, iframes: 0 };
}
function makeNim(x, y) {
  return { x, y, trailT: 0 };
}
function makeShadow(x, y, type, rng) {
  return {
    x, y, vx: 0, vy: 0,
    hp: 1, type: type || 'hunter',
    r: CFG.SHADOW_R * (0.85 + rng() * 0.4),
    phase: rng() * TAU,
    wob: 0.6 + rng() * 0.8,
    orbit: rng() * TAU,
    orbitDir: rng() < 0.5 ? -1 : 1,
    target: null,
    hesitate: 0
  };
}

function addParticles(x, y, n, color, speed, life, size) {
  const rng = Math.random;
  for (let i = 0; i < n; i++) {
    if (G.particles.length > 420) break;
    const a = rng() * TAU, s = speed * (0.35 + rng() * 0.9);
    G.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: life * (0.6 + rng() * 0.7), max: life, color,
      size: size * (0.6 + rng() * 0.8), drag: 2.2
    });
  }
}

function addFloat(x, y, text, color, size) {
  G.floats.push({ x, y, text, color: color || COL.warmSoft, size: size || 18, life: 1.5, max: 1.5 });
}

/* ============================================================
   LUMIÈRE
   ============================================================ */
function haloRadius() {
  return CFG.HALO_MIN + (CFG.HALO_MAX - CFG.HALO_MIN) * (G.light / CFG.LIGHT_MAX);
}

/** Quantité de lumière (0..1) en un point du monde. */
function lightAmount(x, y) {
  let a = 0;
  const hr = haloRadius();
  const dn = dist(x, y, G.nim.x, G.nim.y);
  if (dn < hr) a = 1 - dn / hr;
  const W = G.world;
  for (let i = 0; i < W.beacons.length; i++) {
    const b = W.beacons[i];
    if (!b.lit) continue;
    const d = dist(x, y, b.x, b.y);
    if (d < CFG.BEACON_LIGHT_R) a = Math.max(a, 1 - d / CFG.BEACON_LIGHT_R);
  }
  if (G.doorOpen) {
    const d = dist(x, y, W.door.x, W.door.y);
    if (d < CFG.DOOR_LIGHT_R) a = Math.max(a, 1 - d / CFG.DOOR_LIGHT_R);
  }
  for (let i = 0; i < G.bursts.length; i++) {
    const bu = G.bursts[i];
    const d = dist(x, y, bu.x, bu.y);
    if (d < bu.r) a = Math.max(a, (1 - d / bu.r) * (1 - bu.t / bu.dur));
  }
  return a;
}

/* ============================================================
   DÉMARRAGE D'UNE NUIT / PARTIE
   ============================================================ */
function startRun(fromNight) {
  G.seed = (Math.floor(Math.random() * 0x7fffffff)) >>> 0;
  G.score = 0;
  G.hearts = CFG.HEARTS_MAX;
  G.night = Math.max(1, fromNight || 1);
  G.lastResult = null;
}

function startNight(n) {
  G.night = n;
  G.world = generateWorld(n, (G.seed + n * 104729) >>> 0);
  const W = G.world;
  groundCanvas = buildGround(W.w, W.h, (G.seed + n * 104729) >>> 0);
  G.ilo = makeIlo(W.start.x, W.start.y);
  G.nim = makeNim(W.start.x + 40, W.start.y - 20);
  G.shadows = []; G.particles = []; G.floats = []; G.bursts = [];
  G.light = CFG.LIGHT_MAX;
  G.burstCd = 0.55;         // les clics qui lancent la nuit ne déclenchent pas d'éclat
  input.burstQueued = false;
  G.doorOpen = false;
  G.nightTime = 0;
  G.tookDamage = false;
  G.nightPoints = 0;
  G.beaconPts = 0;
  G.shadowPts = 0;
  G.scoreAtNightStart = G.score;
  G.shake = 0; G.flash = 0;
  G.spawnTimer = W.params.spawnInterval * 1.4;
  G.hearts = Math.min(CFG.HEARTS_MAX, G.hearts + 1);
  G.cam.x = clamp(G.ilo.x - VW / 2, 0, Math.max(0, W.w - VW));
  G.cam.y = clamp(G.ilo.y - VH / 2, 0, Math.max(0, W.h - VH));

  // Veilleuses en poste autour des balises non allumées
  for (let i = 0; i < W.params.watchers; i++) {
    const b = W.beacons[i % W.beacons.length];
    const s = makeShadow(b.x + Math.cos(i) * 70, b.y + Math.sin(i) * 70, 'watcher', W.rng);
    s.target = b;
    G.shadows.push(s);
  }
  // Quelques chasseuses déjà présentes, loin d'Ilo
  for (let i = 0; i < W.params.startShadows; i++) spawnShadow(true);

  save.unlockedNight = Math.max(save.unlockedNight, n);
  writeSave();

  const st = veilleStory(n);
  G.hintText = st.hint || '';
  G.hintT = st.hint ? 8 : 0;

  G.state = 'playing';
  G.paused = false;
}

function spawnShadow(initial) {
  const W = G.world;
  if (G.shadows.length >= W.params.maxShadows) return;
  const rng = W.rng;
  for (let i = 0; i < 30; i++) {
    const a = rng() * TAU;
    const d = initial ? (420 + rng() * 400) : (380 + rng() * 320);
    const x = clamp(G.ilo.x + Math.cos(a) * d, 20, W.w - 20);
    const y = clamp(G.ilo.y + Math.sin(a) * d, 20, W.h - 20);
    if (dist2(x, y, G.ilo.x, G.ilo.y) < 300 * 300) continue;
    if (lightAmount(x, y) > 0.1) continue;
    G.shadows.push(makeShadow(x, y, 'hunter', rng));
    return;
  }
}

/* ============================================================
   MISE À JOUR
   ============================================================ */
function updatePlaying(dt) {
  const W = G.world;
  G.nightTime += dt;

  /* --- Ilo (clavier) --- */
  const ilo = G.ilo;
  let dx = 0, dy = 0;
  if (held(KEY_LEFT)) dx -= 1;
  if (held(KEY_RIGHT)) dx += 1;
  if (held(KEY_UP)) dy -= 1;
  if (held(KEY_DOWN)) dy += 1;
  const dl = Math.hypot(dx, dy);
  if (dl > 0) { dx /= dl; dy /= dl; ilo.face = dx !== 0 ? Math.sign(dx) : ilo.face; }
  const tvx = dx * CFG.ILO_SPEED, tvy = dy * CFG.ILO_SPEED;
  const acc = dl > 0 ? CFG.ILO_ACCEL : CFG.ILO_ACCEL * 1.6;
  ilo.vx += clamp(tvx - ilo.vx, -acc * dt, acc * dt);
  ilo.vy += clamp(tvy - ilo.vy, -acc * dt, acc * dt);
  ilo.x += ilo.vx * dt;
  ilo.y += ilo.vy * dt;
  ilo.walk += Math.hypot(ilo.vx, ilo.vy) * dt * 0.055;
  if (ilo.iframes > 0) ilo.iframes -= dt;

  // Collisions arbres + bords
  for (let i = 0; i < W.trees.length; i++) {
    const t = W.trees[i];
    const rr = t.r + ilo.r;
    const d2 = dist2(ilo.x, ilo.y, t.x, t.y);
    if (d2 < rr * rr && d2 > 0.0001) {
      const d = Math.sqrt(d2);
      const nx = (ilo.x - t.x) / d, ny = (ilo.y - t.y) / d;
      ilo.x = t.x + nx * rr; ilo.y = t.y + ny * rr;
      const dot = ilo.vx * nx + ilo.vy * ny;
      if (dot < 0) {
        ilo.vx -= nx * dot; ilo.vy -= ny * dot;
        // Poussée de face : on dévie doucement d'un côté plutôt que de rester collé au tronc.
        const tan = ilo.vx * -ny + ilo.vy * nx;
        if (dl > 0 && Math.abs(tan) < 24) {
          const cross = dx * -ny + dy * nx;
          const side = cross !== 0 ? Math.sign(cross) : 1;
          ilo.vx += -ny * side * 70; ilo.vy += nx * side * 70;
        }
      }
    }
  }
  ilo.x = clamp(ilo.x, ilo.r + 4, W.w - ilo.r - 4);
  ilo.y = clamp(ilo.y, ilo.r + 4, W.h - ilo.r - 4);

  /* --- Nim (souris, inertie + laisse) --- */
  const nim = G.nim;
  const tx = G.cam.x + input.mx, ty = G.cam.y + input.my;
  nim.x = approach(nim.x, tx, CFG.NIM_LERP, dt);
  nim.y = approach(nim.y, ty, CFG.NIM_LERP, dt);
  let tdx = nim.x - ilo.x, tdy = nim.y - ilo.y;
  const td = Math.hypot(tdx, tdy);
  if (td > CFG.TETHER) {
    nim.x = ilo.x + tdx / td * CFG.TETHER;
    nim.y = ilo.y + tdy / td * CFG.TETHER;
  }
  G.tension = clamp((td - CFG.TETHER * 0.72) / (CFG.TETHER * 0.28), 0, 1);

  // Traînée de Nim
  nim.trailT -= dt;
  if (nim.trailT <= 0) {
    nim.trailT = 0.022;
    if (G.particles.length < 420) {
      G.particles.push({
        x: nim.x + (Math.random() - 0.5) * 3, y: nim.y + (Math.random() - 0.5) * 3,
        vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12 - 6,
        life: 0.55, max: 0.55, color: COL.warmSoft, size: 1.6, drag: 1.2
      });
    }
  }

  /* --- Lumière --- */
  // Une pierre allumée nourrit Nim : c'est le seul endroit où l'on peut souffler.
  let resting = false;
  for (let i = 0; i < W.beacons.length; i++) {
    const b = W.beacons[i];
    if (b.lit && dist2(nim.x, nim.y, b.x, b.y) < CFG.BEACON_LIGHT_R * CFG.BEACON_LIGHT_R) { resting = true; break; }
  }
  if (resting && G.light < CFG.BEACON_REST_CAP) {
    G.light = clamp(G.light + CFG.BEACON_REST_GAIN * dt, 0, CFG.BEACON_REST_CAP);
  } else {
    G.light = clamp(G.light - CFG.LIGHT_DRAIN * dt * (resting ? 0.25 : 1), 0, CFG.LIGHT_MAX);
  }
  G.resting = resting;
  if (G.burstCd > 0) G.burstCd -= dt;
  if (input.burstQueued) { input.burstQueued = false; doBurst(); }

  /* --- Balises --- */
  let litCount = 0;
  for (let i = 0; i < W.beacons.length; i++) {
    const b = W.beacons[i];
    if (b.lit) { litCount++; continue; }
    const onIt = dist2(ilo.x, ilo.y, b.x, b.y) < CFG.BEACON_STAND_RANGE * CFG.BEACON_STAND_RANGE;
    const nimNear = dist2(nim.x, nim.y, b.x, b.y) < CFG.BEACON_NIM_RANGE * CFG.BEACON_NIM_RANGE;
    if (onIt && nimNear) {
      b.prog += dt / CFG.BEACON_HOLD;
      if (b.prog >= 1) {
        b.lit = true; b.prog = 1; litCount++;
        G.light = clamp(G.light + CFG.BEACON_LIGHT_GAIN, 0, CFG.LIGHT_MAX);
        addScore(CFG.SCORE_BEACON);
        G.beaconPts += CFG.SCORE_BEACON;
        addFloat(b.x, b.y - 26, '+' + CFG.SCORE_BEACON, COL.warm, 20);
        const frag = pick(Math.random, STORY && STORY.beaconLit, 'une de moins');
        if (frag) addFloat(b.x, b.y - 62, frag, COL.warmSoft, 16);
        addParticles(b.x, b.y, 34, COL.warm, 130, 0.9, 2.6);
        G.flash = Math.max(G.flash, 0.18);
        SFX.beacon();
      }
    } else {
      b.prog = Math.max(0, b.prog - dt * 0.5);
    }
  }
  if (!G.doorOpen && litCount === W.beacons.length) {
    G.doorOpen = true;
    addFloat(W.door.x, W.door.y - 60, 'L\'arche s\'éveille', COL.warm, 20);
    addParticles(W.door.x, W.door.y, 40, COL.warm, 90, 1.4, 3);
    G.flash = Math.max(G.flash, 0.22);
    SFX.door();
  }

  /* --- Pièges lumineux --- */
  for (let i = 0; i < W.traps.length; i++) {
    const tp = W.traps[i];
    if (tp.cd > 0) { tp.cd -= dt; continue; }
    if (dist2(nim.x, nim.y, tp.x, tp.y) < CFG.TRAP_RANGE * CFG.TRAP_RANGE) {
      tp.cd = CFG.TRAP_COOLDOWN;
      for (let k = 0; k < 2; k++) {
        if (G.shadows.length >= W.params.maxShadows + 4) break;
        const a = Math.random() * TAU;
        G.shadows.push(makeShadow(tp.x + Math.cos(a) * 26, tp.y + Math.sin(a) * 26, 'hunter', W.rng));
      }
      addParticles(tp.x, tp.y, 20, COL.trap, 110, 0.8, 2.4);
      addFloat(tp.x, tp.y - 24, 'piège !', '#9ec7ff', 16);
      SFX.deny();
    }
  }

  /* --- Apparition d'ombres --- */
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0) {
    G.spawnTimer = W.params.spawnInterval * (0.75 + Math.random() * 0.5);
    spawnShadow(false);
  }

  /* --- Ombres --- */
  updateShadows(dt);
  if (G.state !== 'playing') return;   // mort pendant la mise à jour : on n'enchaîne pas

  /* --- Éclats --- */
  for (let i = G.bursts.length - 1; i >= 0; i--) {
    const b = G.bursts[i];
    b.t += dt;
    b.r = CFG.BURST_RADIUS * smoothstep(0, 1, b.t / b.dur);
    if (b.t >= b.dur) G.bursts.splice(i, 1);
  }

  /* --- Particules et textes flottants --- */
  updateEphemera(dt);

  if (G.hintT > 0) G.hintT -= dt;

  /* --- Caméra + secousse --- */
  const camTX = clamp(ilo.x - VW / 2, 0, Math.max(0, W.w - VW));
  const camTY = clamp(ilo.y - VH / 2, 0, Math.max(0, W.h - VH));
  G.cam.x = approach(G.cam.x, camTX, 6.5, dt);
  G.cam.y = approach(G.cam.y, camTY, 6.5, dt);
  if (W.w < VW) G.cam.x = (W.w - VW) / 2;
  if (W.h < VH) G.cam.y = (W.h - VH) / 2;
  G.shake = Math.max(0, G.shake - dt * 34);
  G.flash = Math.max(0, G.flash - dt * 2.4);

  /* --- Bourdonnement de Nim --- */
  setHum(0.012 + 0.02 * (G.light / CFG.LIGHT_MAX));

  /* --- Fin de nuit --- */
  if (G.doorOpen && dist2(ilo.x, ilo.y, W.door.x, W.door.y) < CFG.DOOR_REACH * CFG.DOOR_REACH) {
    finishNight();
  }
}

function updateShadows(dt) {
  const W = G.world;
  const ilo = G.ilo;
  const list = G.shadows;

  for (let i = list.length - 1; i >= 0; i--) {
    const s = list[i];
    s.phase += dt * (1.4 + s.wob);
    const amt = lightAmount(s.x, s.y);
    const inLight = amt > 0.15;

    // Brûlure : ~1.2 s au cœur du halo
    if (inLight) {
      s.hp -= dt * (0.55 + amt * 0.95) / CFG.SHADOW_BURN_TIME;
      if (s.hp <= 0) {
        addParticles(s.x, s.y, 16, '#7d8ba6', 110, 0.7, 2.4);
        addScore(CFG.SCORE_SHADOW);
        G.shadowPts += CFG.SCORE_SHADOW;
        addFloat(s.x, s.y - 14, '+' + CFG.SCORE_SHADOW, '#b9c6df', 15);
        SFX.puff();
        list.splice(i, 1);
        continue;
      }
    }

    // Cible
    let tx, ty;
    if (s.type === 'watcher') {
      let b = s.target;
      if (!b || b.lit) {
        b = null;
        for (let k = 0; k < W.beacons.length; k++) if (!W.beacons[k].lit) { b = W.beacons[k]; break; }
        s.target = b;
      }
      if (b) {
        s.orbit += dt * 0.85 * s.orbitDir;
        tx = b.x + Math.cos(s.orbit) * 72;
        ty = b.y + Math.sin(s.orbit) * 72;
      } else {
        s.type = 'hunter'; // plus rien à garder : elles chassent
        tx = ilo.x; ty = ilo.y;
      }
    } else {
      tx = ilo.x; ty = ilo.y;
    }

    let ax = tx - s.x, ay = ty - s.y;
    const ad = Math.hypot(ax, ay) || 1;
    ax /= ad; ay /= ad;

    // Hésitation au bord de la lumière : léger recul + dérive latérale
    if (amt > 0.02 && amt < 0.32) {
      const e = 9;
      const gx = lightAmount(s.x + e, s.y) - lightAmount(s.x - e, s.y);
      const gy = lightAmount(s.x, s.y + e) - lightAmount(s.x, s.y - e);
      const gl = Math.hypot(gx, gy) || 1;
      const push = 0.9 * (1 - amt / 0.32);
      ax -= (gx / gl) * push;
      ay -= (gy / gl) * push;
      ax += -(ay) * 0.35 * Math.sin(s.phase * 1.7);
      ay += (ax) * 0.35 * Math.sin(s.phase * 1.7);
      s.hesitate = approach(s.hesitate, 1, 8, dt);
    } else {
      s.hesitate = approach(s.hesitate, 0, 5, dt);
    }
    const al = Math.hypot(ax, ay) || 1;
    ax /= al; ay /= al;

    const base = inLight ? CFG.SHADOW_SPEED_LIGHT : CFG.SHADOW_SPEED_DARK * W.params.speedMul;
    const speed = base * (1 - 0.45 * s.hesitate);
    const wob = Math.sin(s.phase * 0.8 + s.orbit) * 0.22;
    const cs = Math.cos(wob), sn = Math.sin(wob);
    const dirx = ax * cs - ay * sn, diry = ax * sn + ay * cs;

    s.vx = approach(s.vx, dirx * speed, 6, dt);
    s.vy = approach(s.vy, diry * speed, 6, dt);
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.x = clamp(s.x, 8, W.w - 8);
    s.y = clamp(s.y, 8, W.h - 8);

    // Séparation légère, pour rester lisible
    for (let j = i - 1; j >= 0; j--) {
      const o = list[j];
      const dd2 = dist2(s.x, s.y, o.x, o.y);
      const minD = s.r + o.r;
      if (dd2 < minD * minD && dd2 > 0.001) {
        const d = Math.sqrt(dd2);
        const push = (minD - d) * 0.5;
        const nx = (s.x - o.x) / d, ny = (s.y - o.y) / d;
        s.x += nx * push; s.y += ny * push;
        o.x -= nx * push; o.y -= ny * push;
      }
    }

    // Contact avec Ilo
    if (ilo.iframes <= 0) {
      const hitR = ilo.r + s.r * 0.6;
      if (dist2(s.x, s.y, ilo.x, ilo.y) < hitR * hitR) {
        hurtIlo(s);
        if (G.state !== 'playing') return;
      }
    }
  }
}

function updateEphemera(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    const k = Math.exp(-p.drag * dt);
    p.vx *= k; p.vy *= k;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i];
    f.life -= dt;
    f.y -= dt * 26;
    if (f.life <= 0) G.floats.splice(i, 1);
  }
}

function addScore(n) {
  G.nightPoints += n;
  G.score = G.scoreAtNightStart + G.nightPoints;
}

function doBurst() {
  if (G.burstCd > 0) return;   // rechargement (et petite garde au tout début de la nuit)
  if (G.light < CFG.BURST_COST) {
    SFX.deny();
    G.lightWarn = 0.5;
    return;
  }
  G.light -= CFG.BURST_COST;
  G.burstCd = CFG.BURST_COOLDOWN;
  G.bursts.push({ x: G.nim.x, y: G.nim.y, r: 0, t: 0, dur: 0.38 });
  G.flash = Math.max(G.flash, 0.28);
  G.shake = Math.max(G.shake, 4);
  addParticles(G.nim.x, G.nim.y, 22, COL.warmSoft, 210, 0.5, 2.2);
  SFX.burst();

  for (const s of G.shadows) {
    const d = dist(s.x, s.y, G.nim.x, G.nim.y);
    if (d < CFG.BURST_RADIUS) {
      const f = 1 - d / CFG.BURST_RADIUS;
      const nx = d > 0.01 ? (s.x - G.nim.x) / d : 1;
      const ny = d > 0.01 ? (s.y - G.nim.y) / d : 0;
      s.vx += nx * 460 * f;
      s.vy += ny * 460 * f;
      s.hp -= CFG.BURST_DAMAGE * f;
      s.hesitate = 1;
    }
  }
  // Dissipation immédiate de celles achevées par l'onde
  for (let i = G.shadows.length - 1; i >= 0; i--) {
    if (G.shadows[i].hp <= 0) {
      const s = G.shadows[i];
      addParticles(s.x, s.y, 16, '#7d8ba6', 120, 0.7, 2.4);
      addScore(CFG.SCORE_SHADOW);
      G.shadowPts += CFG.SCORE_SHADOW;
      addFloat(s.x, s.y - 14, '+' + CFG.SCORE_SHADOW, '#b9c6df', 15);
      SFX.puff();
      G.shadows.splice(i, 1);
    }
  }
}

function hurtIlo(s) {
  const ilo = G.ilo;
  G.hearts -= 1;
  G.tookDamage = true;
  ilo.iframes = CFG.IFRAMES;
  const d = dist(ilo.x, ilo.y, s.x, s.y) || 1;
  const nx = (ilo.x - s.x) / d, ny = (ilo.y - s.y) / d;
  ilo.vx = nx * 300; ilo.vy = ny * 300;
  s.vx = -nx * 220; s.vy = -ny * 220;
  G.shake = Math.max(G.shake, 15);
  addParticles(ilo.x, ilo.y, 18, '#6b5570', 150, 0.6, 2.4);
  SFX.hurt();
  if (G.hearts <= 0) gameOver();
}

function finishNight() {
  const W = G.world;
  const timeBonus = G.nightTime < CFG.TIME_BONUS_LIMIT ? CFG.SCORE_TIME_BONUS : 0;
  const nightBonus = CFG.SCORE_NIGHT * G.night;
  const beaconPts = G.beaconPts;
  const shadowPts = G.shadowPts;
  let total = G.nightPoints + nightBonus + timeBonus;
  const mult = G.tookDamage ? 1 : CFG.NO_DAMAGE_MULT;
  total = Math.round(total * mult);
  G.score = G.scoreAtNightStart + total;

  G.lastResult = {
    night: G.night,
    time: G.nightTime,
    beacons: beaconPts,
    shadows: shadowPts,
    nightBonus, timeBonus, mult, total,
    score: G.score
  };

  save.bestNight = Math.max(save.bestNight, G.night);
  save.unlockedNight = Math.max(save.unlockedNight, G.night + 1);
  save.bestScore = Math.max(save.bestScore, G.score);
  writeSave();

  SFX.chime();
  setHum(0);
  const st = veilleStory(G.night);
  beginStory('nightAfter', nightHeading(G.night), st.after, '');
}

function gameOver() {
  setHum(0);
  save.bestScore = Math.max(save.bestScore, G.score);
  save.bestNight = Math.max(save.bestNight, Math.max(0, G.night - 1));
  writeSave();
  G.gameOverLine = pick(Math.random, STORY && STORY.gameOver, 'La nuit t\'a pris.');
  G.state = 'gameOver';
  G.paused = false;
  G.uiT = 0;
}

/* ============================================================
   ÉCRANS NARRATIFS (machine à écrire)
   ============================================================ */
function beginStory(state, heading, paragraphs, hint) {
  const text = sArr(paragraphs, ['…']).join('\n\n');
  G.story = { heading: heading || '', text, shown: 0, done: false, hint: hint || '', speed: 46 };
  G.state = state;
  G.paused = false;
  G.uiT = 0;
}

function advanceStory() {
  if (!G.story) return;
  if (!G.story.done) { G.story.shown = G.story.text.length; G.story.done = true; return; }
  SFX.ui();
  const s = G.state;
  if (s === 'intro') {
    const st = nightStory(1);
    beginStory('nightBefore', nightHeading(1), st.before, st.hint);
  } else if (s === 'nightBefore') {
    startNight(G.night);
  } else if (s === 'nightAfter') {
    const ep = sArr(STORY && STORY.epilogue, []);
    if (G.night === CFG.STORY_NIGHTS && ep.length) {
      beginStory('epilogue', 'Aube', ep, '');
    } else {
      goToNightBefore(G.night + 1);
    }
  } else if (s === 'epilogue') {
    goToNightBefore(G.night + 1);
  }
}

/* Le titre narratif contient parfois déjà « Nuit … » : on ne le redouble pas. */
function nightHeading(n) {
  const t = nightStory(n).title;
  if (/^\s*nuit/i.test(t)) return t;
  if (n > CFG.STORY_NIGHTS) return t + ' — Nuit ' + n;
  return 'Nuit ' + n + ' — ' + t;
}

/* Après la nuit 7 les textes de la veille ne se répètent pas à l'identique. */
const VEILLE_BEFORE = [
  ['Une forêt de plus, un village de plus qui attend son matin. Ilo connaît le chemin, maintenant.'],
  ['La lanterne est chaude contre la hanche. Nim s\'étire, puis s\'allume sans qu\'on le lui demande.'],
  ['Personne ne sait qu\'Ilo passe ici cette nuit. C\'est très bien ainsi.'],
  ['Plus loin que la forêt, il y a encore de la forêt. Ilo n\'en fait pas une histoire : on marche.']
];
const VEILLE_AFTER = [
  ['Les pierres tiennent. Ilo souffle une fois, puis regarde déjà l\'horizon suivant.'],
  ['Nim se pose sur l\'anneau de la lanterne. Repos court. La nuit suivante attend.'],
  ['Quelque part, quelqu\'un se réveillera dans une lumière qu\'il ne s\'expliquera pas.']
];

function veilleStory(n) {
  const st = nightStory(n);
  if (n <= CFG.STORY_NIGHTS + 1) return st;   // l'entrée en Veille éternelle garde son texte
  const i = n - CFG.STORY_NIGHTS - 2;
  return {
    title: st.title,
    before: VEILLE_BEFORE[i % VEILLE_BEFORE.length],
    after: VEILLE_AFTER[i % VEILLE_AFTER.length],
    hint: ''
  };
}

function goToNightBefore(n) {
  G.night = n;
  const st = veilleStory(n);
  beginStory('nightBefore', nightHeading(n), st.before, st.hint);
}

/* ============================================================
   MENUS ET NAVIGATION
   ============================================================ */
function buildMenu() {
  const items = [{ id: 'new', label: 'Nouvelle nuit' }];
  if (save.unlockedNight > 1) items.push({ id: 'continue', label: 'Continuer la nuit ' + save.unlockedNight });
  items.push({ id: 'help', label: 'Comment jouer' });
  G.menuItems = items;
  G.menuIndex = clamp(G.menuIndex, 0, items.length - 1);
}

function activateMenu() {
  const it = G.menuItems[G.menuIndex];
  if (!it) return;
  SFX.ui();
  if (it.id === 'new') {
    startRun(1);
    const intro = sArr(STORY && STORY.intro, []);
    if (intro.length) beginStory('intro', sStr(STORY && STORY.title, 'Luciole'), intro, '');
    else { const st = nightStory(1); beginStory('nightBefore', nightHeading(1), st.before, st.hint); }
  } else if (it.id === 'continue') {
    startRun(save.unlockedNight);
    goToNightBefore(save.unlockedNight);
  } else if (it.id === 'help') {
    G.state = 'help';
    G.uiT = 0;
  }
}

function togglePause(force) {
  if (G.state !== 'playing') return;
  const v = (typeof force === 'boolean') ? force : !G.paused;
  if (v === G.paused) return;
  G.paused = v;
  if (G.paused) setHum(0);
  SFX.ui();
}

function toTitle() {
  G.state = 'title';
  G.paused = false;
  setHum(0);
  buildMenu();
}

function onKeyPress(code) {
  const s = G.state;
  if (code === 'KeyM') {
    save.muted = !save.muted;
    writeSave();
    audioMuteApply();
    return;
  }
  if (s === 'title') {
    if (code === 'ArrowUp' || code === 'KeyW' || code === 'KeyZ') { G.menuIndex = (G.menuIndex + G.menuItems.length - 1) % G.menuItems.length; SFX.ui(); }
    else if (code === 'ArrowDown' || code === 'KeyS') { G.menuIndex = (G.menuIndex + 1) % G.menuItems.length; SFX.ui(); }
    else if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') activateMenu();
    return;
  }
  if (s === 'help') {
    if (code === 'Escape' || code === 'Enter' || code === 'NumpadEnter' || code === 'Space') { SFX.ui(); toTitle(); }
    return;
  }
  if (s === 'intro' || s === 'nightBefore' || s === 'nightAfter' || s === 'epilogue') {
    if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') advanceStory();
    else if (code === 'Escape') toTitle();
    return;
  }
  if (s === 'playing') {
    if (code === 'Escape' || code === 'KeyP') { togglePause(); return; }
    if (G.paused) {
      if (code === 'KeyT') { toTitle(); }
      return;
    }
    if (code === 'Space') input.burstQueued = true;
    return;
  }
  if (s === 'gameOver') {
    if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') {
      SFX.ui();
      startRun(1);
      goToNightBefore(1);
    } else if (code === 'Escape') toTitle();
  }
}

function onPointerDown() {
  const s = G.state;
  if (s === 'title') {
    for (let i = 0; i < G.menuHit.length; i++) {
      const h = G.menuHit[i];
      if (input.mx >= h.x && input.mx <= h.x + h.w && input.my >= h.y && input.my <= h.y + h.h) {
        G.menuIndex = i;
        activateMenu();
        return;
      }
    }
    return;
  }
  if (s === 'help') { SFX.ui(); toTitle(); return; }
  if (s === 'intro' || s === 'nightBefore' || s === 'nightAfter' || s === 'epilogue') { advanceStory(); return; }
  if (s === 'playing') {
    if (G.paused) { togglePause(false); return; }   // le clic qui reprend ne déclenche pas d'éclat
    input.burstQueued = true;
    return;
  }
  if (s === 'gameOver') { SFX.ui(); startRun(1); goToNightBefore(1); }
}

/* ============================================================
   RENDU — monde
   ============================================================ */
let camX = 0, camY = 0;

function sx(x) { return x - camX; }
function sy(y) { return y - camY; }

function drawWorld() {
  const W = G.world;
  const m = 90;
  const x0 = camX - m, x1 = camX + VW + m, y0 = camY - m, y1 = camY + VH + m;

  // Sol : texture pré-rendue de la nuit, recadrée par la caméra
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, VW, VH);
  if (groundCanvas) ctx.drawImage(groundCanvas, Math.round(sx(0)), Math.round(sy(0)));

  // Limites du monde : bordure d'obscurité plus dense
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.lineWidth = 26;
  ctx.strokeRect(sx(0) - 13, sy(0) - 13, W.w + 26, W.h + 26);
  ctx.restore();

  // Poussières lumineuses (ambiance)
  ctx.save();
  ctx.fillStyle = 'rgba(150,170,210,0.5)';
  for (let i = 0; i < W.motes.length; i++) {
    const mo = W.motes[i];
    const mx = mo.x + Math.cos(G.time * 0.3 + mo.p) * 16;
    const my = mo.y + Math.sin(G.time * 0.24 + mo.p * 1.7) * 14;
    if (mx < x0 || mx > x1 || my < y0 || my > y1) continue;
    ctx.globalAlpha = 0.12 + 0.1 * Math.sin(G.time * 1.2 + mo.p);
    ctx.beginPath(); ctx.arc(sx(mx), sy(my), mo.s, 0, TAU); ctx.fill();
  }
  ctx.restore();

  drawBeacons(x0, x1, y0, y1);
  drawDoor();
  drawTrees(x0, x1, y0, y1);
  drawIlo();
  G.cull = { x0, x1, y0, y1 };
}

function drawTrees(x0, x1, y0, y1) {
  const W = G.world;
  const nimX = G.nim.x, nimY = G.nim.y;
  for (let i = 0; i < W.trees.length; i++) {
    const t = W.trees[i];
    if (t.x < x0 || t.x > x1 || t.y < y0 || t.y > y1) continue;   // seuls les arbres à l'écran
    const X = sx(t.x), Y = sy(t.y);
    const r = t.r;

    // Direction de la lumière : de Nim vers l'arbre (l'ombre part de l'autre côté)
    let lx = t.x - nimX, ly = t.y - nimY;
    const ld = Math.hypot(lx, ly) || 1;
    lx /= ld; ly /= ld;
    // Force d'éclairage : plein dans le halo, atténué au loin
    const amt = clamp(lightAmount(t.x, t.y) * 1.5, 0, 1);

    // 1. Ombre portée, opposée à Nim, allongée quand la lumière est rasante
    const so = r * (0.3 + 0.5 * amt);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.26 + 0.24 * amt) + ')';
    ctx.beginPath();
    ctx.ellipse(X + lx * so, Y + r * 0.32 + ly * so * 0.5, r * (0.95 + 0.22 * amt), r * 0.44, Math.atan2(ly, lx), 0, TAU);
    ctx.fill();

    // 2. Tronc brun sombre, légèrement penché
    const tl = t.lean * r;
    ctx.fillStyle = COL.trunk;
    ctx.beginPath();
    ctx.moveTo(X - r * 0.34, Y + r * 0.32);
    ctx.lineTo(X - r * 0.19 + tl, Y - r * 0.95);
    ctx.lineTo(X + r * 0.19 + tl, Y - r * 0.95);
    ctx.lineTo(X + r * 0.34, Y + r * 0.32);
    ctx.closePath();
    ctx.fill();
    // Bord éclairé du tronc, côté Nim
    if (amt > 0.02) {
      const sgn = lx > 0 ? -1 : 1;      // le côté tourné vers Nim
      ctx.globalAlpha = 0.30 + 0.5 * amt;
      ctx.fillStyle = COL.trunkLit;
      ctx.beginPath();
      ctx.moveTo(X + sgn * r * 0.34, Y + r * 0.32);
      ctx.lineTo(X + sgn * r * 0.19 + tl, Y - r * 0.95);
      ctx.lineTo(X + sgn * r * 0.07 + tl, Y - r * 0.95);
      ctx.lineTo(X + sgn * r * 0.18, Y + r * 0.32);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 3. Couronne : 2-3 disques décalés, base sombre puis croissant chaud côté Nim
    const cy0 = -r * 0.75;
    for (let k = 0; k < t.crowns.length; k++) {
      const c = t.crowns[k];
      const cx = X + c.dx + tl, cyy = Y + c.dy + cy0;
      ctx.fillStyle = c.c;
      ctx.beginPath(); ctx.arc(cx, cyy, c.r, 0, TAU); ctx.fill();
      // creux sombre du côté opposé à la lumière
      ctx.globalAlpha = 0.32;
      ctx.fillStyle = '#0a1410';
      ctx.beginPath(); ctx.arc(cx + lx * c.r * 0.34, cyy + ly * c.r * 0.34, c.r * 0.7, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      if (amt > 0.02) {
        ctx.globalAlpha = 0.10 + 0.34 * amt;
        ctx.fillStyle = COL.crownLit;
        ctx.beginPath(); ctx.arc(cx - lx * c.r * 0.3, cyy - ly * c.r * 0.3, c.r * 0.6, 0, TAU); ctx.fill();
        // fine crête chaude sur le tout premier feuillage touché
        ctx.globalAlpha = 0.16 * amt;
        ctx.fillStyle = '#d8b878';
        ctx.beginPath(); ctx.arc(cx - lx * c.r * 0.52, cyy - ly * c.r * 0.52, c.r * 0.3, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
}

function drawBeacons(x0, x1, y0, y1) {
  const W = G.world;
  for (let i = 0; i < W.beacons.length; i++) {
    const b = W.beacons[i];
    if (b.x < x0 || b.x > x1 || b.y < y0 || b.y > y1) continue;
    const X = sx(b.x), Y = sy(b.y);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.ellipse(X, Y + 12, 26, 10, 0, 0, TAU); ctx.fill();
    // Socle
    ctx.fillStyle = b.lit ? '#4a3b33' : COL.stone;
    ctx.beginPath();
    ctx.moveTo(X - 17, Y + 12);
    ctx.lineTo(X - 11, Y - 22);
    ctx.lineTo(X + 11, Y - 22);
    ctx.lineTo(X + 17, Y + 12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = b.lit ? '#7d5f4a' : '#585a6b';
    ctx.fillRect(X - 13, Y - 26, 26, 6);
    // Rune
    const pulse = 0.5 + 0.5 * Math.sin(G.time * 2 + b.phase);
    ctx.fillStyle = b.lit ? COL.stoneLit : 'rgba(160,182,222,' + (0.28 + 0.22 * pulse) + ')';
    ctx.beginPath(); ctx.arc(X, Y - 6, 5, 0, TAU); ctx.fill();
    // entaille gravée, pour qu'on reconnaisse une pierre et pas un caillou
    ctx.strokeStyle = b.lit ? 'rgba(255,207,141,0.6)' : 'rgba(150,168,205,0.28)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(X - 6, Y + 4); ctx.lineTo(X + 6, Y + 4);
    ctx.moveTo(X, Y + 4); ctx.lineTo(X, Y + 9); ctx.stroke();
    // Flamme : elle danse, c'est la récompense visuelle de la pierre allumée
    if (b.lit) {
      const f = Math.sin(G.time * 7 + b.phase) * 0.5 + Math.sin(G.time * 11.3 + b.phase * 2) * 0.5;
      const fh = 15 + f * 3.5;
      const fx = X + f * 1.6, fy = Y - 28;
      ctx.fillStyle = 'rgba(255,146,54,0.85)';
      ctx.beginPath();
      ctx.moveTo(fx, fy - fh);
      ctx.quadraticCurveTo(fx + 6.5, fy - fh * 0.35, fx, fy);
      ctx.quadraticCurveTo(fx - 6.5, fy - fh * 0.35, fx, fy - fh);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,238,196,0.95)';
      ctx.beginPath();
      ctx.moveTo(fx, fy - fh * 0.62);
      ctx.quadraticCurveTo(fx + 3, fy - fh * 0.2, fx, fy - 1);
      ctx.quadraticCurveTo(fx - 3, fy - fh * 0.2, fx, fy - fh * 0.62);
      ctx.fill();
    }
  }
}

function drawDoor() {
  const W = G.world;
  const X = sx(W.door.x), Y = sy(W.door.y);
  if (X < -140 || X > VW + 140 || Y < -160 || Y > VH + 160) return;
  const open = G.doorOpen;
  ctx.save();
  ctx.strokeStyle = open ? '#8a6a44' : '#20212c';
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(X - 34, Y + 16);
  ctx.lineTo(X - 34, Y - 30);
  ctx.quadraticCurveTo(X, Y - 66, X + 34, Y - 30);
  ctx.lineTo(X + 34, Y + 16);
  ctx.stroke();
  if (open) {
    const p = 0.5 + 0.5 * Math.sin(G.time * 2.2);
    ctx.globalAlpha = 0.25 + 0.2 * p;
    ctx.fillStyle = COL.warm;
    ctx.beginPath();
    ctx.moveTo(X - 28, Y + 16);
    ctx.lineTo(X - 28, Y - 28);
    ctx.quadraticCurveTo(X, Y - 58, X + 28, Y - 28);
    ctx.lineTo(X + 28, Y + 16);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawShadowBodies(x0, x1, y0, y1) {
  for (let i = 0; i < G.shadows.length; i++) {
    const s = G.shadows[i];
    if (s.x < x0 || s.x > x1 || s.y < y0 || s.y > y1) continue;
    const amt = lightAmount(s.x, s.y);
    const vis = clamp((amt - 0.04) * 2.4, 0, 1);   // hors lumière : rien du tout
    if (vis < 0.02) continue;
    const X = sx(s.x), Y = sy(s.y);
    const r = s.r;
    ctx.save();

    // Voile de fumée qui déborde : rend la silhouette menaçante et floue
    ctx.globalAlpha = 0.5 * vis;
    const hg = ctx.createRadialGradient(X, Y, r * 0.4, X, Y, r * 2.1);
    hg.addColorStop(0, 'rgba(3,3,7,0.95)');
    hg.addColorStop(1, 'rgba(3,3,7,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(X, Y, r * 2.1, 0, TAU); ctx.fill();

    // Corps : lobes qui roulent les uns sur les autres
    ctx.globalAlpha = vis;
    for (let k = 0; k < 5; k++) {
      const a = s.phase * (k % 2 ? -0.7 : 0.9) + k * (TAU / 5);
      const off = r * (0.20 + 0.22 * Math.sin(s.phase * 1.3 + k * 2.1));
      const rr = r * (0.66 + 0.32 * Math.sin(s.phase * 1.9 + k));
      ctx.fillStyle = k === 0 ? '#0b0c14' : COL.shadow;
      ctx.beginPath();
      ctx.arc(X + Math.cos(a) * off, Y + Math.sin(a) * off, rr, 0, TAU);
      ctx.fill();
    }
    // Volutes qui s'échappent vers le haut
    ctx.globalAlpha = 0.4 * vis;
    ctx.fillStyle = '#0d0e18';
    for (let k = 0; k < 3; k++) {
      const a = s.phase * 0.9 + k * 2.3;
      const rise = (((s.phase * 0.5 + k * 0.33) % 1) + 1) % 1;
      ctx.beginPath();
      ctx.arc(X + Math.cos(a) * r * 0.6, Y - r * (0.5 + rise * 1.5), r * 0.3 * (1 - rise), 0, TAU);
      ctx.fill();
    }

    // Liseré violacé : elle brûle
    if (amt > 0.18) {
      const burn = clamp((amt - 0.18) * 2, 0, 1) * (1 - s.hp * 0.45);
      ctx.globalAlpha = 0.55 * vis * burn;
      ctx.strokeStyle = '#8a5ea0';
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(X, Y, r * 1.02, 0, TAU); ctx.stroke();
      // braises qui se détachent du bord
      ctx.globalAlpha = 0.5 * vis * burn;
      ctx.fillStyle = '#c79ad6';
      for (let k = 0; k < 3; k++) {
        const a = s.phase * 2 + k * 2.1;
        ctx.beginPath(); ctx.arc(X + Math.cos(a) * r * 1.15, Y + Math.sin(a) * r * 1.15, 1.3, 0, TAU); ctx.fill();
      }
    }
    // Veilleuse : anneau froid, on comprend qu'elle garde quelque chose
    if (s.type === 'watcher') {
      ctx.globalAlpha = 0.4 * vis;
      ctx.strokeStyle = '#4c6a8e';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.arc(X, Y, r * 1.35, s.phase, s.phase + 5); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
}

function drawIlo() {
  const ilo = G.ilo;
  const X = sx(ilo.x), Y = sy(ilo.y);
  const bob = Math.sin(ilo.walk * 6) * 1.8;
  const blink = ilo.iframes > 0 && (Math.floor(G.time * 14) % 2 === 0);

  // Direction de Nim : sert au bord éclairé et à l'ombre portée
  let lx = ilo.x - G.nim.x, ly = ilo.y - G.nim.y;
  const ld = Math.hypot(lx, ly) || 1;
  lx /= ld; ly /= ld;
  const amt = clamp(lightAmount(ilo.x, ilo.y) * 1.6, 0, 1);

  ctx.save();
  if (blink) ctx.globalAlpha = 0.4;

  // Ombre au sol, projetée à l'opposé de Nim
  const so = 5 + 9 * amt;
  ctx.fillStyle = 'rgba(0,0,0,' + (0.42 + 0.3 * amt) + ')';
  ctx.beginPath();
  ctx.ellipse(X + lx * so * 0.8, Y + 10 + ly * so * 0.45, 12 + 5 * amt, 5, Math.atan2(ly, lx), 0, TAU);
  ctx.fill();

  const bodyPath = () => {
    ctx.beginPath();
    ctx.moveTo(X - 8, Y + 10);
    ctx.quadraticCurveTo(X - 9.5, Y - 6 + bob, X, Y - 10 + bob);
    ctx.quadraticCurveTo(X + 9.5, Y - 6 + bob, X + 8, Y + 10);
    ctx.closePath();
  };

  // Contour clair : c'est lui qui détache Ilo du sol, même dans la pénombre
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,231,196,' + (0.62 + 0.32 * amt) + ')';
  ctx.lineWidth = 2.4;
  bodyPath(); ctx.stroke();
  ctx.beginPath(); ctx.arc(X, Y - 11 + bob, 7.6, Math.PI * 0.86, Math.PI * 2.14); ctx.stroke();

  // Corps + capuche
  ctx.fillStyle = COL.ilo;
  bodyPath(); ctx.fill();
  ctx.fillStyle = COL.iloHood;
  ctx.beginPath();
  ctx.arc(X, Y - 11 + bob, 7.2, Math.PI * 0.9, Math.PI * 2.1);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(X - 7, Y - 10 + bob);
  ctx.quadraticCurveTo(X + ilo.face * 2, Y - 22 + bob, X + ilo.face * 7, Y - 9 + bob);
  ctx.closePath(); ctx.fill();

  // Bord éclairé du côté de Nim
  ctx.globalAlpha = (blink ? 0.4 : 1) * (0.35 + 0.55 * amt);
  ctx.strokeStyle = COL.iloRim;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  const ea = Math.atan2(-ly, -lx);
  ctx.arc(X, Y - 1 + bob * 0.6, 9.4, ea - 0.85, ea + 0.85);
  ctx.stroke();
  ctx.globalAlpha = blink ? 0.4 : 1;

  // Visage à peine suggéré
  ctx.fillStyle = 'rgba(240,228,206,0.62)';
  ctx.beginPath(); ctx.ellipse(X + ilo.face * 2.2, Y - 10 + bob, 2.7, 3.2, 0, 0, TAU); ctx.fill();

  // Lanterne éteinte : cerclage clair + verre qui attrape le reflet de Nim
  const lx2 = X - ilo.face * 9, ly2 = Y + 2 + bob * 0.5;
  ctx.strokeStyle = 'rgba(214,196,168,0.75)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(lx2, ly2 - 5.5); ctx.lineTo(lx2, ly2 - 8.5); ctx.stroke();
  ctx.fillStyle = '#2e2836';
  ctx.beginPath(); ctx.rect(lx2 - 3.4, ly2 - 5.5, 6.8, 7.4); ctx.fill();
  ctx.strokeStyle = 'rgba(206,188,160,0.8)'; ctx.lineWidth = 1;
  ctx.strokeRect(lx2 - 3.4, ly2 - 5.5, 6.8, 7.4);
  // reflet : la lueur de Nim posée sur le verre, jamais une flamme
  ctx.globalAlpha = (blink ? 0.4 : 1) * (0.3 + 0.6 * amt);
  ctx.fillStyle = COL.warmSoft;
  ctx.beginPath(); ctx.ellipse(lx2 - ilo.face * 1.1, ly2 - 2.6, 1.5, 2.2, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ============================================================
   RENDU — masque d'obscurité et lumières
   ============================================================ */
function hole(x, y, r, strength) {
  if (r <= 1) return;
  if (x + r < 0 || x - r > VW || y + r < 0 || y - r > VH) return;
  const g = mctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(0,0,0,' + strength + ')');
  g.addColorStop(0.5, 'rgba(0,0,0,' + (strength * 0.92) + ')');
  g.addColorStop(0.78, 'rgba(0,0,0,' + (strength * 0.5) + ')');
  g.addColorStop(0.93, 'rgba(0,0,0,' + (strength * 0.14) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  mctx.fillStyle = g;
  mctx.beginPath(); mctx.arc(x, y, r, 0, TAU); mctx.fill();
}

function drawDarkness() {
  const W = G.world;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.globalCompositeOperation = 'source-over';
  mctx.clearRect(0, 0, VW, VH);
  mctx.globalAlpha = CFG.DARKNESS;
  mctx.fillStyle = '#000';
  mctx.fillRect(0, 0, VW, VH);
  mctx.globalAlpha = 1;
  mctx.globalCompositeOperation = 'destination-out';

  // Halo de Nim
  const hr = haloRadius();
  const flick = 1 + 0.03 * Math.sin(G.time * 9.3) + (G.light < 20 ? 0.07 * Math.sin(G.time * 22) : 0);
  hole(sx(G.nim.x), sy(G.nim.y), hr * flick, 1);
  // Souvenir autour d'Ilo : de quoi ne jamais le perdre, sans jamais éclairer la route
  hole(sx(G.ilo.x), sy(G.ilo.y), 50, 0.8);
  // Balises allumées
  for (let i = 0; i < W.beacons.length; i++) {
    const b = W.beacons[i];
    if (!b.lit) continue;
    hole(sx(b.x), sy(b.y), CFG.BEACON_LIGHT_R * (1 + 0.02 * Math.sin(G.time * 3 + b.phase)), 0.98);
  }
  // Porte
  if (G.doorOpen) hole(sx(W.door.x), sy(W.door.y), CFG.DOOR_LIGHT_R * (1 + 0.03 * Math.sin(G.time * 2.2)), 1);
  // Pièges : la lueur bleue perce aussi le noir, c'est ce qui les rend tentants
  for (let i = 0; i < W.traps.length; i++) {
    const tp = W.traps[i];
    hole(sx(tp.x), sy(tp.y), 34 + 4 * Math.sin(G.time * 3 + tp.phase), tp.cd > 0 ? 0.3 : 0.72);
  }
  // Éclats
  for (let i = 0; i < G.bursts.length; i++) {
    const b = G.bursts[i];
    hole(sx(b.x), sy(b.y), b.r, 1 - b.t / b.dur);
  }

  mctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(maskCanvas, 0, 0, VW, VH);
}

function radialGlow(x, y, r, color, alpha) {
  if (x + r < 0 || x - r > VW || y + r < 0 || y - r > VH) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}

function drawLights() {
  const W = G.world;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  const hr = haloRadius();
  radialGlow(sx(G.nim.x), sy(G.nim.y), hr * 1.15, 'rgba(255,150,66,0.15)', 1);
  radialGlow(sx(G.nim.x), sy(G.nim.y), hr * 0.5, 'rgba(255,206,142,0.18)', 1);

  for (let i = 0; i < W.beacons.length; i++) {
    const b = W.beacons[i];
    if (b.lit) {
      radialGlow(sx(b.x), sy(b.y), CFG.BEACON_LIGHT_R * 1.1, 'rgba(255,176,92,0.22)', 1);
      radialGlow(sx(b.x), sy(b.y), 26, 'rgba(255,214,150,0.30)', 1);
      // liseré de la zone sûre : discret, mais on sait où finit l'abri
      ctx.globalAlpha = 0.10 + 0.04 * Math.sin(G.time * 1.7 + b.phase);
      ctx.strokeStyle = COL.warm; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(sx(b.x), sy(b.y), CFG.BEACON_LIGHT_R, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      // Souvenir de lueur : assez pour deviner la direction, jamais assez pour éclairer
      const pulse = 0.5 + 0.5 * Math.sin(G.time * 1.6 + b.phase);
      radialGlow(sx(b.x), sy(b.y), 54, 'rgba(150,180,220,0.20)', 0.30 + 0.20 * pulse);
      ctx.globalAlpha = 0.30 + 0.30 * pulse;
      ctx.fillStyle = '#a8c2e8';
      ctx.beginPath(); ctx.arc(sx(b.x), sy(b.y) - 6, 1.7, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  if (G.doorOpen) {
    radialGlow(sx(W.door.x), sy(W.door.y), CFG.DOOR_LIGHT_R * 1.15, 'rgba(255,190,110,0.30)', 1);
  }
  for (let i = 0; i < W.traps.length; i++) {
    const tp = W.traps[i];
    const a = tp.cd > 0 ? 0.25 : 0.7;
    radialGlow(sx(tp.x), sy(tp.y), 44, 'rgba(110,170,255,0.30)', a);
    ctx.globalAlpha = a;
    ctx.fillStyle = COL.trap;
    ctx.beginPath(); ctx.arc(sx(tp.x), sy(tp.y), 2.4 + Math.sin(G.time * 4 + tp.phase) * 0.7, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Éclats : anneau blanc en expansion
  for (let i = 0; i < G.bursts.length; i++) {
    const b = G.bursts[i];
    const k = 1 - b.t / b.dur;
    const BX = sx(b.x), BY = sy(b.y);
    const rg = ctx.createRadialGradient(BX, BY, Math.max(0, b.r - 26), BX, BY, b.r + 12);
    rg.addColorStop(0, 'rgba(255,150,60,0)');
    rg.addColorStop(0.7, 'rgba(255,190,110,' + (0.5 * k) + ')');
    rg.addColorStop(1, 'rgba(255,120,60,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(BX, BY, b.r + 12, 0, TAU); ctx.fill();
    ctx.globalAlpha = k;
    ctx.strokeStyle = 'rgba(255,244,220,1)';
    ctx.lineWidth = 2 + 5 * k;
    ctx.beginPath(); ctx.arc(BX, BY, b.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Yeux des Mornes : visibles de près même dans le noir
  for (let i = 0; i < G.shadows.length; i++) {
    const s = G.shadows[i];
    const X = sx(s.x), Y = sy(s.y);
    if (X < -40 || X > VW + 40 || Y < -40 || Y > VH + 40) continue;
    const amt = lightAmount(s.x, s.y);
    const d = dist(s.x, s.y, G.ilo.x, G.ilo.y);
    const near = 1 - clamp((d - 60) / 140, 0, 1);
    const a = Math.max(clamp(amt * 1.6, 0, 1) * 0.6, near * near * 0.58);
    if (a < 0.02) continue;
    const dirx = s.vx, diry = s.vy;
    const dl = Math.hypot(dirx, diry) || 1;
    const px = -diry / dl, py = dirx / dl;
    ctx.globalAlpha = a;
    ctx.fillStyle = COL.eye;
    const off = s.r * 0.3;
    ctx.beginPath(); ctx.arc(X + px * off + dirx / dl * 3, Y + py * off + diry / dl * 3, 1.7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(X - px * off + dirx / dl * 3, Y - py * off + diry / dl * 3, 1.7, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Fil Ilo <-> Nim
  drawTether();

  // Particules
  for (let i = 0; i < G.particles.length; i++) {
    const p = G.particles[i];
    const X = sx(p.x), Y = sy(p.y);
    if (X < -20 || X > VW + 20 || Y < -20 || Y > VH + 20) continue;
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.85;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(X, Y, p.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Nim
  const nx = sx(G.nim.x), ny = sy(G.nim.y);
  radialGlow(nx, ny, 22, 'rgba(255,246,214,0.8)', 1);
  ctx.fillStyle = COL.nim;
  ctx.beginPath(); ctx.arc(nx, ny, 3.1 + 0.5 * Math.sin(G.time * 12), 0, TAU); ctx.fill();

  // Rappel d'Ilo : petite auréole tiède, comme un souvenir de chaleur
  const ig = 0.30 + 0.05 * Math.sin(G.time * 2.1);
  radialGlow(sx(G.ilo.x), sy(G.ilo.y), 42, 'rgba(255,190,124,' + ig.toFixed(3) + ')', 1);
  radialGlow(sx(G.ilo.x), sy(G.ilo.y), 18, 'rgba(255,232,196,0.26)', 1);

  ctx.restore();
}

function drawTether() {
  const ilo = G.ilo, nim = G.nim;
  const t = G.tension || 0;
  const ax = sx(ilo.x), ay = sy(ilo.y - 4);
  const bx = sx(nim.x), by = sy(nim.y);
  const mx = (ax + bx) / 2, my = (ay + by) / 2 + (1 - t) * 18;
  const taut = t > 0.55;

  // Halo du fil : c'est ce qui le rend visible sur le sol clair du halo
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.07 + 0.16 * t;
  ctx.strokeStyle = taut ? COL.tetherTaut : COL.tether;
  ctx.lineWidth = 4 + t * 3;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();

  // Fil lui-même
  ctx.globalAlpha = 0.30 + 0.42 * t;
  ctx.lineWidth = 1.2 + t * 1.5;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();

  // Perles qui remontent le fil vers Nim : montre le sens et la tension
  const beads = 4;
  const flow = (G.time * (0.35 + t * 0.9)) % 1;
  ctx.fillStyle = taut ? '#ffd0b0' : COL.warmSoft;
  for (let i = 0; i < beads; i++) {
    const u = (flow + i / beads) % 1;
    const iu = 1 - u;
    const px = iu * iu * ax + 2 * iu * u * mx + u * u * bx;
    const py = iu * iu * ay + 2 * iu * u * my + u * u * by;
    ctx.globalAlpha = (0.18 + 0.42 * t) * Math.sin(u * Math.PI);
    ctx.beginPath(); ctx.arc(px, py, 1.1 + t * 0.9, 0, TAU); ctx.fill();
  }

  // Laisse au maximum : court arc devant Nim, comme une paroi qu'elle ne franchit pas
  if (t > 0.9) {
    const a0 = Math.atan2(by - ay, bx - ax);
    ctx.globalAlpha = 0.20 + 0.16 * Math.sin(G.time * 10);
    ctx.strokeStyle = COL.tetherTaut;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ax, ay, CFG.TETHER, a0 - 0.34, a0 + 0.34); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* Jauge d'allumage des balises + rappel de la portée de Nim.
   Dessinée après le masque : toujours parfaitement lisible. */
function drawBeaconUI() {
  const W = G.world, ilo = G.ilo, nim = G.nim;
  ctx.save();
  for (let i = 0; i < W.beacons.length; i++) {
    const b = W.beacons[i];
    if (b.lit) continue;
    const X = sx(b.x), Y = sy(b.y);
    if (X < -80 || X > VW + 80 || Y < -80 || Y > VH + 80) continue;
    const dIlo = dist(ilo.x, ilo.y, b.x, b.y);
    const onIt = dIlo < CFG.BEACON_STAND_RANGE;
    const near = dIlo < 130;
    if (!near && b.prog <= 0.001) continue;

    const cy = Y - 4;
    // Cercle où Ilo doit se tenir
    if (near) {
      ctx.globalAlpha = onIt ? 0.5 : 0.22;
      ctx.strokeStyle = onIt ? COL.warm : 'rgba(190,205,230,1)';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.arc(X, cy, CFG.BEACON_STAND_RANGE, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    if (!onIt && b.prog <= 0.001) continue;

    const nimNear = dist(nim.x, nim.y, b.x, b.y) < CFG.BEACON_NIM_RANGE;
    // Anneau de fond
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(X, cy, 30, 0, TAU); ctx.stroke();
    // Progression
    if (b.prog > 0.002) {
      ctx.strokeStyle = nimNear ? COL.warm : 'rgba(255,183,101,0.4)';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(X, cy, 30, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(b.prog, 0, 1));
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
    ctx.globalAlpha = 1;

    // Ilo est en place mais Nim est trop loin : on le dit clairement
    if (onIt && !nimNear) {
      ctx.globalAlpha = 0.30 + 0.16 * Math.sin(G.time * 5);
      ctx.strokeStyle = '#8fc0ff';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([6, 7]);
      ctx.beginPath(); ctx.arc(X, cy, CFG.BEACON_NIM_RANGE, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.85;
      ctx.font = font(14, '700');
      ctx.textAlign = 'center';
      shadowText('Approche Nim', X, cy - 44, 'center', '#a8cbff');
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

/* ============================================================
   RENDU — HUD
   ============================================================ */
function font(size, weight, serif) {
  const s = Math.max(14, Math.round(size * uiScale));
  return (weight ? weight + ' ' : '') + s + 'px ' + (serif ? 'Georgia, "Times New Roman", serif' : '"Segoe UI", Roboto, Helvetica, Arial, sans-serif');
}

function shadowText(text, x, y, align, color) {
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillText(text, x + 1, y + 2);
  ctx.fillStyle = color || COL.text;
  ctx.fillText(text, x, y);
}

function drawHeart(x, y, s, filled) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.32);
  ctx.bezierCurveTo(x, y - s * 0.12, x - s * 0.55, y - s * 0.12, x - s * 0.55, y + s * 0.16);
  ctx.bezierCurveTo(x - s * 0.55, y + s * 0.52, x, y + s * 0.72, x, y + s * 0.98);
  ctx.bezierCurveTo(x, y + s * 0.72, x + s * 0.55, y + s * 0.52, x + s * 0.55, y + s * 0.16);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 0.12, x, y - s * 0.12, x, y + s * 0.32);
  ctx.closePath();
  if (filled) { ctx.fillStyle = '#e2586b'; ctx.fill(); }
  else { ctx.strokeStyle = 'rgba(226,88,107,0.42)'; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawHUD() {
  const W = G.world;
  const pad = Math.round(20 * uiScale);
  const top = Math.round(18 * uiScale);

  // Voile de lisibilité en haut
  const grad = ctx.createLinearGradient(0, 0, 0, 86 * uiScale);
  grad.addColorStop(0, 'rgba(4,5,10,0.78)');
  grad.addColorStop(1, 'rgba(4,5,10,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VW, 86 * uiScale);

  // Cœurs
  const hs = 20 * uiScale;
  for (let i = 0; i < CFG.HEARTS_MAX; i++) {
    drawHeart(pad + i * hs * 1.35 + hs * 0.55, top, hs, i < G.hearts);
  }

  // Jauge de lumière
  const gx = pad + CFG.HEARTS_MAX * hs * 1.35 + 22 * uiScale;
  const gw = 170 * uiScale, gh = 12 * uiScale;
  const gy = top + hs * 0.18;
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fillRect(gx, gy, gw, gh);
  const lt = G.light / CFG.LIGHT_MAX;
  const lg = ctx.createLinearGradient(gx, 0, gx + gw, 0);
  lg.addColorStop(0, '#ff9d4d');
  lg.addColorStop(1, '#ffe6b0');
  ctx.fillStyle = lg;
  ctx.fillRect(gx, gy, gw * lt, gh);
  if (G.lightWarn > 0) {
    ctx.globalAlpha = G.lightWarn;
    ctx.strokeStyle = '#ff6a5a'; ctx.lineWidth = 2;
    ctx.strokeRect(gx - 1, gy - 1, gw + 2, gh + 2);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
  ctx.strokeRect(gx + 0.5, gy + 0.5, gw, gh);
  ctx.font = font(14, '600');
  if (G.resting) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(G.time * 4);
    shadowText('Lumière — Nim se recharge', gx, gy + gh + 16 * uiScale, 'left', COL.warm);
    ctx.globalAlpha = 1;
  } else {
    shadowText('Lumière', gx, gy + gh + 16 * uiScale, 'left', COL.dim);
  }

  // Balises
  let lit = 0;
  for (const b of W.beacons) if (b.lit) lit++;
  ctx.font = font(17, '600');
  const bx = gx + gw + 26 * uiScale;
  shadowText('Balises ' + lit + '/' + W.beacons.length, bx, top + hs * 0.75, 'left',
    lit === W.beacons.length ? COL.warm : COL.text);

  // Nuit + score
  ctx.font = font(17, '600');
  const nightLabel = G.night > CFG.STORY_NIGHTS
    ? 'Veille ' + G.night
    : 'Nuit ' + G.night;
  shadowText(nightLabel, VW - pad, top + hs * 0.4, 'right', COL.text);
  ctx.font = font(15);
  shadowText('Score ' + G.score, VW - pad, top + hs * 1.25, 'right', COL.dim);

  // Chrono : le bonus temps ne tombe pas du ciel, on le voit filer
  ctx.font = font(14, '600');
  const tsec = G.nightTime;
  const tstr = Math.floor(tsec / 60) + ':' + String(Math.floor(tsec % 60)).padStart(2, '0');
  shadowText(tstr, VW - pad, top + hs * 2.05, 'right',
    tsec < CFG.TIME_BONUS_LIMIT ? COL.warm : COL.dim);

  if (save.muted) {
    ctx.font = font(14);
    shadowText('son coupé (M)', VW - pad, top + hs * 2.9, 'right', COL.dim);
  }

  // Conseil de la nuit : quelques secondes, bien lisible, puis il s'efface
  if (G.hintT > 0 && G.hintText) {
    const a = clamp(G.hintT / 2, 0, 1) * 0.85;
    ctx.globalAlpha = a;
    ctx.font = font(15, '', true);
    ctx.textAlign = 'center';
    const lines = wrap(G.hintText, Math.min(760 * uiScale, VW - 80));
    let hy = VH - 26 * uiScale - (lines.length - 1) * 21 * uiScale;
    for (const l of lines) { shadowText(l, VW / 2, hy, 'center', '#a9bdd6'); hy += 21 * uiScale; }
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // Boussole vers l'objectif quand il est hors champ
  drawObjectiveHint();

  // Textes flottants
  ctx.textAlign = 'center';
  for (let i = 0; i < G.floats.length; i++) {
    const f = G.floats[i];
    const a = clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = a * a;
    ctx.font = font(f.size, '600');
    const X = sx(f.x), Y = sy(f.y);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText(f.text, X + 1, Y + 2);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, X, Y);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function drawObjectiveHint() {
  const W = G.world;
  let tx = null, ty = null;
  if (G.doorOpen) { tx = W.door.x; ty = W.door.y; }
  else {
    let best = Infinity;
    for (const b of W.beacons) {
      if (b.lit) continue;
      const d = dist2(b.x, b.y, G.ilo.x, G.ilo.y);
      if (d < best) { best = d; tx = b.x; ty = b.y; }
    }
  }
  if (tx === null) return;
  const X = sx(tx), Y = sy(ty);
  const m = 56 * uiScale;
  // Quand le conseil de la nuit est affiché en bas, la boussole reste au-dessus du bandeau
  const mb = (G.hintT > 0 && G.hintText) ? 104 * uiScale : m;
  if (X > m && X < VW - m && Y > m && Y < VH - mb) return;

  // Position sur le cadre de l'écran, dans la direction de l'objectif depuis Ilo
  const ox = sx(G.ilo.x), oy = sy(G.ilo.y);
  let ax = X - ox, ay = Y - oy;
  const al = Math.hypot(ax, ay) || 1;
  ax /= al; ay /= al;
  const hw = VW / 2 - m, hh = VH / 2 - m;
  const k = Math.min(hw / (Math.abs(ax) || 1e-6), hh / (Math.abs(ay) || 1e-6));
  const px = clamp(VW / 2 + ax * k, m, VW - m);
  const py = clamp(VH / 2 + ay * k, m, VH - mb);

  const warm = G.doorOpen;
  const col = warm ? COL.warm : '#a9c1e6';
  const pulse = 0.62 + 0.24 * Math.sin(G.time * 3.4);
  const sc = uiScale;

  ctx.save();
  // Pastille + flèche
  ctx.globalAlpha = 0.20 * pulse;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(px, py, 21 * sc, 0, TAU); ctx.fill();
  ctx.globalAlpha = pulse;
  ctx.translate(px, py);
  ctx.rotate(Math.atan2(ay, ax));
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(15 * sc, 0); ctx.lineTo(-7 * sc, 10 * sc); ctx.lineTo(-3 * sc, 0); ctx.lineTo(-7 * sc, -10 * sc);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();

  // Légende : quoi, et à quelle distance
  const d = Math.round(dist(G.ilo.x, G.ilo.y, tx, ty));
  const lx = clamp(px, 58 * sc, VW - 58 * sc);
  // Légende sous la flèche, ou au-dessus quand la flèche touche le bas de l'écran
  const ly = py > VH * 0.72 ? py - 30 * sc : py + 34 * sc;
  ctx.globalAlpha = 0.55 + 0.2 * Math.sin(G.time * 3.4);
  ctx.font = font(13, '700');
  ctx.textAlign = 'center';
  shadowText((warm ? 'arche' : 'pierre') + '  ' + d + ' m', lx, ly, 'center', col);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

/* ============================================================
   RENDU — écrans
   ============================================================ */
function wrap(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (let i = 0; i < words.length; i++) {
    const test = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function screenBackdrop() {
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, VW, VH);
  // Quelques lucioles lointaines pour l'ambiance
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const p = i * 1.7;
    const x = (VW * 0.5) + Math.cos(G.uiT * 0.24 + p) * (VW * 0.42) * (0.35 + (i % 7) / 9);
    const y = (VH * 0.5) + Math.sin(G.uiT * 0.19 + p * 1.4) * (VH * 0.42) * (0.35 + (i % 5) / 7);
    const a = 0.10 + 0.10 * Math.sin(G.uiT * 1.4 + p);
    radialGlow(x, y, 26, 'rgba(255,190,110,0.5)', a);
    ctx.globalAlpha = a * 2.4;
    ctx.fillStyle = COL.nim;
    ctx.beginPath(); ctx.arc(x, y, 1.5, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // Vignette
  const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.2, VW / 2, VH / 2, Math.max(VW, VH) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
}

function drawTitleScreen() {
  screenBackdrop();

  ctx.font = font(64, '700', true);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillText(sStr(STORY && STORY.title, 'Luciole'), cx + 2, y + 3);
  const tg = ctx.createLinearGradient(0, y - 50 * uiScale, 0, y + 10 * uiScale);
  tg.addColorStop(0, '#fff0cd');
  tg.addColorStop(1, '#ffb765');
  ctx.fillStyle = tg;
  ctx.fillText(sStr(STORY && STORY.title, 'Luciole'), cx, y);

  y += 34 * uiScale;
  ctx.font = font(18, '', true);
  shadowText(sStr(STORY && STORY.tagline, ''), cx, y, 'center', '#c9c0d2');

  // Menu
  y += 62 * uiScale;
  G.menuHit = [];
  const iw = 320 * uiScale, ih = 44 * uiScale;
  for (let i = 0; i < G.menuItems.length; i++) {
    const it = G.menuItems[i];
    const bx = cx - iw / 2, by = y + i * (ih + 10 * uiScale);
    const hover = input.mx >= bx && input.mx <= bx + iw && input.my >= by && input.my <= by + ih;
    if (hover && input.moved && G.menuIndex !== i) G.menuIndex = i;

    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx + 0.5, by + 0.5, iw, ih);
    ctx.font = font(19, sel ? '700' : '500');
    shadowText(it.label, cx, by + ih * 0.66, 'center', sel ? '#ffe0b0' : COL.text);
    G.menuHit.push({ x: bx, y: by, w: iw, h: ih });
  }

  y += G.menuItems.length * (ih + 10 * uiScale) + 34 * uiScale;
  ctx.font = font(16, '600');
  if (save.bestScore > 0 || save.bestNight > 0) {
    shadowText('Meilleur score : ' + save.bestScore + '   •   Meilleure nuit : ' + save.bestNight, cx, y, 'center', '#b9b0c4');
    y += 26 * uiScale;
  }
  ctx.font = font(14);
  shadowText('Flèches / ZQSD pour choisir, Entrée pour valider. M coupe le son.', cx, VH - 26 * uiScale, 'center', COL.dim);
  ctx.textAlign = 'left';
}
