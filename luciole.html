function drawStoryScreen() {
  screenBackdrop();
  const st = G.story;
  if (!st) return;
  const maxW = Math.min(680 * uiScale, VW - 72);
  const cx = VW / 2;
  ctx.textAlign = 'center';

  ctx.font = font(15, '700');
  shadowText(st.heading.toUpperCase(), cx, VH * 0.20, 'center', '#e2a45f');

  const shown = st.text.slice(0, Math.floor(st.shown));
  const paras = shown.split('\n\n');
  const top = VH * 0.20 + 56 * uiScale;
  const room = VH * 0.62 - 56 * uiScale;

  // On rétrécit le texte si le récit est long, pour qu'il tienne toujours à l'écran.
  let size = 21, blocks = null, lineH = 0;
  for (const cand of [21, 19, 17, 15, 14]) {
    ctx.font = font(cand, '', true);
    lineH = Math.max(18, cand * 1.5 * uiScale);
    blocks = paras.map(t => wrap(t, maxW));
    let total = 0;
    for (const b of blocks) total += b.length * lineH + lineH * 0.45;
    size = cand;
    if (total <= room) break;
  }
  ctx.font = font(size, '', true);
  let y = top;
  for (let i = 0; i < blocks.length; i++) {
    for (const l of blocks[i]) { shadowText(l, cx, y, 'center', '#f0e8da'); y += lineH; }
    y += lineH * 0.45;
  }

  if (st.done) {
    if (st.hint) {
      ctx.font = font(16, '', true);
      shadowText('« ' + st.hint + ' »', cx, Math.min(VH - 90 * uiScale, y + 24 * uiScale), 'center', '#9fb3c9');
    }
    const a = 0.45 + 0.35 * Math.sin(G.uiT * 3.2);
    ctx.globalAlpha = a;
    ctx.font = font(15, '600');
    shadowText('Entrée ou clic pour continuer', cx, VH - 40 * uiScale, 'center', COL.dim);
    ctx.globalAlpha = 1;
  } else {
    ctx.font = font(14);
    shadowText('clic pour accélérer', cx, VH - 40 * uiScale, 'center', 'rgba(154,147,168,0.65)');
  }

  // Récapitulatif de score après une nuit réussie
  if (G.state === 'nightAfter' && G.lastResult && st.done) drawScorePanel();

  ctx.textAlign = 'left';
}

function drawScorePanel() {
  const r = G.lastResult;
  const cx = VW / 2;
  const w = Math.min(420 * uiScale, VW - 60);
  const h = 150 * uiScale;
  const x = cx - w / 2, y = VH - h - 74 * uiScale;
  if (y < VH * 0.42) return;
  ctx.fillStyle = 'rgba(10,12,22,0.72)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,183,101,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w, h);

  const rows = [
    ['Balises', '+' + r.beacons],
    ['Mornes dissipés', '+' + r.shadows],
    ['Nuit ' + r.night, '+' + r.nightBonus],
    [r.timeBonus ? 'Bonus temps (' + r.time.toFixed(0) + ' s)' : 'Temps (' + r.time.toFixed(0) + ' s)', r.timeBonus ? '+' + r.timeBonus : '—'],
    ['Sans dégât', r.mult > 1 ? '×' + r.mult : '—']
  ];
  ctx.font = font(15);
  let ry = y + 26 * uiScale;
  for (const row of rows) {
    shadowText(row[0], x + 16 * uiScale, ry, 'left', COL.dim);
    shadowText(row[1], x + w - 16 * uiScale, ry, 'right', COL.text);
    ry += 21 * uiScale;
  }
  ctx.font = font(18, '700');
  shadowText('Score', x + 16 * uiScale, ry + 8 * uiScale, 'left', COL.warm);
  shadowText(String(r.score), x + w - 16 * uiScale, ry + 8 * uiScale, 'right', COL.warm);
}

function drawGameOverScreen() {
  // On garde la dernière image du monde, assombrie
  ctx.fillStyle = 'rgba(4,5,10,0.82)';
  ctx.fillRect(0, 0, VW, VH);
  const cx = VW / 2;
  let y = VH * 0.32;
  ctx.textAlign = 'center';
  ctx.font = font(40, '700', true);
  shadowText(G.gameOverLine, cx, y, 'center', '#e9d6c4');
  y += 52 * uiScale;
  ctx.font = font(19, '600');
  shadowText('Score : ' + G.score, cx, y, 'center', COL.warm);
  y += 28 * uiScale;
  ctx.font = font(16);
  shadowText('Nuit atteinte : ' + G.night, cx, y, 'center', COL.text);
  y += 24 * uiScale;
  shadowText('Meilleur : ' + save.bestScore + ' (nuit ' + save.bestNight + ')', cx, y, 'center', COL.dim);
  y += 46 * uiScale;
  const a = 0.5 + 0.35 * Math.sin(G.uiT * 3.2);
  ctx.globalAlpha = a;
  ctx.font = font(17, '600');
  shadowText('Entrée ou clic pour rejouer', cx, y, 'center', '#ffd9a0');
  ctx.globalAlpha = 1;
  ctx.font = font(14);
  shadowText('Échap : retour au titre', cx, y + 26 * uiScale, 'center', COL.dim);
  ctx.textAlign = 'left';
}

function drawPauseOverlay() {
  ctx.fillStyle = 'rgba(4,5,10,0.78)';
  ctx.fillRect(0, 0, VW, VH);
  const cx = VW / 2;
  let y = VH * 0.40;
  ctx.textAlign = 'center';
  ctx.font = font(38, '700', true);
  shadowText('Pause', cx, y, 'center', '#ffd9a0');
  y += 42 * uiScale;
  ctx.font = font(16);
  shadowText('Échap, P ou clic : reprendre', cx, y, 'center', COL.text);
  y += 24 * uiScale;
  shadowText('T : retour au titre', cx, y, 'center', COL.dim);
  y += 24 * uiScale;
  shadowText('M : son ' + (save.muted ? '(coupé)' : '(activé)'), cx, y, 'center', COL.dim);
  ctx.textAlign = 'left';
}

/* ============================================================
   BOUCLE PRINCIPALE
   ============================================================ */
function render() {
  const s = G.state;
  if (s === 'playing') {
    const sh = G.shake;
    const ox = sh ? (Math.random() - 0.5) * sh : 0;
    const oy = sh ? (Math.random() - 0.5) * sh : 0;
    camX = G.cam.x + ox;
    camY = G.cam.y + oy;
    drawWorld();
    drawDarkness();
    if (G.cull) drawShadowBodies(G.cull.x0, G.cull.x1, G.cull.y0, G.cull.y1);
    drawBeaconUI();
    drawLights();
    if (G.flash > 0.001) {
      ctx.fillStyle = 'rgba(255,240,214,' + (G.flash * 0.4) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }
    drawHUD();
    if (G.paused) drawPauseOverlay();
  } else if (s === 'title') {
    drawTitleScreen();
  } else if (s === 'help') {
    drawHelpScreen();
  } else if (s === 'gameOver') {
    drawGameOverScreen();
  } else {
    drawStoryScreen();
  }
}

let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;   // plafond après un onglet en arrière-plan
  if (dt < 0) dt = 0;

  G.time += dt;
  G.uiT += dt;
  if (G.lightWarn > 0) G.lightWarn = Math.max(0, G.lightWarn - dt * 1.6);

  const playing = G.state === 'playing' && !G.paused;
  document.body.classList.toggle('playing', playing);

  if (playing) {
    updatePlaying(dt);
  } else {
    setHum(0);
    if (G.story && !G.story.done) {
      G.story.shown += G.story.speed * dt;
      if (G.story.shown >= G.story.text.length) {
        G.story.shown = G.story.text.length;
        G.story.done = true;
      }
    }
  }

  render();
  input.moved = false;
}

/* ============================================================
   AMORÇAGE
   ============================================================ */
/* Crochet interne de mise au point : aucun bouton, aucune mention dans le jeu.
   Sert uniquement aux tests automatisés (sauter à une nuit, inspecter l'état). */
try {
  Object.defineProperty(window, '__luciole', {
    value: {
      G, CFG, save,
      night(n) { startRun(n); goToNightBefore(n); },
      generate: generateWorld,
      params: nightParams
    },
    enumerable: false, writable: false, configurable: false
  });
} catch (e) { /* environnement verrouillé : on s'en passe */ }

function boot() {
  resize();
  G.lightWarn = 0;
  G.tension = 0;
  buildMenu();
  toTitle();
  requestAnimationFrame(frame);
}
boot();

})();
</script>
