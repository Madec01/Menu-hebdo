function echapper(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* =========================================================================
   [09] EVENEMENTS
   -------------------------------------------------------------------------
   Un seul ecouteur pose sur un conteneur plutot qu'un par element : c'est ce
   qu'on appelle la delegation. Sans cela il faudrait rattacher des centaines
   d'ecouteurs a chaque re-affichage, avec une fuite de memoire a la clef.
   ========================================================================= */
function creerItem(props, focus){
  const id = nouvelId();
  const now = new Date().toISOString();
  const base = Object.assign({}, ITEM_DEFAUT, {
    id: id, createdAt: now, updatedAt: now,
    date: props.date || dateAujourdhui(),
  }, props);
  base.origDate = base.date;
  if (base.priority === "semaine") base.weekOfOrigin = dateLundi(base.date);
  commit("Nouvelle tâche", e => { e.items[id] = base; });
  if (focus !== false) focaliser(id);
  return id;
}
function focaliser(id){
  requestAnimationFrame(() => {
    const el = document.querySelector('[data-id="' + id + '"] .title');
    if (el){ el.focus(); el.select(); }
  });
}
function itemDe(node){
  const h = node.closest("[data-id]");
  return h ? etat.items[h.dataset.id] : null;
}

function basculerTermine(it){
  const fait = it.status === "done";
  commit(fait ? "Tâche décochée" : "Tâche terminée", () => {
    it.status = fait ? "open" : "done";
    it.doneAt = fait ? null : new Date().toISOString();
    it.updatedAt = new Date().toISOString();
  }, { sansRendu: true });
  // On ne re-rend pas la grille : cocher ne doit jamais faire sauter le scroll
  // ni le focus. On met a jour seulement l'element concerne.
  document.querySelectorAll('[data-id="' + it.id + '"]').forEach(el => {
    el.classList.toggle("done", it.status === "done");
    const c = el.querySelector(".chk"); if (c) c.checked = it.status === "done";
  });
  rendreEnTetesJours();
}

function supprimerItem(it){
  const copie = JSON.parse(JSON.stringify(it));
  commit("Suppression", e => { delete e.items[it.id]; });
  signalerAvecAction("« " + (copie.title || "tâche sans titre") + " » supprimée.", "Annuler",
    () => commit("Restauration", e => { e.items[copie.id] = copie; }));
}

function brancherEvenements(){
  /* --- Navigation ------------------------------------------------------- */
  $("prevWeek").onclick = () => allerSemaine(-1);
  $("nextWeek").onclick = () => allerSemaine(1);
  $("todayBtn").onclick = () => { semaineAffichee = dateLundi(dateAujourdhui()); rendre(); };
  $("settingsBtn").onclick = panneauReglages;
  $("helpBtn").onclick = panneauAide;
  $("backupBtn").onclick = panneauSauvegarde;
  els.alertClose.onclick = () => { els.alertBar.hidden = true; };
  els.veil.onclick = e => { if (e.target === els.veil) fermerLePanneau(); };

  $("addUrgent").onclick = () => creerItem({
    placement: "week", date: semaineAffichee, priority: "urgent",
  });
  $("addPark").onclick = () => creerItem({ placement: "park", date: dateAujourdhui() });

  /* --- Clics dans les zones d'elements ----------------------------------- */
  document.addEventListener("click", e => {
    const cible = e.target;

    if (cible.classList.contains("chk")){ const it = itemDe(cible); if (it) basculerTermine(it); return; }
    if (cible.classList.contains("del")){ const it = itemDe(cible); if (it) supprimerItem(it); return; }
    if (cible.classList.contains("pdot")){
      const it = itemDe(cible); if (!it) return;
      const suivante = prioriteSuivante(it.priority);
      commit("Priorité modifiée", () => definirPriorite(it, suivante));
      signaler("Priorité : " + PRIO[suivante].nom + " — " + PRIO[suivante].desc);
      return;
    }
    if (cible.classList.contains("roll")){
      const it = itemDe(cible); if (!it) return;
      const orig = it.origDate;
      commit("Retour à la date d'origine", () => {
        it.date = orig; it.rolloverCount = 0; it.lastRolloverOn = "";
        it.updatedAt = new Date().toISOString();
      });
      semaineAffichee = dateLundi(orig); rendre();
      signaler("Renvoyée au " + dateLisibleLongue(orig) + ".");
      return;
    }

    // Clic dans le vide d'un bac « A faire » : on cree une tache tout de suite.
    if (cible.classList.contains("daybin")){
      creerItem({ placement: "day", date: cible.dataset.jour });
      return;
    }
    if (cible.classList.contains("parklist")){
      creerItem({ placement: "park", date: dateAujourdhui() });
      return;
    }
    // Clic sur un creneau vide : on cree un element a cette heure precise.
    if (cible.classList.contains("slot")){
      const col = cible.closest(".daycol");
      creerItem({ placement: "slot", date: col.dataset.jour, startMin: +cible.dataset.min, durMin: 30 });
      return;
    }
  });

  /* --- Saisie du titre, en place ----------------------------------------- */
  document.addEventListener("input", e => {
    if (!e.target.classList.contains("title")) return;
    const it = itemDe(e.target); if (!it) return;
    idEnEdition = it.id;
    it.title = e.target.value;
    it.updatedAt = new Date().toISOString();
    if (e.target.tagName === "TEXTAREA") ajusterHauteur(e.target);
    planifierEnregistrement();
  });
  document.addEventListener("focusout", e => {
    if (!e.target.classList.contains("title")) return;
    const it = itemDe(e.target); if (!it) return;
    idEnEdition = null;
    if (!it.title.trim()){                       // une ligne laissee vide disparait
      commit("Ligne vide retirée", st => { delete st.items[it.id]; }, { sansAnnulation: true });
    } else { rendre(); }
  });
  document.addEventListener("keydown", e => {
    if (e.target.classList && e.target.classList.contains("title")){
      const it = itemDe(e.target); if (!it) return;
      if (e.key === "Enter"){
        e.preventDefault(); e.target.blur();
        if (it.title.trim()){
          if (it.placement === "week") creerItem({ placement:"week", date: it.date, priority:"urgent" });
          else if (it.placement === "park") creerItem({ placement:"park", date: it.date });
          else creerItem({ placement:"day", date: it.date, priority: it.priority });
        }
        return;
      }
      if (e.key === "Escape"){ e.preventDefault(); e.target.blur(); return; }
      if (e.key === "Backspace" && e.target.value === ""){
        e.preventDefault();
        commit("Ligne retirée", st => { delete st.items[it.id]; }, { sansAnnulation: true });
        return;
      }
      if ((e.altKey || e.metaKey) && ["1","2","3"].indexOf(e.key) >= 0){
        e.preventDefault();
        const p = PRIO_ORDRE[+e.key - 1];
        commit("Priorité modifiée", () => definirPriorite(it, p));
        focaliser(it.id);
        return;
      }
      return;
    }
    raccourcisGlobaux(e);
  });

  /* --- Notes de la semaine ----------------------------------------------- */
  let tNotes = null;
  els.notes.addEventListener("input", () => {
    clearTimeout(tNotes);
    const v = els.notes.value, sem = semaineAffichee;
    tNotes = setTimeout(() => {
      commit("Notes", e => { e.weekNotes[sem] = { text: v, updatedAt: new Date().toISOString() }; },
             { sansRendu: true, sansAnnulation: true });
      els.notesCnt.textContent = v.trim().length ? v.trim().length + " caractères" : "";
    }, 300);
  });

  /* --- Glisser-deposer ---------------------------------------------------- */
  let idGlisse = null;
  document.addEventListener("dragstart", e => {
    if (!e.target.classList || !e.target.classList.contains("grip")) return;
    const it = itemDe(e.target); if (!it) return;
    idGlisse = it.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", it.id);
    const el = e.target.closest(".item");
    el.classList.add("dragging");
    e.dataTransfer.setDragImage(el, 12, 10);
  });
  document.addEventListener("dragend", () => {
    idGlisse = null;
    document.querySelectorAll(".dragging").forEach(el => el.classList.remove("dragging"));
    document.querySelectorAll(".dropok").forEach(el => el.classList.remove("dropok"));
  });
  document.addEventListener("dragover", e => {
    const z = zoneDepot(e.target);
    if (!z || !idGlisse) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (!z.classList.contains("dropok")){
      document.querySelectorAll(".dropok").forEach(el => el.classList.remove("dropok"));
      z.classList.add("dropok");
    }
  });
  document.addEventListener("drop", e => {
    const z = zoneDepot(e.target);
    const id = idGlisse || e.dataTransfer.getData("text/plain");
    if (!z || !id || !etat.items[id]) return;
    e.preventDefault();
    deposer(etat.items[id], z);
  });
  function zoneDepot(n){
    if (!n || !n.closest) return null;
    return n.closest(".slot, .daybin, .parklist, .urgentlist");
  }
  function deposer(it, z){
    commit("Déplacement", () => {
      if (z.classList.contains("slot")){
        it.placement = "slot";
        it.date = z.closest(".daycol").dataset.jour;
        it.startMin = +z.dataset.min;
      } else if (z.classList.contains("daybin")){
        it.placement = "day"; it.date = z.dataset.jour; it.startMin = null;
      } else if (z.classList.contains("parklist")){
        it.placement = "park"; it.startMin = null;
      } else if (z.classList.contains("urgentlist")){
        it.placement = "week"; it.date = semaineAffichee; it.startMin = null;
        definirPriorite(it, "urgent");
      }
      it.updatedAt = new Date().toISOString();
    });
  }

  /* --- Etirer un rendez-vous pour changer sa duree ------------------------ */
  let redim = null;
  document.addEventListener("mousedown", e => {
    if (!e.target.classList || !e.target.classList.contains("resize")) return;
    const it = itemDe(e.target); if (!it) return;
    e.preventDefault();
    redim = { it: it, y0: e.clientY, dur0: it.durMin || 30 };
  });
  document.addEventListener("mousemove", e => {
    if (!redim) return;
    const pas = Math.round((e.clientY - redim.y0) / etat.settings.hauteurCreneau);
    const nouvelle = Math.max(30, redim.dur0 + pas * 30);
    if (nouvelle !== redim.it.durMin){
      redim.it.durMin = nouvelle;
      rendreGrille();
    }
  });
  document.addEventListener("mouseup", () => {
    if (!redim) return;
    const it = redim.it; redim = null;
    commit("Durée modifiée", () => { it.updatedAt = new Date().toISOString(); }, { sansAnnulation: true });
  });

  /* --- Hauteur du bas de page -------------------------------------------- */
  let grab = null;
  els.grabber.addEventListener("mousedown", e => {
    grab = { y0: e.clientY, h0: etat.settings.hauteurBas }; e.preventDefault();
  });
  document.addEventListener("mousemove", e => {
    if (!grab) return;
    const h = Math.max(64, Math.min(460, grab.h0 - (e.clientY - grab.y0)));
    etat.settings.hauteurBas = h;
    document.querySelector(".bottom").style.height = h + "px";
  });
  document.addEventListener("mouseup", () => { if (grab){ grab = null; planifierEnregistrement(); } });

  /* --- Enregistrement garanti a la fermeture ------------------------------ */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") enregistrerMaintenant();
    else verifierChangementDeJour();
  });
  window.addEventListener("pagehide", enregistrerMaintenant);

  /* --- Deux onglets ouverts sur le meme agenda ---------------------------- */
  window.addEventListener("storage", ev => {
    if (!ev.key || ev.key.indexOf(PREFIX) !== 0) return;
    if (ev.key !== K.stamp && ev.key !== K.slot) return;
    if (ev.key === K.stamp && ev.newValue === empreinteConnue) return;   // c'est notre propre ecriture
    bloquerLesEcritures();
  });
}

function allerSemaine(n){
  semaineAffichee = datePlus(semaineAffichee, n * 7);
  rendre();
}

function raccourcisGlobaux(e){
  const dansUnChamp = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.shiftKey){
    e.preventDefault(); annuler(); return;
  }
  if (e.key === "Escape" && !els.veil.hidden){ e.preventDefault(); fermerLePanneau(); return; }
  if (dansUnChamp) return;
  if (e.key === "ArrowLeft"){ e.preventDefault(); allerSemaine(-1); return; }
  if (e.key === "ArrowRight"){ e.preventDefault(); allerSemaine(1); return; }
  if (e.key.toLowerCase() === "t"){ e.preventDefault(); semaineAffichee = dateLundi(dateAujourdhui()); rendre(); return; }
  if (e.key.toLowerCase() === "n"){
    e.preventDefault();
    const auj = dateAujourdhui();
    const cible = joursAffiches().indexOf(auj) >= 0 ? auj : semaineAffichee;
    creerItem({ placement: "day", date: cible });
    return;
  }
  if (e.key === "?"){ e.preventDefault(); panneauAide(); }
}

function nomFichierSauvegarde(suffixe){
  return "agenda-" + (suffixe ? suffixe + "-" : "") + dateAujourdhui() + ".json";
}

/* CE QUE CETTE FONCTION SAIT, ET CE QU'ELLE NE SAIT PAS.
   Elle sait qu'elle a demande un telechargement au navigateur. Elle ne sait
   PAS si un fichier est arrive sur le disque : un telechargement refuse —
   parce que l'utilisateur a repondu « Bloquer » a la demande d'autorisation
   pour plusieurs fichiers, parce qu'une strategie d'entreprise l'interdit,
   parce que le dossier est plein — echoue de facon asynchrone et silencieuse.
   Aucun evenement, aucune exception.
   Elle renvoie donc « la demande est partie », et surtout pas « c'est
   sauvegarde ». Toute la suite depend de cette distinction : c'est en la
   confondant que la pastille annoncait « Sauvegarde du jour » a quelqu'un
   dont plus rien ne partait depuis des mois. */
function demanderTelechargement(nom, texte){
  try {
    const blob = new Blob([texte], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch(e){ return false; }
}

/* Le seul chemin qui permette une VRAIE confirmation : le navigateur ouvre
   une fenetre d'enregistrement, et l'ecriture est confirmee ou rejetee.
   Absent de Firefox et de Safari, et exige un geste de l'utilisateur : c'est
   donc un bonus pour le bouton « Sauvegarde », jamais le socle. */
function enregistrementVerifiableDisponible(){
  return typeof window.showSaveFilePicker === "function";
}
async function enregistrerAvecConfirmation(nom, texte){
  const poignee = await window.showSaveFilePicker({
    suggestedName: nom,
    types: [{ description: "Sauvegarde de l'agenda", accept: { "application/json": [".json"] } }],
  });
  const flux = await poignee.createWritable();
  await flux.write(texte);
  await flux.close();
  return true;
}

/* Une sauvegarde CONFIRMEE : un fichier est reellement arrive sur le disque,
   soit parce que le navigateur nous l'a confirme, soit parce que
   l'utilisateur nous a dit l'avoir retrouve. C'est la seule chose que la
   pastille a le droit de refleter. */
function marquerSauvegardeConfirmee(){
  etat.meta.lastBackupOn = dateAujourdhui();
  planifierEnregistrement();
  majPastilleSauvegarde();
}

function exporter(auto, suffixe){
  const texte = JSON.stringify(enveloppe(etat), null, auto ? 0 : 1);
  const partie = demanderTelechargement(nomFichierSauvegarde(suffixe), texte);
  if (partie && !suffixe){
    etat.meta.lastBackupTryOn = dateAujourdhui();   // tentative, pas confirmation
    planifierEnregistrement();
    majPastilleSauvegarde();
  }
  return partie;
}

/* Question posee au plus une fois toutes les deux semaines, et seulement
   apres une sauvegarde automatique. C'est le seul moyen honnete de savoir si
   les fichiers arrivent vraiment quand le navigateur ne nous dit rien. */
const JOURS_ENTRE_VERIFICATIONS = 14;
function verificationSauvegardeNecessaire(){
  // Rien a perdre, rien a verifier : on n'importune personne le premier jour,
  // sur un agenda encore vide.
  if (!Object.keys(etat.items).length) return false;
  const conf = etat.meta.lastBackupOn;
  if (!conf) return true;
  return dateEcart(conf, dateAujourdhui()) >= JOURS_ENTRE_VERIFICATIONS;
}

    '<div class="field"><label>Depuis un fichier de sauvegarde<small>Vos données actuelles sont automatiquement sauvegardées avant tout remplacement.</small></label>' +
      '<button class="btn" id="bImp">Choisir un fichier…</button></div>' +
    '<div class="field"><label>Depuis un texte copié<small>Collez ici le contenu d\'une sauvegarde.</small></label>' +
      '<button class="btn" id="bPaste">Coller un texte…</button></div>' +
    (snaps.length
      ? '<div class="field"><label>Depuis un instantané interne<small>L\'agenda garde tout seul ' + snaps.length + ' point' + (snaps.length > 1 ? "s" : "") + ' de retour dans le navigateur. Utile après une fausse manœuvre, mais pas après un effacement du navigateur.</small></label>' +
        '<select id="bSnapSel">' + snaps.map(j => '<option value="' + j + '">' + echapper(dateLisibleLongue(j)) + '</option>').join("") + '</select> ' +
        '<button class="btn" id="bSnap">Restaurer</button></div>'
      : "") +
  '</div>' +
  '<div class="panelfoot"><div class="spacer"></div><button class="btn primary" id="bClose">Fermer</button></div>', true);

  /* Ce bouton part d'un geste de l'utilisateur : c'est la seule occasion ou
     l'on peut demander au navigateur une confirmation reelle. Quand il sait
     le faire, on l'utilise et la sauvegarde est confirmee sans rien demander
     a personne. Sinon on retombe sur le telechargement classique, dont on ne
     sait rien, et on pose la question. */
  $("bExp").onclick = async () => {
    const texte = JSON.stringify(enveloppe(etat), null, 1);
    if (enregistrementVerifiableDisponible()){
      try {
        await enregistrerAvecConfirmation(nomFichierSauvegarde(), texte);
        etat.meta.lastBackupTryOn = dateAujourdhui();
        marquerSauvegardeConfirmee();
        signaler("Sauvegarde enregistrée, et cette fois c'est confirmé par votre navigateur.");
        return;
      } catch(e){
        if (e && e.name === "AbortError") return;      // l'utilisateur a renonce
        // Toute autre panne : on retombe sur le chemin classique ci-dessous.
      }
    }
    if (!exporter(false)){
      signaler("Le téléchargement a été refusé. Utilisez « Afficher et copier ».", "bad");
      return;
    }
    signalerAvecAction("Sauvegarde déposée : " + nomFichierSauvegarde() +
      " — l'agenda ne peut pas vérifier qu'elle est bien arrivée.",
      "Je l'ai retrouvée", () => {
        marquerSauvegardeConfirmee();
        signaler("Merci. La pastille repart de cette date.");
      });
  };
  $("bCopy").onclick = panneauCopie;
  $("bArch").onclick = () => { creerArchiveAutonome(); };
  $("bImp").onclick = () => els.fileInput.click();
  $("bPaste").onclick = panneauCollage;
  if ($("bSnap")) $("bSnap").onclick = () => {
    const j = $("bSnapSel").value;
    const v = lireInstantane(j);
    if (!v.ok){ signaler(v.msg, "bad"); return; }
    confirmerRestauration(v.paquet, "instantané du " + dateLisibleLongue(j));
  };
  $("bClose").onclick = fermerLePanneau;
}

/* Aucune donnee n'est remplacee sans un ecran de confirmation qui montre ce
   qui va arriver, et sans une sauvegarde automatique de l'etat actuel. */
function confirmerRestauration(paquet, origine){
  const nNouv = Object.keys(paquet.data.items || {}).length;
  const nAct  = Object.keys(etat.items).length;
  const chute = nAct > 0 && nNouv < nAct / 2;
  ouvrirPanneau(
  '<div class="panelhead"><h2>Restaurer cette sauvegarde ?</h2>' +
  '<p>Source : ' + echapper(origine) + '</p></div>' +
  '<div class="panelbody">' +
    '<div class="arbrow"><div class="txt">Date de la sauvegarde<small>' +
      echapper(paquet.savedAt ? new Date(paquet.savedAt).toLocaleString("fr-FR") : "inconnue") + '</small></div></div>' +
    '<div class="arbrow"><div class="txt">Contenu<small>' + nNouv + ' tâche' + (nNouv > 1 ? "s" : "") + ' · ' +
      Object.keys(paquet.data.weekNotes || {}).length + ' semaine(s) de notes</small></div></div>' +
    '<div class="arbrow"><div class="txt">Votre agenda actuel<small>' + nAct + ' tâche' + (nAct > 1 ? "s" : "") + '</small></div></div>' +
    (chute ? '<div class="note danger"><strong>Attention.</strong> Cette sauvegarde contient nettement moins de tâches que votre agenda actuel ' +
      '(' + nNouv + ' contre ' + nAct + '). C\'est peut-être une vieille sauvegarde. Vérifiez la date avant de continuer.</div>' : "") +
    '<div class="note">Avant le remplacement, l\'agenda télécharge automatiquement une copie de votre état actuel, ' +
    'sous le nom <code>agenda-avant-restauration-…</code>. La restauration reste donc réversible.</div>' +
  '</div>' +
  '<div class="panelfoot"><div class="spacer"></div><button class="btn" id="crNon">Annuler</button>' +
  '<button class="btn primary" id="crOui">Remplacer mes données</button></div>');
  $("crNon").onclick = fermerLePanneau;
  /* La copie de securite n'est pas une formalite : c'est elle qui rend la
     restauration reversible, et le panneau ci-dessus le promet noir sur blanc.
     Son resultat etait ignore. Si la demande de telechargement ne part meme
     pas, on ne remplace rien : on renvoie vers « Afficher et copier », qui
     fonctionne toujours, et l'utilisateur decide ensuite.
     Comme partout ailleurs, « la demande est partie » ne veut pas dire « le
     fichier est arrive » : on le dit plutot que de le laisser croire. */
  $("crOui").onclick = () => {
    if (!exporter(false, "avant-restauration")){
      fermerLePanneau();
      ouvrirPanneau(
      '<div class="panelhead"><h2>Restauration interrompue</h2>' +
      '<p>Vos données actuelles n\'ont pas pu être copiées avant le remplacement. ' +
      'Rien n\'a été touché.</p></div>' +
      '<div class="panelbody"><div class="note">Le panneau de restauration vous promet de pouvoir ' +
      'revenir en arrière. Cette promesse repose entièrement sur cette copie. Tant qu\'elle n\'est ' +
      'pas faite, remplacer vos données serait irréversible, donc l\'agenda s\'arrête ici.<br><br>' +
      'Utilisez <strong>Afficher et copier</strong> pour mettre vos données actuelles en sécurité ' +
      'à la main, puis recommencez la restauration.</div></div>' +
      '<div class="panelfoot"><button class="btn" id="riCopy">Afficher et copier</button>' +
      '<div class="spacer"></div><button class="btn primary" id="riClose">Fermer</button></div>');
      $("riCopy").onclick = panneauCopie;
      $("riClose").onclick = fermerLePanneau;
      return;
    }
    const donnees = migrer(paquet);
    etat = hydrater(donnees);
    etat.meta.updatedAt = new Date().toISOString();
    pileAnnulation = [];
    enregistrerMaintenant();
    appliquerReglages(); rendre();
    fermerLePanneau();
    signaler("Restauration terminée : " + Object.keys(etat.items).length + " tâches retrouvées.");
  };
}

/* Archive autonome : une copie du fichier avec les donnees inserees dedans.
   Excellente photographie figee, mauvaise boucle de travail : c'est pourquoi
   ce n'est PAS le mecanisme de sauvegarde principal. */
function creerArchiveAutonome(){
  // On capture la page dans un etat neutre : sans le panneau ouvert, sans
  // message flottant et sans donnee d'archive precedente, sinon l'archive
  // se rouvrirait sur l'ecran de sauvegarde plutot que sur l'agenda.
  const memoPanneau = els.panel.innerHTML;
  const memoVeil = els.veil.hidden;
  const memoToast = els.toast.hidden;
  const memoAlerte = els.alertBar.hidden;
  const ancienne = document.getElementById("donneesArchive");
  if (ancienne) ancienne.remove();
  els.panel.innerHTML = ""; els.veil.hidden = true;
  els.toast.hidden = true; els.alertBar.hidden = true;

  const html = document.documentElement.outerHTML;

  els.panel.innerHTML = memoPanneau; els.veil.hidden = memoVeil;
  els.toast.hidden = memoToast; els.alertBar.hidden = memoAlerte;

  const charge = '<script id="donneesArchive" type="application/json">' +
    JSON.stringify(enveloppe(etat)).replace(/<\//g, "<\\/") + '<\/script>';
  const sortie = html.replace("</head>", charge + "\n</head>");
  const mois = dateAujourdhui().slice(0, 7);
  const ok = demanderTelechargement("agenda-archive-" + mois + ".html", "<!DOCTYPE html>\n" + sortie);
  signaler(ok ? "Archive créée : agenda-archive-" + mois + ".html"
              : "Le téléchargement a été refusé.", ok ? "" : "bad");
}

function brancherImportFichier(){
  els.fileInput.addEventListener("change", () => {
    const f = els.fileInput.files && els.fileInput.files[0];
    if (!f) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      const v = valider(String(lecteur.result));
      if (!v.ok){ signaler(v.msg, "bad"); }
      else confirmerRestauration(v.paquet, "fichier " + f.name);
      els.fileInput.value = "";
    };
    lecteur.onerror = () => { signaler("Impossible de lire ce fichier.", "bad"); els.fileInput.value = ""; };
    lecteur.readAsText(f);
  });
}

   ========================================================================= */
let filePanneaux = [];
function enfilerPanneau(fn){ filePanneaux.push(fn); }
function panneauSuivant(){
  fermerPanneau = null;
  const fn = filePanneaux.shift();
  if (fn) fn(); else fermerLePanneau();
}
function terminerPanneau(){ els.veil.hidden = true; els.panel.innerHTML = ""; panneauSuivant(); }

/* Au demarrage, c'est demarrer() qui depile la file, une fois et une seule.
   Mais un panneau peut aussi etre enfile en pleine session — au passage de
   minuit, par exemple. Personne ne dépilerait alors la file : elle resterait
   pleine et l'ecran ne s'afficherait jamais. */
function demarrerLaFileSiInactive(){
  if (els.veil.hidden && filePanneaux.length) panneauSuivant();
}

  const jours = Object.keys(parJour).sort();

    '<div class="acts"><span style="font-size:12px;color:var(--text-faint)">' + parJour[j].length + '</span></div></div>'
  ).join("");

  ouvrirPanneau(

  'Elles ont été ramenées sur aujourd\'hui, dans le bac « À faire ». ' +
  'Prenez une minute pour envoyer au parking celles qui peuvent attendre : sinon votre journée devient illisible.</p></div>' +
  '<div class="panelbody">' + lignes +
    (archivees.length ? '<div class="note">' + archivees.length + ' tâche' + (archivees.length > 1 ? "s" : "") +
      ' de plus de ' + etat.settings.reportAgeMax + ' jours ' + (archivees.length > 1 ? "ont" : "a") +
      ' été rangée' + (archivees.length > 1 ? "s" : "") + ' au parking plutôt que sur votre journée. Rien n\'a été supprimé.</div>' : "") +
  '</div>' +
  '<div class="panelfoot"><button class="btn" id="tPark">Tout envoyer au parking</button>' +
  '<div class="spacer"></div><button class="btn primary" id="tOk">Garder sur aujourd\'hui</button></div>', true);

  $("tPark").onclick = () => {
    commit("Rattrapage : tout au parking", () => {

/* --- Arbitrage du lundi : ce qui devait etre fait la semaine derniere ----- */
function panneauArbitrage(aArbitrer, quiTrainent){
  const ligne = (it, groupe) =>
    '<div class="arbrow" data-id="' + it.id + '" data-groupe="' + groupe + '">' +
    '<div class="txt">' + echapper(it.title || "sans titre") +
    '<small>' + (groupe === "semaine"
      ? "Prévue pour la semaine du " + echapper(dateLisible(it.weekOfOrigin || dateLundi(it.origDate || it.date), false))
      : "Notée le " + echapper(dateLisible(it.origDate || it.date, true)) + " — il y a " +
        dateEcart(it.origDate || it.date, dateAujourdhui()) + " jours") +
    '</small></div><div class="acts">' +
    (groupe === "semaine"
      ? '<button class="minibtn" data-act="garder">Cette semaine</button>' +
        '<button class="minibtn b-urgent" data-act="urgent">Urgent</button>' +
        '<button class="minibtn" data-act="libre">Quand je peux</button>'
      : '<button class="minibtn" data-act="garder">Garder</button>' +
        '<button class="minibtn" data-act="park">Parking</button>') +
    '<button class="minibtn b-drop" data-act="abandon">Abandonner</button>' +
    '</div></div>';

  ouvrirPanneau(
  '<div class="panelhead"><h2>Le point du lundi</h2>' +
  '<p>Ces tâches n\'ont pas passé le dimanche. Deux minutes pour trancher, et votre semaine repart propre.</p></div>' +
  '<div class="panelbody">' +
    (aArbitrer.length
      ? '<div class="sectitle">Devaient être faites la semaine dernière</div>' + aArbitrer.map(it => ligne(it, "semaine")).join("")
      : "") +
    (quiTrainent.length
      ? '<div class="sectitle">Ça traîne depuis plus de ' + etat.settings.libreSeuilJours + ' jours</div>' +
        '<p style="font-size:12.5px;color:var(--text-soft);margin:0 0 4px">La vraie question n\'est pas « suis-je en retard », ' +
        'mais « cette tâche est-elle bien formulée ». Trop grosse ? Découpez-la. Mal datée ? Datez-la. Inutile ? Abandonnez-la.</p>' +
        quiTrainent.map(it => ligne(it, "traine")).join("")
      : "") +
  '</div>' +
  '<div class="panelfoot"><div class="spacer"></div><button class="btn primary" id="abOk">Tout garder pour cette semaine</button></div>', true);

  els.panel.querySelector(".panelbody").addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]"); if (!b) return;
    const rangee = b.closest(".arbrow");
    const it = etat.items[rangee.dataset.id]; if (!it) return;
    const act = b.dataset.act, auj = dateAujourdhui();
    commit("Arbitrage", () => {
      if (act === "garder"){
        if (rangee.dataset.groupe === "semaine") it.weekOfOrigin = dateLundi(auj);
        else it.staleReviewedOn = auj;
        it.date = auj; it.placement = it.placement === "park" ? "park" : "day";
      }
      else if (act === "urgent"){ definirPriorite(it, "urgent"); it.date = auj; }
      else if (act === "libre"){ definirPriorite(it, "libre"); it.staleReviewedOn = auj; }
      else if (act === "park"){ it.placement = "park"; it.startMin = null; it.staleReviewedOn = auj; }
      else if (act === "abandon"){ it.status = "abandoned"; it.updatedAt = new Date().toISOString(); }
    });
    rangee.remove();
    if (!els.panel.querySelectorAll(".arbrow").length){
      etat.meta.lastWeekReviewOn = auj; planifierEnregistrement(); terminerPanneau();
    }
  });
  $("abOk").onclick = () => {
    const auj = dateAujourdhui();
    commit("Arbitrage : tout garder", () => {
      aArbitrer.forEach(it => { it.weekOfOrigin = dateLundi(auj); });
      quiTrainent.forEach(it => { it.staleReviewedOn = auj; });
    });
    etat.meta.lastWeekReviewOn = auj;
    terminerPanneau();
  };
}

/* --- Sas de fin de journee ------------------------------------------------ */
function panneauSas(){
  const auj = dateAujourdhui();
  const restantes = tousLesItems().filter(it =>
    it.date === auj && it.status === "open" && it.placement === "day").sort(comparerItems);

  if (!restantes.length){
    etat.meta.lastSasOn = auj; planifierEnregistrement();
    panneauSuivant(); return;
  }
  const lignes = restantes.map(it =>
    '<div class="arbrow" data-id="' + it.id + '"><div class="txt">' + echapper(it.title || "sans titre") +
    ((it.rolloverCount || 0) > 0 ? '<small>Reportée ' + it.rolloverCount + ' fois</small>' : "") +
    '</div><div class="acts">' +
    '<button class="minibtn" data-act="fait">✓ Fait</button>' +
    '<button class="minibtn" data-act="demain">Demain</button>' +
    '<input type="date" class="minibtn" data-act="date" style="padding:2px 4px">' +
    '<button class="minibtn" data-act="park">Parking</button>' +
    '<button class="minibtn b-drop" data-act="abandon">Abandonner</button>' +
    '</div></div>').join("");

  ouvrirPanneau(
  '<div class="panelhead"><h2>Le point de fin de journée</h2>' +
  '<p>' + restantes.length + ' tâche' + (restantes.length > 1 ? "s" : "") + ' non faite' + (restantes.length > 1 ? "s" : "") +
  '. Trente secondes pour décider, plutôt que de subir le report demain matin. ' +
  'Si vous fermez cet écran, tout sera simplement reporté à demain.</p></div>' +
  '<div class="panelbody">' + lignes + '</div>' +
  '<div class="panelfoot"><div class="spacer"></div><button class="btn primary" id="sOk">Tout reporter à demain</button></div>', true);

  els.panel.querySelector(".panelbody").addEventListener("click", ev => {
    const b = ev.target.closest("button[data-act]"); if (!b) return;
    traiterSas(b.closest(".arbrow"), b.dataset.act, null);
  });
  els.panel.querySelector(".panelbody").addEventListener("change", ev => {
    const d = ev.target.closest('input[data-act="date"]'); if (!d || !d.value) return;
    traiterSas(d.closest(".arbrow"), "date", d.value);
  });
  function traiterSas(rangee, act, valeur){
    const it = etat.items[rangee.dataset.id]; if (!it) return;
    commit("Fin de journée", () => {
      if (act === "fait"){ it.status = "done"; it.doneAt = new Date().toISOString(); }
      else if (act === "demain"){ it.date = datePlus(auj, 1); it.placement = "day"; it.startMin = null; }
      else if (act === "date"){ it.date = valeur; it.placement = "day"; it.startMin = null; it.noRollover = false; }
      else if (act === "park"){ it.placement = "park"; it.startMin = null; }
      else if (act === "abandon"){ it.status = "abandoned"; }
      it.updatedAt = new Date().toISOString();
    });
    rangee.remove();
    if (!els.panel.querySelectorAll(".arbrow").length){
      etat.meta.lastSasOn = auj; planifierEnregistrement(); terminerPanneau();
    }
  }
  $("sOk").onclick = () => {
    etat.meta.lastSasOn = auj; planifierEnregistrement(); terminerPanneau();
  };
}

/* --- Detection du changement de jour -------------------------------------
   Un intervalle d'une minute qui COMPARE une date, plutot qu'un minuteur
   calcule « d'ici a minuit ». Cette forme resiste a la mise en veille de
   l'ordinateur, au changement d'heure et au passage dans un autre fuseau. */
let jourConnu = "";
function verifierChangementDeJour(){
  const auj = dateAujourdhui();
  if (auj !== jourConnu){
    jourConnu = auj;
    const r = appliquerReport();
    if (r.deplacees.length) signaler(r.deplacees.length + " tâche(s) reportée(s) sur aujourd'hui.");
    semaineAffichee = dateLundi(auj);
    rendre();
    lancerSauvegardeAutoSiNecessaire();
    demarrerLaFileSiInactive();
  } else {
    rendreGrille();          // la ligne d'heure courante avance
  }
}

function lancerSauvegardeAutoSiNecessaire(){
  const s = etat.settings;
  if (!s.sauvegardeAuto || !stockageOK) return;
  const auj = dateAujourdhui();
  // On se cale sur la TENTATIVE, pas sur la confirmation : sinon une sauvegarde
  // jamais confirmee relancerait un telechargement a chaque ouverture.
  const dep = etat.meta.lastBackupTryOn ? dateEcart(etat.meta.lastBackupTryOn, auj) : 9999;
  if (dep < s.sauvegardeJours) return;
  if (!exporter(true)) return;

  if (verificationSauvegardeNecessaire()) enfilerPanneau(panneauVerifierSauvegarde);
  else signaler("Sauvegarde du jour déposée dans votre dossier Téléchargements.");
}

/* --- Sequence de demarrage ------------------------------------------------
   charger -> valider/migrer -> REPORT -> construire la vue -> rendre
   Le report n'est jamais declenche depuis le rendu.                        */
function demarrer(){
  initRefs();
  testerStockage();

  let paquet = storeLire();

  // On adopte le jeton en place : tout jeton different apparu ensuite designe
  // un autre onglet, et nos ecritures s'arretent aussitot.
  empreinteConnue = localStorage.getItem(K.stamp);

  // Fichier d'archive autonome : les donnees sont incluses dans la page.
  const archive = document.getElementById("donneesArchive");
  if (!paquet && archive){
    const v = valider(archive.textContent || "");
    if (v.ok) paquet = v.paquet;
  }

  const premierLancement = !paquet;
  etat = paquet ? hydrater(migrer(paquet)) : etatVide();

  appliquerReglages();
  brancherEvenements();
  brancherImportFichier();

  if (!stockageOK){
    signaler("Ce navigateur refuse d'enregistrer les données de cette page. Vos modifications seront perdues à la fermeture. " +
             "Vérifiez que vous n'êtes pas en navigation privée, et utilisez Chrome ou Edge.", "bad", true);
  }

  const auj = dateAujourdhui();
  jourConnu = auj;
  const lundiAuj = dateLundi(auj);
  semaineAffichee = lundiAuj;

  const rapport = appliquerReport();
  const arbitrer = tachesAArbitrer();
  const trainent = tachesQuiTrainent();
  const nouvelleSemaine = etat.meta.lastWeekReviewOn ? dateLundi(etat.meta.lastWeekReviewOn) < lundiAuj : true;

  rendre();
  els.notes.value = noteSemaine();

  // Ecrans de decision, presentes les uns apres les autres, jamais empiles.
  filePanneaux = [];
  if (premierLancement || !etat.meta.firstRunDone) enfilerPanneau(panneauBienvenue);
  if (rapport.deplacees.length >= etat.settings.reportSeuilTriage)
    enfilerPanneau(() => panneauTriage(rapport.deplacees, rapport.archivees));
  if (nouvelleSemaine && (arbitrer.length || trainent.length))
    enfilerPanneau(() => panneauArbitrage(arbitrer, trainent));
  if (etat.settings.sasActif && minutesMaintenant() >= etat.settings.sasHeure &&
      etat.meta.lastSasOn !== auj && !premierLancement)
    enfilerPanneau(panneauSas);

  if (rapport.deplacees.length && rapport.deplacees.length < etat.settings.reportSeuilTriage)
    signaler(rapport.deplacees.length + " tâche" + (rapport.deplacees.length > 1 ? "s" : "") +
             " reportée" + (rapport.deplacees.length > 1 ? "s" : "") + " sur aujourd'hui.");

  etat.meta.lastOpenOn = auj;
  enregistrerMaintenant();
  instantaner(etat);
  surveillerLeStockage();
  lancerSauvegardeAutoSiNecessaire();

  panneauSuivant();
  setInterval(verifierChangementDeJour, 60000);
}

/* --- Auto-test ------------------------------------------------------------
   Tapez autoTest() dans la console du navigateur (touche F12).
   Couvre les pieges de date : changement d'heure, fin d'annee, week-ends. */
function autoTest(){
  const r = [];
  const ok = (nom, a, b) => r.push((a === b ? "OK   " : "ECHEC") + "  " + nom +
    (a === b ? "" : "   attendu " + b + ", obtenu " + a));

  ok("dateCle sur une date connue", dateCle(new Date(2026, 8, 2)), "2026-09-02");
  ok("passage a l'heure d'hiver (25 h)", datePlus("2026-10-24", 1), "2026-10-25");
  ok("lendemain du changement d'heure", datePlus("2026-10-25", 1), "2026-10-26");
  ok("passage a l'heure d'ete (23 h)", datePlus("2026-03-28", 1), "2026-03-29");
  ok("fin d'annee", datePlus("2026-12-31", 1), "2027-01-01");
  ok("annee bissextile", datePlus("2028-02-28", 1), "2028-02-29");
  ok("recul d'un jour", datePlus("2026-01-01", -1), "2025-12-31");
  ok("ecart sur un changement d'heure", dateEcart("2026-10-24", "2026-10-26"), 2);
  ok("ecart sur une annee", dateEcart("2026-01-01", "2027-01-01"), 365);
  ok("lundi d'un mercredi", dateLundi("2026-09-02"), "2026-08-31");
  ok("lundi d'un dimanche", dateLundi("2026-09-06"), "2026-08-31");
  ok("lundi d'un lundi", dateLundi("2026-08-31"), "2026-08-31");
  ok("index du samedi", dateIndexJour("2026-09-05"), 5);
  ok("le dimanche est un week-end", dateEstWeekend("2026-09-06"), true);
  ok("le vendredi n'est pas un week-end", dateEstWeekend("2026-09-04"), false);
  ok("comparaison de chaines de jours", "2026-09-02" < "2026-09-10", true);
  ok("minutes vers heure", minVersHeure(570), "09:30");
  ok("heure vers minutes", heureVersMin("09:30"), 570);
  ok("semaine ISO du 1er janvier 2027", numeroSemaine("2027-01-01"), 53);
  ok("semaine ISO du 4 janvier 2027", numeroSemaine("2027-01-04"), 1);

  // Idempotence du report : deux passes doivent donner le meme resultat.
  const sauvegarde = JSON.stringify(etat.items);
  const auj = dateAujourdhui();
  const id = "test_" + Date.now();
  etat.items[id] = Object.assign({}, ITEM_DEFAUT, {
    id: id, title: "test", placement: "day", date: datePlus(auj, -9),
    origDate: datePlus(auj, -9), status: "open",
  });
  const memo = etat.meta.lastRolloverOn; etat.meta.lastRolloverOn = "";
  appliquerReport();
  const apres1 = etat.items[id].date, cpt1 = etat.items[id].rolloverCount;
  appliquerReport();
  const apres2 = etat.items[id].date, cpt2 = etat.items[id].rolloverCount;
  ok("le report vise aujourd'hui", apres1, auj);
  ok("le report ne rejoue pas (date)", apres2, apres1);
  ok("le report ne rejoue pas (compteur)", cpt2, cpt1);
  ok("une tache reportee perd son heure", etat.items[id].startMin, null);
  ok("la date d'origine n'est jamais modifiee", etat.items[id].origDate, datePlus(auj, -9));
  etat.items = JSON.parse(sauvegarde); etat.meta.lastRolloverOn = memo;

  // Integrite des sauvegardes
  const env = enveloppe(etat);
  ok("une sauvegarde saine est acceptee", valider(JSON.stringify(env)).ok, true);
  const abime = JSON.parse(JSON.stringify(env));
  abime.data.items["faux_" + Date.now()] = { id: "x", title: "injecte" };
  ok("une sauvegarde alteree est refusee", valider(JSON.stringify(abime)).ok, false);
  ok("un fichier etranger est refuse", valider('{"format":"autre chose"}').ok, false);
  ok("un texte illisible est refuse", valider("pas du json").ok, false);

  const echecs = r.filter(l => l.indexOf("ECHEC") === 0).length;
  console.log(r.join("\n"));
  console.log(echecs ? "\n>>> " + echecs + " test(s) en echec." : "\n>>> " + r.length + " tests, tous reussis.");
  return { total: r.length, echecs: echecs, details: r };
}
window.autoTest = autoTest;

document.addEventListener("DOMContentLoaded", demarrer);
</script>
