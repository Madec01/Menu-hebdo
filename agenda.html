<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de la semaine</title>
<!--
===============================================================================
  AGENDA SEMAINIER DE BUREAU — fichier unique, autonome, hors ligne
  Version 1.0.0

  TABLE DES MATIERES (cherchez [01], [02]... avec Ctrl+F)

    CSS
    [C1] VARIABLES ET THEMES
    [C2] STRUCTURE GENERALE
    [C3] EN-TETE ET BARRE D'OUTILS
    [C4] BANDEAU URGENT
    [C5] GRILLE DE LA SEMAINE
    [C6] ELEMENTS (taches et rendez-vous)
    [C7] BAS DE PAGE : NOTES ET PARKING
    [C8] PANNEAUX (reglages, arbitrage, sas, sauvegarde)
    [C9] IMPRESSION

    JAVASCRIPT
    [01] CONSTANTES ET CONFIGURATION
    [02] UTILITAIRES DE DATE   <- seul endroit autorise a manipuler des dates
    [03] SCHEMA, VALEURS PAR DEFAUT, MIGRATIONS
    [04] PERSISTANCE (ecriture A/B, instantanes, integrite)
    [05] ETAT ET MUTATIONS (commit, annulation)
    [06] METIER (report, priorites, arbitrage, sas de fin de journee)
    [07] SELECTEURS ET VUES DERIVEES
    [08] RENDU
    [09] EVENEMENTS
    [10] THEME ET REGLAGES
    [11] IMPORT / EXPORT / SAUVEGARDE
    [12] DEMARRAGE ET AUTO-TEST

  REGLE DE SURVIE DES DONNEES
    Ce fichier contient le programme, PAS vos donnees.
    Vos donnees sont rangees par le navigateur, dans un espace lie a ce fichier.
    Choisissez un dossier et un nom une bonne fois pour toutes.
    Utilisez Chrome ou Edge. Safari ne sait pas stocker pour un fichier local.
===============================================================================
-->
<style>
/* =========================================================================
   [C1] VARIABLES ET THEMES
   ========================================================================= */
:root{
  --accent:#3b6ea5;
  --slot-h:22px;
  --gutter:58px;
  --radius:7px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs:14px;

  --bg:#eef0f4;
  --surface:#ffffff;
  --surface-2:#f7f8fa;
  --surface-3:#eceef2;
  --border:#dfe3ea;
  --border-strong:#c7cdd8;
  --text:#1b1f24;
  --text-soft:#59616e;
  --text-faint:#8b93a1;
  --today:#fffdf3;
  --today-line:#d94f3d;

  --p-urgent:#cf3b30;
  --p-urgent-bg:#fdecea;
  --p-semaine:#c97b00;
  --p-semaine-bg:#fdf3e2;
  --p-libre:#7c8899;
  --p-libre-bg:#f0f2f6;

  --ok:#2e7d5b;
  --warn:#c97b00;
  --bad:#cf3b30;
  --shadow:0 1px 2px rgba(20,25,35,.06),0 4px 14px rgba(20,25,35,.06);
}
html[data-theme="sombre"]{
  --bg:#14171c;
  --surface:#1c2027;
  --surface-2:#22262e;
  --surface-3:#2a2f38;
  --border:#2e343e;
  --border-strong:#3d444f;
  --text:#e6e9ee;
  --text-soft:#a4acba;
  --text-faint:#767f8d;
  --today:#232019;
  --today-line:#e8695a;

  --p-urgent:#f0776a;
  --p-urgent-bg:#3a2320;
  --p-semaine:#e0a44a;
  --p-semaine-bg:#372c18;
  --p-libre:#9aa5b4;
  --p-libre-bg:#272c34;

  --ok:#5fbf95;
  --warn:#e0a44a;
  --bad:#f0776a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:var(--fs);line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* =========================================================================
   [C2] STRUCTURE GENERALE
   ========================================================================= */
/* Une colonne souple, et non une grille a rangees numerotees.
   La grille comptait quatre rangees pour six enfants, dont un — la barre
   d'alerte — apparait et disparait. Chaque apparition decalait donc toutes
   les rangees d'un cran : la rangee souple tombait sur le bandeau urgent, qui
   s'etirait, pendant que la grille des jours se tassait et que les pastilles
   urgentes se dessinaient par-dessus les en-tetes de jours. Il suffisait d'un
   avertissement « ouvert dans un autre onglet » pour casser tout l'ecran.
   Une colonne souple ne compte pas ses enfants : on peut en ajouter, en
   retirer, en masquer, la zone centrale reste la zone centrale. */
.app{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
}
.topbar,.alertbar,.urgentbar,.grabber,.bottom{flex:none}
.board{flex:1 1 auto;min-height:0}

/* =========================================================================
   [C3] EN-TETE ET BARRE D'OUTILS
   ========================================================================= */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;background:var(--surface);
  border-bottom:1px solid var(--border);
}
.nav{display:flex;align-items:center;gap:2px}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border:1px solid transparent;border-radius:var(--radius);
  background:transparent;color:var(--text-soft);
}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.weeklabel{font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.weeksub{color:var(--text-faint);font-size:12.5px;white-space:nowrap}
.btn{
  border:1px solid var(--border-strong);background:var(--surface);
  border-radius:var(--radius);padding:5px 11px;font-size:13px;font-weight:500;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-soft)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.spacer{flex:1}

.savechip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--text-faint);
  padding:4px 9px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--border);white-space:nowrap;
}
.savechip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.savechip[data-level="warn"]{color:var(--warn);border-color:var(--warn)}
.savechip[data-level="warn"] .dot{background:var(--warn)}
.savechip[data-level="bad"]{color:var(--bad);border-color:var(--bad)}
.savechip[data-level="bad"] .dot{background:var(--bad)}

.alertbar{
  padding:9px 14px;font-size:13px;background:var(--p-semaine-bg);
  color:var(--p-semaine);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.alertbar.grave{background:var(--p-urgent-bg);color:var(--p-urgent)}
.alertbar[hidden]{display:none}

/* =========================================================================
   [C4] BANDEAU URGENT
   ========================================================================= */
.urgentbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:7px 14px;display:flex;align-items:flex-start;gap:10px;min-height:40px;
}
.urgentbar .lab{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--p-urgent);padding-top:4px;
}
.urgentlist{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-items:flex-start}
.uchip{
  display:flex;align-items:center;gap:6px;
  background:var(--p-urgent-bg);border:1px solid transparent;
  border-radius:99px;padding:3px 10px 3px 6px;max-width:440px;
}
.uchip.done{opacity:.45}
.uchip .utitle{
  border:0;background:transparent;padding:0;min-width:40px;width:auto;
  font-size:13px;color:var(--p-urgent);font-weight:500;
}
.uchip .uday{font-size:11px;color:var(--p-urgent);opacity:.7;flex:none}
.emptyhint{color:var(--text-faint);font-size:12.5px;padding:5px 2px}

/* =========================================================================
   [C5] GRILLE DE LA SEMAINE
   ========================================================================= */
.board{
  display:grid;grid-template-rows:auto auto minmax(0,1fr);
  background:var(--surface);border-bottom:1px solid var(--border);
  min-height:0;
}
.row{display:grid;grid-template-columns:var(--gutter) repeat(var(--ncols),minmax(0,1fr))}
.board-head{border-bottom:1px solid var(--border);background:var(--surface)}
.gcell{border-right:1px solid var(--border);padding:6px 4px;text-align:right;color:var(--text-faint);font-size:11px}

.dayhead{
  border-right:1px solid var(--border);padding:6px 9px 5px;
  display:flex;align-items:baseline;gap:7px;
}
.dayhead:last-child{border-right:0}
.dayhead .dn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft)}
.dayhead .dd{font-size:16px;font-weight:650;letter-spacing:-.02em}
.dayhead .load{
  margin-left:auto;font-size:11px;color:var(--text-faint);
  background:var(--surface-3);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums;
}
.dayhead .load[data-level="warn"]{color:var(--warn);background:var(--p-semaine-bg)}
.is-today{background:var(--today)}
.is-today .dn{color:var(--today-line)}
.is-weekend{background:var(--surface-2)}
.is-today.is-weekend{background:var(--today)}

.board-bins{border-bottom:1px solid var(--border-strong);background:var(--surface)}
.binlabel{
  border-right:1px solid var(--border);padding:6px 5px;text-align:right;
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-faint);line-height:1.15;
}
.daybin{
  border-right:1px solid var(--border);padding:4px;min-height:46px;
  max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;
  scrollbar-width:thin;position:relative;
}
/* Un bac qui deborde doit le DIRE. Les navigateurs masquent leur barre de
   defilement au repos : sans repere, l'en-tete annoncait huit taches, le bac
   en montrait trois, et les cinq autres n'existaient pour personne. */
.daybin.deborde{border-bottom:2px solid var(--p-semaine)}
/* Colle en bas du bac : un repere qui defile avec le contenu qu'il annonce
   disparaitrait exactement quand on en a besoin. */
.binreste{
  position:sticky;bottom:0;z-index:3;
  flex:none;align-self:stretch;text-align:center;font-size:10px;font-weight:700;
  letter-spacing:.04em;color:var(--p-semaine);background:var(--p-semaine-bg);
  border:0;border-radius:4px;padding:2px;margin-top:1px;cursor:pointer;
}
.binreste:hover{filter:brightness(.95)}
.daybin:last-child{border-right:0}
.daybin.dropok{background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--accent)}

.board-scroll{overflow-y:auto;overflow-x:hidden;min-height:0}
.board-scroll .row{padding-top:8px}
.gutter{border-right:1px solid var(--border);position:relative}
.gutter .hlab{
  position:absolute;right:7px;font-size:11px;color:var(--text-faint);
  transform:translateY(-50%);font-variant-numeric:tabular-nums;
  background:var(--surface);padding:0 1px;
}
/* grid-template-columns est indispensable. Sans lui, les rendez-vous — qui ne
   recevaient qu'une rangee, jamais une colonne — etaient places par le
   navigateur dans des colonnes IMPLICITES creees a la volee, et l'espace se
   repartissait entre elles. Les pistes d'une journee a deux rendez-vous
   simultanes mesuraient « 0px 98px 98px » : la premiere piste, celle des
   quarante-huit cases horaires cliquables, tombait a zero. Des que deux
   rendez-vous se chevauchaient, la journee devenait donc impossible a cliquer
   pour en poser un troisieme. Aucun des controles ne creait deux rendez-vous
   simultanes, et le defaut a traverse toute la version 1.0.0. */
.daycol{
  border-right:1px solid var(--border);position:relative;
  display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:var(--slot-h);
}
.daycol:last-child{border-right:0}
.slot{border-bottom:1px solid var(--border);grid-column:1}
.slot.half{border-bottom-style:dashed;border-bottom-color:color-mix(in srgb,var(--border) 55%,transparent)}
.slot:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.slot.dropok{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.nowline{
  position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--today-line);
  z-index:5;pointer-events:none;
}
.nowline::before{
  content:"";position:absolute;left:-3px;top:-3.5px;width:7px;height:7px;
  border-radius:50%;background:var(--today-line);
}

/* =========================================================================
   [C6] ELEMENTS (taches et rendez-vous)
   ========================================================================= */
/* flex:0 0 auto — la declaration la plus importante de tout ce fichier.
   Les bacs « A faire » sont des colonnes flexibles. Sans elle, une tache prend
   la valeur par defaut flex-shrink:1 : des que le contenu du bac depasse, le
   navigateur COMPRIME les taches au lieu de les faire defiler. Mesure : une
   boite ecrasee a 34 pixels pour un texte qui en reclamait 53, le texte
   debordant par-dessus la tache suivante. « Appeler le comptable pour le
   bilan » se lisait « Appeler le comptable pour le ». Le champ de titre, lui,
   se dimensionnait correctement depuis toujours : c'est son conteneur qui
   l'ecrasait, et c'est pourquoi le controle qui mesurait le champ passait au
   vert sur un defaut visible a l'oeil nu. */
.item{
  flex:0 0 auto;
  display:flex;align-items:flex-start;gap:5px;
  background:var(--surface-2);border:1px solid var(--border);
  border-left:3px solid var(--p-libre);
  border-radius:5px;padding:2px 5px 2px 3px;min-height:20px;font-size:12.5px;
}
.item:hover{border-color:var(--border-strong)}
.item.p-urgent{border-left-color:var(--p-urgent);background:var(--p-urgent-bg)}
.item.p-semaine{border-left-color:var(--p-semaine);background:var(--p-semaine-bg)}
.item.done{opacity:.42}
.item.done .title{text-decoration:line-through}
.item.dragging{opacity:.35}
.item.stale .title{color:var(--text-faint)}
.item.stale{border-top:1px dashed var(--p-semaine);border-right:1px dashed var(--p-semaine);border-bottom:1px dashed var(--p-semaine)}

.item .grip{
  flex:none;width:11px;align-self:stretch;cursor:grab;opacity:0;
  background:radial-gradient(circle at 2.5px 2.5px,var(--text-faint) 1px,transparent 1.2px) 0 0/5px 5px;
  border-radius:3px;margin-top:3px;height:12px;
}
.item:hover .grip{opacity:.55}
.chk{flex:none;margin:2px 0 0;width:13px;height:13px;accent-color:var(--accent);cursor:pointer}
.item .title{
  flex:1;min-width:0;border:0;background:transparent;padding:1px 0;
  font-size:12.5px;line-height:1.35;font-family:inherit;
  resize:none;overflow:hidden;display:block;height:18px;
}
.item .title::placeholder{color:var(--text-faint)}
.item .roll{
  flex:none;font-size:10px;color:var(--p-semaine);background:transparent;
  border:0;padding:0 2px;cursor:help;font-variant-numeric:tabular-nums;
}
.item .pdot{
  flex:none;width:13px;height:13px;border-radius:50%;border:2px solid var(--p-libre);
  background:transparent;padding:0;margin-top:2px;
}
.item .pdot[data-p="urgent"]{border-color:var(--p-urgent);background:var(--p-urgent)}
.item .pdot[data-p="semaine"]{border-color:var(--p-semaine);background:var(--p-semaine)}
.del{
  flex:none;opacity:0;color:var(--text-faint);border:0;background:transparent;
  padding:0 3px;font-size:15px;line-height:1;border-radius:4px;
}
.item:hover .del{opacity:.7}
.uchip .del{opacity:.5}
.del:hover{color:var(--bad);opacity:1;background:var(--surface-3)}

/* Les rendez-vous sont poses en absolu dans la colonne du jour, et non places
   par la grille : c'est ce qui permet de leur donner un couloir quand ils se
   chevauchent, au lieu de laisser le navigateur inventer des colonnes qui
   ecrasent les cases cliquables. La colonne est deja position:relative. */
.item.slotitem{
  position:absolute;z-index:2;overflow:hidden;box-shadow:var(--shadow);
  box-sizing:border-box;margin:0;
}
.item.slotitem .title{font-size:12px}

/* Sur un rendez-vous, la decoration ne prend plus de place : elle se superpose.
   Poignee, pastille de priorite, croix et marqueur de report coutaient a eux
   seuls 84 pixels, une constante quelle que soit la largeur. Trois rendez-vous
   simultanes dans une colonne de 175 pixels donnent des couloirs de 54 : il ne
   restait donc RIEN pour le texte, mesure a zero pixel. Tout cela passe en
   position absolue, reste accessible au survol, et rend sa largeur au titre.
   Le titre complet et l'heure restent lisibles en infobulle, car un couloir
   etroit reste un couloir etroit : c'est la repartition de l'espace qui reglera
   le fond du probleme, pas ce correctif. */
.item.slotitem{padding:2px 3px 2px 10px}
.item.slotitem .grip{
  position:absolute;left:0;top:0;bottom:0;width:9px;height:auto;
  margin:0;border-radius:0;align-self:auto;
}
.item.slotitem .pdot{position:absolute;right:3px;bottom:2px;margin:0;opacity:0}
.item.slotitem .del{position:absolute;right:2px;top:1px}
.item.slotitem .roll{position:absolute;right:17px;top:2px}
.item.slotitem:hover .pdot{opacity:1}
.item.slotitem.p-urgent .pdot,.item.slotitem.p-semaine .pdot{opacity:1}

/* Couloir partage : la case a cocher elle-meme sort du flux. Elle revient au
   survol, et une fois cochee elle reste visible puisqu'elle porte alors une
   information. C'est le dernier element qui pouvait encore etre rendu au
   texte sans rien retirer a l'utilisateur. */
.item.slotitem.etroit .chk{position:absolute;right:3px;top:15px;margin:0;opacity:0}
.item.slotitem.etroit:hover .chk,.item.slotitem.etroit.done .chk{opacity:1}
.item.slotitem.etroit{padding-right:2px}
.resize{
  position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize;
}
.resize:hover{background:color-mix(in srgb,var(--accent) 35%,transparent)}

/* =========================================================================
   [C7] BAS DE PAGE : NOTES ET PARKING
   ========================================================================= */
.bottom{
  display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);
  background:var(--surface);border-top:1px solid var(--border-strong);
  height:var(--bottom-h,168px);
}
.pane{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.pane:last-child{border-right:0}
.paneheader{
  display:flex;align-items:center;gap:8px;padding:6px 12px;
  font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-faint);border-bottom:1px solid var(--border);
}
.paneheader .cnt{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}
#notes{
  flex:1;border:0;resize:none;padding:9px 12px;background:transparent;
  font-size:13px;line-height:1.55;
}
.parklist{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:3px}
.parklist.dropok{background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--accent)}
.grabber{height:5px;cursor:ns-resize;background:transparent;margin-top:-3px;position:relative;z-index:6}
.grabber:hover{background:color-mix(in srgb,var(--accent) 30%,transparent)}

/* =========================================================================
   [C8] PANNEAUX
   ========================================================================= */
.veil{
  position:fixed;inset:0;background:rgba(15,20,28,.42);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;
  z-index:50;overflow-y:auto;
}
.veil[hidden]{display:none}
.panel{
  background:var(--surface);border-radius:12px;box-shadow:0 12px 48px rgba(10,15,25,.28);
  width:100%;max-width:620px;overflow:hidden;
}
.panel.wide{max-width:760px}
.panelhead{
  padding:15px 20px 12px;border-bottom:1px solid var(--border);
}
.panelhead h2{margin:0;font-size:16px;letter-spacing:-.01em}
.panelhead p{margin:5px 0 0;font-size:13px;color:var(--text-soft);line-height:1.5}
.panelbody{padding:14px 20px;max-height:60vh;overflow-y:auto}
.panelfoot{
  padding:12px 20px;border-top:1px solid var(--border);background:var(--surface-2);
  display:flex;gap:8px;align-items:center;
}

.field{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.field:last-child{border-bottom:0}
.field label{flex:1;font-size:13px}
.field label small{display:block;color:var(--text-faint);font-size:11.5px;margin-top:2px;line-height:1.45}
.field input[type=number],.field input[type=time],.field select{
  border:1px solid var(--border-strong);border-radius:6px;padding:4px 7px;
  background:var(--surface);font-size:13px;
}
.field input[type=color]{width:38px;height:28px;padding:1px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface)}
.field input[type=range]{width:130px;accent-color:var(--accent)}
.switch{position:relative;width:38px;height:21px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch span{
  position:absolute;inset:0;border-radius:99px;background:var(--border-strong);
  transition:background .13s;pointer-events:none;
}
.switch span::after{
  content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:transform .13s;
}
.switch input:checked + span{background:var(--accent)}

<script>
"use strict";

/* =========================================================================
   [01] CONSTANTES ET CONFIGURATION
   ========================================================================= */
const APP_VERSION   = "1.0.0";
const SCHEMA_VERSION = 1;

/* Prefixe de toutes les cles de stockage.
   NE JAMAIS LE CHANGER : sous Chrome, tous les fichiers HTML locaux partagent
   le meme espace de stockage. Ce prefixe est ce qui isole cet agenda des
   autres pages locales, et ce qui relie une nouvelle version du fichier aux
   donnees deja enregistrees. */
const PREFIX = "agendaHebdo:";
const K = {
  slot:   PREFIX + "slot",      // "A" ou "B" : quel emplacement est actif
  dataA:  PREFIX + "dataA",
  dataB:  PREFIX + "dataB",
  probe:  PREFIX + "probe",
  snap:   PREFIX + "snap:",     // + AAAA-MM-JJ
  premig: PREFIX + "premigration:v",
  stamp:  PREFIX + "stamp",     // jeton de la derniere ecriture, pour detecter un autre onglet
  pool:   PREFIX + "pool:",     // + empreinte : reservoir de taches partage entre instantanes
};

const PRIO = {
  urgent:  { cle:"urgent",  nom:"Urgent",        court:"Urgent",     desc:"Dans le bandeau de la semaine" },
  semaine: { cle:"semaine", nom:"Cette semaine", court:"Semaine",    desc:"Doit etre fait avant dimanche" },
  libre:   { cle:"libre",   nom:"Quand je peux", court:"Quand je peux", desc:"Report libre" },
};
const PRIO_ORDRE = ["urgent","semaine","libre"];

const JOURS_COURTS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const JOURS_LONGS  = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const MOIS         = ["janvier","février","mars","avril","mai","juin","juillet",
                      "août","septembre","octobre","novembre","décembre"];

const MAX_UNDO = 25;
const SNAP_JOURS = 7;      // instantanes quotidiens conserves
const SNAP_SEMAINES = 4;   // instantanes hebdomadaires conserves

/* =========================================================================
   [02] UTILITAIRES DE DATE
   -------------------------------------------------------------------------
   REGLE ABSOLUE : aucune manipulation de date ailleurs que dans cette section.

   Un « jour » est toujours une chaine "AAAA-MM-JJ" en heure LOCALE.
   On ne se sert jamais de toISOString() pour fabriquer un jour : le soir, en
   heure d'ete, toISOString() renvoie deja la date du lendemain.
   On ne fait jamais d'arithmetique en millisecondes : les jours de changement
   d'heure font 23 ou 25 heures.
   Comparer deux jours = comparer deux chaines. Exact, sans fuseau, sans piege.
   ========================================================================= */
function dateCle(d){                       // Date -> "AAAA-MM-JJ" (local)
  const m = d.getMonth() + 1, j = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (j < 10 ? "0" : "") + j;
}
function dateAujourdhui(){ return dateCle(new Date()); }
function dateDepuisCle(cle){               // "AAAA-MM-JJ" -> Date locale a minuit
  const p = cle.split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function datePlus(cle, n){                 // decalage en jours, sur du calendrier
  const d = dateDepuisCle(cle);
  return dateCle(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n));
}
function dateEcart(a, b){                  // nombre de jours entiers de a vers b
  const da = dateDepuisCle(a), db = dateDepuisCle(b);
  return Math.round((db - da) / 86400000);
}
function dateLundi(cle){                   // lundi de la semaine contenant ce jour
  const d = dateDepuisCle(cle);
  const dow = (d.getDay() + 6) % 7;        // 0 = lundi ... 6 = dimanche
  return datePlus(cle, -dow);
}
function dateIndexJour(cle){ return (dateDepuisCle(cle).getDay() + 6) % 7; }
function dateEstWeekend(cle){ return dateIndexJour(cle) >= 5; }

function dateLisible(cle, avecAnnee){
  const d = dateDepuisCle(cle);
  return d.getDate() + " " + MOIS[d.getMonth()] + (avecAnnee ? " " + d.getFullYear() : "");
}
function dateLisibleLongue(cle){
  return JOURS_LONGS[dateIndexJour(cle)] + " " + dateLisible(cle, true);
}
function numeroSemaine(cle){               // numero ISO 8601
  const d = dateDepuisCle(cle);
  const j = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const premierJeudi = new Date(j.getFullYear(), 0, 4);
  const decal = (premierJeudi.getDay() + 6) % 7;
  const lundi1 = new Date(premierJeudi.getFullYear(), 0, 4 - decal);
  return 1 + Math.round((j - lundi1) / 604800000);
}
function heureVersMin(h){ const p = String(h).split(":"); return (+p[0]) * 60 + (+p[1] || 0); }
function minVersHeure(m){
  const h = Math.floor(m / 60), mm = m % 60;
  return (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm;
}
function minutesMaintenant(){ const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

/* =========================================================================
   [03] SCHEMA, VALEURS PAR DEFAUT, MIGRATIONS
   ========================================================================= */
const REGLAGES_DEFAUT = {
  theme: "clair",
  accent: "#3b6ea5",
  taillePolice: 14,
  hauteurCreneau: 22,
  hauteurBas: 168,
  debutJournee: 480,          // 08:00
  finJournee: 1140,           // 19:00
  afficherWeekend: true,
  seuilCharge: 8,             // au-dela, l'indicateur de charge passe orange
  reportActif: true,
  reportSauteWeekend: false,  // vendredi -> lundi au lieu de vendredi -> samedi
  reportAgeMax: 60,           // au-dela, la tache part au parking plutot que sur aujourd'hui
  reportSeuilTriage: 12,      // au-dela, ecran de rattrapage apres absence
  libreSeuilJours: 30,        // « quand je peux » signalee une fois passe ce delai
  sasActif: true,
  sasHeure: 1050,             // 17:30
  sauvegardeAuto: true,
  sauvegardeJours: 1,         // 1 = chaque jour, 7 = chaque semaine
};

const ITEM_DEFAUT = {
  id: "", kind: "task", title: "",
  placement: "day",           // "slot" | "day" | "week" | "park"
  date: "", startMin: null, durMin: 30,
  status: "open",             // "open" | "done" | "abandoned"
  doneAt: null,
  priority: "libre",
  note: "",
  createdAt: "", updatedAt: "",
  origDate: "",               // date de premiere planification, jamais modifiee
  rolloverCount: 0,
  lastRolloverOn: "",
  noRollover: false,
  weekOfOrigin: "",           // lundi de la semaine ou la priorite « semaine » a ete posee
  staleReviewedOn: "",        // date du dernier signalement « ca traine »
};

function etatVide(){
  const now = new Date().toISOString();
  return {
    schemaVersion: SCHEMA_VERSION,
    appVersion: APP_VERSION,
    meta: {
      createdAt: now, updatedAt: now,
      lastRolloverOn: "",
      lastBackupOn: "",       // derniere sauvegarde CONFIRMEE (fichier reellement arrive)
      lastBackupTryOn: "",    // derniere tentative : ne prouve rien a elle seule
      lastSasOn: "",
      lastWeekReviewOn: "", lastOpenOn: "", firstRunDone: false,
    },
    items: {},
    weekNotes: {},
    settings: Object.assign({}, REGLAGES_DEFAUT),
  };
}

/* Migrations : une fonction par saut de version, appliquees en chaine.
   migrations[1] transforme des donnees en version 1 vers la version 2, etc. */
const migrations = {
  // 1: (d) => { ... ; return d; },
};

function migrer(paquet){
  let d = paquet.data;
  let v = paquet.version || paquet.schemaVersion || 1;
  if (v < SCHEMA_VERSION){
    try { localStorage.setItem(K.premig + v, JSON.stringify(paquet)); } catch(e){}
    for (; v < SCHEMA_VERSION; v++){
      if (typeof migrations[v] === "function") d = migrations[v](d);
    }
  }
  return d;
}

/* Hydratation indulgente : on complete par les valeurs par defaut sans jamais
   supprimer un champ inconnu. Une version plus recente du fichier peut ainsi
   ecrire des champs qu'une version plus ancienne ne comprend pas, sans les
   detruire au premier aller-retour. */
function hydrater(brut){
  const e = etatVide();
  if (!brut || typeof brut !== "object") return e;
  e.meta      = Object.assign(e.meta, brut.meta || {});
  e.settings  = Object.assign(e.settings, brut.settings || {});
  e.weekNotes = brut.weekNotes || {};
  e.items = {};
  const src = brut.items || {};
  for (const id in src){
    const it = Object.assign({}, ITEM_DEFAUT, src[id]);
    it.id = id;
    if (!it.origDate) it.origDate = it.date;
    if (!it.createdAt) it.createdAt = e.meta.createdAt;
    if (it.done === true && it.status === "open") it.status = "done";  // ancien champ
    delete it.done;
    e.items[id] = it;
  }
  return e;
}

/* =========================================================================
   [04] PERSISTANCE
   -------------------------------------------------------------------------
   Trois protections superposees :
   1. Ecriture A/B : on ecrit toujours dans l'emplacement inactif, puis on
      bascule un pointeur. Une ecriture interrompue ou refusee ne peut donc
      jamais detruire l'etat precedent.
   2. Empreinte (checksum) + comptes : une sauvegarde tronquee est detectee.
   3. Instantanes tournants : 7 quotidiens + 4 hebdomadaires.
   ========================================================================= */
function empreinte(s){                      // FNV-1a, largement suffisant ici
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16);
}
function enveloppe(data){
  const p = {
    format: "agenda-hebdo",
    version: SCHEMA_VERSION,
    appVersion: APP_VERSION,
    savedAt: new Date().toISOString(),
    counts: { items: Object.keys(data.items).length, notes: Object.keys(data.weekNotes).length },
    data: data,
  };
  p.checksum = empreinte(JSON.stringify(p.data));
  return p;
}

let stockageOK = true;
function testerStockage(){
  try {
    localStorage.setItem(K.probe, "1");
    const ok = localStorage.getItem(K.probe) === "1";
    localStorage.removeItem(K.probe);
    stockageOK = ok;
  } catch(e){ stockageOK = false; }
  return stockageOK;
}

/* Jeton de la derniere ecriture connue de CET onglet.
   Deux onglets ouverts sur le meme agenda travaillent sur deux copies
   independantes de `etat`. Sans garde-fou, le second a fermer ecrit sa copie
   par-dessus tout le travail du premier : un onglet ouvert le matin et ferme
   le soir ramenait neuf taches a une. L'avertissement « ouvert dans un autre
   onglet » prevenait l'utilisateur mais n'empechait rien.
   On compare donc le jeton avant chaque ecriture. S'il a change, c'est qu'un
   autre onglet a enregistre depuis : on refuse d'ecrire, definitivement, et
   on le dit. Perdre les quelques minutes saisies dans l'onglet perime est
   toujours preferable a detruire la journee de l'autre. */
let empreinteConnue = null;
let ecritureBloquee = false;

function nouveauJeton(){
  return new Date().toISOString() + "#" + Math.random().toString(36).slice(2, 10);
}

function bloquerLesEcritures(){
  if (ecritureBloquee) return;
  ecritureBloquee = true;
  signalerBloquantAvecAction(
    "Cet agenda a été modifié dans un autre onglet. Pour ne pas écraser ce qui y a été fait, " +
    "cet onglet n'enregistre plus. Rechargez la page pour repartir des données les plus récentes.",
    "Afficher et copier",
    () => panneauCopie());
}

function storeEcrire(data){
  if (!stockageOK || ecritureBloquee) return false;

  /* Un autre onglet a-t-il ecrit depuis notre derniere lecture ou ecriture ?
     Une simple inegalite suffit et couvre les trois cas :
       null === null   -> premiere ecriture, ou donnees d'une version anterieure
                          au jeton : on laisse passer ;
       null !== jeton  -> un jeton est apparu sans que nous l'ayons ecrit :
                          quelqu'un d'autre est passe, on bloque ;
       jetonA !== jetonB -> un autre onglet a ecrit depuis, on bloque.
     Ce test synchrone est la vraie protection ; l'evenement `storage` ne fait
     que l'anticiper, et un evenement manque ne cree donc aucun trou. */
  if (localStorage.getItem(K.stamp) !== empreinteConnue){
    bloquerLesEcritures();
    return false;
  }

  const texte = JSON.stringify(enveloppe(data));
  const jeton = nouveauJeton();
  const actif = localStorage.getItem(K.slot) === "B" ? "B" : "A";
  const cible = actif === "A" ? "B" : "A";
  try {
    localStorage.setItem(cible === "A" ? K.dataA : K.dataB, texte);
    localStorage.setItem(K.stamp, jeton);
    localStorage.setItem(K.slot, cible);     // bascule atomique, en dernier
    empreinteConnue = jeton;
    return true;
  } catch(e){
    if (e && (e.name === "QuotaExceededError" || e.code === 22)){
      purgerInstantanes(true);
      try {
        localStorage.setItem(cible === "A" ? K.dataA : K.dataB, texte);
        localStorage.setItem(K.stamp, jeton);
        localStorage.setItem(K.slot, cible);
        empreinteConnue = jeton;
        return true;
      } catch(e2){}
    }
    signaler("Enregistrement impossible. Exportez vos données tout de suite.", "bad", true);
    return false;
  }
}

/* On ne fait PAS confiance au seul pointeur `slot`. S'il est perdu ou
   incoherent — quota qui refuse la derniere ecriture, effacement partiel,
   ancienne version du fichier — se rabattre aveuglement sur "A" peut
   renvoyer l'emplacement le PLUS ANCIEN et faire disparaitre le travail
   du jour. Chaque enveloppe porte deja son `savedAt` : on valide les deux
   emplacements et on garde le plus recent. Le pointeur ne sert plus qu'a
   departager deux enveloppes de meme date, ce qui n'arrive qu'entre deux
   ecritures de la meme milliseconde. */
function storeLire(){
  if (!stockageOK) return null;
  const actif = localStorage.getItem(K.slot) === "B" ? "B" : "A";
  const candidats = [];
  for (const [nom, cle] of [["A", K.dataA], ["B", K.dataB]]){
    const texte = localStorage.getItem(cle);
    if (!texte) continue;
    const v = valider(texte);
    if (v.ok) candidats.push({ nom: nom, paquet: v.paquet, quand: v.paquet.savedAt || "" });
  }
  if (!candidats.length) return null;
  candidats.sort((a, b) => {
    if (a.quand !== b.quand) return a.quand < b.quand ? 1 : -1;   // le plus recent d'abord
    return (a.nom === actif ? -1 : 1);                            // a egalite, le pointeur tranche
  });
  return candidats[0].paquet;
}

/* Cinq controles en cascade AVANT la moindre ecriture.
   Utilise aussi bien a la lecture qu'a l'import d'un fichier de sauvegarde. */
function valider(texte){
  let p;
  try { p = JSON.parse(texte); }
  catch(e){ return { ok:false, msg:"Fichier illisible : ce n'est pas un fichier JSON valide." }; }
  if (!p || p.format !== "agenda-hebdo")
    return { ok:false, msg:"Ce fichier n'est pas une sauvegarde de l'agenda." };
  if ((p.version || 1) > SCHEMA_VERSION)
    return { ok:false, msg:"Cette sauvegarde vient d'une version plus récente de l'agenda. Ouvrez la dernière version du fichier pour la lire." };
  if (!p.data || typeof p.data.items !== "object" || p.data.items === null)
    return { ok:false, msg:"Sauvegarde incomplète : les tâches sont absentes." };
  if (p.checksum && p.checksum !== empreinte(JSON.stringify(p.data)))
    return { ok:false, msg:"Sauvegarde corrompue : l'empreinte de contrôle ne correspond pas." };
  if (p.counts && typeof p.counts.items === "number" &&
      p.counts.items !== Object.keys(p.data.items).length)
    return { ok:false, msg:"Sauvegarde tronquée : le nombre de tâches ne correspond pas." };
  return { ok:true, paquet:p };
}

/* INSTANTANES : ONZE COPIES, OU UNE SEULE ?
   -------------------------------------------------------------------------
   Chaque instantane conservait l'integralite des taches. Avec sept
   quotidiens, quatre hebdomadaires et les deux emplacements A/B, chaque
   tache etait donc rangee TREIZE fois. Mesure faite dans un vrai navigateur :
   406 octets par tache, 5 025 Ko de quota, saturation vers 970 taches, soit
   environ un an d'usage. Les instantanes provoquaient exactement la panne
   qu'ils etaient censes prevenir.

   Or d'un jour sur l'autre, l'immense majorite des taches ne bouge pas. On
   les range donc UNE fois dans un reservoir commun, adresse par l'empreinte
   de leur contenu ; un instantane n'est plus qu'une liste de renvois vers ce
   reservoir. Onze instantanes d'un agenda stable coutent alors a peine plus
   qu'un seul.

   L'empreinte est un FNV-1a sur 32 bits : deux contenus differents peuvent
   tres rarement la partager. On ne s'en remet donc jamais a elle seule — a
   l'ecriture, si la case est deja prise par un contenu DIFFERENT, on prend la
   case suivante. La cle finale est stockee dans l'instantane, si bien qu'une
   collision ne peut jamais renvoyer la mauvaise tache. */

function clePourItem(json){
  const base = K.pool + empreinte(json) + "-" + json.length;
  for (let n = 0; n < 50; n++){
    const cle = n === 0 ? base : base + "#" + n;
    const dedans = localStorage.getItem(cle);
    if (dedans === null || dedans === json) return { cle: cle, aEcrire: dedans === null };
  }
  return null;                                    // 50 collisions exactes : on renonce
}

function instantaner(data){
  if (!stockageOK) return;
  const jour = dateAujourdhui();
  const cle = K.snap + jour;
  if (localStorage.getItem(cle)) return;          // un seul par jour

  try {
    const renvois = {};
    for (const id in data.items){
      const json = JSON.stringify(data.items[id]);
      const place = clePourItem(json);
      if (!place) return;                         // on prefere pas d'instantane a un instantane faux
      if (place.aEcrire) localStorage.setItem(place.cle, json);
      renvois[id] = place.cle;
    }
    localStorage.setItem(cle, JSON.stringify({
      format: "agenda-hebdo-instantane",
      version: SCHEMA_VERSION,
      appVersion: APP_VERSION,
      savedAt: new Date().toISOString(),
      refs: renvois,
      weekNotes: data.weekNotes,
      meta: data.meta,
      settings: data.settings,
    }));
  } catch(e){}
  purgerInstantanes(false);
}

/* Reconstruit un instantane sous la forme d'une enveloppe ordinaire, celle
   que valider() et le reste de l'application savent lire. Accepte aussi les
   instantanes complets ecrits par les versions anterieures. */
function lireInstantane(jour){
  const texte = localStorage.getItem(K.snap + jour);
  if (!texte) return { ok:false, msg:"Cet instantané n'existe plus." };

  let p;
  try { p = JSON.parse(texte); }
  catch(e){ return { ok:false, msg:"Instantané illisible." }; }

  if (p.format !== "agenda-hebdo-instantane") return valider(texte);   // ancien format complet

  const items = {};
  let manquantes = 0;
  for (const id in p.refs){
    const json = localStorage.getItem(p.refs[id]);
    if (json === null){ manquantes++; continue; }
    try { items[id] = JSON.parse(json); } catch(e){ manquantes++; }
  }
  if (manquantes){
    return { ok:false, msg:"Instantané incomplet : " + manquantes + " tâche(s) introuvable(s) dans le réservoir. " +
                           "Choisissez un autre instantané, ou un fichier de sauvegarde." };
  }
  return valider(JSON.stringify(enveloppe({
    schemaVersion: p.version, appVersion: p.appVersion,
    meta: p.meta, items: items, weekNotes: p.weekNotes, settings: p.settings,
  })));
}

function listerInstantanes(){
  const out = [];
  for (let i = 0; i < localStorage.length; i++){
    const c = localStorage.key(i);
    if (c && c.indexOf(K.snap) === 0) out.push(c.slice(K.snap.length));
  }
  return out.sort().reverse();
}

function purgerInstantanes(agressif){
  const jours = listerInstantanes();
  const garder = new Set(jours.slice(0, agressif ? 2 : SNAP_JOURS));
  if (!agressif){
    const semainesVues = new Set();
    for (const j of jours){
      const l = dateLundi(j);
      if (!semainesVues.has(l) && semainesVues.size < SNAP_SEMAINES){ semainesVues.add(l); garder.add(j); }
    }
  }
  for (const j of jours) if (!garder.has(j)) { try { localStorage.removeItem(K.snap + j); } catch(e){} }
  ramasserLeReservoir();
}

/* Le stockage d'un navigateur n'est pas extensible. Mieux vaut prevenir un an
   avant la panne que la constater le jour ou plus rien ne s'enregistre :
   l'agenda ne supprime jamais rien tout seul, c'est donc a l'utilisateur de
   decider, et il lui faut du temps pour cela. */
const SEUIL_ALERTE_STOCKAGE = 0.75;
let stockageDejaSignale = false;
function surveillerLeStockage(){
  if (!stockageOK || stockageDejaSignale) return;
  let octets = 0;
  for (let i = 0; i < localStorage.length; i++){
    const c = localStorage.key(i);
    if (!c || c.indexOf(PREFIX) !== 0) continue;
    octets += c.length + (localStorage.getItem(c) || "").length;
  }
  // Les navigateurs accordent 5 Mo par espace de stockage, comptes en UTF-16.
  const part = (octets * 2) / (5 * 1024 * 1024);
  if (part < SEUIL_ALERTE_STOCKAGE) return;
  stockageDejaSignale = true;
  signalerBloquantAvecAction(
    "L'espace de rangement de cet agenda est occupé à " + Math.round(part * 100) + " %. " +
    "Au-delà, il ne pourra plus enregistrer. Exportez une sauvegarde, puis envoyez au parking " +
    "ou abandonnez ce dont vous n'avez plus besoin. Rien ne sera supprimé sans vous.",
    "Sauvegarder maintenant",
    () => panneauSauvegarde());
}

/* Une tache du reservoir n'est plus utile des qu'aucun instantane ne la
   designe. Sans ce ramassage, le reservoir grossirait sans fin et l'on aurait
   simplement deplace le probleme. */
function ramasserLeReservoir(){
  const vivantes = new Set();
  for (const j of listerInstantanes()){
    try {
      const p = JSON.parse(localStorage.getItem(K.snap + j) || "{}");
      if (p.refs) for (const id in p.refs) vivantes.add(p.refs[id]);
    } catch(e){}
  }
  const aJeter = [];
  for (let i = 0; i < localStorage.length; i++){
    const c = localStorage.key(i);
    if (c && c.indexOf(K.pool) === 0 && !vivantes.has(c)) aJeter.push(c);
  }
  for (const c of aJeter) { try { localStorage.removeItem(c); } catch(e){} }
}

/* =========================================================================
   [05] ETAT ET MUTATIONS
   -------------------------------------------------------------------------
   `etat` est l'unique source de verite. Le DOM ne stocke aucune donnee,
   seulement des attributs data-id qui pointent vers elle.
   Toute modification passe par commit() : un seul endroit a surveiller.
   ========================================================================= */
let etat = etatVide();
let semaineAffichee = dateLundi(dateAujourdhui());
let pileAnnulation = [];
let sauvegardeEnAttente = null;
let dernierEnregistrement = 0;
let idEnEdition = null;          // element en cours de saisie : jamais re-rendu

function nouvelId(){
  return "i_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6);
}

function commit(libelle, fn, options){
  const opt = options || {};
  if (!opt.sansAnnulation){
    pileAnnulation.push({ libelle: libelle, instantane: JSON.stringify({
      items: etat.items, weekNotes: etat.weekNotes
    }) });
    if (pileAnnulation.length > MAX_UNDO) pileAnnulation.shift();
  }
  fn(etat);
  etat.meta.updatedAt = new Date().toISOString();
  planifierEnregistrement();
  if (!opt.sansRendu) rendre(opt.zone);
}

function annuler(){
  const e = pileAnnulation.pop();
  if (!e){ signaler("Rien à annuler."); return; }
  const snap = JSON.parse(e.instantane);
  etat.items = snap.items;
  etat.weekNotes = snap.weekNotes;
  etat.meta.updatedAt = new Date().toISOString();
  planifierEnregistrement();
  rendre();
  signaler("Annulé : " + e.libelle);
}

function planifierEnregistrement(){
  clearTimeout(sauvegardeEnAttente);
  sauvegardeEnAttente = setTimeout(enregistrerMaintenant, 400);
}
function enregistrerMaintenant(){
  clearTimeout(sauvegardeEnAttente);
  sauvegardeEnAttente = null;
  if (storeEcrire(etat)){ dernierEnregistrement = Date.now(); majPastilleSauvegarde(); }
}

/* =========================================================================
   [06] METIER : report, priorites, arbitrage, sas de fin de journee
   ========================================================================= */
/* Un element pose sur un creneau horaire EST un rendez-vous. C'est son
   emplacement qui le dit, et rien d'autre.

   Le schema prevoit un champ `kind`, mais AUCUN code de production ne lui a
   jamais donne d'autre valeur que sa valeur par defaut "task". Le test
   `kind === "task"` etait donc toujours vrai : il laissait passer les
   rendez-vous, qui se trouvaient reportes et perdaient leur heure, contre ce
   qu'annoncent le README et le mode d'emploi. Le champ est conserve dans le
   schema pour ne rien detruire dans les donnees existantes, mais plus aucune
   decision ne s'appuie dessus. */
function estUnRendezVous(it){ return it.placement === "slot"; }

function estReportable(it){
  return !estUnRendezVous(it)
      && it.status === "open"
      && !it.noRollover
      && it.placement === "day";
}

/* Cible du report : TOUJOURS aujourd'hui, jamais « demain ».
   C'est ce qui rend l'operation idempotente : apres une passe, plus aucune
   tache n'a de date anterieure a aujourd'hui, donc une seconde passe ne fait
   rien. Ouvrir la page dix fois donne exactement le meme resultat, et une
   absence de six semaines coute le meme calcul qu'une absence d'un jour. */
function appliquerReport(){
  if (!etat.settings.reportActif) return { deplacees: [], archivees: [] };
  const auj = dateAujourdhui();

  // Horloge systeme incoherente : on ne reporte jamais vers le passe.
  if (etat.meta.lastRolloverOn && auj < etat.meta.lastRolloverOn){
    signaler("La date de votre ordinateur semble antérieure à la dernière ouverture. Aucun report appliqué.", "warn", true);
    return { deplacees: [], archivees: [] };
  }

  let cible = auj;
  if (etat.settings.reportSauteWeekend && dateEstWeekend(auj)){
    cible = datePlus(auj, dateIndexJour(auj) === 5 ? 2 : 1);
  }

  const deplacees = [], archivees = [];
  for (const id in etat.items){
    const it = etat.items[id];
    if (!estReportable(it) || !it.date || it.date >= cible) continue;

    const age = dateEcart(it.origDate || it.date, auj);
    if (age > etat.settings.reportAgeMax){
      it.placement = "park"; it.startMin = null;
      it.updatedAt = new Date().toISOString();
      archivees.push(it);
      continue;
    }
    deplacees.push({ item: it, depuis: it.date });
    it.date = cible;
    it.placement = "day";
    it.startMin = null;             // une tache reportee perd son heure : elle ne
                                    // doit pas atterrir sur un creneau deja occupe
    if (it.lastRolloverOn !== auj){ it.rolloverCount = (it.rolloverCount || 0) + 1; it.lastRolloverOn = auj; }
    it.updatedAt = new Date().toISOString();
  }

  // Les urgences posees dans une semaine passee suivent la semaine courante.
  const lundiAuj = dateLundi(auj);
  for (const id in etat.items){
    const it = etat.items[id];
    if (it.placement === "week" && it.status === "open" && it.date < lundiAuj){
      it.date = lundiAuj;
      it.updatedAt = new Date().toISOString();
    }
  }

  etat.meta.lastRolloverOn = auj;
  return { deplacees, archivees };
}

/* Taches « cette semaine » restees ouvertes apres le dimanche : elles ne
   franchissent pas le week-end sans decision de votre part. */
function tachesAArbitrer(){
  const lundiAuj = dateLundi(dateAujourdhui());
  const out = [];
  for (const id in etat.items){
    const it = etat.items[id];
    if (it.status !== "open" || estUnRendezVous(it)) continue;
    if (it.priority !== "semaine") continue;
    const semOrigine = it.weekOfOrigin || dateLundi(it.origDate || it.date);
    if (semOrigine < lundiAuj) out.push(it);
  }
  return out.sort((a, b) => (a.weekOfOrigin || "").localeCompare(b.weekOfOrigin || ""));
}

/* Taches « quand je peux » qui trainent depuis plus de N jours : signalees
   une seule fois, jamais supprimees automatiquement. */
function tachesQuiTrainent(){
  const auj = dateAujourdhui();
  const out = [];
  for (const id in etat.items){
    const it = etat.items[id];
    if (it.status !== "open" || estUnRendezVous(it) || it.priority !== "libre") continue;
    if (it.placement === "park") continue;
    if (dateEcart(it.origDate || it.date, auj) < etat.settings.libreSeuilJours) continue;
    if (it.staleReviewedOn && dateEcart(it.staleReviewedOn, auj) < 14) continue;
    out.push(it);
  }
  return out;
}

function definirPriorite(it, prio){
  it.priority = prio;
  if (prio === "semaine") it.weekOfOrigin = dateLundi(dateAujourdhui());
  if (prio === "urgent" && it.placement !== "week" && !it.date) it.date = dateAujourdhui();
  it.staleReviewedOn = "";
  it.updatedAt = new Date().toISOString();
}
function prioriteSuivante(p){
  const i = PRIO_ORDRE.indexOf(p);
  return PRIO_ORDRE[(i + 1) % PRIO_ORDRE.length];
}

/* =========================================================================
   [07] SELECTEURS ET VUES DERIVEES
   -------------------------------------------------------------------------
   Fonctions pures : elles lisent l'etat, ne le modifient jamais et ne
   touchent jamais au DOM. La grille 7 x 48 n'existe pas en donnees, elle est
   recalculee ici a chaque affichage par regroupement des elements.
   ========================================================================= */
function joursAffiches(){
  const n = etat.settings.afficherWeekend ? 7 : 5;
  const out = [];
  for (let i = 0; i < n; i++) out.push(datePlus(semaineAffichee, i));
  return out;
}
function nbCreneaux(){
  return Math.max(1, Math.round((etat.settings.finJournee - etat.settings.debutJournee) / 30));
}
function tousLesItems(){ return Object.keys(etat.items).map(id => etat.items[id]); }

function itemsDuJour(jour, placement){
  return tousLesItems()
    .filter(it => it.date === jour && it.placement === placement && it.status !== "abandoned")
    .sort(comparerItems);
}
function itemsUrgents(){
  const jours = joursAffiches();
  return tousLesItems()
    .filter(it => it.status !== "abandoned" && it.priority === "urgent" &&
                  (it.placement === "week" ? it.date === semaineAffichee : jours.indexOf(it.date) >= 0))
    .sort(comparerItems);
}
function itemsParking(){
  return tousLesItems()
    .filter(it => it.placement === "park" && it.status !== "abandoned")
    .sort(comparerItems);
}
function comparerItems(a, b){
  if ((a.status === "done") !== (b.status === "done")) return a.status === "done" ? 1 : -1;
  if (a.placement === "slot" && b.placement === "slot") return (a.startMin || 0) - (b.startMin || 0);
  const estReporte = it => (it.rolloverCount || 0) > 0 ? 0 : 1;
  if (estReporte(a) !== estReporte(b)) return estReporte(a) - estReporte(b);
  const pa = PRIO_ORDRE.indexOf(a.priority), pb = PRIO_ORDRE.indexOf(b.priority);
  if (pa !== pb) return pa - pb;
  return (a.createdAt || "").localeCompare(b.createdAt || "");
}
function chargeDuJour(jour){
  return tousLesItems().filter(it =>
    it.date === jour && it.status === "open" &&
    (it.placement === "day" || it.placement === "slot")).length;
}
function noteSemaine(){
  const n = etat.weekNotes[semaineAffichee];
  return n ? (n.text || "") : "";
}

/* =========================================================================
   [08] RENDU
   -------------------------------------------------------------------------
   Principe : le squelette de la grille (colonnes, creneaux vides) est
   construit UNE fois. Ensuite on re-rend une zone entiere a la fois, ce qui
   est a la fois plus simple et assez rapide (quelques dixiemes de
   milliseconde). Regle mnemotechnique :
       on re-rend tout, sauf ce que l'utilisateur est en train de toucher.
   ========================================================================= */
const els = {};
function $(id){ return document.getElementById(id); }

function initRefs(){
  ["boardHead","boardBins","boardGrid","boardScroll","urgentList","parkList","notes",
   "weekLabel","weekSub","saveChip","saveText","alertBar","alertText","alertAction","alertClose",
   "veil","panel","toast","toastText","toastAction","live","fileInput","notesCnt","parkCnt",
   "printhead","grabber"].forEach(id => { els[id] = $(id); });
}

let squeletteSignature = "";
function construireSquelette(){
  const jours = joursAffiches();
  const n = nbCreneaux();
  const sig = jours.length + "|" + n + "|" + etat.settings.debutJournee;
  document.documentElement.style.setProperty("--ncols", jours.length);
  if (sig === squeletteSignature) return;
  squeletteSignature = sig;

  // Bacs « A faire »
  els.boardBins.innerHTML = "";
  const lab = document.createElement("div");
  lab.className = "binlabel"; lab.textContent = "À faire";
  els.boardBins.appendChild(lab);
  jours.forEach((j, i) => {
    const b = document.createElement("div");
    b.className = "daybin"; b.dataset.jour = j; b.dataset.col = i;
    els.boardBins.appendChild(b);
  });

  // Grille horaire
  els.boardGrid.innerHTML = "";
  const gut = document.createElement("div");
  gut.className = "gutter";
  gut.style.height = (n * etat.settings.hauteurCreneau) + "px";
  for (let s = 0; s <= n; s++){
    const m = etat.settings.debutJournee + s * 30;
    if (m % 60 !== 0) continue;
    const l = document.createElement("div");
    l.className = "hlab";
    l.style.top = (s * etat.settings.hauteurCreneau) + "px";
    l.textContent = minVersHeure(m);
    gut.appendChild(l);
  }
  els.boardGrid.appendChild(gut);

  jours.forEach((j, i) => {
    const col = document.createElement("div");
    col.className = "daycol"; col.dataset.jour = j; col.dataset.col = i;
    col.style.gridTemplateRows = "repeat(" + n + ", var(--slot-h))";
    const frag = document.createDocumentFragment();
    for (let s = 0; s < n; s++){
      const m = etat.settings.debutJournee + s * 30;
      const cell = document.createElement("div");
      cell.className = "slot" + (m % 60 === 30 ? " half" : "");
      cell.style.gridRow = (s + 1);
      cell.dataset.min = m;
      frag.appendChild(cell);
    }
    col.appendChild(frag);
    els.boardGrid.appendChild(col);
  });
}

function rendre(zone){
  construireSquelette();
  if (!zone || zone === "entete")  rendreEntete();
  if (!zone || zone === "urgent")  rendreUrgent();
  if (!zone || zone === "grille")  { rendreEnTetesJours(); rendreBacs(); rendreGrille(); }
  if (!zone || zone === "bas")     { rendreNotes(); rendreParking(); }
  ajusterTousLesTitres();
  majPastilleSauvegarde();
}

function rendreEntete(){
  const jours = joursAffiches();
  const fin = jours[jours.length - 1];
  els.weekLabel.textContent = "Semaine " + numeroSemaine(semaineAffichee);
  const memeMois = dateDepuisCle(semaineAffichee).getMonth() === dateDepuisCle(fin).getMonth();
  els.weekSub.textContent = memeMois
    ? dateDepuisCle(semaineAffichee).getDate() + " – " + dateLisible(fin, true)
    : dateLisible(semaineAffichee, false) + " – " + dateLisible(fin, true);
  els.printhead.textContent = "Semaine " + numeroSemaine(semaineAffichee) + " · " +
    dateLisible(semaineAffichee, false) + " au " + dateLisible(fin, true);
}

function rendreEnTetesJours(){
  const auj = dateAujourdhui();
  els.boardHead.innerHTML = "";
  const g = document.createElement("div");
  g.className = "gcell"; g.textContent = "";
  els.boardHead.appendChild(g);
  joursAffiches().forEach((j, i) => {
    const d = document.createElement("div");
    d.className = "dayhead" + (j === auj ? " is-today" : "") + (dateEstWeekend(j) ? " is-weekend" : "");
    const charge = chargeDuJour(j);
    d.innerHTML = "";
    const dn = document.createElement("span"); dn.className = "dn"; dn.textContent = JOURS_COURTS[dateIndexJour(j)];
    const dd = document.createElement("span"); dd.className = "dd"; dd.textContent = dateDepuisCle(j).getDate();
    d.appendChild(dn); d.appendChild(dd);
    if (charge > 0){
      const c = document.createElement("span");
      c.className = "load"; c.textContent = charge;
      if (charge > etat.settings.seuilCharge) c.dataset.level = "warn";
      c.title = charge + " tâche" + (charge > 1 ? "s" : "") + " ouverte" + (charge > 1 ? "s" : "");
      d.appendChild(c);
    }
    els.boardHead.appendChild(d);
  });
}

function rendreBacs(){
  const auj = dateAujourdhui();
  els.boardBins.querySelectorAll(".daybin").forEach((bin, i) => {
    const jour = joursAffiches()[i];
    bin.dataset.jour = jour;
    bin.className = "daybin" + (jour === auj ? " is-today" : "") + (dateEstWeekend(jour) ? " is-weekend" : "");
    const frag = document.createDocumentFragment();
    itemsDuJour(jour, "day").forEach(it => frag.appendChild(elementItem(it, "bin")));
    bin.replaceChildren(frag);
  });
  ajusterTousLesTitres(els.boardBins);
  signalerLesBacsQuiDebordent();
}

/* Combien de taches sont hors du cadre, et un bouton pour aller les voir.
   Tant que le bac est plafonne, c'est le seul moyen honnete de ne pas laisser
   croire qu'une journee est plus legere qu'elle ne l'est. */
function signalerLesBacsQuiDebordent(){
  els.boardBins.querySelectorAll(".daybin").forEach(bin => {
    const ancien = bin.querySelector(".binreste");
    if (ancien) ancien.remove();
    bin.classList.remove("deborde");
    if (bin.scrollHeight <= bin.clientHeight + 1) return;

    const bas = bin.scrollTop + bin.clientHeight;
    let caches = 0;
    bin.querySelectorAll(".item").forEach(el => {
      if (el.offsetTop + el.offsetHeight > bas + 1) caches++;
    });
    if (!caches) return;

    bin.classList.add("deborde");
    const b = document.createElement("button");
    b.className = "binreste";
    b.textContent = "+ " + caches + " autre" + (caches > 1 ? "s" : "");
    b.title = caches + " tâche" + (caches > 1 ? "s" : "") + " de plus dans ce jour — cliquez pour les faire défiler";
    b.onclick = () => { bin.scrollTop = bin.scrollHeight; };
    bin.appendChild(b);
  });
}

/* Des rendez-vous qui se chevauchent se partagent la largeur du jour.
   On avance dans l'ordre des heures. Tant qu'un rendez-vous commence avant la
   fin du groupe en cours, il appartient a ce groupe et prend le premier
   couloir libre — celui d'un voisin deja termine se recycle, si bien que
   trois rendez-vous qui se suivent en se touchant n'occupent pas trois
   couloirs. Quand un rendez-vous commence apres la fin de tout le groupe, le
   groupe est clos : sa largeur est fixee, et un nouveau groupe commence.
   Chaque groupe est donc dimensionne independamment, et un seul chevauchement
   a 9 h ne retrecit pas les rendez-vous de l'apres-midi. */
function repartirEnCouloirs(poses){
  poses.sort((a, b) => (a.debut - b.debut) || (a.fin - b.fin));
  let groupe = [], finGroupe = -Infinity;
  const clore = () => {
    let n = 1;
    for (const p of groupe) n = Math.max(n, p.couloir + 1);
    for (const p of groupe) p.couloirs = n;
    groupe = [];
  };
  for (const p of poses){
    if (groupe.length && p.debut >= finGroupe){ clore(); finGroupe = -Infinity; }
    const pris = new Set();
    for (const q of groupe) if (q.fin > p.debut) pris.add(q.couloir);
    let c = 0; while (pris.has(c)) c++;
    p.couloir = c;
    groupe.push(p);
    finGroupe = Math.max(finGroupe, p.fin);
  }
  if (groupe.length) clore();
}

function rendreGrille(){
  const auj = dateAujourdhui();
  const deb = etat.settings.debutJournee, n = nbCreneaux();
  els.boardGrid.querySelectorAll(".daycol").forEach((col, i) => {
    const jour = joursAffiches()[i];
    col.dataset.jour = jour;
    col.classList.toggle("is-today", jour === auj);
    col.classList.toggle("is-weekend", dateEstWeekend(jour));
    col.querySelectorAll(".slotitem, .nowline").forEach(e => e.remove());

    const fin = etat.settings.finJournee;
    const h = etat.settings.hauteurCreneau;
    const poses = itemsDuJour(jour, "slot").map(it => {
      const d = it.startMin == null ? deb : it.startMin;
      return { it: it, debut: d, fin: d + Math.max(15, it.durMin || 30) };
    }).filter(p => p.fin > deb && p.debut < fin);

    repartirEnCouloirs(poses);

    poses.forEach(p => {
      const haut = Math.max(deb, p.debut), bas = Math.min(fin, p.fin);
      const el = elementItem(p.it, "slot");
      if (p.couloirs > 1) el.classList.add("etroit");
      el.style.top    = ((haut - deb) / 30 * h) + "px";
      el.style.height = Math.max(14, (bas - haut) / 30 * h - 2) + "px";
      el.style.left   = (p.couloir / p.couloirs * 100) + "%";
      el.style.width  = "calc(" + (100 / p.couloirs) + "% - 4px)";
      col.appendChild(el);
    });

    if (jour === auj){
      const m = minutesMaintenant();
      if (m >= deb && m <= etat.settings.finJournee){
        const l = document.createElement("div");
        l.className = "nowline";
        l.style.top = ((m - deb) / 30 * etat.settings.hauteurCreneau) + "px";
        l.title = "Il est " + minVersHeure(m);
        col.appendChild(l);
      }
    }
  });
}

/* Fabrique d'un element. Le titre est un vrai champ de saisie, toujours
   editable en place : aucune fenetre ne s'ouvre jamais pour ecrire une tache. */
function elementItem(it, contexte){
  const el = document.createElement("div");
  el.className = "item p-" + it.priority + (it.status === "done" ? " done" : "") +
                 (contexte === "slot" ? " slotitem" : "");
  el.dataset.id = it.id;
  el.dataset.ctx = contexte;

  const trop = (it.rolloverCount || 0) >= 3;
  if (trop && it.status === "open") el.classList.add("stale");

  const grip = document.createElement("div");
  grip.className = "grip"; grip.draggable = true;
  grip.title = "Glisser pour déplacer";
  el.appendChild(grip);

  const chk = document.createElement("input");
  chk.type = "checkbox"; chk.className = "chk";
  chk.checked = it.status === "done";
  chk.setAttribute("aria-label", "Terminer : " + (it.title || "tâche sans titre"));
  el.appendChild(chk);

  const t = document.createElement("textarea");
  t.className = "title"; t.rows = 1; t.value = it.title;
  t.spellcheck = true;
  t.placeholder = contexte === "slot" ? "Rendez-vous…" : "Nouvelle tâche…";
  el.appendChild(t);

  if ((it.rolloverCount || 0) > 0 && it.status === "open"){
    const r = document.createElement("span");
    r.className = "roll";
    r.textContent = "↩" + (it.rolloverCount > 1 ? it.rolloverCount : "");
    r.title = "Reporté " + it.rolloverCount + " fois · prévu au départ le " +
              dateLisibleLongue(it.origDate || it.date) +
              " · cliquez pour la renvoyer à sa date d'origine";
    el.appendChild(r);
  }

  const p = document.createElement("button");
  p.className = "pdot"; p.dataset.p = it.priority;
  p.title = "Priorité : " + PRIO[it.priority].nom + " — cliquez pour changer";
  p.setAttribute("aria-label", "Priorité : " + PRIO[it.priority].nom);
  el.appendChild(p);

  const x = document.createElement("button");
  x.className = "del"; x.innerHTML = "&times;"; x.title = "Supprimer";
  el.appendChild(x);

  if (contexte === "slot"){
    const rz = document.createElement("div");
    rz.className = "resize"; rz.title = "Étirer pour changer la durée";
    el.appendChild(rz);
    // Un couloir etroit ne peut pas tout montrer : l'infobulle, elle, le peut.
    const d = it.startMin == null ? null : it.startMin;
    el.title = (d === null ? "" : minVersHeure(d) + " – " + minVersHeure(d + (it.durMin || 30)) + "  ") +
               (it.title || "Rendez-vous sans titre");
  }
  return el;
}

/* Un champ multi-ligne n'a pas de hauteur automatique en HTML : on la calcule.
   C'est ce qui permet a un titre long de revenir a la ligne au lieu d'etre
   tronque, tout en restant editable directement sur place. */
function ajusterHauteur(el){
  el.style.height = "auto";
  el.style.height = Math.max(18, el.scrollHeight) + "px";
}
function ajusterTousLesTitres(racine){
  (racine || document).querySelectorAll("textarea.title").forEach(ajusterHauteur);
}

/* La pastille ne reflete QUE des sauvegardes confirmees. Une tentative dont
   personne n'a verifie l'arrivee n'a pas le droit de la faire passer au vert :
   c'est exactement ce mensonge qui laissait quelqu'un sans aucune protection
   pendant des mois avec un indicateur rassurant sous les yeux. */
function majPastilleSauvegarde(){
  const t = els.saveText, chip = els.saveChip;
  if (!stockageOK){ chip.dataset.level = "bad"; t.textContent = "Stockage indisponible"; return; }
  const dep = etat.meta.lastBackupOn ? dateEcart(etat.meta.lastBackupOn, dateAujourdhui()) : null;
  if (dep === null){
    chip.dataset.level = etat.meta.lastBackupTryOn ? "warn" : "bad";
    t.textContent = etat.meta.lastBackupTryOn ? "Sauvegarde non vérifiée" : "Jamais sauvegardé";
    chip.title = etat.meta.lastBackupTryOn
      ? "Une sauvegarde a été tentée le " + dateLisible(etat.meta.lastBackupTryOn, true) +
        ", mais rien ne confirme qu'elle soit arrivée sur votre disque."
      : "Aucune sauvegarde n'a encore été déposée dans votre dossier Téléchargements.";
    return;
  }
  if (dep <= 1){
    delete chip.dataset.level;
    t.textContent = dep === 0 ? "Sauvegardé aujourd'hui" : "Sauvegardé hier";
    chip.title = "Dernière sauvegarde vérifiée le " + dateLisible(etat.meta.lastBackupOn, true) + ".";
    return;
  }
  chip.dataset.level = dep > 13 ? "bad" : (dep > 6 ? "warn" : "");
  if (!chip.dataset.level) delete chip.dataset.level;
  t.textContent = "Sauvegardé il y a " + dep + " jours";
  chip.title = "Dernière sauvegarde vérifiée le " + dateLisible(etat.meta.lastBackupOn, true) + ".";
}

let toastTimer = null;
function signaler(texte, niveau, persistant){
  els.live.textContent = texte;
  if (persistant){
    els.alertText.textContent = texte;
    els.alertBar.classList.toggle("grave", niveau === "bad");
    els.alertBar.hidden = false;
    els.alertAction.hidden = true;
    return;
  }
  els.toastText.textContent = texte;
  els.toastAction.hidden = true;
  els.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { els.toast.hidden = true; }, 3200);
}
/* Comme signaler(..., persistant) mais avec un bouton : quand on annonce a
   quelqu'un qu'il vient de perdre la main, il faut lui laisser une porte. */
function signalerBloquantAvecAction(texte, libelle, action){
  els.live.textContent = texte;
  els.alertText.textContent = texte;
  els.alertBar.classList.add("grave");
  els.alertBar.hidden = false;
  els.alertAction.textContent = libelle;
  els.alertAction.hidden = false;
  els.alertAction.onclick = action;
}

function signalerAvecAction(texte, libelle, action){
  els.live.textContent = texte;
  els.toastText.textContent = texte;
  els.toastAction.textContent = libelle;
  els.toastAction.hidden = false;
  els.toastAction.onclick = () => { els.toast.hidden = true; action(); };
  els.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { els.toast.hidden = true; }, 7000);
}

function ouvrirPanneau(html, large){
