<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><link rel="icon" href="data:,"><title>CARILLON — tests core (agent C)</title>
<style> body { background: #16130f; color: #d8cdb4; font: 13px monospace; padding: 12px; } .ko { color: #e0603a; } .ok { color: #8fb070; } </style></head>
<body><pre id="out"></pre><canvas id="c" width="480" height="270"></canvas>
<script type="module">
import { bus } from '../../core/events.js';
import { makeRng, hashSeed, hash3 } from '../../core/rng.js';
import { createPool } from '../../core/pool.js';
import { createGrid } from '../../core/grid.js';
import * as save from '../../core/save.js';
import * as input from '../../core/input.js';
import { createLoop } from '../../core/loop.js';
import * as camera from '../camera.js';

const out = document.getElementById('out'); const results = [];
function check(name, cond) { results.push({ name, ok: !!cond }); const s = document.createElement('div'); s.className = cond ? 'ok' : 'ko'; s.textContent = (cond ? 'OK  ' : 'KO  ') + name; out.appendChild(s); }

// --- bus
let got = 0; const off = bus.on('x', (p) => { got += p.v; }); bus.once('x', (p) => { got += 100; });
bus.emit('x', { v: 1 }); bus.emit('x', { v: 2 }); off(); bus.emit('x', { v: 4 });
check('bus on/once/off', got === 103 && bus.count('x') === 0);
let inner = 0; bus.on('y', () => { bus.off('y', h2); inner++; }); function h2() { inner += 10; } bus.on('y', h2); bus.emit('y', {}); bus.emit('y', {});
check('bus retrait pendant emit', inner === 2);

// --- rng
const a = makeRng(42), b = makeRng(42); let same = true; for (let i = 0; i < 1000; i++) if (a.next() !== b.next()) same = false;
check('rng déterministe', same);
const r = makeRng(1); let inRange = true; for (let i = 0; i < 1000; i++) { const v = r.int(3, 7); if (v < 3 || v > 7 || v !== Math.floor(v)) inRange = false; }
check('rng int bornes', inRange);
check('hashSeed texte/nombre', hashSeed('cendrelune') === hashSeed('cendrelune') && hashSeed('123') === 123 && hashSeed('a') !== hashSeed('b'));
check('hash3 stable', hash3(1, 2, 3) === hash3(1, 2, 3) && hash3(1, 2, 3) !== hash3(1, 3, 2));

// --- pool
const pool = createPool(() => ({ v: 0 }), (o) => { o.v = 0; }, 4);
const p1 = pool.acquire(), p2 = pool.acquire(), p3 = pool.acquire(); p2.v = 2;
pool.release(p2); let n = 0; pool.forEach((o) => { n++; if (o === p3) pool.release(o); });
check('pool acquire/release/forEach', n === 2 && pool.active === 1 && pool.size === 4 && !p2.active && pool.acquire().v === 0);
pool.clearAll(); check('pool clearAll', pool.active === 0 && pool.size === 4);

// --- grid
const grid = createGrid(64); const ents = []; const g = makeRng(9);
for (let i = 0; i < 500; i++) { const e = { x: g.range(-1000, 1000), y: g.range(-1000, 1000), r: g.range(4, 40), id: i }; ents.push(e); grid.insert(e); }
let brute = 0, fast = 0, dup = false; const seen = new Set();
for (const e of ents) if (Math.hypot(e.x - 10, e.y - 20) <= e.r + 150) brute++;
grid.query(10, 20, 150, (e) => { fast++; if (seen.has(e.id)) dup = true; seen.add(e.id); if (Math.hypot(e.x - 10, e.y - 20) > e.r + 150 + 128) dup = true; });
let missing = false; for (const e of ents) if (Math.hypot(e.x - 10, e.y - 20) <= e.r + 150 && !seen.has(e.id)) missing = true;
check('grid query sans doublon ni oubli (' + brute + '/' + fast + ')', !dup && !missing && fast >= brute);
grid.clear(); let after = 0; grid.query(10, 20, 2000, () => after++); check('grid clear', after === 0 && grid.occupied === 0);
let rect = 0; grid.insert({ x: 100, y: 100, r: 5 }); grid.insert({ x: 500, y: 500, r: 5 }); grid.queryRect(90, 90, 20, 20, () => rect++); check('grid queryRect', rect === 1);

// --- save
localStorage.removeItem('carillon.save');
const s0 = save.loadSave(); check('save défauts', s0.version === 1 && s0.unlocked.characters[0] === 'wren' && s0.options.lang === 'fr' && s0.options.scale === 0);
let changed = null; bus.on('save:changed', (p) => { changed = p.save; });
s0.bronze = 77; s0.unlocked.weapons.push('clarine'); save.commit();
check('save commit + événement', changed === s0 && JSON.parse(localStorage.getItem('carillon.save')).bronze === 77);
localStorage.setItem('carillon.save', JSON.stringify({ bronze: 5, unlocked: { characters: ['wren', 'osric'] }, options: { lang: 'en' } }));
const s1 = save.loadSave(); check('save migration v0 → v1', s1.version === 1 && s1.bronze === 5 && s1.unlocked.characters.includes('osric') && s1.unlocked.weapons[0] === 'battant' && s1.options.lang === 'en' && s1.options.volMaster === 0.8);
const exp = save.exportSave(); const imp = save.importSave(exp); check('save export/import', imp.ok && save.getSave().bronze === 5);
check('save import invalide', !save.importSave('{oops').ok && save.importSave('{"a":1}').error === 'invalid_shape' && save.importSave('{"version":99,"unlocked":{},"options":{}}').error === 'newer_version');
save.getSave().options.lang = 'en'; save.commit(); save.resetSave(); check('save reset garde options', save.getSave().bronze === 0 && save.getSave().options.lang === 'en');

// --- input (événements clavier synthétiques)
const canvas = document.getElementById('c');
camera.initCamera({ w: 480, h: 270 }); camera.snap(100, 50);
input.initInput({ canvas, getAudioTime: () => 12.5, screenToWorld: camera.screenToWorld, logicalSize: () => ({ w: 480, h: 270 }) });
const evs = []; bus.on('input:action', (p) => { if (p.action === 'up') evs.push(p); });
window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyZ' })); // ZQSD physique = KeyW
window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyW' }));
input.tickInput();
check('input justPressed après tick', input.justPressed('up') && input.isDown('up') && input.pressedAt('up') === 12.5 && evs.length === 1 && evs[0].action === 'up' && evs[0].at === 12.5);
input.tickInput(); check('input justPressed un seul tick', !input.justPressed('up') && input.isDown('up'));
window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyW' })); input.tickInput(); check('input relâché', !input.isDown('up') && evs.length === 2 && evs[1].pressed === false);
window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyD' })); window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyS' })); input.tickInput();
const ax = input.axis(); check('input axis normalisé', Math.abs(ax.x - 0.7071) < 0.001 && Math.abs(ax.y - 0.7071) < 0.001);
window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyD' })); window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyS' }));
let captured = null; input.beginCapture('dash', (r) => { captured = r; });
window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyX' }));
check('input remappage', captured && captured.key === 'KeyX' && input.getBindings().dash.keys[0] === 'KeyX');
window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyX' })); input.tickInput(); check('input touche remappée', input.justPressed('dash'));
window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyX' }));
input.resetBindings(); check('input resetBindings', input.getBindings().dash.keys[0] === 'Space');
input.setBinding('parry', { keys: ['KeyP'] }); window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyP' })); input.tickInput(); check('input setBinding', input.justPressed('parry'));
window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyP' }));
const rc = canvas.getBoundingClientRect();
window.dispatchEvent(new MouseEvent('mousemove', { clientX: rc.left + 240, clientY: rc.top + 135 })); input.tickInput();
const pt = input.pointer(); check('input pointer monde', Math.abs(pt.x - 240) < 1 && Math.abs(pt.worldX - 100) < 1 && Math.abs(pt.worldY - 50) < 1);

// --- caméra
camera.snap(0, 0); const sc = camera.worldToScreen(10, 20); check('camera worldToScreen', sc.x === 250 && sc.y === 155);
const wd = camera.screenToWorld(250, 155); check('camera screenToWorld', wd.x === 10 && wd.y === 20);
check('camera isVisible', camera.isVisible(0, 0, 1) && !camera.isVisible(1000, 0, 10) && camera.isVisible(245, 0, 10));
camera.follow(100, 0, 1 / 60); check('camera follow lisse', camera.get().x > 0 && camera.get().x < 100);

// --- boucle
const loop = createLoop({ update: () => { ticks++; }, render: () => { frames++; } }); let ticks = 0, frames = 0;
loop.start(); await new Promise((r) => setTimeout(r, 700)); loop.setTimeScale(0); const t1 = ticks; await new Promise((r) => setTimeout(r, 150)); loop.stop();
check('loop pas fixe ~60 Hz (' + ticks + ' ticks, ' + frames + ' frames)', ticks >= 36 && ticks <= 60 && frames > 5 && ticks > t1 && loop.stats.fps > 0);

window.__results = results;
</script></body></html>
