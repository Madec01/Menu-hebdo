<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadence</title>
<style>
/* ============================================================
   CADENCE — feuille de style unique
   L'interface de gestion est en DOM/CSS, la vue usine en Canvas.
   ============================================================ */

:root{
  --sol:#4a4d52;
  --fond:#15171a;
  --fond2:#1d2024;
  --fond3:#25292e;
  --bord:#33383f;
  --bord-clair:#454c55;
  --texte:#e6e8ea;
  --texte-doux:#9aa2ac;
  --texte-faible:#6b737d;
  --or:#f0b429;
  --vert:#5cba6b;
  --rouge:#e0574a;
  --orange:#e8863c;
  --bleu:#4b8fd4;
  --violet:#9b6dc9;
  --cyan:#3fb8c4;
  --ombre:0 8px 30px rgba(0,0,0,.45);
  --r:8px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fond);
  color:var(--texte);
  font:14px/1.45 "Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- Structure ---------- */
#app{display:flex;flex-direction:column;height:100vh;min-width:1180px}

#barreHaute{
  display:flex;align-items:center;gap:18px;
  height:52px;padding:0 14px;flex:0 0 52px;
  background:linear-gradient(180deg,#22262b,#191c20);
  border-bottom:1px solid var(--bord);
  box-shadow:0 2px 12px rgba(0,0,0,.4);
  z-index:30;
}
.marque{
  font-weight:700;letter-spacing:.22em;font-size:13px;color:var(--or);
  padding-right:14px;border-right:1px solid var(--bord);
}
.indic{display:flex;flex-direction:column;justify-content:center;min-width:78px}
.indic .lab{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--texte-faible)}
.indic .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.indic.hidden{display:none}
#indArgent .val.neg{color:var(--rouge)}
#indArgent .val.pos{color:var(--vert)}

.espaceur{flex:1}

#vitesses{display:flex;gap:3px;background:var(--fond);border:1px solid var(--bord);border-radius:6px;padding:3px}
#vitesses button{
  padding:4px 11px;border-radius:4px;font-size:12px;font-weight:600;
  color:var(--texte-doux);transition:background .12s,color .12s;
}
#vitesses button:hover{background:var(--fond3);color:var(--texte)}
#vitesses button.actif{background:var(--or);color:#221a02}

.btIcone{
  width:34px;height:34px;border-radius:6px;display:grid;place-items:center;
  color:var(--texte-doux);border:1px solid transparent;font-size:16px;
}
.btIcone:hover{background:var(--fond3);color:var(--texte);border-color:var(--bord)}
.btIcone.off{color:var(--texte-faible);opacity:.55}

/* ---------- Zone de jeu ---------- */
#zoneJeu{flex:1;display:flex;min-height:0}
#colGauche{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#cadreVue{flex:1;position:relative;overflow:hidden;background:#101215}
#vue{position:absolute;inset:0;display:block;cursor:crosshair}
#vue.deplace{cursor:grabbing}

/* ---------- Barre basse : construction ---------- */
#barreBasse{
  flex:0 0 auto;background:linear-gradient(180deg,#1d2126,#171a1e);
  border-top:1px solid var(--bord);padding:8px 12px;display:flex;gap:14px;align-items:flex-start;
  z-index:20;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;
  scrollbar-color:#3a4048 transparent;
}
#barreBasse::-webkit-scrollbar{height:7px}
#barreBasse::-webkit-scrollbar-thumb{background:#3a4048;border-radius:4px}
#barreBasse::-webkit-scrollbar-track{background:transparent}
.catBloc{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.catTitre{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--texte-faible);padding-left:2px}
.catOutils{display:flex;gap:6px}
.outil{
  width:74px;padding:6px 4px;border-radius:var(--r);background:var(--fond3);
  border:1px solid var(--bord);display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .1s,border-color .12s,background .12s;
}
.outil:hover:not(.verrou){transform:translateY(-2px);border-color:var(--bord-clair);background:#2c3138}
.outil.actif{border-color:var(--or);background:#332a10;box-shadow:0 0 0 1px var(--or) inset}
.outil.verrou{opacity:.32;cursor:not-allowed}
.outil.cher{border-color:#5a2f2a}
.outil .glyphe{width:30px;height:22px;border-radius:3px;position:relative}
.outil .nom{font-size:10.5px;line-height:1.15;text-align:center;color:var(--texte-doux)}
.outil .prix{font-size:10px;font-variant-numeric:tabular-nums;color:var(--or)}
.outil.cher .prix{color:var(--rouge)}
.outil.bascule{border-style:dashed}
.outil.bascule.basculeOn{border-color:#c98b45;background:#33270f;border-style:solid}
.outil.bascule:not(.basculeOn){border-color:#3d5b40;background:#1b2a1d}

/* ---------- Panneau droit ---------- */
#panneau{
  flex:0 0 336px;background:var(--fond2);border-left:1px solid var(--bord);
  display:flex;flex-direction:column;min-height:0;
}
#panneau.replie{flex-basis:44px}
#panneau.replie .ongletsLabel,#panneau.replie #contenuPanneau{display:none}
#onglets{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--bord);background:var(--fond)}
#onglets button{
  flex:1 1 auto;padding:11px 3px;font-size:10.5px;letter-spacing:0;color:var(--texte-faible);
  white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .12s,border-color .12s,background .12s;
}
#onglets button:hover{color:var(--texte-doux);background:var(--fond2)}
#onglets button.actif{color:var(--or);border-bottom-color:var(--or);background:var(--fond2)}
#contenuPanneau{flex:1;overflow-y:auto;padding:14px}

/* barres de défilement discrètes */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a4048;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#4c545e}

/* ---------- Briques d'interface ---------- */
h2.titrePan{font-size:16px;font-weight:600;margin-bottom:3px}
p.sousTitre{font-size:12px;color:var(--texte-faible);margin-bottom:12px}
.bloc{background:var(--fond3);border:1px solid var(--bord);border-radius:var(--r);padding:11px;margin-bottom:10px}
.bloc h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-faible);margin-bottom:8px;font-weight:600}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.ligne .k{color:var(--texte-doux)}
.ligne .v{font-variant-numeric:tabular-nums;font-weight:600}
.vide{color:var(--texte-faible);font-size:12.5px;font-style:italic;padding:8px 0}

.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 13px;border-radius:6px;background:var(--fond3);border:1px solid var(--bord-clair);
  font-size:13px;font-weight:500;transition:background .12s,border-color .12s,transform .08s;
}
.bt:hover{background:#343a42;border-color:#59616c}
.bt:active{transform:translateY(1px)}
.bt.plein{background:var(--or);border-color:var(--or);color:#241b03;font-weight:600}
.bt.plein:hover{background:#ffc63f;border-color:#ffc63f}
.bt.danger{border-color:#6a3129;color:#f0a094}
.bt.danger:hover{background:#3a1d18}
.bt.large{width:100%}
.bt[disabled]{opacity:.4;pointer-events:none}
.btRang{display:flex;gap:6px;margin-top:8px}
.btRang .bt{flex:1;padding:7px 6px;font-size:12px}

.jauge{height:7px;background:#14161a;border-radius:4px;overflow:hidden;margin:6px 0}
.jauge>i{display:block;height:100%;background:var(--or);border-radius:4px;transition:width .3s}
.jauge.vert>i{background:var(--vert)}
.jauge.rouge>i{background:var(--rouge)}
.jauge.bleu>i{background:var(--bleu)}

.pastille{
  display:inline-block;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:600;
  letter-spacing:.03em;background:var(--fond);border:1px solid var(--bord);color:var(--texte-doux);
}
.pastille.ok{background:#1c3021;border-color:#2d5535;color:#8fd89c}
.pastille.att{background:#3a2e14;border-color:#5f4a1c;color:#f0c96a}
.pastille.ko{background:#3a1e1a;border-color:#5f2c25;color:#f0a094}

/* ---------- Notifications ---------- */
#notifs{position:absolute;top:12px;right:12px;width:252px;display:flex;flex-direction:column;gap:7px;z-index:25;pointer-events:none}
.notif{
  background:rgba(28,32,37,.96);border:1px solid var(--bord-clair);border-left:3px solid var(--bleu);
  border-radius:6px;padding:9px 11px;font-size:12.5px;box-shadow:var(--ombre);
  animation:glisseNotif .28s ease-out;backdrop-filter:blur(3px);
}
.notif.ok{border-left-color:var(--vert)}
.notif.att{border-left-color:var(--or)}
.notif.ko{border-left-color:var(--rouge)}
.notif b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--texte-faible);margin-bottom:2px;font-weight:600}
.notif.part{animation:sortNotif .3s ease-in forwards}
@keyframes glisseNotif{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes sortNotif{to{opacity:0;transform:translateX(26px);max-height:0;padding-block:0;margin-bottom:-7px}}

/* ---------- Contremaître ---------- */
#contremaitre{position:absolute;left:14px;bottom:14px;display:flex;align-items:flex-end;gap:10px;z-index:26;max-width:520px}
#portrait{
  width:60px;height:60px;flex:0 0 60px;border-radius:50%;background:#2a2f36;border:2px solid var(--or);
  cursor:pointer;box-shadow:var(--ombre);transition:transform .14s;
}
#portrait:hover{transform:scale(1.06)}
#bulle{
  position:relative;background:rgba(32,36,42,.97);border:1px solid var(--bord-clair);border-radius:10px;
  padding:11px 14px;font-size:13.5px;line-height:1.5;box-shadow:var(--ombre);backdrop-filter:blur(3px);
  animation:monteBulle .22s ease-out;
}
#bulle::before{content:"";position:absolute;left:-7px;bottom:16px;width:12px;height:12px;background:inherit;border-left:1px solid var(--bord-clair);border-bottom:1px solid var(--bord-clair);transform:rotate(45deg)}
#bulle .qui{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--or);font-weight:700;margin-bottom:3px}
#contremaitre.muet #bulle{display:none}
@keyframes monteBulle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Infobulle survol ---------- */
#infobulle{
  position:absolute;z-index:28;pointer-events:none;display:none;max-width:250px;
  background:rgba(20,23,27,.97);border:1px solid var(--bord-clair);border-radius:6px;
  padding:8px 10px;font-size:12.5px;line-height:1.42;box-shadow:var(--ombre);
}
#infobulle .t{font-weight:600;margin-bottom:2px}
#infobulle .d{color:var(--texte-doux)}
#infobulle .e{margin-top:3px}

/* ---------- Superpositions plein écran ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(9,10,12,.9);backdrop-filter:blur(5px);
  overflow-y:auto;padding:20px 26px;
}
.overlay.visible{display:block;animation:fondu .25s ease-out}
@keyframes fondu{from{opacity:0}to{opacity:1}}
.feuille{max-width:1080px;margin:0 auto}
.enteteFeuille{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--bord)}
.enteteFeuille h1{font-size:24px;font-weight:600;letter-spacing:.01em}
.enteteFeuille .sous{color:var(--texte-faible);font-size:14px}

.volets{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.bandeauObjectif{margin-bottom:16px;padding:14px 18px}
.objLigne{display:grid;grid-template-columns:minmax(180px,1fr) 2fr minmax(150px,1fr);gap:20px;align-items:center}
.objLigne h2{margin-bottom:3px}
.objTitre{font-size:15px;font-weight:600}
.objChiffre{font-size:12px;color:var(--texte-faible);margin-top:4px}
.objMot{font-size:13px;color:var(--texte-doux);font-style:italic;text-align:right}
.volet{background:var(--fond2);border:1px solid var(--bord);border-radius:12px;padding:18px}
.volet h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--texte-faible);margin-bottom:14px;font-weight:600}
.grandChiffre{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.grandChiffre.pos{color:var(--vert)}
.grandChiffre.neg{color:var(--rouge)}
.faitMarquant{margin-top:12px;padding:10px 12px;background:#2a2410;border:1px solid #4a3d12;border-radius:8px;font-size:13px;color:#f0d493}

.cartes{display:flex;flex-direction:column;gap:11px}
.carte{background:var(--fond3);border:1px solid var(--bord-clair);border-radius:10px;padding:14px;transition:border-color .15s}
.carte:hover{border-color:#5b636e}
.carte .cType{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.carte .cTitre{font-size:15px;font-weight:600;margin-bottom:5px}
.carte .cCorps{font-size:13px;color:var(--texte-doux);line-height:1.5}
.carte .cAvis{margin-top:9px;padding:8px 10px;border-radius:6px;background:rgba(240,180,41,.09);border-left:2px solid var(--or);font-size:12.5px;font-style:italic;color:#e3d2a8}
.carte.traitee{opacity:.4;pointer-events:none}
.tContrat{color:var(--bleu)}.tAchat{color:var(--cyan)}.tInvest{color:var(--violet)}.tRh{color:var(--vert)}.tBanque{color:var(--or)}

#graphSemaines{width:100%;height:96px;display:block;margin-top:6px;border-radius:6px;background:#14171b}

.piedFeuille{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:16px}

/* ---------- Écran-titre ---------- */
#ecranTitre .feuille{max-width:520px;margin-top:9vh;text-align:center}
#ecranTitre h1{font-size:60px;letter-spacing:.3em;color:var(--or);font-weight:300;margin-bottom:4px;text-indent:.3em}
#ecranTitre .accroche{color:var(--texte-doux);font-size:14.5px;line-height:1.6;margin-bottom:32px}
#ecranTitre .bt{width:100%;margin-bottom:9px;padding:13px}
#ecranTitre .credits{margin-top:26px;font-size:11.5px;color:var(--texte-faible);line-height:1.7}
.champTexte{
  width:100%;padding:10px 12px;background:var(--fond);border:1px solid var(--bord-clair);
  border-radius:6px;margin-bottom:14px;text-align:center;font-size:15px;
}
.champTexte:focus{outline:none;border-color:var(--or)}

/* ---------- Listes du panneau ---------- */
.item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.item:last-child{border-bottom:none}
.puce{width:16px;height:16px;border-radius:3px;flex:0 0 16px;border:1px solid rgba(0,0,0,.35)}
.item .nom{flex:1;font-size:12.5px}
.item .qte{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.item .sub{font-size:11px;color:var(--texte-faible)}
.mini{padding:3px 8px;font-size:11px;border-radius:4px;background:var(--fond);border:1px solid var(--bord-clair)}
.mini:hover{background:#333941}

.fiche{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.avatar{width:38px;height:38px;border-radius:50%;flex:0 0 38px;background:#333;border:1px solid var(--bord-clair)}

table.tab{width:100%;border-collapse:collapse;font-size:12.5px}
table.tab th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--texte-faible);padding:4px 6px;font-weight:600}
table.tab td{padding:5px 6px;border-top:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
table.tab tr:hover td{background:rgba(255,255,255,.028)}

.mev{color:var(--or);font-weight:600}
.tendHausse{color:var(--rouge)}
.tendBaisse{color:var(--vert)}

#coinAide{position:absolute;right:12px;bottom:12px;z-index:24;display:flex;gap:6px}
#coinAide .bt{background:rgba(30,34,39,.9);backdrop-filter:blur(3px)}

/* ---------- Onglet Guide ---------- */
.fluxEtape{display:flex;align-items:center;gap:9px;padding:6px 0}
.fluxEtape canvas{flex:0 0 26px;background:#1a1d21;border-radius:4px;border:1px solid var(--bord)}
.fluxEtape .fNom{flex:1;font-size:12.5px}
.fluxEtape .fSub{font-size:10.5px;color:var(--texte-faible)}
.fluxFleche{color:var(--texte-faible);font-size:13px;text-align:center;line-height:1;margin-left:12px}
.fluxMachine{
  display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:4px;margin-left:12px;
  background:var(--fond);border:1px solid var(--bord);color:var(--texte-doux);
}

.recette{background:var(--fond3);border:1px solid var(--bord);border-radius:var(--r);padding:10px;margin-bottom:9px}
.recette.verrou{opacity:.45}
.recette .rMachine{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.recette .rNom{font-size:13.5px;font-weight:600;margin-bottom:7px}
.recette .rBloc{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.recette .rBloc canvas{flex:0 0 22px;background:#1a1d21;border-radius:3px}
.recette .rSep{display:flex;align-items:center;gap:8px;margin:5px 0;color:var(--texte-faible);font-size:11px}
.recette .rSep::before,.recette .rSep::after{content:"";flex:1;height:1px;background:var(--bord)}
.recette .rCadence{margin-top:7px;font-size:11px;color:var(--texte-faible)}

.guideDetails{border:1px solid var(--bord);border-radius:var(--r);margin-bottom:8px;background:var(--fond3);overflow:hidden}
.guideDetails>summary{
  padding:10px 12px;cursor:pointer;font-size:12.5px;font-weight:600;list-style:none;
  display:flex;justify-content:space-between;align-items:center;transition:background .12s;
}
.guideDetails>summary:hover{background:#2c3138}
.guideDetails>summary::-webkit-details-marker{display:none}
.guideDetails>summary::after{content:"+";color:var(--texte-faible);font-size:15px;font-weight:400}
.guideDetails[open]>summary::after{content:"−"}
.guideDetails[open]>summary{border-bottom:1px solid var(--bord)}
.guideCorps{padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--texte-doux)}
.guideCorps p{margin-bottom:8px}
.guideCorps p:last-child{margin-bottom:0}
.guideCorps b{color:var(--texte);font-weight:600}
.guideCorps ul{margin:0 0 8px 15px}
.guideCorps li{margin-bottom:4px}
.guideCorps kbd{
  background:var(--fond);border:1px solid var(--bord-clair);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;font-size:11px;font-family:inherit;color:var(--texte);
}

/* ---------- Réapprovisionnement programmable ---------- */
.reappro{margin-top:7px;padding:7px 9px;border-radius:6px;background:var(--fond);border:1px solid var(--bord)}
.reappro.actif{border-color:#4a5540;background:#1c2119}
.reapproTete{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--texte-doux);cursor:pointer}
.reapproPhrase{margin-top:7px;font-size:11.5px;color:var(--texte-doux);line-height:2}
.reapproNb{
  width:62px;margin:0 4px;padding:2px 5px;background:var(--fond3);border:1px solid var(--bord-clair);
  border-radius:4px;font-size:11.5px;font-variant-numeric:tabular-nums;text-align:right;
}
.reapproNb:focus{outline:none;border-color:var(--or)}
.reapproNote{margin-top:5px;font-size:10.5px;color:var(--texte-faible);line-height:1.4}
.reapproNote.alerte{color:var(--or)}

/* ---------- La marque ---------- */
.jaugeMarque{margin-bottom:11px}
.jmTete{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.jmNom{font-size:12.5px;color:var(--texte-doux);font-weight:600}
.jmVal{font-size:11.5px;color:var(--texte-faible);font-variant-numeric:tabular-nums}
.jmPhrase{font-size:11px;color:var(--texte-faible);margin-top:4px;line-height:1.35}
.palier{
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);opacity:.5;
}
.palier:last-child{border-bottom:none}
.palier.ouvert{opacity:1}
.palTete{display:flex;justify-content:space-between;align-items:baseline}
.palNom{font-size:13px;font-weight:600;color:var(--texte-doux)}
.palEtat{

<script>
"use strict";
/* ============================================================================
   CONFIG — constantes du moteur
   ----------------------------------------------------------------------------
   Note d'équilibrage (écart assumé avec le document de game design) :
   le §6.1 donne à la fois « 1 journée = 40 s réelles » et « 1 minute de jeu
   = 12 ticks » ; les deux sont incompatibles (12 ticks/min à 4 Hz donnerait
   24 min réelles par journée). On garde 40 s/journée, qui est la contrainte
   de rythme du §14 — soit 3 minutes de jeu par tick.
   Les durées machine sont calées pour tenir le rythme visé au §14 : sortir
   de l'âge 1 en 20 à 30 minutes réelles.
   ----------------------------------------------------------------------------
   Unités : tout ce qui se transforme est en kilos, comme dans le métier.
   Seuls les sachets se comptent à l'unité. C'est le champ `unite` de ITEMS
   qui tranche, et `quantiteItem()` qui l'écrit correctement à l'écran.
   ========================================================================== */

const CONFIG = {
  hz: 4,                       // ticks de simulation par seconde à la vitesse ×1
  secondesParJour: 40,         // durée réelle d'une journée à ×1
  minutesParJour: 480,         // 8 heures de travail
  heureDebut: 8,
  joursParSemaine: 5,
  tuile: 32,                   // pixels par tuile à zoom 1
  zoomMin: 0.4, zoomMax: 2.0, zoomDefaut: 1,
  seuilDetail: 0.6,            // en dessous : rendu simplifié
  seuilSchema: 0.5,            // en dessous : vue schématique
  capaciteEntree: 260,         // tampon d'entrée par défaut, en kilos
  capaciteSortie: 200,
  vitesseOuvrier: 0.30,        // tuiles par minute de jeu
  decouvertMax: -5000,
  faillite: -15000,
  remboursementCasse: 0.6,     // remboursement à la démolition
  prixTuileAtelier: 46,        // coût de base d'une tuile de surface gagnée
  cour: 5,                     // profondeur de la cour, tout autour de l'atelier
  reposFatigue: 0.055,         // récupération par minute en salle de pause
  reposMinutes: 40,            // durée d'une vraie pause
  formationJours: 6,
  formationCout: 2400,
  formationGain: 0.22,
  primeMoral: 0.28,
  atelierMax: { l:64, h:48 },
  particulesMax: 300,
  itemsConvoyeurMax: 40,
  argentDepart: 8000,
  loyerParJour: [40, 110, 260, 520, 900],   // par âge
  energieParMachineJour: 9,
  reputationDepart: 50,
  standingDepart: 42,          // ni bas de gamme ni chic : un atelier de bourg
  decisionsMax: 4,
  // Qualité (âge 3) : l'huile perd sa fraîcheur en cuisant, et une friteuse
  // à l'huile fatiguée sort de la marchandise ratée.
  usureHuileParJour: 0.30,
  chargeHuile: 60,             // kilos pour refaire un bain
  arretChangementHuile: 45,    // minutes de jeu, friteuse à l'arrêt
  rebutMax: 0.5,
  sauvegarde: "cadence_save_v1",
  version: 6
};

// minutes de jeu écoulées par tick de simulation
CONFIG.minutesParTick = CONFIG.minutesParJour / (CONFIG.secondesParJour * CONFIG.hz); // = 3
CONFIG.ticksParJour   = CONFIG.secondesParJour * CONFIG.hz;                            // = 160

/* ============================================================================
   DONNÉES — tout l'équilibrage est ici, sans logique.
   ========================================================================== */

/* ---------------------------------------------------------------- Matières
   forme : 'tubercule' | 'tubercule_pele' | 'rondelle' | 'chips' | 'sachet'
           | 'bidon' | 'sac' | 'bobine'
   unite : "kg" pour tout ce qui se pèse, null pour ce qui se compte.       */
const ITEMS = {
  pdt_brutes: {
    nom:"Pommes de terre", nomP:"Pommes de terre", court:"Patates", courtP:"Patates",
    couleur:"#a8834e", forme:"tubercule", unite:"kg",
    achat:0.30, portee:90, cat:"matiere", agricole:true
  },
  huile: {
    nom:"Huile de friture", nomP:"Huile de friture", court:"Huile", courtP:"Huile",
    couleur:"#d9b23c", forme:"bidon", unite:"kg",
    achat:1.60, portee:45, cat:"matiere", agricole:true
  },
  sel: {
    nom:"Sel", nomP:"Sel", court:"Sel", courtP:"Sel",
    couleur:"#e8ecf0", forme:"sac", unite:"kg",
    achat:0.55, portee:40, cat:"matiere", ageMin:2
  },
  arome: {
    nom:"Arôme", nomP:"Arômes", court:"Arôme", courtP:"Arômes",
    couleur:"#c9502e", forme:"sac", unite:"kg",
    achat:5.20, portee:30, cat:"matiere", ageMin:2, agricole:true
  },
  film: {
    nom:"Film d'emballage", nomP:"Film d'emballage", court:"Film", courtP:"Film",
    couleur:"#7f95a8", forme:"bobine", unite:"kg",
    achat:3.40, portee:30, cat:"matiere", ageMin:2
  },

  pdt_lavees: {
    nom:"Pomme de terre épluchée", nomP:"Pommes de terre épluchées",
    court:"Épluchée", courtP:"Épluchées",
    couleur:"#e3d9a8", forme:"tubercule_pele", unite:"kg",
    portee:75, cat:"piece"
  },
  rondelles: {
    nom:"Rondelle crue", nomP:"Rondelles crues", court:"Rondelle", courtP:"Rondelles",
    couleur:"#efe6bd", forme:"rondelle", unite:"kg",
    portee:75, cat:"piece"
  },
  chips_assaisonnees: {
    nom:"Chips assaisonnées", nomP:"Chips assaisonnées",
    court:"Assaisonnées", courtP:"Assaisonnées",
    couleur:"#d98b2c", forme:"chips", unite:"kg",
    portee:40, cat:"piece", ageMin:2
  },

  chips_vrac: {
    nom:"Chips nature", nomP:"Chips nature", court:"Chips", courtP:"Chips",
    couleur:"#e8b04a", forme:"chips", unite:"kg",
    vente:13.50, portee:40, cat:"produit", rate:"chips_ratees"
  },

  // Ce qui sort mal cuit ou mal soudé. Invendable en l'état : il faut le
  // trier, sinon il finit dans les cartons du client (§6.6).
  chips_ratees: {
    nom:"Chips ratées", nomP:"Chips ratées", court:"Ratées", courtP:"Ratées",
    couleur:"#8f7d4e", forme:"chips", unite:"kg",
    portee:40, cat:"rebut", bon:"chips_vrac", ageMin:3

/* ------------------------------------------------------------- Utilitaires */
const clamp = (v,a,b) => v<a?a:(v>b?b:v);

/** Le mode de partie en cours. Jamais null : une vieille sauvegarde est normale. */
function mode(){ return (etat && MODES[etat.meta.mode]) || MODES.normal; }
const lerp  = (a,b,t) => a+(b-a)*t;
const hasard = (a,b) => a + Math.random()*(b-a);
const hasardInt = (a,b) => Math.floor(hasard(a,b+1));
const choix = t => t[Math.floor(Math.random()*t.length)];

// Bruit déterministe : même index → même valeur. Évite le scintillement des
// items figuratifs d'une frame à l'autre (§7.2).
function bruit(i){ const x = Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }

function euros(n){
  const s = Math.round(Math.abs(n)).toLocaleString("fr-FR");
  return (n<0?"−":"") + s + " €";
}
/** Montants fins (prix au kilo, prix de revient) : l'euro près ne suffit pas.
 *  Au-delà de 100 €, les centimes n'apprennent plus rien. */
function eurosPrecis(n){
  const dec = Math.abs(n) < 100 ? 2 : 0;
  return (n<0?"−":"") + Math.abs(n).toLocaleString("fr-FR",
    { minimumFractionDigits:dec, maximumFractionDigits:dec }) + " €";
}

function eurosSigne(n){
  const s = Math.round(Math.abs(n)).toLocaleString("fr-FR");
  return (n<0?"−":"+") + s + " €";
}
function nb(n, dec=0){ return n.toLocaleString("fr-FR",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function pluriel(n, singulier, plur){ return n<=1 ? singulier : (plur || singulier+"s"); }

/** Nom d'une matière correctement accordé : « 94 vélos classiques », jamais
 *  « 94 vélo classiques ». Les pluriels sont déclarés dans ITEMS. */
function nomItem(id, n, court, minuscule){
  const it = ITEMS[id];
  if (!it) return id;
  let t = court ? (n > 1 ? (it.courtP || it.court) : it.court)
                : (n > 1 ? (it.nomP   || it.nom)   : it.nom);
  // un sigle ne se décapitalise pas.
  const sigle = t.length > 1 && t[1] === t[1].toUpperCase() && t[1] !== t[1].toLowerCase();
  return (minuscule && !sigle) ? t.charAt(0).toLowerCase() + t.slice(1) : t;
}

const JOURS = ["lundi","mardi","mercredi","jeudi","vendredi"];

/** Raccourci : l'usine active. */
function U(){ return etat.usines[etat.usineActive]; }

/** Une fonctionnalité est-elle débloquée à l'âge courant ? */
function debloque(cle){
  if (mode().toutDebloque) return true;
  for (let i=0;i<etat.meta.age;i++) if (AGES[i].debloque.includes(cle)) return true;
  return false;
}

/** Une machine est-elle constructible ? (l'âge atteint, ou le bac à sable) */
function machineDisponible(k){
  if (mode().toutDebloque) return true;
  const d = MACHINES[k];
  return d.ageMin <= etat.meta.age && (d.ageMin <= 1 || debloque(k));
}

/** Écrit une quantité avec son unité : « 1 200 kg de chips », « 620 sachets ».
 *  Les kilos et les pièces ne se disent pas de la même façon (§3.1). */
function quantiteItem(id, q, court){
  const it = ITEMS[id];
  if (!it) return nb(q);
  if (it.unite === "kg"){
    const arrondi = Math.abs(q) < 10 ? 1 : 0;
    const n = nomItem(id, 2, court, true);
    return nb(q, arrondi) + " kg " + deDe(n) + n;
  }
  return nb(Math.round(q)) + " " + nomItem(id, q, court, true);
}

/** « de » ou « d' » selon l'initiale. Un h muet compte comme une voyelle. */
function deDe(mot){
  return /^[aeiouyéèêàâîïôûùh]/i.test(mot) ? "d'" : "de ";
}

/** Version courte, sans le nom : « 1 200 kg » ou « 620 ». */
function mesure(id, q){
  const it = ITEMS[id];
  if (it && it.unite === "kg") return nb(q, Math.abs(q) < 10 ? 1 : 0) + " kg";
  return nb(Math.round(q));
}

/* ------------------------------------------------------------------- Temps */
function jourCourant(){ return Math.floor(etat.meta.tempsJeu / CONFIG.minutesParJour); }
function minuteDuJour(){ return etat.meta.tempsJeu % CONFIG.minutesParJour; }
function jourSemaine(){ return jourCourant() % CONFIG.joursParSemaine; }        // 0 = lundi
function semaineCourante(){ return Math.floor(jourCourant() / CONFIG.joursParSemaine); }
function texteHeure(){
  const m = minuteDuJour();
  const h = CONFIG.heureDebut + Math.floor(m/60);
  const mn = Math.floor(m%60);
  return h + " h" + (mn ? " " + String(mn).padStart(2,"0") : "");
}
function texteDate(){
  return "Semaine " + (semaineCourante()+1) + " · " +
         JOURS[jourSemaine()].charAt(0).toUpperCase()+JOURS[jourSemaine()].slice(1) +
         " " + texteHeure();
}

    standing: CONFIG.standingDepart,
    primePrix: 1,        // ce qu'on vend rapporté au prix de référence
    dessinee: false      // le joueur a-t-il ouvert l'atelier de la marque
  };
}

/** Ce vers quoi le standing tend, d'après ce que la marque montre et ce
 *  qu'elle vend. Il ne saute jamais : la perception met des semaines. */
function cibleStanding(){
  const m = etat.marque;
  const p = id => (LOGOS.find(x=>x.id===m.logo)||{}).standing || 0;
  const q = (t,id) => (t.find(x=>x.id===id)||{}).standing || 0;
  let c = 40 + p() + q(MOTIFS_SACHET,m.motif) + q(FONDS_SACHET,m.fond) + q(STYLES_NOM,m.styleNom);
  // Vendre au-dessus du prix de référence vous classe en haut, brader vous classe en bas.
  c += clamp((m.primePrix - 1) * 90, -22, 22);
  c += bonusStandingLabels();
  return clamp(c, 0, 100);
}
/** Le concurrent démarre plus connu que vous : il était là avant. */
function creerRival(){
  const r = choix(RIVAUX);
  return Object.assign({}, r, {
    notoriete: 34, confiance: 62, part: 0.5, dernierCoup: null, semainesCoup: 0
  });
}

function labelObtenu(id){ return !!etat.labels && etat.labels.obtenus.indexOf(id) >= 0; }
function labelsObtenus(){ return LABELS.filter(l => labelObtenu(l.id)); }
function bonusStandingLabels(){ return labelsObtenus().reduce((s,l) => s + (l.standing||0), 0); }
function bonusConfianceLabels(){ return labelsObtenus().reduce((s,l) => s + (l.confiance||0), 0); }
/** Ce que les labels ajoutent au prix : un client paie ce qui est certifié. */
function primeLabels(){ return 1 + labelsObtenus().reduce((s,l) => s + (l.primePrix||0), 0); }
/** Le surcoût qu'on s'impose : s'approvisionner local, ça se paie. */
function surcoutMatiere(){
  return etat.labels && etat.labels.local
    ? 1 + (LABELS.find(l => l.id === "local").surcoutMatiere || 0) : 1;
}

function semaineVierge(){
  return { produits:{}, livres:{}, ca:0, depenses:0, depensesParMotif:{}, pannes:0, retards:0, rebuts:0, reclamations:0, faits:[] };
}

function creerUsine(nom, largeur, hauteur){
  const u = {
    id: 0, nom, largeur, hauteur,
    // `largeur`/`hauteur` sont celles de l'atelier — les murs. La grille, elle,
    // couvre en plus la cour : une bande de `cour` tuiles tout autour, où se
    // posent les bâtiments. Les coordonnées y sont négatives à gauche et en
    // haut ; tout passe par indexCase().
    cour: CONFIG.cour,
    grille: new Uint16Array((largeur + 2*CONFIG.cour) * (hauteur + 2*CONFIG.cour)),
    machines: [], convoyeurs: [], ouvriers: [],
    stocks: {},          // ce qui entre : matières et pièces
    stocksSortie: {},    // ce qui part : produits finis et rebut
    salete: 0,
    quaiEntree: { x:0, y:Math.floor(hauteur/2)-2, l:2, h:4 },
    quaiSortie: { x:largeur-2, y:Math.floor(hauteur/2)-2, l:2, h:4 }
  };
  placerQuais(u);
  return u;
}

/** Les quais sont des obstacles physiques : ids réservés 1 (entrée) et
 *  2 (sortie). On les réinscrit dans la grille après tout déplacement. */
function placerQuais(u){
  for (let i=0;i<u.grille.length;i++) if (u.grille[i] === 1 || u.grille[i] === 2) u.grille[i] = 0;
  const poser = (q, id) => {
    q.y = clamp(q.y, 0, u.hauteur - q.h);
    q.x = clamp(q.x, 0, u.largeur - q.l);
    for (let dy=0; dy<q.h; dy++)
      for (let dx=0; dx<q.l; dx++)
        u.grille[indexCase(u, q.x+dx, q.y+dy)] = id;
  };
  poser(u.quaiEntree, 1);
  poser(u.quaiSortie, 2);
}

function creerOuvrier(prenom, nom, competences, salaire, traitId){
  return {
    id: 0,                       // attribué à l'embauche
    prenom, nom,
    x: 2, y: 2, cible: null, chemin: null,
    competences: Object.assign({ lavage:0.5, decoupe:0.5, friture:0.5, assaisonnement:0.5, emballage:0.5 }, competences||{}),
    trait: traitId || "debutant",
    posteAssigne: null,
    charge: null,                // { item, qte }
    tache: null,                 // { type:'porte'|'opere', ... }
    minuteur: 0,
    fatigue: 0, moral: 0.7, enFormation: false,
    salaire: salaire || 120,
    anciennete: 0,
    etat: "attend",
    // purement visuel, recalculé : direction et phase de marche
    dir: 0, phase: Math.random()*10
  };
}

/* ------------------------------------------------------ Grille et occupants */
/* Le terrain va de (−cour, −cour) à (largeur+cour, hauteur+cour). L'atelier
   occupe le rectangle (0,0)–(largeur,hauteur) ; le reste est la cour. */
function profondeurCour(u){ return u.cour != null ? u.cour : CONFIG.cour; }
function largeurPlan(u){ return u.largeur + 2*profondeurCour(u); }
function indexCase(u,x,y){
  const c = profondeurCour(u);
  return (y+c)*(u.largeur + 2*c) + (x+c);
}
function dansPlan(u,x,y){
  const c = profondeurCour(u);
  return x >= -c && y >= -c && x < u.largeur + c && y < u.hauteur + c;
}
function dansAtelier(u,x,y){ return x>=0 && y>=0 && x<u.largeur && y<u.hauteur; }
function dansCour(u,x,y){ return dansPlan(u,x,y) && !dansAtelier(u,x,y); }
/** Un rectangle entièrement dans l'atelier, ou entièrement dans la cour. */
function rectDansAtelier(u,x,y,l,h){ return dansAtelier(u,x,y) && dansAtelier(u,x+l-1,y+h-1); }
function rectDansCour(u,x,y,l,h){
  if (!dansPlan(u,x,y) || !dansPlan(u,x+l-1,y+h-1)) return false;
  // il suffit qu'aucun coin ne morde l'atelier : les rectangles sont convexes
  return x+l <= 0 || x >= u.largeur || y+h <= 0 || y >= u.hauteur;
}
function dansGrille(u,x,y){ return dansPlan(u,x,y); }

/** Les portes : quatre passages dans les murs, un par façade, au milieu ou
 *  au plus près si le milieu est occupé. C'est par là qu'on sort dans la cour,
 *  et c'est ce qui explique à l'oeil le trajet des ouvriers. */
function portesAtelier(u){
  if (idx.portes) return idx.portes;      // vidé par reindexer()
  const libre = (x,y) => { const o = occupant(u,x,y); return o === 0 || (noeudParId(o)||{}).type === "convoyeur"; };
  const sur = (axe, fixe, milieu, taille) => {
    for (let d=0; d<taille; d++){
      for (const v of (d ? [milieu-d, milieu+d] : [milieu])){
        if (v < 0 || v >= taille) continue;
        const x = axe === "h" ? v : fixe, y = axe === "h" ? fixe : v;
        if (libre(x,y)) return { x, y };
      }
    }
    return null;
  };
  const mx = Math.floor(u.largeur/2), my = Math.floor(u.hauteur/2);
  idx.portes = [ sur("h", 0, mx, u.largeur),              // façade nord
                 sur("h", u.hauteur-1, mx, u.largeur),    // façade sud
                 sur("v", 0, my, u.hauteur),              // pignon ouest
                 sur("v", u.largeur-1, my, u.hauteur) ].filter(Boolean);
  return idx.portes;
}
function estPorte(u,x,y){
  for (const p of portesAtelier(u)) if (p.x === x && p.y === y) return true;
  return false;
}
/** On ne traverse un mur qu'à une porte. */
function franchissable(u, x1,y1, x2,y2){
  const a = dansAtelier(u,x1,y1), b = dansAtelier(u,x2,y2);
  if (a === b) return true;
  return a ? estPorte(u,x1,y1) : estPorte(u,x2,y2);
}
function occupant(u,x,y){
  if (!dansPlan(u,x,y)) return -1;
  return u.grille[indexCase(u,x,y)];
}
function poserSurGrille(u, noeud){
  for (let dy=0; dy<noeud.h; dy++)
    for (let dx=0; dx<noeud.l; dx++)
      u.grille[indexCase(u, noeud.x+dx, noeud.y+dy)] = noeud.id;
}
function retirerDeGrille(u, noeud){
  for (let dy=0; dy<noeud.h; dy++)
    for (let dx=0; dx<noeud.l; dx++)
      if (u.grille[indexCase(u, noeud.x+dx, noeud.y+dy)] === noeud.id)
        u.grille[indexCase(u, noeud.x+dx, noeud.y+dy)] = 0;
}

/** Reconstruit l'index id → noeud. À rappeler après toute modification. */
function reindexer(){
  idx.parId.clear();
  idx.noeuds.length = 0;
  idx.renduConv.clear();
  idx.portes = null;
  for (const u of etat.usines){
    for (const m of u.machines){ idx.parId.set(m.id, m); idx.noeuds.push(m); }
    for (const c of u.convoyeurs) idx.parId.set(c.id, c);
  }
  // Le quai n'est pas un objet posé : on lui donne un pseudo-nœud stable,
  // hors état de jeu, pour que convoyeurs et ouvriers le traitent comme
  // n'importe quel autre nœud.
  idx.quai = noeudQuai(U(), false);
  idx.quaiSortie = noeudQuai(U(), true);
  idx.parId.set(1, idx.quai);
  idx.parId.set(2, idx.quaiSortie);
  relierConvoyeurs();
}
function noeudParId(id){ return idx.parId.get(id) || null; }

/** Les quais ne sont pas des objets posés : on les représente par des
 *  pseudo-nœuds, pour que convoyeurs et ouvriers les traitent comme le reste. */
function noeudQuai(u, sortie){
  const q = sortie ? u.quaiSortie : u.quaiEntree;
  return { id: sortie ? 2 : 1, type:"quai", quai:true, sortie: !!sortie,
           x:q.x, y:q.y, l:q.l, h:q.h, etat:"produit" };
}
function estQuai(n){ return !!n && (n.id === 1 || n.id === 2); }
function estQuaiSortie(n){ return !!n && n.id === 2; }

/** Ce quai-là accepte-t-il cette marchandise ? Même règle que poolDe() :
 *  ce qui se vend part par la sortie, le reste entre par l'entrée. */
function quaiAccepte(n, item){
  if (!ITEMS[item]) return false;
  return estQuaiSortie(n) ? poolDe(item) === U().stocksSortie
                          : poolDe(item) === U().stocks;
}

function nouvelId(){ return ++etat.meta.prochainId; }

/* ------------------------------------------------------------------ Stocks */
/** Où se range une matière : ce qui se vend part au quai de sortie, le reste
 *  reste au quai d'entrée. Le joueur n'a rien à trier lui-même — les deux
 *  quais sont deux portes du même magasin, mais deux compartiments distincts. */
function poolDe(item){
  const c = ITEMS[item] && ITEMS[item].cat;
  return (c === "produit" || c === "rebut") ? U().stocksSortie : U().stocks;
}
function stockDe(item){ return poolDe(item)[item] || 0; }
function ajouterStock(item, qte){
  const p = poolDe(item);
  p[item] = (p[item]||0) + qte;
  if (p[item] < 1e-6) delete p[item];
}
/** Tout ce qui est au quai, les deux compartiments confondus. */
function tousStocks(){ return Object.assign({}, U().stocks, U().stocksSortie); }

/* ---------------------------------------------------------------- Recettes */
function recetteDe(m){ return m.recetteId ? RECETTES[m.recetteId] : null; }
function defDe(m){ return MACHINES[m.type]; }

/** Items qu'un noeud accepte en entrée (pour l'aiguillage automatique). */
function estConvoyeur(n){ return !!n && n.type === "convoyeur"; }

/** Le nom d'un nœud tel qu'on le dit au joueur. */
function nomNoeud(n){
  if (!n) return "rien";
  if (estQuai(n)) return estQuaiSortie(n) ? "le quai de sortie" : "le quai d'entrée";
  if (estConvoyeur(n)) return "un autre convoyeur";
  return MACHINES[n.type] ? MACHINES[n.type].nom : "?";
}

/** Ce qu'un nœud accepte en entrée.
 *  Un convoyeur, lui, n'accepte que ce que son aval finira par consommer :
 *  sans quoi une bande se remplirait de marchandise qui n'a nulle part où
 *  aller. On suit donc la chaîne jusqu'aux vrais consommateurs. */
function itemsAcceptes(n, vus){
  if (!n) return [];
  if (estQuai(n)) return Object.keys(ITEMS);
  if (estConvoyeur(n)){
    vus = vus || new Set();
    if (vus.has(n.id) || vus.size > 24) return [];      // boucle de bandes
    vus.add(n.id);
    const aval = itemsAcceptes(noeudParId(n.destination), vus);
    // Un filtre posé sur la bande restreint encore : elle ne prendra que ça.
    return n.filtre ? aval.filter(x => x === n.filtre) : aval;
  }
  const d = MACHINES[n.type];
  // Un bac dédié ne prend qu'une marchandise. Tant qu'il est vide et sans
  // réglage, il accepte la première qui se présente et s'y tient ensuite.
  if (d && d.dedie) return n.filtre ? [n.filtre] : Object.keys(ITEMS);
  if (d && d.stockage) return Object.keys(ITEMS);
  const r = recetteDe(n);
  return r ? r.entrees.map(e => e.id) : [];
}

/* ============================================================================
   SIMULATION (1/2) — temps, machines, convoyeurs
   Pas fixe, 4 Hz. Le rendu n'écrit jamais dans l'état.
   ========================================================================== */

// Quelle compétence sert sur quelle machine
const COMP_MACHINE = { laveuse:"lavage", trancheuse:"decoupe", friteuse:"friture",
                       tambour:"assaisonnement", ensacheuse:"emballage" };

/** Capacité d'un tampon pour une matière donnée : un sachet ne s'entasse pas
 *  comme un kilo de rondelles. */
function capaciteItem(id, defaut){ return (ITEMS[id] && ITEMS[id].capacite) || defaut; }

/* ---------------------------------------------------- Accès générique aux nœuds
   Un nœud est une machine, une caisse ou le quai. Les convoyeurs et les
   ouvriers manipulent les trois de la même façon. */

function sortieDispo(n, item){
  if (!n) return 0;
  if (estQuai(n)) return stockDe(item);
  return n.sortie[item] || 0;
}
function retirerSortie(n, item, q){
  if (estQuai(n)){ ajouterStock(item, -q); return; }
  n.sortie[item] = (n.sortie[item]||0) - q;
  if (n.sortie[item] < 1e-6) delete n.sortie[item];
}
function contenuTotal(o){ let s=0; for (const k in o) s += o[k]; return s; }

/** Combien d'unités de `item` ce nœud peut-il encore recevoir ? */
function placeEntree(n, item){
  if (!n) return 0;
  // Un quai ne prend que ce qui lui revient : le fini part par la sortie, la
  // matière entre par l'entrée. Sans ça une bande amenait des rondelles au quai
  // de sortie, et elles réapparaissaient à l'entrée — incompréhensible.
  if (estQuai(n)) return quaiAccepte(n, item) ? 1e9 : 0;
  if (estConvoyeur(n)){
    if (!itemsAcceptes(n).includes(item)) return 0;     // cul-de-sac : on n'engage rien
    return placeConvoyeur(n, item);
  }
  const d = MACHINES[n.type];
  // Un bac dédié ne prend que sa marchandise, une fois qu'il s'est réglé.
  if (d.dedie && n.filtre && n.filtre !== item) return 0;
  if (d.stockage) return Math.max(0, d.capacite - contenuTotal(n.sortie));
  const r = recetteDe(n);
  if (!r || !r.entrees.some(e => e.id === item)) return 0;
  return Math.max(0, capaciteItem(item, CONFIG.capaciteEntree) - (n.entree[item]||0));
}
function livrer(n, item, q){
  if (estQuai(n)){ ajouterStock(item, q); return; }
  if (estConvoyeur(n)){ chargerConvoyeur(n, item, q); return; }
  const d = MACHINES[n.type];
  // Un bac dédié encore vierge se règle sur la première marchandise reçue.
  if (d.dedie && !n.filtre) n.filtre = item;
  if (d.stockage) n.sortie[item] = (n.sortie[item]||0) + q;
  else n.entree[item] = (n.entree[item]||0) + q;
}
/** Tout ce que ce nœud pourrait accepter s'il était vide : sert à savoir si un
 *  colis est trop gros en soi, ou s'il faut simplement le laisser attendre. */
function placeTotale(n, item){
  if (!n) return 0;
  if (estQuai(n)) return quaiAccepte(n, item) ? 1e9 : 0;
  if (estConvoyeur(n)) return capaciteConvoyeur(n) / volumeItem(item);
  const d = MACHINES[n.type];
  if (d.dedie && n.filtre && n.filtre !== item) return 0;
  if (d.stockage) return d.capacite;
  const r = recetteDe(n);
  if (!r || !r.entrees.some(e => e.id === item)) return 0;
  return capaciteItem(item, CONFIG.capaciteEntree);
}

/** Reste-t-il de la place en sortie pour un cycle complet ? */
function placeSortie(n, item, q){
  const d = MACHINES[n.type];
  const cap = d.stockage ? d.capacite : capaciteItem(item, CONFIG.capaciteSortie);
  const total = d.stockage ? contenuTotal(n.sortie) : (n.sortie[item]||0);
  return total + q <= cap;
}

/* --------------------------------------------------------------- Facteurs */
function ouvrierParId(id){
  const os = U().ouvriers;
  for (let i=0;i<os.length;i++) if (os[i].id === id) return os[i];
  return null;
}
function traitDe(o){ return TRAITS.find(t => t.id === o.trait) || TRAITS[0]; }

function facteurOperateur(o, machine){
  const comp = o.competences[COMP_MACHINE[machine.type]] ?? 0.5;
  return (0.6 + 0.7*comp) * traitDe(o).vitesse;
}
function facteurUsure(m){ return 1 - 0.35*clamp(m.usure,0,1); }
function facteurMoral(o){ return (0.8 + 0.35*clamp(o.moral,0,1)) * (1 - 0.15*clamp(o.fatigue,0,1)); }

/* ------------------------------------------------------------- Une machine */
function creerMachine(type, x, y, rotation){
  const d = MACHINES[type];
  const tourne = rotation % 2 === 1;
  return {
    id: nouvelId(), type, x, y, rotation: rotation||0,
    l: tourne ? d.h : d.l,
    h: tourne ? d.l : d.h,
    recetteId: d.recettes[0] || null,
    progression: 0, enCycle: false,
    entree: {}, sortie: {},
    usure: 0, enPanne: false,
    operateurId: null,
    filtre: null,               // bacs dédiés : la marchandise rangée dedans
    debitReel: 0,
    produitAujourdhui: 0,
    fraicheurHuile: d.bainHuile ? 1 : undefined,
    tauxRebut: 0,
    arretRestant: 0,
    etat: "arret",
    minuteBloquee: 0,
    flash: 0            // purement visuel, remis à zéro par le rendu
  };
}

function simMachine(m, dt){
  const d = MACHINES[m.type];
  if (d.stockage || d.batiment){ m.etat = "produit"; m.debitReel = 0; return; }

  const r = recetteDe(m);
  if (!r){ m.etat = "arret"; m.debitReel = 0; return; }

  if (m.enPanne){ m.etat = "panne"; m.debitReel = 0; m.minuteBloquee += dt; return; }

  // Immobilisation volontaire : on refait le bain d'huile.
  if (m.arretRestant > 0){
    m.arretRestant -= dt;
    m.etat = "arret"; m.debitReel = 0; m.minuteBloquee += dt;
    return;
  }

  // Opérateur : les machines manuelles ne tournent pas toutes seules.
  let op = null, fOp = 1, fMoral = 1;
  if (!d.auto){
    op = (m.operateurId != null) ? ouvrierParId(m.operateurId) : null;
    if (!op || !op.tache || op.tache.type !== "opere" || op.tache.machineId !== m.id){
      m.operateurId = null;
      m.etat = "sans_operateur"; m.debitReel = 0; m.minuteBloquee += dt;
      return;
    }
    fOp = facteurOperateur(op, m);
    fMoral = facteurMoral(op);
  }

  // Démarrage d'un cycle : on réserve les entrées tout de suite.
  if (!m.enCycle){
    const idRate = ITEMS[r.sortie.id].rate;
    const trieQualite = d.qualite && idRate && etat.meta.age >= 3;
    if (!placeSortie(m, r.sortie.id, r.sortie.qte) ||
        (trieQualite && !placeSortie(m, idRate, r.sortie.qte*0.25))){
      m.etat = "sortie_pleine"; m.debitReel = 0; m.minuteBloquee += dt; return;
    }
    let manque = false;
    for (const e of r.entrees) if ((m.entree[e.id]||0) < e.qte - 1e-9) manque = true;
    if (manque){
      m.etat = "attente_matiere"; m.debitReel = 0; m.minuteBloquee += dt; return;
    }
    for (const e of r.entrees){
      m.entree[e.id] -= e.qte;
      if (m.entree[e.id] < 1e-6) delete m.entree[e.id];
    }
    m.enCycle = true;
    m.progression = 0;
  }

  const v = fOp * facteurUsure(m) * fMoral;
  m.progression += (dt * v) / r.duree;
  m.etat = "produit";
  m.minuteBloquee = 0;
  // Débit affiché : toujours par jour, jamais par seconde (§3.1)
  m.debitReel = (v / r.duree) * r.sortie.qte * CONFIG.minutesParJour;

  // Usure proportionnelle à la charge
  m.usure = clamp(m.usure + d.usureParJour * mode().usure * (dt / CONFIG.minutesParJour), 0, 1);

  // Le bain d'huile perd sa fraîcheur à mesure qu'on y cuit.
  if (d.bainHuile && etat.meta.age >= 3)
    m.fraicheurHuile = clamp((m.fraicheurHuile ?? 1) - CONFIG.usureHuileParJour * (dt/CONFIG.minutesParJour), 0, 1);

  if (m.progression >= 1){
    m.progression = 0;
    m.enCycle = false;
    // Ce qui est mal cuit ou mal soudé sort quand même, mais à part (§6.6).
    const idRate = ITEMS[r.sortie.id].rate;
    const t = (d.qualite && idRate) ? tauxRebut(m, op) : 0;
    m.tauxRebut = t;
    const mauvais = r.sortie.qte * t;
    const bon = r.sortie.qte - mauvais;
    if (bon > 0) m.sortie[r.sortie.id] = (m.sortie[r.sortie.id]||0) + bon;
    if (mauvais > 0){
      m.sortie[idRate] = (m.sortie[idRate]||0) + mauvais;
      etat.stats.semaineCourante.rebuts += mauvais;
      compter(etat.progression.produits, idRate, mauvais);
    }
    m.produitAujourdhui += bon;
    compter(etat.progression.produits, r.sortie.id, bon);
    compter(etat.progression.produitsSemaine, r.sortie.id, bon);
    compter(etat.stats.semaineCourante.produits, r.sortie.id, bon);
    m.flash = 1;
    if (op){ op.fatigue = clamp(op.fatigue + 0.012, 0, 1); gagnerCompetence(op, m); }
    effetProduction(m, r);
  }

  // Pannes : à partir de l'âge 2, une machine usée finit par lâcher.
  if (etat.meta.age >= 2 && m.usure > 0.6){
    const p = (m.usure - 0.6) * 0.0016 * dt;
    if (Math.random() < p) declencherPanne(m);
  }
}

function gagnerCompetence(o, m){
  const c = COMP_MACHINE[m.type];
  if (!c) return;
  o.competences[c] = clamp((o.competences[c]||0.5) + 0.0012, 0, 1);
}

/* ------------------------------------------------------------- Qualité
   Une note implicite, jamais montrée en chiffre au joueur : elle se dit en
   mots, et se voit au bac de rebut qui se remplit (§3.1, §3.2). */
function qualiteMachine(m, op){
  const u = U();
  const d = MACHINES[m.type];
  let q = 0.58;
  q += 0.25 * (op ? (op.competences[COMP_MACHINE[m.type]] ?? 0.5) : 0.7);
  q += 0.15 * (1 - clamp(m.usure,0,1));
  q -= 0.15 * (op ? op.fatigue : 0);
  q -= 0.25 * clamp(u.salete,0,1);
  if (d.bainHuile) q += 0.20 * clamp(m.fraicheurHuile ?? 1, 0, 1) - 0.10;
  return clamp(q, 0, 1);
}

/** Part de la production qui part au rebut. 0 tant que la qualité n'est pas
 *  un sujet, c'est-à-dire avant l'âge 3 (§3.3). */
function tauxRebut(m, op){
  if (etat.meta.age < 3) return 0;
  return clamp(0.90 - qualiteMachine(m, op), 0, CONFIG.rebutMax);
}

/** La même chose, en français d'atelier. */
function motRebut(t){
  if (t <= 0.005) return "rien ne part au rebut";
  const surN = Math.max(2, Math.round(1/t));
  return "1 kilo sur " + surN + " part au rebut";
}

/** Refaire le bain : de l'huile neuve, et la friteuse s'arrête un moment. */
function changerHuile(m){
  const besoin = CONFIG.chargeHuile;
  const enStock = Math.min(besoin, stockDe("huile"));
  const aAcheter = besoin - enStock;
  const cout = aAcheter * prixAchat("huile");
  if (etat.finances.solde - cout < CONFIG.faillite){
    notif("Impossible", "Pas de quoi payer l'huile neuve.", "ko"); return;
  }
  if (enStock > 0) ajouterStock("huile", -enStock);
  if (aAcheter > 0) depenser(cout, "achat");
  m.fraicheurHuile = 1;
  m.arretRestant = CONFIG.arretChangementHuile;
  m.enCycle = false; m.progression = 0;
  notif("Bain refait", "Huile neuve dans " + MACHINES[m.type].nom.toLowerCase() +
        ". Elle repart dans " + CONFIG.arretChangementHuile + " minutes.", "ok");
  son("depot");
  for (let i=0;i<8;i++) particule(m.x+m.l/2+hasard(-0.5,0.5), m.y+m.h/2, "vapeur");
}

function declencherPanne(m){
  m.enPanne = true;
  m.enCycle = false;
  m.progression = 0;
  etat.stats.semaineCourante.pannes++;
  notif("Panne", MACHINES[m.type].nom + " s'est arrêtée. Un clic dessus pour la remettre en route.", "ko");
  son("panne");
  vue.secousse = 6;
  for (let i=0;i<12;i++) particule(m.x+m.l/2, m.y+m.h/2, "fumeeNoire");
  paroleContexte("panne", { machine: MACHINES[m.type].nom });
}

function reparerMachine(m){
  const cout = Math.round(MACHINES[m.type].cout * 0.12);
  if (etat.finances.solde < cout && etat.finances.solde < CONFIG.decouvertMax){
    notif("Impossible", "Pas assez d'argent pour la réparation.", "ko"); return;
  }
  depenser(cout, "reparation");
  m.enPanne = false;
  m.usure = Math.max(0.1, m.usure - 0.35);
  notif("Réparée", MACHINES[m.type].nom + " repart. " + euros(cout) + " de pièces.", "ok");
  son("cle");
}

function reviserMachine(m){
  const cout = Math.round(MACHINES[m.type].cout * 0.2);
  if (etat.finances.solde - cout < CONFIG.faillite){
    notif("Impossible", "La caisse ne suit pas.", "ko"); return;
  }
  depenser(cout, "revision");
  m.usure = 0.1;
  m.enPanne = false;
  notif("Révisée", MACHINES[m.type].nom + " est comme neuve. " + euros(cout) + ".", "ok");
  son("cle");
}

/* ------------------------------------------------------------ Convoyeurs */
const CONV = {
  coutParTuile: 45,
  coutPont: 120,      // le supplément d'une tuile qui enjambe une autre bande
  debitMax: 6,        // unités par minute de jeu
  vitesse: 0.5        // tuiles par minute de jeu
};

/* Les ponts. Une bande peut enjamber une autre bande : la tuile est alors
   partagée, et c'est la bande du dessous qui garde la grille. Une tuile de
   pont ne raccorde rien — un raccord ne se fait qu'aux deux bouts d'une
   bande — donc croiser et se brancher ne se confondent jamais. */
function clePont(x,y){ return x + "," + y; }
function estPont(c, x, y){ return !!c.ponts && c.ponts.indexOf(clePont(x,y)) >= 0; }
function tuilesAuSol(c){ return c.chemin.filter(t => !estPont(c, t.x, t.y)); }

/** La place qu'occupe UNE unité d'une matière sur une bande.
 *  Un kilo de rondelles et un sachet de 150 g ne tiennent pas la même place :
 *  sans cette conversion, une bande chargée de sachets se croit pleine et
 *  refuse deux kilos de sel — qui se retrouvent coupés en deux au raccord. */
function volumeItem(id){
  return CONFIG.capaciteSortie / capaciteItem(id, CONFIG.capaciteSortie);
}

/** Ce qui est déjà sur la bande, exprimé dans une unité commune. */
function chargeConvoyeur(c){
  let s = 0;
  for (let i=0;i<c.transit.length;i++) s += c.transit[i].qte * volumeItem(c.transit[i].item);
  return s;
}

/** Ce que la bande peut porter, dans la même unité commune. */
function capaciteConvoyeur(c){
  return c.chemin.length * CONFIG.capaciteSortie / 8;
}

/** Combien d'unités de cette matière-là tiennent encore dessus. */
function placeConvoyeur(c, item){
  return Math.max(0, (capaciteConvoyeur(c) - chargeConvoyeur(c)) / volumeItem(item));
}

/** Dépose de la marchandise en tête de bande. Fusionne avec le dernier colis
 *  si l'écart de position est négligeable, pour ne pas multiplier les objets. */
function chargerConvoyeur(c, item, q){
  const dernier = c.transit[c.transit.length-1];
  if (dernier && dernier.item === item && c.latence - dernier.t < CONFIG.minutesParTick*0.5)
    dernier.qte += q;
  else
    c.transit.push({ item, qte:q, t:c.latence });
  c.recuTick = (c.recuTick||0) + q;
}

function creerConvoyeur(chemin, source, destination){
  return {
    id: nouvelId(), type:"convoyeur",
    chemin: chemin.map(p => ({x:p.x, y:p.y})),
    source, destination,
    filtre: null,               // null = la bande prend ce que l'aval réclame
    debitMax: CONV.debitMax,
    debitActuel: 0,
    ponts: [],          // tuiles où la bande passe au-dessus d'une autre
    latence: Math.max(0.5, chemin.length / CONV.vitesse),
    transit: [],        // [{item, qte, t}] — t = minutes restantes
    etat: "produit"
  };
}

function simConvoyeur(c, dt){
  const src = noeudParId(c.source);
  const dst = noeudParId(c.destination);

  // 1. Avancement de ce qui est déjà sur la bande.
  let livrable = 0;
  for (let i=0; i<c.transit.length; i++){
    const p = c.transit[i];
    if (p.t > 0) p.t = Math.max(0, p.t - dt);
  }
  // 2. Déchargement en bout de bande (dans l'ordre d'arrivée).
  while (c.transit.length && c.transit[0].t <= 0){
    const p = c.transit[0];
    const place = dst ? placeEntree(dst, p.item) : 0;
    if (place <= 1e-6) break;                 // bouchon : ça s'entasse au bout
    // Un colis passe entier ou il attend : le couper en deux au raccord
    // donnerait deux moitiés posées de part et d'autre de la jonction.
    // Seule exception : un colis à lui seul plus gros que tout l'aval.
    if (place < p.qte - 1e-6 && p.qte <= placeTotale(dst, p.item) + 1e-6) break;
    const q = Math.min(p.qte, place);
    livrer(dst, p.item, q);
    p.qte -= q;
    livrable += q;
    if (p.qte <= 1e-6) c.transit.shift(); else break;
  }

  // 3. Chargement en tête de bande.
  const recu = c.recuTick || 0;
  c.recuTick = 0;
  c.debitActuel = 0;
  if (!src || !dst){ c.etat = "non_relie"; return; }

  // Une bande alimentée par une autre bande ne tire rien : elle est poussée
  // par l'amont, à l'étape 2 de la simulation de celui-ci.
  let charge = 0;
  if (!estConvoyeur(src)){
    let budget = c.debitMax * dt;

    // Le quai et les caisses fournissent ce dont l'aval a besoin ; une machine
    // pousse simplement ce qu'elle a produit.
    let candidats;
    if (estQuai(src) || MACHINES[src.type]?.stockage){
      candidats = itemsAcceptes(dst).filter(it => sortieDispo(src, it) > 1e-6 && placeEntree(dst, it) > 1e-6);
      candidats.sort((a,b) => manqueRelatif(dst,a) - manqueRelatif(dst,b));
    } else {
      candidats = Object.keys(src.sortie).filter(it => src.sortie[it] > 1e-6);
    }
    // Un filtre posé sur la bande a le dernier mot.
    if (c.filtre) candidats = candidats.filter(it => it === c.filtre);

    for (const it of candidats){
      if (budget <= 1e-6) break;
      const place = placeEntree(dst, it);
      if (place <= 1e-6) continue;
      const q = Math.min(budget, sortieDispo(src, it), place + 40);   // on tolère un peu de file
      if (q <= 1e-6) continue;
      retirerSortie(src, it, q);
      chargerConvoyeur(c, it, q);
      c.recuTick = 0;                       // ce chargement-ci n'est pas une réception
      budget -= q;
      charge += q;
    }
  }

  const passe = charge + recu;
  c.debitActuel = (passe / dt) * CONFIG.minutesParJour;   // par jour, pour l'affichage
  c.etat = (c.transit.length && c.transit[0].t <= 0) ? "sortie_pleine"
         : (passe > 0 ? "produit" : "attente_matiere");
}

/** Cherche une machine, une caisse, le quai ou une autre bande au contact
 *  d'une tuile. Une machine prime toujours sur un convoyeur. */
function voisinNoeud(t, exclure, exclureId, exclureAussi){
  const u = U();
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  const rejete = id => id === exclureId || (exclureAussi && id === exclureAussi);
  let bande = null;
  for (const [dx,dy] of dirs){
    const x = t.x+dx, y = t.y+dy;
    if (exclure && x === exclure.x && y === exclure.y) continue;
    const o = occupant(u,x,y);
    if (o === 1){ if (!rejete(1)) return idx.quai; continue; }
    if (o === 2){ if (!rejete(2)) return idx.quaiSortie; continue; }
    if (o > 1){
      const n = noeudParId(o);
      if (!n || rejete(n.id)) continue;
      if (n.type !== "convoyeur") return n;
      if (!bande) bande = n;
    }
  }
  return bande;
}

/** Raccorde tout bout de bande qui pend dans le vide. C'est ce qui permet de
 *  poser les convoyeurs par tronçons et de les brancher les uns aux autres :
 *  plusieurs bandes peuvent converger vers la même. */
/** Le nœud est-il vraiment au contact de cette tuile ? Un quai qui se déplace
 *  ou une machine démolie laisserait sinon un raccord fantôme. */
function auContact(t, id){
  const u = U();
  if (!id) return false;
  const d = [[1,0],[-1,0],[0,1],[0,-1]];
  for (const [dx,dy] of d) if (occupant(u, t.x+dx, t.y+dy) === id) return true;
  return false;
}

function relierConvoyeurs(){
  const u = etat.usines[etat.usineActive];
  if (!u) return;
  for (const c of u.convoyeurs){
    if (!c.chemin.length) continue;
    // Un pont dont le dessous a été démoli redescend au sol et reprend sa tuile.
    if (c.ponts && c.ponts.length)
      c.ponts = c.ponts.filter(k => {
        const [x,y] = k.split(",").map(Number);
        if (occupant(u,x,y) !== 0) return true;
        u.grille[indexCase(u,x,y)] = c.id;
        return false;
      });
    const a = c.chemin[0], b = c.chemin[c.chemin.length-1];
    const apres = c.chemin.length > 1 ? c.chemin[1] : null;
    const avant = c.chemin.length > 1 ? c.chemin[c.chemin.length-2] : null;
    if (c.source && !auContact(a, c.source)) c.source = 0;
    if (c.destination && !auContact(b, c.destination)) c.destination = 0;
    if (!noeudParId(c.source)){
      const n = voisinNoeud(a, apres, c.id);
      c.source = n ? n.id : 0;
    }
    if (!noeudParId(c.destination)){
      // Une bande d'une seule tuile a ses deux bouts au même endroit : le nœud
      // qui l'alimente ne peut pas être aussi celui qu'elle sert.
      const n = voisinNoeud(b, avant, c.id, c.chemin.length === 1 ? c.source : 0);
      c.destination = n ? n.id : 0;
    }
    if (!noeudParId(c.source) || !noeudParId(c.destination)) c.etat = "non_relie";
    else if (c.etat === "non_relie") c.etat = "attente_matiere";
  }
}

/** 0 = vide, 1 = plein : sert à choisir quoi envoyer en priorité. */
function manqueRelatif(n, item){
  if (estQuai(n)) return 1;
  if (estConvoyeur(n)) return chargeConvoyeur(n) / Math.max(1, capaciteConvoyeur(n));
  const d = MACHINES[n.type];
  if (d.stockage) return contenuTotal(n.sortie) / d.capacite;
  return (n.entree[item]||0) / capaciteItem(item, CONFIG.capaciteEntree);
}

/** Ce qu'un convoyeur donné est capable d'apporter à son aval : une machine
 *  ne pousse que ce qu'elle fabrique, un quai ou une caisse peut tout fournir. */
function itemsPortes(src, dst){
  if (estQuai(src) || MACHINES[src.type]?.stockage) return itemsAcceptes(dst);
  const r = recetteDe(src);
  if (!r) return [];
  const out = [r.sortie.id];
  // Un poste qui joue la qualité sort aussi du raté : la bande l'emporte
  // également, et les ouvriers n'ont donc pas à s'en charger.
  const rate = ITEMS[r.sortie.id].rate;
  if (rate && MACHINES[src.type].qualite) out.push(rate);
  return out;
}

/** Un besoin d'entrée est-il déjà couvert par un convoyeur en état de marche ?
 *  Sinon les ouvriers s'en chargent à la main. Attention : un convoyeur qui
 *  amène les cadres ne dispense pas d'apporter la peinture. */
function recalculerBesoinsServis(){
  idx.besoinsServis.clear();
  for (const c of U().convoyeurs){
    if (c.etat === "non_relie") continue;
    const dst = noeudParId(c.destination);
    const src = noeudParId(c.source);
    if (!dst || !src) continue;
    for (const it of itemsPortes(src, dst)) idx.besoinsServis.add(dst.id + ":" + it);
  }
}

/** Le convoyeur évacue-t-il déjà la sortie de ce nœud ? */
function sortieEvacuee(n){
  for (const c of U().convoyeurs)
    if (c.source === n.id && c.etat !== "non_relie") return true;
  return false;
}

/* ============================================================================
   SIMULATION (2/2) — ouvriers, temps, argent, commandes, marché, progression
   ========================================================================== */

function compter(o, k, v){ o[k] = (o[k]||0) + v; }

/* ------------------------------------------------- Déplacement sur la grille */
function traversable(u, x, y){
  const o = occupant(u,x,y);
  if (o === -1) return false;
  if (o === 0) return true;
  const n = noeudParId(o);
  return !!(n && n.type === "convoyeur");     // on marche sur les convoyeurs
}

/** A* simplifié. Grilles petites, appels rares : pas besoin de tas binaire. */
function cheminVers(u, sx, sy, tx, ty){
  if (sx === tx && sy === ty) return [];
  const L = largeurPlan(u), cour = profondeurCour(u);
  const dep = indexCase(u,sx,sy), arr = indexCase(u,tx,ty);
  if (!traversable(u,tx,ty)) return null;

  const ouvert = [dep];
  const vientDe = new Map();
  const g = new Map([[dep,0]]);
  const f = new Map([[dep, Math.abs(tx-sx)+Math.abs(ty-sy)]]);
  const clos = new Set();
  let garde = 0;

  while (ouvert.length && garde++ < 12000){
    let bi = 0;
    for (let i=1;i<ouvert.length;i++) if ((f.get(ouvert[i])||1e9) < (f.get(ouvert[bi])||1e9)) bi = i;
    const cur = ouvert.splice(bi,1)[0];
    if (cur === arr){
      const chemin = [];
      let c = cur;
      while (c !== dep){ chemin.push({ x:c%L - cour, y:Math.floor(c/L) - cour }); c = vientDe.get(c); }
      chemin.reverse();
      return chemin;
    }
    clos.add(cur);
    const cx = cur%L - cour, cy = Math.floor(cur/L) - cour;
    for (let d=0; d<4; d++){
      const nx = cx + (d===0?1:d===1?-1:0), ny = cy + (d===2?1:d===3?-1:0);
      if (!dansPlan(u,nx,ny)) continue;
      const ni = indexCase(u,nx,ny);
      if (clos.has(ni) || !traversable(u,nx,ny)) continue;
      if (!franchissable(u,cx,cy,nx,ny)) continue;     // on sort par la porte
      const ng = (g.get(cur)||0) + 1;
      if (ng < (g.get(ni) ?? 1e9)){
        vientDe.set(ni,cur); g.set(ni,ng);
        f.set(ni, ng + Math.abs(tx-nx) + Math.abs(ty-ny));
        if (!ouvert.includes(ni)) ouvert.push(ni);
      }
    }
  }
  return null;
}

/** Tuile libre au contact d'un nœud, la plus proche de (px,py). */
function tuileAcces(u, n, px, py){
  let best = null, bd = 1e9;
  for (let dy=-1; dy<=n.h; dy++){
    for (let dx=-1; dx<=n.l; dx++){
      const bordX = dx === -1 || dx === n.l;
      const bordY = dy === -1 || dy === n.h;
      if (bordX === bordY) continue;                     // pas les diagonales
      const x = n.x+dx, y = n.y+dy;
      if (!traversable(u,x,y)) continue;
      const d = (x-px)*(x-px) + (y-py)*(y-py);
      if (d < bd){ bd = d; best = {x,y}; }
    }
  }
  return best;
}

function envoyerVers(o, tx, ty){
  const u = U();
  const ch = cheminVers(u, Math.round(o.x-0.5), Math.round(o.y-0.5), tx, ty);
  o.chemin = ch;                       // null = pas de route
  o.cible = { x:tx, y:ty };
  return ch !== null;
}

/** Avance l'ouvrier le long de son chemin. Renvoie true à l'arrivée. */
function avancer(o, dt){
  if (!o.chemin) return true;
  if (!o.chemin.length){ o.cible = null; return true; }
  let reste = CONFIG.vitesseOuvrier * dt * (1 - 0.2*o.fatigue) * (o.etat === "porte" ? 0.9 : 1);
  while (reste > 0 && o.chemin.length){
    const p = o.chemin[0];
    const cx = p.x + 0.5, cy = p.y + 0.5;
    const dx = cx - o.x, dy = cy - o.y;
    const d = Math.hypot(dx,dy);
    if (d < 1e-4){ o.chemin.shift(); continue; }
    if (Math.abs(dx) > Math.abs(dy)) o.dir = dx > 0 ? 1 : 3; else o.dir = dy > 0 ? 2 : 0;
    if (d <= reste){ o.x = cx; o.y = cy; reste -= d; o.chemin.shift(); }
    else { o.x += dx/d*reste; o.y += dy/d*reste; reste = 0; }
    o.phase += 0.9;
  }
  if (!o.chemin.length){ o.cible = null; return true; }
  return false;
}

/* ------------------------------------------------------ Choix d'une tâche */

/** Tâches déjà prises par d'autres, pour éviter que deux ouvriers se doublent. */
function reservations(){
  const r = new Set();
  for (const o of U().ouvriers)
    if (o.tache && o.tache.type === "porte") r.add(o.tache.cibleId + ":" + o.tache.item);
  return r;
}

function listerSources(item, exclureId){
  const u = U(), out = [];
  if ((u.stocks[item]||0) > 0.5) out.push(noeudParId(1));
  for (const m of u.machines){
    if (m.id === exclureId) continue;
    if ((m.sortie[item]||0) > 0.5) out.push(m);
  }
  return out;
}

function meilleurTransport(o){
  const u = U(), res = reservations();
  let best = null, bs = -1e9;

  // a) alimenter les machines qui ont faim
  for (const m of u.machines){
    const r = recetteDe(m);
    if (!r) continue;
    for (const e of r.entrees){
      if (idx.besoinsServis.has(m.id + ":" + e.id)) continue;    // un convoyeur s'en charge
      if (res.has(m.id + ":" + e.id)) continue;
      const dispo = m.entree[e.id]||0;
      const voulu = e.qte * 6;
      if (dispo >= voulu) continue;
      const sources = listerSources(e.id, m.id);
      if (!sources.length) continue;
      for (const s of sources){
        const acces = tuileAcces(u, s, o.x, o.y);
        if (!acces) continue;
        const dist = Math.hypot(acces.x-o.x, acces.y-o.y) + Math.hypot(s.x-m.x, s.y-m.y);
        const urgence = 1 - dispo/voulu;
        const score = 10*urgence + (m.id === o.posteAssigne ? 6 : 0) - dist*0.22;
        if (score > bs){
          bs = score;
          best = { type:"porte", item:e.id, sourceId:s.id, cibleId:m.id, phase:"vers_source" };
        }
      }
    }
  }

  // b) évacuer ce qui s'entasse (produits finis vers le quai, pièces vers une caisse)
  for (const m of u.machines){
    if (MACHINES[m.type].stockage) continue;
    if (sortieEvacuee(m)) continue;
    for (const it in m.sortie){
      const q = m.sortie[it];
      if (q < 1) continue;
      const estProduit = ITEMS[it].cat === "produit" || ITEMS[it].cat === "rebut";
      const remplissage = q / capaciteItem(it, CONFIG.capaciteSortie);
      if (!estProduit && remplissage < 0.45) continue;
      // destination : le quai pour un produit fini, sinon une caisse qui a de la place
      let dest = null;
      // Un poste qui consomme cette matière passe avant tout : c'est ainsi que
      // le rebut trouve la table de tri sans qu'on ait rien à câbler.
      for (const c of u.machines)
        if (!MACHINES[c.type].stockage && c.id !== m.id && placeEntree(c, it) > 2){ dest = c; break; }
      if (!dest && estProduit) dest = noeudParId(2);          // au quai de sortie
      if (!dest){
        for (const c of u.machines)
          if (MACHINES[c.type].stockage && placeEntree(c, it) > 2){ dest = c; break; }
        if (!dest && remplissage > 0.9) dest = noeudParId(estProduit ? 2 : 1);
      }
      if (!dest || res.has(dest.id + ":" + it)) continue;
      const acces = tuileAcces(u, m, o.x, o.y);
      if (!acces) continue;
      const dist = Math.hypot(acces.x-o.x, acces.y-o.y);
      const score = (estProduit ? 8.5 : 4) + 5*remplissage - dist*0.22;
      if (score > bs){
        bs = score;
        best = { type:"porte", item:it, sourceId:m.id, cibleId:dest.id, phase:"vers_source" };
      }
    }
  }
  return best ? { tache:best, score:bs } : null;
}

function machinePeutTourner(m){
  const r = recetteDe(m);
  if (!r || m.enPanne) return false;
  if (!placeSortie(m, r.sortie.id, r.sortie.qte)) return false;
  if (m.enCycle) return true;
  for (const e of r.entrees) if ((m.entree[e.id]||0) < e.qte - 1e-9) return false;
  return true;
}

function meilleureMachineAOperer(o){
  const u = U();
  let best = null, bs = -1e9;
  for (const m of u.machines){
    const d = MACHINES[m.type];
    if (d.auto || d.stockage || m.enPanne) continue;
    if (m.operateurId && m.operateurId !== o.id) continue;
    if (!machinePeutTourner(m)) continue;
    const acces = tuileAcces(u, m, o.x, o.y);
    if (!acces) continue;
    const dist = Math.hypot(acces.x-o.x, acces.y-o.y);
    const comp = o.competences[COMP_MACHINE[m.type]] ?? 0.5;
    // Produire dans un tampon déjà plein ne sert à rien : ça compte contre.
    const encombre = contenuTotal(m.sortie) / CONFIG.capaciteSortie;
    let score = 7 + 3*comp - dist*0.22 - 6*clamp(encombre,0,1);
    if (o.posteAssigne === m.id) score += 12;
    else if (o.posteAssigne) score -= 8;                    // il a un poste, il y reste
    if (score > bs){ bs = score; best = m; }
  }
  return best ? { machine:best, score:bs } : null;
}

/* ------------------------------------------------- Affectation d'un coup
   Sur une grande ligne, assigner poste par poste est fastidieux. Ce bouton
   place au mieux : chaque machine à opérer reçoit la personne disponible qui
   s'y débrouille le mieux, en tenant compte du trajet. On couvre d'abord les
   machines qui n'ont personne — il vaut toujours mieux dix postes tenus
   correctement qu'un seul tenu parfaitement. */
function machinesAOperer(){
  return U().machines.filter(m => {
    const d = MACHINES[m.type];
    return !d.auto && !d.stockage && !d.batiment;
  });
}

function affecterAutomatiquement(){
  const u = U();
  const libres = u.ouvriers.filter(o => !o.enFormation);
  const postes = machinesAOperer();
  if (!postes.length){ notif("Rien à tenir", "Aucune machine ne demande quelqu'un.", "att"); return 0; }
  if (!libres.length){ notif("Personne", "Il n'y a personne à placer.", "att"); return 0; }

  // Toutes les paires possibles, la meilleure d'abord. Tableaux courts : un tri
  // suffit, pas besoin d'algorithme d'affectation optimale.
  const paires = [];
  for (const o of libres)
    for (const m of postes){
      const acces = tuileAcces(u, m, o.x, o.y);
      if (!acces) continue;
      const comp = o.competences[COMP_MACHINE[m.type]] ?? 0.5;
      const dist = Math.hypot(acces.x - o.x, acces.y - o.y);
      paires.push({ o, m, score: 10*comp - dist*0.12 });
    }
  paires.sort((a,b) => b.score - a.score);

  const prisO = new Set(), prisM = new Set();
  let n = 0;
  for (const p of paires){
    if (prisO.has(p.o.id) || prisM.has(p.m.id)) continue;
    prisO.add(p.o.id); prisM.add(p.m.id);
    if (p.o.posteAssigne !== p.m.id){ p.o.posteAssigne = p.m.id; libererTache(p.o); }
    n++;
  }
  // Ceux qui restent sans poste redeviennent libres : ils porteront la
  // marchandise, ce qui est souvent ce qui manque le plus.
  for (const o of libres) if (!prisO.has(o.id)) o.posteAssigne = null;

  const reste = postes.length - n, dispo = libres.length - n;
  let dit = n + " " + pluriel(n,"poste") + " " + pluriel(n,"tenu") + ".";
  if (reste > 0) dit += " " + reste + " " + pluriel(reste,"machine") + " sans personne.";
  else if (dispo > 0) dit += " " + dispo + " " + pluriel(dispo,"personne") + " au portage.";
  notif("Équipe placée", dit, n ? "ok" : "att");
  son("valide");
  return n;
}

/** Tout le monde redevient libre : l'équipe se replace toute seule. */
function libererTousLesPostes(){
  const u = U();
  let n = 0;
  for (const o of u.ouvriers) if (o.posteAssigne != null){ o.posteAssigne = null; libererTache(o); n++; }
  notif("Postes libérés", n ? n + " " + pluriel(n,"personne") + " " + pluriel(n,"redevient","redeviennent") +
        " libre" + (n>1?"s":"") + " de choisir." : "Personne n'avait de poste fixe.", "");
  return n;
}

/* ---------------------------------------------------------- Un ouvrier, un tick */
function simOuvrier(o, dt){
  o.fatigue = clamp(o.fatigue + dt/CONFIG.minutesParJour * 0.55 * (1/(traitDe(o).fatigue||1)), 0, 1);
  o.minuteur -= dt;

  // En formation : la personne est mobilisée, elle ne tient aucun poste.
  if (o.enFormation){ o.etat = "formation"; o.fatigue = clamp(o.fatigue - dt*0.01, 0, 1); return; }

  // Coup de barre. Avec une salle de pause, on va vraiment se poser ; sans,
  // on souffle sur place, bien moins efficacement.
  if (o.etat === "pause"){
    const enSalle = o.tache && o.tache.type === "repos" && o.tache.phase === "assis";
    o.fatigue = clamp(o.fatigue - dt*(enSalle ? CONFIG.reposFatigue : 0.008), 0, 1);
    if (enSalle) o.moral = clamp(o.moral + dt*0.0012, 0, 1);
    if (o.minuteur <= 0){ libererTache(o); o.etat = "attend"; }
    return;
  }
  if (o.tache && o.tache.type === "repos"){ tacheRepos(o, dt); return; }
  if (o.fatigue > 0.9 && (!o.tache || o.tache.type !== "porte")){
    libererTache(o);
    const salle = salleLaPlusProche(o, "salle_pause");
    if (salle){
      const acces = tuileAcces(U(), salle, o.x, o.y);
      if (acces && envoyerVers(o, acces.x, acces.y)){
        o.tache = { type:"repos", salleId:salle.id, phase:"vers_salle" };
        o.etat = "deplace";
        return;
      }
    }
    o.etat = "pause"; o.minuteur = 25;
    return;
  }

  if (!o.tache) choisirTache(o);
  if (!o.tache){ flaner(o, dt); return; }

  if (o.tache.type === "porte") tachePorte(o, dt);
  else tacheOpere(o, dt);
}

function choisirTache(o){
  const t = meilleurTransport(o);
  const m = meilleureMachineAOperer(o);
  if (t && (!m || t.score >= m.score)){
    o.tache = t.tache;
    const src = noeudParId(o.tache.sourceId);
    const acc = src ? tuileAcces(U(), src, o.x, o.y) : null;
    if (!acc || !envoyerVers(o, acc.x, acc.y)){ o.tache = null; return; }
    o.etat = "deplace";
  } else if (m){
    const acc = tuileAcces(U(), m.machine, o.x, o.y);
    if (!acc || !envoyerVers(o, acc.x, acc.y)) return;
    o.tache = { type:"opere", machineId:m.machine.id, phase:"vers_poste" };
    o.etat = "deplace";
  }
}

function libererTache(o){
  if (o.tache && o.tache.type === "opere"){
    const m = noeudParId(o.tache.machineId);
    if (m && m.operateurId === o.id) m.operateurId = null;
  }
  o.tache = null; o.chemin = null; o.cible = null;
  if (o.etat !== "pause") o.etat = "attend";
}

function tachePorte(o, dt){
  const u = U();
  const src = noeudParId(o.tache.sourceId);
  const cib = noeudParId(o.tache.cibleId);
  if (!src || !cib){ deposerAuQuai(o); libererTache(o); return; }

  if (o.tache.phase === "vers_source"){
    o.etat = o.charge ? "porte" : "deplace";
    if (avancer(o, dt)){
      const place = placeEntree(cib, o.tache.item);
      const q = Math.min(ITEMS[o.tache.item].portee, sortieDispo(src, o.tache.item), Math.max(place, 0));
      if (q < 0.5){ libererTache(o); return; }
      retirerSortie(src, o.tache.item, q);
      o.charge = { item:o.tache.item, qte:q };
      o.tache.phase = "vers_cible";
      const acc = tuileAcces(u, cib, o.x, o.y);
      if (!acc || !envoyerVers(o, acc.x, acc.y)){ deposerAuQuai(o); libererTache(o); return; }
      o.etat = "porte";
      son("prise");
    }
  } else {
    o.etat = "porte";
    if (avancer(o, dt)){
      if (o.charge){
        const place = placeEntree(cib, o.charge.item);
        const q = Math.min(o.charge.qte, place);
        if (q > 0){ livrer(cib, o.charge.item, q); o.charge.qte -= q; }
        if (o.charge.qte > 0.5){
          // ça ne rentre pas : on repose au quai
          deposerAuQuai(o);
        } else o.charge = null;
        if (estQuai(cib)) son("depot");
      }
      libererTache(o);
    }
  }
}

function deposerAuQuai(o){
  if (!o.charge) return;
  ajouterStock(o.charge.item, o.charge.qte);   // le compartiment se choisit tout seul
  o.charge = null;
}

function tacheOpere(o, dt){
  const m = noeudParId(o.tache.machineId);
  if (!m || m.enPanne){ libererTache(o); return; }

  if (o.tache.phase === "vers_poste"){
    o.etat = "deplace";
    if (avancer(o, dt)){
      if (m.operateurId && m.operateurId !== o.id){ libererTache(o); return; }
      m.operateurId = o.id;
      o.tache.phase = "poste";
      o.minuteur = 18;                     // durée minimale d'un poste, évite le zapping
      o.etat = "travaille";
    }
    return;
  }

  o.etat = "travaille";
  m.operateurId = o.id;

  // La machine ne peut plus tourner et ça dure : on va voir ailleurs.
  if (m.etat !== "produit" && o.minuteur <= 0 && m.minuteBloquee > 12){ libererTache(o); return; }

  // Fin de vacation : on relève la tête. Si un poste en aval crie famine
  // pendant qu'on produit tranquillement, on lâche la machine et on va porter.
  if (o.minuteur <= 0){
    o.minuteur = 12;                       // on ne se repose pas la question à chaque tick
    const comp = o.competences[COMP_MACHINE[m.type]] ?? 0.5;
    const encombre = contenuTotal(m.sortie) / CONFIG.capaciteSortie;
    const scoreIci = 7 + 3*comp - 6*clamp(encombre,0,1) + (o.posteAssigne === m.id ? 12 : 0);
    const t = meilleurTransport(o);
    if (t && t.score > scoreIci + 2) libererTache(o);
  }
}

/** Le bâtiment de ce type le plus proche d'un ouvrier. */
function salleLaPlusProche(o, type){
  let best = null, bd = 1e9;
  for (const m of U().machines){
    if (m.type !== type) continue;
    const d = (m.x+m.l/2-o.x)**2 + (m.y+m.h/2-o.y)**2;
    if (d < bd){ bd = d; best = m; }
  }
  return best;
}

/** Aller s'asseoir en salle de pause, puis y récupérer pour de bon. */
function tacheRepos(o, dt){
  const salle = noeudParId(o.tache.salleId);
