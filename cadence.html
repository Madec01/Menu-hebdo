  if (!salle || salle.type !== "salle_pause"){ libererTache(o); o.etat = "pause"; o.minuteur = 25; return; }
  if (o.tache.phase === "vers_salle"){
    o.etat = "deplace";
    if (avancer(o, dt)){
      o.tache.phase = "assis";
      o.etat = "pause";
      o.minuteur = CONFIG.reposMinutes;
    }
    return;
  }
  o.etat = "pause";
}

function flaner(o, dt){
  o.etat = "attend";
  if (o.chemin && o.chemin.length){ avancer(o, dt); return; }
  if (Math.random() < 0.02){
    const u = U();
    for (let i=0;i<8;i++){
      const x = hasardInt(0,u.largeur-1), y = hasardInt(0,u.hauteur-1);
      if (traversable(u,x,y)){ envoyerVers(o,x,y); break; }
    }
  }
}

/* ==========================================================================
   Le tick de simulation
   ========================================================================== */
function simTick(){
  const dt = CONFIG.minutesParTick;
  const u = U();

  etat.meta.tempsJeu += dt;

  for (const m of u.machines) simMachine(m, dt);
  for (const c of u.convoyeurs) simConvoyeur(c, dt);
  recalculerBesoinsServis();
  for (const o of u.ouvriers) simOuvrier(o, dt);

  // Fin de journée
  const j = jourCourant();
  if (j !== etat.meta.dernierJourTraite){
    if (etat.meta.dernierJourTraite >= 0) finJournee();
    etat.meta.dernierJourTraite = j;
    debutJournee();
  }
}

/* ------------------------------------------------------------- Journées */
function debutJournee(){
  const u = U();
  for (const o of u.ouvriers){ o.fatigue = 0.08; o.anciennete++; }
  for (const m of u.machines) m.produitAujourdhui = 0;
  majMarche();
  reapprovisionner();
}

function finJournee(){
  const u = U();

  // 1. Les gros clients paient à 30 jours : on encaisse ce qui arrive à terme.
  const dus = etat.finances.creances.filter(c => c.jour <= jourCourant());
  for (const c of dus){
    encaisser(c.montant, "vente");
    notif("Paiement reçu", c.client + " a réglé " + euros(c.montant) + ".", "ok");
    son("argent");
  }
  etat.finances.creances = etat.finances.creances.filter(c => c.jour > jourCourant());

  // 2. Livraisons du jour, puis vente du surplus aux commerces du coin
  livrerContrats();
  vendreSurplus();

  // 2. Charges
  let salaires = 0;
  for (const o of u.ouvriers) salaires += o.salaire;
  const loyer = CONFIG.loyerParJour[etat.meta.age-1];
  const energie = u.machines.length * CONFIG.energieParMachineJour;
  depenser(salaires, "salaires");
  depenser(loyer, "loyer");
  depenser(energie, "energie");
  etat.finances.totalSalaires += salaires;

  // 3. Emprunts
  for (const e of etat.finances.emprunts){
    if (e.restant <= 0) continue;
    const m = Math.min(e.mensualite, e.restant);
    depenser(m, "emprunt");
    e.restant -= m;
  }
  etat.finances.emprunts = etat.finances.emprunts.filter(e => e.restant > 0.5);

  // 4. Retards de commande
  for (const c of etat.contrats.acceptes){
    if (c.livre >= c.quantite) continue;
    if (jourCourant() > c.dateLimite){
      if (mode().penalites) depenser(c.penaliteRetard, "penalite");
      c.joursRetard = (c.joursRetard||0) + 1;
      etat.stats.semaineCourante.retards++;
      if (c.joursRetard === 1){
        notif("Retard", c.client + " attend toujours " + quantiteItem(c.produitId, c.quantite-c.livre, true) + ". " + euros(c.penaliteRetard) + " par jour.", "ko");
        etat.reputation = clamp(etat.reputation - 3, 0, 100);
        paroleContexte("retard", { client:c.client });
      }
      if (c.joursRetard > 6) annulerContrat(c);
    }
  }

  // 5. Moral, saleté, usure du décor
  majMoral();
  const saleteAvant = u.salete;
  u.salete = clamp(u.salete + 0.012 + u.machines.length*0.0015, 0, 1);
  alerterSalete(saleteAvant, u.salete);

  // 6. Rupture de matière : le joueur ne doit pas la découvrir en voyant
  //    ses machines à l'arrêt (§3.2 — le problème s'annonce).
  alerterRupture();

  // 7. État de la caisse
  verifierFaillite();

  // 8. Les formations et la recherche avancent, et la mode du marché tourne
  avancerFormations();
  avancerRecherche();
  majTendance();
  verifierDeblocages(true);       // la notoriété monte aussi toute seule

  // 9. Objectif
  verifierObjectif();

  // 10. Vendredi soir : on arrête tout et on décide.
  if (jourSemaine() === 0 && jourCourant() > 0) finSemaine();
  else majBandeau();
}

/** Ce que l'atelier consomme d'une matière en une journée pleine : sert à
 *  prévenir avant la rupture, pas après. */
function uneJourneeDe(id){
  let parJour = 0;
  for (const m of U().machines){
    const r = recetteDe(m);
    if (!r) continue;
    for (const e of r.entrees)
      if (e.id === id) parJour += e.qte * (CONFIG.minutesParJour / r.duree) * 0.3;
  }
  return Math.max(5, parJour * 0.5);
}

/** Prévient quand une matière achetée va manquer, une fois par jour au plus. */
function alerterRupture(){
  const u = U();
  const besoins = new Set();
  for (const m of u.machines){
    const r = recetteDe(m);
    if (!r) continue;
    for (const e of r.entrees) if (ITEMS[e.id].achat) besoins.add(e.id);
  }
  const court = [];
  for (const id of besoins) if (stockDe(id) < uneJourneeDe(id)) court.push(id);
  if (!court.length) return;
  const noms = court.map(id => nomItem(id, 2, true, true)).join(", ");
  notif("Bientôt à court", "Il ne reste presque plus " + deDe(noms) + noms + ". Onglet Stocks pour en recommander.", "att");
  if (court.some(id => stockDe(id) < 1))
    parle("On n'a plus " + deDe(noms) + noms + ", patron. Les machines vont s'arrêter.", 11000);
}

/** Une formation par jour de moins. À la fin, la compétence a fait un bond. */
function avancerFormations(){
  const f = etat.formations;
  if (!f || !f.length) return;
  for (const x of f.slice()){
    x.restant--;
    if (x.restant > 0) continue;
    const o = ouvrierParId(x.ouvrierId);
    etat.formations = etat.formations.filter(y => y !== x);
    if (!o) continue;
    o.enFormation = false;
    o.competences[x.competence] = clamp((o.competences[x.competence]||0.5) + CONFIG.formationGain, 0, 1);
    o.moral = clamp(o.moral + 0.12, 0, 1);
    notif("Formation terminée", o.prenom + " " + o.nom + " revient : " +
          (NOM_COMPETENCE[x.competence]||x.competence).toLowerCase() + ", " +
          motCompetence(o.competences[x.competence]) + ".", "ok");
    son("valide");
  }
}

/** Une salle de pause, même vide, change l'ambiance de l'atelier. */
function bonusSallePause(){
  return U().machines.some(m => m.type === "salle_pause") ? 0.07 : 0;
}

function majMoral(){
  const u = U();
  const salaireMoyen = u.ouvriers.reduce((s,o)=>s+o.salaire,0) / Math.max(1,u.ouvriers.length);
  for (const o of u.ouvriers){
    let cible = 0.55;
    cible += clamp((o.salaire - salaireMoyen)/120, -0.15, 0.15);
    cible += (o.salaire >= 130 ? 0.12 : 0) + traitDe(o).moral + bonusSallePause();
    cible -= u.salete * 0.25;
    cible -= o.fatigue * 0.12;
    if (etat.finances.solde < 0) cible -= 0.1;
    o.moral = clamp(lerp(o.moral, clamp(cible,0,1), 0.25), 0, 1);

    // On ne claque pas la porte sur un coup de tête : il faut que ça dure,
    // et le patron est prévenu avant de perdre quelqu'un.
    if (o.moral < 0.25){
      o.joursMoralBas = (o.joursMoralBas||0) + 1;
      if (o.joursMoralBas === 3)
        notif("Ça gronde", o.prenom + " " + o.nom + " ne tient plus. Une augmentation, un atelier propre, ou il part.", "att");
      if (o.joursMoralBas >= 6){
        notif("Démission", o.prenom + " " + o.nom + " s'en va. « Ça n'allait plus. »", "ko");
        u.ouvriers.splice(u.ouvriers.indexOf(o),1);
        etat.reputation = clamp(etat.reputation-1,0,100);
      }
    } else o.joursMoralBas = 0;
  }
}

/** L'atelier qui se crasse est visible au sol, mais ça ne suffit pas :
 *  un problème qui vide l'usine de son personnel doit s'annoncer (§3.2). */
function alerterSalete(avant, apres){
  const seuil = (s, v) => avant < v && apres >= v;
  if (seuil(avant, 0.5)){
    notif("L'atelier se salit", "Ça pèse sur le moral, et sur ce qui sort des machines. Un nettoyage s'impose.", "att");
    parle("Patron, l'atelier est dans un état. L'équipe le voit, et ça se retrouve dans les sachets. Onglet Détail, il y a un bouton pour nettoyer.", 12000);
  } else if (seuil(avant, 0.8)){
    notif("L'atelier est crasseux", "L'équipe parle de partir. Nettoyez avant de perdre du monde.", "ko");
    parle("On ne peut plus travailler là-dedans. Si vous ne faites pas nettoyer, ils s'en iront tous.", 13000);
  }
}

/* ------------------------------------------------------------- Argent */
function depenser(n, motif){
  if (n <= 0) return;
  if (!mode().argentInfini) etat.finances.solde -= n;
  etat.stats.semaineCourante.depenses += n;
  compter(etat.stats.semaineCourante.depensesParMotif, groupeDepense(motif||"autre"), n);
  if (motif === "achat") etat.finances.totalAchats += n;
}

/** Six postes de dépense, pas un de plus : au-delà, un graphique ne se lit plus. */
function groupeDepense(motif){
  switch (motif){
    case "salaires":                                    return "salaires";
    case "achat":                                       return "matiere";
    case "loyer": case "energie": case "labels":        return "loyer";
    case "investissement": case "reparation":
    case "revision": case "nettoyage":                  return "machines";
    case "emprunt":                                     return "emprunts";
    default:                                            return "ennuis";
  }
}
function encaisser(n, motif){
  if (n <= 0) return;
  etat.finances.solde += n;
  etat.stats.semaineCourante.ca += n;
  if (motif === "vente") etat.finances.totalVentes += n;
}

function verifierFaillite(){
  if (!mode().faillite) return;
  const s = etat.finances.solde;
  if (s < CONFIG.faillite){ finDePartie(); return; }
  if (s < CONFIG.decouvertMax){
    const u = U();
    const vendables = u.machines.filter(m => !MACHINES[m.type].stockage);
    if (vendables.length){
      vendables.sort((a,b)=>MACHINES[b.type].cout - MACHINES[a.type].cout);
      const m = vendables[0];
      const prix = Math.round(MACHINES[m.type].cout * 0.5);
      demolir(m, prix);
      notif("La banque a tranché", "Découvert trop lourd : " + MACHINES[m.type].nom + " a été revendue " + euros(prix) + ".", "ko");
      paroleContexte("banque", {});
    }
  }
}

/* ------------------------------------------------------------- Marché */
function initMarche(){
  for (const id in ITEMS){
    const it = ITEMS[id];
    if (!it.achat) continue;
    etat.marche.prix[id] = it.achat;
    etat.marche.tendances[id] = hasard(-0.4,0.4);
  }
}
function majMarche(){
  const j = jourCourant();
  if (etat.marche.dernierJour === j) return;
  etat.marche.dernierJour = j;
  for (const id in ITEMS){
    const it = ITEMS[id];
    if (!it.achat) continue;
    if (Math.random() < 0.09) etat.marche.tendances[id] = hasard(-0.5,0.5);
    const t = etat.marche.tendances[id];
    let p = etat.marche.prix[id] * (1 + (t*0.012 + hasard(-0.02,0.02)) * mode().volatilite);
    p = clamp(p, it.achat*0.75, it.achat*1.25);
    etat.marche.prix[id] = p;
  }
}
function prixAchat(id){
  const base = etat.marche.prix[id] ?? ITEMS[id].achat ?? 0;
  // Le local ne renchérit que ce qui pousse : la patate, l'huile, les arômes.
  // Le sel se ramasse et le film se fabrique — un producteur du coin n'y peut rien.
  return ITEMS[id].agricole ? base * surcoutMatiere() : base;
}

function acheter(id, qte){
  const it = ITEMS[id];
  const prix = prixAchat(id) * qte;
  if (etat.finances.solde - prix < CONFIG.faillite){
    notif("Refusé", "La caisse ne suit pas.", "ko"); return false;
  }
  depenser(prix, "achat");
  ajouterStock(id, qte);
  son("argent");
  flottant(U().quaiEntree.x+1, U().quaiEntree.y+1, "−" + Math.round(prix) + " €", "#e0574a");
  notif("Livraison", quantiteItem(id, qte, true) + " pour " + euros(prix) + ".", "");
  tutoEvenement("achat");
  return true;
}

/* --------------------------------------------------- Gestion des stocks
   Quatre réglages par matière, et pas un de plus : à partir de quand on
   recommande, combien on fait livrer, jusqu'où on accepte de monter, et à quel
   prix on refuse d'acheter. Tout est écrit comme une phrase dans l'onglet
   Stocks — le joueur ne voit jamais un coefficient. */
function reglageStock(id){
  const it = ITEMS[id];
  if (!etat.reappro[id]){
    const j = Math.max(1, uneJourneeDe(id) * 2);
    etat.reappro[id] = it.unite === "kg"
      ? { actif:false, seuil: arrondiLot(j*2, 50), lot: arrondiLot(j*6, 50), plafond:0, prixMax:0 }
      : { actif:false, seuil: arrondiLot(j*2, 10), lot: arrondiLot(j*6, 10), plafond:0, prixMax:0 };
  }
  const r = etat.reappro[id];
  if (r.plafond == null) r.plafond = 0;     // 0 = pas de plafond
  if (r.prixMax == null) r.prixMax = 0;     // 0 = à n'importe quel prix
  return r;
}
function arrondiLot(v, pas){ return Math.max(pas, Math.round(v/pas)*pas); }

/** Combien de jours de marche il reste avec ce qu'on a. */
function autonomieDe(id){
  const parJour = uneJourneeDe(id) * 2;
  if (parJour <= 0) return Infinity;
  return stockDe(id) / parJour;
}

/** Règle une matière sur ce que l'atelier consomme vraiment : deux jours de
 *  marge, six jours de lot. C'est le réglage qu'on ferait à la main. */
function reglerSurConsommation(id){
  const it = ITEMS[id], r = reglageStock(id);
  const pas = it.unite === "kg" ? 50 : 10;
  const j = Math.max(1, uneJourneeDe(id) * 2);
  r.seuil = arrondiLot(j*2, pas);
  r.lot = arrondiLot(j*6, pas);
  r.plafond = arrondiLot(j*14, pas);
  return r;
}

/** Le passage quotidien du fournisseur. Silencieux quand il n'y a rien à faire. */
function reapprovisionner(){
  if (!debloque("reappro")) return;
  const faits = [];
  for (const id in etat.reappro){
    const r = etat.reappro[id];
    if (!r || !r.actif || !ITEMS[id]) continue;
    const stock = stockDe(id);
    if (stock >= r.seuil) continue;
    // Le prix du jour : on peut refuser d'acheter trop cher et attendre.
    const prix = prixAchat(id);
    if (r.prixMax > 0 && prix > r.prixMax){
      if (autonomieDe(id) < 1.5)
        notif("Trop cher pour l'instant", nomItem(id,2,true) + " " + nb(prix,2) + " € le kg, au-dessus de " +
              "votre limite. Il en reste pour moins d'une journée.", "att");
      continue;
    }
    // Le plafond : on ne remplit pas au-delà de ce qu'on a demandé.
    let lot = r.lot;
    if (r.plafond > 0) lot = Math.min(lot, Math.max(0, r.plafond - stock));
    if (lot < 1) continue;
    // La caisse : un réapprovisionnement automatique ne met jamais en faillite.
    if (etat.finances.solde - lot*prix < CONFIG.decouvertMax){
      notif("Recommande impossible", "Il faudrait " + euros(lot*prix) + " pour " +
            nomItem(id,2,true) + ", la caisse ne suit pas.", "ko");
      continue;
    }
    if (acheterSilencieux(id, lot)) faits.push({ id, lot, prix: lot*prix });
  }
  if (faits.length){
    const tot = faits.reduce((s,f) => s + f.prix, 0);
    notif("Livraison automatique",
          faits.map(f => quantiteItem(f.id, f.lot, true)).join(", ") + " — " + euros(tot) + ".", "");
    for (const f of faits) compter(etat.stats.semaineCourante.produits, "_reappro", 0);
  }
}

/** Comme acheter(), sans la notification : le récapitulatif est groupé. */
function acheterSilencieux(id, qte){
  const prix = prixAchat(id) * qte;
  if (etat.finances.solde - prix < CONFIG.faillite) return false;
  depenser(prix, "achat");
  ajouterStock(id, qte);
  return true;
}

function vendreComptant(id, qte){
  const it = ITEMS[id];
  if (!it.vente) return;
  qte = Math.min(Math.floor(qte), Math.floor(stockDe(id)));
  if (qte < 1) return;
  const prix = it.vente * 0.88 * qte;
  ajouterStock(id, -qte);
  encaisser(prix, "vente");
  compter(etat.progression.vendus, id, qte);
  compter(etat.stats.semaineCourante.livres, id, qte);
  son("argent");
  flottant(U().quaiSortie.x+1, U().quaiSortie.y+1, "+" + Math.round(prix) + " €", "#5cba6b");
  notif("Vendu", quantiteItem(id, qte, true) + " au comptant : " + euros(prix) + ".", "ok");
}

/* ------------------------------------------------------------- Commandes */

function capaciteHebdoEstimee(produitId){
  // Ce que l'atelier a réellement sorti la semaine passée, sinon une estimation
  // à partir du poste le plus lent de la chaîne.
  const h = etat.stats.historiqueSemaines;
  for (let i=h.length-1; i>=Math.max(0,h.length-3); i--){
    const q = h[i].produits[produitId] || 0;
    if (q > 0) return q;
  }
  // Sinon : le poste qui sort ce produit, à cadence réduite par le portage.
  const u = U();
  const r = Object.values(RECETTES).find(x => x.sortie.id === produitId);
  if (!r) return 10;
  const postes = u.machines.filter(m => m.type === r.machine).length;
  const parJour = postes * r.sortie.qte * (CONFIG.minutesParJour / r.duree) * 0.42;
  return Math.max(ITEMS[produitId].unite === "kg" ? 30 : 200, Math.round(parJour * CONFIG.joursParSemaine));
}

/* -------------------------------------------------------- Les paliers
   Un marché ne s'achète pas : il s'ouvre quand la marque a ce qu'il demande.
   Le local ne demande rien, l'épicerie fine veut du standing, la centrale veut
   de la confiance et ne veut surtout pas d'une marque trop chic. */
function palierParId(id){ return PALIERS.find(p => p.id === id) || PALIERS[0]; }

function palierOuvert(p){
  if (p.n > etat.meta.age) return false;
  if (mode().toutDebloque) return true;
  // L'export ne s'ouvre qu'à un atelier certifié : c'est ce qui fait du ménage
  // et de l'entretien autre chose qu'une corvée.
  if (p.id === "export" && !labelObtenu("atelier")) return false;
  return notoriete() >= p.notoriete && confianceEffective() >= p.confiance &&
         standing() >= p.standingMin && standing() <= p.standingMax;
}

/** La confiance telle que la voient les clients : les labels rassurent. */
function confianceEffective(){ return clamp(confiance() + bonusConfianceLabels(), 0, 100); }

/** Ce qui manque pour l'ouvrir, en une phrase. Jamais de verrou muet. */
function motPalier(p){
  if (p.n > etat.meta.age) return "à l'âge " + p.n;
  const m = [];
  if (notoriete() < p.notoriete)
    m.push("être connu à " + p.notoriete + " (" + Math.round(notoriete()) + " aujourd'hui)");
  if (p.id === "export" && !labelObtenu("atelier")) m.push("le label « Atelier certifié »");
  if (confianceEffective() < p.confiance)
    m.push("une confiance de " + p.confiance + " (" + Math.round(confianceEffective()) + ")");
  if (standing() < p.standingMin)
    m.push("monter en gamme jusqu'à " + p.standingMin + " (" + Math.round(standing()) + ")");
  if (standing() > p.standingMax)
    m.push("redescendre en gamme sous " + p.standingMax + " (" + Math.round(standing()) + ") — " +
           "ils cherchent du volume, pas du luxe");
  return m.length ? "il faut " + m.join(", et ") : "ouvert";
}

function paliersOuverts(){ return PALIERS.filter(palierOuvert); }

/** Ce que ce palier consent à payer, d'après ce à quoi il tient. */
function primePalier(p){
  const w = p.poids;
  const prime = (notoriete()/100 - 0.4) * w.notoriete +
                (confianceEffective()/100 - 0.5) * w.confiance +
                (standing()/100 - 0.45) * w.standing;
  return clamp(1 + prime * 0.5, 0.72, 1.55) * primeLabels();
}

function creerContrat(produitId){
  // Le client vient d'un palier ouvert : c'est la marque qui décide de qui frappe
  // à la porte, pas le hasard seul.
  const ouverts = paliersOuverts().map(p => p.id);
  let dispo = CLIENTS.filter(c => c.ageMin <= etat.meta.age && ouverts.includes(c.palier || "local"));
  if (!dispo.length) dispo = CLIENTS.filter(c => (c.palier || "local") === "local");
  const cl = choix(dispo);
  const pal = palierParId(cl.palier || "local");
  const cap = capaciteHebdoEstimee(produitId);
  const semaines = cl.gros ? hasardInt(2,4) : hasardInt(1,3);
  const facteur = (cl.gros ? hasard(1.1, 1.6) : hasard(0.5, 1.35)) * pal.volume;
  // On arrondit à quelque chose qu'un client dirait vraiment : 250 kg, 4 000 sachets.
  const brut = Math.max(5, cap * semaines * facteur);
  const pas = ITEMS[produitId].unite === "kg" ? (brut > 800 ? 100 : 25) : (brut > 4000 ? 500 : 100);
  const quantite = Math.max(pas, Math.round(brut / pas) * pas);
  const base = ITEMS[produitId].vente;
  // Une maison connue vend ses propres recettes plus cher.
  const renom = ITEMS[produitId].maison ? (0.88 + etat.recherche.notoriete/100 * 0.34) : 1;
  const prixUnitaire = Math.round(base * cl.marge * mode().prixClient * renom * primePalier(pal) *
                                  (0.9 + etat.reputation/100*0.18) * hasard(0.97,1.06)) || 1;
  return {
    id: nouvelId(),
    client: cl.nom, ton: cl.ton, palier: cl.palier || "local",
    produitId, quantite, livre:0,
    prixUnitaire,
    dateLimite: jourCourant() + semaines*CONFIG.joursParSemaine,
    penaliteRetard: Math.max(30, Math.round(prixUnitaire*quantite*0.012)),
    reputationRequise: cl.gros ? 55 : 0,
    joursRetard: 0,
    reclamations: 0,
    gros: !!cl.gros,
    paiement: cl.paiement || 0,        // jours avant règlement
    accepteLe: null
  };
}

/** L'avis du contremaître, en français d'atelier (§8.2). */
function avisContremaitre(c){
  const cap = capaciteHebdoEstimee(c.produitId);
  const jours = Math.max(1, c.dateLimite - jourCourant());
  const semaines = jours / CONFIG.joursParSemaine;
  const besoin = c.quantite / semaines;
  const ratio = besoin / Math.max(1,cap);
  const n = nomItem(c.produitId, 2, true, true);
  const b = mesure(c.produitId, Math.ceil(besoin)), capT = mesure(c.produitId, cap);
  if (ratio < 0.55) return "On tient largement : " + b + " de " + n + " par semaine, et on en sort " + capT + ".";
  if (ratio < 0.9)  return "Ça passe, sans traîner. Il faut " + b + " par semaine, on en sort " + capT + ".";
  if (ratio < 1.25) return "Ça va être juste : " + b + " par semaine et on plafonne à " + capT + ". Aucune panne, sinon c'est mort.";
  return "On n'y arrivera jamais. " + b + " par semaine, on en fait " + capT + " au mieux. À moins d'embaucher.";
}

function accepterContrat(c){
  c.accepteLe = jourCourant();
  etat.contrats.acceptes.push(c);
  etat.contrats.proposes = etat.contrats.proposes.filter(x => x.id !== c.id);
  notif("Commande signée", c.client + " : " + quantiteItem(c.produitId, c.quantite, true) + " à " + euros(c.prixUnitaire) + " pièce.", "ok");
  son("signature");
}
function refuserContrat(c){
  etat.contrats.proposes = etat.contrats.proposes.filter(x => x.id !== c.id);
}
function annulerContrat(c){
  etat.contrats.acceptes = etat.contrats.acceptes.filter(x => x.id !== c.id);
  c.annule = true;
  etat.contrats.termines.push(c);
  etat.reputation = clamp(etat.reputation - 8, 0, 100);
  notif("Commande annulée", c.client + " a repris sa commande. Ça se saura.", "ko");
}

function livrerContrats(){
  const acc = etat.contrats.acceptes.slice().sort((a,b) => a.dateLimite - b.dateLimite);
  for (const c of acc){
    const reste = c.quantite - c.livre;
    if (reste <= 0) continue;

    // Le raté ne se met pas de côté tout seul : il part mélangé au bon, au
    // prorata de ce qui traîne sur le quai. C'est tout l'intérêt de trier.
    const idRate = ITEMS[c.produitId].rate;
    const bon = stockDe(c.produitId);
    const mauvais = idRate ? stockDe(idRate) : 0;
    const dispo = bon + mauvais;
    if (dispo < 1) continue;

    const q = Math.min(Math.floor(dispo), reste);
    if (q < 1) continue;
    const qMauvais = mauvais > 0 ? Math.min(mauvais, q * (mauvais/dispo)) : 0;
    const qBon = q - qMauvais;

    if (qBon > 0) ajouterStock(c.produitId, -qBon);
    if (qMauvais > 0) ajouterStock(idRate, -qMauvais);
    c.livre += q;

    const montant = q * c.prixUnitaire;
    if (c.paiement){
      etat.finances.creances.push({ montant, jour: jourCourant() + c.paiement, client: c.client });
      notif("Expédition", quantiteItem(c.produitId, q, true) + " partis chez " + c.client +
            " · " + euros(montant) + " payés dans " + c.paiement + " jours.", "");
    } else {
      encaisser(montant, "vente");
      flottant(U().quaiSortie.x+1, U().quaiSortie.y+1, "+" + Math.round(montant) + " €", "#5cba6b");
      son("argent");
      notif("Expédition", quantiteItem(c.produitId, q, true) + " partis chez " + c.client + " : " + euros(montant) + ".", "ok");
    }
    compter(etat.progression.vendus, c.produitId, q);
    compter(etat.stats.semaineCourante.livres, c.produitId, q);
    const fc = etat.stats.clients[c.client] || (etat.stats.clients[c.client] = { ca:0, commandes:0, reclamations:0 });
    fc.ca += montant;

    if (qMauvais > 0.5) reclamation(c, qMauvais);

    if (c.livre >= c.quantite){
      const aLheure = jourCourant() <= c.dateLimite;
      etat.reputation = clamp(etat.reputation + (aLheure ? 4 : 1), 0, 100);
      etat.contrats.acceptes = etat.contrats.acceptes.filter(x => x.id !== c.id);
      etat.contrats.termines.push(c);
      notif("Commande honorée", c.client + " est livré" + (aLheure ? ", dans les temps." : ", avec du retard."), aLheure ? "ok" : "att");
      son("valide");
      fait(aLheure ? ("Commande " + c.client + " livrée dans les temps") : ("Commande " + c.client + " livrée en retard"));
      // L'objectif de l'âge 3 : une grosse commande, sans une seule réclamation.
      const fic = etat.stats.clients[c.client];
      if (fic){ fic.commandes++; if (c.reclamations > 0) fic.reclamations++; }
      if (c.gros && aLheure && !(c.reclamations > 0))
        compter(etat.progression.compteurs, "grosseCommande", 1);
    }
  }
}

/** Le client a trouvé de la marchandise ratée dans ses cartons. */
function reclamation(c, qMauvais){
  c.reclamations = (c.reclamations||0) + qMauvais;
  const geste = qMauvais * c.prixUnitaire * 2;
  depenser(geste, "reclamation");
  etat.reputation = clamp(etat.reputation - clamp(1 + qMauvais/Math.max(1,c.quantite)*40, 1, 7), 0, 100);
  etat.stats.semaineCourante.reclamations++;
  notif("Réclamation", c.client + " a trouvé " + quantiteItem(ITEMS[c.produitId].rate, qMauvais, true) +
        " dans la livraison. " + euros(geste) + " de geste commercial.", "ko");
  paroleContexte("reclamation", { client:c.client });
  fait("Réclamation de " + c.client);
}

/** Ce qu'il faut encore livrer sur les commandes signées : on ne brade jamais
 *  un produit déjà promis à un client. */
function reserveContrats(produitId){
  let r = 0;
  for (const c of etat.contrats.acceptes)
    if (c.produitId === produitId) r += Math.max(0, c.quantite - c.livre);
  return r;
}

/** Les commerces du coin passent tous les soirs prendre ce qui dépasse.
 *  Moins payé qu'une commande : c'est tout l'intérêt d'en signer.
 *  Ils ne prennent que du bon : la marchandise ratée reste sur les bras. */
function vendreSurplus(){
  if (!etat.venteAuto) return;
  let total = 0, detail = [];
  for (const id in ITEMS){
    if (!ITEMS[id].vente) continue;
    const surplus = Math.floor(stockDe(id) - reserveContrats(id));
    if (surplus < 1) continue;
    // Les commerces donnent le rayon à qui vend : notre part y pèse directement.
    const prix = ITEMS[id].vente * 0.88 * surplus * (0.72 + partMarche() * 0.56);
    ajouterStock(id, -surplus);
    encaisser(prix, "vente");
    compter(etat.progression.vendus, id, surplus);
    compter(etat.stats.semaineCourante.livres, id, surplus);
    total += prix;
    detail.push(quantiteItem(id, surplus, true));
  }
  if (total > 0){
    flottant(U().quaiSortie.x+1, U().quaiSortie.y+1, "+" + Math.round(total) + " €", "#5cba6b");
    son("argent");
    notif("Commerces du coin", detail.join(", ") + " partis pour " + euros(total) + ".", "ok");
  }
}

/* ------------------------------------------------------- Fin de semaine */
function fait(t){ etat.stats.semaineCourante.faits.push(t); }

function finSemaine(){
  const s = etat.stats.semaineCourante;
  s.semaine = semaineCourante();
  s.resultat = s.ca - s.depenses;
  s.solde = etat.finances.solde;
  etat.stats.historiqueSemaines.push(s);
  if (etat.stats.historiqueSemaines.length > 60) etat.stats.historiqueSemaines.shift();

  etat.stats.semaineCourante = semaineVierge();
  etat.progression.produitsSemaine = {};
  majLabels();
  majStanding(s);
  majRival();

  // Nouvelles propositions de commande
  const produits = Object.keys(ITEMS).filter(id => ITEMS[id].vente && (ITEMS[id].ageMin||1) <= etat.meta.age);
  etat.contrats.proposes = [];
  // Moins on pèse, moins on nous propose : le concurrent prend les places.
  const base = etat.meta.age >= 2 ? 3 : 2;
  const n = Math.max(1, Math.round(base * (0.55 + partMarche() * 0.9)));
  for (let i=0;i<n;i++) etat.contrats.proposes.push(creerContrat(choix(produits)));

  etat.meta.vitesse = 0;
  sauvegardeAuto();
  ouvrirVendredi(s);
}

/* -------------------------------------------------------- Le concurrent
   Sa force face à la vôtre, sur chaque marché ouvert. La part se lit comme un
   partage du rayon : à deux marques égales, chacune la moitié. */
function forceMarque(not, conf, sta, p){
  const w = p.poids;
  return Math.max(0.05,
    0.5 + (not/100 - 0.4) * Math.abs(w.notoriete)
        + (conf/100 - 0.5) * Math.abs(w.confiance)
        + (sta/100 - 0.45) * w.standing);
}

/** Notre part de rayon, tous marchés ouverts confondus. */
function partMarche(){
  const r = etat.rival;
  if (!r) return 1;
  const ouverts = paliersOuverts();
  if (!ouverts.length) return 0.5;
  let nous = 0, eux = 0;
  for (const p of ouverts){
    nous += forceMarque(notoriete(), confianceEffective(), standing(), p) * p.volume;
    eux  += forceMarque(r.notoriete, r.confiance, r.standing, p) * p.volume;
  }
  return clamp(nous / Math.max(0.001, nous + eux), 0.18, 0.86);
}

/** Le concurrent bouge tout seul, et se démarque de vous : c'est ce qui rend
 *  le choix de positionnement vivant. Si vous montez, il descend. */
function majRival(){
  const r = etat.rival;
  if (!r) return;
  r.notoriete = clamp(r.notoriete + hasard(0.2, 1.1), 0, 100);
  r.confiance = clamp(r.confiance + hasard(-0.8, 1.0), 25, 96);
  // Il se place à l'opposé : s'écarter de vous, c'est sa meilleure stratégie.
  const oppose = standing() > 55 ? 30 : standing() < 40 ? 74 : 50;
  r.standing = clamp(r.standing + (oppose - r.standing) * 0.14, 0, 100);

  r.semainesCoup = (r.semainesCoup || 0) + 1;
  if (r.semainesCoup >= 2 && Math.random() < 0.42){
    r.semainesCoup = 0;
    const c = choix(COUPS_RIVAL);
    r.dernierCoup = c.id;
    r.notoriete = clamp(r.notoriete + (c.notoriete||0), 0, 100);
    r.confiance = clamp(r.confiance + (c.confiance||0), 20, 96);
    r.standing  = clamp(r.standing  + (c.standing||0), 0, 100);
    r.avance = clamp((r.avance||0) + (c.part||0), -0.15, 0.2);
    fait(r.nom + " " + c.texte);
    notif("Chez le concurrent", r.nom + " " + c.texte + ".", (c.part||0) > 0 ? "att" : "");
  }
  r.avance = (r.avance || 0) * 0.85;      // un coup s'estompe
  r.part = clamp(1 - partMarche() + r.avance, 0.1, 0.9);
}

/* ---------------------------------------------------------- Les labels
   Un label ne s'achète pas : il se tient. La condition se mesure chaque
   semaine ; il faut la tenir plusieurs semaines de suite pour l'obtenir, et il
   se perd le jour où on ne la tient plus. Le joueur voit toujours la valeur du
   moment, pas un verdict opaque. */
function mesureLabel(id){
  const u = U();
  switch (id){
    case "atelier": {
      const propre = 1 - clamp(u.salete, 0, 1);
      const pire = u.machines.reduce((m,x) => Math.max(m, x.usure||0), 0);
      return { ok: propre >= 0.75 && pire <= 0.8,
               dit: "propreté " + Math.round(propre*100) + " %, machine la plus usée " +
                    Math.round(pire*100) + " %" };
    }
    case "gaspillage": {
      const r = rebutMoyenUsine();
      return { ok: r <= 0.06, dit: Math.round(r*1000)/10 + " % de rebut" };
    }
    case "huile": {
      const f = u.machines.filter(m => MACHINES[m.type].bainHuile);
      if (!f.length) return { ok:false, dit:"aucune friteuse dans l'atelier" };
      const pire = f.reduce((m,x) => Math.min(m, x.fraicheurHuile ?? 1), 1);
      return { ok: pire >= 0.5, dit: "la plus fatiguée est à " + Math.round(pire*100) + " %" };
    }
    case "local":
      return { ok: !!etat.labels.local,
               dit: etat.labels.local ? "approvisionnement local activé" : "approvisionnement au marché" };
  }
  return { ok:false, dit:"" };
}

/** Le label est-il seulement à portée ? On ne fait pas payer un audit pour rien. */
function labelEnCours(id){ return (etat.labels.suite || {})[id] || 0; }

function labelDisponible(l){ return (l.ageMin||1) <= etat.meta.age; }

/** Le suivi hebdomadaire. Il compte les semaines tenues et retire ce qui ne
 *  l'est plus — mais il n'achète jamais rien : un audit se demande. */
function majLabels(){
  if (!etat.labels) return;
  const L = etat.labels;
  L.suite = L.suite || {};
  for (const l of LABELS){
    if (!labelDisponible(l)){ L.suite[l.id] = 0; continue; }
    const m = mesureLabel(l.id);
    if (m.ok){
      L.suite[l.id] = (L.suite[l.id] || 0) + 1;
      if (!labelObtenu(l.id) && L.suite[l.id] === l.semaines)
        notif("Label à portée", "« " + l.nom + " » est tenu depuis " + l.semaines +
              " semaines. L'auditeur peut passer — onglet Marque.", "ok");
    } else {
      L.suite[l.id] = 0;
      if (labelObtenu(l.id)){
        L.obtenus = L.obtenus.filter(x => x !== l.id);
        notif("Label perdu", "« " + l.nom + " » ne tient plus : " + m.dit + ".", "ko");
        fait("Label « " + l.nom + " » perdu");
        son("refus");
      }
    }
  }
  const cout = labelsObtenus().reduce((s,l) => s + l.hebdo, 0);
  if (cout > 0) depenser(cout, "labels");
}

/** Le joueur fait venir l'auditeur. C'est une dépense, donc c'est un choix. */
function demanderAudit(id){
  const l = LABELS.find(x => x.id === id);
  if (!l || labelObtenu(id)) return false;
  if (labelEnCours(id) < l.semaines){
    notif("Pas encore", "Il faut tenir « " + l.nom + " » " + l.semaines + " semaines de suite.", "att");
    return false;
  }
  if (!mesureLabel(id).ok){
    notif("Pas aujourd'hui", "La condition n'est plus tenue en ce moment.", "ko"); return false;
  }
  if (!mode().argentInfini && etat.finances.solde - l.audit < CONFIG.faillite){
    notif("Trop cher", "L'audit coûte " + euros(l.audit) + ".", "ko"); return false;
  }
  depenser(mode().argentInfini ? 0 : l.audit, "investissement");
  etat.labels.obtenus.push(id);
  notif("Label obtenu", "« " + l.nom + " » est décroché. Il coûtera " + euros(l.hebdo) +
        " par semaine à entretenir, et se perdra le jour où vous ne le tiendrez plus.", "ok");
  fait("Label « " + l.nom + " » obtenu");
  son("age");
  majPanneau(); majBandeau();
  return true;
}

/** Le standing suit ce que la marque montre et ce qu'elle vend, avec du retard :
 *  une réputation de gamme met des semaines à bouger, dans les deux sens. */
function majStanding(semaine){
  const m = etat.marque;
  if (!m) return;
  // Ce qu'on a vendu cette semaine, rapporté au prix de référence des mêmes
  // marchandises : au-dessus de 1 on est cher, en dessous on brade.
  let reference = 0;
  for (const id in (semaine.livres || {}))
    if (ITEMS[id]) reference += semaine.livres[id] * (ITEMS[id].vente || 0);
  if (reference > 0){
    const reel = semaine.ca / reference;
    m.primePrix = m.primePrix * 0.7 + clamp(reel, 0.5, 2) * 0.3;
  }
  const avant = m.standing;
  m.standing = clamp(m.standing + (cibleStanding() - m.standing) * 0.28, 0, 100);
  const d = m.standing - avant;
  if (Math.abs(d) >= 3)
    fait(d > 0 ? "La marque est montée en gamme" : "La marque est descendue en gamme");
  // Un palier qui s'ouvre est une nouvelle qui mérite d'être dite.
  const ouverts = paliersOuverts().map(p => p.id);
  m.paliersConnus = m.paliersConnus || [];
  const neufs = ouverts.filter(id => !m.paliersConnus.includes(id));
  m.paliersConnus = ouverts;
  for (const id of neufs){
    const p = palierParId(id);
    notif("Un marché s'ouvre", "« " + p.nom + " » vous accepte désormais. " + p.resume, "ok");
    fait("Le marché « " + p.nom + " » s'ouvre");
  }
}

/* ------------------------------------------------------- Progression */
function progressionObjectif(){
  const age = AGES[etat.meta.age-1];
  const o = age.objectif;
  let val = 0, cible = o.cible;
  if (o.type === "compteur") val = (etat.progression.compteurs||{})[o.cle] || 0;
  else if (o.type === "vendus") val = etat.progression.vendus[o.produit] || 0;
  else if (o.type === "produitsSemaine") val = etat.progression.produitsSemaine[o.produit] || 0;
  else if (o.type === "argent") val = etat.finances.solde;
  else val = 0;
  let p = clamp(val/cible, 0, 1);
  if (o.secours && o.secours.type === "argent")
    p = Math.max(p, clamp(etat.finances.solde/o.secours.cible, 0, 1));
  return { valeur:val, cible, part:p, texte:age.objectif.texte };
}

function verifierObjectif(){
  if (etat.meta.age >= AGES.length) return;
  const p = progressionObjectif();
  etat.progression.jaugeObjectif = p.part;
  if (p.part >= 1 && !etat.progression.objectifsCompletes.includes(etat.meta.age))
    passerAgeSuivant();
}

function passerAgeSuivant(){
  etat.progression.objectifsCompletes.push(etat.meta.age);
  const ancien = AGES[etat.meta.age-1];
  if (etat.meta.age >= 3){
    // Les âges 3 à 5 sont décrits au document mais pas encore construits.
    notif("Bravo", "Vous avez bouclé « " + ancien.nom + " ». La suite (l'hygiène, la saison, les autres sites) reste à bâtir : la partie continue en mode libre.", "ok");
    paroleContexte("fin_contenu", {});
    etat.meta.age = Math.min(etat.meta.age, AGES.length);
    return;
  }
  etat.meta.age++;
  const nouv = AGES[etat.meta.age-1];
  agrandirUsine(Math.max(nouv.largeur, U().largeur), Math.max(nouv.hauteur, U().hauteur));
  U().nom = nouv.nom;
  etat.meta.vitesse = 0;
  son("age");
  notif("Nouvel âge : " + nouv.nom, nouv.intro, "ok");
  paroleContexte("age" + etat.meta.age, {});
  majBarreConstruction();
  majBandeau();
  ouvrirAnnonceAge(nouv);
}

/** Change la taille de l'atelier sans jamais rétrécir : on recopie la grille,
 *  on replace les quais, et on prévient si le quai de sortie a dû suivre le mur.
 *  Le quai d'entrée, lui, ne bouge jamais — ce qui y est raccordé doit le rester. */
function redimensionnerUsine(l, h, tailleQuai){
  const u = U();
  l = Math.max(l, u.largeur); h = Math.max(h, u.hauteur);
  if (l === u.largeur && h === u.hauteur && !tailleQuai) return false;

  // Le mur pousse vers la droite et vers le bas. Ce qui est dans la cour de ce
  // côté-là recule d'autant : un bâtiment ne se retrouve jamais avalé.
  const dl = l - u.largeur, dh = h - u.hauteur;
  const pousses = [];
  if (dl || dh) for (const m of u.machines){
    const dx = (dl && m.x >= u.largeur) ? dl : 0;
    const dy = (dh && m.y >= u.hauteur) ? dh : 0;
    if (dx || dy) pousses.push({ m, dx, dy });
  }
  for (const p of pousses) retirerDeGrille(u, p.m);

  const c = profondeurCour(u);
  const g = new Uint16Array((l + 2*c) * (h + 2*c));
  const Lg = l + 2*c;
  for (let y=-c; y<u.hauteur+c; y++)
    for (let x=-c; x<u.largeur+c; x++){
      const v = u.grille[indexCase(u,x,y)];
      if (v) g[(y+c)*Lg + (x+c)] = v;
    }
  u.grille = g; u.largeur = l; u.hauteur = h;
  for (const p of pousses){ p.m.x += p.dx; p.m.y += p.dy; poserSurGrille(u, p.m); }
  if (pousses.length)
    notif("La cour a reculé", pousses.length + (pousses.length > 1 ? " bâtiments ont suivi" : " bâtiment a suivi") +
          " le mur qui avance.", "");

  const taille = clamp(tailleQuai || u.quaiEntree.h, 4, Math.max(4, h-2));
  u.quaiEntree.x = 0;
  u.quaiEntree.h = taille;
  u.quaiEntree.y = clamp(u.quaiEntree.y, 0, h - taille);
  u.quaiSortie.h = taille;
  u.quaiSortie.y = clamp(u.quaiSortie.y, 0, h - taille);
  const ancienX = u.quaiSortie.x;
  u.quaiSortie.x = l - u.quaiSortie.l;
  libererPourQuai(u, u.quaiSortie);
  placerQuais(u);
  reindexer();
  if (ancienX !== u.quaiSortie.x)
    notif("Le quai de sortie a suivi le mur", "Vérifiez les convoyeurs qui y arrivaient.", "att");
  return true;
}

/** Agrandissement offert au passage d'un âge. */
function agrandirUsine(l, h){
  redimensionnerUsine(l, h, 4 + Math.floor((etat.meta.age-1)*1.5));
}

/** Le prix d'une tuile de surface : plus l'atelier est grand, plus pousser
 *  le mur coûte cher. */
function prixTuileAtelier(){
  const u = U();
  return CONFIG.prixTuileAtelier + Math.round(u.largeur*u.hauteur / 45);
}

/** Agrandissement acheté par le joueur : deux tuiles de large ou de haut. */
function agrandirAtelier(dl, dh){
  const u = U();
  const max = CONFIG.atelierMax;
  if (u.largeur + dl > max.l || u.hauteur + dh > max.h){
    notif("Impossible", "L'atelier a atteint sa taille maximale.", "ko"); return;
  }
  const tuiles = (u.largeur+dl)*(u.hauteur+dh) - u.largeur*u.hauteur;
  const prix = tuiles * prixTuileAtelier();
  if (!mode().constructionGratuite && !mode().argentInfini &&
      etat.finances.solde - prix < CONFIG.faillite){
    notif("Trop cher", "Pousser le mur coûterait " + euros(prix) + ".", "ko"); return;
  }
  redimensionnerUsine(u.largeur+dl, u.hauteur+dh);
  depenser(mode().constructionGratuite ? 0 : prix, "investissement");
  son("pose");
  for (let i=0;i<10;i++) particule(hasard(0,u.largeur), hasard(0,u.hauteur), "poussiere");
  notif("Atelier agrandi", u.largeur + " sur " + u.hauteur + " tuiles, pour " + euros(prix) + ".", "ok");
  majBandeau(); majPanneau();
}

/** Un quai qui se déplace ne doit rien écraser : ce qui gêne est démoli et
 *  remboursé, et le joueur est prévenu. En pratique le mur neuf est vierge. */
function libererPourQuai(u, q){
  const gene = new Set();
  for (let dy=0; dy<q.h; dy++)
    for (let dx=0; dx<q.l; dx++){
      const x = q.x+dx, y = q.y+dy;
      if (!dansPlan(u,x,y)) continue;
      const o = u.grille[indexCase(u,x,y)];
      if (o > 2) gene.add(o);
    }
  for (const id of gene){
    const n = noeudParId(id);
    if (n){ demolir(n); notif("Place au quai", "Il a fallu déplacer ce qui gênait.", "att"); }
  }
}

/** Agrandir un quai à la demande : deux tuiles de plus, contre espèces. */
function agrandirQuai(sortie){
  const u = U();
  const q = sortie ? u.quaiSortie : u.quaiEntree;
  if (q.h + 2 > u.hauteur){ notif("Impossible", "Le mur ne suit pas.", "ko"); return; }
  const cout = 900 + q.h * 150;
  if (!mode().constructionGratuite && !mode().argentInfini &&
      etat.finances.solde - cout < CONFIG.faillite){
    notif("Trop cher", "Il faut " + euros(cout) + ".", "ko"); return;
  }
  const avant = { x:q.x, y:q.y, h:q.h };
  q.h += 2; q.y = clamp(q.y - 1, 0, u.hauteur - q.h);
  libererPourQuai(u, q);
  placerQuais(u);
  depenser(mode().constructionGratuite ? 0 : cout, "investissement");
  reindexer();
  son("pose");
  notif("Quai agrandi", (sortie ? "Le quai de sortie" : "Le quai d'entrée") +
        " fait maintenant " + q.h + " tuiles de haut.", "ok");
}

function finDePartie(){
  etat.meta.vitesse = 0;
  ouvrirFin();
}

/* ------------------------------------------------------- Poser / démolir */
/** Une machine va dans l'atelier, un bâtiment va dans la cour : les deux ne se
 *  mélangent pas. C'est la seule règle de placement, et elle est visible à
 *  l'écran — le mur est la frontière. */
function peutPoser(u, type, x, y, rotation){
  const d = MACHINES[type];
  const tourne = rotation % 2 === 1;
  const l = tourne ? d.h : d.l, h = tourne ? d.l : d.h;
  if (d.batiment ? !rectDansCour(u,x,y,l,h) : !rectDansAtelier(u,x,y,l,h)) return false;
  for (let dy=0; dy<h; dy++)
    for (let dx=0; dx<l; dx++)
      if (u.grille[indexCase(u, x+dx, y+dy)] !== 0) return false;
  return true;
}

/** Pourquoi ça ne se pose pas ici : de quoi écrire un refus compréhensible. */
function refusPose(u, type, x, y, rotation){
  const d = MACHINES[type];
  const tourne = rotation % 2 === 1;
  const l = tourne ? d.h : d.l, h = tourne ? d.l : d.h;
  if (d.batiment && !rectDansCour(u,x,y,l,h))
    return dansAtelier(u,x,y) ? "Les bâtiments se posent dans la cour, autour de l'atelier."
                              : "Le terrain s'arrête ici.";
  if (!d.batiment && !rectDansAtelier(u,x,y,l,h))
    return dansCour(u,x,y) ? "Les machines se posent dans l'atelier, à l'abri."
                           : "Le terrain s'arrête ici.";
  return "La place est prise.";
}

function poserMachine(type, x, y, rotation){
  const u = U(), d = MACHINES[type];
  if (!peutPoser(u, type, x, y, rotation)) return false;
  if (!mode().constructionGratuite && !mode().argentInfini && etat.finances.solde - d.cout < CONFIG.faillite){
    notif("Trop cher", "Il n'y a pas " + euros(d.cout) + " en caisse.", "ko"); return false;
  }
  const m = creerMachine(type, x, y, rotation);
  u.machines.push(m);
  poserSurGrille(u, m);
  depenser(mode().constructionGratuite ? 0 : d.cout, "investissement");
  reindexer();
  son("pose");
  for (let i=0;i<8;i++) particule(x+m.l/2, y+m.h/2, "poussiere");
  flottant(x+m.l/2, y, "−" + d.cout + " €", "#e0574a");
  tutoEvenement("pose_" + type);
  return true;
}

function demolir(n, remboursementForce){
  const u = U();
  if (n.type === "convoyeur"){
    for (const t of n.chemin) if (u.grille[indexCase(u,t.x,t.y)] === n.id) u.grille[indexCase(u,t.x,t.y)] = 0;
    // ce qui passait au-dessus d'elle redescend : relierConvoyeurs s'en charge
    u.convoyeurs = u.convoyeurs.filter(c => c.id !== n.id);
    encaisser(Math.round(CONV.coutParTuile * n.chemin.length * CONFIG.remboursementCasse), "casse");
  } else {
    // ce qu'il y avait dedans retourne au stock
    for (const it in n.entree) ajouterStock(it, n.entree[it]);
    for (const it in n.sortie) ajouterStock(it, n.sortie[it]);
    if (n.operateurId != null){ const o = ouvrierParId(n.operateurId); if (o) libererTache(o); }
    for (const o of u.ouvriers) if (o.posteAssigne === n.id) o.posteAssigne = null;
    retirerDeGrille(u, n);
    u.machines = u.machines.filter(m => m.id !== n.id);
    encaisser(remboursementForce ?? Math.round(MACHINES[n.type].cout * CONFIG.remboursementCasse), "casse");
    // les convoyeurs qui pointaient dessus deviennent orphelins
    for (const c of u.convoyeurs)
      if (c.source === n.id || c.destination === n.id) c.etat = "non_relie";
  }
  if (vue.selection === n.id) vue.selection = null;
  reindexer();
  son("casse");
}

/* --------------------------------------------------------------- Équipe */
function creerCandidat(){
  const t = choix(TRAITS);
  const base = hasard(0.35, 0.85);
  const comp = {};
  for (const k of ["lavage","decoupe","friture","assaisonnement","emballage"])
    comp[k] = clamp(base + hasard(-0.2,0.2), 0.1, 1);
  const c = creerOuvrier(choix(PRENOMS), choix(NOMS), comp, Math.round(hasard(100,165)/5)*5, t.id);
  return c;
}

function embaucher(c){
  const u = U();
  c.id = nouvelId();
  const q = u.quaiEntree;
  c.x = q.x + q.l + 0.5; c.y = q.y + 1.5;
  c.moral = 0.75;
  u.ouvriers.push(c);
  notif("Embauche", c.prenom + " " + c.nom + " commence lundi. " + euros(c.salaire) + " par jour.", "ok");
  son("valide");
  majBandeau();
}

function licencier(o){
  const u = U();
  libererTache(o);
  u.ouvriers = u.ouvriers.filter(x => x.id !== o.id);
  const indem = o.salaire * 5;
  depenser(indem, "indemnite");
  for (const p of u.ouvriers) p.moral = clamp(p.moral - 0.12, 0, 1);
  notif("Départ", o.prenom + " " + o.nom + " quitte l'atelier. " + euros(indem) + " d'indemnité.", "att");
}

function emprunter(b){
  const total = b.montant * (1 + b.taux);
  etat.finances.emprunts.push({
    banque:b.nom, montant:b.montant, restant:total,
    mensualite: total / b.jours, taux:b.taux, debut:jourCourant()
  });
  encaisser(b.montant, "emprunt");
  notif("Emprunt accordé", b.nom + " vous prête " + euros(b.montant) + ". Remboursement " + euros(total/b.jours) + " par jour.", "ok");
  son("argent");
}

/* ============================================================================
   SIMULATION — la recherche (âge 4)
   ----------------------------------------------------------------------------
   Le joueur compose une recette en mélangeant des propositions. L'étude coûte
   de l'argent et du temps. À la sortie, le public tranche : une note, des avis,
   et un prix de vente qui en découle. Ce qui plaît se vend cher et fait
   connaître la maison ; ce qui rate se brade.
   ========================================================================== */

function optionRecette(axeCle, id){
  const a = AXES_RECETTE.find(x => x.cle === axeCle);
  return a ? a.options.find(o => o.id === id) : null;
}
function optionsDe(traits){
  return AXES_RECETTE.map(a => optionRecette(a.cle, traits[a.cle])).filter(Boolean);
}
function tagsDe(traits){
  const t = new Set();
  for (const o of optionsDe(traits)) for (const g of (o.tags||[])) t.add(g);
  return t;
}
/** Les accords dont les deux ingrédients sont présents dans la recette. */
function accordsDe(traits){
  const v = Object.values(traits);
  return ACCORDS.filter(a => v.includes(a.a) && v.includes(a.b));
}

/* ------------------------------------------------- Ce qui est débloqué
   Presque tout le garde-manger est fermé au départ. Un ingrédient s'ouvre
   parce que la maison s'est fait un nom, parce qu'elle a osé quelque chose, ou
   parce qu'elle a déjà réussi. Une condition, une phrase : le joueur doit
   toujours savoir quoi faire pour l'obtenir. */
const MOT_TAG = {
  piquant:["qui pique","qui piquent"],        sain:["légère","légères"],
  terroir:["de terroir","de terroir"],        chic:["chic","chic"],
  nomade:["à emporter","à emporter"],         classique:["classique","classiques"],
  doux:["douce","douces"],                    monde:["venue d'ailleurs","venues d'ailleurs"],
  farfelu:["farfelue","farfelues"],           gras:["bien grasse","bien grasses"],
  sucre:["sucrée","sucrées"],                 enfance:["pour les enfants","pour les enfants"],
  marin:["iodée","iodées"],                   fume:["fumée","fumées"],
  acide:["acidulée","acidulées"],             fete:["de fête","de fête"],
  insecte:["aux insectes","aux insectes"],    fermente:["fermentée","fermentées"],
  hiver:["d'hiver","d'hiver"],                amer:["amère","amères"],
  leger:["légère","légères"],                 rustique:["rustique","rustiques"]
};

function recettesSorties(){ return (etat.recherche && etat.recherche.recettes) || []; }
function recettesAvecTag(tag){
  return recettesSorties().filter(r => tagsDe(r.traits).has(tag)).length;
}

function optionDisponible(o){
  if (mode().toutDebloque || (etat.recherche && etat.recherche.tout)) return true;
  const d = o.debloc;
  if (!d) return true;
  if (d.age != null)       return etat.meta.age >= d.age;
  if (d.notoriete != null) return etat.recherche.notoriete >= d.notoriete;
  if (d.recettes != null)  return recettesSorties().length >= d.recettes;
  if (d.note != null)      return recettesSorties().some(r => r.note >= d.note);
  if (d.apres != null)     return recettesSorties().some(r => Object.values(r.traits).includes(d.apres));
  if (d.tag != null)       return recettesAvecTag(d.tag) >= (d.n || 1);
  return true;
}

/** Ce qu'il faut faire pour l'obtenir, en une phrase et avec l'état actuel. */
function motDeblocage(o){
  const d = o.debloc;
  if (!d) return "";
  if (d.age != null) return "à l'âge " + d.age;
  if (d.notoriete != null)
    return "quand la maison sera connue à " + d.notoriete + " sur 100 (" +
           Math.round(etat.recherche.notoriete) + " aujourd'hui)";
  if (d.recettes != null){
    const f = recettesSorties().length;
    return "après " + d.recettes + " " + pluriel(d.recettes,"recette") + " sortie" +
           (d.recettes > 1 ? "s" : "") + " (" + f + " pour l'instant)";
  }
  if (d.note != null) return "quand une recette aura atteint " + d.note + " sur 100";
  if (d.apres != null){
    const a = optionRecette("gout", d.apres) || toutesOptions().find(x => x.id === d.apres);
    return "après avoir essayé « " + (a ? a.nom : d.apres) + " »";
  }
  if (d.tag != null){
    const n = d.n || 1, f = recettesAvecTag(d.tag);
    const m = MOT_TAG[d.tag] || [d.tag, d.tag];
    return "après " + n + " " + pluriel(n,"recette") + " " + (n > 1 ? m[1] : m[0]) +
           " (" + f + " pour l'instant)";
  }
  return "";
}

function toutesOptions(){
  const out = [];
  for (const a of AXES_RECETTE) for (const o of a.options) out.push(o);
  return out;
}
function optionsOuvertes(axe){ return axe.options.filter(optionDisponible); }
function compteDebloque(){
  const t = toutesOptions();
  return { ouverts: t.filter(optionDisponible).length, total: t.length };
}

/** Compare le garde-manger d'avant et celui de maintenant, et annonce ce qui
 *  vient de s'ouvrir. Appelé après chaque recette et chaque fin de semaine. */
function verifierDeblocages(annoncer){
  const R = etat.recherche;
  if (!R) return [];
  const dispo = toutesOptions().filter(optionDisponible);
  const connus = R.connus || [];
  const neufs = dispo.filter(o => !connus.includes(o.id));
  R.connus = dispo.map(o => o.id);
  if (annoncer && neufs.length){
    const noms = neufs.slice(0,3).map(o => o.nom).join(", ") +
                 (neufs.length > 3 ? " et " + (neufs.length-3) + " autres" : "");
    notif("Le garde-manger s'agrandit",
          neufs.length + " " + pluriel(neufs.length,"nouvel ingrédient","nouveaux ingrédients") +
          " au labo : " + noms + ".", "ok");
    son("valide");
  }
  return neufs;
}

function tendanceCourante(){
  return TENDANCES[(etat.recherche.tendance || 0) % TENDANCES.length];
}

/** La note du public, de 0 à 100. Le détail sert à expliquer, jamais à afficher
 *  un coefficient : le joueur lit des phrases, pas des nombres (§3.1). */
function noteRecette(traits, alea){
  const opts = optionsDe(traits);
  if (opts.length < AXES_RECETTE.length) return null;
  const base = opts.reduce((s,o) => s + o.attrait, 0) / opts.length;
  const accords = accordsDe(traits).reduce((s,a) => s + a.delta, 0);
  const mode = tagsDe(traits).has(tendanceCourante().tag) ? 0.12 : 0;
  // Une usine qui gâche se retrouve dans le sachet.
  const rebut = rebutMoyenUsine();
  const soin = (1 - rebut) * 0.08;
  const brut = base + accords + mode + soin + (alea || 0);
  return { note: Math.round(clamp(brut, 0, 1) * 100), base, accords, mode, soin };
}

function rebutMoyenUsine(){
  const m = U().machines.filter(x => MACHINES[x.type].qualite);
  if (!m.length) return 0.08;
  return m.reduce((s,x) => s + (x.tauxRebut||0), 0) / m.length;
}

/** La couleur du sachet suit le goût : elle est déclarée avec l'ingrédient. */
function couleurGout(id){
  const o = optionRecette("gout", id);
  return (o && o.couleur) || "#c9502e";
}

function grammageDe(traits){ return optionRecette("format", traits.format).grammage; }

/** Le prix se déduit de la note : une chips qui plaît se vend, l'autre se brade. */
function prixUniteRecette(note, traits){
  const g = grammageDe(traits);
  const prixKg = 10.4 * (0.55 + note/100 * 0.85);
  return Math.round(prixKg * g/1000 * 100) / 100;
}
function coutEtude(traits){
  return 3000 + optionsDe(traits).reduce((s,o) => s + (o.etude||0), 0);
}
function joursEtude(traits){
  return Math.min(15, Math.round(4 + optionsDe(traits).reduce((s,o) => s + (o.etude||0), 0) / 1100));
}

/* -------------------------------------------------- Vie d'une étude */
/** Combien de bureaux d'études tournent : chacun fait avancer une étude. */
function bureauxDisponibles(){
  return U().machines.filter(m => m.type === "bureau").length;
}

function lancerEtude(nom, traits){
  if (etat.recherche.enCours){ notif("Une étude est déjà en route", "Une seule à la fois.", "ko"); return false; }
  if (bureauxDisponibles() < 1){
    notif("Pas de bureau", "Une recette se met au point dans un bureau d'études. Il faut en bâtir un.", "ko");
    parle("On ne va pas inventer une recette au milieu des friteuses, patron. Il nous faut un bureau.", 10000);
    return false;
  }
  const ferme = optionsDe(traits).find(o => !optionDisponible(o));
  if (ferme){
    notif("Pas encore au garde-manger", "« " + ferme.nom + " » s'ouvre " + motDeblocage(ferme) + ".", "ko");
    return false;
  }
  const cout = coutEtude(traits);
  if (!mode().argentInfini && etat.finances.solde - cout < CONFIG.faillite){
    notif("Étude trop chère", "Il faut " + euros(cout) + " pour la lancer.", "ko"); return false;
  }
  depenser(cout, "recherche");
  etat.recherche.enCours = {
    nom: nom || "Recette maison",
    traits: Object.assign({}, traits),
    cout, jours: joursEtude(traits), restant: joursEtude(traits)
  };
  notif("Étude lancée", "« " + etat.recherche.enCours.nom + " » — " + etat.recherche.enCours.jours +
        " jours de mise au point, " + euros(cout) + ".", "ok");
  parle("On s'y met, patron. Dans " + etat.recherche.enCours.jours + " jours on saura ce que ça donne.", 9000);
  son("signature");
  return true;
}

/** Appelée une fois par jour. */
function avancerRecherche(){
  const e = etat.recherche.enCours;
  if (!e) return;
  // Chaque bureau fait avancer l'étude d'une journée par jour.
  e.restant -= Math.max(1, bureauxDisponibles());
  if (e.restant <= 0) finaliserRecette();
}

function finaliserRecette(){
  const e = etat.recherche.enCours;
  etat.recherche.enCours = null;
  const n = noteRecette(e.traits, hasard(-0.03, 0.03));
  const id = "maison_" + (etat.recherche.prochain++);
  const r = {
    id, nom: e.nom, traits: e.traits, note: n.note,
    prixUnite: prixUniteRecette(n.note, e.traits),
    semaine: semaineCourante(), lancee: true,
    tendance: tendanceCourante().tag,
    accords: accordsDe(e.traits).map(a => ({ delta:a.delta, dit:a.dit }))
  };
  r.avis = genererAvis(r);
  r.pistes = pistesAmelioration(r);
  etat.recherche.recettes.push(r);
  etat.recherche.notoriete = clamp(etat.recherche.notoriete + (n.note - 50)/6, 0, 100);

  injecterRecettesJoueur();
  reindexer();

  if (n.note >= 75) compter(etat.progression.compteurs, "recetteReussie", 1);
  verifierDeblocages(true);

  parle(paroleNote(r), 14000);
  majBarreConstruction(); majPanneau(); majBandeau();
  ouvrirSortieRecette(r);        // on arrête tout : c'est le moment du verdict
}

function motNote(n){
  if (n >= 82) return "Le public en redemande";
  if (n >= 65) return "Ça plaît";
  if (n >= 48) return "Accueil tiède";
  if (n >= 32) return "Ça ne prend pas";
  return "Personne n'en veut";
}
function paroleNote(r){
  if (r.note >= 82) return "Patron, « " + r.nom + " » cartonne. Les gens reviennent en chercher.";
  if (r.note >= 65) return "« " + r.nom + " » se vend bien. On peut faire mieux, mais c'est du solide.";
  if (r.note >= 48) return "« " + r.nom + " », ça se mange, mais personne n'en parle. Regardez les avis.";
  return "« " + r.nom + " », c'est raté. Lisez ce que disent les gens, tout y est.";
}

/** Des avis qui apprennent quelque chose : chacun pointe une décision. */
function genererAvis(r){
  const out = [];
  for (const a of AVIS){
    let d = false;
    try { d = a.si(r); } catch(e){ d = false; }
    if (d) out.push({ qui: choix(PRENOMS_CLIENTS), dit: choix(a.dit) });
  }
  // Les accords parlent d'eux-mêmes, en bien comme en mal.
  for (const a of r.accords) out.push({ qui: choix(PRENOMS_CLIENTS), dit: a.dit });
  // On mélange, on en garde cinq.
  for (let i=out.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [out[i],out[j]] = [out[j],out[i]]; }
  return out.slice(0,5);
}

/** Ce qu'on pourrait changer la prochaine fois. */
function pistesAmelioration(r){
  const p = [];
  // 1. L'accord qui a le plus coûté
  const pires = r.accords.filter(a => a.delta < 0).sort((a,b) => a.delta - b.delta);
  if (pires.length) p.push(pires[0].dit);
  // 2. L'axe le plus faible — mais on ne propose jamais de retirer un ingrédient
  // qui porte un bon accord : c'est justement lui qui fait la recette.
  const porteurs = new Set();
  for (const a of (r.accords||[])) if (a.delta > 0){ porteurs.add(a.a); porteurs.add(a.b); }
  const opts = AXES_RECETTE.map(a => ({ axe:a, o: optionRecette(a.cle, r.traits[a.cle]) }))
                           .filter(x => x.o && !porteurs.has(x.o.id))
                           .sort((a,b) => a.o.attrait - b.o.attrait);
  if (opts.length && opts[0].o.attrait < 0.66){
    const mieux = opts[0].axe.options.filter(o =>
        o.attrait > opts[0].o.attrait + 0.05 && optionDisponible(o))
      .sort((a,b) => b.attrait - a.attrait)[0];
    if (mieux) p.push("Sur " + opts[0].axe.nom.toLowerCase() + ", « " + opts[0].o.nom +
                      " » ne convainc pas tout seul. « " + mieux.nom + " » plairait davantage — " +
                      "à moins de lui trouver le bon partenaire.");
  }
  // 3. La mode du moment
  if (r.tendance && !tagsDe(r.traits).has(r.tendance)){
    const t = TENDANCES.find(x => x.tag === r.tendance);
    if (t) p.push("Au lancement, " + t.texte.charAt(0).toLowerCase() + t.texte.slice(1) +
                  " Cette recette passait à côté.");
  }
  // 4. L'usine elle-même
  if (rebutMoyenUsine() > 0.15)
    p.push("Une partie du problème est dans l'atelier : trop de sachets ratés partent avec les bons.");
  if (r.note >= 82 && !(r.accords||[]).some(a => a.delta < 0))
    return ["Ne touchez à rien : les accords tiennent, le public suit. La suite se joue " +
            "sur ce qu'on n'a pas encore débloqué au labo."];
  if (!p.length) p.push("Rien à redire sur la composition. Pour aller plus haut, il faudra suivre la mode du moment.");
  return p;
}

/* ------------------------------------- Injection dans la chaîne réelle */

/** Les recettes du joueur deviennent de vraies matières et de vraies recettes
 *  d'ensachage. Elles ne vivent pas dans les tables constantes : on les
 *  réinjecte à la création de partie et à chaque chargement. */
function injecterRecettesJoueur(){
  nettoyerRecettesJoueur();
  if (!etat.recherche || !etat.recherche.recettes) return;
  for (const r of etat.recherche.recettes){
    if (!r.lancee) continue;
    const g = grammageDe(r.traits);
    const fmt = optionRecette("format", r.traits.format);
    const coutGout = optionRecette("gout", r.traits.gout).cout;
    const coutCuisson = optionRecette("cuisson", r.traits.cuisson).cout;
    const dureeCoupe = optionRecette("coupe", r.traits.coupe).duree || 1;
    const dureeCuisson = optionRecette("cuisson", r.traits.cuisson).duree || 1;
    const coul = couleurGout(r.traits.gout);

    ITEMS[r.id] = {
      nom: r.nom, nomP: r.nom, court: r.nom, courtP: r.nom,
      couleur: coul, forme:"sachet", unite:null,
      vente: r.prixUnite, portee:320, capacite:2400,
      cat:"produit", ageMin:4, rate: r.id + "_rate", maison:true
    };
    ITEMS[r.id + "_rate"] = {
      nom: r.nom + " (écarté)", nomP: r.nom + " (écartés)",
      court:"Écarté", courtP:"Écartés",
      couleur:"#7d7168", forme:"sachet", unite:null,
      portee:320, capacite:2400, cat:"rebut", bon:r.id, ageMin:4, maison:true
    };
    const rid = "ensacher_" + r.id;
    RECETTES[rid] = {
      id: rid, nom: "Ensacher — " + r.nom, machine:"ensacheuse", maison:true,
      entrees: [
        { id:"chips_assaisonnees", qte:10 },
        { id:"film",  qte: Math.round(0.4 * fmt.film * 100)/100 },
        { id:"arome", qte: Math.round(0.5 * coutGout * coutCuisson * 100)/100 }
      ],
      sortie: { id: r.id, qte: Math.round(10000/g) },
      duree: Math.round(10 * dureeCoupe * dureeCuisson * 10)/10,
      ageMin: 4
    };
    if (!MACHINES.ensacheuse.recettes.includes(rid)) MACHINES.ensacheuse.recettes.push(rid);
  }
}

function nettoyerRecettesJoueur(){
  for (const k in ITEMS) if (ITEMS[k].maison) delete ITEMS[k];
  for (const k in RECETTES) if (RECETTES[k].maison) delete RECETTES[k];
  MACHINES.ensacheuse.recettes = MACHINES.ensacheuse.recettes.filter(x => !RECETTES[x] || !RECETTES[x].maison);
  MACHINES.ensacheuse.recettes = MACHINES.ensacheuse.recettes.filter(x => x.indexOf("ensacher_maison_") !== 0);
}

/** La mode change toutes les six semaines environ. */
function majTendance(){
  const s = semaineCourante();
  if (etat.recherche.tendanceSemaine === undefined) etat.recherche.tendanceSemaine = s;
  if (s - etat.recherche.tendanceSemaine < 6) return;
  etat.recherche.tendanceSemaine = s;
  const avant = etat.recherche.tendance || 0;
  let n = avant;
  while (n === avant) n = hasardInt(0, TENDANCES.length-1);
  etat.recherche.tendance = n;
  if (etat.meta.age >= 4){
    notif("Le marché bouge", tendanceCourante().texte, "att");
    parle(tendanceCourante().texte + " Une recette qui colle à ça se vendra mieux.", 11000);
  }
}

/** Ce que la maison a vendu de chaque recette, semaine par semaine. */
function ventesRecette(r){
  return etat.stats.historiqueSemaines.map(s => (s.livres && s.livres[r.id]) || 0);
}

/* ============================================================================
   RENDU (1/3) — caméra, sol, pictogrammes
   Le rendu ne modifie jamais l'état de jeu (§11).
   ========================================================================== */

let cnv, ctx, largeurVue = 0, hauteurVue = 0, dpr = 1;
let texSol = null, texSalete = null;
// Images pré-calculées : le sol, le halo des lampes et la vignette sont
// recomposés une fois pour toutes, jamais à chaque image (§16).
let cacheSol = null, cacheSolCle = "", spriteHalo = null, gradVignette = null;

function initRendu(){
  cnv = document.getElementById("vue");
  ctx = cnv.getContext("2d", { alpha:false });
  texSol = fabriquerTextureSol();
  texSalete = fabriquerTextureSalete();
  spriteHalo = fabriquerHalo();
  redimensionner();
  window.addEventListener("resize", redimensionner);
}

function redimensionner(){
  const r = cnv.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  largeurVue = r.width; hauteurVue = r.height;
  cnv.width = Math.round(r.width*dpr);
  cnv.height = Math.round(r.height*dpr);
  cnv.style.width = r.width+"px";
  cnv.style.height = r.height+"px";
  // la vignette ne dépend que de la taille de la fenêtre
  gradVignette = ctx.createRadialGradient(
    largeurVue/2, hauteurVue/2, Math.min(largeurVue,hauteurVue)*0.34,
    largeurVue/2, hauteurVue/2, Math.max(largeurVue,hauteurVue)*0.78);
  gradVignette.addColorStop(0,"rgba(0,0,0,0)");
  gradVignette.addColorStop(1,"rgba(0,0,0,.42)");
  if (typeof cacheGradCorps !== "undefined") cacheGradCorps.clear();
}

/** Halo chaud d'une lampe d'atelier, dessiné une seule fois. */
function fabriquerHalo(){
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,"rgba(255,214,150,1)");
  grd.addColorStop(1,"rgba(255,214,150,0)");
  g.fillStyle = grd; g.fillRect(0,0,128,128);
  return c;
}

/** Le béton et la crasse : une seule composition, refaite quand l'atelier
 *  s'agrandit ou quand la saleté a visiblement changé. */
function majCacheSol(){
  const u = U();
  const cle = u.largeur + "x" + u.hauteur + ":" + Math.round(clamp(u.salete,0,1)*10);
  if (cacheSol && cle === cacheSolCle) return;
  cacheSolCle = cle;
  if (!cacheSol) cacheSol = document.createElement("canvas");
  cacheSol.width = u.largeur*CONFIG.tuile;
  cacheSol.height = u.hauteur*CONFIG.tuile;
  const g = cacheSol.getContext("2d");
  g.fillStyle = g.createPattern(texSol,"repeat");
  g.fillRect(0,0,cacheSol.width,cacheSol.height);
  if (u.salete > 0.03){
    g.globalAlpha = clamp(u.salete,0,1)*0.75;
    g.fillStyle = g.createPattern(texSalete,"repeat");
    g.fillRect(0,0,cacheSol.width,cacheSol.height);
    g.globalAlpha = 1;
  }
}

/** La cour : de l'herbe, des arbres, une haie le long de la clôture, et juste
 *  ce qu'il faut d'enrobé — la voie des camions et le parvis des quais. Rien
 *  n'y bouge : tout tient dans une image, refaite seulement quand la cour
 *  change. Le décor est tiré de bruit(), donc identique d'une fois sur l'autre. */
let cacheCour = null, cacheCourCle = "";
function majCacheCour(){
  const u = U(), c = profondeurCour(u), T = CONFIG.tuile;
  const L = u.largeur + 2*c, H = u.hauteur + 2*c;
  const bats = u.machines.filter(m => (MACHINES[m.type]||{}).batiment);
  const cle = L + "x" + H + ":" + u.quaiEntree.y + "," + u.quaiEntree.h + ":" + u.quaiSortie.y +
              ":" + bats.map(m => m.x + "," + m.y + "," + m.l + "," + m.h).join(";");
  if (cacheCour && cle === cacheCourCle) return;
  cacheCourCle = cle;
  if (!cacheCour) cacheCour = document.createElement("canvas");
  cacheCour.width = L*T; cacheCour.height = H*T;
  const g = cacheCour.getContext("2d");
  // repère : (0,0) du monde tombe en (c*T, c*T) dans l'image
  const px = v => (v + c)*T, py = v => (v + c)*T;

  /* --- la pelouse ------------------------------------------------------- */
  g.fillStyle = "#3c4a30";
  g.fillRect(0,0,cacheCour.width,cacheCour.height);
  for (let i=0;i<Math.round(L*H*1.1);i++){
    const a = bruit(i*2.1), b2 = bruit(i*3.7+11);
    const gx = a*cacheCour.width, gy = b2*cacheCour.height;
    g.fillStyle = bruit(i*5.3) < 0.5 ? "rgba(118,142,80,.22)" : "rgba(24,34,18,.22)";
    g.beginPath();
    g.ellipse(gx, gy, 4+bruit(i*7.9)*16, 3+bruit(i*11.3)*8, bruit(i*13.1)*3, 0, 7);
    g.fill();
  }
  // bandes de tonte, très légères
  g.fillStyle = "rgba(255,255,255,.016)";
  for (let y=0; y<H; y+=2) g.fillRect(0, y*T, cacheCour.width, T);

  /* --- l'enrobé : le parvis de chaque quai et sa voie jusqu'au portail --- */
  const voie = (qx, qy, qh, versOuest) => {
    const cy2 = qy + qh/2, prof = 2.0, larg = 2.4;
    const bx = versOuest ? -prof : u.largeur;
    g.fillStyle = "#41454c";
    g.fillRect(px(bx), py(qy-0.4), prof*T, (qh+0.8)*T);              // le parvis
    g.fillRect(versOuest ? px(-c) : px(u.largeur+prof), py(cy2-larg/2),
               (c-prof)*T, larg*T);                                   // la voie
    // le grain de l'enrobé, sinon la dalle a l'air d'un aplat oublié
    for (let i=0;i<Math.round((prof*qh + (c-prof)*larg)*10);i++){
      const nn = i + (versOuest ? 0 : 500);
      const sx = bruit(nn*1.7) < 0.62
        ? px(bx + bruit(nn*2.3)*prof)
        : (versOuest ? px(-c + bruit(nn*2.3)*(c-prof)) : px(u.largeur+prof + bruit(nn*2.3)*(c-prof)));
      const sy2 = bruit(nn*1.7) < 0.62
        ? py(qy-0.4 + bruit(nn*3.1)*(qh+0.8))
        : py(cy2-larg/2 + bruit(nn*3.1)*larg);
      g.fillStyle = bruit(nn*5.3) < 0.55 ? "rgba(0,0,0,.10)" : "rgba(255,255,255,.035)";
      g.beginPath();
      g.ellipse(sx, sy2, 2+bruit(nn*6.1)*9, 1.5+bruit(nn*7.7)*4, bruit(nn*8.3)*3, 0, 7);
      g.fill();
    }
    // bordure claire : on voit où finit l'enrobé
    g.strokeStyle = "rgba(210,214,220,.13)"; g.lineWidth = 2;
    g.strokeRect(px(bx)+1, py(qy-0.4)+1, prof*T-2, (qh+0.8)*T-2);
    g.strokeStyle = "rgba(226,182,44,.32)"; g.lineWidth = 2.5;
    g.setLineDash([13,11]);
    g.beginPath();
    g.moveTo(px(versOuest ? -c+0.3 : u.largeur+0.3), py(cy2));
    g.lineTo(px(versOuest ? -0.3 : u.largeur+c-0.3), py(cy2));
    g.stroke();
    g.setLineDash([]);
  };
  voie(0, u.quaiEntree.y, u.quaiEntree.h, true);
  voie(u.largeur, u.quaiSortie.y, u.quaiSortie.h, false);

  /* --- l'allée de gravier qui fait le tour des murs --------------------- */
  const al = 1.15;
  g.fillStyle = "#6d6a5e";
  g.fillRect(px(-al), py(-al), (u.largeur+2*al)*T, (u.hauteur+2*al)*T);
  g.clearRect(px(0), py(0), u.largeur*T, u.hauteur*T);
  g.fillStyle = "#3c4a30";
  g.fillRect(px(0), py(0), u.largeur*T, u.hauteur*T);   // sous la dalle, peu importe
  for (let i=0;i<Math.round((u.largeur+u.hauteur)*7);i++){
    const t2 = bruit(i*1.7), bord = Math.floor(bruit(i*2.9)*4);
    const gx = bord < 2 ? px(-al + t2*(u.largeur+2*al)) : (bord === 2 ? px(-al*bruit(i*3.3)) : px(u.largeur + al*bruit(i*3.3)));
    const gy = bord < 2 ? (bord ? py(u.hauteur + al*bruit(i*4.1)) : py(-al*bruit(i*4.1))) : py(-al + t2*(u.hauteur+2*al));
    g.fillStyle = bruit(i*5.9) < 0.5 ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.07)";
    g.beginPath(); g.ellipse(gx, gy, 2+bruit(i*6.7)*4, 1.5+bruit(i*7.3)*3, 0, 0, 7); g.fill();
  }

  /* --- ce qui est déjà occupé : on n'y plante rien ---------------------- */
  const pris = (x,y,r) => {
    if (x > -al-0.5 && x < u.largeur+al+0.5 && y > -al-0.5 && y < u.hauteur+al+0.5) return true;
    for (const b of bats)
      if (x > b.x-r-0.4 && x < b.x+b.l+r+0.4 && y > b.y-r-0.4 && y < b.y+b.h+r+0.4) return true;
    const dansVoie = (qy,qh,ouest) => y > qy-1.6 && y < qy+qh+1.6 && (ouest ? x < 0 : x > u.largeur);
    if (dansVoie(u.quaiEntree.y, u.quaiEntree.h, true)) return true;
    if (dansVoie(u.quaiSortie.y, u.quaiSortie.h, false)) return true;
    return false;
  };

  /* --- la haie, le long de la clôture ----------------------------------- */
  const haie = (x,y,i) => {
    for (let k=0;k<3;k++){
      const rr = (0.30 + bruit(i*3.1+k)*0.16)*T;
      g.fillStyle = k === 0 ? "rgba(0,0,0,.28)" : (k === 1 ? "#2f4326" : "#3d5730");
      g.beginPath();
      g.ellipse(px(x)+(k?0:2), py(y)+(k?0:3), rr, rr*0.82, 0, 0, 7); g.fill();
    }
  };
  let ih = 0;
  for (let x=-c+0.6; x<u.largeur+c-0.4; x+=0.62){
    if (!pris(x, -c+0.6, 0.4)) haie(x, -c+0.62 + bruit(ih*1.3)*0.12, ih); ih++;
    if (!pris(x, u.hauteur+c-0.7, 0.4)) haie(x, u.hauteur+c-0.72 - bruit(ih*1.7)*0.12, ih); ih++;
  }
  for (let y=-c+1.2; y<u.hauteur+c-1; y+=0.62){
    if (!pris(-c+0.6, y, 0.4)) haie(-c+0.62 + bruit(ih*1.9)*0.12, y, ih); ih++;
    if (!pris(u.largeur+c-0.7, y, 0.4)) haie(u.largeur+c-0.72 - bruit(ih*2.3)*0.12, y, ih); ih++;
  }

  /* --- les arbres, vus du dessus ---------------------------------------- */
  const arbre = (x,y,r,i) => {
    g.fillStyle = "rgba(0,0,0,.32)";
    g.beginPath(); g.ellipse(px(x)+r*T*0.28, py(y)+r*T*0.34, r*T, r*T*0.9, 0, 0, 7); g.fill();
    const tons = ["#33491f","#3e5726","#4a672d"];
    for (let k=0;k<3;k++){
      g.fillStyle = tons[k];
      const rr = r*T*(1 - k*0.19);
      g.beginPath();
      g.ellipse(px(x) - k*r*T*0.10, py(y) - k*r*T*0.13, rr, rr*0.94, 0, 0, 7); g.fill();
    }
    // quelques touffes pour casser le rond parfait
    g.fillStyle = "rgba(122,158,74,.55)";
    for (let k=0;k<5;k++){
      const a = bruit(i*9.1+k)*6.28, d2 = r*T*(0.30 + bruit(i*4.3+k)*0.42);
      g.beginPath();
      g.ellipse(px(x)+Math.cos(a)*d2 - r*T*0.14, py(y)+Math.sin(a)*d2 - r*T*0.18,
                r*T*0.20, r*T*0.16, 0, 0, 7); g.fill();
    }
  };
  let ia = 0;
  for (let y=-c+1.5; y<u.hauteur+c-1.4; y+=1.35)
    for (let x=-c+1.5; x<u.largeur+c-1.4; x+=1.35){
      ia++;
      const jx = x + (bruit(ia*1.9)-0.5)*0.9, jy = y + (bruit(ia*2.7)-0.5)*0.9;
      const d2 = bruit(ia*5.1);
      if (d2 > 0.34 || pris(jx, jy, 0.85)) continue;
      arbre(jx, jy, 0.55 + bruit(ia*6.3)*0.42, ia);
    }
  // des buissons dans les creux
  let ib = 0;
  for (let y=-c+0.9; y<u.hauteur+c-0.8; y+=0.9)
    for (let x=-c+0.9; x<u.largeur+c-0.8; x+=0.9){
      ib++;
      if (bruit(ib*8.7) > 0.16) continue;
      const jx = x + (bruit(ib*3.3)-0.5)*0.5, jy = y + (bruit(ib*4.9)-0.5)*0.5;
      if (pris(jx, jy, 0.35)) continue;
      g.fillStyle = "rgba(0,0,0,.24)";
      g.beginPath(); g.ellipse(px(jx)+2, py(jy)+3, 0.26*T, 0.20*T, 0, 0, 7); g.fill();
      g.fillStyle = bruit(ib*2.1) < 0.3 ? "#55703a" : "#3f5a2c";
      g.beginPath(); g.ellipse(px(jx), py(jy), 0.25*T, 0.19*T, 0, 0, 7); g.fill();
    }

  /* --- l'ombre des murs sur l'allée, et la clôture ---------------------- */
  const om = g.createLinearGradient(0, py(-1.3), 0, py(0));
  om.addColorStop(0,"rgba(0,0,0,0)"); om.addColorStop(1,"rgba(0,0,0,.34)");
  g.fillStyle = om; g.fillRect(px(-1.3), py(-1.3), (u.largeur+2.6)*T, 1.3*T);
  g.fillStyle = "rgba(0,0,0,.15)";
  g.fillRect(px(-1.3), py(-1.3), 1.3*T, (u.hauteur+2.6)*T);
  g.fillRect(px(u.largeur), py(-1.3), 1.3*T, (u.hauteur+2.6)*T);
  g.fillRect(px(-1.3), py(u.hauteur), (u.largeur+2.6)*T, 1.3*T);

  g.strokeStyle = "rgba(120,132,110,.5)"; g.lineWidth = 2.5;
  g.strokeRect(7, 7, cacheCour.width-14, cacheCour.height-14);
  g.fillStyle = "rgba(120,132,110,.5)";
  for (let x=0; x<L; x+=1.2){ g.fillRect(x*T+5, 3, 3, 9); g.fillRect(x*T+5, cacheCour.height-12, 3, 9); }
  for (let y=0; y<H; y+=1.2){ g.fillRect(3, y*T+5, 9, 3); g.fillRect(cacheCour.width-12, y*T+5, 9, 3); }
}

/** Béton : bruit fin pré-calculé une fois, jamais recalculé par frame. */
function fabriquerTextureSol(){
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#4a4d52"; g.fillRect(0,0,128,128);
  const img = g.getImageData(0,0,128,128), d = img.data;
  for (let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*17;
    d[i]=clamp(d[i]+n,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n,0,255);
  }
  g.putImageData(img,0,0);
  // quelques éclats plus sombres, comme du béton usé
  for (let i=0;i<40;i++){
    g.fillStyle = "rgba(0,0,0,"+(0.02+Math.random()*0.05)+")";
    g.beginPath(); g.ellipse(Math.random()*128, Math.random()*128, 2+Math.random()*9, 1+Math.random()*5, Math.random()*3, 0, 7); g.fill();
  }
  return c;
}

function fabriquerTextureSalete(){
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  for (let i=0;i<26;i++){
    const x = Math.random()*256, y = Math.random()*256, r = 6+Math.random()*26;
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,"rgba(20,16,10,0.5)");
    grd.addColorStop(1,"rgba(20,16,10,0)");
    g.fillStyle = grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  return c;
}

/* ------------------------------------------------------------- Caméra */
function T(){ return CONFIG.tuile * vue.zoom; }

function appliquerCamera(){
  const t = T();
  let sx = 0, sy = 0;
  if (vue.secousse > 0){
    sx = (Math.random()-0.5)*vue.secousse;
    sy = (Math.random()-0.5)*vue.secousse;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.translate(largeurVue/2 - vue.camX*t + sx, hauteurVue/2 - vue.camY*t + sy);
  ctx.scale(t,t);
}
function ecranSeul(){ ctx.setTransform(dpr,0,0,dpr,0,0); }

function ecranVersMonde(px, py){
  const t = T();
  return {
    x: (px - largeurVue/2) / t + vue.camX,
    y: (py - hauteurVue/2) / t + vue.camY
  };
}
function mondeVersEcran(x, y){
  const t = T();
  return { x: (x - vue.camX)*t + largeurVue/2, y: (y - vue.camY)*t + hauteurVue/2 };
}

function centrerCamera(){
  const u = U();
  vue.camX = u.largeur/2; vue.camY = u.hauteur/2;
  const t = CONFIG.tuile;
  // On cadre l'atelier plus deux tuiles de cour : on voit qu'il y a un dehors.
  vue.zoom = clamp(Math.min(largeurVue/((u.largeur+4)*t+60), hauteurVue/((u.hauteur+4)*t+60)), CONFIG.zoomMin, 1.4);
}

/* ------------------------------------------------- Pictogrammes de pièces
   Un dessin par forme, en coordonnées tuile, centré sur (0,0). `s` = taille. */
function dessinerItem(x, y, s, itemId, alpha){
  const it = ITEMS[itemId];
  if (!it) return;
  ctx.save();
  ctx.translate(x,y);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.fillStyle = it.couleur;
  ctx.strokeStyle = "rgba(0,0,0,.45)";
  ctx.lineWidth = Math.max(0.012, s*0.07);

  switch (it.forme){

    case "tubercule": {              // pomme de terre brute, avec ses yeux
      ctx.beginPath();
      ctx.ellipse(0, 0, s*0.44, s*0.32, 0.4, 0, 7);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(70,48,26,.55)";
      ctx.beginPath(); ctx.arc(-s*0.14, -s*0.06, s*0.05, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc( s*0.16,  s*0.08, s*0.04, 0, 7); ctx.fill();
      break;
    }

    case "tubercule_pele": {         // épluchée : plus claire, plus lisse
      ctx.beginPath();
      ctx.ellipse(0, 0, s*0.42, s*0.3, 0.4, 0, 7);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.beginPath(); ctx.ellipse(-s*0.1, -s*0.09, s*0.16, s*0.08, 0.4, 0, 7); ctx.fill();
      break;
    }

    case "rondelle": {               // rondelle crue vue de dessus
      ctx.beginPath(); ctx.arc(0, 0, s*0.36, 0, 7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(190,180,130,.7)";
      ctx.lineWidth = Math.max(0.008, s*0.04);
      ctx.beginPath(); ctx.arc(0, 0, s*0.2, 0, 7); ctx.stroke();
      break;
    }

    case "chips": {                  // chips : disque gondolé, doré
      ctx.beginPath();
      for (let i=0; i<=12; i++){
        const a = i/12*Math.PI*2;
