        const r = s*0.36 * (1 + 0.16*Math.sin(a*3));
        const px = Math.cos(a)*r, py = Math.sin(a)*r*0.86;
        if (i === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,240,190,.4)";
      ctx.beginPath(); ctx.ellipse(-s*0.08, -s*0.08, s*0.12, s*0.07, 0.5, 0, 7); ctx.fill();
      break;
    }

    case "sachet": {                 // sachet gonflé, avec sa soudure
      ctx.beginPath();
      ctx.moveTo(-s*0.26, -s*0.36);
      ctx.quadraticCurveTo(-s*0.4, 0, -s*0.26, s*0.36);
      ctx.lineTo(s*0.26, s*0.36);
      ctx.quadraticCurveTo(s*0.4, 0, s*0.26, -s*0.36);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.3)";
      ctx.fillRect(-s*0.28, -s*0.38, s*0.56, s*0.09);
      ctx.fillRect(-s*0.28,  s*0.29, s*0.56, s*0.09);
      ctx.fillStyle = "rgba(255,225,150,.85)";
      ctx.beginPath(); ctx.arc(0, 0, s*0.13, 0, 7); ctx.fill();
      break;
    }

    case "bidon": {                  // bidon d'huile
      ctx.fillRect(-s*0.26, -s*0.3, s*0.52, s*0.6);
      ctx.strokeRect(-s*0.26, -s*0.3, s*0.52, s*0.6);
      ctx.fillStyle = "rgba(60,45,15,.5)";
      ctx.fillRect(-s*0.1, -s*0.42, s*0.2, s*0.13);
      ctx.fillStyle = "rgba(255,255,255,.28)";
      ctx.fillRect(-s*0.2, -s*0.2, s*0.12, s*0.4);
      break;
    }

    case "sac": {                    // sac de sel ou d'arôme
      ctx.beginPath();
      ctx.moveTo(-s*0.3, s*0.34);
      ctx.lineTo(-s*0.22, -s*0.24);
      ctx.lineTo( s*0.22, -s*0.24);
      ctx.lineTo( s*0.3,  s*0.34);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(0,0,0,.35)";
      ctx.lineWidth = Math.max(0.01, s*0.06);
      ctx.beginPath(); ctx.moveTo(-s*0.22,-s*0.24); ctx.lineTo(s*0.22,-s*0.24); ctx.stroke();
      break;
    }

    case "bobine": {                 // bobine de film
      ctx.beginPath(); ctx.arc(0, 0, s*0.36, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(30,36,42,.75)";
      ctx.beginPath(); ctx.arc(0, 0, s*0.12, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.25)";
      ctx.lineWidth = Math.max(0.008, s*0.035);
      ctx.beginPath(); ctx.arc(0, 0, s*0.24, 0, 7); ctx.stroke();
      break;
    }
  }
  ctx.restore();
}

/* ------------------------------------------------------------- Le sol */
function dessinerSol(){
  const u = U();

  // Hors des murs : le noir de la nuit
  ecranSeul();
  ctx.fillStyle = "#101215";
  ctx.fillRect(0,0,largeurVue,hauteurVue);
  appliquerCamera();

  // La cour, puis la dalle de béton et sa crasse : deux images, rien de plus
  const co = profondeurCour(u);
  majCacheCour();
  ctx.drawImage(cacheCour, -co, -co, u.largeur + 2*co, u.hauteur + 2*co);
  majCacheSol();
  ctx.drawImage(cacheSol, 0, 0, u.largeur, u.hauteur);

  // Quadrillage discret
  if (vue.zoom > CONFIG.seuilSchema){
    ctx.strokeStyle = "rgba(255,255,255,.045)";
    ctx.lineWidth = 1/T();
    ctx.beginPath();
    for (let x=0; x<=u.largeur; x++){ ctx.moveTo(x,0); ctx.lineTo(x,u.hauteur); }
    for (let y=0; y<=u.hauteur; y++){ ctx.moveTo(0,y); ctx.lineTo(u.largeur,y); }
    ctx.stroke();
  }

  // Marquage jaune des allées
  ctx.strokeStyle = "rgba(226,182,44,.5)";
  ctx.lineWidth = 0.09;
  ctx.setLineDash([0.7,0.45]);
  ctx.strokeRect(0.45,0.45,u.largeur-0.9,u.hauteur-0.9);
  ctx.setLineDash([]);

  // Murs
  ctx.strokeStyle = "#2b2e33";
  ctx.lineWidth = 0.22;
  ctx.strokeRect(-0.11,-0.11,u.largeur+0.22,u.hauteur+0.22);
  ctx.strokeStyle = "#191b1f";
  ctx.lineWidth = 0.08;
  ctx.strokeRect(0,0,u.largeur,u.hauteur);

  dessinerEnseigne();

  // Les portes : là où l'on sort dans la cour. Un trou dans le mur, un paillasson.
  for (const p of portesAtelier(u)){
    const nord = p.y === 0, sud = p.y === u.hauteur-1, ouest = p.x === 0;
    const hx = nord || sud ? p.x : (ouest ? -0.16 : u.largeur-0.84);
    const hy = nord || sud ? (nord ? -0.16 : u.hauteur-0.84) : p.y;
    const l = nord || sud ? 1 : 1, h = nord || sud ? 1 : 1;
    ctx.fillStyle = "#4a4d52";                       // le mur s'ouvre
    if (nord || sud) ctx.fillRect(p.x+0.05, hy, 0.9, 1);
    else ctx.fillRect(hx, p.y+0.05, 1, 0.9);
    ctx.strokeStyle = "rgba(226,182,44,.55)";
    ctx.lineWidth = 0.07;
    ctx.setLineDash([0.2,0.16]);
    ctx.strokeRect(p.x+0.14, p.y+0.14, 0.72, 0.72);
    ctx.setLineDash([]);
  }
}

/* --------------------------------------------------------- L'enseigne
   Le nom et le logo peints sur le mur nord, en grand. C'est ce qui fait que
   l'usine est la vôtre et pas une usine quelconque. Peint une fois dans une
   image : ça ne bouge que si le joueur change la marque. */
let cacheEnseigne = null, cacheEnseigneCle = "";
function dessinerEnseigne(){
  const u = U(), m = etat.marque;
  if (!m) return;
  const l = Math.min(u.largeur * 0.62, 22), h = 2.6;
  const cle = m.nom + "|" + m.logo + "|" + m.c1 + "|" + m.c2 + "|" + m.styleNom + "|" + Math.round(l*10);
  if (!cacheEnseigne || cle !== cacheEnseigneCle){
    cacheEnseigneCle = cle;
    const T = 64;                       // pixels par tuile dans l'image
    if (!cacheEnseigne) cacheEnseigne = document.createElement("canvas");
    cacheEnseigne.width = Math.round(l*T); cacheEnseigne.height = Math.round(h*T);
    const g = cacheEnseigne.getContext("2d");
    g.clearRect(0,0,cacheEnseigne.width,cacheEnseigne.height);
    const H = cacheEnseigne.height;
    dessinerLogo(g, m, H*0.62, H*0.5, H*0.36);
    g.fillStyle = m.c1;
    g.textAlign = "left"; g.textBaseline = "middle";
    let taille = Math.round(H*0.52);
    const nom = (m.nom||"").toUpperCase().slice(0,20), dispo = cacheEnseigne.width - H*1.3;
    g.font = policeMarque(m.styleNom, taille);
    while (taille > 8 && g.measureText(nom).width > dispo){
      taille -= 2; g.font = policeMarque(m.styleNom, taille);
    }
    g.fillText(nom, H*1.12, H*0.53);
    // peinture usée : quelques manques, sinon ça fait autocollant
    g.globalCompositeOperation = "destination-out";
    for (let i=0;i<90;i++){
      g.globalAlpha = 0.05 + bruit(i*3.7)*0.22;
      g.beginPath();
      g.ellipse(bruit(i*1.9)*cacheEnseigne.width, bruit(i*5.3)*H,
                2+bruit(i*7.1)*9, 1+bruit(i*11.3)*5, bruit(i*2.3)*3, 0, 7);
      g.fill();
    }
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  }
  const x = (u.largeur - l)/2;
  ctx.save();
  ctx.globalAlpha = 0.88;
  ctx.drawImage(cacheEnseigne, x, 0.55, l, h);
  ctx.restore();
}

function dessinerUnQuai(q, stock, titre, teinte){
  ctx.save();
  ctx.fillStyle = "#3c4045";
  ctx.fillRect(q.x, q.y, q.l, q.h);
  ctx.fillStyle = "#33373c";
  ctx.fillRect(q.x, q.y+q.h-0.22, q.l, 0.22);

  // bandes d'avertissement, teintées selon le sens du quai
  ctx.save();
  ctx.beginPath(); ctx.rect(q.x,q.y,q.l,q.h); ctx.clip();
  ctx.strokeStyle = teinte === "#5cba6b" ? "rgba(92,186,107,.72)" : "rgba(226,182,44,.75)";
  ctx.lineWidth = 0.16;
  for (let i=-q.h; i<q.l+q.h; i+=0.5){
    ctx.beginPath(); ctx.moveTo(q.x+i, q.y); ctx.lineTo(q.x+i+q.h, q.y+q.h); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = "rgba(20,22,25,.55)";
  ctx.fillRect(q.x+0.15, q.y+0.15, q.l-0.3, q.h-0.3);

  if (vue.zoom > CONFIG.seuilDetail){
    const items = Object.keys(stock).filter(k => ITEMS[k] && stock[k] > 0.5);
    let i = 0;
    for (const it of items){
      const n = Math.min(4, Math.ceil(stock[it]/8));
      for (let k=0;k<n && i<22;k++,i++){
        const bx = q.x + 0.32 + bruit(i*3+1)*(q.l-0.64);
        const by = q.y + 0.32 + bruit(i*7+5)*(q.h-0.64);
        dessinerItem(bx, by, 0.42, it, 0.95);
      }
    }
  }
  ctx.restore();

  if (vue.zoom > CONFIG.seuilDetail){
    const e = mondeVersEcran(q.x+q.l/2, q.y-0.15);
    ecranSeul();
    ctx.font = "600 " + Math.round(10*Math.min(1.4,vue.zoom)) + "px Segoe UI, sans-serif";
    ctx.textAlign = "center"; ctx.fillStyle = teinte === "#5cba6b" ? "rgba(140,215,155,.9)" : "rgba(226,196,120,.85)";
    ctx.fillText(titre, e.x, e.y);
    appliquerCamera();
  }
}

/* ============================================================================
   RENDU (2/3) — convoyeurs et machines
   ========================================================================== */

/* ---------------------------------------------------------- Convoyeurs */
/** Où se trouve, en coordonnées de tuile, le « cœur » d'un nœud vu depuis
 *  une tuile donnée. Pour un convoyeur, c'est sa tuile la plus proche. */
function ancreNoeud(n, depuis){
  if (!n) return null;
  if (n.type === "convoyeur"){
    let best = null, bd = 1e9;
    for (const t of n.chemin){
      const d = (t.x-depuis.x)*(t.x-depuis.x) + (t.y-depuis.y)*(t.y-depuis.y);
      if (d < bd){ bd = d; best = t; }
    }
    return best ? { x:best.x+0.5, y:best.y+0.5 } : null;
  }
  // Le point du nœud le plus proche de la bande, pas son centre : un quai haut
  // a son centre très loin du bout de bande, et le raccord partait de travers.
  return { x: clamp(depuis.x + 0.5, n.x, n.x + (n.l||1)),
           y: clamp(depuis.y + 0.5, n.y, n.y + (n.h||1)) };
}

/** Le chemin dessiné déborde d'une demi-tuile à chaque bout, vers ce à quoi la
 *  bande est raccordée : deux convoyeurs qui se suivent se rejoignent alors
 *  vraiment, et une bande touche la machine qu'elle alimente. Sans ça, la
 *  marchandise a l'air posée sur deux îlots séparés.
 *  Mis en cache : il ne change qu'en cas de modification de l'atelier. */
function cheminRendu(c){
  let r = idx.renduConv.get(c.id);
  if (r && r.cle === c.source + ":" + c.destination + ":" + c.chemin.length) return r.pts;

  const pts = c.chemin.map(t => ({ x:t.x+0.5, y:t.y+0.5 }));
  const deborde = (bout, voisinTuile, noeud) => {
    const a = ancreNoeud(noeud, bout);
    if (!a) return null;
    const dx = a.x - (bout.x+0.5), dy = a.y - (bout.y+0.5);
    const ax = Math.abs(dx) > Math.abs(dy);
    return { x: bout.x+0.5 + (ax ? Math.sign(dx)*0.52 : 0),
             y: bout.y+0.5 + (ax ? 0 : Math.sign(dy)*0.52) };
  };
  const deb = deborde(c.chemin[0], c.chemin[1], noeudParId(c.source));
  if (deb) pts.unshift(deb);
  const fin = deborde(c.chemin[c.chemin.length-1], c.chemin[c.chemin.length-2], noeudParId(c.destination));
  if (fin) pts.push(fin);

  idx.renduConv.set(c.id, { cle: c.source + ":" + c.destination + ":" + c.chemin.length, pts });
  return pts;
}

/* Les passerelles se dessinent après toutes les bandes : sinon une bande posée
   plus tard passerait par-dessus le pont qui l'enjambe, et le dessus-dessous
   serait inversé à l'écran. */
const pontsAdessiner = [];
function dessinerPonts(){
  for (const c of pontsAdessiner){
    const ch = cheminRendu(c);
    // Chaque tuile de pont, avec un bout de bande de part et d'autre pour la
    // rampe : on doit voir que ça monte, passe, et redescend.
    for (const k of c.ponts){
      const [px, py] = k.split(",").map(Number);
      let i = c.chemin.findIndex(t => t.x === px && t.y === py);
      if (i < 0) continue;
      const d = ch.length - c.chemin.length;      // décalage dû aux débords
      const j = i + (d > 0 ? 1 : 0);
      const a = ch[Math.max(0, j-1)], b = ch[j], e = ch[Math.min(ch.length-1, j+1)];
      const dx = Math.sign(e.x - a.x), dy = Math.sign(e.y - a.y);
      const d0 = { x: b.x - dx*0.85, y: b.y - dy*0.85 };
      const d1 = { x: b.x + dx*0.85, y: b.y + dy*0.85 };
      ctx.lineJoin = "round"; ctx.lineCap = "butt";
      // l'ombre portée sur la bande du dessous
      ctx.strokeStyle = "rgba(0,0,0,.42)";
      ctx.lineWidth = 0.92;
      ctx.beginPath(); ctx.moveTo(d0.x+0.10, d0.y+0.14); ctx.lineTo(d1.x+0.10, d1.y+0.14); ctx.stroke();
      // les piles de chaque côté
      ctx.fillStyle = "#23262b";
      for (const p of [d0, d1]){
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, dx ? 0.10 : 0.42, dx ? 0.42 : 0.10, 0, 0, 7);
        ctx.fill();
      }
      // le tablier
      ctx.strokeStyle = "#343941"; ctx.lineWidth = 0.86;
      ctx.beginPath(); ctx.moveTo(d0.x, d0.y); ctx.lineTo(d1.x, d1.y); ctx.stroke();
      ctx.strokeStyle = orphelinCouleur(c, "#4b525b"); ctx.lineWidth = 0.62;
      ctx.beginPath(); ctx.moveTo(d0.x, d0.y); ctx.lineTo(d1.x, d1.y); ctx.stroke();
      // garde-corps : deux traits clairs, c'est ce qui dit « c'est en hauteur »
      ctx.strokeStyle = "rgba(255,255,255,.20)"; ctx.lineWidth = 0.05;
      for (const s2 of [-1, 1]){
        ctx.beginPath();
        ctx.moveTo(d0.x + (dx ? 0 : s2*0.33), d0.y + (dx ? s2*0.33 : 0));
        ctx.lineTo(d1.x + (dx ? 0 : s2*0.33), d1.y + (dx ? s2*0.33 : 0));
        ctx.stroke();
      }
      // la marchandise repasse par-dessus
      dessinerMarchandiseSegment(c, d0, d1);
    }
  }
  pontsAdessiner.length = 0;
}
function orphelinCouleur(c, normal){ return c.etat === "non_relie" ? "#7a4038" : normal; }

/** Ce que porte la bande sur ce court segment : on redessine par-dessus le
 *  tablier ce qui s'y trouve, sinon la marchandise disparaît sous le pont. */
function dessinerMarchandiseSegment(c, d0, d1){
  if (vue.zoom <= CONFIG.seuilDetail) return;
  const ch = cheminRendu(c);
  for (const p of c.transit){
    const t = clamp(1 - p.t/c.latence, 0, 1);
    const q = pointSurChemin(c, t);
    const dedans = (q.x-d0.x)*(d1.x-q.x) >= -0.01 && (q.y-d0.y)*(d1.y-q.y) >= -0.01;
    if (!dedans) continue;
    dessinerItem(q.x, q.y, 0.34, p.item);
  }
}

function pointSurChemin(c, t){
  const ch = cheminRendu(c);
  const n = ch.length;
  if (n === 0) return {x:0,y:0};
  if (n === 1) return ch[0];
  const f = clamp(t,0,1)*(n-1);
  const i = Math.min(n-2, Math.floor(f));
  const k = f-i;
  const a = ch[i], b = ch[i+1];
  return { x: lerp(a.x,b.x,k), y: lerp(a.y,b.y,k) };
}

function dessinerConvoyeur(c){
  if (!c.chemin.length) return;
  const orphelin = c.etat === "non_relie";
  const ch = cheminRendu(c);
  if (c.ponts && c.ponts.length) pontsAdessiner.push(c);

  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(ch[0].x, ch[0].y);
  for (let i=1;i<ch.length;i++) ctx.lineTo(ch[i].x, ch[i].y);

  // châssis
  ctx.strokeStyle = orphelin ? "#5a3430" : "#2c3036";
  ctx.lineWidth = 0.82; ctx.stroke();
  // bande
  ctx.strokeStyle = orphelin ? "#7a4038" : "#41474e";
  ctx.lineWidth = 0.62; ctx.stroke();

  // défilement de la bande : décalage temporel commun, jamais stocké
  if (vue.zoom > CONFIG.seuilSchema){
    const avance = (vue.temps * CONV.vitesse * 4) % 0.6;
    ctx.strokeStyle = "rgba(0,0,0,.3)";
    ctx.lineWidth = 0.6;
    ctx.setLineDash([0.12, 0.48]);
    ctx.lineDashOffset = -avance;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }
  // rebords
  ctx.strokeStyle = "rgba(255,255,255,.07)";
  ctx.lineWidth = 0.06;
  ctx.stroke();

  // Chevrons : dans un réseau, savoir dans quel sens ça circule n'est pas
  // un détail. On les fait défiler le long du chemin.
  if (!orphelin && vue.zoom > CONFIG.seuilSchema){
    const n = ch.length;
    const glisse = (vue.temps * 0.55) % 1;
    ctx.strokeStyle = "rgba(255,255,255,.22)";
    ctx.lineWidth = 0.07;
    ctx.lineCap = "round";
    for (let i = 0; i < n-1; i++){
      const a = ch[i], b = ch[i+1];
      const dx = b.x-a.x, dy = b.y-a.y;
      const px = a.x + dx*glisse, py = a.y + dy*glisse;
      ctx.beginPath();
      ctx.moveTo(px - dx*0.16 - dy*0.16, py - dy*0.16 - dx*0.16);
      ctx.lineTo(px + dx*0.1, py + dy*0.1);
      ctx.lineTo(px - dx*0.16 + dy*0.16, py - dy*0.16 + dx*0.16);
      ctx.stroke();
    }
  }

  if (orphelin){
    const p = pointSurChemin(c, 0.5);
    dessinerAlerte(p.x, p.y, "!", "#e0574a");
    return;
  }

  // Les pièces en transit : positions calculées à partir des colis, jamais
  // stockées dans l'état (§7.2).
  if (vue.zoom > CONFIG.seuilSchema){
    let dessines = 0, bloques = 0;
    for (let i=0; i<c.transit.length && dessines < CONFIG.itemsConvoyeurMax; i++){
      const p = c.transit[i];
      let t;
      if (p.t <= 0){ t = 1 - bloques*0.055; bloques++; }
      else t = 1 - p.t / c.latence;
      // Une vignette par pièce, plafonnée : une bande chargée paraît chargée,
      // une bande à vide paraît vide (§7.2).
      const n = clamp(Math.round(p.qte), 1, 8);
      for (let k=0; k<n && dessines<CONFIG.itemsConvoyeurMax; k++, dessines++){
        const tt = clamp(t - k*0.052, 0, 1);
        const pt = pointSurChemin(c, tt);
        const lat = (bruit(i*13+k*7)-0.5)*0.22;      // léger désordre, déterministe
        dessinerItem(pt.x+lat, pt.y+lat*0.6, 0.44, p.item);
      }
    }
  }
}

/* ------------------------------------------------------------ Machines */
function dessinerMachine(m){
  const d = MACHINES[m.type];
  if (d.batiment){ dessinerBatiment(m, d); return; }
  const x = m.x, y = m.y, l = m.l, h = m.h;
  const produit = m.etat === "produit";

  ctx.save();

  // Vibration d'une machine fatiguée (§3.2)
  if (m.usure > 0.55 && produit){
    const a = (m.usure-0.55)*0.06;
    ctx.translate(Math.sin(vue.temps*47+m.id)*a, Math.cos(vue.temps*53+m.id)*a);
  }

  // Ombre portée
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.fillRect(x+0.09, y+0.14, l, h);

  // Corps en gris acier. Le dégradé ne dépend que de la hauteur : on le garde
  // en mémoire pour ne rien allouer dans la boucle de rendu (§16).
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = gradientCorps(h);
  coinsArrondis(0.06, 0.06, l-0.12, h-0.12, 0.12);
  ctx.fill();
  ctx.restore();

  // Face avant visible, façon vue du dessus légèrement inclinée (§7.3)
  ctx.fillStyle = "#3a3f46";
  coinsArrondis(x+0.06, y+h-0.36, l-0.12, 0.3, 0.08);
  ctx.fill();

  // Bandeau de couleur par fonction
  ctx.fillStyle = d.couleur;
  ctx.fillRect(x+0.14, y+0.14, l-0.28, 0.16);
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.fillRect(x+0.14, y+0.26, l-0.28, 0.04);

  // Détails propres à chaque machine
  if (vue.zoom > CONFIG.seuilSchema) detailMachine(m, d, x, y, l, h, produit);

  // Traces d'huile sur une machine usée
  if (m.usure > 0.35){
    ctx.fillStyle = "rgba(18,14,8," + (m.usure*0.3).toFixed(2) + ")";
    ctx.beginPath(); ctx.ellipse(x+l*0.7, y+h-0.22, 0.28, 0.13, 0, 0, 7); ctx.fill();
  }

  ctx.restore();

  // Tas de pièces devant la machine quand ça bloque en sortie (§3.2)
  dessinerTasSortie(m);

  // Repères d'état
  dessinerEtatMachine(m);

  // Barre de progression discrète
  if (produit && vue.zoom > CONFIG.seuilDetail && m.enCycle){
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(x+0.2, y+h-0.19, l-0.4, 0.08);
    ctx.fillStyle = d.accent;
    ctx.fillRect(x+0.2, y+h-0.19, (l-0.4)*clamp(m.progression,0,1), 0.08);
  }
}

/* ------------------------------------------------------------ Bâtiments
   Un bâtiment n'est pas une machine : pas de châssis d'acier, pas de bandeau
   de fonction. C'est une petite construction vue de dessus — un toit avec ses
   pentes, une gouttière, des fenêtres, une porte tournée vers l'atelier. */
function dessinerBatiment(m, d){
  const x = m.x, y = m.y, l = m.l, h = m.h;
  const u = U();
  ctx.save();

  // Ombre longue sur l'herbe, du côté opposé au soleil du matin
  ctx.fillStyle = "rgba(0,0,0,.38)";
  coinsArrondis(x+0.24, y+0.30, l-0.1, h-0.05, 0.1); ctx.fill();

  // Murs : on les voit dépasser du toit, c'est ce qui donne l'épaisseur
  ctx.fillStyle = "#8b8378";
  coinsArrondis(x+0.06, y+0.10, l-0.12, h-0.16, 0.07); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.fillRect(x+0.06, y+h-0.24, l-0.12, 0.18);

  // Le toit, en deux pans qui se rejoignent sur une ligne de faîtage
  const mx = x + l/2, fy0 = y+0.20, fy1 = y+h-0.30;
  // Le dégradé est défini à l'origine : on se déplace, on peint, on revient.
  ctx.save();
  ctx.translate(0, fy0);
  const r1 = fy1 - fy0;
  ctx.fillStyle = gradientToit(r1, 0, m.type);
  ctx.beginPath();
  ctx.moveTo(x+0.02, -0.06); ctx.lineTo(mx, 0.02);
  ctx.lineTo(mx, r1-0.02); ctx.lineTo(x+0.02, r1+0.06);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = gradientToit(r1, 1, m.type);
  ctx.beginPath();
  ctx.moveTo(x+l-0.02, -0.06); ctx.lineTo(mx, 0.02);
  ctx.lineTo(mx, r1-0.02); ctx.lineTo(x+l-0.02, r1+0.06);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // faîtage et gouttières
  ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 0.05;
  ctx.beginPath(); ctx.moveTo(mx, fy0+0.02); ctx.lineTo(mx, fy1-0.02); ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 0.06;
  ctx.beginPath();
  ctx.moveTo(x+0.02, fy0-0.06); ctx.lineTo(x+0.02, fy1+0.06);
  ctx.moveTo(x+l-0.02, fy0-0.06); ctx.lineTo(x+l-0.02, fy1+0.06);
  ctx.stroke();
  // rangs de tuiles
  ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 0.022;
  ctx.beginPath();
  for (let t2=fy0+0.18; t2<fy1-0.05; t2+=0.19){ ctx.moveTo(x+0.05, t2); ctx.lineTo(x+l-0.05, t2); }
  ctx.stroke();

  // Bandeau de couleur, discret : une frise sous la gouttière
  ctx.fillStyle = d.couleur;
  ctx.globalAlpha = 0.85;
  ctx.fillRect(x+0.06, y+h-0.24, l-0.12, 0.06);
  ctx.globalAlpha = 1;

  // La porte, tournée vers l'atelier
  const versX = clamp(u.largeur/2, x-4, x+l+4), versY = clamp(u.hauteur/2, y-4, y+h+4);
  const horiz = Math.abs(versX - mx) > Math.abs(versY - (y+h/2));
  const px2 = horiz ? (versX > mx ? x+l-0.16 : x+0.06) : mx-0.19;
  const py2 = horiz ? y+h/2-0.19 : (versY > y+h/2 ? y+h-0.26 : y+0.10);
  ctx.fillStyle = "#4a3a2a";
  ctx.fillRect(px2, py2, horiz ? 0.10 : 0.38, horiz ? 0.38 : 0.16);
  ctx.fillStyle = "#c9a25e";
  ctx.fillRect(horiz ? px2+0.03 : px2+0.30, horiz ? py2+0.28 : py2+0.05, 0.045, 0.045);

  // Détails propres à chaque bâtiment
  if (vue.zoom > CONFIG.seuilSchema) detailBatiment(m, d, x, y, l, h, mx);

  ctx.restore();
  dessinerEtatMachine(m);
}

/** Ce qu'on voit sur le toit et autour : c'est ce qui distingue une salle de
 *  pause d'un bureau, bien plus qu'une couleur. */
function detailBatiment(m, d, x, y, l, h, mx){
  const nuit = minuteDuJour()/CONFIG.minutesParJour;
  const eclaire = nuit < 0.30 || nuit > 0.72;

  // Fenêtres de toit, alignées de part et d'autre du faîtage
  const fenetre = (fx, fy, fl, fh, vif) => {
    ctx.fillStyle = "#2b323a";
    coinsArrondis(fx-0.02, fy-0.02, fl+0.04, fh+0.04, 0.02); ctx.fill();
    ctx.fillStyle = vif ? d.accent : (eclaire ? "#f2d79a" : "#9fb3c4");
    ctx.globalAlpha = vif ? 0.9 : (eclaire ? 0.85 : 0.55);
    ctx.fillRect(fx, fy, fl, fh);
    ctx.globalAlpha = 1;
  };

  switch (m.type){
    case "salle_pause": {
      const occupe = U().ouvriers.some(o => o.tache && o.tache.type === "repos" && o.tache.salleId === m.id);
      fenetre(x+0.28, y+0.42, 0.42, 0.22, occupe);
      fenetre(x+l-0.70, y+0.42, 0.42, 0.22, occupe);
      // la terrasse : une table et deux bancs, sur le pignon
      const tx = x + l + 0.30, ty = y + h/2;
      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.beginPath(); ctx.ellipse(tx+0.04, ty+0.08, 0.30, 0.24, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#b98a52";
      ctx.beginPath(); ctx.ellipse(tx, ty, 0.26, 0.21, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#8d6a3f";
      ctx.fillRect(tx-0.34, ty-0.06, 0.12, 0.12);
      ctx.fillRect(tx+0.22, ty-0.06, 0.12, 0.12);
      // le parasol, ouvert quand quelqu'un est là
      if (occupe){
        ctx.fillStyle = "rgba(0,0,0,.22)";
        ctx.beginPath(); ctx.ellipse(tx+0.05, ty+0.06, 0.34, 0.28, 0, 0, 7); ctx.fill();
        for (let k=0;k<6;k++){
          ctx.fillStyle = k%2 ? "#e2b62c" : "#f0f2f4";
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.arc(tx, ty, 0.32, k/6*6.283, (k+1)/6*6.283);
          ctx.closePath(); ctx.fill();
        }
      }
      // la fumée du café
      if (occupe && Math.random() < 0.05) particule(x+l/2, y+0.3, "vapeur");
      break;
    }

    case "salle_formation": {
      const active = (etat.formations||[]).length > 0;
      fenetre(x+0.26, y+0.46, 0.30, 0.26, active);
      fenetre(x+0.26, y+h-0.86, 0.30, 0.26, active);
      fenetre(x+l-0.58, y+0.46, 0.30, 0.26, active);
      fenetre(x+l-0.58, y+h-0.86, 0.30, 0.26, active);
      // le panneau d'affichage, planté devant l'entrée
      const sx = x + l/2, sy = y + h + 0.26;
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.fillRect(sx-0.24, sy-0.04, 0.5, 0.28);
      ctx.fillStyle = "#5b4a34"; ctx.fillRect(sx-0.03, sy+0.16, 0.06, 0.18);
      ctx.fillStyle = "#e8e4d8"; ctx.fillRect(sx-0.26, sy-0.08, 0.52, 0.26);
      ctx.strokeStyle = "#8d8578"; ctx.lineWidth = 0.024;
      ctx.beginPath();
      for (let k=0;k<3;k++){ ctx.moveTo(sx-0.20, sy-0.01+k*0.07); ctx.lineTo(sx+0.20-k*0.06, sy-0.01+k*0.07); }
      ctx.stroke();
      if (active){
        ctx.fillStyle = "rgba(196,158,240,.10)";
        coinsArrondis(x+0.06, y+0.10, l-0.12, h-0.16, 0.07); ctx.fill();
      }
      break;
    }

    case "bureau": {
      const cherche = !!(etat.recherche && etat.recherche.enCours);
      const i = cherche ? 0.5 + 0.5*Math.sin(vue.temps*2.2 + m.id) : 0;
      for (let r2=0; r2<2; r2++)
        for (let k=0;k<2;k++)
          fenetre(x+0.24+k*(l-0.72), y+0.44+r2*(h-1.02), 0.46, 0.24,
                  cherche && ((k+r2+Math.floor(vue.temps*0.7+m.id))%2 === 0));
      // le bloc de climatisation sur le toit
      ctx.fillStyle = "#6f7782";
      coinsArrondis(x+l/2-0.22, y+h/2-0.16, 0.44, 0.32, 0.04); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 0.03;
      ctx.beginPath();
      for (let k=0;k<3;k++){ ctx.moveTo(x+l/2-0.17, y+h/2-0.09+k*0.08); ctx.lineTo(x+l/2+0.17, y+h/2-0.09+k*0.08); }
      ctx.stroke();
      // le mât et son fanion, qui claque quand une étude tourne
      const hx = x + 0.16, hy = y + h + 0.18;
      ctx.strokeStyle = "#b9bfc7"; ctx.lineWidth = 0.045;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy-0.62); ctx.stroke();
      ctx.fillStyle = d.accent;
      ctx.beginPath();
      ctx.moveTo(hx, hy-0.62);
      ctx.lineTo(hx+0.30+Math.sin(vue.temps*2.6)*0.04, hy-0.52);
      ctx.lineTo(hx, hy-0.42);
      ctx.closePath(); ctx.fill();
      if (cherche){
        ctx.fillStyle = "rgba(143,228,236," + (0.05+i*0.07).toFixed(2) + ")";
        coinsArrondis(x+0.06, y+0.10, l-0.12, h-0.16, 0.07); ctx.fill();
      }
      break;
    }
  }
}

/* Les deux pans du toit. Comme le corps des machines, le dégradé ne dépend que
   de la hauteur : on le garde en mémoire pour ne rien allouer par image (§16). */
const cacheGradToit = new Map();
const TOITS = {
  salle_pause:     [["#6f7a5c","#57614a"], ["#7d8968","#616c52"]],
  salle_formation: [["#6c6079","#544a60"], ["#7a6d88","#5e536c"]],
  bureau:          [["#566f78","#42565e"], ["#617d87","#4a606a"]]
};
function gradientToit(hauteur, pan, type){
  const cle = Math.round(hauteur*100) + ":" + pan + ":" + type;
  let g = cacheGradToit.get(cle);
  if (!g){
    const c = (TOITS[type] || [["#5d6470","#464c56"], ["#6c7480","#525966"]])[pan];
    g = ctx.createLinearGradient(0, 0, 0, hauteur);
    g.addColorStop(0, c[0]);
    g.addColorStop(1, c[1]);
    cacheGradToit.set(cle, g);
  }
  return g;
}

const cacheGradCorps = new Map();
function gradientCorps(h){
  let g = cacheGradCorps.get(h);
  if (!g){
    g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#767c84");
    g.addColorStop(0.55, "#5b6169");
    g.addColorStop(1, "#474d55");
    cacheGradCorps.set(h, g);
  }
  return g;
}

function coinsArrondis(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function detailMachine(m, d, x, y, l, h, produit){
  const cx = x+l/2, cy = y+h/2;
  switch (m.type){

    case "laveuse": {
      // bac d'eau, tambour qui brasse, clapotis
      ctx.fillStyle = "#2e3a44";
      coinsArrondis(x+0.24, y+0.4, l-0.48, h-0.74, 0.08); ctx.fill();
      const eau = ctx.createLinearGradient(0, y+0.4, 0, y+h-0.34);
      eau.addColorStop(0, produit ? "rgba(80,175,225,.75)" : "rgba(70,120,150,.4)");
      eau.addColorStop(1, produit ? "rgba(40,120,180,.75)" : "rgba(50,90,120,.4)");
      ctx.fillStyle = eau;
      coinsArrondis(x+0.3, y+0.46, l-0.6, h-0.86, 0.06); ctx.fill();
      if (produit){
        // rides à la surface, phase déterministe : pas de scintillement
        ctx.strokeStyle = "rgba(255,255,255,.35)";
        ctx.lineWidth = 0.035;
        for (let i=0;i<3;i++){
          const o = Math.sin(vue.temps*2.2 + i*1.7)*0.09;
          ctx.beginPath();
          ctx.moveTo(x+0.36, y+0.66+i*0.28+o);
          ctx.lineTo(x+l-0.36, y+0.66+i*0.28-o);
          ctx.stroke();
        }
        // patates qui tournent dans le bac
        for (let i=0;i<3;i++){
          const a = vue.temps*1.6 + i*2.1;
          dessinerItem(cx + Math.cos(a)*(l*0.2), cy + Math.sin(a)*(h*0.16), 0.34, "pdt_brutes");
        }
      }
      break;
    }

    case "trancheuse": {
      // capot, lame circulaire, rondelles qui tombent
      ctx.fillStyle = "#39404a";
      coinsArrondis(x+0.26, y+0.42, l-0.52, h-0.76, 0.06); ctx.fill();
      const a = produit ? vue.temps*19 : 0;
      ctx.save();
      ctx.translate(cx, cy+0.02); ctx.rotate(a);
      ctx.fillStyle = "#c2cad3";
      ctx.beginPath(); ctx.arc(0,0,0.3,0,7); ctx.fill();
      ctx.strokeStyle = "#8d959e"; ctx.lineWidth = 0.035;
      for (let i=0;i<6;i++){
        const t = i/6*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(t)*0.09, Math.sin(t)*0.09);
        ctx.lineTo(Math.cos(t)*0.3, Math.sin(t)*0.3);
        ctx.stroke();
      }
      ctx.restore();
      if (produit)
        for (let i=0;i<3;i++){
          const p = ((vue.temps*1.5 + i*0.33) % 1);
          dessinerItem(cx + 0.2 + i*0.12, cy + 0.1 + p*0.5, 0.26, "rondelles", 1-p*0.7);
        }
      break;
    }

    case "friteuse": {
      // bain d'huile chaude : bouillonnement et buée
      ctx.fillStyle = "#2f3238";
      coinsArrondis(x+0.2, y+0.4, l-0.4, h-0.72, 0.07); ctx.fill();
      // Une huile fatiguée se voit : elle fonce. C'est le premier signe (§3.2).
      const f = clamp(m.fraicheurHuile ?? 1, 0, 1);
      const a1 = produit ? 0.9 : 0.55;
      const hu = ctx.createLinearGradient(0, y+0.44, 0, y+h-0.34);
      hu.addColorStop(0, "rgba("+Math.round(lerp(96,240,f))+","+Math.round(lerp(62,185,f))+","+Math.round(lerp(24,60,f))+","+a1+")");
      hu.addColorStop(1, "rgba("+Math.round(lerp(66,190,f))+","+Math.round(lerp(42,125,f))+","+Math.round(lerp(16,35,f))+","+a1+")");
      ctx.fillStyle = hu;
      coinsArrondis(x+0.28, y+0.48, l-0.56, h-0.88, 0.05); ctx.fill();
      if (produit){
        // bulles : position et taille dérivées de l'index, donc stables
        ctx.fillStyle = "rgba(255,240,190,.6)";
        for (let i=0;i<9;i++){
          const bx = x+0.42 + bruit(i*5+m.id)*(l-0.84);
          const mont = ((vue.temps*0.9 + bruit(i*11)) % 1);
          const by = y+h-0.42 - mont*(h-0.95);
          const r = 0.025 + bruit(i*7)*0.035;
          ctx.beginPath(); ctx.arc(bx, by, r*(0.5+mont), 0, 7); ctx.fill();
        }
        // chips qui flottent
        for (let i=0;i<4;i++){
          const d2 = ((vue.temps*0.35 + i*0.25) % 1);
          dessinerItem(x+0.5 + d2*(l-1), cy+0.05 + Math.sin(vue.temps*2+i)*0.06, 0.3, "chips_vrac", 0.9);
        }
        // reflet de chaleur
        ctx.fillStyle = "rgba(255,190,90,.12)";
        coinsArrondis(x+0.2, y+0.4, l-0.4, h-0.72, 0.07); ctx.fill();
      }
      // hotte
      ctx.fillStyle = "#4c525a";
      ctx.fillRect(x+l*0.5-0.3, y+0.1, 0.6, 0.24);
      break;
    }

    case "tambour": {
      // tambour incliné qui tourne, nuage d'arôme
      ctx.fillStyle = "#3a3428";
      coinsArrondis(x+0.24, y+0.42, l-0.48, h-0.76, 0.1); ctx.fill();
      ctx.save();
      ctx.translate(cx, cy+0.02);
      const g2 = ctx.createLinearGradient(0,-0.3,0,0.3);
      g2.addColorStop(0,"#c9a55e"); g2.addColorStop(1,"#8a7038");
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.ellipse(0,0,l*0.3,h*0.2,0,0,7); ctx.fill();
      // cerclages qui défilent = rotation lisible
      ctx.strokeStyle = "rgba(40,32,18,.6)"; ctx.lineWidth = 0.05;
      for (let i=0;i<4;i++){
        const p = ((vue.temps*(produit?0.8:0) + i*0.25) % 1);
        const dx = (p-0.5)*l*0.56;
        ctx.beginPath();
        ctx.ellipse(dx, 0, 0.05, h*0.19, 0, 0, 7);
        ctx.stroke();
      }
      ctx.restore();
      if (produit){
        ctx.fillStyle = "rgba(201,80,46,.16)";
        ctx.beginPath(); ctx.arc(cx, cy, 0.55+Math.abs(Math.sin(vue.temps*2))*0.12, 0, 7); ctx.fill();
      }
      break;
    }

    case "ensacheuse": {
      // colonne verticale : le film descend, le sachet tombe
      ctx.fillStyle = "#2e3238";
      coinsArrondis(x+0.18, y+0.34, l-0.36, h-0.62, 0.08); ctx.fill();
      ctx.fillStyle = "#454c56";
      ctx.fillRect(cx-0.28, y+0.42, 0.56, h-0.9);
      // bobine de film
      dessinerItem(x+0.55, y+0.72, 0.5, "film");
      if (produit){
        ctx.fillStyle = "rgba(196,158,240,.16)";
        coinsArrondis(x+0.18, y+0.34, l-0.36, h-0.62, 0.08); ctx.fill();
        for (let i=0;i<3;i++){
          const p = ((vue.temps*1.1 + i*0.34) % 1);
          dessinerItem(cx, y+0.7 + p*(h-1.15), 0.42, "sachet", 1-p*0.45);
        }
      }
      // mâchoire de soudure
      ctx.fillStyle = "#5a6270";
      ctx.fillRect(cx-0.34, y+h-0.62, 0.68, 0.12);
      break;
    }

    case "tri": {
      // plan de travail, deux bacs : ce qui passe, ce qu'on écarte
      ctx.fillStyle = "#cfd6dd";
      coinsArrondis(x+0.2, y+0.42, l-0.4, h-0.78, 0.05); ctx.fill();
      ctx.strokeStyle = "#8d959e"; ctx.lineWidth = 0.04;
      coinsArrondis(x+0.2, y+0.42, l-0.4, h-0.78, 0.05); ctx.stroke();
      // le tapis de tri défile
      if (produit){
        ctx.strokeStyle = "rgba(90,100,110,.5)"; ctx.lineWidth = 0.05;
        const d2 = (vue.temps*0.7) % 0.4;
        for (let i=-0.4; i<l; i+=0.4){
          const px = x+0.25+i+d2;
          if (px < x+0.24 || px > x+l-0.24) continue;
          ctx.beginPath(); ctx.moveTo(px, y+0.46); ctx.lineTo(px, y+h-0.4); ctx.stroke();
        }
      }
      // bac de rebut au bout
      ctx.fillStyle = "#4a4034";
      coinsArrondis(x+l-0.5, y+h-0.5, 0.36, 0.34, 0.04); ctx.fill();
      const r = m.entree["chips_ratees"] || m.entree["sachet_rate"] || 0;
      if (r > 0.5){
        const it = m.entree["chips_ratees"] ? "chips_ratees" : "sachet_rate";
        for (let i=0;i<3;i++)
          dessinerItem(x+0.55+bruit(i*7+m.id)*(l-1.3), y+0.62+bruit(i*3+m.id)*(h-1.1), 0.3, it);
      }
      break;
    }

    case "silo": {
      // cylindre vu du dessus, avec sa jauge de remplissage
      const cap = MACHINES.silo.capacite;
      const ray = Math.min(l,h)/2 - 0.2;
      ctx.fillStyle = "#6e7780";
      ctx.beginPath(); ctx.arc(cx, cy, ray, 0, 7); ctx.fill();
      ctx.strokeStyle = "#4a525a"; ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.arc(cx, cy, ray, 0, 7); ctx.stroke();
      const rempli = clamp(contenuTotal(m.sortie)/cap, 0, 1);
      if (rempli > 0.01){
        const it = m.filtre || Object.keys(m.sortie)[0];
        ctx.fillStyle = (ITEMS[it] && ITEMS[it].couleur) || "#c8b07a";
        ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.arc(cx, cy, (ray-0.08)*Math.sqrt(rempli), 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 0.05;
      for (let i=0;i<4;i++){
        const a2 = i/4*Math.PI*2 + 0.4;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(a2)*ray*0.45, cy+Math.sin(a2)*ray*0.45);
        ctx.lineTo(cx+Math.cos(a2)*ray*0.94, cy+Math.sin(a2)*ray*0.94);
        ctx.stroke();
      }
      break;
    }

    case "caisse_dediee":
    case "caisse": {
      ctx.fillStyle = m.type === "caisse_dediee" ? "#9a8752" : "#8a6b45";
      coinsArrondis(x+0.12, y+0.12, l-0.24, h-0.24, 0.05); ctx.fill();
      ctx.strokeStyle = "#5f4930"; ctx.lineWidth = 0.07;
      coinsArrondis(x+0.12, y+0.12, l-0.24, h-0.24, 0.05); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x+0.12,y+h/2); ctx.lineTo(x+l-0.12,y+h/2);
      ctx.moveTo(x+l/2,y+0.12); ctx.lineTo(x+l/2,y+h-0.12);
      ctx.stroke();
      if (m.type === "caisse_dediee" && m.filtre){
        // une étiquette : on voit d'un coup d'œil à quoi le bac est réservé
        ctx.fillStyle = (ITEMS[m.filtre] && ITEMS[m.filtre].couleur) || "#c8b07a";
        ctx.fillRect(x+0.3, y+0.22, l-0.6, 0.15);
      }
      const items = Object.keys(m.sortie).filter(k=>m.sortie[k]>0.5);
      if (items.length){
        const total = contenuTotal(m.sortie);
        const n = Math.min(6, Math.ceil(total/120));
        for (let i=0;i<n;i++)
          dessinerItem(x+0.4+bruit(i*5+m.id)*(l-0.8), y+0.4+bruit(i*11+m.id)*(h-0.8), 0.4, items[i%items.length]);
      }
      break;
    }
  }
}

/** Les pièces qui s'entassent devant une machine bloquée. */
function dessinerTasSortie(m){
  const d = MACHINES[m.type];
  if (d.stockage || vue.zoom <= CONFIG.seuilDetail) return;
  const items = Object.keys(m.sortie).filter(k => m.sortie[k] > 0.5);
  if (!items.length) return;
  const total = contenuTotal(m.sortie);
  const n = clamp(Math.round(total/2), 1, 9);
  for (let i=0;i<n;i++){
    const it = items[i % items.length];
    const bx = m.x + 0.3 + bruit(i*3+m.id*7)*(m.l-0.6);
    const by = m.y + m.h + 0.12 + bruit(i*9+m.id)*0.3;
    dessinerItem(bx, by, 0.42, it);
  }
}

/** Icônes flottantes d'état : le diagnostic à l'œil nu (§3.2). */
function dessinerEtatMachine(m){
  if (vue.zoom <= CONFIG.seuilSchema) return;
  const cx = m.x + m.l/2, hy = m.y - 0.34;
  const bat = 0.5 + 0.5*Math.sin(vue.temps*4.5);

  if (m.enPanne){
    ctx.save();
    ctx.globalAlpha = 0.55 + bat*0.45;
    dessinerAlerte(cx, hy, "clé", "#e0574a");
    ctx.restore();
    return;
  }
  if (m.arretRestant > 0){
    ctx.save(); ctx.globalAlpha = 0.5 + bat*0.4;
    dessinerAlerte(cx, hy, "goutte", "#d9b23c"); ctx.restore();
    return;
  }
  // Huile fatiguée : on prévient avant que la marchandise en pâtisse.
  if (MACHINES[m.type].bainHuile && etat.meta.age >= 3 && (m.fraicheurHuile ?? 1) < 0.35){
    ctx.save(); ctx.globalAlpha = 0.3 + bat*0.45;
    dessinerAlerte(cx, hy, "goutte", "#e8863c"); ctx.restore();
  }
  if (m.etat === "attente_matiere"){
    // liseré orange clignotant + la pièce qui manque
    ctx.save();
    ctx.globalAlpha = 0.3 + bat*0.55;
    ctx.strokeStyle = "#e8a03c"; ctx.lineWidth = 0.08;
    coinsArrondis(m.x+0.03, m.y+0.03, m.l-0.06, m.h-0.06, 0.14); ctx.stroke();
    ctx.restore();
    const r = recetteDe(m);
    if (r){
      const manquant = r.entrees.find(e => (m.entree[e.id]||0) < e.qte);
      if (manquant){
        const flot = Math.sin(vue.temps*2.4)*0.07;
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = "rgba(18,20,24,.8)";
        ctx.beginPath(); ctx.arc(cx, hy+flot, 0.32, 0, 7); ctx.fill();
        ctx.strokeStyle = "#e8a03c"; ctx.lineWidth = 0.045; ctx.stroke();
        dessinerItem(cx, hy+flot, 0.4, manquant.id);
        ctx.restore();
      }
    }
    return;
  }
  if (m.etat === "sortie_pleine"){
    ctx.save(); ctx.globalAlpha = 0.35 + bat*0.4;
    dessinerAlerte(cx, hy, "plein", "#e8a03c"); ctx.restore();
    return;
  }
  if (m.etat === "sans_operateur"){
    ctx.save(); ctx.globalAlpha = 0.35 + bat*0.35;
    dessinerAlerte(cx, hy, "personne", "#9aa2ac"); ctx.restore();
  }
}

function dessinerAlerte(x, y, sorte, couleur){
  ctx.save();
  ctx.fillStyle = "rgba(16,18,22,.85)";
  ctx.beginPath(); ctx.arc(x,y,0.3,0,7); ctx.fill();
  ctx.strokeStyle = couleur; ctx.lineWidth = 0.05; ctx.stroke();
  ctx.strokeStyle = couleur; ctx.fillStyle = couleur;
  ctx.lineWidth = 0.06; ctx.lineCap = "round";
  if (sorte === "clé"){
    ctx.beginPath(); ctx.arc(x-0.08,y-0.07,0.08,0.6,5.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-0.03,y-0.02); ctx.lineTo(x+0.11,y+0.12); ctx.stroke();
  } else if (sorte === "!"){
    ctx.beginPath(); ctx.moveTo(x,y-0.13); ctx.lineTo(x,y+0.04); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y+0.13,0.032,0,7); ctx.fill();
  } else if (sorte === "plein"){
    for (let i=0;i<3;i++) ctx.fillRect(x-0.13+i*0.1, y-0.02+i*0.03, 0.075, 0.075);
  } else if (sorte === "goutte"){
    ctx.beginPath();
    ctx.moveTo(x, y-0.15);
    ctx.quadraticCurveTo(x+0.12, y+0.02, x, y+0.12);
    ctx.quadraticCurveTo(x-0.12, y+0.02, x, y-0.15);
    ctx.closePath(); ctx.fill();
  } else if (sorte === "personne"){
    ctx.beginPath(); ctx.arc(x,y-0.09,0.06,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x,y-0.02); ctx.lineTo(x,y+0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-0.09,y+0.16); ctx.lineTo(x+0.09,y-0.16); ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================================
   RENDU (3/3) — ouvriers, particules, calques, boucle de dessin
   ========================================================================== */

/* -------------------------------------------------------------- Ouvriers */
function dessinerOuvrier(o){
  const marche = (o.etat === "deplace" || o.etat === "porte") && o.chemin && o.chemin.length;
  const bob = marche ? Math.sin(o.phase*0.55)*0.045 : 0;
  const x = o.x, y = o.y + bob;

  // ombre
  ctx.fillStyle = "rgba(0,0,0,.34)";
  ctx.beginPath(); ctx.ellipse(x, y+0.2, 0.2, 0.09, 0, 0, 7); ctx.fill();

  if (vue.zoom <= CONFIG.seuilDetail){
    ctx.fillStyle = "#dcc27a";
    ctx.beginPath(); ctx.arc(x, y, 0.16, 0, 7); ctx.fill();
    return;
  }

  // bras : croisés quand il attend, écartés quand il porte
  ctx.strokeStyle = "#3f6ba8"; ctx.lineWidth = 0.09; ctx.lineCap = "round";
  if (o.etat === "attend" || o.etat === "pause"){
    ctx.beginPath(); ctx.moveTo(x-0.14,y+0.02); ctx.lineTo(x+0.14,y+0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-0.14,y+0.06); ctx.lineTo(x+0.14,y+0.02); ctx.stroke();
  } else {
    const s = marche ? Math.sin(o.phase*0.55)*0.07 : 0;
    ctx.beginPath(); ctx.moveTo(x-0.15,y-0.02+s); ctx.lineTo(x-0.19,y+0.1+s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+0.15,y-0.02-s); ctx.lineTo(x+0.19,y+0.1-s); ctx.stroke();
  }

  // buste (bleu de travail)
  ctx.fillStyle = "#4a79b8";
  coinsArrondis(x-0.15, y-0.12, 0.3, 0.32, 0.09); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.fillRect(x-0.15, y+0.1, 0.3, 0.1);

  // tête + casque
  ctx.fillStyle = "#e0b98d";
  ctx.beginPath(); ctx.arc(x, y-0.13, 0.115, 0, 7); ctx.fill();
  ctx.fillStyle = "#e8c33c";
  ctx.beginPath(); ctx.arc(x, y-0.15, 0.12, Math.PI, 0); ctx.fill();
  ctx.fillRect(x-0.13, y-0.16, 0.26, 0.035);

  // ce qu'il porte
  if (o.charge){
    dessinerItem(x, y-0.42, 0.44, o.charge.item);
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.font = "0.16px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(mesure(o.charge.item, o.charge.qte), x, y-0.62);
  }

  // sueur quand il court partout (§3.2)
  if (o.fatigue > 0.65){
    const a = 0.4 + 0.6*Math.abs(Math.sin(vue.temps*3+o.id));
    ctx.fillStyle = "rgba(120,190,235," + a.toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(x+0.17, y-0.22, 0.045, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+0.17,y-0.3); ctx.lineTo(x+0.2,y-0.24); ctx.lineTo(x+0.14,y-0.24); ctx.closePath(); ctx.fill();
  }
  // petit z de pause
  if (o.etat === "pause"){
    ctx.fillStyle = "rgba(210,220,235,.8)";
    ctx.font = "0.24px Segoe UI, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("z", x+0.18, y-0.3 - (vue.temps*0.4 % 0.3));
  }
  // étincelles au poste de soudure : gérées par les particules
}

/* ------------------------------------------------------------ Particules */
function particule(x, y, sorte){
  if (vue.particules.length >= CONFIG.particulesMax) return;
  const p = { x, y, vx:0, vy:0, vie:1, max:1, sorte, taille:0.1, teinte:0 };
  switch (sorte){
    case "etincelle":
      p.vx = hasard(-1.6,1.6); p.vy = hasard(-1.8,0.4);
      p.max = p.vie = hasard(0.25,0.6); p.taille = hasard(0.02,0.05); break;
    case "fumeeGrise":
      p.vx = hasard(-0.15,0.15); p.vy = hasard(-0.5,-0.2);
      p.max = p.vie = hasard(0.9,1.7); p.taille = hasard(0.1,0.24); break;
    case "fumeeNoire":
      p.vx = hasard(-0.25,0.25); p.vy = hasard(-0.7,-0.3);
      p.max = p.vie = hasard(1.2,2.2); p.taille = hasard(0.14,0.3); break;
    case "vapeur":
      p.vx = hasard(-0.4,0.4); p.vy = hasard(-0.3,-0.05);
      p.max = p.vie = hasard(0.5,1.1); p.taille = hasard(0.12,0.26); break;
    case "poussiere":
      p.vx = hasard(-0.8,0.8); p.vy = hasard(-0.8,-0.1);
      p.max = p.vie = hasard(0.4,0.9); p.taille = hasard(0.05,0.13); break;
    case "goutte":
      p.vx = hasard(-1.1,1.1); p.vy = hasard(-1.5,-0.3);
      p.max = p.vie = hasard(0.3,0.6); p.taille = hasard(0.02,0.05); break;
    case "poudre":
      p.vx = hasard(-0.5,0.5); p.vy = hasard(-0.45,-0.1);
      p.max = p.vie = hasard(0.6,1.2); p.taille = hasard(0.04,0.1); break;
    case "souffle":
      p.vx = hasard(-1.4,1.4); p.vy = hasard(-0.3,0.3);
      p.max = p.vie = hasard(0.2,0.45); p.taille = hasard(0.08,0.18); break;
    case "eclat":
      p.vx = hasard(-1.2,1.2); p.vy = hasard(-1.4,-0.2);
      p.max = p.vie = hasard(0.3,0.7); p.taille = hasard(0.03,0.07); break;
  }
  vue.particules.push(p);
}

function majParticules(dts){
  const P = vue.particules;
  for (let i=P.length-1; i>=0; i--){
    const p = P[i];
    p.vie -= dts;
    if (p.vie <= 0){ P[i] = P[P.length-1]; P.pop(); continue; }
    p.x += p.vx*dts; p.y += p.vy*dts;
    if (p.sorte === "etincelle" || p.sorte === "eclat") p.vy += 3.4*dts;
    else p.vy -= 0.25*dts;
    p.vx *= (1 - 1.6*dts);
  }
  // textes qui montent
  const F = vue.flottants;
  for (let i=F.length-1; i>=0; i--){
    const f = F[i];
    f.vie -= dts;
    f.y -= dts*0.75;
    if (f.vie <= 0){ F[i] = F[F.length-1]; F.pop(); }
  }
}

function dessinerParticules(){
  for (const p of vue.particules){
    const a = clamp(p.vie/p.max, 0, 1);
    switch (p.sorte){
      case "etincelle":
        ctx.fillStyle = "rgba(255," + Math.round(200+55*a) + "," + Math.round(90*a) + "," + a.toFixed(2) + ")";
        ctx.fillRect(p.x, p.y, p.taille, p.taille); break;
      case "eclat":
        ctx.fillStyle = "rgba(220,230,240," + (a*0.8).toFixed(2) + ")";
        ctx.fillRect(p.x, p.y, p.taille, p.taille); break;
      case "fumeeNoire":
        ctx.fillStyle = "rgba(24,24,26," + (a*0.55).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
      case "fumeeGrise":
        ctx.fillStyle = "rgba(150,152,156," + (a*0.32).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
      case "vapeur":
        ctx.fillStyle = "rgba(232,236,240," + (a*0.26).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
      case "poussiere":
        ctx.fillStyle = "rgba(140,132,118," + (a*0.4).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille,0,7); ctx.fill(); break;
      case "goutte":
        ctx.fillStyle = "rgba(150,205,240," + (a*0.7).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille,0,7); ctx.fill(); break;
      case "poudre":
        ctx.fillStyle = "rgba(201,110,60," + (a*0.38).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(1.6-a),0,7); ctx.fill(); break;
      case "souffle":
        ctx.fillStyle = "rgba(220,225,235," + (a*0.22).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
    }
  }
}

function flottant(x, y, texte, couleur){
  if (vue.flottants.length > 24) vue.flottants.shift();
  vue.flottants.push({ x, y, texte, couleur, vie:1.8 });
}

function dessinerFlottants(){
  ecranSeul();
  ctx.textAlign = "center";
  for (const f of vue.flottants){
    const e = mondeVersEcran(f.x, f.y);
    const a = clamp(f.vie/1.8, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = "700 " + Math.round(13*Math.min(1.3, vue.zoom)) + "px Segoe UI, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillText(f.texte, e.x+1, e.y+1);
    ctx.fillStyle = f.couleur;
    ctx.fillText(f.texte, e.x, e.y);
  }
  ctx.globalAlpha = 1;
  appliquerCamera();
}

/** Effets déclenchés par la simulation, pas par le rendu. */
function effetProduction(m, r){
  const cx = m.x+m.l/2, cy = m.y+m.h/2;
  if (m.type === "friteuse")   for (let i=0;i<8;i++) particule(cx+hasard(-0.6,0.6), cy-0.1, "vapeur");
  if (m.type === "laveuse")    for (let i=0;i<5;i++) particule(cx+hasard(-0.3,0.3), cy, "goutte");
  if (m.type === "trancheuse") for (let i=0;i<4;i++) particule(cx+hasard(-0.2,0.2), cy, "eclat");
  if (m.type === "tambour")    for (let i=0;i<5;i++) particule(cx+hasard(-0.3,0.3), cy, "poudre");
  if (m.type === "ensacheuse") for (let i=0;i<3;i++) particule(cx, cy, "souffle");
  son(m.type);
  if (ITEMS[r.sortie.id].cat === "produit"){
    flottant(m.x+m.l/2, m.y-0.2, "+" + mesure(r.sortie.id, r.sortie.qte), "#8fe09c");
    son("valide");
  }
}

/** Fumée continue des machines fatiguées ou en panne. */
function fumeeMachines(dts){
  for (const m of U().machines){
    if (m.enPanne){
      if (Math.random() < dts*7) particule(m.x+m.l*0.7, m.y+0.3, "fumeeNoire");
    } else if (m.usure > 0.5 && m.etat === "produit"){
      if (Math.random() < dts*(m.usure-0.5)*7) particule(m.x+m.l*0.7, m.y+0.3, "fumeeGrise");
    }
  }
}

/* ------------------------------------------------- Aperçu de construction */
function dessinerApercu(){
  if (!vue.outil || !vue.souris.dedans) return;
  const u = U();
  const tx = vue.souris.tx, ty = vue.souris.ty;

  if (vue.outil.type === "machine"){
    const d = MACHINES[vue.outil.id];
    const tourne = vue.rotation % 2 === 1;
    const l = tourne ? d.h : d.l, h = tourne ? d.l : d.h;
    const ok = peutPoser(u, vue.outil.id, tx, ty, vue.rotation) && etat.finances.solde >= d.cout;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = ok ? "rgba(92,186,107,.45)" : "rgba(224,87,74,.45)";
    ctx.fillRect(tx,ty,l,h);
    ctx.strokeStyle = ok ? "#5cba6b" : "#e0574a";
    ctx.lineWidth = 0.07;
    ctx.strokeRect(tx,ty,l,h);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = d.couleur;
    ctx.fillRect(tx+0.14, ty+0.14, l-0.28, 0.16);
    ctx.restore();
    // Quand ça ne passe pas, on dit pourquoi, au bout du curseur.
    if (!ok){
      const txt = etat.finances.solde < d.cout ? "La caisse ne suit pas."
                                               : refusPose(u, vue.outil.id, tx, ty, vue.rotation);
      const e = mondeVersEcran(tx + l/2, ty - 0.3);
      ecranSeul();
      ctx.font = "600 12px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      const w = ctx.measureText(txt).width;
      ctx.fillStyle = "rgba(18,20,24,.9)";
      ctx.fillRect(e.x-w/2-7, e.y-14, w+14, 20);
      ctx.fillStyle = "#f0a094";
      ctx.fillText(txt, e.x, e.y);
      ctx.textAlign = "left";
      appliquerCamera();
    }
  }
  else if (vue.outil.type === "convoyeur"){
    const trace = vue.traceConvoyeur;
    if (trace && trace.length >= 1){
      // La bande fantôme, dessinée comme la vraie : on voit tout de suite le
      // trajet qu'elle prendra pour contourner ce qui encombre.
      const bon = trace.every(t => occupant(u,t.x,t.y) === 0);
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(trace[0].x+0.5, trace[0].y+0.5);
      for (let i=1;i<trace.length;i++) ctx.lineTo(trace[i].x+0.5, trace[i].y+0.5);
      ctx.strokeStyle = bon ? "rgba(92,186,107,.30)" : "rgba(224,87,74,.32)";
      ctx.lineWidth = 0.82; ctx.stroke();
      ctx.strokeStyle = bon ? "#5cba6b" : "#e0574a";
      ctx.lineWidth = 0.1; ctx.setLineDash([0.3,0.22]);
      ctx.lineDashOffset = -vue.temps*1.6;
      ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;

      // Les deux ancrages
      for (const [p, n] of [[trace[0], vue.convDepart], [trace[trace.length-1], vue.convArrivee]]){
        ctx.fillStyle = (n && n.noeud) ? "rgba(92,186,107,.9)" : "rgba(240,180,41,.85)";
        ctx.beginPath(); ctx.arc(p.x+0.5, p.y+0.5, 0.17, 0, 7); ctx.fill();
      }

      // Ce que ça coûtera, au bout du curseur
      const e = mondeVersEcran(trace[trace.length-1].x+0.5, trace[trace.length-1].y-0.35);
      ecranSeul();
      ctx.font = "600 12px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      const txt = trace.length + " tuiles · " + euros(trace.length*CONV.coutParTuile);
      const w = ctx.measureText(txt).width;
      ctx.fillStyle = "rgba(18,20,24,.88)";
      ctx.fillRect(e.x-w/2-7, e.y-14, w+14, 20);
      ctx.fillStyle = bon ? "#8fe09c" : "#f0a094";
      ctx.fillText(txt, e.x, e.y);
      ctx.textAlign = "left";
      appliquerCamera();
    } else {
      const libre = dansAtelier(u,tx,ty) && occupant(u,tx,ty) === 0;
      const surNoeud = !!noeudSous(tx,ty);
      ctx.fillStyle = (libre || surNoeud) ? "rgba(92,186,107,.35)" : "rgba(224,87,74,.35)";
      ctx.fillRect(tx,ty,1,1);
      if (!vue.convDepart && surNoeud){
        ctx.strokeStyle = "rgba(92,186,107,.8)"; ctx.lineWidth = 0.07;
        ctx.strokeRect(tx+0.06, ty+0.06, 0.88, 0.88);
      }
    }
  }
  else if (vue.outil.type === "pioche"){
    const o = occupant(u,tx,ty);
    if (o > 1){
      const n = noeudParId(o);
      ctx.fillStyle = "rgba(224,87,74,.3)";
      if (n && n.type === "convoyeur") for (const t of n.chemin) ctx.fillRect(t.x,t.y,1,1);
      else if (n) ctx.fillRect(n.x,n.y,n.l,n.h);
    }
  }
}

/* ---------------------------------------------------- Sélection et survol */
function dessinerSelection(){
  const n = vue.selection ? noeudParId(vue.selection) : null;
  if (n && n.type !== "convoyeur"){
    ctx.strokeStyle = "#f0b429"; ctx.lineWidth = 0.075;
    ctx.setLineDash([0.3,0.18]);
    ctx.lineDashOffset = -vue.temps*1.2;
    ctx.strokeRect(n.x-0.08, n.y-0.08, n.l+0.16, n.h+0.16);
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  } else if (n && n.type === "convoyeur"){
    ctx.strokeStyle = "#f0b429"; ctx.lineWidth = 0.1;
    const ps = cheminRendu(n);
    ctx.beginPath();
    ctx.moveTo(ps[0].x, ps[0].y);
    for (let i=1;i<ps.length;i++) ctx.lineTo(ps[i].x, ps[i].y);
    ctx.stroke();
  }
  const s = vue.survol;
  if (s && s.id !== vue.selection && s.type !== "convoyeur"){
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 0.05;
    ctx.strokeRect(s.x-0.05, s.y-0.05, s.l+0.1, s.h+0.1);
  }
}

/* ------------------------------------------------------- Lumière du jour */
function dessinerLumiere(){
  const t = minuteDuJour() / CONFIG.minutesParJour;
  // matin chaud, journée neutre, fin d'après-midi bleutée
  // Une lumière, pas un voile : au-delà, le béton vire au beige et on ne
  // distingue plus rien sur les grands ateliers.
  let r,g,b,a;
  if (t < 0.25){ const k = t/0.25; r=255;g=196;b=132; a=0.12*(1-k); }
  else if (t > 0.74){ const k=(t-0.74)/0.26; r=70;g=95;b=160; a=0.18*k; }
  else { r=255;g=255;b=255; a=0; }

  ecranSeul();
  if (a > 0.005){
    ctx.globalCompositeOperation = "overlay";
    ctx.fillStyle = "rgba("+r+","+g+","+b+","+a.toFixed(3)+")";
    ctx.fillRect(0,0,largeurVue,hauteurVue);
    ctx.globalCompositeOperation = "source-over";
  }
  // vignette (dégradé mis en cache au redimensionnement)
  if (gradVignette){
    ctx.fillStyle = gradVignette;
    ctx.fillRect(0,0,largeurVue,hauteurVue);
  }
  appliquerCamera();
}

/** Halos chauds des lampes d'atelier. */
function dessinerLampes(){
  const u = U();
  const t = minuteDuJour()/CONFIG.minutesParJour;
  // Les halos s'additionnent : sur un grand atelier il y en a des dizaines,
  // et il ne faut pas que la somme délave le sol.
  const force = clamp((t-0.65)/0.35, 0, 1)*0.4 + 0.08;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.13*force;
  for (let y=3; y<u.hauteur; y+=6)
    for (let x=3; x<u.largeur; x+=6)
      ctx.drawImage(spriteHalo, x-3.6, y-3.6, 7.2, 7.2);
  ctx.restore();
}

/* ------------------------------------------------------- Vue schématique */
function dessinerSchema(){
  const u = U(), co = profondeurCour(u);
  ctx.fillStyle = "#1a1d21";
  ctx.fillRect(-co,-co,u.largeur+2*co,u.hauteur+2*co);
  ctx.fillStyle = "#22262c";
  ctx.fillRect(0,0,u.largeur,u.hauteur);
  ctx.strokeStyle = "rgba(255,255,255,.06)"; ctx.lineWidth = 0.04;
  ctx.strokeRect(0,0,u.largeur,u.hauteur);

  // flux : épaisseur proportionnelle au débit
  for (const c of u.convoyeurs){
    const e = clamp(0.12 + c.debitActuel/60, 0.12, 0.7);
    ctx.strokeStyle = c.etat === "non_relie" ? "#7a4038" : "rgba(240,180,41,.7)";
    ctx.lineWidth = e; ctx.lineCap = "round"; ctx.lineJoin = "round";
    const pr = cheminRendu(c);
    ctx.beginPath();
    ctx.moveTo(pr[0].x, pr[0].y);
    for (let i=1;i<pr.length;i++) ctx.lineTo(pr[i].x, pr[i].y);
    ctx.stroke();
  }
  // machines en blocs colorés
  for (const m of u.machines){
    const d = MACHINES[m.type];
    ctx.fillStyle = d.couleur;
    ctx.globalAlpha = m.etat === "produit" ? 1 : 0.45;
    ctx.fillRect(m.x+0.1, m.y+0.1, m.l-0.2, m.h-0.2);
    ctx.globalAlpha = 1;
    if (m.enPanne || m.etat === "attente_matiere"){
      ctx.strokeStyle = m.enPanne ? "#e0574a" : "#e8a03c";
      ctx.lineWidth = 0.12;
      ctx.strokeRect(m.x+0.1, m.y+0.1, m.l-0.2, m.h-0.2);
    }
  }
  ctx.fillStyle = "#e2b62c";
  ctx.fillRect(u.quaiEntree.x+0.1, u.quaiEntree.y+0.1, u.quaiEntree.l-0.2, u.quaiEntree.h-0.2);
  ctx.fillStyle = "#5cba6b";
  ctx.fillRect(u.quaiSortie.x+0.1, u.quaiSortie.y+0.1, u.quaiSortie.l-0.2, u.quaiSortie.h-0.2);
}

/* ============================================================ Boucle dessin */
function dessiner(){
  if (!etat) return;
  const u = U();

  if (vue.zoom < CONFIG.seuilSchema){
    ecranSeul();
    ctx.fillStyle = "#101215"; ctx.fillRect(0,0,largeurVue,hauteurVue);
    appliquerCamera();
    dessinerSchema();
    dessinerApercu();
    dessinerSelection();
    dessinerFlottants();
    return;
  }

  dessinerSol();
  dessinerLampes();
  dessinerQuais();

  for (const c of u.convoyeurs) dessinerConvoyeur(c);
  dessinerPonts();                    // les passerelles, par-dessus tout le reste

  // les machines les plus basses passent devant : tri par y
  const ms = u.machines;
  for (let i=1;i<ms.length;i++){                     // tri par insertion, tableaux courts
    const m = ms[i]; let j = i-1;
    while (j>=0 && ms[j].y > m.y){ ms[j+1] = ms[j]; j--; }
    ms[j+1] = m;
  }
  for (const m of ms) dessinerMachine(m);

  for (const o of u.ouvriers) dessinerOuvrier(o);

  dessinerParticules();
  dessinerApercu();
  dessinerSelection();
  dessinerLumiere();
  dessinerFlottants();
}

/* --------------------------------------------------------------- Bandeau */
function majBandeau(){
  if (!etat) return;
  const s = etat.finances.solde;
  const vA = $("#indArgent .val");
  vA.textContent = mode().argentInfini ? "illimité" : euros(s);
  vA.className = "val " + (s < 0 ? "neg" : (s > CONFIG.argentDepart ? "pos" : ""));
  $("#indDate .val").textContent = texteDate();

  // Commande en cours : la plus urgente
  const acc = etat.contrats.acceptes.slice().sort((a,b)=>a.dateLimite-b.dateLimite)[0];
  $("#indCommande .val").textContent = acc
    ? mesure(acc.produitId, Math.max(0, acc.quantite-acc.livre)) + " " + nomItem(acc.produitId, 2, true, true) + " · " + resteJours(acc)
    : "aucune";

  // Le bandeau grandit avec le joueur (§3.3)
  const age = etat.meta.age;
  basculer("#indStock", age >= 2);
  basculer("#indReput", age >= 2);
  basculer("#indPerso", age >= 2);
  const labo = document.querySelector('#onglets button[data-o="labo"]');
  if (labo) labo.classList.toggle("hidden", !(age >= 4 || mode().toutDebloque));
  if (age >= 2){
    const u = U();
    // On montre le produit fini le plus abondant, avec sa vraie unité.
    const S = u.stocksSortie;
    const finis = Object.keys(S).filter(k => ITEMS[k] && ITEMS[k].cat === "produit" && S[k] >= 1)
                        .sort((a,b) => S[b]-S[a]);
    $("#indStock .val").textContent = finis.length
      ? quantiteItem(finis[0], S[finis[0]], true) : "rien de prêt";
    $("#indReput .val").textContent = Math.round(etat.reputation) + " / 100";
    $("#indPerso .val").textContent = u.ouvriers.length + " " + pluriel(u.ouvriers.length,"personne");
  }
  $$("#vitesses button").forEach(b => b.classList.toggle("actif", +b.dataset.v === etat.meta.vitesse));
}
function basculer(sel, montrer){ $(sel).classList.toggle("hidden", !montrer); }

function resteJours(c){
  const r = c.dateLimite - jourCourant();
  if (r < 0) return "en retard";
  if (r === 0) return "aujourd'hui";
  return "dans " + r + " " + pluriel(r,"jour");
}

/* --------------------------------------- Cadence et rendement (en direct)
   Le §3.1 proscrit les quantités par seconde à l'écran ; c'est une demande
   expresse du joueur, qui veut lire la cadence instantanée de sa ligne comme
   sur un vrai tableau de bord d'atelier. Le bandeau se coupe d'une touche. */

/** Le produit fini dominant : celui dont il est sorti le plus depuis le début. */
function produitDominant(){
  const p = etat.progression.produits;
  let best = null, bq = 0;
  for (const k in p){
    if (!ITEMS[k] || ITEMS[k].cat !== "produit" || k === "rebut") continue;
    if (p[k] > bq){ bq = p[k]; best = k; }
  }
  return best;
}

function majCadence(dts){
  const c = vue.cadence || (vue.cadence = { item:null, cumul:0, valeur:0 });
  const id = produitDominant();
  const hud = $("#cadenceHud");
  if (!id){ hud.classList.add("hidden"); return; }
  hud.classList.remove("hidden");

  const cumul = etat.progression.produits[id] || 0;
  if (c.item !== id){ c.item = id; c.cumul = cumul; c.valeur = 0; }
  const taux = dts > 0 ? (cumul - c.cumul) / dts : 0;    // par seconde réelle
  c.cumul = cumul;
  c.valeur = lerp(c.valeur, taux, 0.35);                  // lissage, sinon ça saute

  const e = $("#chDebit");
  const v = c.valeur;
  e.textContent = (ITEMS[id].unite === "kg"
      ? nb(v, v < 10 ? 1 : 0) + " kg/s"
      : nb(Math.round(v)) + " " + nomItem(id, 2, true, true) + "/s");
  e.className = "chVal " + (v > 0.05 ? "bon" : "faible");

  const r = rendementMatiere();
  const er = $("#chRend");
  if (r){
    er.textContent = "1 kg pour " + nb(r, 1) + " kg de patates";
    er.className = "chVal " + (r <= 5.4 ? "bon" : "");
  } else {
    er.textContent = "—"; er.className = "chVal faible";
  }
}

/** Combien de kilos de pommes de terre pour un kilo de chips vendables,
 *  réellement obtenus sur les deux dernières semaines. Le rebut le dégrade. */
function rendementMatiere(){
  const h = etat.stats.historiqueSemaines;
  const sem = h.slice(-4).concat([etat.stats.semaineCourante]);
  let lavees = 0, chips = 0;
  for (const s of sem){
    lavees += (s.produits && s.produits.pdt_lavees) || 0;
    chips  += (s.produits && s.produits.chips_vrac) || 0;
  }
  if (chips < 1 || lavees < 1) return null;
  const rl = RECETTES.laver;                       // 30 kg brutes → 25 kg lavées
  const brutes = lavees / rl.sortie.qte * rl.entrees[0].qte;
  return brutes / chips;
}
