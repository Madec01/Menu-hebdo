    ctx.fillRect(0,0,largeurVue,hauteurVue);
    ctx.globalCompositeOperation = "source-over";
  }
  // vignette (dégradé mis en cache au redimensionnement)
  if (gradVignette){
    ctx.fillStyle = gradVignette;
    ctx.fillRect(0,0,largeurVue,hauteurVue);
  }
  appliquerCamera();
}

/** Halos chauds des lampes d'atelier. */
function dessinerLampes(){
  const u = U();
  const t = minuteDuJour()/CONFIG.minutesParJour;
  // Les halos s'additionnent : sur un grand atelier il y en a des dizaines,
  // et il ne faut pas que la somme délave le sol.
  const force = clamp((t-0.65)/0.35, 0, 1)*0.4 + 0.08;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.13*force;
  for (let y=3; y<u.hauteur; y+=6)
    for (let x=3; x<u.largeur; x+=6)
      ctx.drawImage(spriteHalo, x-3.6, y-3.6, 7.2, 7.2);
  ctx.restore();
}

/* ------------------------------------------------------- Vue schématique */
function dessinerSchema(){
  const u = U();
  ctx.fillStyle = "#22262c";
  ctx.fillRect(0,0,u.largeur,u.hauteur);
  ctx.strokeStyle = "rgba(255,255,255,.06)"; ctx.lineWidth = 0.04;
  ctx.strokeRect(0,0,u.largeur,u.hauteur);

  // flux : épaisseur proportionnelle au débit
  for (const c of u.convoyeurs){
    const e = clamp(0.12 + c.debitActuel/60, 0.12, 0.7);
    ctx.strokeStyle = c.etat === "non_relie" ? "#7a4038" : "rgba(240,180,41,.7)";
    ctx.lineWidth = e; ctx.lineCap = "round"; ctx.lineJoin = "round";
    const pr = cheminRendu(c);
    ctx.beginPath();
    ctx.moveTo(pr[0].x, pr[0].y);
    for (let i=1;i<pr.length;i++) ctx.lineTo(pr[i].x, pr[i].y);
    ctx.stroke();
  }
  // machines en blocs colorés
  for (const m of u.machines){
    const d = MACHINES[m.type];
    ctx.fillStyle = d.couleur;
    ctx.globalAlpha = m.etat === "produit" ? 1 : 0.45;
    ctx.fillRect(m.x+0.1, m.y+0.1, m.l-0.2, m.h-0.2);
    ctx.globalAlpha = 1;
    if (m.enPanne || m.etat === "attente_matiere"){
      ctx.strokeStyle = m.enPanne ? "#e0574a" : "#e8a03c";
      ctx.lineWidth = 0.12;
      ctx.strokeRect(m.x+0.1, m.y+0.1, m.l-0.2, m.h-0.2);
    }
  }
  ctx.fillStyle = "#e2b62c";
  ctx.fillRect(u.quaiEntree.x+0.1, u.quaiEntree.y+0.1, u.quaiEntree.l-0.2, u.quaiEntree.h-0.2);
  ctx.fillStyle = "#5cba6b";
  ctx.fillRect(u.quaiSortie.x+0.1, u.quaiSortie.y+0.1, u.quaiSortie.l-0.2, u.quaiSortie.h-0.2);
}

/* ============================================================ Boucle dessin */
function dessiner(){
  if (!etat) return;
  const u = U();

  if (vue.zoom < CONFIG.seuilSchema){
    ecranSeul();
    ctx.fillStyle = "#101215"; ctx.fillRect(0,0,largeurVue,hauteurVue);
    appliquerCamera();
    dessinerSchema();
    dessinerApercu();
    dessinerSelection();
    dessinerFlottants();
    return;
  }

  dessinerSol();
  dessinerLampes();
  dessinerQuais();

  for (const c of u.convoyeurs) dessinerConvoyeur(c);

  // les machines les plus basses passent devant : tri par y
  const ms = u.machines;
  for (let i=1;i<ms.length;i++){                     // tri par insertion, tableaux courts
    const m = ms[i]; let j = i-1;
    while (j>=0 && ms[j].y > m.y){ ms[j+1] = ms[j]; j--; }
    ms[j+1] = m;
  }
  for (const m of ms) dessinerMachine(m);

  for (const o of u.ouvriers) dessinerOuvrier(o);

  dessinerParticules();
  dessinerApercu();
  dessinerSelection();
  dessinerLumiere();
  dessinerFlottants();
}

/* ============================================================================
   UI (1/3) — bandeau, notifications, contremaître, construction, souris
   ========================================================================== */

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* --------------------------------------------------------------- Bandeau */
function majBandeau(){
  if (!etat) return;
  const s = etat.finances.solde;
  const vA = $("#indArgent .val");
  vA.textContent = mode().argentInfini ? "illimité" : euros(s);
  vA.className = "val " + (s < 0 ? "neg" : (s > CONFIG.argentDepart ? "pos" : ""));
  $("#indDate .val").textContent = texteDate();

  // Commande en cours : la plus urgente
  const acc = etat.contrats.acceptes.slice().sort((a,b)=>a.dateLimite-b.dateLimite)[0];
  $("#indCommande .val").textContent = acc
    ? mesure(acc.produitId, Math.max(0, acc.quantite-acc.livre)) + " " + nomItem(acc.produitId, 2, true, true) + " · " + resteJours(acc)
    : "aucune";

  // Le bandeau grandit avec le joueur (§3.3)
  const age = etat.meta.age;
  basculer("#indStock", age >= 2);
  basculer("#indReput", age >= 2);
  basculer("#indPerso", age >= 2);
  $("#btRech").classList.toggle("hidden", !(age >= 4 || mode().toutDebloque));
  if (age >= 2){
    const u = U();
    // On montre le produit fini le plus abondant, avec sa vraie unité.
    const S = u.stocksSortie;
    const finis = Object.keys(S).filter(k => ITEMS[k] && ITEMS[k].cat === "produit" && S[k] >= 1)
                        .sort((a,b) => S[b]-S[a]);
    $("#indStock .val").textContent = finis.length
      ? quantiteItem(finis[0], S[finis[0]], true) : "rien de prêt";
    $("#indReput .val").textContent = Math.round(etat.reputation) + " / 100";
    $("#indPerso .val").textContent = u.ouvriers.length + " " + pluriel(u.ouvriers.length,"personne");
  }
  $$("#vitesses button").forEach(b => b.classList.toggle("actif", +b.dataset.v === etat.meta.vitesse));
}
function basculer(sel, montrer){ $(sel).classList.toggle("hidden", !montrer); }

function resteJours(c){
  const r = c.dateLimite - jourCourant();
  if (r < 0) return "en retard";
  if (r === 0) return "aujourd'hui";
  return "dans " + r + " " + pluriel(r,"jour");
}

/* --------------------------------------- Cadence et rendement (en direct)
   Le §3.1 proscrit les quantités par seconde à l'écran ; c'est une demande
   expresse du joueur, qui veut lire la cadence instantanée de sa ligne comme
   sur un vrai tableau de bord d'atelier. Le bandeau se coupe d'une touche. */

/** Le produit fini dominant : celui dont il est sorti le plus depuis le début. */
function produitDominant(){
  const p = etat.progression.produits;
  let best = null, bq = 0;
  for (const k in p){
    if (!ITEMS[k] || ITEMS[k].cat !== "produit" || k === "rebut") continue;
    if (p[k] > bq){ bq = p[k]; best = k; }
  }
  return best;
}

function majCadence(dts){
  const c = vue.cadence || (vue.cadence = { item:null, cumul:0, valeur:0 });
  const id = produitDominant();
  const hud = $("#cadenceHud");
  if (!id){ hud.classList.add("hidden"); return; }
  hud.classList.remove("hidden");

  const cumul = etat.progression.produits[id] || 0;
  if (c.item !== id){ c.item = id; c.cumul = cumul; c.valeur = 0; }
  const taux = dts > 0 ? (cumul - c.cumul) / dts : 0;    // par seconde réelle
  c.cumul = cumul;
  c.valeur = lerp(c.valeur, taux, 0.35);                  // lissage, sinon ça saute

  const e = $("#chDebit");
  const v = c.valeur;
  e.textContent = (ITEMS[id].unite === "kg"
      ? nb(v, v < 10 ? 1 : 0) + " kg/s"
      : nb(Math.round(v)) + " " + nomItem(id, 2, true, true) + "/s");
  e.className = "chVal " + (v > 0.05 ? "bon" : "faible");

  const r = rendementMatiere();
  const er = $("#chRend");
  if (r){
    er.textContent = "1 kg pour " + nb(r, 1) + " kg de patates";
    er.className = "chVal " + (r <= 5.4 ? "bon" : "");
  } else {
    er.textContent = "—"; er.className = "chVal faible";
  }
}

/** Combien de kilos de pommes de terre pour un kilo de chips vendables,
 *  réellement obtenus sur les deux dernières semaines. Le rebut le dégrade. */
function rendementMatiere(){
  const h = etat.stats.historiqueSemaines;
  const sem = h.slice(-4).concat([etat.stats.semaineCourante]);
  let lavees = 0, chips = 0;
  for (const s of sem){
    lavees += (s.produits && s.produits.pdt_lavees) || 0;
    chips  += (s.produits && s.produits.chips_vrac) || 0;
  }
  if (chips < 1 || lavees < 1) return null;
  const rl = RECETTES.laver;                       // 30 kg brutes → 25 kg lavées
  const brutes = lavees / rl.sortie.qte * rl.entrees[0].qte;
  return brutes / chips;
}

/** Le diagnostic à la demande : le contremaître lit l'usine pour le joueur. */
function conseil(){
  const u = U();
  const c = [];

  if (!u.machines.length) return parle("On n'a rien posé. Une laveuse, une trancheuse, une friteuse — dans cet ordre.");

  const enPanne = u.machines.find(m => m.enPanne);
  if (enPanne) return parle(MACHINES[enPanne.type].nom + " est en panne. Cliquez dessus, je m'en occupe tout de suite.");

  if (etat.finances.solde < 0)
    c.push("La caisse est dans le rouge. Vendez du stock ou allez voir une banque, mais faites quelque chose.");

  // Le poste qui bloque toute la chaîne
  const bloquees = u.machines.filter(m => m.etat === "attente_matiere");
  if (bloquees.length){
    const m = bloquees[0];
    const r = recetteDe(m);
    const manque = r.entrees.find(e => (m.entree[e.id]||0) < e.qte);
    if (manque){
      const fournisseur = u.machines.find(x => recetteDe(x)?.sortie.id === manque.id);
      if (fournisseur)
        c.push(MACHINES[m.type].nom + " attend des " + nomItem(manque.id, 2, true, true) + ". " +
               MACHINES[fournisseur.type].nom + " n'arrive pas à suivre — il en faudrait une deuxième.");
      else if (ITEMS[manque.id].achat)
        c.push("On n'a plus " + deDe(nomItem(manque.id,2,true,true)) + nomItem(manque.id, 2, true, true) + ". Faut en racheter, sinon " + MACHINES[m.type].nom + " tourne dans le vide.");
      else
        c.push(MACHINES[m.type].nom + " attend des " + nomItem(manque.id, 2, true, true) + ", et personne n'en fait.");
    }
  }

  const pleines = u.machines.filter(m => m.etat === "sortie_pleine");
  if (pleines.length) c.push("Ça s'entasse devant " + MACHINES[pleines[0].type].nom + ". L'aval ne consomme pas assez.");

  const sansOp = u.machines.filter(m => m.etat === "sans_operateur");
  if (sansOp.length && u.ouvriers.length < 4)
    c.push("Il n'y a personne sur " + MACHINES[sansOp[0].type].nom + ". À un seul, on court partout — embauchez.");

  const usees = u.machines.filter(m => m.usure > 0.65);
  if (usees.length) c.push(MACHINES[usees[0].type].nom + " grince sérieusement. Une révision avant qu'elle casse ?");

  if (etat.meta.age >= 3){
    const huileMorte = u.machines.filter(m => MACHINES[m.type].bainHuile && (m.fraicheurHuile ?? 1) < 0.35);
    if (huileMorte.length)
      c.push("L'huile de " + MACHINES[huileMorte[0].type].nom.toLowerCase() + " est brune. Tant qu'on ne la change pas, on jette la moitié de ce qu'on cuit.");
    const rate = Object.keys(u.stocks).filter(k => ITEMS[k].cat === "rebut" && u.stocks[k] > 20);
    if (rate.length && !u.machines.some(m => m.type === "tri"))
      c.push("Il y a " + quantiteItem(rate[0], u.stocks[rate[0]], true) + " au quai. Sans table de tri, ça part chez le client.");
  }

  if (u.salete > 0.55)
    c.push("L'atelier est sale, et ça se paie deux fois : sur le moral et sur ce qui sort des machines.");

  const moralBas = u.ouvriers.filter(o => o.moral < 0.35);
  if (moralBas.length) c.push("L'équipe fait la tête. " + moralBas[0].prenom + " parle de partir.");

  if (!etat.contrats.acceptes.length && etat.meta.age >= 1)
    c.push("On n'a aucune commande en cours. Vendredi soir, prenez-en une.");

  if (!c.length){
    const p = progressionObjectif();
    c.push("Ça tourne bien. " + p.texte + " : on en est à " + Math.floor(p.part*100) + " %.");
  }
  parle(c.slice(0,2).join(" "), 13000);
}

/* ------------------------------------------------- Barre de construction */
function majBarreConstruction(){
  const b = $("#barreBasse");
  b.innerHTML = "";
  const cats = [
    { id:"machines", nom:"Machines" },
    { id:"convoyeurs", nom:"Convoyeurs" },
    { id:"stockage", nom:"Stockage" },
    { id:"outils", nom:"Outils" }
  ];
  for (const cat of cats){
    const outils = [];
    if (cat.id === "convoyeurs"){
      outils.push({ type:"convoyeur", id:"convoyeur", nom:"Convoyeur", prix:CONV.coutParTuile+" €/tuile",
                    couleur:"#41474e", verrou:!debloque("convoyeur") });
    } else if (cat.id === "outils"){
      outils.push({ type:"pioche", id:"pioche", nom:"Démolir", prix:"+60 %", couleur:"#e0574a", verrou:false });
    } else {
      for (const k in MACHINES){
        const d = MACHINES[k];
        if (d.cat !== cat.id) continue;
        outils.push({ type:"machine", id:k, nom:d.nom,
                      prix: mode().constructionGratuite ? "gratuit" : nb(d.cout)+" €",
                      couleur:d.couleur,
                      verrou: !machineDisponible(k),
                      cher: !mode().constructionGratuite && !mode().argentInfini && etat.finances.solde < d.cout });
      }
    }
    if (!outils.length) continue;
    const bloc = document.createElement("div");
    bloc.className = "catBloc";
    bloc.innerHTML = '<div class="catTitre">'+cat.nom+'</div><div class="catOutils"></div>';
    const zone = bloc.querySelector(".catOutils");
    for (const o of outils){
      const bt = document.createElement("button");
      bt.className = "outil" + (o.verrou?" verrou":"") + (o.cher?" cher":"");
      bt.innerHTML = '<span class="glyphe"></span><span class="nom"></span><span class="prix"></span>';
      bt.querySelector(".glyphe").style.background =
        "linear-gradient(180deg,"+o.couleur+",rgba(0,0,0,.45))";
      bt.querySelector(".nom").textContent = o.nom;
      bt.querySelector(".prix").textContent = o.prix;

      if (o.verrou) bt.title = "Débloqué plus tard";

    }

  }
  majOutilActif();
}

/* ------------------------------------------------------------ Infobulle */
function majInfobulle(){
  const ib = $("#infobulle");
  const n = vue.survol;
  if (!n || vue.outil){ ib.style.display = "none"; return; }

  let t = "", d = "", e = "";
  if (estQuai(n)){
    const S = U().stocksSortie;
    t = estQuaiSortie(n) ? "Quai de sortie" : "Quai d'entrée";
    d = estQuaiSortie(n) ? "C'est d'ici que part la marchandise vendue."
                         : "C'est ici qu'arrivent les pommes de terre et le reste.";
    if (estQuaiSortie(n)){
      const finis = Object.keys(S).filter(k=>ITEMS[k] && ITEMS[k].cat==="produit" && S[k]>=1)
                          .sort((a,b)=>S[b]-S[a]);
      e = finis.length ? quantiteItem(finis[0], S[finis[0]], true) + " prêts à partir" : "rien de prêt à partir";
    } else {
      const m = Object.keys(U().stocks).filter(k=>ITEMS[k] && U().stocks[k]>=1)
                      .sort((a,b)=>U().stocks[b]-U().stocks[a]);
      e = m.length ? quantiteItem(m[0], U().stocks[m[0]], true) + " en réserve" : "vide";
    }
  } else if (n.type === "convoyeur"){
    t = "Convoyeur";
    d = n.chemin.length + " tuiles";
    e = n.etat === "non_relie" ? "Ne relie rien : il manque une machine à un bout."
      : (n.debitActuel > 0.5 ? "Il passe " + Math.round(n.debitActuel) + " par jour" : "Rien ne passe pour le moment");
  } else {
    const def = MACHINES[n.type];
    t = def.nom;
    const r = recetteDe(n);
    d = def.stockage ? "Contient " + Math.round(contenuTotal(n.sortie)) + " unités"
                     : (r ? r.nom + " · " + mesure(r.sortie.id, n.debitReel) + " par jour" : "Rien de programmé");
    e = phraseEtat(n);
  }
  ib.innerHTML = '<div class="t"></div><div class="d"></div><div class="e"></div>';

  ib.querySelector(".d").textContent = d;
  ib.querySelector(".e").textContent = e;

  const r = $("#cadreVue").getBoundingClientRect();
  let x = vue.souris.x + 16, y = vue.souris.y + 16;
  if (x + 260 > r.width) x = vue.souris.x - 268;
  if (y + 90 > r.height) y = vue.souris.y - 96;

}

function phraseEtat(m){
  if (m.enPanne) return "En panne — cliquez pour la réparer";
  if (m.arretRestant > 0) return "Arrêtée pour la vidange";
  if (MACHINES[m.type].stockage) return "";
  switch (m.etat){
    case "produit":
      // Une machine qui tourne en gâchant la moitié de sa production ne
      // « tourne pas bien » : on le dit.
      if (m.tauxRebut > 0.12) return "Tourne, mais " + motRebut(m.tauxRebut);
      if (m.usure > 0.6) return "Tourne, mais elle fatigue";
      return "Tourne bien";
    case "attente_matiere": {
      const r = recetteDe(m);
      const e = r && r.entrees.find(x => (m.entree[x.id]||0) < x.qte);
      return e ? "Attend des " + nomItem(e.id, 2, true, true) : "Attend de la matière";
    }
    case "sortie_pleine": return "Bloquée : ça s'entasse devant";
    case "sans_operateur": return "Personne dessus";
    default: return "À l'arrêt";
  }
}

/* --------------------------------------------------------------- Souris */
function noeudSous(x, y){
  const u = U();
  const o = occupant(u, x, y);
  if (o === 0 || o === -1) return null;
  if (o === 1) return noeudQuai(u);
  return noeudParId(o);
}

function initSouris(){
  const c = $("#vue");

  c.addEventListener("mousemove", ev => {
    const r = c.getBoundingClientRect();
    vue.souris.x = ev.clientX - r.left;
    vue.souris.y = ev.clientY - r.top;
    vue.souris.dedans = true;
    const m = ecranVersMonde(vue.souris.x, vue.souris.y);
    vue.souris.tx = Math.floor(m.x); vue.souris.ty = Math.floor(m.y);

    if (vue.glisse && vue.glisse.type === "cam"){
      const t = T();
      vue.camX = vue.glisse.camX - (vue.souris.x - vue.glisse.x)/t;
      vue.camY = vue.glisse.camY - (vue.souris.y - vue.glisse.y)/t;
      vue.glisse.bouge = true;
      return;
    }
    if (vue.convDepart){
      majApercuConvoyeur(vue.souris.tx, vue.souris.ty);
      return;
    }
    if (vue.glisse && vue.glisse.type === "poseSerie" && vue.outil?.type === "machine"){
      // maintien du clic : pose en série
      poserMachine(vue.outil.id, vue.souris.tx, vue.souris.ty, vue.rotation);
      return;
    }

    vue.survol = noeudSous(vue.souris.tx, vue.souris.ty);
    majInfobulle();
  });

  c.addEventListener("mouseleave", () => {
    vue.souris.dedans = false; vue.survol = null;
    $("#infobulle").style.display = "none";
  });

  c.addEventListener("mousedown", ev => {
    const r = c.getBoundingClientRect();
    vue.souris.x = ev.clientX - r.left; vue.souris.y = ev.clientY - r.top;
    const m = ecranVersMonde(vue.souris.x, vue.souris.y);
    const tx = Math.floor(m.x), ty = Math.floor(m.y);

    if (ev.button === 2){
      vue.glisse = { type:"cam", x:vue.souris.x, y:vue.souris.y, camX:vue.camX, camY:vue.camY, bouge:false };
      c.classList.add("deplace");
      return;
    }
    if (ev.button !== 0) return;

    if (vue.outil){
      if (vue.outil.type === "machine"){
        if (poserMachine(vue.outil.id, tx, ty, vue.rotation)){
          vue.glisse = { type:"poseSerie" };
          majBarreConstruction();
          majPanneau();
        } else son("refus");
      } else if (vue.outil.type === "convoyeur"){
        if (!vue.convDepart){
          // Premier clic : on plante le départ. On peut relâcher ensuite.
          const d = ancrageConvoyeur(tx, ty, { x:tx, y:ty });
          if (!d){ notif("Impossible", "Rien ne peut partir d'ici.", "ko"); son("refus"); }
          else {
            vue.convDepart = d;
            vue.glisse = { type:"conv", depart:{ x:tx, y:ty } };
            majApercuConvoyeur(tx, ty);
          }
        } else {
          // Second clic : on pose. L'outil reste actif pour enchaîner.
          majApercuConvoyeur(tx, ty);
          if (validerTrace()) annulerTrace(); else son("refus");
        }
      } else if (vue.outil.type === "pioche"){
        const n = noeudSous(tx,ty);
        if (n && !estQuai(n)){ demolir(n); majBarreConstruction(); majPanneau(); }
      }
      return;
    }

    // Sélection
    const n = noeudSous(tx,ty);
    if (n){
      if (n.enPanne){ reparerMachine(n); }
      vue.selection = estQuai(n) ? 1 : n.id;
      vue.ongletActif = "detail";
      majOnglets();
    } else {
      vue.selection = null;
    }
    majPanneau();
  });

  window.addEventListener("mouseup", ev => {
    if (vue.glisse && vue.glisse.type === "conv"){
      // Relâcher loin du départ vaut pose : le glisser-déposer marche aussi.
      const d = vue.glisse.depart;
      if (d && (vue.souris.tx !== d.x || vue.souris.ty !== d.y)){
        majApercuConvoyeur(vue.souris.tx, vue.souris.ty);
        if (validerTrace()) annulerTrace();
      }
      // Relâcher sur place : on garde le départ et on attend le second clic.
    }
    if (vue.glisse && vue.glisse.type === "cam" && !vue.glisse.bouge){
      // clic droit sans déplacement : on annule le tracé, sinon on démolit
      if (vue.convDepart){ annulerTrace(); vue.glisse = null; c.classList.remove("deplace"); return; }
      const n = noeudSous(vue.souris.tx, vue.souris.ty);
      if (n && !estQuai(n)){ demolir(n); majBarreConstruction(); majPanneau(); }
      else if (vue.outil) annulerOutil();
    }
    vue.glisse = null;
    c.classList.remove("deplace");
  });

  c.addEventListener("contextmenu", e => e.preventDefault());

  c.addEventListener("wheel", ev => {
    ev.preventDefault();
    const avant = ecranVersMonde(vue.souris.x, vue.souris.y);
    const f = ev.deltaY < 0 ? 1.12 : 1/1.12;
    vue.zoom = clamp(vue.zoom*f, CONFIG.zoomMin, CONFIG.zoomMax);
    const apres = ecranVersMonde(vue.souris.x, vue.souris.y);
    vue.camX += avant.x - apres.x;
    vue.camY += avant.y - apres.y;
  }, { passive:false });
}

/* ================================================= Tracé d'un convoyeur
   Un clic pose le départ, on lâche, on promène la souris, un second clic pose
   l'arrivée. Cliquer directement sur une machine, un quai ou une autre bande
   ancre le convoyeur dessus. Entre les deux, le tracé se faufile tout seul
   entre ce qui encombre le passage.
   ====================================================================== */

/** Les tuiles libres au contact d'un nœud, les plus proches d'un point donné. */
function abordsLibres(n, vers){
  const u = U(), out = [];
  for (let dy=-1; dy<=n.h; dy++)
    for (let dx=-1; dx<=n.l; dx++){
      const bordX = dx === -1 || dx === n.l, bordY = dy === -1 || dy === n.h;
      if (bordX === bordY) continue;                       // pas les diagonales
      const x = n.x+dx, y = n.y+dy;
      if (!dansGrille(u,x,y) || occupant(u,x,y) !== 0) continue;
      out.push({ x, y });
    }
  if (n.type === "convoyeur"){
    out.length = 0;
    for (const t of n.chemin)
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const x = t.x+dx, y = t.y+dy;
        if (dansGrille(u,x,y) && occupant(u,x,y) === 0) out.push({ x, y });
      }
  }
  out.sort((a,b) => (a.x-vers.x)**2 + (a.y-vers.y)**2 - ((b.x-vers.x)**2 + (b.y-vers.y)**2));
  return out;
}

/** Le point de départ ou d'arrivée réel d'un clic : la tuile elle-même si elle
 *  est libre, sinon le meilleur abord du nœud sur lequel on a cliqué. */
function ancrageConvoyeur(tx, ty, vers){
  const u = U();
  if (!dansGrille(u,tx,ty)) return null;
  const o = occupant(u,tx,ty);
  if (o === 0) return { x:tx, y:ty, noeud:null };
  const n = noeudSous(tx,ty);
  if (!n) return null;
  const abords = abordsLibres(n, vers || { x:tx, y:ty });
  if (!abords.length) return null;
  return { x:abords[0].x, y:abords[0].y, noeud:n };
}

/** A* sur les tuiles libres, avec une petite pénalité de virage : à longueur
 *  égale, un tracé droit est préféré, et le résultat a l'air voulu. */
function routerConvoyeur(a, b){
  const u = U();
  if (!a || !b) return null;
  if (a.x === b.x && a.y === b.y) return [{ x:a.x, y:a.y }];
  const L = u.largeur;
  const cle = (x,y,d) => (y*L+x)*5 + d;
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  const dep = cle(a.x, a.y, 4);
  const ouvert = [{ x:a.x, y:a.y, d:4, g:0, f:0 }];
  const vientDe = new Map(), meilleur = new Map([[dep, 0]]);
  let garde = 0;

  while (ouvert.length && garde++ < 20000){
    let bi = 0;
    for (let i=1;i<ouvert.length;i++) if (ouvert[i].f < ouvert[bi].f) bi = i;
    const c = ouvert.splice(bi,1)[0];
    if (c.x === b.x && c.y === b.y){
      const chemin = [];
      let k = cle(c.x,c.y,c.d), n = c;
      while (n){ chemin.push({ x:n.x, y:n.y }); n = vientDe.get(cle(n.x,n.y,n.d)); }
      chemin.reverse();
      return chemin;
    }
    for (let d=0; d<4; d++){
      const nx = c.x+dirs[d][0], ny = c.y+dirs[d][1];
      if (!dansGrille(u,nx,ny)) continue;
      const libre = occupant(u,nx,ny) === 0;
      if (!libre && !(nx === b.x && ny === b.y)) continue;
      const g = c.g + 1 + (c.d !== 4 && c.d !== d ? 0.45 : 0);
      const k2 = cle(nx,ny,d);
      if (g >= (meilleur.get(k2) ?? 1e9)) continue;
      meilleur.set(k2, g);
      vientDe.set(k2, c);
      ouvert.push({ x:nx, y:ny, d, g, f: g + Math.abs(b.x-nx) + Math.abs(b.y-ny) });
    }
  }
  return null;
}

/** Recalcule l'aperçu depuis le départ mémorisé jusqu'à la tuile survolée. */
function majApercuConvoyeur(tx, ty){
  const d = vue.convDepart;
  if (!d){ vue.traceConvoyeur = null; return; }
  const fin = ancrageConvoyeur(tx, ty, d);
  if (!fin){ vue.traceConvoyeur = null; vue.convArrivee = null; return; }
  vue.convArrivee = fin;
  vue.traceConvoyeur = routerConvoyeur(d, fin);
}

function annulerTrace(){
  vue.convDepart = null; vue.convArrivee = null; vue.traceConvoyeur = null;
}

function validerTrace(){
  // On tolère un tracé construit par programme : on enlève les doublons.
  let tuiles = vue.traceConvoyeur;
  if (tuiles) tuiles = tuiles.filter((t,i) => i === 0 || t.x !== tuiles[i-1].x || t.y !== tuiles[i-1].y);
  if (!tuiles || tuiles.length < 2){
    if (tuiles) notif("Trop court", "Un convoyeur fait deux tuiles au minimum.", "att");
    return false;
  }
  const u = U();
  if (tuiles.some(t => occupant(u,t.x,t.y) !== 0)){
    notif("Chemin bouché", "Quelque chose s'est mis en travers.", "ko"); son("refus"); return false;
  }
  const cout = tuiles.length * CONV.coutParTuile;
  if (!mode().constructionGratuite && !mode().argentInfini &&
      etat.finances.solde - cout < CONFIG.faillite){
    notif("Trop cher", "Ce convoyeur coûterait " + euros(cout) + ".", "ko"); return false;
  }

  // Les deux bouts sont raccordés par le moteur : machine, caisse, quai — ou
  // un autre convoyeur, ce qui permet de bâtir un réseau par tronçons.
  const c = creerConvoyeur(tuiles, 0, 0);
  u.convoyeurs.push(c);
  for (const t of tuiles) u.grille[t.y*u.largeur+t.x] = c.id;
  depenser(mode().constructionGratuite ? 0 : cout, "investissement");
  reindexer();
  son("pose");
  if (c.etat === "non_relie")
    notif("Convoyeur posé", "Il ne relie rien pour l'instant : il lui faut une machine, un quai ou un autre convoyeur à chaque bout.", "att");
  tutoEvenement("pose_convoyeur");
  majPanneau();
  return true;
}

   UI (2/3) — le panneau de droite
   ========================================================================== */

function majOnglets(){
  $$("#onglets button").forEach(b => b.classList.toggle("actif", b.dataset.o === vue.ongletActif));
}

function majPanneau(){
  if (!etat) return;
  const z = $("#contenuPanneau");
  // Le panneau se rafraîchit en continu : on ne détruit pas ce que le joueur
  // est en train de manipuler, et on lui rend sa position de défilement.
  if (z.contains(document.activeElement) && document.activeElement !== document.body) return;
  const defilement = z.scrollTop;
  z.innerHTML = "";
  switch (vue.ongletActif){
    case "detail":    panneauDetail(z); break;
    case "stocks":    panneauStocks(z); break;
    case "perso":     panneauPersonnel(z); break;
    case "commandes": panneauCommandes(z); break;
    case "finances":  panneauFinances(z); break;
    case "guide":     panneauGuide(z); break;
  }
  z.scrollTop = defilement;
}

function elem(html){
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}
function bouton(texte, action, classe){
  const b = document.createElement("button");
  b.className = "bt " + (classe||"");
  b.textContent = texte;

}
function ligne(k, v, classe){
  const d = document.createElement("div");
  d.className = "ligne";
  d.innerHTML = '<span class="k"></span><span class="v '+(classe||"")+'"></span>';
  d.querySelector(".k").textContent = k;

  return d;
}

        opt.value = o.id; opt.textContent = o.prenom + " " + o.nom + " — " + niveauTexte(o, m.type);
        if (o.posteAssigne === m.id) opt.selected = true;
        sel.appendChild(opt);
      }
      sel.onchange = () => {
        for (const o of U().ouvriers) if (o.posteAssigne === m.id) o.posteAssigne = null;
        if (sel.value){
          const o = ouvrierParId(+sel.value);
          if (o){ o.posteAssigne = m.id; libererTache(o); }
        }
        majPanneau();
      };
      bo.appendChild(sel);
      z.appendChild(bo);
    }
  } else {
    const bc = blocTitre("Contenu");
    const items = Object.keys(m.sortie).filter(k => m.sortie[k] > 0.01);
    if (!items.length) bc.appendChild(elem('<div class="vide">Vide.</div>'));
    for (const it of items) bc.appendChild(ligne(ITEMS[it].nom, mesure(it, m.sortie[it])));
    bc.appendChild(ligne("Place restante", Math.floor(d.capacite - contenuTotal(m.sortie))));
    const j = elem('<div class="jauge bleu"><i></i></div>');
    j.querySelector("i").style.width = Math.round(contenuTotal(m.sortie)/d.capacite*100)+"%";
    bc.appendChild(j);
    z.appendChild(bc);

    if (d.dedie){
      const bd = blocTitre("Marchandise rangée ici");
      bd.appendChild(elem('<div style="font-size:12.5px;color:var(--texte-doux)"></div>')).textContent =
        m.filtre ? ITEMS[m.filtre].nom + " — et rien d'autre."
                 : "Pas encore réglé : le bac prendra la première marchandise qu'on lui apporte.";
      const dispo = Object.keys(ITEMS).filter(k => (ITEMS[k].ageMin||1) <= etat.meta.age);
      bd.appendChild(selecteurMatiere(m.filtre, dispo, "Au choix (la première reçue)", v => {
        if (v && contenuTotal(m.sortie) > 0.5 && !m.sortie[v])
          notif("Videz-le d'abord", "Ce bac contient encore autre chose.", "ko");
        else m.filtre = v;
        majPanneau();
      }));
      z.appendChild(bd);
    }
  }

  // Le bain d'huile
  if (d.bainHuile && etat.meta.age >= 3){
    const bh = blocTitre("Le bain d'huile");
    const f = clamp(m.fraicheurHuile ?? 1, 0, 1);
    bh.appendChild(elem('<div style="font-size:12.5px;color:var(--texte-doux)"></div>')).textContent = motHuile(f);
    const j = elem('<div class="jauge"><i></i></div>');
    j.querySelector("i").style.width = Math.round(f*100)+"%";
    j.classList.add(f < 0.35 ? "rouge" : f < 0.6 ? "" : "vert");
    bh.appendChild(j);
    if (m.arretRestant > 0)
      bh.appendChild(elem('<div style="font-size:12px;color:var(--or)">Vidange en cours — repart dans '+
        Math.ceil(m.arretRestant)+' minutes.</div>'));
    else
      bh.appendChild(bouton("Refaire le bain (" + CONFIG.chargeHuile + " kg d'huile)",
        () => { changerHuile(m); majPanneau(); }, "large"));
    z.appendChild(bh);
  }

  // Ce qui part au rebut
  if (d.qualite && etat.meta.age >= 3){
    const bq = blocTitre("Qualité");
    const op = (m.operateurId != null) ? ouvrierParId(m.operateurId) : null;
    const t = tauxRebut(m, op);
    bq.appendChild(elem('<div style="font-size:12.5px;color:var(--texte-doux)"></div>')).textContent =
      motRebut(t).charAt(0).toUpperCase() + motRebut(t).slice(1) + ".";
    const j = elem('<div class="jauge vert"><i></i></div>');
    j.querySelector("i").style.width = Math.round((1-t/CONFIG.rebutMax)*100)+"%";
    if (t > 0.2) j.classList.add("rouge");
    bq.appendChild(j);
    bq.appendChild(elem('<div style="font-size:11px;color:var(--texte-faible);margin-top:5px">'+
      causeRebut(m, op)+'</div>'));
    z.appendChild(bq);
  }

  // Entretien
  if (d.usureParJour > 0){
    const bu = blocTitre("Entretien");
    const j = elem('<div class="jauge"><i></i></div>');
    const pct = Math.round(m.usure*100);
    j.querySelector("i").style.width = pct+"%";
    j.classList.add(m.usure > 0.6 ? "rouge" : m.usure > 0.35 ? "" : "vert");
    bu.appendChild(elem('<div style="font-size:12.5px;color:var(--texte-doux)">'+usureTexte(m.usure)+'</div>'));
    bu.appendChild(j);
    bu.appendChild(bouton("Réviser (" + euros(d.cout*0.2) + ")", () => { reviserMachine(m); majPanneau(); }, "large"));
    z.appendChild(bu);
  }

  z.appendChild(bouton("Démolir (rendu " + euros(d.cout*CONFIG.remboursementCasse) + ")",
    () => { demolir(m); majBarreConstruction(); majPanneau(); }, "large danger"));
}

function motHuile(f){
  if (f > 0.8) return "Huile neuve.";
  if (f > 0.6) return "L'huile est encore bonne.";
  if (f > 0.35) return "L'huile commence à fatiguer.";
  if (f > 0.15) return "L'huile est brune, ça se sent à la cuisson.";
  return "L'huile est morte. Tout ce qui sort est raté.";
}

/** Pourquoi ça rate : on nomme la cause la plus lourde, pas un coefficient. */
function causeRebut(m, op){
  const u = U();
  const causes = [];
  if (MACHINES[m.type].bainHuile) causes.push([0.20*(1-clamp(m.fraicheurHuile ?? 1,0,1)), "l'huile fatigue"]);
  causes.push([0.25*clamp(u.salete,0,1), "l'atelier est sale"]);
  causes.push([0.15*clamp(m.usure,0,1), "la machine est usée"]);
  if (op){
    causes.push([0.25*(1-(op.competences[COMP_MACHINE[m.type]] ?? 0.5)), op.prenom + " débute encore sur ce poste"]);
    causes.push([0.15*op.fatigue, op.prenom + " est fatigué"]);
  }
  causes.sort((a,b) => b[0]-a[0]);
  if (causes[0][0] < 0.04) return "Rien à redire.";
  return "Surtout parce que " + causes[0][1] + ".";
}

/** Choisir une marchandise dans une liste, avec une option « au choix ». */
function selecteurMatiere(valeur, choixPossibles, libelleVide, surChoix){
  const sel = document.createElement("select");
  sel.className = "champTexte";
  sel.style.cssText = "text-align:left;margin:6px 0 0";
  const o0 = document.createElement("option");
  o0.value = ""; o0.textContent = libelleVide;
  sel.appendChild(o0);
  for (const id of choixPossibles){
    if (!ITEMS[id]) continue;
    const o = document.createElement("option");
    o.value = id; o.textContent = ITEMS[id].nom;
    if (valeur === id) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = () => surChoix(sel.value || null);
  return sel;
}

function usureTexte(u){
  if (u < 0.2) return "Comme neuve.";
  if (u < 0.45) return "Rien à signaler.";
  if (u < 0.65) return "Elle commence à faire du bruit.";
  if (u < 0.85) return "Elle grince sérieusement — elle va lâcher.";
  return "Elle tient par miracle.";
}
function niveauTexte(o, typeMachine){
  const c = o.competences[COMP_MACHINE[typeMachine]] ?? 0.5;
  if (c < 0.35) return o.prenom + " débute encore sur ce poste";
  if (c < 0.55) return "se débrouille";
  if (c < 0.75) return "bon sur ce poste";
  return "c'est son métier";
}

function panneauStocks(z){
  const u = U();

    l.querySelector(".nom").innerHTML = it.nom + '<br><span class="sub">' +

    bm.appendChild(l);
    const r = document.createElement("div");
    r.className = "btRang";
    // On achète par lots qui ont un sens : des centaines de kilos, ou des pièces.
    const lots = it.unite === "kg" ? [50,200,500] : [10,50,100];
    for (const q of lots)
      r.appendChild(bouton("+"+nb(q), () => { acheter(id,q); majPanneau(); majBandeau(); }));
    bm.appendChild(r);

    if (debloque("reappro")){
      const defaut = it.unite === "kg" ? { actif:false, seuil:150, lot:400 }
                                       : { actif:false, seuil:40, lot:80 };
      const rp = etat.reappro[id] || (etat.reappro[id] = defaut);

      const bloc = document.createElement("div");
      bloc.className = "reappro" + (rp.actif ? " actif" : "");
      const lab = document.createElement("label");
      lab.className = "reapproTete";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = rp.actif;
      cb.onchange = () => { rp.actif = cb.checked; majPanneau(); };
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode("Recommander toute seule"));
      bloc.appendChild(lab);

      if (rp.actif){
        // Deux réglages, écrits comme une phrase : « dès qu'il en reste moins
        // de 150 kg, en faire livrer 400 kg ».
        const champ = (val, maj) => {
          const i = document.createElement("input");
          i.type = "number"; i.min = "0"; i.step = it.unite === "kg" ? "50" : "10";
          i.value = Math.round(val); i.className = "reapproNb";
          i.onchange = () => { maj(Math.max(0, Math.round(+i.value || 0))); majPanneau(); };
          return i;
        };
        const p = document.createElement("div");
        p.className = "reapproPhrase";
        p.appendChild(document.createTextNode("Dès qu'il en reste moins de"));
        p.appendChild(champ(rp.seuil, v => rp.seuil = v));
        p.appendChild(document.createTextNode((it.unite === "kg" ? "kg" : "") + ", en faire livrer"));
        p.appendChild(champ(rp.lot, v => rp.lot = v));
        p.appendChild(document.createTextNode(it.unite === "kg" ? "kg." : "."));
        bloc.appendChild(p);
        const jours = uneJourneeDe(id);
        bloc.appendChild(elem('<div class="reapproNote"></div>')).textContent =
          "L'atelier en consomme environ " + mesure(id, jours*2) + " par jour. " +
          "Le lot coûtera " + euros(rp.lot * prixAchat(id)) + ".";
      }
      bm.appendChild(bloc);
    }
  }
  z.appendChild(bm);

  const bp = blocTitre("Pièces en circulation");
  const tout = tousStocks();
  const pieces = Object.keys(tout).filter(k => ITEMS[k] && tout[k] >= 1 && ITEMS[k].cat !== "matiere");
  if (!pieces.length) bp.appendChild(elem('<div class="vide">Rien au quai.</div>'));
  for (const it of pieces) bp.appendChild(ligne(ITEMS[it].nom, mesure(it, tout[it])));
  z.appendChild(bp);
}

function motCompetence(c){
  if (c < 0.3) return "débute";
  if (c < 0.5) return "correct";
  if (c < 0.7) return "bon";
  if (c < 0.85) return "très bon";
  return "expert";
}
const NOM_COMPETENCE = { lavage:"Lavage", decoupe:"Tranchage", friture:"Friture",
                         assaisonnement:"Assaisonnement", emballage:"Emballage" };

function resumeCompetences(o){
  const best = Object.keys(o.competences).sort((a,b)=>o.competences[b]-o.competences[a]);
  const mot = k => (NOM_COMPETENCE[k]||k).toLowerCase();
  return "Surtout " + mot(best[0]) + " (" + motCompetence(o.competences[best[0]]) + "), " +
         mot(best[1]) + " (" + motCompetence(o.competences[best[1]]) + ").";
}
function texteEtatOuvrier(o){
  switch (o.etat){
    case "travaille": {
      const m = o.tache ? noeudParId(o.tache.machineId) : null;
      return m ? "tient " + MACHINES[m.type].nom.toLowerCase() : "au travail";
    }
    case "porte": return o.charge ? "porte des " + nomItem(o.charge.item, 2, true, true) : "porte une pièce";
    case "deplace": return "traverse l'atelier";
    case "pause": return "souffle un peu";
    default: return "attend qu'on lui donne quelque chose";
  }
}

/** Petit portrait généré, pour éviter tout fichier image. */
function dessinerTete(g, graine){
  const s = g.canvas.width;
  const peaux = ["#e0b98d","#c99568","#8d5f3c","#f0cfa8"];
  const cheveux = ["#3b2a1c","#6b4a2a","#1e1a17","#8a7050","#a5a5a5"];
  g.clearRect(0,0,s,s);
  g.fillStyle = "#2f343b"; g.fillRect(0,0,s,s);
  g.fillStyle = peaux[Math.floor(bruit(graine)*peaux.length)];
  g.beginPath(); g.arc(s/2, s*0.56, s*0.3, 0, 7); g.fill();
  g.fillStyle = cheveux[Math.floor(bruit(graine+9)*cheveux.length)];
  g.beginPath(); g.arc(s/2, s*0.5, s*0.31, Math.PI*1.05, Math.PI*1.95); g.fill();
  g.fillStyle = "#22262c";
  g.beginPath(); g.arc(s*0.4, s*0.56, s*0.035, 0, 7); g.fill();
  g.beginPath(); g.arc(s*0.6, s*0.56, s*0.035, 0, 7); g.fill();
  g.strokeStyle = "#22262c"; g.lineWidth = s*0.03; g.lineCap = "round";
  g.beginPath(); g.arc(s/2, s*0.62, s*0.1, 0.35, Math.PI-0.35); g.stroke();
}

  z.innerHTML = `

      <div class="volets">
        <div class="volet" id="voletBilan"></div>
        <div class="volet" id="voletDecisions"></div>
      </div>
      <div class="piedFeuille">

        <button class="bt plein" id="btLancer" style="padding:13px 34px">Lancer la semaine</button>
      </div>

  const gr = document.createElement("div");
  gr.className = "grandChiffre " + (resultat >= 0 ? "pos" : "neg");
  gr.textContent = eurosSigne(resultat);
  gc.appendChild(gr);
  vb.appendChild(gc);

  const tbl = document.createElement("table");
  tbl.className = "tab";
  tbl.style.marginTop = "12px";
  const produits = Object.keys(bilan.produits);
  const livres = Object.keys(bilan.livres);
  tbl.innerHTML = "<tr><th>Poste</th><th style='text-align:right'>Montant</th></tr>";
  ajLigne(tbl, "Chiffre d'affaires", euros(bilan.ca));
  ajLigne(tbl, "Dépenses", "−" + euros(bilan.depenses).replace("−",""));
  ajLigne(tbl, "En caisse", euros(etat.finances.solde));
  if (produits.length) ajLigne(tbl, "Fabriqué",
    produits.map(k => quantiteItem(k, bilan.produits[k], true)).join(", "));
  if (livres.length) ajLigne(tbl, "Livré",

  vb.appendChild(cv);

  if (marquant){
    const f = document.createElement("div");
    f.className = "faitMarquant";
    f.textContent = marquant;
    vb.appendChild(f);
  }

  /* --- Volet 2 : les décisions (4 au maximum, §3.5) --- */
  const vd = $("#voletDecisions");
  vd.innerHTML = "<h2>À décider</h2>";
  if (!decisions.length) vd.appendChild(elem('<div class="vide">Rien de spécial cette semaine. Bonne soirée.</div>'));
  const cartes = document.createElement("div");
  cartes.className = "cartes";

    '<div class="objTexte"><h2>Prochaine étape</h2><div class="objTitre"></div></div>' +

function ajLigne(tbl, k, v){
  const tr = document.createElement("tr");
  const a = document.createElement("td"); a.textContent = k;
  const b = document.createElement("td"); b.textContent = v; b.style.textAlign = "right"; b.style.fontWeight = "600";
  tr.appendChild(a); tr.appendChild(b); tbl.appendChild(tr);
}

function majResteDecisions(){
  const n = $$("#voletDecisions .carte:not(.traitee)").length;
  const e = $("#resteDecisions");
  if (e) e.textContent = n ? n + " " + pluriel(n,"décision") + " en attente — on peut aussi laisser filer." : "Tout est tranché.";
}

function faitMarquant(b){
  const h = etat.stats.historiqueSemaines;
  const r = b.ca - b.depenses;
  if (h.length > 1){
    const meilleur = Math.max(...h.slice(0,-1).map(s => s.ca - s.depenses));
    if (r > meilleur && r > 0) return "Meilleure semaine depuis le début.";
  }
  if (b.pannes >= 3) return b.pannes + " pannes cette semaine. Le matériel fatigue.";
  if (b.retards > 0) return "On a livré en retard. Ça finit par se savoir.";
  if (r < 0) return "On a perdu de l'argent cette semaine.";
  if (b.faits.length) return b.faits[b.faits.length-1] + ".";
  const cles = Object.keys(b.produits);
  if (cles.length){
    const gros = cles.sort((x,y) => b.produits[y]-b.produits[x])[0];
    return quantiteItem(gros, b.produits[gros], true) + " sont sortis de l'atelier.";
  }
  return null;
}

function motDeFin(p){
  if (p.part >= 0.9) return "« On y est presque, patron. »";
  if (p.part >= 0.5) return "« On avance. Faut tenir la cadence. »";
  if (p.part >= 0.2) return "« C'est un début. »";
  return "« Il va falloir s'y mettre. »";
}

function dessinerGraphique(cv){
  const g = cv.getContext("2d");
  const h = etat.stats.historiqueSemaines.slice(-12);
  g.clearRect(0,0,cv.width,cv.height);
  if (!h.length) return;
  const vals = h.map(s => s.ca - s.depenses);
  const maxi = Math.max(1, ...vals.map(Math.abs));
  const n = h.length;
  const lb = cv.width/n;
  const zero = cv.height/2;

  g.strokeStyle = "rgba(255,255,255,.12)";
  g.beginPath(); g.moveTo(0,zero); g.lineTo(cv.width,zero); g.stroke();

  for (let i=0;i<n;i++){
    const v = vals[i];
    const hh = Math.abs(v)/maxi * (cv.height/2 - 12);
    g.fillStyle = v >= 0 ? "#5cba6b" : "#e0574a";
    if (v >= 0) g.fillRect(i*lb+lb*0.22, zero-hh, lb*0.56, hh);
    else g.fillRect(i*lb+lb*0.22, zero, lb*0.56, hh);
  }
  g.fillStyle = "rgba(255,255,255,.4)";
  g.font = "10px Segoe UI, sans-serif";
  g.fillText("S"+(h[0].semaine+1), 3, cv.height-3);
  g.textAlign = "right";
  g.fillText("S"+(h[n-1].semaine+1), cv.width-3, cv.height-3);
  g.textAlign = "left";
}

/* ------------------------------------------------ Les cartes de décision */
function construireDecisions(){
  const d = [];
  const u = U();

  for (const c of etat.contrats.proposes.slice(0,2)) d.push({ sorte:"contrat", contrat:c });

  // Embauche : proposée si l'atelier a plus de machines que de bras
  const manuelles = u.machines.filter(m => !MACHINES[m.type].auto && !MACHINES[m.type].stockage).length;
  if (u.ouvriers.length < manuelles && d.length < CONFIG.decisionsMax){
    const c = creerCandidat();
    d.push({ sorte:"rh", candidat:c });
  }

  // Lot de matière à prix cassé
  if (d.length < CONFIG.decisionsMax){
    const achetables = Object.keys(ITEMS).filter(k => ITEMS[k].achat && (ITEMS[k].ageMin||1) <= etat.meta.age);
    const it = choix(achetables);
    const qte = ITEMS[it].unite === "kg" ? hasardInt(4,15)*50 : hasardInt(4,12)*20;
    const remise = hasard(0.14,0.28);
    const prix = Math.round(prixAchat(it)*qte*(1-remise));
    d.push({ sorte:"achat", item:it, qte, prix, remise });
  }

  // Un emprunt, quand la caisse est basse
  if (etat.finances.solde < 3000 && d.length < CONFIG.decisionsMax && etat.finances.emprunts.length < 2){
    d.push({ sorte:"banque", banque: BANQUES[etat.meta.age >= 2 ? 1 : 0] });
  }

  return d.slice(0, CONFIG.decisionsMax);
}

function carteDecision(d){
  const c = document.createElement("div");
  c.className = "carte";
  let type = "", titre = "", corps = "", avis = "", actions = [];

  if (d.sorte === "contrat"){
    const k = d.contrat;
    type = "Commande"; c.classList.add();
    titre = k.client;
    corps = quantiteItem(k.produitId, k.quantite, false) +
            " à " + euros(k.prixUnitaire) + (ITEMS[k.produitId].unite === "kg" ? " le kg" : " pièce") +
            ", soit " + euros(k.quantite*k.prixUnitaire) + ". " +
            "À livrer sous " + (k.dateLimite - jourCourant()) + " jours ouvrés. " +
            "Pénalité de " + euros(k.penaliteRetard) + " par jour de retard." +
            (k.paiement ? " Payé à " + k.paiement + " jours." : "");
    avis = avisContremaitre(k) +
           (k.paiement ? " Attention : ils paient à " + k.paiement + " jours. On avance la matière et les salaires en attendant." : "");
    actions = [["Accepter", () => accepterContrat(k), "plein"], ["Refuser", () => refuserContrat(k), ""]];
  }
  else if (d.sorte === "rh"){
    const o = d.candidat;
    type = "Embauche";
    titre = o.prenom + " " + o.nom;
    corps = TRAITS.find(t=>t.id===o.trait).nom + ". Demande " + euros(o.salaire) + " par jour. " + resumeCompetences(o);
    const u = U();
    avis = u.ouvriers.length < 2 ? "À un seul, on passe la journée à porter des pièces. Prenez-le."
         : "Un bras de plus, c'est " + euros(o.salaire*5) + " par semaine. À vous de voir si on a le carnet pour.";
    actions = [["Embaucher", () => embaucher(o), "plein"], ["Pas maintenant", () => {}, ""]];
  }
  else if (d.sorte === "achat"){
    type = "Matière";
    titre = "Lot de " + quantiteItem(d.item, d.qte, true);
    corps = "Un fournisseur solde son stock : " + euros(d.prix) + " au lieu de " +
            euros(prixAchat(d.item)*d.qte) + ", soit " + Math.round(d.remise*100) + " % de moins.";
    avis = etat.finances.solde > d.prix*3 ? "À ce prix-là, on prend." : "C'est une bonne affaire, mais la caisse est courte.";
    actions = [["Acheter", () => {
      if (etat.finances.solde - d.prix < CONFIG.faillite) return notif("Refusé","La caisse ne suit pas.","ko");
      depenser(d.prix,"achat"); ajouterStock(d.item, d.qte); son("argent");
      notif("Livraison", quantiteItem(d.item, d.qte, true) + " au quai.", "ok");
    }, "plein"], ["Laisser", () => {}, ""]];
  }
  else if (d.sorte === "banque"){
    type = "Banque";
    titre = d.banque.nom;
    corps = "Vous prête " + euros(d.banque.montant) + ", à rendre " + euros(d.banque.montant*(1+d.banque.taux)) +
            " sur " + d.banque.jours + " jours, soit " + euros(d.banque.montant*(1+d.banque.taux)/d.banque.jours) + " par jour.";
    avis = "La caisse est basse. Un emprunt maintenant, c'est du temps qu'on achète — pas de l'argent qu'on gagne.";
    actions = [["Signer", () => emprunter(d.banque), "plein"], ["Refuser", () => {}, ""]];
  }

  const classe = { contrat:"tContrat", rh:"tRh", achat:"tAchat", banque:"tBanque", invest:"tInvest" }[d.sorte];
  c.innerHTML = '<div class="cType '+classe+'"></div><div class="cTitre"></div><div class="cCorps"></div>' +
                (avis ? '<div class="cAvis"></div>' : '');
  c.querySelector(".cType").textContent = type;
  c.querySelector(".cTitre").textContent = titre;
  c.querySelector(".cCorps").textContent = corps;
  if (avis) c.querySelector(".cAvis").textContent = "« " + avis + " »";

  const r = document.createElement("div");
  r.className = "btRang";
  for (const [nom, fn, cl] of actions){
    r.appendChild(bouton(nom, () => {
      fn();
      c.classList.add("traitee");
      majResteDecisions();
      majBandeau();
    }, cl));
  }
  c.appendChild(r);
  return c;
}

/** Chaque étape attend un événement précis ; tant qu'il n'arrive pas, le
 *  contremaître ne passe pas à la suite. */
function tutoEvenement(cle){
  if (!etat || !etat.tuto || etat.tuto.etape >= TUTO.length) return;
  if (TUTO[etat.tuto.etape].attend !== cle) return;
  etat.tuto.etape++;
  if (etat.tuto.etape < TUTO.length) parle(TUTO[etat.tuto.etape].texte, 14000);
}

function tutoDemarrage(){
  if (etat.tuto && etat.tuto.etape === 0) parle(TUTO[0].texte, 15000);
}

/* ============================================================================
   UI — onglet Guide
   Tout est calculé à partir de DONNÉES : recettes, rendements et prix de
   revient ne peuvent pas se désynchroniser de l'équilibrage réel.
   ========================================================================== */

/** Le même pictogramme que dans la vue usine, dans une vignette du panneau.
 *  On emprunte le contexte de rendu le temps du dessin. */
function iconeItem(id, px){
  const c = document.createElement("canvas");
  c.width = c.height = px;
  const g = c.getContext("2d");
  const sauve = ctx;
  ctx = g;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.translate(px/2, px/2);
  ctx.scale(px, px);                 // dessinerItem raisonne en tuiles
  dessinerItem(0, 0, 0.82, id);
  ctx = sauve;
  c.title = ITEMS[id] ? ITEMS[id].nom : id;
  return c;
}

/** Remonte l'arbre des recettes jusqu'aux matières achetées.
 *  matierePremiere("chips_vrac", 1) → { pdt_brutes: 4.8, huile: 0.583 } */
function matierePremiere(itemId, qte, acc, profondeur){
  acc = acc || {};
  if ((profondeur||0) > 12) return acc;                 // garde-fou
  const r = Object.values(RECETTES).find(x => x.sortie.id === itemId);
  if (!r){ acc[itemId] = (acc[itemId]||0) + qte; return acc; }
  const facteur = qte / r.sortie.qte;
  for (const e of r.entrees) matierePremiere(e.id, e.qte*facteur, acc, (profondeur||0)+1);
  return acc;
}

/** Ce que coûte la matière pour une unité de produit fini. */
function prixDeRevient(itemId){
  const m = matierePremiere(itemId, ITEMS[itemId].unite === "kg" ? 1 : 100);
  let total = 0;
  for (const k in m) total += m[k] * (ITEMS[k].achat || 0);
  return { matieres:m, total, base: ITEMS[itemId].unite === "kg" ? 1 : 100 };
}

/** Une recette est-elle accessible au joueur ? */
function recetteDebloquee(r){
  return (r.ageMin || 1) <= etat.meta.age;
}

function panneauGuide(z){
  const toutVoir = !!vue.guideToutVoir;

  z.appendChild(elem('<h2 class="titrePan">Guide</h2>'));
  z.appendChild(elem('<p class="sousTitre">Comment on fabrique, et comment ça marche.</p>'));

  /* ---------------------------------------------------- La chaîne, d'un coup */
  const bc = blocTitre("La chaîne");
  const etapes = [];
  const vues = new Set();
  for (const id in RECETTES){
    const r = RECETTES[id];
    if (!recetteDebloquee(r) && !toutVoir) continue;
    for (const e of r.entrees) if (!vues.has(e.id)){ vues.add(e.id); }
    etapes.push(r);
  }
  // On part des matières achetées, puis on suit les recettes dans l'ordre
  const depart = Object.keys(ITEMS).filter(k => ITEMS[k].achat && (ITEMS[k].ageMin||1) <= etat.meta.age);
  bc.appendChild(rangeeFlux(depart[0], "on achète"));
  for (const r of etapes){
    bc.appendChild(elem('<div class="fluxFleche">↓</div>'));
    bc.appendChild(elem('<div class="fluxMachine">'+MACHINES[r.machine].nom+'</div>'));
    bc.appendChild(rangeeFlux(r.sortie.id,
      "il faut " + r.entrees.map(e => quantiteItem(e.id, e.qte, true)).join(" + ")));
  }
  if (!etapes.length) bc.appendChild(elem('<div class="vide">Rien de débloqué.</div>'));
  z.appendChild(bc);

  /* ------------------------------------------------------------- Le rendement */
  const finis = Object.keys(ITEMS).filter(k => ITEMS[k].vente && ((ITEMS[k].ageMin||1) <= etat.meta.age || toutVoir));
  if (finis.length){
    const br = blocTitre("Ce que ça coûte, ce que ça rapporte");
    for (const id of finis){
      const pr = prixDeRevient(id);
      const it = ITEMS[id];
      const vente = it.vente * pr.base;
      const d = document.createElement("div");
      d.style.cssText = "padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)";
      const unite = it.unite === "kg" ? "Pour 1 kg" : "Pour 100 " + nomItem(id, 2, true, true);
      d.innerHTML = '<div style="font-weight:600;font-size:13px;margin-bottom:5px">'+unite+' '+
                    deDe(nomItem(id,2,true,true))+nomItem(id,2,true,true)+'</div>';
      for (const k in pr.matieres)
        d.appendChild(ligne("il faut " + quantiteItem(k, pr.matieres[k], true), eurosPrecis(pr.matieres[k]*(ITEMS[k].achat||0))));
      const lm = ligne("Matière", eurosPrecis(pr.total));
      lm.querySelector(".v").style.color = "var(--rouge)";
      d.appendChild(lm);
      const lv = ligne("Vendu sur commande", eurosPrecis(vente));
      lv.querySelector(".v").style.color = "var(--vert)";
      d.appendChild(lv);
      const lg = ligne("Reste avant les salaires", eurosPrecis(vente - pr.total));
      lg.querySelector(".v").style.color = "var(--or)";
      d.appendChild(lg);
      br.appendChild(d);
    }
    br.appendChild(elem('<div style="font-size:11px;color:var(--texte-faible);margin-top:7px">'+
      "Il reste à payer là-dessus les salaires, le loyer et l'électricité. "+
      "L'onglet Argent donne la charge du jour.</div>"));
    z.appendChild(br);
  }

  /* ------------------------------------------------------------- Les recettes */
  const bR = blocTitre("Les recettes");
  for (const id in RECETTES){
    const r = RECETTES[id];
    const ouvert = recetteDebloquee(r);
    if (!ouvert && !toutVoir){
      bR.appendChild(elem('<div class="recette verrou"><div class="rNom" style="margin:0">'+
        MACHINES[r.machine].nom+' — débloqué à l\'âge '+r.ageMin+'</div></div>'));
      continue;
    }
    bR.appendChild(carteRecette(r, ouvert));
  }
  z.appendChild(bR);

  /* -------------------------------------------------------------- Les machines */
  const bM = blocTitre("Les machines");
  for (const k in MACHINES){
    const d = MACHINES[k];
    const ouvert = d.ageMin <= etat.meta.age;
    if (!ouvert && !toutVoir){
      bM.appendChild(elem('<div class="ligne" style="opacity:.45"><span class="k">'+d.nom+
        '</span><span class="v">âge '+d.ageMin+'</span></div>'));
      continue;
    }
    const dd = document.createElement("div");
    dd.style.cssText = "padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)" + (ouvert?"":";opacity:.5");
    dd.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px">'+
      '<b style="font-size:12.5px">'+d.nom+'</b><span style="font-variant-numeric:tabular-nums;color:var(--or)">'+
      nb(d.cout)+' €</span></div>'+
      '<div style="font-size:11.5px;color:var(--texte-doux);margin:2px 0">'+d.resume+'</div>'+
      '<div style="font-size:11px;color:var(--texte-faible)">'+
      d.l+' × '+d.h+' carreaux · '+(d.auto ? "tourne sans personne" : "il faut quelqu'un dessus")+
      (d.usureParJour ? " · s'use" : "")+'</div>';
    bM.appendChild(dd);
  }
  z.appendChild(bM);

  /* ------------------------------------------------------- Comment ça marche */
  const bH = blocTitre("Comment ça marche");
  for (const s of SECTIONS_GUIDE()) bH.appendChild(sectionGuide(s.titre, s.corps));
  z.appendChild(bH);

  /* ------------------------------------------------------------ Les spoilers */
  const lab = document.createElement("label");
  lab.style.cssText = "display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--texte-faible);margin-top:4px;cursor:pointer";
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = toutVoir;
  cb.onchange = () => { vue.guideToutVoir = cb.checked; majPanneau(); };
  lab.appendChild(cb);
  lab.appendChild(document.createTextNode("Montrer aussi ce qui n'est pas encore débloqué"));
  z.appendChild(lab);
}

function rangeeFlux(itemId, sous){
  const d = document.createElement("div");
  d.className = "fluxEtape";
  d.appendChild(iconeItem(itemId, 26));
  const t = document.createElement("div");
  t.style.flex = "1";
  t.innerHTML = '<div class="fNom"></div><div class="fSub"></div>';
  t.querySelector(".fNom").textContent = nomItem(itemId, 2);   // un flux se dit au pluriel
  t.querySelector(".fSub").textContent = sous;
  d.appendChild(t);
  return d;
}

function carteRecette(r, ouvert){
  const d = document.createElement("div");
  d.className = "recette" + (ouvert ? "" : " verrou");
  const def = MACHINES[r.machine];
  d.innerHTML = '<div class="rMachine"></div><div class="rNom"></div>';
  const m = d.querySelector(".rMachine");
  m.textContent = def.nom;
  m.style.color = def.couleur;
  d.querySelector(".rNom").textContent = r.nom;

  for (const e of r.entrees){
    const l = document.createElement("div");
    l.className = "rBloc";
    l.appendChild(iconeItem(e.id, 22));
    const t = document.createElement("span");
    t.textContent = quantiteItem(e.id, e.qte, false);
    l.appendChild(t);
    d.appendChild(l);
  }

  const sep = document.createElement("div");
  sep.className = "rSep";
  sep.appendChild(document.createTextNode(nb(r.duree) + " min"));
  d.appendChild(sep);

  const l = document.createElement("div");
  l.className = "rBloc";
  l.appendChild(iconeItem(r.sortie.id, 22));
  const t = document.createElement("span");
  t.innerHTML = "<b>" + quantiteItem(r.sortie.id, r.sortie.qte, false) + "</b>";
  l.appendChild(t);
  d.appendChild(l);

  const parJour = r.sortie.qte * (CONFIG.minutesParJour / r.duree);
  const c = document.createElement("div");
  c.className = "rCadence";
  c.textContent = "Au maximum " + quantiteItem(r.sortie.id, parJour, true) +
                  " par jour et par poste, si rien ne l'arrête.";
  d.appendChild(c);
  return d;
}

function sectionGuide(titre, corps){
  const d = document.createElement("details");
  d.className = "guideDetails";
  if (vue.guideOuvert && vue.guideOuvert.has(titre)) d.open = true;
  const s = document.createElement("summary");
  s.textContent = titre;
  d.appendChild(s);
  const c = document.createElement("div");
  c.className = "guideCorps";
  c.innerHTML = corps;
  d.appendChild(c);
  // on retient ce que le joueur a ouvert, le panneau se reconstruisant souvent
  d.addEventListener("toggle", () => {
    vue.guideOuvert = vue.guideOuvert || new Set();
    if (d.open) vue.guideOuvert.add(titre); else vue.guideOuvert.delete(titre);
  });
  return d;
}
