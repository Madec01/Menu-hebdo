      ctx.fillStyle = "rgba(255,240,190,.4)";
      ctx.beginPath(); ctx.ellipse(-s*0.08, -s*0.08, s*0.12, s*0.07, 0.5, 0, 7); ctx.fill();
      break;
    }

    case "sachet": {                 // sachet gonflé, avec sa soudure
      ctx.beginPath();
      ctx.moveTo(-s*0.26, -s*0.36);
      ctx.quadraticCurveTo(-s*0.4, 0, -s*0.26, s*0.36);
      ctx.lineTo(s*0.26, s*0.36);
      ctx.quadraticCurveTo(s*0.4, 0, s*0.26, -s*0.36);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.3)";
      ctx.fillRect(-s*0.28, -s*0.38, s*0.56, s*0.09);
      ctx.fillRect(-s*0.28,  s*0.29, s*0.56, s*0.09);
      ctx.fillStyle = "rgba(255,225,150,.85)";
      ctx.beginPath(); ctx.arc(0, 0, s*0.13, 0, 7); ctx.fill();
      break;
    }

    case "bidon": {                  // bidon d'huile
      ctx.fillRect(-s*0.26, -s*0.3, s*0.52, s*0.6);
      ctx.strokeRect(-s*0.26, -s*0.3, s*0.52, s*0.6);
      ctx.fillStyle = "rgba(60,45,15,.5)";
      ctx.fillRect(-s*0.1, -s*0.42, s*0.2, s*0.13);
      ctx.fillStyle = "rgba(255,255,255,.28)";
      ctx.fillRect(-s*0.2, -s*0.2, s*0.12, s*0.4);
      break;
    }

    case "sac": {                    // sac de sel ou d'arôme
      ctx.beginPath();
      ctx.moveTo(-s*0.3, s*0.34);
      ctx.lineTo(-s*0.22, -s*0.24);
      ctx.lineTo( s*0.22, -s*0.24);
      ctx.lineTo( s*0.3,  s*0.34);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(0,0,0,.35)";
      ctx.lineWidth = Math.max(0.01, s*0.06);
      ctx.beginPath(); ctx.moveTo(-s*0.22,-s*0.24); ctx.lineTo(s*0.22,-s*0.24); ctx.stroke();
      break;
    }

    case "bobine": {                 // bobine de film
      ctx.beginPath(); ctx.arc(0, 0, s*0.36, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(30,36,42,.75)";
      ctx.beginPath(); ctx.arc(0, 0, s*0.12, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.25)";
      ctx.lineWidth = Math.max(0.008, s*0.035);
      ctx.beginPath(); ctx.arc(0, 0, s*0.24, 0, 7); ctx.stroke();
      break;
    }
  }
  ctx.restore();
}

/* ------------------------------------------------------------- Le sol */
function dessinerSol(){
  const u = U();

  // Hors des murs : le noir de la nuit
  ecranSeul();
  ctx.fillStyle = "#101215";
  ctx.fillRect(0,0,largeurVue,hauteurVue);
  appliquerCamera();

  // Dalle de béton et crasse : une seule image
  majCacheSol();
  ctx.drawImage(cacheSol, 0, 0, u.largeur, u.hauteur);

  // Quadrillage discret
  if (vue.zoom > CONFIG.seuilSchema){
    ctx.strokeStyle = "rgba(255,255,255,.045)";
    ctx.lineWidth = 1/T();
    ctx.beginPath();
    for (let x=0; x<=u.largeur; x++){ ctx.moveTo(x,0); ctx.lineTo(x,u.hauteur); }
    for (let y=0; y<=u.hauteur; y++){ ctx.moveTo(0,y); ctx.lineTo(u.largeur,y); }
    ctx.stroke();
  }

  // Marquage jaune des allées
  ctx.strokeStyle = "rgba(226,182,44,.5)";
  ctx.lineWidth = 0.09;
  ctx.setLineDash([0.7,0.45]);
  ctx.strokeRect(0.45,0.45,u.largeur-0.9,u.hauteur-0.9);
  ctx.setLineDash([]);

  // Murs
  ctx.strokeStyle = "#2b2e33";
  ctx.lineWidth = 0.22;
  ctx.strokeRect(-0.11,-0.11,u.largeur+0.22,u.hauteur+0.22);
  ctx.strokeStyle = "#191b1f";
  ctx.lineWidth = 0.08;
  ctx.strokeRect(0,0,u.largeur,u.hauteur);
}

/* -------------------------------------------------------------- Le quai */
function dessinerQuai(){
  const u = U(), q = u.quai;
  ctx.save();
  // dalle du quai
  ctx.fillStyle = "#3c4045";
  ctx.fillRect(q.x, q.y, q.l, q.h);
  ctx.fillStyle = "#33373c";
  ctx.fillRect(q.x, q.y+q.h-0.22, q.l, 0.22);
  // bandes d'avertissement
  ctx.save();
  ctx.beginPath(); ctx.rect(q.x,q.y,q.l,q.h); ctx.clip();
  ctx.strokeStyle = "rgba(226,182,44,.75)";
  ctx.lineWidth = 0.16;
  for (let i=-q.h; i<q.l+q.h; i+=0.5){
    ctx.beginPath(); ctx.moveTo(q.x+i, q.y); ctx.lineTo(q.x+i+q.h, q.y+q.h); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = "rgba(20,22,25,.55)";
  ctx.fillRect(q.x+0.15, q.y+0.15, q.l-0.3, q.h-0.3);

  // ce qui attend sur le quai, en vrac
  const items = Object.keys(u.stocks).filter(k => u.stocks[k] > 0.5);
  if (vue.zoom > CONFIG.seuilDetail){
    let i = 0;
    for (const it of items){
      const n = Math.min(4, Math.ceil(u.stocks[it]/8));
      for (let k=0;k<n && i<18;k++,i++){
        const bx = q.x + 0.32 + bruit(i*3+1)*(q.l-0.64);
        const by = q.y + 0.32 + bruit(i*7+5)*(q.h-0.64);
        dessinerItem(bx, by, 0.42, it, 0.95);
      }
    }
  }
  ctx.restore();

  if (vue.zoom > CONFIG.seuilDetail){
    const e = mondeVersEcran(q.x+q.l/2, q.y-0.15);
    ecranSeul();
    ctx.font = "600 " + Math.round(10*Math.min(1.4,vue.zoom)) + "px Segoe UI, sans-serif";
    ctx.textAlign = "center"; ctx.fillStyle = "rgba(226,196,120,.85)";
    ctx.fillText("QUAI", e.x, e.y);
    appliquerCamera();
  }
}

/* ============================================================================
   RENDU (2/3) — convoyeurs et machines
   ========================================================================== */

/* ---------------------------------------------------------- Convoyeurs */
function pointSurChemin(c, t){
  const n = c.chemin.length;
  if (n === 0) return {x:0,y:0};
  if (n === 1) return {x:c.chemin[0].x+0.5, y:c.chemin[0].y+0.5};
  const f = clamp(t,0,1)*(n-1);
  const i = Math.min(n-2, Math.floor(f));
  const k = f-i;
  const a = c.chemin[i], b = c.chemin[i+1];
  return { x: lerp(a.x,b.x,k)+0.5, y: lerp(a.y,b.y,k)+0.5 };
}

function dessinerConvoyeur(c){
  const ch = c.chemin;
  if (!ch.length) return;
  const orphelin = c.etat === "non_relie";

  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(ch[0].x+0.5, ch[0].y+0.5);
  for (let i=1;i<ch.length;i++) ctx.lineTo(ch[i].x+0.5, ch[i].y+0.5);

  // châssis
  ctx.strokeStyle = orphelin ? "#5a3430" : "#2c3036";
  ctx.lineWidth = 0.82; ctx.stroke();
  // bande
  ctx.strokeStyle = orphelin ? "#7a4038" : "#41474e";
  ctx.lineWidth = 0.62; ctx.stroke();

  // défilement de la bande : décalage temporel commun, jamais stocké
  if (vue.zoom > CONFIG.seuilSchema){
    const avance = (vue.temps * CONV.vitesse * 4) % 0.6;
    ctx.strokeStyle = "rgba(0,0,0,.3)";
    ctx.lineWidth = 0.6;
    ctx.setLineDash([0.12, 0.48]);
    ctx.lineDashOffset = -avance;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }
  // rebords
  ctx.strokeStyle = "rgba(255,255,255,.07)";
  ctx.lineWidth = 0.06;
  ctx.stroke();

  if (orphelin){
    const p = pointSurChemin(c, 0.5);
    dessinerAlerte(p.x, p.y, "!", "#e0574a");
    return;
  }

  // Les pièces en transit : positions calculées à partir des colis, jamais
  // stockées dans l'état (§7.2).
  if (vue.zoom > CONFIG.seuilSchema){
    let dessines = 0, bloques = 0;
    for (let i=0; i<c.transit.length && dessines < CONFIG.itemsConvoyeurMax; i++){
      const p = c.transit[i];
      let t;
      if (p.t <= 0){ t = 1 - bloques*0.055; bloques++; }
      else t = 1 - p.t / c.latence;
      // Une vignette par pièce, plafonnée : une bande chargée paraît chargée,
      // une bande à vide paraît vide (§7.2).
      const n = clamp(Math.round(p.qte), 1, 8);
      for (let k=0; k<n && dessines<CONFIG.itemsConvoyeurMax; k++, dessines++){
        const tt = clamp(t - k*0.052, 0, 1);
        const pt = pointSurChemin(c, tt);
        const lat = (bruit(i*13+k*7)-0.5)*0.22;      // léger désordre, déterministe
        dessinerItem(pt.x+lat, pt.y+lat*0.6, 0.44, p.item);
      }
    }
  }
}

/* ------------------------------------------------------------ Machines */
function dessinerMachine(m){
  const d = MACHINES[m.type];
  const x = m.x, y = m.y, l = m.l, h = m.h;
  const produit = m.etat === "produit";

  ctx.save();

  // Vibration d'une machine fatiguée (§3.2)
  if (m.usure > 0.55 && produit){
    const a = (m.usure-0.55)*0.06;
    ctx.translate(Math.sin(vue.temps*47+m.id)*a, Math.cos(vue.temps*53+m.id)*a);
  }

  // Ombre portée
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.fillRect(x+0.09, y+0.14, l, h);

  // Corps en gris acier. Le dégradé ne dépend que de la hauteur : on le garde
  // en mémoire pour ne rien allouer dans la boucle de rendu (§16).
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = gradientCorps(h);
  coinsArrondis(0.06, 0.06, l-0.12, h-0.12, 0.12);
  ctx.fill();
  ctx.restore();

  // Face avant visible, façon vue du dessus légèrement inclinée (§7.3)
  ctx.fillStyle = "#3a3f46";
  coinsArrondis(x+0.06, y+h-0.36, l-0.12, 0.3, 0.08);
  ctx.fill();

  // Bandeau de couleur par fonction
  ctx.fillStyle = d.couleur;
  ctx.fillRect(x+0.14, y+0.14, l-0.28, 0.16);
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.fillRect(x+0.14, y+0.26, l-0.28, 0.04);

  // Détails propres à chaque machine
  if (vue.zoom > CONFIG.seuilSchema) detailMachine(m, d, x, y, l, h, produit);

  // Traces d'huile sur une machine usée
  if (m.usure > 0.35){
    ctx.fillStyle = "rgba(18,14,8," + (m.usure*0.3).toFixed(2) + ")";
    ctx.beginPath(); ctx.ellipse(x+l*0.7, y+h-0.22, 0.28, 0.13, 0, 0, 7); ctx.fill();
  }

  ctx.restore();

  // Tas de pièces devant la machine quand ça bloque en sortie (§3.2)
  dessinerTasSortie(m);

  // Repères d'état
  dessinerEtatMachine(m);

  // Barre de progression discrète
  if (produit && vue.zoom > CONFIG.seuilDetail && m.enCycle){
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(x+0.2, y+h-0.19, l-0.4, 0.08);
    ctx.fillStyle = d.accent;
    ctx.fillRect(x+0.2, y+h-0.19, (l-0.4)*clamp(m.progression,0,1), 0.08);
  }
}

const cacheGradCorps = new Map();
function gradientCorps(h){
  let g = cacheGradCorps.get(h);
  if (!g){
    g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#767c84");
    g.addColorStop(0.55, "#5b6169");
    g.addColorStop(1, "#474d55");
    cacheGradCorps.set(h, g);
  }
  return g;
}

function coinsArrondis(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function detailMachine(m, d, x, y, l, h, produit){
  const cx = x+l/2, cy = y+h/2;
  switch (m.type){

    case "laveuse": {
      // bac d'eau, tambour qui brasse, clapotis
      ctx.fillStyle = "#2e3a44";
      coinsArrondis(x+0.24, y+0.4, l-0.48, h-0.74, 0.08); ctx.fill();
      const eau = ctx.createLinearGradient(0, y+0.4, 0, y+h-0.34);
      eau.addColorStop(0, produit ? "rgba(80,175,225,.75)" : "rgba(70,120,150,.4)");
      eau.addColorStop(1, produit ? "rgba(40,120,180,.75)" : "rgba(50,90,120,.4)");
      ctx.fillStyle = eau;
      coinsArrondis(x+0.3, y+0.46, l-0.6, h-0.86, 0.06); ctx.fill();
      if (produit){
        // rides à la surface, phase déterministe : pas de scintillement
        ctx.strokeStyle = "rgba(255,255,255,.35)";
        ctx.lineWidth = 0.035;
        for (let i=0;i<3;i++){
          const o = Math.sin(vue.temps*2.2 + i*1.7)*0.09;
          ctx.beginPath();
          ctx.moveTo(x+0.36, y+0.66+i*0.28+o);
          ctx.lineTo(x+l-0.36, y+0.66+i*0.28-o);
          ctx.stroke();
        }
        // patates qui tournent dans le bac
        for (let i=0;i<3;i++){
          const a = vue.temps*1.6 + i*2.1;
          dessinerItem(cx + Math.cos(a)*(l*0.2), cy + Math.sin(a)*(h*0.16), 0.34, "pdt_brutes");
        }
      }
      break;
    }

    case "trancheuse": {
      // capot, lame circulaire, rondelles qui tombent
      ctx.fillStyle = "#39404a";
      coinsArrondis(x+0.26, y+0.42, l-0.52, h-0.76, 0.06); ctx.fill();
      const a = produit ? vue.temps*19 : 0;
      ctx.save();
      ctx.translate(cx, cy+0.02); ctx.rotate(a);
      ctx.fillStyle = "#c2cad3";
      ctx.beginPath(); ctx.arc(0,0,0.3,0,7); ctx.fill();
      ctx.strokeStyle = "#8d959e"; ctx.lineWidth = 0.035;
      for (let i=0;i<6;i++){
        const t = i/6*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(t)*0.09, Math.sin(t)*0.09);
        ctx.lineTo(Math.cos(t)*0.3, Math.sin(t)*0.3);
        ctx.stroke();
      }
      ctx.restore();
      if (produit)
        for (let i=0;i<3;i++){
          const p = ((vue.temps*1.5 + i*0.33) % 1);
          dessinerItem(cx + 0.2 + i*0.12, cy + 0.1 + p*0.5, 0.26, "rondelles", 1-p*0.7);
        }
      break;
    }

    case "friteuse": {
      // bain d'huile chaude : bouillonnement et buée
      ctx.fillStyle = "#2f3238";
      coinsArrondis(x+0.2, y+0.4, l-0.4, h-0.72, 0.07); ctx.fill();
      const hu = ctx.createLinearGradient(0, y+0.44, 0, y+h-0.34);
      hu.addColorStop(0, produit ? "rgba(240,185,60,.9)" : "rgba(150,120,55,.55)");
      hu.addColorStop(1, produit ? "rgba(190,125,35,.9)" : "rgba(110,85,40,.55)");
      ctx.fillStyle = hu;
      coinsArrondis(x+0.28, y+0.48, l-0.56, h-0.88, 0.05); ctx.fill();
      if (produit){
        // bulles : position et taille dérivées de l'index, donc stables
        ctx.fillStyle = "rgba(255,240,190,.6)";
        for (let i=0;i<9;i++){
          const bx = x+0.42 + bruit(i*5+m.id)*(l-0.84);
          const mont = ((vue.temps*0.9 + bruit(i*11)) % 1);
          const by = y+h-0.42 - mont*(h-0.95);
          const r = 0.025 + bruit(i*7)*0.035;
          ctx.beginPath(); ctx.arc(bx, by, r*(0.5+mont), 0, 7); ctx.fill();
        }
        // chips qui flottent
        for (let i=0;i<4;i++){
          const d2 = ((vue.temps*0.35 + i*0.25) % 1);
          dessinerItem(x+0.5 + d2*(l-1), cy+0.05 + Math.sin(vue.temps*2+i)*0.06, 0.3, "chips_vrac", 0.9);
        }
        // reflet de chaleur
        ctx.fillStyle = "rgba(255,190,90,.12)";
        coinsArrondis(x+0.2, y+0.4, l-0.4, h-0.72, 0.07); ctx.fill();
      }
      // hotte
      ctx.fillStyle = "#4c525a";
      ctx.fillRect(x+l*0.5-0.3, y+0.1, 0.6, 0.24);
      break;
    }

    case "tambour": {
      // tambour incliné qui tourne, nuage d'arôme
      ctx.fillStyle = "#3a3428";
      coinsArrondis(x+0.24, y+0.42, l-0.48, h-0.76, 0.1); ctx.fill();
      ctx.save();
      ctx.translate(cx, cy+0.02);
      const g2 = ctx.createLinearGradient(0,-0.3,0,0.3);
      g2.addColorStop(0,"#c9a55e"); g2.addColorStop(1,"#8a7038");
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.ellipse(0,0,l*0.3,h*0.2,0,0,7); ctx.fill();
      // cerclages qui défilent = rotation lisible
      ctx.strokeStyle = "rgba(40,32,18,.6)"; ctx.lineWidth = 0.05;
      for (let i=0;i<4;i++){
        const p = ((vue.temps*(produit?0.8:0) + i*0.25) % 1);
        const dx = (p-0.5)*l*0.56;
        ctx.beginPath();
        ctx.ellipse(dx, 0, 0.05, h*0.19, 0, 0, 7);
        ctx.stroke();
      }
      ctx.restore();
      if (produit){
        ctx.fillStyle = "rgba(201,80,46,.16)";
        ctx.beginPath(); ctx.arc(cx, cy, 0.55+Math.abs(Math.sin(vue.temps*2))*0.12, 0, 7); ctx.fill();
      }
      break;
    }

    case "ensacheuse": {
      // colonne verticale : le film descend, le sachet tombe
      ctx.fillStyle = "#2e3238";
      coinsArrondis(x+0.18, y+0.34, l-0.36, h-0.62, 0.08); ctx.fill();
      ctx.fillStyle = "#454c56";
      ctx.fillRect(cx-0.28, y+0.42, 0.56, h-0.9);
      // bobine de film
      dessinerItem(x+0.55, y+0.72, 0.5, "film");
      if (produit){
        ctx.fillStyle = "rgba(196,158,240,.16)";
        coinsArrondis(x+0.18, y+0.34, l-0.36, h-0.62, 0.08); ctx.fill();
        for (let i=0;i<3;i++){
          const p = ((vue.temps*1.1 + i*0.34) % 1);
          dessinerItem(cx, y+0.7 + p*(h-1.15), 0.42, "sachet", 1-p*0.45);
        }
      }
      // mâchoire de soudure
      ctx.fillStyle = "#5a6270";
      ctx.fillRect(cx-0.34, y+h-0.62, 0.68, 0.12);
      break;
    }

    case "caisse": {
      ctx.fillStyle = "#8a6b45";
      coinsArrondis(x+0.12, y+0.12, l-0.24, h-0.24, 0.05); ctx.fill();
      ctx.strokeStyle = "#5f4930"; ctx.lineWidth = 0.07;
      coinsArrondis(x+0.12, y+0.12, l-0.24, h-0.24, 0.05); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x+0.12,y+h/2); ctx.lineTo(x+l-0.12,y+h/2);
      ctx.moveTo(x+l/2,y+0.12); ctx.lineTo(x+l/2,y+h-0.12);
      ctx.stroke();
      const items = Object.keys(m.sortie).filter(k=>m.sortie[k]>0.5);
      if (items.length){
        const total = contenuTotal(m.sortie);
        const n = Math.min(6, Math.ceil(total/120));
        for (let i=0;i<n;i++)
          dessinerItem(x+0.4+bruit(i*5+m.id)*(l-0.8), y+0.4+bruit(i*11+m.id)*(h-0.8), 0.4, items[i%items.length]);
      }
      break;
    }
  }
}

/** Les pièces qui s'entassent devant une machine bloquée. */
function dessinerTasSortie(m){
  const d = MACHINES[m.type];
  if (d.stockage || vue.zoom <= CONFIG.seuilDetail) return;
  const items = Object.keys(m.sortie).filter(k => m.sortie[k] > 0.5);
  if (!items.length) return;
  const total = contenuTotal(m.sortie);
  const n = clamp(Math.round(total/2), 1, 9);
  for (let i=0;i<n;i++){
    const it = items[i % items.length];
    const bx = m.x + 0.3 + bruit(i*3+m.id*7)*(m.l-0.6);
    const by = m.y + m.h + 0.12 + bruit(i*9+m.id)*0.3;
    dessinerItem(bx, by, 0.42, it);
  }
}

/** Icônes flottantes d'état : le diagnostic à l'œil nu (§3.2). */
function dessinerEtatMachine(m){
  if (vue.zoom <= CONFIG.seuilSchema) return;
  const cx = m.x + m.l/2, hy = m.y - 0.34;
  const bat = 0.5 + 0.5*Math.sin(vue.temps*4.5);

  if (m.enPanne){
    ctx.save();
    ctx.globalAlpha = 0.55 + bat*0.45;
    dessinerAlerte(cx, hy, "clé", "#e0574a");
    ctx.restore();
    return;
  }
  if (m.etat === "attente_matiere"){
    // liseré orange clignotant + la pièce qui manque
    ctx.save();
    ctx.globalAlpha = 0.3 + bat*0.55;
    ctx.strokeStyle = "#e8a03c"; ctx.lineWidth = 0.08;
    coinsArrondis(m.x+0.03, m.y+0.03, m.l-0.06, m.h-0.06, 0.14); ctx.stroke();
    ctx.restore();
    const r = recetteDe(m);
    if (r){
      const manquant = r.entrees.find(e => (m.entree[e.id]||0) < e.qte);
      if (manquant){
        const flot = Math.sin(vue.temps*2.4)*0.07;
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = "rgba(18,20,24,.8)";
        ctx.beginPath(); ctx.arc(cx, hy+flot, 0.32, 0, 7); ctx.fill();
        ctx.strokeStyle = "#e8a03c"; ctx.lineWidth = 0.045; ctx.stroke();
        dessinerItem(cx, hy+flot, 0.4, manquant.id);
        ctx.restore();
      }
    }
    return;
  }
  if (m.etat === "sortie_pleine"){
    ctx.save(); ctx.globalAlpha = 0.35 + bat*0.4;
    dessinerAlerte(cx, hy, "plein", "#e8a03c"); ctx.restore();
    return;
  }
  if (m.etat === "sans_operateur"){
    ctx.save(); ctx.globalAlpha = 0.35 + bat*0.35;
    dessinerAlerte(cx, hy, "personne", "#9aa2ac"); ctx.restore();
  }
}

function dessinerAlerte(x, y, sorte, couleur){
  ctx.save();
  ctx.fillStyle = "rgba(16,18,22,.85)";
  ctx.beginPath(); ctx.arc(x,y,0.3,0,7); ctx.fill();
  ctx.strokeStyle = couleur; ctx.lineWidth = 0.05; ctx.stroke();
  ctx.strokeStyle = couleur; ctx.fillStyle = couleur;
  ctx.lineWidth = 0.06; ctx.lineCap = "round";
  if (sorte === "clé"){
    ctx.beginPath(); ctx.arc(x-0.08,y-0.07,0.08,0.6,5.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-0.03,y-0.02); ctx.lineTo(x+0.11,y+0.12); ctx.stroke();
  } else if (sorte === "!"){
    ctx.beginPath(); ctx.moveTo(x,y-0.13); ctx.lineTo(x,y+0.04); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y+0.13,0.032,0,7); ctx.fill();
  } else if (sorte === "plein"){
    for (let i=0;i<3;i++) ctx.fillRect(x-0.13+i*0.1, y-0.02+i*0.03, 0.075, 0.075);
  } else if (sorte === "personne"){
    ctx.beginPath(); ctx.arc(x,y-0.09,0.06,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x,y-0.02); ctx.lineTo(x,y+0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-0.09,y+0.16); ctx.lineTo(x+0.09,y-0.16); ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================================
   RENDU (3/3) — ouvriers, particules, calques, boucle de dessin
   ========================================================================== */

/* -------------------------------------------------------------- Ouvriers */
function dessinerOuvrier(o){
  const marche = (o.etat === "deplace" || o.etat === "porte") && o.chemin && o.chemin.length;
  const bob = marche ? Math.sin(o.phase*0.55)*0.045 : 0;
  const x = o.x, y = o.y + bob;

  // ombre
  ctx.fillStyle = "rgba(0,0,0,.34)";
  ctx.beginPath(); ctx.ellipse(x, y+0.2, 0.2, 0.09, 0, 0, 7); ctx.fill();

  if (vue.zoom <= CONFIG.seuilDetail){
    ctx.fillStyle = "#dcc27a";
    ctx.beginPath(); ctx.arc(x, y, 0.16, 0, 7); ctx.fill();
    return;
  }

  // bras : croisés quand il attend, écartés quand il porte
  ctx.strokeStyle = "#3f6ba8"; ctx.lineWidth = 0.09; ctx.lineCap = "round";
  if (o.etat === "attend" || o.etat === "pause"){
    ctx.beginPath(); ctx.moveTo(x-0.14,y+0.02); ctx.lineTo(x+0.14,y+0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-0.14,y+0.06); ctx.lineTo(x+0.14,y+0.02); ctx.stroke();
  } else {
    const s = marche ? Math.sin(o.phase*0.55)*0.07 : 0;
    ctx.beginPath(); ctx.moveTo(x-0.15,y-0.02+s); ctx.lineTo(x-0.19,y+0.1+s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+0.15,y-0.02-s); ctx.lineTo(x+0.19,y+0.1-s); ctx.stroke();
  }

  // buste (bleu de travail)
  ctx.fillStyle = "#4a79b8";
  coinsArrondis(x-0.15, y-0.12, 0.3, 0.32, 0.09); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.fillRect(x-0.15, y+0.1, 0.3, 0.1);

  // tête + casque
  ctx.fillStyle = "#e0b98d";
  ctx.beginPath(); ctx.arc(x, y-0.13, 0.115, 0, 7); ctx.fill();
  ctx.fillStyle = "#e8c33c";
  ctx.beginPath(); ctx.arc(x, y-0.15, 0.12, Math.PI, 0); ctx.fill();
  ctx.fillRect(x-0.13, y-0.16, 0.26, 0.035);

  // ce qu'il porte
  if (o.charge){
    dessinerItem(x, y-0.42, 0.44, o.charge.item);
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.font = "0.16px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(mesure(o.charge.item, o.charge.qte), x, y-0.62);
  }

  // sueur quand il court partout (§3.2)
  if (o.fatigue > 0.65){
    const a = 0.4 + 0.6*Math.abs(Math.sin(vue.temps*3+o.id));
    ctx.fillStyle = "rgba(120,190,235," + a.toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(x+0.17, y-0.22, 0.045, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+0.17,y-0.3); ctx.lineTo(x+0.2,y-0.24); ctx.lineTo(x+0.14,y-0.24); ctx.closePath(); ctx.fill();
  }
  // petit z de pause
  if (o.etat === "pause"){
    ctx.fillStyle = "rgba(210,220,235,.8)";
    ctx.font = "0.24px Segoe UI, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("z", x+0.18, y-0.3 - (vue.temps*0.4 % 0.3));
  }
  // étincelles au poste de soudure : gérées par les particules
}

/* ------------------------------------------------------------ Particules */
function particule(x, y, sorte){
  if (vue.particules.length >= CONFIG.particulesMax) return;
  const p = { x, y, vx:0, vy:0, vie:1, max:1, sorte, taille:0.1, teinte:0 };
  switch (sorte){
    case "etincelle":
      p.vx = hasard(-1.6,1.6); p.vy = hasard(-1.8,0.4);
      p.max = p.vie = hasard(0.25,0.6); p.taille = hasard(0.02,0.05); break;
    case "fumeeGrise":
      p.vx = hasard(-0.15,0.15); p.vy = hasard(-0.5,-0.2);
      p.max = p.vie = hasard(0.9,1.7); p.taille = hasard(0.1,0.24); break;
    case "fumeeNoire":
      p.vx = hasard(-0.25,0.25); p.vy = hasard(-0.7,-0.3);
      p.max = p.vie = hasard(1.2,2.2); p.taille = hasard(0.14,0.3); break;
    case "vapeur":
      p.vx = hasard(-0.4,0.4); p.vy = hasard(-0.3,-0.05);
      p.max = p.vie = hasard(0.5,1.1); p.taille = hasard(0.12,0.26); break;
    case "poussiere":
      p.vx = hasard(-0.8,0.8); p.vy = hasard(-0.8,-0.1);
      p.max = p.vie = hasard(0.4,0.9); p.taille = hasard(0.05,0.13); break;
    case "goutte":
      p.vx = hasard(-1.1,1.1); p.vy = hasard(-1.5,-0.3);
      p.max = p.vie = hasard(0.3,0.6); p.taille = hasard(0.02,0.05); break;
    case "poudre":
      p.vx = hasard(-0.5,0.5); p.vy = hasard(-0.45,-0.1);
      p.max = p.vie = hasard(0.6,1.2); p.taille = hasard(0.04,0.1); break;
    case "souffle":
      p.vx = hasard(-1.4,1.4); p.vy = hasard(-0.3,0.3);
      p.max = p.vie = hasard(0.2,0.45); p.taille = hasard(0.08,0.18); break;
    case "eclat":
      p.vx = hasard(-1.2,1.2); p.vy = hasard(-1.4,-0.2);
      p.max = p.vie = hasard(0.3,0.7); p.taille = hasard(0.03,0.07); break;
  }
  vue.particules.push(p);
}

function majParticules(dts){
  const P = vue.particules;
  for (let i=P.length-1; i>=0; i--){
    const p = P[i];
    p.vie -= dts;
    if (p.vie <= 0){ P[i] = P[P.length-1]; P.pop(); continue; }
    p.x += p.vx*dts; p.y += p.vy*dts;
    if (p.sorte === "etincelle" || p.sorte === "eclat") p.vy += 3.4*dts;
    else p.vy -= 0.25*dts;
    p.vx *= (1 - 1.6*dts);
  }
  // textes qui montent
  const F = vue.flottants;
  for (let i=F.length-1; i>=0; i--){
    const f = F[i];
    f.vie -= dts;
    f.y -= dts*0.75;
    if (f.vie <= 0){ F[i] = F[F.length-1]; F.pop(); }
  }
}

function dessinerParticules(){
  for (const p of vue.particules){
    const a = clamp(p.vie/p.max, 0, 1);
    switch (p.sorte){
      case "etincelle":
        ctx.fillStyle = "rgba(255," + Math.round(200+55*a) + "," + Math.round(90*a) + "," + a.toFixed(2) + ")";
        ctx.fillRect(p.x, p.y, p.taille, p.taille); break;
      case "eclat":
        ctx.fillStyle = "rgba(220,230,240," + (a*0.8).toFixed(2) + ")";
        ctx.fillRect(p.x, p.y, p.taille, p.taille); break;
      case "fumeeNoire":
        ctx.fillStyle = "rgba(24,24,26," + (a*0.55).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
      case "fumeeGrise":
        ctx.fillStyle = "rgba(150,152,156," + (a*0.32).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
      case "vapeur":
        ctx.fillStyle = "rgba(232,236,240," + (a*0.26).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
      case "poussiere":
        ctx.fillStyle = "rgba(140,132,118," + (a*0.4).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille,0,7); ctx.fill(); break;
      case "goutte":
        ctx.fillStyle = "rgba(150,205,240," + (a*0.7).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille,0,7); ctx.fill(); break;
      case "poudre":
        ctx.fillStyle = "rgba(201,110,60," + (a*0.38).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(1.6-a),0,7); ctx.fill(); break;
      case "souffle":
        ctx.fillStyle = "rgba(220,225,235," + (a*0.22).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
    }
  }
}

function flottant(x, y, texte, couleur){
  if (vue.flottants.length > 24) vue.flottants.shift();
  vue.flottants.push({ x, y, texte, couleur, vie:1.8 });
}

function dessinerFlottants(){
  ecranSeul();
  ctx.textAlign = "center";
  for (const f of vue.flottants){
    const e = mondeVersEcran(f.x, f.y);
    const a = clamp(f.vie/1.8, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = "700 " + Math.round(13*Math.min(1.3, vue.zoom)) + "px Segoe UI, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillText(f.texte, e.x+1, e.y+1);
    ctx.fillStyle = f.couleur;
    ctx.fillText(f.texte, e.x, e.y);
  }
  ctx.globalAlpha = 1;
  appliquerCamera();
}

/** Effets déclenchés par la simulation, pas par le rendu. */
function effetProduction(m, r){
  const cx = m.x+m.l/2, cy = m.y+m.h/2;
  if (m.type === "friteuse")   for (let i=0;i<8;i++) particule(cx+hasard(-0.6,0.6), cy-0.1, "vapeur");
  if (m.type === "laveuse")    for (let i=0;i<5;i++) particule(cx+hasard(-0.3,0.3), cy, "goutte");
  if (m.type === "trancheuse") for (let i=0;i<4;i++) particule(cx+hasard(-0.2,0.2), cy, "eclat");
  if (m.type === "tambour")    for (let i=0;i<5;i++) particule(cx+hasard(-0.3,0.3), cy, "poudre");
  if (m.type === "ensacheuse") for (let i=0;i<3;i++) particule(cx, cy, "souffle");
  son(m.type);
  if (ITEMS[r.sortie.id].cat === "produit"){
    flottant(m.x+m.l/2, m.y-0.2, "+" + mesure(r.sortie.id, r.sortie.qte), "#8fe09c");
    son("valide");
  }
}

/** Fumée continue des machines fatiguées ou en panne. */
function fumeeMachines(dts){
  for (const m of U().machines){
    if (m.enPanne){
      if (Math.random() < dts*7) particule(m.x+m.l*0.7, m.y+0.3, "fumeeNoire");
    } else if (m.usure > 0.5 && m.etat === "produit"){
      if (Math.random() < dts*(m.usure-0.5)*7) particule(m.x+m.l*0.7, m.y+0.3, "fumeeGrise");
    }
  }
}

/* ------------------------------------------------- Aperçu de construction */
function dessinerApercu(){
  if (!vue.outil || !vue.souris.dedans) return;
  const u = U();
  const tx = vue.souris.tx, ty = vue.souris.ty;

  if (vue.outil.type === "machine"){
    const d = MACHINES[vue.outil.id];
    const tourne = vue.rotation % 2 === 1;
    const l = tourne ? d.h : d.l, h = tourne ? d.l : d.h;
    const ok = peutPoser(u, vue.outil.id, tx, ty, vue.rotation) && etat.finances.solde >= d.cout;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = ok ? "rgba(92,186,107,.45)" : "rgba(224,87,74,.45)";
    ctx.fillRect(tx,ty,l,h);
    ctx.strokeStyle = ok ? "#5cba6b" : "#e0574a";
    ctx.lineWidth = 0.07;
    ctx.strokeRect(tx,ty,l,h);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = d.couleur;
    ctx.fillRect(tx+0.14, ty+0.14, l-0.28, 0.16);
    ctx.restore();
  }
  else if (vue.outil.type === "convoyeur"){
    const trace = vue.traceConvoyeur;
    if (trace && trace.length){
      for (const t of trace){
        const libre = occupant(u,t.x,t.y) === 0;
        ctx.fillStyle = libre ? "rgba(92,186,107,.4)" : "rgba(224,87,74,.4)";
        ctx.fillRect(t.x,t.y,1,1);
      }
    } else {
      const libre = dansGrille(u,tx,ty) && occupant(u,tx,ty) === 0;
      ctx.fillStyle = libre ? "rgba(92,186,107,.35)" : "rgba(224,87,74,.35)";
      ctx.fillRect(tx,ty,1,1);
    }
  }
  else if (vue.outil.type === "pioche"){
    const o = occupant(u,tx,ty);
    if (o > 1){
      const n = noeudParId(o);
      ctx.fillStyle = "rgba(224,87,74,.3)";
      if (n && n.type === "convoyeur") for (const t of n.chemin) ctx.fillRect(t.x,t.y,1,1);
      else if (n) ctx.fillRect(n.x,n.y,n.l,n.h);
    }
  }
}

/* ---------------------------------------------------- Sélection et survol */
function dessinerSelection(){
  const n = vue.selection ? noeudParId(vue.selection) : null;
  if (n && n.type !== "convoyeur"){
    ctx.strokeStyle = "#f0b429"; ctx.lineWidth = 0.075;
    ctx.setLineDash([0.3,0.18]);
    ctx.lineDashOffset = -vue.temps*1.2;
    ctx.strokeRect(n.x-0.08, n.y-0.08, n.l+0.16, n.h+0.16);
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  } else if (n && n.type === "convoyeur"){
    ctx.strokeStyle = "#f0b429"; ctx.lineWidth = 0.1;
    ctx.beginPath();
    ctx.moveTo(n.chemin[0].x+0.5, n.chemin[0].y+0.5);
    for (let i=1;i<n.chemin.length;i++) ctx.lineTo(n.chemin[i].x+0.5, n.chemin[i].y+0.5);
    ctx.stroke();
  }
  const s = vue.survol;
  if (s && s.id !== vue.selection && s.type !== "convoyeur"){
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 0.05;
    ctx.strokeRect(s.x-0.05, s.y-0.05, s.l+0.1, s.h+0.1);
  }
}

/* ------------------------------------------------------- Lumière du jour */
function dessinerLumiere(){
  const t = minuteDuJour() / CONFIG.minutesParJour;
  // matin chaud, journée neutre, fin d'après-midi bleutée
  let r,g,b,a;
  if (t < 0.18){ const k = t/0.18; r=255;g=190;b=120; a=0.22*(1-k); }
  else if (t > 0.78){ const k=(t-0.78)/0.22; r=70;g=95;b=160; a=0.3*k; }
  else { r=255;g=255;b=255; a=0; }

  ecranSeul();
  if (a > 0.005){
    ctx.globalCompositeOperation = "overlay";
    ctx.fillStyle = "rgba("+r+","+g+","+b+","+a.toFixed(3)+")";
    ctx.fillRect(0,0,largeurVue,hauteurVue);
    ctx.globalCompositeOperation = "source-over";
  }
  // vignette (dégradé mis en cache au redimensionnement)
  if (gradVignette){
    ctx.fillStyle = gradVignette;
    ctx.fillRect(0,0,largeurVue,hauteurVue);
  }
  appliquerCamera();
}

/** Halos chauds des lampes d'atelier. */
function dessinerLampes(){
  const u = U();
  const t = minuteDuJour()/CONFIG.minutesParJour;
  const force = clamp((t-0.65)/0.35, 0, 1)*0.5 + 0.12;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.13*force;
  for (let y=3; y<u.hauteur; y+=6)
    for (let x=3; x<u.largeur; x+=6)
      ctx.drawImage(spriteHalo, x-3.6, y-3.6, 7.2, 7.2);
  ctx.restore();
}

/* ------------------------------------------------------- Vue schématique */
function dessinerSchema(){
  const u = U();
  ctx.fillStyle = "#22262c";
  ctx.fillRect(0,0,u.largeur,u.hauteur);
  ctx.strokeStyle = "rgba(255,255,255,.06)"; ctx.lineWidth = 0.04;
  ctx.strokeRect(0,0,u.largeur,u.hauteur);

  // flux : épaisseur proportionnelle au débit
  for (const c of u.convoyeurs){
    const e = clamp(0.12 + c.debitActuel/60, 0.12, 0.7);
    ctx.strokeStyle = c.etat === "non_relie" ? "#7a4038" : "rgba(240,180,41,.7)";
    ctx.lineWidth = e; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(c.chemin[0].x+0.5, c.chemin[0].y+0.5);
    for (let i=1;i<c.chemin.length;i++) ctx.lineTo(c.chemin[i].x+0.5, c.chemin[i].y+0.5);
    ctx.stroke();
  }
  // machines en blocs colorés
  for (const m of u.machines){
    const d = MACHINES[m.type];
    ctx.fillStyle = d.couleur;
    ctx.globalAlpha = m.etat === "produit" ? 1 : 0.45;
    ctx.fillRect(m.x+0.1, m.y+0.1, m.l-0.2, m.h-0.2);
    ctx.globalAlpha = 1;
    if (m.enPanne || m.etat === "attente_matiere"){
      ctx.strokeStyle = m.enPanne ? "#e0574a" : "#e8a03c";
      ctx.lineWidth = 0.12;
      ctx.strokeRect(m.x+0.1, m.y+0.1, m.l-0.2, m.h-0.2);
    }
  }
  const q = u.quai;
  ctx.fillStyle = "#e2b62c";
  ctx.fillRect(q.x+0.1,q.y+0.1,q.l-0.2,q.h-0.2);
}

/* ============================================================ Boucle dessin */
function dessiner(){
  if (!etat) return;
  const u = U();

  if (vue.zoom < CONFIG.seuilSchema){
    ecranSeul();
    ctx.fillStyle = "#101215"; ctx.fillRect(0,0,largeurVue,hauteurVue);
    appliquerCamera();
    dessinerSchema();
    dessinerApercu();
    dessinerSelection();
    dessinerFlottants();
    return;
  }

  dessinerSol();
  dessinerLampes();
  dessinerQuai();

  for (const c of u.convoyeurs) dessinerConvoyeur(c);

  // les machines les plus basses passent devant : tri par y
  const ms = u.machines;
  for (let i=1;i<ms.length;i++){                     // tri par insertion, tableaux courts
    const m = ms[i]; let j = i-1;
    while (j>=0 && ms[j].y > m.y){ ms[j+1] = ms[j]; j--; }
    ms[j+1] = m;
  }
  for (const m of ms) dessinerMachine(m);

  for (const o of u.ouvriers) dessinerOuvrier(o);

  dessinerParticules();
  dessinerApercu();
  dessinerSelection();
  dessinerLumiere();
  dessinerFlottants();
}

/* ============================================================================
   UI (1/3) — bandeau, notifications, contremaître, construction, souris
   ========================================================================== */

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* --------------------------------------------------------------- Bandeau */
function majBandeau(){
  if (!etat) return;
  const s = etat.finances.solde;
  const vA = $("#indArgent .val");
  vA.textContent = euros(s);
  vA.className = "val " + (s < 0 ? "neg" : (s > CONFIG.argentDepart ? "pos" : ""));
  $("#indDate .val").textContent = texteDate();

  // Commande en cours : la plus urgente
  const acc = etat.contrats.acceptes.slice().sort((a,b)=>a.dateLimite-b.dateLimite)[0];
  $("#indCommande .val").textContent = acc
    ? mesure(acc.produitId, Math.max(0, acc.quantite-acc.livre)) + " " + nomItem(acc.produitId, 2, true, true) + " · " + resteJours(acc)
    : "aucune";

  // Le bandeau grandit avec le joueur (§3.3)
  const age = etat.meta.age;
  basculer("#indStock", age >= 2);
  basculer("#indReput", age >= 2);
  basculer("#indPerso", age >= 2);
  if (age >= 2){
    const u = U();
    // On montre le produit fini le plus abondant, avec sa vraie unité.
    const finis = Object.keys(u.stocks).filter(k => ITEMS[k].cat === "produit" && u.stocks[k] >= 1)
                        .sort((a,b) => u.stocks[b]-u.stocks[a]);
    $("#indStock .val").textContent = finis.length
      ? quantiteItem(finis[0], u.stocks[finis[0]], true) : "rien de prêt";
    $("#indReput .val").textContent = Math.round(etat.reputation) + " / 100";
    $("#indPerso .val").textContent = u.ouvriers.length + " " + pluriel(u.ouvriers.length,"personne");
  }
  $$("#vitesses button").forEach(b => b.classList.toggle("actif", +b.dataset.v === etat.meta.vitesse));
}
function basculer(sel, montrer){ $(sel).classList.toggle("hidden", !montrer); }

function resteJours(c){
  const r = c.dateLimite - jourCourant();
  if (r < 0) return "en retard";
  if (r === 0) return "aujourd'hui";
  return "dans " + r + " " + pluriel(r,"jour");
}

/* --------------------------------------------------------- Notifications */
function notif(titre, texte, sorte){
  const d = document.createElement("div");
  d.className = "notif " + (sorte||"");
  d.innerHTML = "<b></b><span></span>";
  d.querySelector("b").textContent = titre;
  d.querySelector("span").textContent = texte;
  const z = $("#notifs");
  z.appendChild(d);
  while (z.children.length > 3) z.removeChild(z.firstChild);
  setTimeout(() => {
    d.classList.add("part");
    setTimeout(() => d.remove(), 320);
  }, 6000);
}

/* ---------------------------------------------------------- Contremaître */
let bulleTimer = null;
function parle(texte, duree){
  $("#bulleTexte").textContent = texte;
  $("#contremaitre").classList.remove("muet");
  clearTimeout(bulleTimer);
  bulleTimer = setTimeout(() => $("#contremaitre").classList.add("muet"), duree || 9000);
}

/** Répliques contextuelles. Trois phrases maximum, jamais de jargon (§9.3). */
function paroleContexte(cle, d){
  const p = {
    debut:      "Patron, on démarre. Une laveuse, une trancheuse, une friteuse, et on sort nos premiers kilos.",
    panne:      d.machine + " vient de lâcher. Un clic dessus et je vais la remettre en route.",
    retard:     "On est en retard chez " + d.client + ". Chaque jour qui passe nous coûte de l'argent.",
    banque:     "La banque nous a pris une machine. Faut redresser la caisse, patron.",
    age2:       "On a cassé le mur du fond. Convoyeurs, tambour d'assaisonnement, ensacheuse — et le sachet, qui rapporte bien plus que le vrac.",
    fin_contenu:"Voilà, on a fait le tour de ce qui est bâti. L'hygiène, la saison, les autres sites : ça viendra. En attendant, faites tourner."
  }[cle];
  if (p) parle(p, 12000);
}

/** Le diagnostic à la demande : le contremaître lit l'usine pour le joueur. */
function conseil(){
  const u = U();
  const c = [];

  if (!u.machines.length) return parle("On n'a rien posé. Une laveuse, une trancheuse, une friteuse — dans cet ordre.");

  const enPanne = u.machines.find(m => m.enPanne);
  if (enPanne) return parle(MACHINES[enPanne.type].nom + " est en panne. Cliquez dessus, je m'en occupe tout de suite.");

  if (etat.finances.solde < 0)
    c.push("La caisse est dans le rouge. Vendez du stock ou allez voir une banque, mais faites quelque chose.");

  // Le poste qui bloque toute la chaîne
  const bloquees = u.machines.filter(m => m.etat === "attente_matiere");
  if (bloquees.length){
    const m = bloquees[0];
    const r = recetteDe(m);
    const manque = r.entrees.find(e => (m.entree[e.id]||0) < e.qte);
    if (manque){
      const fournisseur = u.machines.find(x => recetteDe(x)?.sortie.id === manque.id);
      if (fournisseur)
        c.push(MACHINES[m.type].nom + " attend des " + nomItem(manque.id, 2, true, true) + ". " +
               MACHINES[fournisseur.type].nom + " n'arrive pas à suivre — il en faudrait une deuxième.");
      else if (ITEMS[manque.id].achat)
        c.push("On n'a plus " + deDe(nomItem(manque.id,2,true,true)) + nomItem(manque.id, 2, true, true) + ". Faut en racheter, sinon " + MACHINES[m.type].nom + " tourne dans le vide.");
      else
        c.push(MACHINES[m.type].nom + " attend des " + nomItem(manque.id, 2, true, true) + ", et personne n'en fait.");
    }
  }

  const pleines = u.machines.filter(m => m.etat === "sortie_pleine");
  if (pleines.length) c.push("Ça s'entasse devant " + MACHINES[pleines[0].type].nom + ". L'aval ne consomme pas assez.");

  const sansOp = u.machines.filter(m => m.etat === "sans_operateur");
  if (sansOp.length && u.ouvriers.length < 4)
    c.push("Il n'y a personne sur " + MACHINES[sansOp[0].type].nom + ". À un seul, on court partout — embauchez.");

  const usees = u.machines.filter(m => m.usure > 0.65);
  if (usees.length) c.push(MACHINES[usees[0].type].nom + " grince sérieusement. Une révision avant qu'elle casse ?");

  const moralBas = u.ouvriers.filter(o => o.moral < 0.35);
  if (moralBas.length) c.push("L'équipe fait la tête. " + moralBas[0].prenom + " parle de partir.");

  if (!etat.contrats.acceptes.length && etat.meta.age >= 1)
    c.push("On n'a aucune commande en cours. Vendredi soir, prenez-en une.");

  if (!c.length){
    const p = progressionObjectif();

}

/* ------------------------------------------------- Barre de construction */
function majBarreConstruction(){
  const b = $("#barreBasse");
  b.innerHTML = "";
  const cats = [
    { id:"machines", nom:"Machines" },
    { id:"convoyeurs", nom:"Convoyeurs" },
    { id:"stockage", nom:"Stockage" },
    { id:"outils", nom:"Outils" }
  ];
  for (const cat of cats){
    const outils = [];
    if (cat.id === "convoyeurs"){
      outils.push({ type:"convoyeur", id:"convoyeur", nom:"Convoyeur", prix:CONV.coutParTuile+" €/tuile",
                    couleur:"#41474e", verrou:!debloque("convoyeur") });
    } else if (cat.id === "outils"){
      outils.push({ type:"pioche", id:"pioche", nom:"Démolir", prix:"+60 %", couleur:"#e0574a", verrou:false });
    } else {
      for (const k in MACHINES){
        const d = MACHINES[k];
        if (d.cat !== cat.id) continue;
        outils.push({ type:"machine", id:k, nom:d.nom, prix:nb(d.cout)+" €", couleur:d.couleur,
                      verrou: d.ageMin > etat.meta.age || (d.ageMin > 1 && !debloque(k)),
                      cher: etat.finances.solde < d.cout });
      }
    }
    if (!outils.length) continue;
    const bloc = document.createElement("div");
    bloc.className = "catBloc";
    bloc.innerHTML = '<div class="catTitre">'+cat.nom+'</div><div class="catOutils"></div>';
    const zone = bloc.querySelector(".catOutils");
    for (const o of outils){
      const bt = document.createElement("button");
      bt.className = "outil" + (o.verrou?" verrou":"") + (o.cher?" cher":"");
      bt.innerHTML = '<span class="glyphe"></span><span class="nom"></span><span class="prix"></span>';
      bt.querySelector(".glyphe").style.background =
        "linear-gradient(180deg,"+o.couleur+",rgba(0,0,0,.45))";
      bt.querySelector(".nom").textContent = o.nom;
      bt.querySelector(".prix").textContent = o.prix;
      bt.dataset.type = o.type; bt.dataset.id = o.id;
      if (o.verrou) bt.title = "Débloqué plus tard";
      else bt.onclick = () => choisirOutil(o.type, o.id);
      zone.appendChild(bt);
    }
    b.appendChild(bloc);
  }
  majOutilActif();
}

function choisirOutil(type, id){
  if (vue.outil && vue.outil.type === type && vue.outil.id === id){ annulerOutil(); return; }
  vue.outil = { type, id };
  vue.rotation = 0;
  vue.traceConvoyeur = null;
  majOutilActif();
}
function annulerOutil(){
  vue.outil = null; vue.traceConvoyeur = null;
  majOutilActif();
}
function majOutilActif(){
  $$("#barreBasse .outil").forEach(b => {
    b.classList.toggle("actif", !!vue.outil && b.dataset.type === vue.outil.type && b.dataset.id === vue.outil.id);
  });
}

/* ------------------------------------------------------------ Infobulle */
function majInfobulle(){
  const ib = $("#infobulle");
  const n = vue.survol;
  if (!n || vue.outil){ ib.style.display = "none"; return; }

  let t = "", d = "", e = "";
  if (estQuai(n)){
    t = "Quai";
    d = "Les matières arrivent ici, les vélos en repartent.";
    const finis = Object.keys(U().stocks).filter(k=>ITEMS[k].cat==="produit" && U().stocks[k]>=1)
                        .sort((a,b)=>U().stocks[b]-U().stocks[a]);
    e = finis.length ? quantiteItem(finis[0], U().stocks[finis[0]], true) + " prêts à partir" : "rien de prêt à partir";
  } else if (n.type === "convoyeur"){
    t = "Convoyeur";
    d = n.chemin.length + " tuiles";
    e = n.etat === "non_relie" ? "Ne relie rien : il manque une machine à un bout."
      : (n.debitActuel > 0.5 ? "Il passe " + Math.round(n.debitActuel) + " par jour" : "Rien ne passe pour le moment");
  } else {
    const def = MACHINES[n.type];
    t = def.nom;
    const r = recetteDe(n);
    d = def.stockage ? "Contient " + Math.round(contenuTotal(n.sortie)) + " unités"
                     : (r ? r.nom + " · " + mesure(r.sortie.id, n.debitReel) + " par jour" : "Rien de programmé");
    e = phraseEtat(n);
  }
  ib.innerHTML = '<div class="t"></div><div class="d"></div><div class="e"></div>';
  ib.querySelector(".t").textContent = t;
  ib.querySelector(".d").textContent = d;
  ib.querySelector(".e").textContent = e;
  ib.style.display = "block";
  const r = $("#cadreVue").getBoundingClientRect();
  let x = vue.souris.x + 16, y = vue.souris.y + 16;
  if (x + 260 > r.width) x = vue.souris.x - 268;
  if (y + 90 > r.height) y = vue.souris.y - 96;
  ib.style.left = x+"px"; ib.style.top = y+"px";
}

function phraseEtat(m){
  if (m.enPanne) return "En panne — cliquez pour la réparer";
  if (MACHINES[m.type].stockage) return "";
  switch (m.etat){
    case "produit": return m.usure > 0.6 ? "Tourne, mais elle fatigue" : "Tourne bien";
    case "attente_matiere": {
      const r = recetteDe(m);
      const e = r && r.entrees.find(x => (m.entree[x.id]||0) < x.qte);
      return e ? "Attend des " + nomItem(e.id, 2, true, true) : "Attend de la matière";
    }
    case "sortie_pleine": return "Bloquée : ça s'entasse devant";
    case "sans_operateur": return "Personne dessus";
    default: return "À l'arrêt";
  }
}

/* --------------------------------------------------------------- Souris */
function noeudSous(x, y){
  const u = U();
  const o = occupant(u, x, y);
  if (o === 0 || o === -1) return null;
  if (o === 1) return noeudQuai(u);
  return noeudParId(o);
}

function initSouris(){
  const c = $("#vue");

  c.addEventListener("mousemove", ev => {
    const r = c.getBoundingClientRect();
    vue.souris.x = ev.clientX - r.left;
    vue.souris.y = ev.clientY - r.top;
    vue.souris.dedans = true;
    const m = ecranVersMonde(vue.souris.x, vue.souris.y);
    vue.souris.tx = Math.floor(m.x); vue.souris.ty = Math.floor(m.y);

    if (vue.glisse && vue.glisse.type === "cam"){
      const t = T();
      vue.camX = vue.glisse.camX - (vue.souris.x - vue.glisse.x)/t;
      vue.camY = vue.glisse.camY - (vue.souris.y - vue.glisse.y)/t;
      vue.glisse.bouge = true;
      return;
    }
    if (vue.glisse && vue.glisse.type === "conv"){
      etendreTrace(vue.souris.tx, vue.souris.ty);
      return;
    }
    if (vue.glisse && vue.glisse.type === "poseSerie" && vue.outil?.type === "machine"){
      // maintien du clic : pose en série
      poserMachine(vue.outil.id, vue.souris.tx, vue.souris.ty, vue.rotation);
      return;
    }

    vue.survol = noeudSous(vue.souris.tx, vue.souris.ty);
    majInfobulle();
  });

  c.addEventListener("mouseleave", () => {
    vue.souris.dedans = false; vue.survol = null;
    $("#infobulle").style.display = "none";
  });

  c.addEventListener("mousedown", ev => {
    const r = c.getBoundingClientRect();
    vue.souris.x = ev.clientX - r.left; vue.souris.y = ev.clientY - r.top;
    const m = ecranVersMonde(vue.souris.x, vue.souris.y);
    const tx = Math.floor(m.x), ty = Math.floor(m.y);

    if (ev.button === 2){
      vue.glisse = { type:"cam", x:vue.souris.x, y:vue.souris.y, camX:vue.camX, camY:vue.camY, bouge:false };
      c.classList.add("deplace");
      return;
    }
    if (ev.button !== 0) return;

    if (vue.outil){
      if (vue.outil.type === "machine"){
        if (poserMachine(vue.outil.id, tx, ty, vue.rotation)){
          vue.glisse = { type:"poseSerie" };
          majBarreConstruction();
          majPanneau();
        } else son("refus");
      } else if (vue.outil.type === "convoyeur"){
        vue.glisse = { type:"conv" };
        vue.traceConvoyeur = [{x:tx,y:ty}];
      } else if (vue.outil.type === "pioche"){
        const n = noeudSous(tx,ty);
        if (n && !estQuai(n)){ demolir(n); majBarreConstruction(); majPanneau(); }
      }
      return;
    }

    // Sélection
    const n = noeudSous(tx,ty);
    if (n){
      if (n.enPanne){ reparerMachine(n); }
      vue.selection = estQuai(n) ? 1 : n.id;
      vue.ongletActif = "detail";
      majOnglets();
    } else {
      vue.selection = null;
    }
    majPanneau();
  });

  window.addEventListener("mouseup", ev => {
    if (vue.glisse && vue.glisse.type === "conv"){
      validerTrace();
      vue.traceConvoyeur = null;
    }
    if (vue.glisse && vue.glisse.type === "cam" && !vue.glisse.bouge){
      // clic droit sans déplacement : on démolit
      const n = noeudSous(vue.souris.tx, vue.souris.ty);
      if (n && !estQuai(n)){ demolir(n); majBarreConstruction(); majPanneau(); }
      else if (vue.outil) annulerOutil();
    }
    vue.glisse = null;
    c.classList.remove("deplace");
  });

  c.addEventListener("contextmenu", e => e.preventDefault());

  c.addEventListener("wheel", ev => {
    ev.preventDefault();
    const avant = ecranVersMonde(vue.souris.x, vue.souris.y);
    const f = ev.deltaY < 0 ? 1.12 : 1/1.12;
    vue.zoom = clamp(vue.zoom*f, CONFIG.zoomMin, CONFIG.zoomMax);
    const apres = ecranVersMonde(vue.souris.x, vue.souris.y);
    vue.camX += avant.x - apres.x;
    vue.camY += avant.y - apres.y;
  }, { passive:false });
}

/* ------------------------------------------------- Tracé d'un convoyeur */
function etendreTrace(tx, ty){
  const tr = vue.traceConvoyeur;
  if (!tr || !tr.length) return;
  let d = tr[tr.length-1];
  let garde = 0;
  while ((d.x !== tx || d.y !== ty) && garde++ < 200){
    const nx = d.x + Math.sign(tx-d.x);
    const ny = d.y + Math.sign(ty-d.y);
    // on avance d'abord en x, puis en y : tracé en L, comme une vraie ligne
    const suiv = (d.x !== tx) ? { x:nx, y:d.y } : { x:d.x, y:ny };
    if (tr.some(p => p.x === suiv.x && p.y === suiv.y)) break;
    tr.push(suiv);
    d = suiv;
  }
}

function validerTrace(){
  const tr = vue.traceConvoyeur;
  if (!tr || tr.length < 2){ return; }
  const u = U();
  const tuiles = tr.filter(t => dansGrille(u,t.x,t.y) && occupant(u,t.x,t.y) === 0);
  if (tuiles.length < 2){ notif("Impossible", "Il faut deux tuiles libres au moins.", "ko"); son("refus"); return; }

  const cout = tuiles.length * CONV.coutParTuile;
  if (etat.finances.solde - cout < CONFIG.faillite){ notif("Trop cher", "Pas assez en caisse.", "ko"); return; }

  const src = voisinNoeud(tuiles[0], tuiles[1]);
  const dst = voisinNoeud(tuiles[tuiles.length-1], tuiles[tuiles.length-2]);

  const c = creerConvoyeur(tuiles, src ? src.id : 0, dst ? dst.id : 0);
  if (!src || !dst) c.etat = "non_relie";
  u.convoyeurs.push(c);
  for (const t of tuiles) u.grille[t.y*u.largeur+t.x] = c.id;
  depenser(cout, "investissement");
  reindexer();
  son("pose");
  if (!src || !dst)
    notif("Convoyeur posé", "Il ne relie rien pour l'instant : il faut une machine ou le quai à chaque bout.", "att");
  tutoEvenement("pose_convoyeur");
  majPanneau();
}

/** Cherche une machine, une caisse ou le quai au contact d'une tuile. */
function voisinNoeud(t, exclure){
  const u = U();
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for (const [dx,dy] of dirs){
    const x = t.x+dx, y = t.y+dy;
    if (exclure && x === exclure.x && y === exclure.y) continue;
    const o = occupant(u,x,y);
    if (o === 1) return noeudQuai(u);
    if (o > 1){
      const n = noeudParId(o);
      if (n && n.type !== "convoyeur") return n;
    }
  }
  return null;
}

/* ============================================================================

   ========================================================================== */

function majOnglets(){
  $$("#onglets button").forEach(b => b.classList.toggle("actif", b.dataset.o === vue.ongletActif));
}

function majPanneau(){
  if (!etat) return;
  const z = $("#contenuPanneau");
  // Le panneau se rafraîchit en continu : on ne détruit pas ce que le joueur
  // est en train de manipuler, et on lui rend sa position de défilement.
  if (z.contains(document.activeElement) && document.activeElement !== document.body) return;
  const defilement = z.scrollTop;
  z.innerHTML = "";
  switch (vue.ongletActif){
    case "detail":    panneauDetail(z); break;
    case "stocks":    panneauStocks(z); break;
    case "perso":     panneauPersonnel(z); break;
    case "commandes": panneauCommandes(z); break;
    case "finances":  panneauFinances(z); break;
  }
  z.scrollTop = defilement;
}

function elem(html){
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}
function bouton(texte, action, classe){
  const b = document.createElement("button");
  b.className = "bt " + (classe||"");
  b.textContent = texte;
  b.onclick = action;
  return b;
}
function ligne(k, v, classe){
  const d = document.createElement("div");
  d.className = "ligne";
  d.innerHTML = '<span class="k"></span><span class="v '+(classe||"")+'"></span>';
  d.querySelector(".k").textContent = k;
  d.querySelector(".v").textContent = v;
  return d;
}
function blocTitre(titre){
  const d = document.createElement("div");
  d.className = "bloc";
  if (titre){ const h = document.createElement("h3"); h.textContent = titre; d.appendChild(h); }
  return d;
}

function usureTexte(u){
  if (u < 0.2) return "Comme neuve.";
  if (u < 0.45) return "Rien à signaler.";
  if (u < 0.65) return "Elle commence à faire du bruit.";
  if (u < 0.85) return "Elle grince sérieusement — elle va lâcher.";
  return "Elle tient par miracle.";
}
function niveauTexte(o, typeMachine){
  const c = o.competences[COMP_MACHINE[typeMachine]] ?? 0.5;
  if (c < 0.35) return o.prenom + " débute encore sur ce poste";
  if (c < 0.55) return "se débrouille";
  if (c < 0.75) return "bon sur ce poste";
  return "c'est son métier";
}

function motCompetence(c){
  if (c < 0.3) return "débute";
  if (c < 0.5) return "correct";
  if (c < 0.7) return "bon";
  if (c < 0.85) return "très bon";
  return "expert";
}
const NOM_COMPETENCE = { lavage:"Lavage", decoupe:"Tranchage", friture:"Friture",
                         assaisonnement:"Assaisonnement", emballage:"Emballage" };

function resumeCompetences(o){
  const best = Object.keys(o.competences).sort((a,b)=>o.competences[b]-o.competences[a]);
  const mot = k => (NOM_COMPETENCE[k]||k).toLowerCase();
  return "Surtout " + mot(best[0]) + " (" + motCompetence(o.competences[best[0]]) + "), " +
         mot(best[1]) + " (" + motCompetence(o.competences[best[1]]) + ").";
}
function texteEtatOuvrier(o){
  switch (o.etat){
    case "travaille": {
      const m = o.tache ? noeudParId(o.tache.machineId) : null;
      return m ? "tient " + MACHINES[m.type].nom.toLowerCase() : "au travail";
    }
    case "porte": return o.charge ? "porte des " + nomItem(o.charge.item, 2, true, true) : "porte une pièce";
    case "deplace": return "traverse l'atelier";
    case "pause": return "souffle un peu";
    default: return "attend qu'on lui donne quelque chose";
  }
}

/** Petit portrait généré, pour éviter tout fichier image. */
function dessinerTete(g, graine){
  const s = g.canvas.width;
  const peaux = ["#e0b98d","#c99568","#8d5f3c","#f0cfa8"];
  const cheveux = ["#3b2a1c","#6b4a2a","#1e1a17","#8a7050","#a5a5a5"];
  g.clearRect(0,0,s,s);
  g.fillStyle = "#2f343b"; g.fillRect(0,0,s,s);
  g.fillStyle = peaux[Math.floor(bruit(graine)*peaux.length)];
  g.beginPath(); g.arc(s/2, s*0.56, s*0.3, 0, 7); g.fill();
  g.fillStyle = cheveux[Math.floor(bruit(graine+9)*cheveux.length)];
  g.beginPath(); g.arc(s/2, s*0.5, s*0.31, Math.PI*1.05, Math.PI*1.95); g.fill();
  g.fillStyle = "#22262c";
  g.beginPath(); g.arc(s*0.4, s*0.56, s*0.035, 0, 7); g.fill();
  g.beginPath(); g.arc(s*0.6, s*0.56, s*0.035, 0, 7); g.fill();
  g.strokeStyle = "#22262c"; g.lineWidth = s*0.03; g.lineCap = "round";
  g.beginPath(); g.arc(s/2, s*0.62, s*0.1, 0.35, Math.PI-0.35); g.stroke();
}

function majResteDecisions(){
  const n = $$("#voletDecisions .carte:not(.traitee)").length;
  const e = $("#resteDecisions");
  if (e) e.textContent = n ? n + " " + pluriel(n,"décision") + " en attente — on peut aussi laisser filer." : "Tout est tranché.";
}

function faitMarquant(b){
  const h = etat.stats.historiqueSemaines;
  const r = b.ca - b.depenses;
  if (h.length > 1){
    const meilleur = Math.max(...h.slice(0,-1).map(s => s.ca - s.depenses));
    if (r > meilleur && r > 0) return "Meilleure semaine depuis le début.";
  }
  if (b.pannes >= 3) return b.pannes + " pannes cette semaine. Le matériel fatigue.";
  if (b.retards > 0) return "On a livré en retard. Ça finit par se savoir.";
  if (r < 0) return "On a perdu de l'argent cette semaine.";
  if (b.faits.length) return b.faits[b.faits.length-1] + ".";
  const cles = Object.keys(b.produits);
  if (cles.length){
    const gros = cles.sort((x,y) => b.produits[y]-b.produits[x])[0];
    return quantiteItem(gros, b.produits[gros], true) + " sont sortis de l'atelier.";
  }
  return null;
}

function motDeFin(p){
  if (p.part >= 0.9) return "« On y est presque, patron. »";
  if (p.part >= 0.5) return "« On avance. Faut tenir la cadence. »";
  if (p.part >= 0.2) return "« C'est un début. »";
  return "« Il va falloir s'y mettre. »";
}

function dessinerGraphique(cv){
  const g = cv.getContext("2d");
  const h = etat.stats.historiqueSemaines.slice(-12);
  g.clearRect(0,0,cv.width,cv.height);
  if (!h.length) return;
  const vals = h.map(s => s.ca - s.depenses);
  const maxi = Math.max(1, ...vals.map(Math.abs));
  const n = h.length;
  const lb = cv.width/n;
  const zero = cv.height/2;

  g.strokeStyle = "rgba(255,255,255,.12)";
  g.beginPath(); g.moveTo(0,zero); g.lineTo(cv.width,zero); g.stroke();

  for (let i=0;i<n;i++){
    const v = vals[i];
    const hh = Math.abs(v)/maxi * (cv.height/2 - 12);
    g.fillStyle = v >= 0 ? "#5cba6b" : "#e0574a";
    if (v >= 0) g.fillRect(i*lb+lb*0.22, zero-hh, lb*0.56, hh);
    else g.fillRect(i*lb+lb*0.22, zero, lb*0.56, hh);
  }
  g.fillStyle = "rgba(255,255,255,.4)";
  g.font = "10px Segoe UI, sans-serif";
  g.fillText("S"+(h[0].semaine+1), 3, cv.height-3);
  g.textAlign = "right";
  g.fillText("S"+(h[n-1].semaine+1), cv.width-3, cv.height-3);
  g.textAlign = "left";
}

/* ------------------------------------------------ Les cartes de décision */
function construireDecisions(){
  const d = [];
  const u = U();

  for (const c of etat.contrats.proposes.slice(0,2)) d.push({ sorte:"contrat", contrat:c });

  // Embauche : proposée si l'atelier a plus de machines que de bras
  const manuelles = u.machines.filter(m => !MACHINES[m.type].auto && !MACHINES[m.type].stockage).length;
  if (u.ouvriers.length < manuelles && d.length < CONFIG.decisionsMax){
    const c = creerCandidat();
    d.push({ sorte:"rh", candidat:c });
  }

  // Lot de matière à prix cassé
  if (d.length < CONFIG.decisionsMax){
    const achetables = Object.keys(ITEMS).filter(k => ITEMS[k].achat && (ITEMS[k].ageMin||1) <= etat.meta.age);
    const it = choix(achetables);
    const qte = ITEMS[it].unite === "kg" ? hasardInt(4,15)*50 : hasardInt(4,12)*20;
    const remise = hasard(0.14,0.28);
    const prix = Math.round(prixAchat(it)*qte*(1-remise));
    d.push({ sorte:"achat", item:it, qte, prix, remise });
  }

  // Un emprunt, quand la caisse est basse
  if (etat.finances.solde < 3000 && d.length < CONFIG.decisionsMax && etat.finances.emprunts.length < 2){
    d.push({ sorte:"banque", banque: BANQUES[etat.meta.age >= 2 ? 1 : 0] });
  }

  return d.slice(0, CONFIG.decisionsMax);
}

function carteDecision(d){
  const c = document.createElement("div");
  c.className = "carte";
  let type = "", titre = "", corps = "", avis = "", actions = [];

  if (d.sorte === "contrat"){
    const k = d.contrat;
    type = "Commande"; c.classList.add();
    titre = k.client;
    corps = quantiteItem(k.produitId, k.quantite, false) +
            " à " + euros(k.prixUnitaire) + (ITEMS[k.produitId].unite === "kg" ? " le kg" : " pièce") +
            ", soit " + euros(k.quantite*k.prixUnitaire) + ". " +
            "À livrer sous " + (k.dateLimite - jourCourant()) + " jours ouvrés. " +
            "Pénalité de " + euros(k.penaliteRetard) + " par jour de retard.";
    avis = avisContremaitre(k);
    actions = [["Accepter", () => accepterContrat(k), "plein"], ["Refuser", () => refuserContrat(k), ""]];
  }
  else if (d.sorte === "rh"){
    const o = d.candidat;
    type = "Embauche";
    titre = o.prenom + " " + o.nom;
    corps = TRAITS.find(t=>t.id===o.trait).nom + ". Demande " + euros(o.salaire) + " par jour. " + resumeCompetences(o);
    const u = U();
    avis = u.ouvriers.length < 2 ? "À un seul, on passe la journée à porter des pièces. Prenez-le."
         : "Un bras de plus, c'est " + euros(o.salaire*5) + " par semaine. À vous de voir si on a le carnet pour.";
    actions = [["Embaucher", () => embaucher(o), "plein"], ["Pas maintenant", () => {}, ""]];
  }
  else if (d.sorte === "achat"){
    type = "Matière";
    titre = "Lot de " + quantiteItem(d.item, d.qte, true);
    corps = "Un fournisseur solde son stock : " + euros(d.prix) + " au lieu de " +
            euros(prixAchat(d.item)*d.qte) + ", soit " + Math.round(d.remise*100) + " % de moins.";
    avis = etat.finances.solde > d.prix*3 ? "À ce prix-là, on prend." : "C'est une bonne affaire, mais la caisse est courte.";
    actions = [["Acheter", () => {
      if (etat.finances.solde - d.prix < CONFIG.faillite) return notif("Refusé","La caisse ne suit pas.","ko");
      depenser(d.prix,"achat"); ajouterStock(d.item, d.qte); son("argent");
      notif("Livraison", quantiteItem(d.item, d.qte, true) + " au quai.", "ok");
    }, "plein"], ["Laisser", () => {}, ""]];
  }
  else if (d.sorte === "banque"){
    type = "Banque";
    titre = d.banque.nom;
    corps = "Vous prête " + euros(d.banque.montant) + ", à rendre " + euros(d.banque.montant*(1+d.banque.taux)) +
            " sur " + d.banque.jours + " jours, soit " + euros(d.banque.montant*(1+d.banque.taux)/d.banque.jours) + " par jour.";
    avis = "La caisse est basse. Un emprunt maintenant, c'est du temps qu'on achète — pas de l'argent qu'on gagne.";
    actions = [["Signer", () => emprunter(d.banque), "plein"], ["Refuser", () => {}, ""]];
  }

  const classe = { contrat:"tContrat", rh:"tRh", achat:"tAchat", banque:"tBanque", invest:"tInvest" }[d.sorte];
  c.innerHTML = '<div class="cType '+classe+'"></div><div class="cTitre"></div><div class="cCorps"></div>' +
                (avis ? '<div class="cAvis"></div>' : '');
  c.querySelector(".cType").textContent = type;
  c.querySelector(".cTitre").textContent = titre;
  c.querySelector(".cCorps").textContent = corps;
  if (avis) c.querySelector(".cAvis").textContent = "« " + avis + " »";

  const r = document.createElement("div");
  r.className = "btRang";
  for (const [nom, fn, cl] of actions){
    r.appendChild(bouton(nom, () => {
      fn();
      c.classList.add("traitee");
      majResteDecisions();
      majBandeau();
    }, cl));
  }
  c.appendChild(r);
  return c;
}
