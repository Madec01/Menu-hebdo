    const vendables = u.machines.filter(m => !MACHINES[m.type].stockage);
    if (vendables.length){
      vendables.sort((a,b)=>MACHINES[b.type].cout - MACHINES[a.type].cout);
      const m = vendables[0];
      const prix = Math.round(MACHINES[m.type].cout * 0.5);
      demolir(m, prix);
      notif("La banque a tranché", "Découvert trop lourd : " + MACHINES[m.type].nom + " a été revendue " + euros(prix) + ".", "ko");
      paroleContexte("banque", {});
    }
  }
}

/* ------------------------------------------------------------- Marché */
function initMarche(){
  for (const id in ITEMS){
    const it = ITEMS[id];
    if (!it.achat) continue;
    etat.marche.prix[id] = it.achat;
    etat.marche.tendances[id] = hasard(-0.4,0.4);
  }
}
function majMarche(){
  const j = jourCourant();
  if (etat.marche.dernierJour === j) return;
  etat.marche.dernierJour = j;
  for (const id in ITEMS){
    const it = ITEMS[id];
    if (!it.achat) continue;
    if (Math.random() < 0.09) etat.marche.tendances[id] = hasard(-0.5,0.5);
    const t = etat.marche.tendances[id];
    let p = etat.marche.prix[id] * (1 + (t*0.012 + hasard(-0.02,0.02)) * mode().volatilite);
    p = clamp(p, it.achat*0.75, it.achat*1.25);
    etat.marche.prix[id] = p;
  }
}
function prixAchat(id){ return etat.marche.prix[id] ?? ITEMS[id].achat ?? 0; }

function acheter(id, qte){
  const it = ITEMS[id];
  const prix = prixAchat(id) * qte;
  if (etat.finances.solde - prix < CONFIG.faillite){
    notif("Refusé", "La caisse ne suit pas.", "ko"); return false;
  }
  depenser(prix, "achat");
  ajouterStock(id, qte);
  son("argent");
  flottant(U().quaiEntree.x+1, U().quaiEntree.y+1, "−" + Math.round(prix) + " €", "#e0574a");
  notif("Livraison", quantiteItem(id, qte, true) + " pour " + euros(prix) + ".", "");
  tutoEvenement("achat");
  return true;
}

function reapprovisionner(){
  if (!debloque("reappro")) return;
  for (const id in etat.reappro){
    const r = etat.reappro[id];
    if (!r.actif) continue;
    if (stockDe(id) < r.seuil) acheter(id, r.lot);
  }
}

function vendreComptant(id, qte){
  const it = ITEMS[id];
  if (!it.vente) return;
  qte = Math.min(Math.floor(qte), Math.floor(stockDe(id)));
  if (qte < 1) return;
  const prix = it.vente * 0.88 * qte;
  ajouterStock(id, -qte);
  encaisser(prix, "vente");
  compter(etat.progression.vendus, id, qte);
  compter(etat.stats.semaineCourante.livres, id, qte);
  son("argent");
  flottant(U().quaiSortie.x+1, U().quaiSortie.y+1, "+" + Math.round(prix) + " €", "#5cba6b");
  notif("Vendu", quantiteItem(id, qte, true) + " au comptant : " + euros(prix) + ".", "ok");
}

/* ------------------------------------------------------------- Commandes */

function capaciteHebdoEstimee(produitId){
  // Ce que l'atelier a réellement sorti la semaine passée, sinon une estimation
  // à partir du poste le plus lent de la chaîne.
  const h = etat.stats.historiqueSemaines;
  for (let i=h.length-1; i>=Math.max(0,h.length-3); i--){
    const q = h[i].produits[produitId] || 0;
    if (q > 0) return q;
  }
  // Sinon : le poste qui sort ce produit, à cadence réduite par le portage.
  const u = U();
  const r = Object.values(RECETTES).find(x => x.sortie.id === produitId);
  if (!r) return 10;
  const postes = u.machines.filter(m => m.type === r.machine).length;
  const parJour = postes * r.sortie.qte * (CONFIG.minutesParJour / r.duree) * 0.42;
  return Math.max(ITEMS[produitId].unite === "kg" ? 30 : 200, Math.round(parJour * CONFIG.joursParSemaine));
}

function creerContrat(produitId){
  // Les gros clients ne viennent qu'une fois la maison connue.
  const dispo = CLIENTS.filter(c => c.ageMin <= etat.meta.age && (!c.gros || etat.reputation >= 55));
  const cl = choix(dispo);
  const cap = capaciteHebdoEstimee(produitId);
  const semaines = cl.gros ? hasardInt(2,4) : hasardInt(1,3);
  const facteur = cl.gros ? hasard(1.1, 1.6) : hasard(0.5, 1.35);
  // On arrondit à quelque chose qu'un client dirait vraiment : 250 kg, 4 000 sachets.
  const brut = Math.max(5, cap * semaines * facteur);
  const pas = ITEMS[produitId].unite === "kg" ? (brut > 800 ? 100 : 25) : (brut > 4000 ? 500 : 100);
  const quantite = Math.max(pas, Math.round(brut / pas) * pas);
  const base = ITEMS[produitId].vente;
  // Une maison connue vend ses propres recettes plus cher.
  const renom = ITEMS[produitId].maison ? (0.88 + etat.recherche.notoriete/100 * 0.34) : 1;
  const prixUnitaire = Math.round(base * cl.marge * mode().prixClient * renom *
                                  (0.9 + etat.reputation/100*0.18) * hasard(0.97,1.06)) || 1;
  return {
    id: nouvelId(),
    client: cl.nom, ton: cl.ton,
    produitId, quantite, livre:0,
    prixUnitaire,
    dateLimite: jourCourant() + semaines*CONFIG.joursParSemaine,
    penaliteRetard: Math.max(30, Math.round(prixUnitaire*quantite*0.012)),
    reputationRequise: cl.gros ? 55 : 0,
    joursRetard: 0,
    reclamations: 0,
    gros: !!cl.gros,
    paiement: cl.paiement || 0,        // jours avant règlement
    accepteLe: null
  };
}

/** L'avis du contremaître, en français d'atelier (§8.2). */
function avisContremaitre(c){
  const cap = capaciteHebdoEstimee(c.produitId);
  const jours = Math.max(1, c.dateLimite - jourCourant());
  const semaines = jours / CONFIG.joursParSemaine;
  const besoin = c.quantite / semaines;
  const ratio = besoin / Math.max(1,cap);
  const n = nomItem(c.produitId, 2, true, true);
  const b = mesure(c.produitId, Math.ceil(besoin)), capT = mesure(c.produitId, cap);
  if (ratio < 0.55) return "On tient largement : " + b + " de " + n + " par semaine, et on en sort " + capT + ".";
  if (ratio < 0.9)  return "Ça passe, sans traîner. Il faut " + b + " par semaine, on en sort " + capT + ".";
  if (ratio < 1.25) return "Ça va être juste : " + b + " par semaine et on plafonne à " + capT + ". Aucune panne, sinon c'est mort.";
  return "On n'y arrivera jamais. " + b + " par semaine, on en fait " + capT + " au mieux. À moins d'embaucher.";
}

function accepterContrat(c){
  c.accepteLe = jourCourant();
  etat.contrats.acceptes.push(c);
  etat.contrats.proposes = etat.contrats.proposes.filter(x => x.id !== c.id);
  notif("Commande signée", c.client + " : " + quantiteItem(c.produitId, c.quantite, true) + " à " + euros(c.prixUnitaire) + " pièce.", "ok");
  son("signature");
}
function refuserContrat(c){
  etat.contrats.proposes = etat.contrats.proposes.filter(x => x.id !== c.id);
}
function annulerContrat(c){
  etat.contrats.acceptes = etat.contrats.acceptes.filter(x => x.id !== c.id);
  c.annule = true;
  etat.contrats.termines.push(c);
  etat.reputation = clamp(etat.reputation - 8, 0, 100);
  notif("Commande annulée", c.client + " a repris sa commande. Ça se saura.", "ko");
}

function livrerContrats(){
  const acc = etat.contrats.acceptes.slice().sort((a,b) => a.dateLimite - b.dateLimite);
  for (const c of acc){
    const reste = c.quantite - c.livre;
    if (reste <= 0) continue;

    // Le raté ne se met pas de côté tout seul : il part mélangé au bon, au
    // prorata de ce qui traîne sur le quai. C'est tout l'intérêt de trier.
    const idRate = ITEMS[c.produitId].rate;
    const bon = stockDe(c.produitId);
    const mauvais = idRate ? stockDe(idRate) : 0;
    const dispo = bon + mauvais;
    if (dispo < 1) continue;

    const q = Math.min(Math.floor(dispo), reste);
    if (q < 1) continue;
    const qMauvais = mauvais > 0 ? Math.min(mauvais, q * (mauvais/dispo)) : 0;
    const qBon = q - qMauvais;

    if (qBon > 0) ajouterStock(c.produitId, -qBon);
    if (qMauvais > 0) ajouterStock(idRate, -qMauvais);
    c.livre += q;

    const montant = q * c.prixUnitaire;
    if (c.paiement){
      etat.finances.creances.push({ montant, jour: jourCourant() + c.paiement, client: c.client });
      notif("Expédition", quantiteItem(c.produitId, q, true) + " partis chez " + c.client +
            " · " + euros(montant) + " payés dans " + c.paiement + " jours.", "");
    } else {
      encaisser(montant, "vente");
      flottant(U().quaiSortie.x+1, U().quaiSortie.y+1, "+" + Math.round(montant) + " €", "#5cba6b");
      son("argent");
      notif("Expédition", quantiteItem(c.produitId, q, true) + " partis chez " + c.client + " : " + euros(montant) + ".", "ok");
    }
    compter(etat.progression.vendus, c.produitId, q);
    compter(etat.stats.semaineCourante.livres, c.produitId, q);
    const fc = etat.stats.clients[c.client] || (etat.stats.clients[c.client] = { ca:0, commandes:0, reclamations:0 });
    fc.ca += montant;

    if (qMauvais > 0.5) reclamation(c, qMauvais);

    if (c.livre >= c.quantite){
      const aLheure = jourCourant() <= c.dateLimite;
      etat.reputation = clamp(etat.reputation + (aLheure ? 4 : 1), 0, 100);
      etat.contrats.acceptes = etat.contrats.acceptes.filter(x => x.id !== c.id);
      etat.contrats.termines.push(c);
      notif("Commande honorée", c.client + " est livré" + (aLheure ? ", dans les temps." : ", avec du retard."), aLheure ? "ok" : "att");
      son("valide");
      fait(aLheure ? ("Commande " + c.client + " livrée dans les temps") : ("Commande " + c.client + " livrée en retard"));
      // L'objectif de l'âge 3 : une grosse commande, sans une seule réclamation.
      const fic = etat.stats.clients[c.client];
      if (fic){ fic.commandes++; if (c.reclamations > 0) fic.reclamations++; }
      if (c.gros && aLheure && !(c.reclamations > 0))
        compter(etat.progression.compteurs, "grosseCommande", 1);
    }
  }
}

/** Le client a trouvé de la marchandise ratée dans ses cartons. */
function reclamation(c, qMauvais){
  c.reclamations = (c.reclamations||0) + qMauvais;
  const geste = qMauvais * c.prixUnitaire * 2;
  depenser(geste, "reclamation");
  etat.reputation = clamp(etat.reputation - clamp(1 + qMauvais/Math.max(1,c.quantite)*40, 1, 7), 0, 100);
  etat.stats.semaineCourante.reclamations++;
  notif("Réclamation", c.client + " a trouvé " + quantiteItem(ITEMS[c.produitId].rate, qMauvais, true) +
        " dans la livraison. " + euros(geste) + " de geste commercial.", "ko");
  paroleContexte("reclamation", { client:c.client });
  fait("Réclamation de " + c.client);
}

/** Ce qu'il faut encore livrer sur les commandes signées : on ne brade jamais
 *  un produit déjà promis à un client. */
function reserveContrats(produitId){
  let r = 0;
  for (const c of etat.contrats.acceptes)
    if (c.produitId === produitId) r += Math.max(0, c.quantite - c.livre);
  return r;
}

/** Les commerces du coin passent tous les soirs prendre ce qui dépasse.
 *  Moins payé qu'une commande : c'est tout l'intérêt d'en signer.
 *  Ils ne prennent que du bon : la marchandise ratée reste sur les bras. */
function vendreSurplus(){
  if (!etat.venteAuto) return;
  let total = 0, detail = [];
  for (const id in ITEMS){
    if (!ITEMS[id].vente) continue;
    const surplus = Math.floor(stockDe(id) - reserveContrats(id));
    if (surplus < 1) continue;
    const prix = ITEMS[id].vente * 0.88 * surplus;
    ajouterStock(id, -surplus);
    encaisser(prix, "vente");
    compter(etat.progression.vendus, id, surplus);
    compter(etat.stats.semaineCourante.livres, id, surplus);
    total += prix;
    detail.push(quantiteItem(id, surplus, true));
  }
  if (total > 0){
    flottant(U().quaiSortie.x+1, U().quaiSortie.y+1, "+" + Math.round(total) + " €", "#5cba6b");
    son("argent");
    notif("Commerces du coin", detail.join(", ") + " partis pour " + euros(total) + ".", "ok");
  }
}

/* ------------------------------------------------------- Fin de semaine */
function fait(t){ etat.stats.semaineCourante.faits.push(t); }

function finSemaine(){
  const s = etat.stats.semaineCourante;
  s.semaine = semaineCourante();
  s.resultat = s.ca - s.depenses;
  s.solde = etat.finances.solde;
  etat.stats.historiqueSemaines.push(s);
  if (etat.stats.historiqueSemaines.length > 60) etat.stats.historiqueSemaines.shift();

  etat.stats.semaineCourante = semaineVierge();
  etat.progression.produitsSemaine = {};

  // Nouvelles propositions de commande
  const produits = Object.keys(ITEMS).filter(id => ITEMS[id].vente && (ITEMS[id].ageMin||1) <= etat.meta.age);
  etat.contrats.proposes = [];
  const n = etat.meta.age >= 2 ? 3 : 2;
  for (let i=0;i<n;i++) etat.contrats.proposes.push(creerContrat(choix(produits)));

  etat.meta.vitesse = 0;
  sauvegardeAuto();
  ouvrirVendredi(s);
}

/* ------------------------------------------------------- Progression */
function progressionObjectif(){
  const age = AGES[etat.meta.age-1];
  const o = age.objectif;
  let val = 0, cible = o.cible;
  if (o.type === "compteur") val = (etat.progression.compteurs||{})[o.cle] || 0;
  else if (o.type === "vendus") val = etat.progression.vendus[o.produit] || 0;
  else if (o.type === "produitsSemaine") val = etat.progression.produitsSemaine[o.produit] || 0;
  else if (o.type === "argent") val = etat.finances.solde;
  else val = 0;
  let p = clamp(val/cible, 0, 1);
  if (o.secours && o.secours.type === "argent")
    p = Math.max(p, clamp(etat.finances.solde/o.secours.cible, 0, 1));
  return { valeur:val, cible, part:p, texte:age.objectif.texte };
}

function verifierObjectif(){
  if (etat.meta.age >= AGES.length) return;
  const p = progressionObjectif();
  etat.progression.jaugeObjectif = p.part;
  if (p.part >= 1 && !etat.progression.objectifsCompletes.includes(etat.meta.age))
    passerAgeSuivant();
}

function passerAgeSuivant(){
  etat.progression.objectifsCompletes.push(etat.meta.age);
  const ancien = AGES[etat.meta.age-1];
  if (etat.meta.age >= 3){
    // Les âges 3 à 5 sont décrits au document mais pas encore construits.
    notif("Bravo", "Vous avez bouclé « " + ancien.nom + " ». La suite (l'hygiène, la saison, les autres sites) reste à bâtir : la partie continue en mode libre.", "ok");
    paroleContexte("fin_contenu", {});
    etat.meta.age = Math.min(etat.meta.age, AGES.length);
    return;
  }
  etat.meta.age++;
  const nouv = AGES[etat.meta.age-1];
  agrandirUsine(Math.max(nouv.largeur, U().largeur), Math.max(nouv.hauteur, U().hauteur));
  U().nom = nouv.nom;
  etat.meta.vitesse = 0;
  son("age");
  notif("Nouvel âge : " + nouv.nom, nouv.intro, "ok");
  paroleContexte("age" + etat.meta.age, {});
  majBarreConstruction();
  majBandeau();
  ouvrirAnnonceAge(nouv);
}

/** Change la taille de l'atelier sans jamais rétrécir : on recopie la grille,
 *  on replace les quais, et on prévient si le quai de sortie a dû suivre le mur.
 *  Le quai d'entrée, lui, ne bouge jamais — ce qui y est raccordé doit le rester. */
function redimensionnerUsine(l, h, tailleQuai){
  const u = U();
  l = Math.max(l, u.largeur); h = Math.max(h, u.hauteur);
  if (l === u.largeur && h === u.hauteur && !tailleQuai) return false;

  const g = new Uint16Array(l*h);
  for (let y=0; y<u.hauteur; y++)
    for (let x=0; x<u.largeur; x++)
      g[y*l+x] = u.grille[y*u.largeur+x];
  u.grille = g; u.largeur = l; u.hauteur = h;

  const taille = clamp(tailleQuai || u.quaiEntree.h, 4, Math.max(4, h-2));
  u.quaiEntree.x = 0;
  u.quaiEntree.h = taille;
  u.quaiEntree.y = clamp(u.quaiEntree.y, 0, h - taille);
  u.quaiSortie.h = taille;
  u.quaiSortie.y = clamp(u.quaiSortie.y, 0, h - taille);
  const ancienX = u.quaiSortie.x;
  u.quaiSortie.x = l - u.quaiSortie.l;
  libererPourQuai(u, u.quaiSortie);
  placerQuais(u);
  reindexer();
  if (ancienX !== u.quaiSortie.x)
    notif("Le quai de sortie a suivi le mur", "Vérifiez les convoyeurs qui y arrivaient.", "att");
  return true;
}

/** Agrandissement offert au passage d'un âge. */
function agrandirUsine(l, h){
  redimensionnerUsine(l, h, 4 + Math.floor((etat.meta.age-1)*1.5));
}

/** Le prix d'une tuile de surface : plus l'atelier est grand, plus pousser
 *  le mur coûte cher. */
function prixTuileAtelier(){
  const u = U();
  return CONFIG.prixTuileAtelier + Math.round(u.largeur*u.hauteur / 45);
}

/** Agrandissement acheté par le joueur : deux tuiles de large ou de haut. */
function agrandirAtelier(dl, dh){
  const u = U();
  const max = CONFIG.atelierMax;
  if (u.largeur + dl > max.l || u.hauteur + dh > max.h){
    notif("Impossible", "L'atelier a atteint sa taille maximale.", "ko"); return;
  }
  const tuiles = (u.largeur+dl)*(u.hauteur+dh) - u.largeur*u.hauteur;
  const prix = tuiles * prixTuileAtelier();
  if (!mode().constructionGratuite && !mode().argentInfini &&
      etat.finances.solde - prix < CONFIG.faillite){
    notif("Trop cher", "Pousser le mur coûterait " + euros(prix) + ".", "ko"); return;
  }
  redimensionnerUsine(u.largeur+dl, u.hauteur+dh);
  depenser(mode().constructionGratuite ? 0 : prix, "investissement");
  son("pose");
  for (let i=0;i<10;i++) particule(hasard(0,u.largeur), hasard(0,u.hauteur), "poussiere");
  notif("Atelier agrandi", u.largeur + " sur " + u.hauteur + " tuiles, pour " + euros(prix) + ".", "ok");
  majBandeau(); majPanneau();
}

/** Un quai qui se déplace ne doit rien écraser : ce qui gêne est démoli et
 *  remboursé, et le joueur est prévenu. En pratique le mur neuf est vierge. */
function libererPourQuai(u, q){
  const gene = new Set();
  for (let dy=0; dy<q.h; dy++)
    for (let dx=0; dx<q.l; dx++){
      const x = q.x+dx, y = q.y+dy;
      if (x<0||y<0||x>=u.largeur||y>=u.hauteur) continue;
      const o = u.grille[y*u.largeur+x];
      if (o > 2) gene.add(o);
    }
  for (const id of gene){
    const n = noeudParId(id);
    if (n){ demolir(n); notif("Place au quai", "Il a fallu déplacer ce qui gênait.", "att"); }
  }
}

/** Agrandir un quai à la demande : deux tuiles de plus, contre espèces. */
function agrandirQuai(sortie){
  const u = U();
  const q = sortie ? u.quaiSortie : u.quaiEntree;
  if (q.h + 2 > u.hauteur){ notif("Impossible", "Le mur ne suit pas.", "ko"); return; }
  const cout = 900 + q.h * 150;
  if (!mode().constructionGratuite && !mode().argentInfini &&
      etat.finances.solde - cout < CONFIG.faillite){
    notif("Trop cher", "Il faut " + euros(cout) + ".", "ko"); return;
  }
  const avant = { x:q.x, y:q.y, h:q.h };
  q.h += 2; q.y = clamp(q.y - 1, 0, u.hauteur - q.h);
  libererPourQuai(u, q);
  placerQuais(u);
  depenser(mode().constructionGratuite ? 0 : cout, "investissement");
  reindexer();
  son("pose");
  notif("Quai agrandi", (sortie ? "Le quai de sortie" : "Le quai d'entrée") +
        " fait maintenant " + q.h + " tuiles de haut.", "ok");
}

function finDePartie(){
  etat.meta.vitesse = 0;
  ouvrirFin();
}

/* ------------------------------------------------------- Poser / démolir */
function peutPoser(u, type, x, y, rotation){
  const d = MACHINES[type];
  const tourne = rotation % 2 === 1;
  const l = tourne ? d.h : d.l, h = tourne ? d.l : d.h;
  if (x < 0 || y < 0 || x+l > u.largeur || y+h > u.hauteur) return false;
  for (let dy=0; dy<h; dy++)
    for (let dx=0; dx<l; dx++)
      if (u.grille[(y+dy)*u.largeur + (x+dx)] !== 0) return false;
  return true;
}

function poserMachine(type, x, y, rotation){
  const u = U(), d = MACHINES[type];
  if (!peutPoser(u, type, x, y, rotation)) return false;
  if (!mode().constructionGratuite && !mode().argentInfini && etat.finances.solde - d.cout < CONFIG.faillite){
    notif("Trop cher", "Il n'y a pas " + euros(d.cout) + " en caisse.", "ko"); return false;
  }
  const m = creerMachine(type, x, y, rotation);
  u.machines.push(m);
  poserSurGrille(u, m);
  depenser(mode().constructionGratuite ? 0 : d.cout, "investissement");
  reindexer();
  son("pose");
  for (let i=0;i<8;i++) particule(x+m.l/2, y+m.h/2, "poussiere");
  flottant(x+m.l/2, y, "−" + d.cout + " €", "#e0574a");
  tutoEvenement("pose_" + type);
  return true;
}

function demolir(n, remboursementForce){
  const u = U();
  if (n.type === "convoyeur"){
    for (const t of n.chemin) if (u.grille[t.y*u.largeur+t.x] === n.id) u.grille[t.y*u.largeur+t.x] = 0;
    u.convoyeurs = u.convoyeurs.filter(c => c.id !== n.id);
    encaisser(Math.round(CONV.coutParTuile * n.chemin.length * CONFIG.remboursementCasse), "casse");
  } else {
    // ce qu'il y avait dedans retourne au stock
    for (const it in n.entree) ajouterStock(it, n.entree[it]);
    for (const it in n.sortie) ajouterStock(it, n.sortie[it]);
    if (n.operateurId != null){ const o = ouvrierParId(n.operateurId); if (o) libererTache(o); }
    for (const o of u.ouvriers) if (o.posteAssigne === n.id) o.posteAssigne = null;
    retirerDeGrille(u, n);
    u.machines = u.machines.filter(m => m.id !== n.id);
    encaisser(remboursementForce ?? Math.round(MACHINES[n.type].cout * CONFIG.remboursementCasse), "casse");
    // les convoyeurs qui pointaient dessus deviennent orphelins
    for (const c of u.convoyeurs)
      if (c.source === n.id || c.destination === n.id) c.etat = "non_relie";
  }
  if (vue.selection === n.id) vue.selection = null;
  reindexer();
  son("casse");
}

/* --------------------------------------------------------------- Équipe */
function creerCandidat(){
  const t = choix(TRAITS);
  const base = hasard(0.35, 0.85);
  const comp = {};
  for (const k of ["lavage","decoupe","friture","assaisonnement","emballage"])
    comp[k] = clamp(base + hasard(-0.2,0.2), 0.1, 1);
  const c = creerOuvrier(choix(PRENOMS), choix(NOMS), comp, Math.round(hasard(100,165)/5)*5, t.id);
  return c;
}

function embaucher(c){
  const u = U();
  c.id = nouvelId();
  const q = u.quaiEntree;
  c.x = q.x + q.l + 0.5; c.y = q.y + 1.5;
  c.moral = 0.75;
  u.ouvriers.push(c);
  notif("Embauche", c.prenom + " " + c.nom + " commence lundi. " + euros(c.salaire) + " par jour.", "ok");
  son("valide");
  majBandeau();
}

function licencier(o){
  const u = U();
  libererTache(o);
  u.ouvriers = u.ouvriers.filter(x => x.id !== o.id);
  const indem = o.salaire * 5;
  depenser(indem, "indemnite");
  for (const p of u.ouvriers) p.moral = clamp(p.moral - 0.12, 0, 1);
  notif("Départ", o.prenom + " " + o.nom + " quitte l'atelier. " + euros(indem) + " d'indemnité.", "att");
}

function emprunter(b){
  const total = b.montant * (1 + b.taux);
  etat.finances.emprunts.push({
    banque:b.nom, montant:b.montant, restant:total,
    mensualite: total / b.jours, taux:b.taux, debut:jourCourant()
  });
  encaisser(b.montant, "emprunt");
  notif("Emprunt accordé", b.nom + " vous prête " + euros(b.montant) + ". Remboursement " + euros(total/b.jours) + " par jour.", "ok");
  son("argent");
}

/* ============================================================================
   SIMULATION — la recherche (âge 4)
   ----------------------------------------------------------------------------
   Le joueur compose une recette en mélangeant des propositions. L'étude coûte
   de l'argent et du temps. À la sortie, le public tranche : une note, des avis,
   et un prix de vente qui en découle. Ce qui plaît se vend cher et fait
   connaître la maison ; ce qui rate se brade.
   ========================================================================== */

function optionRecette(axeCle, id){
  const a = AXES_RECETTE.find(x => x.cle === axeCle);
  return a ? a.options.find(o => o.id === id) : null;
}
function optionsDe(traits){
  return AXES_RECETTE.map(a => optionRecette(a.cle, traits[a.cle])).filter(Boolean);
}
function tagsDe(traits){
  const t = new Set();
  for (const o of optionsDe(traits)) for (const g of (o.tags||[])) t.add(g);
  return t;
}
/** Les accords dont les deux ingrédients sont présents dans la recette. */
function accordsDe(traits){
  const v = Object.values(traits);
  return ACCORDS.filter(a => v.includes(a.a) && v.includes(a.b));
}

function tendanceCourante(){
  return TENDANCES[(etat.recherche.tendance || 0) % TENDANCES.length];
}

/** La note du public, de 0 à 100. Le détail sert à expliquer, jamais à afficher
 *  un coefficient : le joueur lit des phrases, pas des nombres (§3.1). */
function noteRecette(traits, alea){
  const opts = optionsDe(traits);
  if (opts.length < AXES_RECETTE.length) return null;
  const base = opts.reduce((s,o) => s + o.attrait, 0) / opts.length;
  const accords = accordsDe(traits).reduce((s,a) => s + a.delta, 0);
  const mode = tagsDe(traits).has(tendanceCourante().tag) ? 0.12 : 0;
  // Une usine qui gâche se retrouve dans le sachet.
  const rebut = rebutMoyenUsine();
  const soin = (1 - rebut) * 0.08;
  const brut = base + accords + mode + soin + (alea || 0);
  return { note: Math.round(clamp(brut, 0, 1) * 100), base, accords, mode, soin };
}

function rebutMoyenUsine(){
  const m = U().machines.filter(x => MACHINES[x.type].qualite);
  if (!m.length) return 0.08;
  return m.reduce((s,x) => s + (x.tauxRebut||0), 0) / m.length;
}

const COULEUR_GOUT = {
  nature:"#e8c86a", paprika:"#d4552e", oignon_creme:"#e0d3a8", vinaigre:"#8fbf6a",
  fromage:"#e8a83c", barbecue:"#a8492a", piment:"#c22f2f", truffe:"#5a4a63"
};

function grammageDe(traits){ return optionRecette("format", traits.format).grammage; }

/** Le prix se déduit de la note : une chips qui plaît se vend, l'autre se brade. */
function prixUniteRecette(note, traits){
  const g = grammageDe(traits);
  const prixKg = 10.4 * (0.55 + note/100 * 0.85);
  return Math.round(prixKg * g/1000 * 100) / 100;
}
function coutEtude(traits){
  return 3000 + optionsDe(traits).reduce((s,o) => s + (o.etude||0), 0);
}
function joursEtude(traits){
  return Math.min(15, Math.round(4 + optionsDe(traits).reduce((s,o) => s + (o.etude||0), 0) / 1100));
}

/* -------------------------------------------------- Vie d'une étude */
function lancerEtude(nom, traits){
  if (etat.recherche.enCours){ notif("Une étude est déjà en route", "Une seule à la fois.", "ko"); return false; }
  const cout = coutEtude(traits);
  if (!mode().argentInfini && etat.finances.solde - cout < CONFIG.faillite){
    notif("Étude trop chère", "Il faut " + euros(cout) + " pour la lancer.", "ko"); return false;
  }
  depenser(cout, "recherche");
  etat.recherche.enCours = {
    nom: nom || "Recette maison",
    traits: Object.assign({}, traits),
    cout, jours: joursEtude(traits), restant: joursEtude(traits)
  };
  notif("Étude lancée", "« " + etat.recherche.enCours.nom + " » — " + etat.recherche.enCours.jours +
        " jours de mise au point, " + euros(cout) + ".", "ok");
  parle("On s'y met, patron. Dans " + etat.recherche.enCours.jours + " jours on saura ce que ça donne.", 9000);
  son("signature");
  return true;
}

/** Appelée une fois par jour. */
function avancerRecherche(){
  const e = etat.recherche.enCours;
  if (!e) return;
  e.restant--;
  if (e.restant <= 0) finaliserRecette();
}

function finaliserRecette(){
  const e = etat.recherche.enCours;
  etat.recherche.enCours = null;
  const n = noteRecette(e.traits, hasard(-0.03, 0.03));
  const id = "maison_" + (etat.recherche.prochain++);
  const r = {
    id, nom: e.nom, traits: e.traits, note: n.note,
    prixUnite: prixUniteRecette(n.note, e.traits),
    semaine: semaineCourante(), lancee: true,
    tendance: tendanceCourante().tag,
    accords: accordsDe(e.traits).map(a => ({ delta:a.delta, dit:a.dit }))
  };
  r.avis = genererAvis(r);
  r.pistes = pistesAmelioration(r);
  etat.recherche.recettes.push(r);
  etat.recherche.notoriete = clamp(etat.recherche.notoriete + (n.note - 50)/6, 0, 100);

  injecterRecettesJoueur();
  reindexer();

  if (n.note >= 75) compter(etat.progression.compteurs, "recetteReussie", 1);

  notif("« " + r.nom + " » est prête", motNote(r.note) + " — " + euros(r.prixUnite) +
        " le sachet. Réglez une ensacheuse dessus pour la produire.", n.note >= 65 ? "ok" : "att");
  parle(paroleNote(r), 14000);
  son(n.note >= 65 ? "age" : "refus");
  majBarreConstruction(); majPanneau(); majBandeau();
}

function motNote(n){
  if (n >= 82) return "Le public en redemande";
  if (n >= 65) return "Ça plaît";
  if (n >= 48) return "Accueil tiède";
  if (n >= 32) return "Ça ne prend pas";
  return "Personne n'en veut";
}
function paroleNote(r){
  if (r.note >= 82) return "Patron, « " + r.nom + " » cartonne. Les gens reviennent en chercher.";
  if (r.note >= 65) return "« " + r.nom + " » se vend bien. On peut faire mieux, mais c'est du solide.";
  if (r.note >= 48) return "« " + r.nom + " », ça se mange, mais personne n'en parle. Regardez les avis.";
  return "« " + r.nom + " », c'est raté. Lisez ce que disent les gens, tout y est.";
}

/** Des avis qui apprennent quelque chose : chacun pointe une décision. */
function genererAvis(r){
  const out = [];
  for (const a of AVIS){
    let d = false;
    try { d = a.si(r); } catch(e){ d = false; }
    if (d) out.push({ qui: choix(PRENOMS_CLIENTS), dit: choix(a.dit) });
  }
  // Les accords parlent d'eux-mêmes, en bien comme en mal.
  for (const a of r.accords) out.push({ qui: choix(PRENOMS_CLIENTS), dit: a.dit });
  // On mélange, on en garde cinq.
  for (let i=out.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [out[i],out[j]] = [out[j],out[i]]; }
  return out.slice(0,5);
}

/** Ce qu'on pourrait changer la prochaine fois. */
function pistesAmelioration(r){
  const p = [];
  // 1. L'accord qui a le plus coûté
  const pires = r.accords.filter(a => a.delta < 0).sort((a,b) => a.delta - b.delta);
  if (pires.length) p.push(pires[0].dit);
  // 2. L'axe le plus faible de la recette
  const opts = AXES_RECETTE.map(a => ({ axe:a, o: optionRecette(a.cle, r.traits[a.cle]) }))
                           .filter(x => x.o).sort((a,b) => a.o.attrait - b.o.attrait);
  if (opts.length && opts[0].o.attrait < 0.66){
    const mieux = opts[0].axe.options.filter(o => o.attrait > opts[0].o.attrait + 0.05)
                                     .sort((a,b) => b.attrait - a.attrait)[0];
    if (mieux) p.push("Sur " + opts[0].axe.nom.toLowerCase() + ", « " + opts[0].o.nom +
                      " » ne convainc pas. « " + mieux.nom + " » plairait davantage.");
  }
  // 3. La mode du moment
  if (r.tendance && !tagsDe(r.traits).has(r.tendance)){
    const t = TENDANCES.find(x => x.tag === r.tendance);
    if (t) p.push("Au lancement, " + t.texte.charAt(0).toLowerCase() + t.texte.slice(1) +
                  " Cette recette passait à côté.");
  }
  // 4. L'usine elle-même
  if (rebutMoyenUsine() > 0.15)
    p.push("Une partie du problème est dans l'atelier : trop de sachets ratés partent avec les bons.");
  if (!p.length) p.push("Rien à redire sur la composition. Pour aller plus haut, il faudra suivre la mode du moment.");
  return p;
}

/* ------------------------------------- Injection dans la chaîne réelle */

/** Les recettes du joueur deviennent de vraies matières et de vraies recettes
 *  d'ensachage. Elles ne vivent pas dans les tables constantes : on les
 *  réinjecte à la création de partie et à chaque chargement. */
function injecterRecettesJoueur(){
  nettoyerRecettesJoueur();
  if (!etat.recherche || !etat.recherche.recettes) return;
  for (const r of etat.recherche.recettes){
    if (!r.lancee) continue;
    const g = grammageDe(r.traits);
    const fmt = optionRecette("format", r.traits.format);
    const coutGout = optionRecette("gout", r.traits.gout).cout;
    const coutCuisson = optionRecette("cuisson", r.traits.cuisson).cout;
    const dureeCoupe = optionRecette("coupe", r.traits.coupe).duree || 1;
    const dureeCuisson = optionRecette("cuisson", r.traits.cuisson).duree || 1;
    const coul = COULEUR_GOUT[r.traits.gout] || "#c9502e";

    ITEMS[r.id] = {
      nom: r.nom, nomP: r.nom, court: r.nom, courtP: r.nom,
      couleur: coul, forme:"sachet", unite:null,
      vente: r.prixUnite, portee:320, capacite:2400,
      cat:"produit", ageMin:4, rate: r.id + "_rate", maison:true
    };
    ITEMS[r.id + "_rate"] = {
      nom: r.nom + " (écarté)", nomP: r.nom + " (écartés)",
      court:"Écarté", courtP:"Écartés",
      couleur:"#7d7168", forme:"sachet", unite:null,
      portee:320, capacite:2400, cat:"rebut", bon:r.id, ageMin:4, maison:true
    };
    const rid = "ensacher_" + r.id;
    RECETTES[rid] = {
      id: rid, nom: "Ensacher — " + r.nom, machine:"ensacheuse", maison:true,
      entrees: [
        { id:"chips_assaisonnees", qte:10 },
        { id:"film",  qte: Math.round(0.4 * fmt.film * 100)/100 },
        { id:"arome", qte: Math.round(0.5 * coutGout * coutCuisson * 100)/100 }
      ],
      sortie: { id: r.id, qte: Math.round(10000/g) },
      duree: Math.round(10 * dureeCoupe * dureeCuisson * 10)/10,
      ageMin: 4
    };
    if (!MACHINES.ensacheuse.recettes.includes(rid)) MACHINES.ensacheuse.recettes.push(rid);
  }
}

function nettoyerRecettesJoueur(){
  for (const k in ITEMS) if (ITEMS[k].maison) delete ITEMS[k];
  for (const k in RECETTES) if (RECETTES[k].maison) delete RECETTES[k];
  MACHINES.ensacheuse.recettes = MACHINES.ensacheuse.recettes.filter(x => !RECETTES[x] || !RECETTES[x].maison);
  MACHINES.ensacheuse.recettes = MACHINES.ensacheuse.recettes.filter(x => x.indexOf("ensacher_maison_") !== 0);
}

/** La mode change toutes les six semaines environ. */
function majTendance(){
  const s = semaineCourante();
  if (etat.recherche.tendanceSemaine === undefined) etat.recherche.tendanceSemaine = s;
  if (s - etat.recherche.tendanceSemaine < 6) return;
  etat.recherche.tendanceSemaine = s;
  const avant = etat.recherche.tendance || 0;
  let n = avant;
  while (n === avant) n = hasardInt(0, TENDANCES.length-1);
  etat.recherche.tendance = n;
  if (etat.meta.age >= 4){
    notif("Le marché bouge", tendanceCourante().texte, "att");
    parle(tendanceCourante().texte + " Une recette qui colle à ça se vendra mieux.", 11000);
  }
}

/** Ce que la maison a vendu de chaque recette, semaine par semaine. */
function ventesRecette(r){
  return etat.stats.historiqueSemaines.map(s => (s.livres && s.livres[r.id]) || 0);
}

/* ============================================================================
   RENDU (1/3) — caméra, sol, pictogrammes
   Le rendu ne modifie jamais l'état de jeu (§11).
   ========================================================================== */

let cnv, ctx, largeurVue = 0, hauteurVue = 0, dpr = 1;
let texSol = null, texSalete = null;
// Images pré-calculées : le sol, le halo des lampes et la vignette sont
// recomposés une fois pour toutes, jamais à chaque image (§16).
let cacheSol = null, cacheSolCle = "", spriteHalo = null, gradVignette = null;

function initRendu(){
  cnv = document.getElementById("vue");
  ctx = cnv.getContext("2d", { alpha:false });
  texSol = fabriquerTextureSol();
  texSalete = fabriquerTextureSalete();
  spriteHalo = fabriquerHalo();
  redimensionner();
  window.addEventListener("resize", redimensionner);
}

function redimensionner(){
  const r = cnv.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  largeurVue = r.width; hauteurVue = r.height;
  cnv.width = Math.round(r.width*dpr);
  cnv.height = Math.round(r.height*dpr);
  cnv.style.width = r.width+"px";
  cnv.style.height = r.height+"px";
  // la vignette ne dépend que de la taille de la fenêtre
  gradVignette = ctx.createRadialGradient(
    largeurVue/2, hauteurVue/2, Math.min(largeurVue,hauteurVue)*0.34,
    largeurVue/2, hauteurVue/2, Math.max(largeurVue,hauteurVue)*0.78);
  gradVignette.addColorStop(0,"rgba(0,0,0,0)");
  gradVignette.addColorStop(1,"rgba(0,0,0,.42)");
  if (typeof cacheGradCorps !== "undefined") cacheGradCorps.clear();
}

/** Halo chaud d'une lampe d'atelier, dessiné une seule fois. */
function fabriquerHalo(){
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,"rgba(255,214,150,1)");
  grd.addColorStop(1,"rgba(255,214,150,0)");
  g.fillStyle = grd; g.fillRect(0,0,128,128);
  return c;
}

/** Le béton et la crasse : une seule composition, refaite quand l'atelier
 *  s'agrandit ou quand la saleté a visiblement changé. */
function majCacheSol(){
  const u = U();
  const cle = u.largeur + "x" + u.hauteur + ":" + Math.round(clamp(u.salete,0,1)*10);
  if (cacheSol && cle === cacheSolCle) return;
  cacheSolCle = cle;
  if (!cacheSol) cacheSol = document.createElement("canvas");
  cacheSol.width = u.largeur*CONFIG.tuile;
  cacheSol.height = u.hauteur*CONFIG.tuile;
  const g = cacheSol.getContext("2d");
  g.fillStyle = g.createPattern(texSol,"repeat");
  g.fillRect(0,0,cacheSol.width,cacheSol.height);
  if (u.salete > 0.03){
    g.globalAlpha = clamp(u.salete,0,1)*0.75;
    g.fillStyle = g.createPattern(texSalete,"repeat");
    g.fillRect(0,0,cacheSol.width,cacheSol.height);
    g.globalAlpha = 1;
  }
}

/** Béton : bruit fin pré-calculé une fois, jamais recalculé par frame. */
function fabriquerTextureSol(){
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#4a4d52"; g.fillRect(0,0,128,128);
  const img = g.getImageData(0,0,128,128), d = img.data;
  for (let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*17;
    d[i]=clamp(d[i]+n,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n,0,255);
  }
  g.putImageData(img,0,0);
  // quelques éclats plus sombres, comme du béton usé
  for (let i=0;i<40;i++){
    g.fillStyle = "rgba(0,0,0,"+(0.02+Math.random()*0.05)+")";
    g.beginPath(); g.ellipse(Math.random()*128, Math.random()*128, 2+Math.random()*9, 1+Math.random()*5, Math.random()*3, 0, 7); g.fill();
  }
  return c;
}

function fabriquerTextureSalete(){
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  for (let i=0;i<26;i++){
    const x = Math.random()*256, y = Math.random()*256, r = 6+Math.random()*26;
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,"rgba(20,16,10,0.5)");
    grd.addColorStop(1,"rgba(20,16,10,0)");
    g.fillStyle = grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  return c;
}

/* ------------------------------------------------------------- Caméra */
function T(){ return CONFIG.tuile * vue.zoom; }

function appliquerCamera(){
  const t = T();
  let sx = 0, sy = 0;
  if (vue.secousse > 0){
    sx = (Math.random()-0.5)*vue.secousse;
    sy = (Math.random()-0.5)*vue.secousse;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.translate(largeurVue/2 - vue.camX*t + sx, hauteurVue/2 - vue.camY*t + sy);
  ctx.scale(t,t);
}
function ecranSeul(){ ctx.setTransform(dpr,0,0,dpr,0,0); }

function ecranVersMonde(px, py){
  const t = T();
  return {
    x: (px - largeurVue/2) / t + vue.camX,
    y: (py - hauteurVue/2) / t + vue.camY
  };
}
function mondeVersEcran(x, y){
  const t = T();
  return { x: (x - vue.camX)*t + largeurVue/2, y: (y - vue.camY)*t + hauteurVue/2 };
}

function centrerCamera(){
  const u = U();
  vue.camX = u.largeur/2; vue.camY = u.hauteur/2;
  const t = CONFIG.tuile;
  vue.zoom = clamp(Math.min(largeurVue/(u.largeur*t+90), hauteurVue/(u.hauteur*t+90)), CONFIG.zoomMin, 1.4);
}

/* ------------------------------------------------- Pictogrammes de pièces
   Un dessin par forme, en coordonnées tuile, centré sur (0,0). `s` = taille. */
function dessinerItem(x, y, s, itemId, alpha){
  const it = ITEMS[itemId];
  if (!it) return;
  ctx.save();
  ctx.translate(x,y);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.fillStyle = it.couleur;
  ctx.strokeStyle = "rgba(0,0,0,.45)";
  ctx.lineWidth = Math.max(0.012, s*0.07);

  switch (it.forme){

    case "tubercule": {              // pomme de terre brute, avec ses yeux
      ctx.beginPath();
      ctx.ellipse(0, 0, s*0.44, s*0.32, 0.4, 0, 7);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(70,48,26,.55)";
      ctx.beginPath(); ctx.arc(-s*0.14, -s*0.06, s*0.05, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc( s*0.16,  s*0.08, s*0.04, 0, 7); ctx.fill();
      break;
    }

    case "tubercule_pele": {         // épluchée : plus claire, plus lisse
      ctx.beginPath();
      ctx.ellipse(0, 0, s*0.42, s*0.3, 0.4, 0, 7);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.beginPath(); ctx.ellipse(-s*0.1, -s*0.09, s*0.16, s*0.08, 0.4, 0, 7); ctx.fill();
      break;
    }

    case "rondelle": {               // rondelle crue vue de dessus
      ctx.beginPath(); ctx.arc(0, 0, s*0.36, 0, 7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(190,180,130,.7)";
      ctx.lineWidth = Math.max(0.008, s*0.04);
      ctx.beginPath(); ctx.arc(0, 0, s*0.2, 0, 7); ctx.stroke();
      break;
    }

    case "chips": {                  // chips : disque gondolé, doré
      ctx.beginPath();
      for (let i=0; i<=12; i++){
        const a = i/12*Math.PI*2;
        const r = s*0.36 * (1 + 0.16*Math.sin(a*3));
        const px = Math.cos(a)*r, py = Math.sin(a)*r*0.86;
        if (i === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,240,190,.4)";
      ctx.beginPath(); ctx.ellipse(-s*0.08, -s*0.08, s*0.12, s*0.07, 0.5, 0, 7); ctx.fill();
      break;
    }

    case "sachet": {                 // sachet gonflé, avec sa soudure
      ctx.beginPath();
      ctx.moveTo(-s*0.26, -s*0.36);
      ctx.quadraticCurveTo(-s*0.4, 0, -s*0.26, s*0.36);
      ctx.lineTo(s*0.26, s*0.36);
      ctx.quadraticCurveTo(s*0.4, 0, s*0.26, -s*0.36);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.3)";
      ctx.fillRect(-s*0.28, -s*0.38, s*0.56, s*0.09);
      ctx.fillRect(-s*0.28,  s*0.29, s*0.56, s*0.09);
      ctx.fillStyle = "rgba(255,225,150,.85)";
      ctx.beginPath(); ctx.arc(0, 0, s*0.13, 0, 7); ctx.fill();
      break;
    }

    case "bidon": {                  // bidon d'huile
      ctx.fillRect(-s*0.26, -s*0.3, s*0.52, s*0.6);
      ctx.strokeRect(-s*0.26, -s*0.3, s*0.52, s*0.6);
      ctx.fillStyle = "rgba(60,45,15,.5)";
      ctx.fillRect(-s*0.1, -s*0.42, s*0.2, s*0.13);
      ctx.fillStyle = "rgba(255,255,255,.28)";
      ctx.fillRect(-s*0.2, -s*0.2, s*0.12, s*0.4);
      break;
    }

    case "sac": {                    // sac de sel ou d'arôme
      ctx.beginPath();
      ctx.moveTo(-s*0.3, s*0.34);
      ctx.lineTo(-s*0.22, -s*0.24);
      ctx.lineTo( s*0.22, -s*0.24);
      ctx.lineTo( s*0.3,  s*0.34);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(0,0,0,.35)";
      ctx.lineWidth = Math.max(0.01, s*0.06);
      ctx.beginPath(); ctx.moveTo(-s*0.22,-s*0.24); ctx.lineTo(s*0.22,-s*0.24); ctx.stroke();
      break;
    }

    case "bobine": {                 // bobine de film
      ctx.beginPath(); ctx.arc(0, 0, s*0.36, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(30,36,42,.75)";
      ctx.beginPath(); ctx.arc(0, 0, s*0.12, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.25)";
      ctx.lineWidth = Math.max(0.008, s*0.035);
      ctx.beginPath(); ctx.arc(0, 0, s*0.24, 0, 7); ctx.stroke();
      break;
    }
  }
  ctx.restore();
}

/* ------------------------------------------------------------- Le sol */
function dessinerSol(){
  const u = U();

  // Hors des murs : le noir de la nuit
  ecranSeul();
  ctx.fillStyle = "#101215";
  ctx.fillRect(0,0,largeurVue,hauteurVue);
  appliquerCamera();

  // Dalle de béton et crasse : une seule image
  majCacheSol();
  ctx.drawImage(cacheSol, 0, 0, u.largeur, u.hauteur);

  // Quadrillage discret
  if (vue.zoom > CONFIG.seuilSchema){
    ctx.strokeStyle = "rgba(255,255,255,.045)";
    ctx.lineWidth = 1/T();
    ctx.beginPath();
    for (let x=0; x<=u.largeur; x++){ ctx.moveTo(x,0); ctx.lineTo(x,u.hauteur); }
    for (let y=0; y<=u.hauteur; y++){ ctx.moveTo(0,y); ctx.lineTo(u.largeur,y); }
    ctx.stroke();
  }

  // Marquage jaune des allées
  ctx.strokeStyle = "rgba(226,182,44,.5)";
  ctx.lineWidth = 0.09;
  ctx.setLineDash([0.7,0.45]);
  ctx.strokeRect(0.45,0.45,u.largeur-0.9,u.hauteur-0.9);
  ctx.setLineDash([]);

  // Murs
  ctx.strokeStyle = "#2b2e33";
  ctx.lineWidth = 0.22;
  ctx.strokeRect(-0.11,-0.11,u.largeur+0.22,u.hauteur+0.22);
  ctx.strokeStyle = "#191b1f";
  ctx.lineWidth = 0.08;
  ctx.strokeRect(0,0,u.largeur,u.hauteur);
}

/* ------------------------------------------------------------- Les quais */
function dessinerQuais(){
  const u = U();
  dessinerUnQuai(u.quaiEntree, u.stocks, "ENTRÉE", "#e2b62c");
  dessinerUnQuai(u.quaiSortie, u.stocksSortie, "SORTIE", "#5cba6b");
}

function dessinerUnQuai(q, stock, titre, teinte){
  ctx.save();
  ctx.fillStyle = "#3c4045";
  ctx.fillRect(q.x, q.y, q.l, q.h);
  ctx.fillStyle = "#33373c";
  ctx.fillRect(q.x, q.y+q.h-0.22, q.l, 0.22);

  // bandes d'avertissement, teintées selon le sens du quai
  ctx.save();
  ctx.beginPath(); ctx.rect(q.x,q.y,q.l,q.h); ctx.clip();
  ctx.strokeStyle = teinte === "#5cba6b" ? "rgba(92,186,107,.72)" : "rgba(226,182,44,.75)";
  ctx.lineWidth = 0.16;
  for (let i=-q.h; i<q.l+q.h; i+=0.5){
    ctx.beginPath(); ctx.moveTo(q.x+i, q.y); ctx.lineTo(q.x+i+q.h, q.y+q.h); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = "rgba(20,22,25,.55)";
  ctx.fillRect(q.x+0.15, q.y+0.15, q.l-0.3, q.h-0.3);

  if (vue.zoom > CONFIG.seuilDetail){
    const items = Object.keys(stock).filter(k => ITEMS[k] && stock[k] > 0.5);
    let i = 0;
    for (const it of items){
      const n = Math.min(4, Math.ceil(stock[it]/8));
      for (let k=0;k<n && i<22;k++,i++){
        const bx = q.x + 0.32 + bruit(i*3+1)*(q.l-0.64);
        const by = q.y + 0.32 + bruit(i*7+5)*(q.h-0.64);
        dessinerItem(bx, by, 0.42, it, 0.95);
      }
    }
  }
  ctx.restore();

  if (vue.zoom > CONFIG.seuilDetail){
    const e = mondeVersEcran(q.x+q.l/2, q.y-0.15);
    ecranSeul();
    ctx.font = "600 " + Math.round(10*Math.min(1.4,vue.zoom)) + "px Segoe UI, sans-serif";
    ctx.textAlign = "center"; ctx.fillStyle = teinte === "#5cba6b" ? "rgba(140,215,155,.9)" : "rgba(226,196,120,.85)";
    ctx.fillText(titre, e.x, e.y);
    appliquerCamera();
  }
}

/* ============================================================================
   RENDU (2/3) — convoyeurs et machines
   ========================================================================== */

/* ---------------------------------------------------------- Convoyeurs */
/** Où se trouve, en coordonnées de tuile, le « cœur » d'un nœud vu depuis
 *  une tuile donnée. Pour un convoyeur, c'est sa tuile la plus proche. */
function ancreNoeud(n, depuis){
  if (!n) return null;
  if (n.type === "convoyeur"){
    let best = null, bd = 1e9;
    for (const t of n.chemin){
      const d = (t.x-depuis.x)*(t.x-depuis.x) + (t.y-depuis.y)*(t.y-depuis.y);
      if (d < bd){ bd = d; best = t; }
    }
    return best ? { x:best.x+0.5, y:best.y+0.5 } : null;
  }
  return { x: n.x + (n.l||1)/2, y: n.y + (n.h||1)/2 };
}

/** Le chemin dessiné déborde d'une demi-tuile à chaque bout, vers ce à quoi la
 *  bande est raccordée : deux convoyeurs qui se suivent se rejoignent alors
 *  vraiment, et une bande touche la machine qu'elle alimente. Sans ça, la
 *  marchandise a l'air posée sur deux îlots séparés.
 *  Mis en cache : il ne change qu'en cas de modification de l'atelier. */
function cheminRendu(c){
  let r = idx.renduConv.get(c.id);
  if (r && r.cle === c.source + ":" + c.destination + ":" + c.chemin.length) return r.pts;

  const pts = c.chemin.map(t => ({ x:t.x+0.5, y:t.y+0.5 }));
  const deborde = (bout, voisinTuile, noeud) => {
    const a = ancreNoeud(noeud, bout);
    if (!a) return null;
    const dx = a.x - (bout.x+0.5), dy = a.y - (bout.y+0.5);
    const ax = Math.abs(dx) > Math.abs(dy);
    return { x: bout.x+0.5 + (ax ? Math.sign(dx)*0.52 : 0),
             y: bout.y+0.5 + (ax ? 0 : Math.sign(dy)*0.52) };
  };
  const deb = deborde(c.chemin[0], c.chemin[1], noeudParId(c.source));
  if (deb) pts.unshift(deb);
  const fin = deborde(c.chemin[c.chemin.length-1], c.chemin[c.chemin.length-2], noeudParId(c.destination));
  if (fin) pts.push(fin);

  idx.renduConv.set(c.id, { cle: c.source + ":" + c.destination + ":" + c.chemin.length, pts });
  return pts;
}

function pointSurChemin(c, t){
  const ch = cheminRendu(c);
  const n = ch.length;
  if (n === 0) return {x:0,y:0};
  if (n === 1) return ch[0];
  const f = clamp(t,0,1)*(n-1);
  const i = Math.min(n-2, Math.floor(f));
  const k = f-i;
  const a = ch[i], b = ch[i+1];
  return { x: lerp(a.x,b.x,k), y: lerp(a.y,b.y,k) };
}

function dessinerConvoyeur(c){
  if (!c.chemin.length) return;
  const orphelin = c.etat === "non_relie";
  const ch = cheminRendu(c);

  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(ch[0].x, ch[0].y);
  for (let i=1;i<ch.length;i++) ctx.lineTo(ch[i].x, ch[i].y);

  // châssis
  ctx.strokeStyle = orphelin ? "#5a3430" : "#2c3036";
  ctx.lineWidth = 0.82; ctx.stroke();
  // bande
  ctx.strokeStyle = orphelin ? "#7a4038" : "#41474e";
  ctx.lineWidth = 0.62; ctx.stroke();

  // défilement de la bande : décalage temporel commun, jamais stocké
  if (vue.zoom > CONFIG.seuilSchema){
    const avance = (vue.temps * CONV.vitesse * 4) % 0.6;
    ctx.strokeStyle = "rgba(0,0,0,.3)";
    ctx.lineWidth = 0.6;
    ctx.setLineDash([0.12, 0.48]);
    ctx.lineDashOffset = -avance;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }
  // rebords
  ctx.strokeStyle = "rgba(255,255,255,.07)";
  ctx.lineWidth = 0.06;
  ctx.stroke();

  // Chevrons : dans un réseau, savoir dans quel sens ça circule n'est pas
  // un détail. On les fait défiler le long du chemin.
  if (!orphelin && vue.zoom > CONFIG.seuilSchema){
    const n = ch.length;
    const glisse = (vue.temps * 0.55) % 1;
    ctx.strokeStyle = "rgba(255,255,255,.22)";
    ctx.lineWidth = 0.07;
    ctx.lineCap = "round";
    for (let i = 0; i < n-1; i++){
      const a = ch[i], b = ch[i+1];
      const dx = b.x-a.x, dy = b.y-a.y;
      const px = a.x + dx*glisse, py = a.y + dy*glisse;
      ctx.beginPath();
      ctx.moveTo(px - dx*0.16 - dy*0.16, py - dy*0.16 - dx*0.16);
      ctx.lineTo(px + dx*0.1, py + dy*0.1);
      ctx.lineTo(px - dx*0.16 + dy*0.16, py - dy*0.16 + dx*0.16);
      ctx.stroke();
    }
  }

  if (orphelin){
    const p = pointSurChemin(c, 0.5);
    dessinerAlerte(p.x, p.y, "!", "#e0574a");
    return;
  }

  // Les pièces en transit : positions calculées à partir des colis, jamais
  // stockées dans l'état (§7.2).
  if (vue.zoom > CONFIG.seuilSchema){
    let dessines = 0, bloques = 0;
    for (let i=0; i<c.transit.length && dessines < CONFIG.itemsConvoyeurMax; i++){
      const p = c.transit[i];
      let t;
      if (p.t <= 0){ t = 1 - bloques*0.055; bloques++; }
      else t = 1 - p.t / c.latence;
      // Une vignette par pièce, plafonnée : une bande chargée paraît chargée,
      // une bande à vide paraît vide (§7.2).
      const n = clamp(Math.round(p.qte), 1, 8);
      for (let k=0; k<n && dessines<CONFIG.itemsConvoyeurMax; k++, dessines++){
        const tt = clamp(t - k*0.052, 0, 1);
        const pt = pointSurChemin(c, tt);
        const lat = (bruit(i*13+k*7)-0.5)*0.22;      // léger désordre, déterministe
        dessinerItem(pt.x+lat, pt.y+lat*0.6, 0.44, p.item);
      }
    }
  }
}

/* ------------------------------------------------------------ Machines */
function dessinerMachine(m){
  const d = MACHINES[m.type];
  const x = m.x, y = m.y, l = m.l, h = m.h;
  const produit = m.etat === "produit";

  ctx.save();

  // Vibration d'une machine fatiguée (§3.2)
  if (m.usure > 0.55 && produit){
    const a = (m.usure-0.55)*0.06;
    ctx.translate(Math.sin(vue.temps*47+m.id)*a, Math.cos(vue.temps*53+m.id)*a);
  }

  // Ombre portée
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.fillRect(x+0.09, y+0.14, l, h);

  // Corps en gris acier. Le dégradé ne dépend que de la hauteur : on le garde
  // en mémoire pour ne rien allouer dans la boucle de rendu (§16).
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = gradientCorps(h);
  coinsArrondis(0.06, 0.06, l-0.12, h-0.12, 0.12);
  ctx.fill();
  ctx.restore();

  // Face avant visible, façon vue du dessus légèrement inclinée (§7.3)
  ctx.fillStyle = "#3a3f46";
  coinsArrondis(x+0.06, y+h-0.36, l-0.12, 0.3, 0.08);
  ctx.fill();

  // Bandeau de couleur par fonction
  ctx.fillStyle = d.couleur;
  ctx.fillRect(x+0.14, y+0.14, l-0.28, 0.16);
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.fillRect(x+0.14, y+0.26, l-0.28, 0.04);

  // Détails propres à chaque machine
  if (vue.zoom > CONFIG.seuilSchema) detailMachine(m, d, x, y, l, h, produit);

  // Traces d'huile sur une machine usée
  if (m.usure > 0.35){
    ctx.fillStyle = "rgba(18,14,8," + (m.usure*0.3).toFixed(2) + ")";
    ctx.beginPath(); ctx.ellipse(x+l*0.7, y+h-0.22, 0.28, 0.13, 0, 0, 7); ctx.fill();
  }

  ctx.restore();

  // Tas de pièces devant la machine quand ça bloque en sortie (§3.2)
  dessinerTasSortie(m);

  // Repères d'état
  dessinerEtatMachine(m);

  // Barre de progression discrète
  if (produit && vue.zoom > CONFIG.seuilDetail && m.enCycle){
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(x+0.2, y+h-0.19, l-0.4, 0.08);
    ctx.fillStyle = d.accent;
    ctx.fillRect(x+0.2, y+h-0.19, (l-0.4)*clamp(m.progression,0,1), 0.08);
  }
}

const cacheGradCorps = new Map();
function gradientCorps(h){
  let g = cacheGradCorps.get(h);
  if (!g){
    g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#767c84");
    g.addColorStop(0.55, "#5b6169");
    g.addColorStop(1, "#474d55");
    cacheGradCorps.set(h, g);
  }
  return g;
}

function coinsArrondis(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function detailMachine(m, d, x, y, l, h, produit){
  const cx = x+l/2, cy = y+h/2;
  switch (m.type){

    case "laveuse": {
      // bac d'eau, tambour qui brasse, clapotis
      ctx.fillStyle = "#2e3a44";
      coinsArrondis(x+0.24, y+0.4, l-0.48, h-0.74, 0.08); ctx.fill();
      const eau = ctx.createLinearGradient(0, y+0.4, 0, y+h-0.34);
      eau.addColorStop(0, produit ? "rgba(80,175,225,.75)" : "rgba(70,120,150,.4)");
      eau.addColorStop(1, produit ? "rgba(40,120,180,.75)" : "rgba(50,90,120,.4)");
      ctx.fillStyle = eau;
      coinsArrondis(x+0.3, y+0.46, l-0.6, h-0.86, 0.06); ctx.fill();
      if (produit){
        // rides à la surface, phase déterministe : pas de scintillement
        ctx.strokeStyle = "rgba(255,255,255,.35)";
        ctx.lineWidth = 0.035;
        for (let i=0;i<3;i++){
          const o = Math.sin(vue.temps*2.2 + i*1.7)*0.09;
          ctx.beginPath();
          ctx.moveTo(x+0.36, y+0.66+i*0.28+o);
          ctx.lineTo(x+l-0.36, y+0.66+i*0.28-o);
          ctx.stroke();
        }
        // patates qui tournent dans le bac
        for (let i=0;i<3;i++){
          const a = vue.temps*1.6 + i*2.1;
          dessinerItem(cx + Math.cos(a)*(l*0.2), cy + Math.sin(a)*(h*0.16), 0.34, "pdt_brutes");
        }
      }
      break;
    }

    case "trancheuse": {
      // capot, lame circulaire, rondelles qui tombent
      ctx.fillStyle = "#39404a";
      coinsArrondis(x+0.26, y+0.42, l-0.52, h-0.76, 0.06); ctx.fill();
      const a = produit ? vue.temps*19 : 0;
      ctx.save();
      ctx.translate(cx, cy+0.02); ctx.rotate(a);
      ctx.fillStyle = "#c2cad3";
      ctx.beginPath(); ctx.arc(0,0,0.3,0,7); ctx.fill();
      ctx.strokeStyle = "#8d959e"; ctx.lineWidth = 0.035;
      for (let i=0;i<6;i++){
        const t = i/6*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(t)*0.09, Math.sin(t)*0.09);
        ctx.lineTo(Math.cos(t)*0.3, Math.sin(t)*0.3);
        ctx.stroke();
      }
      ctx.restore();
      if (produit)
        for (let i=0;i<3;i++){
          const p = ((vue.temps*1.5 + i*0.33) % 1);
          dessinerItem(cx + 0.2 + i*0.12, cy + 0.1 + p*0.5, 0.26, "rondelles", 1-p*0.7);
        }
      break;
    }

    case "friteuse": {
      // bain d'huile chaude : bouillonnement et buée
      ctx.fillStyle = "#2f3238";
      coinsArrondis(x+0.2, y+0.4, l-0.4, h-0.72, 0.07); ctx.fill();
      // Une huile fatiguée se voit : elle fonce. C'est le premier signe (§3.2).
      const f = clamp(m.fraicheurHuile ?? 1, 0, 1);
      const a1 = produit ? 0.9 : 0.55;
      const hu = ctx.createLinearGradient(0, y+0.44, 0, y+h-0.34);
      hu.addColorStop(0, "rgba("+Math.round(lerp(96,240,f))+","+Math.round(lerp(62,185,f))+","+Math.round(lerp(24,60,f))+","+a1+")");
      hu.addColorStop(1, "rgba("+Math.round(lerp(66,190,f))+","+Math.round(lerp(42,125,f))+","+Math.round(lerp(16,35,f))+","+a1+")");
      ctx.fillStyle = hu;
      coinsArrondis(x+0.28, y+0.48, l-0.56, h-0.88, 0.05); ctx.fill();
      if (produit){
        // bulles : position et taille dérivées de l'index, donc stables
        ctx.fillStyle = "rgba(255,240,190,.6)";
        for (let i=0;i<9;i++){
          const bx = x+0.42 + bruit(i*5+m.id)*(l-0.84);
          const mont = ((vue.temps*0.9 + bruit(i*11)) % 1);
          const by = y+h-0.42 - mont*(h-0.95);
          const r = 0.025 + bruit(i*7)*0.035;
          ctx.beginPath(); ctx.arc(bx, by, r*(0.5+mont), 0, 7); ctx.fill();
        }
        // chips qui flottent
        for (let i=0;i<4;i++){
          const d2 = ((vue.temps*0.35 + i*0.25) % 1);
          dessinerItem(x+0.5 + d2*(l-1), cy+0.05 + Math.sin(vue.temps*2+i)*0.06, 0.3, "chips_vrac", 0.9);
        }
        // reflet de chaleur
        ctx.fillStyle = "rgba(255,190,90,.12)";
        coinsArrondis(x+0.2, y+0.4, l-0.4, h-0.72, 0.07); ctx.fill();
      }
      // hotte
      ctx.fillStyle = "#4c525a";
      ctx.fillRect(x+l*0.5-0.3, y+0.1, 0.6, 0.24);
      break;
    }

    case "tambour": {
      // tambour incliné qui tourne, nuage d'arôme
      ctx.fillStyle = "#3a3428";
      coinsArrondis(x+0.24, y+0.42, l-0.48, h-0.76, 0.1); ctx.fill();
      ctx.save();
      ctx.translate(cx, cy+0.02);
      const g2 = ctx.createLinearGradient(0,-0.3,0,0.3);
      g2.addColorStop(0,"#c9a55e"); g2.addColorStop(1,"#8a7038");
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.ellipse(0,0,l*0.3,h*0.2,0,0,7); ctx.fill();
      // cerclages qui défilent = rotation lisible
      ctx.strokeStyle = "rgba(40,32,18,.6)"; ctx.lineWidth = 0.05;
      for (let i=0;i<4;i++){
        const p = ((vue.temps*(produit?0.8:0) + i*0.25) % 1);
        const dx = (p-0.5)*l*0.56;
        ctx.beginPath();
        ctx.ellipse(dx, 0, 0.05, h*0.19, 0, 0, 7);
        ctx.stroke();
      }
      ctx.restore();
      if (produit){
        ctx.fillStyle = "rgba(201,80,46,.16)";
        ctx.beginPath(); ctx.arc(cx, cy, 0.55+Math.abs(Math.sin(vue.temps*2))*0.12, 0, 7); ctx.fill();
      }
      break;
    }

    case "ensacheuse": {
      // colonne verticale : le film descend, le sachet tombe
      ctx.fillStyle = "#2e3238";
      coinsArrondis(x+0.18, y+0.34, l-0.36, h-0.62, 0.08); ctx.fill();
      ctx.fillStyle = "#454c56";
      ctx.fillRect(cx-0.28, y+0.42, 0.56, h-0.9);
      // bobine de film
      dessinerItem(x+0.55, y+0.72, 0.5, "film");
      if (produit){
        ctx.fillStyle = "rgba(196,158,240,.16)";
        coinsArrondis(x+0.18, y+0.34, l-0.36, h-0.62, 0.08); ctx.fill();
        for (let i=0;i<3;i++){
          const p = ((vue.temps*1.1 + i*0.34) % 1);
          dessinerItem(cx, y+0.7 + p*(h-1.15), 0.42, "sachet", 1-p*0.45);
        }
      }
      // mâchoire de soudure
      ctx.fillStyle = "#5a6270";
      ctx.fillRect(cx-0.34, y+h-0.62, 0.68, 0.12);
      break;
    }

    case "tri": {
      // plan de travail, deux bacs : ce qui passe, ce qu'on écarte
      ctx.fillStyle = "#cfd6dd";
      coinsArrondis(x+0.2, y+0.42, l-0.4, h-0.78, 0.05); ctx.fill();
      ctx.strokeStyle = "#8d959e"; ctx.lineWidth = 0.04;
      coinsArrondis(x+0.2, y+0.42, l-0.4, h-0.78, 0.05); ctx.stroke();
      // le tapis de tri défile
      if (produit){
        ctx.strokeStyle = "rgba(90,100,110,.5)"; ctx.lineWidth = 0.05;
        const d2 = (vue.temps*0.7) % 0.4;
        for (let i=-0.4; i<l; i+=0.4){
          const px = x+0.25+i+d2;
          if (px < x+0.24 || px > x+l-0.24) continue;
          ctx.beginPath(); ctx.moveTo(px, y+0.46); ctx.lineTo(px, y+h-0.4); ctx.stroke();
        }
      }
      // bac de rebut au bout
      ctx.fillStyle = "#4a4034";
      coinsArrondis(x+l-0.5, y+h-0.5, 0.36, 0.34, 0.04); ctx.fill();
      const r = m.entree["chips_ratees"] || m.entree["sachet_rate"] || 0;
      if (r > 0.5){
        const it = m.entree["chips_ratees"] ? "chips_ratees" : "sachet_rate";
        for (let i=0;i<3;i++)
          dessinerItem(x+0.55+bruit(i*7+m.id)*(l-1.3), y+0.62+bruit(i*3+m.id)*(h-1.1), 0.3, it);
      }
      break;
    }

    case "silo": {
      // cylindre vu du dessus, avec sa jauge de remplissage
      const cap = MACHINES.silo.capacite;
      const ray = Math.min(l,h)/2 - 0.2;
      ctx.fillStyle = "#6e7780";
      ctx.beginPath(); ctx.arc(cx, cy, ray, 0, 7); ctx.fill();
      ctx.strokeStyle = "#4a525a"; ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.arc(cx, cy, ray, 0, 7); ctx.stroke();
      const rempli = clamp(contenuTotal(m.sortie)/cap, 0, 1);
      if (rempli > 0.01){
        const it = m.filtre || Object.keys(m.sortie)[0];
        ctx.fillStyle = (ITEMS[it] && ITEMS[it].couleur) || "#c8b07a";
        ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.arc(cx, cy, (ray-0.08)*Math.sqrt(rempli), 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 0.05;
      for (let i=0;i<4;i++){
        const a2 = i/4*Math.PI*2 + 0.4;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(a2)*ray*0.45, cy+Math.sin(a2)*ray*0.45);
        ctx.lineTo(cx+Math.cos(a2)*ray*0.94, cy+Math.sin(a2)*ray*0.94);
        ctx.stroke();
      }
      break;
    }

    case "caisse_dediee":
    case "caisse": {
      ctx.fillStyle = m.type === "caisse_dediee" ? "#9a8752" : "#8a6b45";
      coinsArrondis(x+0.12, y+0.12, l-0.24, h-0.24, 0.05); ctx.fill();
      ctx.strokeStyle = "#5f4930"; ctx.lineWidth = 0.07;
      coinsArrondis(x+0.12, y+0.12, l-0.24, h-0.24, 0.05); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x+0.12,y+h/2); ctx.lineTo(x+l-0.12,y+h/2);
      ctx.moveTo(x+l/2,y+0.12); ctx.lineTo(x+l/2,y+h-0.12);
      ctx.stroke();
      if (m.type === "caisse_dediee" && m.filtre){
        // une étiquette : on voit d'un coup d'œil à quoi le bac est réservé
        ctx.fillStyle = (ITEMS[m.filtre] && ITEMS[m.filtre].couleur) || "#c8b07a";
        ctx.fillRect(x+0.3, y+0.22, l-0.6, 0.15);
      }
      const items = Object.keys(m.sortie).filter(k=>m.sortie[k]>0.5);
      if (items.length){
        const total = contenuTotal(m.sortie);
        const n = Math.min(6, Math.ceil(total/120));
        for (let i=0;i<n;i++)
          dessinerItem(x+0.4+bruit(i*5+m.id)*(l-0.8), y+0.4+bruit(i*11+m.id)*(h-0.8), 0.4, items[i%items.length]);
      }
      break;
    }
  }
}

/** Les pièces qui s'entassent devant une machine bloquée. */
function dessinerTasSortie(m){
  const d = MACHINES[m.type];
  if (d.stockage || vue.zoom <= CONFIG.seuilDetail) return;
  const items = Object.keys(m.sortie).filter(k => m.sortie[k] > 0.5);
  if (!items.length) return;
  const total = contenuTotal(m.sortie);
  const n = clamp(Math.round(total/2), 1, 9);
  for (let i=0;i<n;i++){
    const it = items[i % items.length];
    const bx = m.x + 0.3 + bruit(i*3+m.id*7)*(m.l-0.6);
    const by = m.y + m.h + 0.12 + bruit(i*9+m.id)*0.3;
    dessinerItem(bx, by, 0.42, it);
  }
}

/** Icônes flottantes d'état : le diagnostic à l'œil nu (§3.2). */
function dessinerEtatMachine(m){
  if (vue.zoom <= CONFIG.seuilSchema) return;
  const cx = m.x + m.l/2, hy = m.y - 0.34;
  const bat = 0.5 + 0.5*Math.sin(vue.temps*4.5);

  if (m.enPanne){
    ctx.save();
    ctx.globalAlpha = 0.55 + bat*0.45;
    dessinerAlerte(cx, hy, "clé", "#e0574a");
    ctx.restore();
    return;
  }
  if (m.arretRestant > 0){
    ctx.save(); ctx.globalAlpha = 0.5 + bat*0.4;
    dessinerAlerte(cx, hy, "goutte", "#d9b23c"); ctx.restore();
    return;
  }
  // Huile fatiguée : on prévient avant que la marchandise en pâtisse.
  if (MACHINES[m.type].bainHuile && etat.meta.age >= 3 && (m.fraicheurHuile ?? 1) < 0.35){
    ctx.save(); ctx.globalAlpha = 0.3 + bat*0.45;
    dessinerAlerte(cx, hy, "goutte", "#e8863c"); ctx.restore();
  }
  if (m.etat === "attente_matiere"){
    // liseré orange clignotant + la pièce qui manque
    ctx.save();
    ctx.globalAlpha = 0.3 + bat*0.55;
    ctx.strokeStyle = "#e8a03c"; ctx.lineWidth = 0.08;
    coinsArrondis(m.x+0.03, m.y+0.03, m.l-0.06, m.h-0.06, 0.14); ctx.stroke();
    ctx.restore();
    const r = recetteDe(m);
    if (r){
      const manquant = r.entrees.find(e => (m.entree[e.id]||0) < e.qte);
      if (manquant){
        const flot = Math.sin(vue.temps*2.4)*0.07;
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = "rgba(18,20,24,.8)";
        ctx.beginPath(); ctx.arc(cx, hy+flot, 0.32, 0, 7); ctx.fill();
        ctx.strokeStyle = "#e8a03c"; ctx.lineWidth = 0.045; ctx.stroke();
        dessinerItem(cx, hy+flot, 0.4, manquant.id);
        ctx.restore();
      }
    }
    return;
  }
  if (m.etat === "sortie_pleine"){
    ctx.save(); ctx.globalAlpha = 0.35 + bat*0.4;
    dessinerAlerte(cx, hy, "plein", "#e8a03c"); ctx.restore();
    return;
  }
  if (m.etat === "sans_operateur"){
    ctx.save(); ctx.globalAlpha = 0.35 + bat*0.35;
    dessinerAlerte(cx, hy, "personne", "#9aa2ac"); ctx.restore();
  }
}

function dessinerAlerte(x, y, sorte, couleur){
  ctx.save();
  ctx.fillStyle = "rgba(16,18,22,.85)";
  ctx.beginPath(); ctx.arc(x,y,0.3,0,7); ctx.fill();
  ctx.strokeStyle = couleur; ctx.lineWidth = 0.05; ctx.stroke();
  ctx.strokeStyle = couleur; ctx.fillStyle = couleur;
  ctx.lineWidth = 0.06; ctx.lineCap = "round";
  if (sorte === "clé"){
    ctx.beginPath(); ctx.arc(x-0.08,y-0.07,0.08,0.6,5.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-0.03,y-0.02); ctx.lineTo(x+0.11,y+0.12); ctx.stroke();
  } else if (sorte === "!"){
    ctx.beginPath(); ctx.moveTo(x,y-0.13); ctx.lineTo(x,y+0.04); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y+0.13,0.032,0,7); ctx.fill();
  } else if (sorte === "plein"){
    for (let i=0;i<3;i++) ctx.fillRect(x-0.13+i*0.1, y-0.02+i*0.03, 0.075, 0.075);
  } else if (sorte === "goutte"){
    ctx.beginPath();
    ctx.moveTo(x, y-0.15);
    ctx.quadraticCurveTo(x+0.12, y+0.02, x, y+0.12);
    ctx.quadraticCurveTo(x-0.12, y+0.02, x, y-0.15);
    ctx.closePath(); ctx.fill();
  } else if (sorte === "personne"){
    ctx.beginPath(); ctx.arc(x,y-0.09,0.06,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x,y-0.02); ctx.lineTo(x,y+0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-0.09,y+0.16); ctx.lineTo(x+0.09,y-0.16); ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================================
   RENDU (3/3) — ouvriers, particules, calques, boucle de dessin
   ========================================================================== */

/* -------------------------------------------------------------- Ouvriers */
function dessinerOuvrier(o){
  const marche = (o.etat === "deplace" || o.etat === "porte") && o.chemin && o.chemin.length;
  const bob = marche ? Math.sin(o.phase*0.55)*0.045 : 0;
  const x = o.x, y = o.y + bob;

  // ombre
  ctx.fillStyle = "rgba(0,0,0,.34)";
  ctx.beginPath(); ctx.ellipse(x, y+0.2, 0.2, 0.09, 0, 0, 7); ctx.fill();

  if (vue.zoom <= CONFIG.seuilDetail){
    ctx.fillStyle = "#dcc27a";
    ctx.beginPath(); ctx.arc(x, y, 0.16, 0, 7); ctx.fill();
    return;
  }

  // bras : croisés quand il attend, écartés quand il porte
  ctx.strokeStyle = "#3f6ba8"; ctx.lineWidth = 0.09; ctx.lineCap = "round";
  if (o.etat === "attend" || o.etat === "pause"){
    ctx.beginPath(); ctx.moveTo(x-0.14,y+0.02); ctx.lineTo(x+0.14,y+0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-0.14,y+0.06); ctx.lineTo(x+0.14,y+0.02); ctx.stroke();
  } else {
    const s = marche ? Math.sin(o.phase*0.55)*0.07 : 0;
    ctx.beginPath(); ctx.moveTo(x-0.15,y-0.02+s); ctx.lineTo(x-0.19,y+0.1+s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+0.15,y-0.02-s); ctx.lineTo(x+0.19,y+0.1-s); ctx.stroke();
  }

  // buste (bleu de travail)
  ctx.fillStyle = "#4a79b8";
  coinsArrondis(x-0.15, y-0.12, 0.3, 0.32, 0.09); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.fillRect(x-0.15, y+0.1, 0.3, 0.1);

  // tête + casque
  ctx.fillStyle = "#e0b98d";
  ctx.beginPath(); ctx.arc(x, y-0.13, 0.115, 0, 7); ctx.fill();
  ctx.fillStyle = "#e8c33c";
  ctx.beginPath(); ctx.arc(x, y-0.15, 0.12, Math.PI, 0); ctx.fill();
  ctx.fillRect(x-0.13, y-0.16, 0.26, 0.035);

  // ce qu'il porte
  if (o.charge){
    dessinerItem(x, y-0.42, 0.44, o.charge.item);
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.font = "0.16px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(mesure(o.charge.item, o.charge.qte), x, y-0.62);
  }

  // sueur quand il court partout (§3.2)
  if (o.fatigue > 0.65){
    const a = 0.4 + 0.6*Math.abs(Math.sin(vue.temps*3+o.id));
    ctx.fillStyle = "rgba(120,190,235," + a.toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(x+0.17, y-0.22, 0.045, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+0.17,y-0.3); ctx.lineTo(x+0.2,y-0.24); ctx.lineTo(x+0.14,y-0.24); ctx.closePath(); ctx.fill();
  }
  // petit z de pause
  if (o.etat === "pause"){
    ctx.fillStyle = "rgba(210,220,235,.8)";
    ctx.font = "0.24px Segoe UI, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("z", x+0.18, y-0.3 - (vue.temps*0.4 % 0.3));
  }
  // étincelles au poste de soudure : gérées par les particules
}

/* ------------------------------------------------------------ Particules */
function particule(x, y, sorte){
  if (vue.particules.length >= CONFIG.particulesMax) return;
  const p = { x, y, vx:0, vy:0, vie:1, max:1, sorte, taille:0.1, teinte:0 };
  switch (sorte){
    case "etincelle":
      p.vx = hasard(-1.6,1.6); p.vy = hasard(-1.8,0.4);
      p.max = p.vie = hasard(0.25,0.6); p.taille = hasard(0.02,0.05); break;
    case "fumeeGrise":
      p.vx = hasard(-0.15,0.15); p.vy = hasard(-0.5,-0.2);
      p.max = p.vie = hasard(0.9,1.7); p.taille = hasard(0.1,0.24); break;
    case "fumeeNoire":
      p.vx = hasard(-0.25,0.25); p.vy = hasard(-0.7,-0.3);
      p.max = p.vie = hasard(1.2,2.2); p.taille = hasard(0.14,0.3); break;
    case "vapeur":
      p.vx = hasard(-0.4,0.4); p.vy = hasard(-0.3,-0.05);
      p.max = p.vie = hasard(0.5,1.1); p.taille = hasard(0.12,0.26); break;
    case "poussiere":
      p.vx = hasard(-0.8,0.8); p.vy = hasard(-0.8,-0.1);
      p.max = p.vie = hasard(0.4,0.9); p.taille = hasard(0.05,0.13); break;
    case "goutte":
      p.vx = hasard(-1.1,1.1); p.vy = hasard(-1.5,-0.3);
      p.max = p.vie = hasard(0.3,0.6); p.taille = hasard(0.02,0.05); break;
    case "poudre":
      p.vx = hasard(-0.5,0.5); p.vy = hasard(-0.45,-0.1);
      p.max = p.vie = hasard(0.6,1.2); p.taille = hasard(0.04,0.1); break;
    case "souffle":
      p.vx = hasard(-1.4,1.4); p.vy = hasard(-0.3,0.3);
      p.max = p.vie = hasard(0.2,0.45); p.taille = hasard(0.08,0.18); break;
    case "eclat":
      p.vx = hasard(-1.2,1.2); p.vy = hasard(-1.4,-0.2);
      p.max = p.vie = hasard(0.3,0.7); p.taille = hasard(0.03,0.07); break;
  }
  vue.particules.push(p);
}

function majParticules(dts){
  const P = vue.particules;
  for (let i=P.length-1; i>=0; i--){
    const p = P[i];
    p.vie -= dts;
    if (p.vie <= 0){ P[i] = P[P.length-1]; P.pop(); continue; }
    p.x += p.vx*dts; p.y += p.vy*dts;
    if (p.sorte === "etincelle" || p.sorte === "eclat") p.vy += 3.4*dts;
    else p.vy -= 0.25*dts;
    p.vx *= (1 - 1.6*dts);
  }
  // textes qui montent
  const F = vue.flottants;
  for (let i=F.length-1; i>=0; i--){
    const f = F[i];
    f.vie -= dts;
    f.y -= dts*0.75;
    if (f.vie <= 0){ F[i] = F[F.length-1]; F.pop(); }
  }
}

function dessinerParticules(){
  for (const p of vue.particules){
    const a = clamp(p.vie/p.max, 0, 1);
    switch (p.sorte){
      case "etincelle":
        ctx.fillStyle = "rgba(255," + Math.round(200+55*a) + "," + Math.round(90*a) + "," + a.toFixed(2) + ")";
        ctx.fillRect(p.x, p.y, p.taille, p.taille); break;
      case "eclat":
        ctx.fillStyle = "rgba(220,230,240," + (a*0.8).toFixed(2) + ")";
        ctx.fillRect(p.x, p.y, p.taille, p.taille); break;
      case "fumeeNoire":
        ctx.fillStyle = "rgba(24,24,26," + (a*0.55).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
      case "fumeeGrise":
        ctx.fillStyle = "rgba(150,152,156," + (a*0.32).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
      case "vapeur":
        ctx.fillStyle = "rgba(232,236,240," + (a*0.26).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
      case "poussiere":
        ctx.fillStyle = "rgba(140,132,118," + (a*0.4).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille,0,7); ctx.fill(); break;
      case "goutte":
        ctx.fillStyle = "rgba(150,205,240," + (a*0.7).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille,0,7); ctx.fill(); break;
      case "poudre":
        ctx.fillStyle = "rgba(201,110,60," + (a*0.38).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(1.6-a),0,7); ctx.fill(); break;
      case "souffle":
        ctx.fillStyle = "rgba(220,225,235," + (a*0.22).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.taille*(2-a),0,7); ctx.fill(); break;
    }
  }
}

function flottant(x, y, texte, couleur){
  if (vue.flottants.length > 24) vue.flottants.shift();
  vue.flottants.push({ x, y, texte, couleur, vie:1.8 });
}

function dessinerFlottants(){
  ecranSeul();
  ctx.textAlign = "center";
  for (const f of vue.flottants){
    const e = mondeVersEcran(f.x, f.y);
    const a = clamp(f.vie/1.8, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = "700 " + Math.round(13*Math.min(1.3, vue.zoom)) + "px Segoe UI, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillText(f.texte, e.x+1, e.y+1);
    ctx.fillStyle = f.couleur;
    ctx.fillText(f.texte, e.x, e.y);
  }
  ctx.globalAlpha = 1;
  appliquerCamera();
}

/** Effets déclenchés par la simulation, pas par le rendu. */
function effetProduction(m, r){
  const cx = m.x+m.l/2, cy = m.y+m.h/2;
  if (m.type === "friteuse")   for (let i=0;i<8;i++) particule(cx+hasard(-0.6,0.6), cy-0.1, "vapeur");
  if (m.type === "laveuse")    for (let i=0;i<5;i++) particule(cx+hasard(-0.3,0.3), cy, "goutte");
  if (m.type === "trancheuse") for (let i=0;i<4;i++) particule(cx+hasard(-0.2,0.2), cy, "eclat");
  if (m.type === "tambour")    for (let i=0;i<5;i++) particule(cx+hasard(-0.3,0.3), cy, "poudre");
  if (m.type === "ensacheuse") for (let i=0;i<3;i++) particule(cx, cy, "souffle");
  son(m.type);
  if (ITEMS[r.sortie.id].cat === "produit"){
    flottant(m.x+m.l/2, m.y-0.2, "+" + mesure(r.sortie.id, r.sortie.qte), "#8fe09c");
    son("valide");
  }
}

/** Fumée continue des machines fatiguées ou en panne. */
function fumeeMachines(dts){
  for (const m of U().machines){
    if (m.enPanne){
      if (Math.random() < dts*7) particule(m.x+m.l*0.7, m.y+0.3, "fumeeNoire");
    } else if (m.usure > 0.5 && m.etat === "produit"){
      if (Math.random() < dts*(m.usure-0.5)*7) particule(m.x+m.l*0.7, m.y+0.3, "fumeeGrise");
    }
  }
}

/* ------------------------------------------------- Aperçu de construction */
function dessinerApercu(){
  if (!vue.outil || !vue.souris.dedans) return;
  const u = U();
  const tx = vue.souris.tx, ty = vue.souris.ty;

  if (vue.outil.type === "machine"){
    const d = MACHINES[vue.outil.id];
    const tourne = vue.rotation % 2 === 1;
    const l = tourne ? d.h : d.l, h = tourne ? d.l : d.h;
    const ok = peutPoser(u, vue.outil.id, tx, ty, vue.rotation) && etat.finances.solde >= d.cout;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = ok ? "rgba(92,186,107,.45)" : "rgba(224,87,74,.45)";
    ctx.fillRect(tx,ty,l,h);
    ctx.strokeStyle = ok ? "#5cba6b" : "#e0574a";
    ctx.lineWidth = 0.07;
    ctx.strokeRect(tx,ty,l,h);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = d.couleur;
    ctx.fillRect(tx+0.14, ty+0.14, l-0.28, 0.16);
    ctx.restore();
  }
  else if (vue.outil.type === "convoyeur"){
    const trace = vue.traceConvoyeur;
    if (trace && trace.length > 1){
      // La bande fantôme, dessinée comme la vraie : on voit tout de suite le
      // trajet qu'elle prendra pour contourner ce qui encombre.
      const bon = trace.every(t => occupant(u,t.x,t.y) === 0);
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(trace[0].x+0.5, trace[0].y+0.5);
      for (let i=1;i<trace.length;i++) ctx.lineTo(trace[i].x+0.5, trace[i].y+0.5);
      ctx.strokeStyle = bon ? "rgba(92,186,107,.30)" : "rgba(224,87,74,.32)";
      ctx.lineWidth = 0.82; ctx.stroke();
      ctx.strokeStyle = bon ? "#5cba6b" : "#e0574a";
      ctx.lineWidth = 0.1; ctx.setLineDash([0.3,0.22]);
      ctx.lineDashOffset = -vue.temps*1.6;
      ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;

      // Les deux ancrages
      for (const [p, n] of [[trace[0], vue.convDepart], [trace[trace.length-1], vue.convArrivee]]){
        ctx.fillStyle = (n && n.noeud) ? "rgba(92,186,107,.9)" : "rgba(240,180,41,.85)";
        ctx.beginPath(); ctx.arc(p.x+0.5, p.y+0.5, 0.17, 0, 7); ctx.fill();
      }

      // Ce que ça coûtera, au bout du curseur
      const e = mondeVersEcran(trace[trace.length-1].x+0.5, trace[trace.length-1].y-0.35);
      ecranSeul();
      ctx.font = "600 12px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      const txt = trace.length + " tuiles · " + euros(trace.length*CONV.coutParTuile);
      const w = ctx.measureText(txt).width;
      ctx.fillStyle = "rgba(18,20,24,.88)";
      ctx.fillRect(e.x-w/2-7, e.y-14, w+14, 20);
      ctx.fillStyle = bon ? "#8fe09c" : "#f0a094";
      ctx.fillText(txt, e.x, e.y);
      ctx.textAlign = "left";
      appliquerCamera();
    } else {
      const libre = dansGrille(u,tx,ty) && occupant(u,tx,ty) === 0;
      const surNoeud = !!noeudSous(tx,ty);
      ctx.fillStyle = (libre || surNoeud) ? "rgba(92,186,107,.35)" : "rgba(224,87,74,.35)";
      ctx.fillRect(tx,ty,1,1);
      if (!vue.convDepart && surNoeud){
        ctx.strokeStyle = "rgba(92,186,107,.8)"; ctx.lineWidth = 0.07;
        ctx.strokeRect(tx+0.06, ty+0.06, 0.88, 0.88);
      }
    }
  }
  else if (vue.outil.type === "pioche"){
    const o = occupant(u,tx,ty);
    if (o > 1){
      const n = noeudParId(o);
      ctx.fillStyle = "rgba(224,87,74,.3)";
      if (n && n.type === "convoyeur") for (const t of n.chemin) ctx.fillRect(t.x,t.y,1,1);
      else if (n) ctx.fillRect(n.x,n.y,n.l,n.h);
    }
  }
}

/* ---------------------------------------------------- Sélection et survol */
function dessinerSelection(){
  const n = vue.selection ? noeudParId(vue.selection) : null;
  if (n && n.type !== "convoyeur"){
    ctx.strokeStyle = "#f0b429"; ctx.lineWidth = 0.075;
    ctx.setLineDash([0.3,0.18]);
    ctx.lineDashOffset = -vue.temps*1.2;
    ctx.strokeRect(n.x-0.08, n.y-0.08, n.l+0.16, n.h+0.16);
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  } else if (n && n.type === "convoyeur"){
    ctx.strokeStyle = "#f0b429"; ctx.lineWidth = 0.1;
    const ps = cheminRendu(n);
    ctx.beginPath();
    ctx.moveTo(ps[0].x, ps[0].y);
    for (let i=1;i<ps.length;i++) ctx.lineTo(ps[i].x, ps[i].y);
    ctx.stroke();
  }
  const s = vue.survol;
  if (s && s.id !== vue.selection && s.type !== "convoyeur"){
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 0.05;
    ctx.strokeRect(s.x-0.05, s.y-0.05, s.l+0.1, s.h+0.1);
  }
}

/* ------------------------------------------------------- Lumière du jour */
function dessinerLumiere(){
  const t = minuteDuJour() / CONFIG.minutesParJour;
  // matin chaud, journée neutre, fin d'après-midi bleutée
  // Une lumière, pas un voile : au-delà, le béton vire au beige et on ne
  // distingue plus rien sur les grands ateliers.
  let r,g,b,a;
  if (t < 0.25){ const k = t/0.25; r=255;g=196;b=132; a=0.12*(1-k); }
  else if (t > 0.74){ const k=(t-0.74)/0.26; r=70;g=95;b=160; a=0.18*k; }
  else { r=255;g=255;b=255; a=0; }

  ecranSeul();
  if (a > 0.005){
    ctx.globalCompositeOperation = "overlay";
    ctx.fillStyle = "rgba("+r+","+g+","+b+","+a.toFixed(3)+")";
