/* ============================================================================
   UI — outils de développement
   Ouvert par F2. Sert à atteindre n'importe quel âge sans le jouer, à mettre
   l'usine dans un état précis, et à vérifier que la partie tient debout.
   Rien ici n'est nécessaire pour jouer.
   ========================================================================== */

/** Saute directement à un âge : agrandit l'atelier et marque les objectifs
 *  précédents comme atteints, sans passer par les écrans d'annonce. */
function sauterAge(n){
  n = clamp(Math.round(n), 1, AGES.length);
  etat.meta.age = n;
  etat.progression.objectifsCompletes = [];
  for (let i=1;i<n;i++) etat.progression.objectifsCompletes.push(i);
  const a = AGES[n-1];
  agrandirUsine(Math.max(a.largeur, U().largeur), Math.max(a.hauteur, U().hauteur));
  U().nom = a.nom;
  reindexer();
  majBarreConstruction(); majBandeau(); majPanneau();
  notif("Âge " + n, "Vous voilà à « " + a.nom + " ». Atelier " + U().largeur + " × " + U().hauteur + ".", "");
}

/** Remplit le quai de tout ce qui s'achète, de quoi tenir plusieurs jours. */
function remplirStocks(){
  for (const id in ITEMS)
    if (ITEMS[id].achat) ajouterStock(id, ITEMS[id].unite === "kg" ? 3000 : 300);
  majPanneau();
  notif("Quai rempli", "De quoi faire tourner un moment.", "");
}

/** Fait tourner la simulation d'un coup, sans attendre. */
function avancerTemps(jours){
  const n = Math.round(jours * CONFIG.ticksParJour);
  const v = etat.meta.vitesse;
  for (let i=0;i<n;i++){
    simTick();
    if ($("#ecranVendredi").classList.contains("visible")) break;   // on s'arrête au bilan
  }
  etat.meta.vitesse = v;
  majBandeau(); majPanneau();
}

/* ==========================================================================
   Auto-vérifications — les invariants qui doivent tenir à tout moment.
   Utilisables depuis le panneau, et appelées par la suite de tests.
   ========================================================================== */
function verifierPartie(){
  const r = [];
  const ok = (nom, cond, detail) => r.push({ nom, ok: !!cond, detail: detail || "" });
  const u = U();

  /* --- 1. Cohérence de la grille --- */
  let tuilesOrphelines = 0, tuilesManquantes = 0, horsZone = 0;
  const co = profondeurCour(u);
  for (let y=-co;y<u.hauteur+co;y++) for (let x=-co;x<u.largeur+co;x++){
    const o = u.grille[indexCase(u,x,y)];
    if (o > 1 && !noeudParId(o)) tuilesOrphelines++;
  }
  for (const m of u.machines){
    for (let dy=0;dy<m.h;dy++) for (let dx=0;dx<m.l;dx++)
      if (u.grille[indexCase(u, m.x+dx, m.y+dy)] !== m.id) tuilesManquantes++;
    const bat = (MACHINES[m.type]||{}).batiment;
    if (bat ? !rectDansCour(u,m.x,m.y,m.l,m.h) : !rectDansAtelier(u,m.x,m.y,m.l,m.h)) horsZone++;
  }
  let pontsFaux = 0;
  for (const c of u.convoyeurs)
    for (const t of c.chemin){
      // Une tuile de pont laisse la grille à la bande du dessous : c'est normal
      // qu'elle n'y soit pas. En revanche il doit vraiment y avoir une bande.
      if (estPont(c,t.x,t.y)){
        if (!surBande(u,t.x,t.y)) pontsFaux++;
      } else if (u.grille[indexCase(u,t.x,t.y)] !== c.id) tuilesManquantes++;
      if (!dansAtelier(u,t.x,t.y)) horsZone++;
    }
  ok("Grille cohérente", tuilesOrphelines === 0 && tuilesManquantes === 0,
      tuilesOrphelines + " tuiles orphelines, " + tuilesManquantes + " tuiles manquantes");
  ok("Les ponts enjambent quelque chose", pontsFaux === 0,
      pontsFaux ? pontsFaux + " ponts au-dessus du vide" : "aucun pont en l'air");
  ok("Chacun de son côté du mur", horsZone === 0,
      horsZone ? horsZone + " éléments du mauvais côté" : "machines dedans, bâtiments dehors");

  /* --- 2. Aucun nombre aberrant --- */
  const nombres = [];
  const scruter = (o, chemin, prof) => {
    if (prof > 6 || o == null) return;
    for (const k in o){
      const v = o[k];
      if (typeof v === "number"){ if (!isFinite(v)) nombres.push(chemin + "." + k); }
      else if (typeof v === "object" && !(v instanceof Uint16Array)) scruter(v, chemin + "." + k, prof+1);
    }
  };
  scruter(etat.finances, "finances", 0);
  scruter(u.stocks, "stocks", 0);
  scruter(u.stocksSortie, "stocksSortie", 0);
  for (const m of u.machines){ scruter(m.entree, "entree", 0); scruter(m.sortie, "sortie", 0); }
  ok("Aucun nombre aberrant", nombres.length === 0, nombres.slice(0,4).join(", "));

  /* --- 3. Convoyeurs bien raccordés --- */
  let convFaux = 0;
  for (const c of u.convoyeurs){
    const bouts = noeudParId(c.source) && noeudParId(c.destination);
    if (!bouts && c.etat !== "non_relie") convFaux++;
    if (c.source === c.id || c.destination === c.id) convFaux++;
  }
  ok("Convoyeurs raccordés", convFaux === 0, convFaux + " incohérences");

  /* --- 4. Ouvriers cohérents --- */
  let ouvFaux = 0;
  for (const o of u.ouvriers){
    if (o.id == null || o.id === 0) ouvFaux++;
    if (!dansPlan(u, Math.round(o.x-0.5), Math.round(o.y-0.5))) ouvFaux++;
    if (o.tache && o.tache.type === "opere" && !noeudParId(o.tache.machineId)) ouvFaux++;
    if (o.tache && o.tache.type === "porte" &&
        (!noeudParId(o.tache.sourceId) || !noeudParId(o.tache.cibleId))) ouvFaux++;
  }
  ok("Équipe cohérente", ouvFaux === 0, ouvFaux + " ouvriers en vrac");

  /* --- 5. Les recettes se tiennent --- */
  const mauvaises = [];
  for (const id in RECETTES){
    const rc = RECETTES[id];
    if (!MACHINES[rc.machine]) mauvaises.push(id + " : machine inconnue");
    if (!ITEMS[rc.sortie.id]) mauvaises.push(id + " : sortie inconnue");
    for (const e of rc.entrees) if (!ITEMS[e.id]) mauvaises.push(id + " : entrée " + e.id);
    if (!(rc.duree >= CONFIG.minutesParTick))
      mauvaises.push(id + " : durée sous un tick, du débit serait perdu");
  }
  for (const k in MACHINES)
    for (const rid of MACHINES[k].recettes)
      if (!RECETTES[rid]) mauvaises.push(k + " : recette " + rid + " absente");
  for (const k in ITEMS)
    if (ITEMS[k].rate && !ITEMS[ITEMS[k].rate]) mauvaises.push(k + " : variante ratée absente");
  ok("Recettes valides", mauvaises.length === 0, mauvaises.slice(0,3).join(" · "));

  /* --- 6. Chaque produit fini doit rapporter plus que sa matière --- */
  const perdants = [];
  for (const k in ITEMS){
    if (!ITEMS[k].vente || k === "rebut") continue;
    const pr = prixDeRevient(k);
    const vente = ITEMS[k].vente * pr.base;
    if (vente <= pr.total) perdants.push(k + " (" + eurosPrecis(pr.total) + " > " + eurosPrecis(vente) + ")");
  }
  ok("Recettes rentables", perdants.length === 0, perdants.join(", "));

  /* --- 7. Tous les objectifs d'âge sont gérés --- */
  const typesConnus = ["vendus","produitsSemaine","argent","compteur"];
  const objFaux = AGES.filter(a => a.debloque.length && !typesConnus.includes(a.objectif.type))
                      .map(a => a.nom);
  ok("Objectifs gérés", objFaux.length === 0, objFaux.join(", "));

  /* --- 8. Aller-retour de sauvegarde --- */
  let rt = "";
  try {
    const avant = serialiser();
    const copie = JSON.parse(avant);
    for (const us of copie.usines) us.grille = Uint16Array.from(us.grille);
    const memoire = etat;
    etat = copie;
    const apres = serialiser();
    etat = memoire;
    reindexer();
    if (avant !== apres) rt = "la partie relue diffère de l'originale";
  } catch (e){ rt = e.message; }
  ok("Sauvegarde fidèle", rt === "", rt);

  return r;
}

/* -------------------------------------------------------- Le panneau F2 */
function basculerDev(){
  const d = $("#panneauDev");
  if (d.classList.contains("visible")) d.classList.remove("visible");
  else { majPanneauDev(); d.classList.add("visible"); }
}

function majPanneauDev(){
  const d = $("#panneauDev");
  d.innerHTML = '<div class="devEntete"><b>Outils de développement</b>' +
                '<button class="devFermer" title="Fermer (F2)">✕</button></div>' +
                '<div class="devCorps"></div>';
  d.querySelector(".devFermer").onclick = basculerDev;
  const z = d.querySelector(".devCorps");

  const groupe = (titre) => {
    const g = document.createElement("div");
    g.className = "devGroupe";
    g.innerHTML = '<div class="devTitre">'+titre+'</div><div class="devBoutons"></div>';
    z.appendChild(g);
    return g.querySelector(".devBoutons");
  };
  const bt = (parent, texte, fn) => {
    const b = document.createElement("button");
    b.className = "devBt"; b.textContent = texte;
    b.onclick = () => { fn(); majPanneauDev(); };
    parent.appendChild(b);
  };

  const gAge = groupe("Aller à un âge — l'atelier s'agrandit, tout se débloque");
  for (const a of AGES)
    bt(gAge, a.n + ". " + a.nom + (etat.meta.age === a.n ? " ✓" : ""), () => sauterAge(a.n));

  const gMode = groupe("Mode de partie — actuellement : " + mode().nom);
  for (const k in MODES)
    bt(gMode, MODES[k].nom + (etat.meta.mode === k ? " ✓" : ""), () => {
      etat.meta.mode = k; majBarreConstruction(); majBandeau(); majPanneau();
      notif("Mode", MODES[k].nom + " — " + MODES[k].resume, "");
    });

  const gArgent = groupe("Argent et matière");
  bt(gArgent, "+10 000 €", () => { encaisser(10000, "dev"); });
  bt(gArgent, "+100 000 €", () => { encaisser(100000, "dev"); });
  bt(gArgent, "Caisse à zéro", () => { etat.finances.solde = 0; });
  bt(gArgent, "Remplir le quai", remplirStocks);
  bt(gArgent, "Vider le quai", () => { U().stocks = {}; });
  bt(gArgent, "Ouvrir le garde-manger", () => {
    etat.recherche.tout = true; verifierDeblocages(false);
    notif("Labo ouvert", "Tous les ingrédients sont accessibles.", "ok"); majPanneau();
  });

  const gEquipe = groupe("Équipe");
  bt(gEquipe, "Embaucher 3 personnes", () => { for (let i=0;i<3;i++) embaucher(creerCandidat()); });
  bt(gEquipe, "Tout le monde au top", () => {
    for (const o of U().ouvriers){
      o.moral = 1; o.fatigue = 0;
      for (const c in o.competences) o.competences[c] = 0.95;
    }
  });

  const gMachines = groupe("Machines");
  bt(gMachines, "Tout réviser", () => { for (const m of U().machines){ m.usure = 0.05; m.enPanne = false; m.fraicheurHuile = m.fraicheurHuile !== undefined ? 1 : undefined; } });
  bt(gMachines, "Tout user (0,8)", () => { for (const m of U().machines) m.usure = 0.8; });
  bt(gMachines, "Huile morte", () => { for (const m of U().machines) if (m.fraicheurHuile !== undefined) m.fraicheurHuile = 0; });
  bt(gMachines, "Casser une machine", () => {
    const m = U().machines.find(x => !x.enPanne && MACHINES[x.type].usureParJour > 0);
    if (m) declencherPanne(m);
  });

  const gTemps = groupe("Temps");
  bt(gTemps, "Avancer d'un jour", () => avancerTemps(1));
  bt(gTemps, "Avancer d'une semaine", () => avancerTemps(5));
  bt(gTemps, "Forcer le vendredi soir", () => finSemaine());
  bt(gTemps, "Atteindre l'objectif", () => {
    const o = AGES[etat.meta.age-1].objectif;
    if (o.type === "vendus") etat.progression.vendus[o.produit] = o.cible;
    else if (o.type === "produitsSemaine") etat.progression.produitsSemaine[o.produit] = o.cible;
    else if (o.type === "compteur") etat.progression.compteurs[o.cle] = o.cible;
    else etat.finances.solde = o.cible;
    verifierObjectif();
  });

  const gRech = groupe("Recherche");
  bt(gRech, "Sortir une recette au hasard", () => {
    const t = {};
    for (const a of AXES_RECETTE) t[a.cle] = choix(a.options).id;
    etat.recherche.enCours = { nom: nomParDefaut(t), traits:t, cout:0, jours:1, restant:1 };
    finaliserRecette();
  });
  bt(gRech, "Terminer l'étude en cours", () => { if (etat.recherche.enCours) finaliserRecette(); });
  bt(gRech, "Changer la mode du marché", () => {
    etat.recherche.tendanceSemaine = -99; majTendance();
  });

  const gTests = groupe("Vérifications");
  const bTest = document.createElement("button");
  bTest.className = "devBt devBtLarge";
  bTest.textContent = "Vérifier la partie";
  bTest.onclick = () => {
    const res = verifierPartie();
    const rap = d.querySelector(".devRapport");
    rap.innerHTML = "";
    for (const t of res){
      const l = document.createElement("div");
      l.className = "devTest " + (t.ok ? "ok" : "ko");
      l.innerHTML = '<span class="devPuce">' + (t.ok ? "✓" : "✕") + '</span><span></span>';
      l.querySelector("span:last-child").textContent = t.nom + (t.detail && !t.ok ? " — " + t.detail : "");
      rap.appendChild(l);
    }
    const rates = res.filter(t => !t.ok).length;
    const bilan = document.createElement("div");
    bilan.className = "devBilan " + (rates ? "ko" : "ok");
    bilan.textContent = rates ? (rates + " vérification" + (rates>1?"s":"") + " en échec")
                              : (res.length + " vérifications, tout est bon");
    rap.appendChild(bilan);
  };
  gTests.appendChild(bTest);
  const rap = document.createElement("div");
  rap.className = "devRapport";
  z.appendChild(rap);
}

/* ============================================================================
   UI — écran des statistiques
   ----------------------------------------------------------------------------
   Écart assumé au §3.4 (« le seul écran plein est le vendredi soir ») : des
   courbes sur douze semaines ne se lisent pas dans une colonne de 300 px. Cet
   écran ne sert jamais à piloter l'usine — c'est de la lecture, comme le menu.

   Palette des séries : six teintes validées (bande de clarté, plancher de
   chroma, séparation daltonienne et contraste sur le fond #14171b). La
   polarité du résultat n'est pas portée par la couleur seule : le sens par
   rapport à la ligne du zéro la donne déjà.
   ========================================================================== */

const COUL_VIZ = {
  bon:"#5cba6b", mauvais:"#e0574a",
  serie:["#3987e5","#d95926","#199e70","#c98500","#d55181","#008300"],
  grille:"rgba(255,255,255,.09)",
  zero:"rgba(255,255,255,.28)",
  encre:"#e6e8ea", doux:"#9aa2ac", faible:"#6b737d",
  fond:"#14171b"
};

const POSTES_DEPENSE = [
  { cle:"salaires", nom:"Salaires" },
  { cle:"matiere",  nom:"Matière" },
  { cle:"loyer",    nom:"Loyer et électricité" },
  { cle:"machines", nom:"Machines et entretien" },
  { cle:"emprunts", nom:"Emprunts" },
  { cle:"ennuis",   nom:"Pénalités et réclamations" }
];

/** Le rebut est gris foncé dans l'usine : illisible sur un fond sombre. */
function couleurSerie(itemId){
  return itemId === "rebut" ? COUL_VIZ.doux : (ITEMS[itemId] ? ITEMS[itemId].couleur : COUL_VIZ.serie[0]);
}

function prepCanvas(cv, w, h){
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w*d); cv.height = Math.round(h*d);
  cv.style.width = w+"px"; cv.style.height = h+"px";
  const g = cv.getContext("2d");
  g.setTransform(d,0,0,d,0,0);
  g.clearRect(0,0,w,h);
  return g;
}

/** Survol : on met en avant une semaine et on écrit sa valeur en clair.
 *  La couleur ne porte jamais l'information toute seule. */
function attacherSurvol(cv, n, lire, redessiner){
  const sortie = cv.nextElementSibling;
  cv.onmousemove = ev => {
    const r = cv.getBoundingClientRect();
    const i = clamp(Math.floor((ev.clientX - r.left) / r.width * n), 0, n-1);
    if (cv._survol === i) return;
    cv._survol = i; redessiner();
    if (sortie) sortie.textContent = lire(i);
  };
  cv.onmouseleave = () => {
    cv._survol = -1; redessiner();
    if (sortie) sortie.textContent = lire(-1);
  };
}

/* ------------------------------------------- Barres divergentes (résultat) */
function largeurUtile(parent, defaut){
  const w = parent ? parent.clientWidth : 0;
  return w > 80 ? w : (defaut || 640);
}

function vizResultat(cv, semaines){
  const w = largeurUtile(cv.parentElement, 640), h = 150, bas = 20, hautMarge = 12;
  const vals = semaines.map(s => s.ca - s.depenses);
  const maxi = Math.max(1, ...vals.map(Math.abs));
  const n = vals.length;

  const dessine = () => {
    const g = prepCanvas(cv, w, h);
    const zero = hautMarge + (h - bas - hautMarge)/2;
    const demi = (h - bas - hautMarge)/2 - 4;
    const lb = w/n;

    g.strokeStyle = COUL_VIZ.zero; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, zero+0.5); g.lineTo(w, zero+0.5); g.stroke();

    for (let i=0;i<n;i++){
      const v = vals[i];
      const hh = Math.max(2, Math.abs(v)/maxi * demi);
      const x = i*lb + 2, lg = Math.max(3, lb - 4);       // 2 px de fond entre deux barres
      const y = v >= 0 ? zero - hh : zero;
      g.fillStyle = v >= 0 ? COUL_VIZ.bon : COUL_VIZ.mauvais;
      g.globalAlpha = (cv._survol >= 0 && cv._survol !== i) ? 0.35 : 1;
      coinsArrondisG(g, x, y, lg, hh, Math.min(4, lg/2), v >= 0 ? "haut" : "bas");
      g.fill();
      g.globalAlpha = 1;
    }
    g.fillStyle = COUL_VIZ.faible;
    g.font = "10px Segoe UI, sans-serif";
    g.fillText("S"+(semaines[0].semaine+1), 2, h-6);
    g.textAlign = "right";
    g.fillText("S"+(semaines[n-1].semaine+1), w-2, h-6);
    g.textAlign = "left";
  };
  dessine();
  attacherSurvol(cv, n, i => i < 0
    ? "Résultat hebdomadaire — survolez une barre"
    : "Semaine " + (semaines[i].semaine+1) + " · " + eurosSigne(vals[i]) +
      " (" + euros(semaines[i].ca) + " rentrés, " + euros(semaines[i].depenses) + " sortis)", dessine);
}

/** Coins arrondis d'un seul côté : l'extrémité de la donnée, jamais la base. */
function coinsArrondisG(g, x, y, w, h, r, cote){
  r = Math.max(0, Math.min(r, h));
  g.beginPath();
  if (cote === "haut"){
    g.moveTo(x, y+h); g.lineTo(x, y+r); g.quadraticCurveTo(x, y, x+r, y);
    g.lineTo(x+w-r, y); g.quadraticCurveTo(x+w, y, x+w, y+r); g.lineTo(x+w, y+h);
  } else {
    g.moveTo(x, y); g.lineTo(x, y+h-r); g.quadraticCurveTo(x, y+h, x+r, y+h);
    g.lineTo(x+w-r, y+h); g.quadraticCurveTo(x+w, y+h, x+w, y+h-r); g.lineTo(x+w, y);
  }
  g.closePath();
}

/* ------------------------------------------------- Courbe simple (une série) */
function vizCourbe(cv, semaines, valeurDe, couleur, formate, largeur){
  const w = largeur || largeurUtile(cv.parentElement, 300), h = 92, bas = 16, marge = 8;
  const vals = semaines.map(valeurDe);
  const maxi = Math.max(1, ...vals);
  const n = vals.length;
  const px = i => n === 1 ? w/2 : marge + i/(n-1)*(w-2*marge);
  const py = v => (h - bas) - (v/maxi)*(h - bas - marge);

  const dessine = () => {
    const g = prepCanvas(cv, w, h);
    // grille discrète : trois repères, rien de plus
    g.strokeStyle = COUL_VIZ.grille; g.lineWidth = 1;
    for (let k=0;k<=2;k++){
      const y = Math.round(py(maxi*k/2)) + 0.5;
      g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
    }
    // aire très légère sous la courbe, pour la lisibilité du volume
    g.beginPath();
    g.moveTo(px(0), h-bas);
    for (let i=0;i<n;i++) g.lineTo(px(i), py(vals[i]));
    g.lineTo(px(n-1), h-bas); g.closePath();
    g.fillStyle = couleur + "22"; g.fill();

    g.beginPath();
    for (let i=0;i<n;i++){ const x=px(i), y=py(vals[i]); i ? g.lineTo(x,y) : g.moveTo(x,y); }
    g.strokeStyle = couleur; g.lineWidth = 2; g.lineJoin = "round"; g.lineCap = "round";
    g.stroke();

    if (cv._survol >= 0 && cv._survol < n){
      const x = px(cv._survol), y = py(vals[cv._survol]);
      g.strokeStyle = COUL_VIZ.zero; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x+0.5, marge); g.lineTo(x+0.5, h-bas); g.stroke();
      g.fillStyle = COUL_VIZ.fond; g.beginPath(); g.arc(x,y,5,0,7); g.fill();
      g.fillStyle = couleur; g.beginPath(); g.arc(x,y,3.5,0,7); g.fill();
    }
    g.fillStyle = COUL_VIZ.faible; g.font = "10px Segoe UI, sans-serif";
    g.fillText(formate(maxi), 2, marge+2);
  };
  dessine();
  attacherSurvol(cv, n, i => i < 0 ? "" :
    "Semaine " + (semaines[i].semaine+1) + " · " + formate(vals[i]), dessine);
}

/* ------------------------------------- Barre empilée horizontale (dépenses) */
function vizDepenses(z, semaines){
  const total = {};
  let somme = 0;
  for (const s of semaines)
    for (const p of POSTES_DEPENSE){
      const v = (s.depensesParMotif||{})[p.cle] || 0;
      total[p.cle] = (total[p.cle]||0) + v; somme += v;
    }
  if (somme <= 0){ z.appendChild(elem('<div class="vide">Rien de dépensé pour le moment.</div>')); return; }

  const cv = document.createElement("canvas");
  z.appendChild(cv);
  const w = largeurUtile(z, 640), h = 30;
  const g = prepCanvas(cv, w, h);
  let x = 0;
  POSTES_DEPENSE.forEach((p, i) => {
    const part = (total[p.cle]||0)/somme;
    const lg = part * w;
    if (lg <= 0) return;
    g.fillStyle = COUL_VIZ.serie[i];
    g.fillRect(x, 0, Math.max(0, lg-2), h);          // 2 px de fond entre deux segments
    x += lg;
  });

  // Légende : identité par la pastille, valeur écrite — jamais la couleur seule.
  const lg = document.createElement("div");
  lg.className = "vizLegende";
  POSTES_DEPENSE.forEach((p, i) => {
    const v = total[p.cle]||0;
    if (v <= 0) return;
    const e = document.createElement("div");
    e.className = "vizLegItem";
    e.innerHTML = '<span class="vizPuce"></span><span class="vizNom"></span><span class="vizVal"></span>';
    e.querySelector(".vizPuce").style.background = COUL_VIZ.serie[i];
    e.querySelector(".vizNom").textContent = p.nom;
    e.querySelector(".vizVal").textContent = euros(v) + " · " + Math.round(v/somme*100) + " %";
    lg.appendChild(e);
  });
  z.appendChild(lg);
}

/* ============================================================ L'écran entier */
function ouvrirStats(){
  const h = etat.stats.historiqueSemaines;
  const z = $("#ecranStats");
  z.innerHTML = `
    <div class="feuille">
      <div class="enteteFeuille">
        <h1>Statistiques</h1>
        <div class="sous">${etat.meta.nomEntreprise} · ${mode().nom}</div>
        <div style="flex:1"></div>
        <button class="bt" id="btFermerStats">Retour à l'usine</button>
      </div>
      <div id="statsCorps"></div>
    </div>`;
  $("#btFermerStats").onclick = () => fermer("#ecranStats");
  ouvrir("#ecranStats");
  const c = $("#statsCorps");

  if (!h.length){
    c.appendChild(elem('<div class="volet"><div class="vide">Aucune semaine terminée. Revenez vendredi soir.</div></div>'));
    return;
  }
  const douze = h.slice(-12);
  const derniere = h[h.length-1];
  const avant = h.length > 1 ? h[h.length-2] : null;
  const res = s => s.ca - s.depenses;

  /* --- Les quatre chiffres qu'on lit en premier --- */
  const kpi = document.createElement("div");
  kpi.className = "kpiRang";
  const tuile = (lab, val, sous, classe) => {
    const d = document.createElement("div");
    d.className = "kpi";
    d.innerHTML = '<div class="kLab"></div><div class="kVal '+(classe||"")+'"></div><div class="kSous"></div>';
    d.querySelector(".kLab").textContent = lab;
    d.querySelector(".kVal").textContent = val;
    d.querySelector(".kSous").textContent = sous || "";
    kpi.appendChild(d);
  };
  const delta = avant ? res(derniere) - res(avant) : 0;
  tuile("Résultat de la semaine " + (derniere.semaine+1), eurosSigne(res(derniere)),
        avant ? (delta >= 0 ? "en hausse de " : "en baisse de ") + euros(Math.abs(delta)) : "première semaine",
        res(derniere) >= 0 ? "pos" : "neg");
  const meilleure = h.reduce((a,b) => res(b) > res(a) ? b : a);
  tuile("Meilleure semaine", eurosSigne(res(meilleure)), "semaine " + (meilleure.semaine+1));
  tuile("Chiffre d'affaires total", euros(etat.finances.totalVentes),
        h.length + " " + pluriel(h.length,"semaine") + " de production");
  tuile("Réputation", Math.round(etat.reputation) + " / 100", motReputation(etat.reputation));
  c.appendChild(kpi);

  /* --- Résultat semaine par semaine --- */
  const v1 = volet("Résultat, semaine par semaine");
  const cv1 = document.createElement("canvas");
  v1.appendChild(cv1);
  v1.appendChild(elem('<div class="vizLecture">Résultat hebdomadaire — survolez une barre</div>'));
  c.appendChild(v1);            // dans la page d'abord : on mesure ensuite
  vizResultat(cv1, douze);

  /* --- Production : un petit graphique par produit, chacun son échelle --- */
  const produits = Object.keys(ITEMS).filter(k =>
    ITEMS[k].vente && douze.some(s => (s.produits[k]||0) > 0));
  if (produits.length){
    const v2 = volet("Ce qui est sorti de l'atelier");
    c.appendChild(v2);
    const gr = document.createElement("div");
    gr.className = "petitsMultiples";
    v2.appendChild(gr);
    for (const p of produits){
      const bloc = document.createElement("div");
      bloc.className = "pm";
      bloc.innerHTML = '<div class="pmTitre"></div>';
      bloc.querySelector(".pmTitre").textContent = ITEMS[p].nom;
      const cv = document.createElement("canvas");
      bloc.appendChild(cv);
      bloc.appendChild(elem('<div class="vizLecture"></div>'));
      gr.appendChild(bloc);
      vizCourbe(cv, douze, s => s.produits[p]||0, couleurSerie(p), v => mesure(p, v), 300);
    }
    v2.appendChild(gr);
  }

  /* --- Rebut : seulement quand ça existe --- */
  if (etat.meta.age >= 3 && douze.some(s => (s.rebuts||0) > 0)){
    const v3 = volet("Part partie au rebut");
    const cv3 = document.createElement("canvas");
    v3.appendChild(cv3);
    v3.appendChild(elem('<div class="vizLecture"></div>'));
    c.appendChild(v3);
    vizCourbe(cv3, douze, s => {
      const bon = Object.keys(s.produits).filter(k=>ITEMS[k]&&ITEMS[k].cat==="produit")
                        .reduce((t,k)=>t+s.produits[k],0);
      const tot = bon + (s.rebuts||0);
      return tot > 0 ? (s.rebuts||0)/tot*100 : 0;
    }, COUL_VIZ.mauvais, v => v.toFixed(1) + " %");
  }

  /* --- Où part l'argent --- */
  const v4 = volet("Où part l'argent, sur ces " + douze.length + " " + pluriel(douze.length,"semaine"));
  c.appendChild(v4);
  vizDepenses(v4, douze);

  /* --- Les clients : au-delà de quelques lignes, un tableau vaut mieux --- */
  const cls = Object.keys(etat.stats.clients||{});
  if (cls.length){
    const v5 = volet("Les clients");
    const t = document.createElement("table");
    t.className = "tab";
    t.innerHTML = "<tr><th>Client</th><th style='text-align:right'>Chiffre d'affaires</th>"+
                  "<th style='text-align:right'>Commandes</th><th style='text-align:right'>Réclamations</th></tr>";
    cls.sort((a,b) => etat.stats.clients[b].ca - etat.stats.clients[a].ca);
    for (const nom of cls){
      const f = etat.stats.clients[nom];
      const tr = document.createElement("tr");
      tr.innerHTML = "<td></td><td style='text-align:right'></td><td style='text-align:right'></td><td style='text-align:right'></td>";
      const td = tr.querySelectorAll("td");
      td[0].textContent = nom;
      td[1].textContent = euros(f.ca);
      td[2].textContent = f.commandes;
      td[3].textContent = f.reclamations || "—";
      if (f.reclamations) td[3].style.color = "var(--rouge)";
      t.appendChild(tr);
    }
    v5.appendChild(t);
    c.appendChild(v5);
  }

}

function volet(titre){
  const d = document.createElement("div");
  d.className = "volet";
  d.style.marginBottom = "16px";
  const h = document.createElement("h2");
  h.textContent = titre;
  d.appendChild(h);
  return d;
}

function motReputation(r){
  if (r >= 85) return "on nous connaît";
  if (r >= 65) return "bonne réputation";
  if (r >= 45) return "correcte";
  if (r >= 25) return "ça s'abîme";
  return "on part de loin";
}

/* ============================================================================
   UI — l'écran de recherche (âge 4)
   À gauche on compose, à droite on lit ce que le public a dit des recettes
   déjà sorties. Aucun chiffre de coefficient : des mots, des avis, des pistes.
   ========================================================================== */

let brouillon = null;   // la recette en cours de composition, jamais sauvegardée

function brouillonParDefaut(){
  const t = {};
  for (const a of AXES_RECETTE) t[a.cle] = (optionsOuvertes(a)[0] || a.options[0]).id;
  return { nom:"", traits:t };
}

/** Une composition ne doit jamais garder un ingrédient qui s'est refermé
 *  (chargement d'une vieille partie, changement de mode). */
function assainirBrouillon(){
  for (const a of AXES_RECETTE){
    const o = optionRecette(a.cle, brouillon.traits[a.cle]);
    if (!o || !optionDisponible(o))
      brouillon.traits[a.cle] = (optionsOuvertes(a)[0] || a.options[0]).id;
  }
}

/** L'onglet Labo : on compose en haut, on lit les retours en dessous. */
function panneauRecherche(z){
  if (!brouillon) brouillon = brouillonParDefaut();
  z.appendChild(elem('<h2 class="titrePan">Le laboratoire</h2>'));
  z.appendChild(elem('<p class="sousTitre"></p>')).textContent =
    "On connaît la maison à " + Math.round(etat.recherche.notoriete) + " sur 100.";

  const nb = bureauxDisponibles();
  if (!nb){
    const b = blocTitre("Il manque un bureau");
    b.appendChild(elem('<div style="font-size:12.5px;color:var(--texte-doux);line-height:1.5">'+
      "Une recette ne se met pas au point au milieu des friteuses. Bâtissez un "+
      "<b>bureau d'études</b> — onglet Bâtiments, en bas — et l'équipe pourra s'y mettre. "+
      "Chaque bureau supplémentaire fait avancer les études d'autant plus vite.</div>"));
    z.appendChild(b);
  } else {
    z.appendChild(elem('<div class="rechBureaux"></div>')).textContent =
      nb + " " + pluriel(nb,"bureau","bureaux") + " — une étude avance de " + nb +
      " " + pluriel(nb,"jour") + " par jour.";
  }

  const composer = document.createElement("div");
  composer.id = "rechComposer";
  z.appendChild(composer);
  const suivi = document.createElement("div");
  suivi.id = "rechSuivi";
  z.appendChild(suivi);
  majComposer();
  majSuivi();
}

/** Le bouton et la touche mènent à l'onglet. */
function ouvrirRecherche(){
  if (etat.meta.age < 4 && !mode().toutDebloque){
    notif("Pas encore", "Le laboratoire ouvre à l'âge de l'industrie.", ""); return;
  }
  vue.ongletActif = "labo";
  majOnglets(); majPanneau();
}

/* ------------------------------------------------------------ Composer */
function majComposer(){
  const z = $("#rechComposer");
  z.innerHTML = "";

  // Ce que cherche le public : la seule information donnée d'avance.
  const t = blocTitre("Ce que cherche le public");
  t.appendChild(elem('<div class="rechTendance"></div>')).textContent = tendanceCourante().texte;
  z.appendChild(t);

  const e = etat.recherche.enCours;
  if (e){
    const v = blocTitre("Étude en cours");
    v.appendChild(elem('<div style="font-size:16px;font-weight:600;margin-bottom:6px"></div>')).textContent = "« " + e.nom + " »";
    v.appendChild(elem('<div style="font-size:12.5px;color:var(--texte-doux);margin-bottom:8px"></div>'))
     .textContent = resumeTraits(e.traits);
    const j = elem('<div class="jauge vert" style="height:10px"><i></i></div>');
    j.querySelector("i").style.width = Math.round((1 - e.restant/e.jours)*100) + "%";
    v.appendChild(j);
    v.appendChild(elem('<div style="font-size:12px;color:var(--texte-faible);margin-top:5px"></div>'))
     .textContent = e.restant + " " + pluriel(e.restant,"jour") + " avant la sortie.";
    z.appendChild(v);
    return;
  }

  const v = blocTitre("Composer une recette");
  const champ = document.createElement("input");
  champ.className = "champTexte";
  champ.style.cssText = "text-align:left;margin-bottom:14px";
  champ.maxLength = 28;
  champ.placeholder = "Nom de la recette";
  champ.value = brouillon.nom;
  champ.oninput = () => { brouillon.nom = champ.value; };
  v.appendChild(champ);

  assainirBrouillon();
  const fermes = [];
  for (const axe of AXES_RECETTE){
    const bloc = document.createElement("div");
    bloc.className = "rechAxe";
    bloc.innerHTML = '<div class="rechAxeNom"></div><div class="rechOpts"></div>';
    const ouvertes = optionsOuvertes(axe);
    const nFermes = axe.options.length - ouvertes.length;
    bloc.querySelector(".rechAxeNom").textContent =
      axe.nom + (nFermes ? "   ·   " + nFermes + " à découvrir" : "");
    const zo = bloc.querySelector(".rechOpts");
    for (const o of ouvertes){
      const b = document.createElement("button");
      b.className = "rechOpt" + (brouillon.traits[axe.cle] === o.id ? " actif" : "");
      b.innerHTML = '<span class="roNom"></span>';
      b.querySelector(".roNom").textContent = o.nom;
      // Ce que la maison a appris : un accord déjà rencontré est rappelé.
      if (accordConnu(o.id, brouillon.traits)) b.classList.add("connu");
      b.onclick = () => { brouillon.traits[axe.cle] = o.id; majComposer(); };
      zo.appendChild(b);
    }
    for (const o of axe.options) if (!optionDisponible(o)) fermes.push({ axe, o });
    v.appendChild(bloc);
  }

  const nbB = Math.max(1, bureauxDisponibles());
  const cout = coutEtude(brouillon.traits), jours = Math.ceil(joursEtude(brouillon.traits)/nbB);
  const g = grammageDe(brouillon.traits);
  const info = document.createElement("div");
  info.className = "rechInfo";
  info.appendChild(ligne("Ce que l'étude coûte", euros(cout)));
  info.appendChild(ligne("Temps de mise au point", jours + " " + pluriel(jours,"jour")));
  info.appendChild(ligne("Sachet", g + " g · " + Math.round(10000/g) + " sachets pour 10 kg de chips"));
  v.appendChild(info);

  // L'avis du contremaître : ce qu'il sait, pas la note.
  const flair = avisContremaitreRecette(brouillon.traits);
  if (flair) v.appendChild(elem('<div class="cAvis" style="margin-top:10px"></div>')).textContent = "« " + flair + " »";

  // Le garde-manger fermé : ce qui existe, et ce qu'il faut faire pour l'avoir.
  if (fermes.length){
    const det = document.createElement("details");
    det.className = "rechFermes";
    det.open = !!vue.labFermesOuvert;
    det.ontoggle = () => { vue.labFermesOuvert = det.open; };
    const som = document.createElement("summary");
    const c2 = compteDebloque();
    som.textContent = "Le garde-manger — " + c2.ouverts + " ingrédients sur " + c2.total +
                      ", " + fermes.length + " à débloquer";
    det.appendChild(som);
    for (const f of fermes){
      const li = document.createElement("div");
      li.className = "rechFerme";
      li.innerHTML = '<span class="rfNom"></span><span class="rfCond"></span>';
      li.querySelector(".rfNom").textContent = f.o.nom;
      li.querySelector(".rfCond").textContent = motDeblocage(f.o);
      det.appendChild(li);
    }
    v.appendChild(det);
  }

  const b = bouton("Lancer l'étude — " + euros(cout), () => {
    if (lancerEtude(brouillon.nom.trim() || nomParDefaut(brouillon.traits), brouillon.traits)){
      brouillon = brouillonParDefaut();
      majComposer(); majSuivi();
    }
  }, "large plein");
  b.style.marginTop = "12px";
  v.appendChild(b);
  z.appendChild(v);
}

/** Un accord déjà vécu sur une recette sortie : la maison s'en souvient. */
function accordConnu(optionId, traits){
  const v = Object.values(traits);
  return ACCORDS.some(a =>
    ((a.a === optionId && v.includes(a.b)) || (a.b === optionId && v.includes(a.a))) &&
    etat.recherche.recettes.some(r => {
      const rv = Object.values(r.traits);
      return rv.includes(a.a) && rv.includes(a.b);
    }));
}

/** Il ne connaît que ce que la maison a déjà essayé. */
function avisContremaitreRecette(traits){
  const vus = accordsDe(traits).filter(a =>
    etat.recherche.recettes.some(r => {
      const rv = Object.values(r.traits);
      return rv.includes(a.a) && rv.includes(a.b);
    }));
  if (vus.length){
    const pire = vus.slice().sort((a,b) => a.delta - b.delta)[0];
    const best = vus.slice().sort((a,b) => b.delta - a.delta)[0];
    if (pire.delta < 0) return "On a déjà vu ça : " + pire.dit.charAt(0).toLowerCase() + pire.dit.slice(1);
    return "On l'a déjà constaté : " + best.dit.charAt(0).toLowerCase() + best.dit.slice(1);
  }
  if (tagsDe(traits).has(tendanceCourante().tag))
    return "Ça colle à ce que les gens cherchent en ce moment. Bon point.";
  if (!etat.recherche.recettes.length)
    return "On n'a jamais rien inventé ici. Essayez, on verra bien ce que les gens en disent.";
  return "Celle-là, je ne sais pas ce que ça va donner. Il faut essayer.";
}

function resumeTraits(traits){
  return AXES_RECETTE.map(a => {
    const o = optionRecette(a.cle, traits[a.cle]);
    return o ? o.nom.toLowerCase() : "?";
  }).join(" · ");
}
function nomParDefaut(traits){
  const g = optionRecette("gout", traits.gout).nom;
  const c = optionRecette("coupe", traits.coupe).nom.toLowerCase();
  return g + " " + c;
}

/* ------------------------------------------------------------- Le suivi */
function majSuivi(){
  const z = $("#rechSuivi");
  z.innerHTML = "";

    const v = blocTitre("Nos recettes");

    return;
  }
  for (const r of rs){

    ent.innerHTML = '<span class="rechPuce"></span><div style="flex:1">' +
      '<div class="rechNom"></div><div class="rechTraits"></div></div>' +
      '<div class="rechNote"><div class="rnVal"></div><div class="rnMot"></div></div>';

    ent.querySelector(".rechNom").textContent = r.nom;

    ent.querySelector(".rnVal").textContent = r.note;
    ent.querySelector(".rnVal").className = "rnVal " + (r.note >= 65 ? "bon" : r.note >= 48 ? "moyen" : "mauvais");

    const total = vendus.reduce((s,x)=>s+x,0);
    v.appendChild(ligne("Vendus depuis la sortie", nb(Math.round(total)) + " " + pluriel(total,"sachet")));

    if (vendus.length > 1){
      const cv = document.createElement("canvas");
      v.appendChild(elem('<div class="rechSousTitre">Ventes, semaine par semaine</div>'));
      v.appendChild(cv);
      v.appendChild(elem('<div class="vizLecture"></div>'));
      const semaines = etat.stats.historiqueSemaines.slice(-12);
      vizCourbe(cv, semaines, s => (s.livres && s.livres[r.id]) || 0,
                (ITEMS[r.id] && ITEMS[r.id].couleur) || "#c9502e",
                x => nb(Math.round(x)) + " sachets");
    }

    if (r.avis && r.avis.length){
      v.appendChild(elem('<div class="rechSousTitre">Ce qu\'en disent les gens</div>'));
      for (const a of r.avis){
        const d = document.createElement("div");
        d.className = "rechAvis";
        d.innerHTML = '<span class="raQui"></span><span class="raDit"></span>';
        d.querySelector(".raQui").textContent = a.qui;
        d.querySelector(".raDit").textContent = "« " + a.dit + " »";
        v.appendChild(d);
      }
    }
    if (r.pistes && r.pistes.length){
      v.appendChild(elem('<div class="rechSousTitre">Ce qu\'on pourrait changer</div>'));
      for (const p of r.pistes){
        const d = document.createElement("div");
        d.className = "rechPiste";
        d.textContent = p;
        v.appendChild(d);
      }
      const b = bouton("Repartir de cette recette", () => {

/* ============================================================ La sortie
   Une étude qui aboutit mérite mieux qu'une notification qui passe : c'est le
   moment où l'on découvre ce que le public en pense. On arrête tout, on montre
   la note, les avis et les pistes, et on propose de la mettre en production
   dans la foulée. */
function ouvrirSortieRecette(r){
  const z = $("#ecranSortieRecette");
  const coul = couleurGout(r.traits.gout);
  const teinte = r.note >= 82 ? "var(--vert)" : r.note >= 65 ? "#8fd39b"
               : r.note >= 48 ? "var(--or)" : "var(--rouge)";
  z.innerHTML = `
    <div class="feuille" style="max-width:620px;margin-top:6vh;text-align:center">
      <div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--texte-faible)">
        L'étude est terminée</div>
      <div class="sachetApercu" id="sachetSortie"></div>
      <h1 style="font-size:30px;font-weight:400;margin:2px 0 2px">« <span id="nomSortie"></span> »</h1>
      <p style="color:var(--texte-faible);font-size:12.5px;margin-bottom:16px" id="compoSortie"></p>

      <div class="volet" style="margin-bottom:16px">
        <div class="noteGeante" id="noteSortie" style="color:${teinte}"></div>
        <div class="jaugeNote"><i id="jaugeSortie" style="background:${teinte};width:0%"></i></div>
        <div style="font-size:14px;color:var(--texte-doux);margin-top:8px" id="motSortie"></div>
        <div style="font-size:12.5px;color:var(--texte-faible);margin-top:6px" id="prixSortie"></div>
      </div>

      <div class="volet" style="text-align:left;margin-bottom:14px">
        <h2>Ce qu'en disent les gens</h2>
        <div id="avisSortie"></div>
      </div>

      <div class="volet" style="text-align:left;margin-bottom:18px" id="voletPistes">
        <h2>Pour la prochaine fois</h2>
        <div id="pistesSortie"></div>
      </div>

      <div id="prodSortie"></div>
      <button class="bt large" id="btPlusTard" style="margin-top:9px">Plus tard</button>
    </div>`;

  $("#sachetSortie").style.background = "linear-gradient(160deg," + coul + ",rgba(0,0,0,.55))";
  $("#nomSortie").textContent = r.nom;
  $("#compoSortie").textContent = resumeTraits(r.traits);
  $("#noteSortie").innerHTML = r.note + '<small> sur 100</small>';
  $("#motSortie").textContent = motNote(r.note) + ".";
  $("#prixSortie").textContent =
    "Le sachet de " + grammageDe(r.traits) + " g se vendra " + euros(r.prixUnite) + ".";
  requestAnimationFrame(() => { $("#jaugeSortie").style.width = r.note + "%"; });

  const za = $("#avisSortie");
  for (const a of (r.avis || [])){
    const l = document.createElement("div");
    l.className = "avisClient";
    const c = document.createElement("canvas");
    c.width = c.height = 68;
    dessinerTete(c.getContext("2d"), (a.qui || "").length * 137 + r.note);
    l.appendChild(c);
    const t = document.createElement("div");
    t.innerHTML = '<div class="qui"></div><div class="dit"></div>';
    t.querySelector(".qui").textContent = a.qui;
    t.querySelector(".dit").textContent = "« " + a.dit + " »";
    l.appendChild(t);
    za.appendChild(l);
  }
  if (!za.children.length) za.textContent = "Personne n'a encore réagi.";

  const zp = $("#pistesSortie");
  for (const p of (r.pistes || [])){
    const l = document.createElement("div");
    l.className = "pisteAmelio";
    l.appendChild(document.createTextNode(p));
    zp.appendChild(l);
  }
  if (!zp.children.length) $("#voletPistes").remove();

  // Mettre en production tout de suite : c'est la suite naturelle du geste.
  const zprod = $("#prodSortie");
  const rid = "ensacher_" + r.id;
  const ens = U().machines.filter(m => m.type === "ensacheuse");
  if (!ens.length){
    zprod.appendChild(elem('<div style="font-size:12.5px;color:var(--texte-faible);margin-bottom:8px"></div>'))
      .textContent = "Il faudra une ensacheuse pour la produire.";
  } else {
    const bt = document.createElement("button");
    bt.className = "bt plein large";
    bt.textContent = ens.length > 1
      ? "Lancer la production sur " + ens.length + " ensacheuses"
      : "Lancer la production sur l'ensacheuse";
    bt.onclick = () => {
      let n = 0;
      for (const m of ens){
        if (!MACHINES.ensacheuse.recettes.includes(rid)) continue;
        m.recetteId = rid; m.enCycle = false; m.progression = 0; n++;
      }
      notif("En production", "« " + r.nom + " » sort maintenant de " + n + " " +
            pluriel(n,"ensacheuse") + ". Les ventes se suivent dans l'onglet Labo.", "ok");
      son("valide");
      fermerSortieRecette();
      vue.ongletActif = "labo"; majOnglets(); majPanneau();
    };
    zprod.appendChild(bt);
  }
  $("#btPlusTard").onclick = fermerSortieRecette;

  etat.meta.vitesse = 0;
  ouvrir("#ecranSortieRecette");
  son(r.note >= 65 ? "age" : "refus");
}

function fermerSortieRecette(){
  fermer("#ecranSortieRecette");
  etat.meta.vitesse = 1;
  majBandeau(); majPanneau();
}

/* ============================================================================
   UI — LA MARQUE
   Trois jauges, un logo, un sachet. Tout est dessiné au code : le jeu reste un
   fichier autonome, sans une seule image à charger.
   ========================================================================== */

/* --------------------------------------------------------------- Le logo
   Un dessin par forme, en coordonnées normalisées (-1..1), centré sur (0,0).
   Sert au panneau, au sachet, à l'enseigne sur le mur de l'atelier. */
function dessinerLogo(g, m, cx, cy, r){
  const c1 = m.c1 || "#e2b62c", c2 = m.c2 || "#3a2c14";
  g.save();
  g.translate(cx, cy);
  g.scale(r, r);
  g.lineJoin = "round"; g.lineCap = "round";

  switch (m.logo){
    case "blason": {
      g.fillStyle = c1;
      g.beginPath();
      g.moveTo(-0.72,-0.82); g.lineTo(0.72,-0.82); g.lineTo(0.72,0.18);
      g.quadraticCurveTo(0.72,0.72, 0,0.95);
      g.quadraticCurveTo(-0.72,0.72, -0.72,0.18);
      g.closePath(); g.fill();
      g.strokeStyle = c2; g.lineWidth = 0.13; g.stroke();
      g.fillStyle = c2;
      g.beginPath(); g.ellipse(0,-0.18,0.3,0.24,0.5,0,7); g.fill();
      g.beginPath(); g.moveTo(-0.34,0.34); g.lineTo(0.34,0.34); g.lineTo(0,0.6);
      g.closePath(); g.fill();
      break;
    }
    case "epi": {
      g.strokeStyle = c2; g.lineWidth = 0.14;
      g.beginPath(); g.moveTo(0,0.92); g.lineTo(0,-0.5); g.stroke();
      g.fillStyle = c1;
      for (let i=0;i<5;i++){
        const y = -0.5 + i*0.29;
        for (const s of [-1,1]){
          g.beginPath();
          g.ellipse(s*0.26, y, 0.3, 0.14, s*0.7, 0, 7);
          g.fill();
        }
      }
      g.fillStyle = c1;
      g.beginPath(); g.ellipse(0,-0.68,0.15,0.3,0,0,7); g.fill();
      break;
    }
    case "moulin": {
      g.fillStyle = c2;
      g.beginPath();
      g.moveTo(-0.5,0.92); g.lineTo(-0.28,-0.3); g.lineTo(0.28,-0.3); g.lineTo(0.5,0.92);
      g.closePath(); g.fill();
      g.fillStyle = c1;
      for (let i=0;i<4;i++){
        g.save(); g.rotate(i*Math.PI/2 + 0.42);
        g.beginPath(); g.moveTo(0,-0.42); g.lineTo(0.16,-0.5); g.lineTo(0.06,-1.0);
        g.lineTo(-0.06,-1.0); g.closePath(); g.fill();
        g.restore();
      }
      g.fillStyle = c1;
      g.beginPath(); g.arc(0,-0.42,0.13,0,7); g.fill();
      break;
    }
    case "monogramme": {
      g.fillStyle = c1;
      g.beginPath(); g.arc(0,0,0.9,0,7); g.fill();
      g.strokeStyle = c2; g.lineWidth = 0.1;
      g.beginPath(); g.arc(0,0,0.74,0,7); g.stroke();
      g.fillStyle = c2;
      g.font = "700 1.05px Georgia, serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(((m.nom||"C").trim()[0] || "C").toUpperCase(), 0, 0.06);
      break;
    }
    case "etoile": {
      g.fillStyle = c1;
      g.beginPath();
      for (let i=0;i<10;i++){
        const a = -Math.PI/2 + i*Math.PI/5, r2 = i%2 ? 0.42 : 0.95;
        i ? g.lineTo(Math.cos(a)*r2, Math.sin(a)*r2) : g.moveTo(Math.cos(a)*r2, Math.sin(a)*r2);
      }
      g.closePath(); g.fill();
      g.strokeStyle = c2; g.lineWidth = 0.1; g.stroke();
      break;
    }
    case "soleil": {
      g.strokeStyle = c1; g.lineWidth = 0.14;
      for (let i=0;i<10;i++){
        const a = i*Math.PI/5;
        g.beginPath();
        g.moveTo(Math.cos(a)*0.6, Math.sin(a)*0.6);
        g.lineTo(Math.cos(a)*0.98, Math.sin(a)*0.98);
        g.stroke();
      }
      g.fillStyle = c1; g.beginPath(); g.arc(0,0,0.46,0,7); g.fill();
      g.fillStyle = c2; g.beginPath(); g.arc(0,0,0.24,0,7); g.fill();
      break;
    }
    case "eclair": {
      g.fillStyle = c1;
      g.beginPath();
      g.moveTo(0.3,-0.95); g.lineTo(-0.55,0.12); g.lineTo(-0.06,0.12);
      g.lineTo(-0.3,0.95); g.lineTo(0.58,-0.16); g.lineTo(0.07,-0.16);
      g.closePath(); g.fill();
      g.strokeStyle = c2; g.lineWidth = 0.09; g.stroke();
      break;
    }
    default: {           // la patate
      g.fillStyle = c1;
      g.beginPath();
      g.ellipse(0, 0, 0.92, 0.68, -0.28, 0, 7);
      g.fill();
      g.strokeStyle = c2; g.lineWidth = 0.1; g.stroke();
      g.fillStyle = c2;
      for (const [x,y,s] of [[-0.3,-0.16,0.1],[0.18,0.12,0.13],[0.34,-0.3,0.08]]){
        g.beginPath(); g.ellipse(x,y,s,s*0.72,0.4,0,7); g.fill();
      }
    }
  }
  g.restore();
}

/* ------------------------------------------------------------- Le sachet */
function policeMarque(style, taille){
  switch (style){
    case "serif":     return "700 " + taille + "px Georgia, 'Times New Roman', serif";
    case "manuscrit": return "italic 700 " + taille + "px 'Segoe Script', 'Brush Script MT', cursive";
    case "pochoir":   return "800 " + taille + "px 'Arial Black', Impact, sans-serif";
    default:          return "700 " + taille + "px 'Segoe UI', sans-serif";
  }
}

/** Écrit un texte en le rétrécissant juste ce qu'il faut pour qu'il tienne.
 *  Un nom de marque long ne doit jamais déborder de son sachet. */
function texteAjuste(g, texte, cx, cy, largeurMax, style, taille){
  let t = taille;
  g.font = policeMarque(style, t);
  while (t > 6 && g.measureText(texte).width > largeurMax){
    t -= 1;
    g.font = policeMarque(style, t);
  }
  g.fillText(texte, cx, cy);
  return t;
}

/** Le sachet, dessiné comme on le verrait en rayon. `l` et `h` en pixels. */
function dessinerSachet(g, m, x, y, l, h, nomRecette){
  const fond = (FONDS_SACHET.find(f => f.id === m.fond) || FONDS_SACHET[0]);
  g.save();
  g.beginPath();
  const r = Math.min(l,h)*0.09;
  g.moveTo(x+r,y); g.lineTo(x+l-r,y); g.quadraticCurveTo(x+l,y,x+l,y+r);
  g.lineTo(x+l,y+h-r); g.quadraticCurveTo(x+l,y+h,x+l-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
  g.clip();

  g.fillStyle = fond.couleur;
  g.fillRect(x,y,l,h);

  // le motif
  const clair = "rgba(255,255,255,.16)", sombre = "rgba(0,0,0,.16)";
  switch (m.motif){
    case "rayures":
      g.fillStyle = clair;
      for (let i=-h; i<l+h; i+=l*0.16) { g.save(); g.translate(x+i,y); g.rotate(0.4);
        g.fillRect(0,0,l*0.07,h*1.9); g.restore(); }
      break;
    case "kraft":
      g.fillStyle = "rgba(196,164,110,.55)"; g.fillRect(x,y,l,h);
      g.fillStyle = "rgba(120,92,52,.20)";
      for (let i=0;i<60;i++)
        g.fillRect(x + bruit(i*3.1)*l, y + bruit(i*5.7)*h, 1.5, 1.5);
      break;
    case "damier":
      g.fillStyle = sombre;
      for (let a=0;a<6;a++) for (let b=0;b<8;b++)
        if ((a+b)%2) g.fillRect(x+a*l/6, y+b*h/8, l/6, h/8);
      break;
    case "vagues":
      g.strokeStyle = clair; g.lineWidth = Math.max(1.5, h*0.02);
      for (let i=0;i<6;i++){
        g.beginPath();
        for (let t=0;t<=10;t++)
          g[t?"lineTo":"moveTo"](x + t*l/10, y + h*(0.12+i*0.16) + Math.sin(t*0.9+i)*h*0.025);
        g.stroke();
      }
      break;
    case "eclats":
      for (let i=0;i<14;i++){
        g.fillStyle = i%2 ? clair : sombre;
        g.save(); g.translate(x + bruit(i*2.3)*l, y + bruit(i*4.1)*h); g.rotate(bruit(i*7.7)*3);
        g.fillRect(-l*0.16,-h*0.02, l*0.32, h*0.045);
        g.restore();
      }
      break;
  }

  // la soudure du haut et du bas
  g.fillStyle = "rgba(0,0,0,.22)";
  g.fillRect(x, y, l, h*0.07);
  g.fillRect(x, y+h-h*0.07, l, h*0.07);

  // le logo et le nom
  const encre = fond.sombre ? "#f5f1e6" : "#2a2418";
  const gl = { logo:m.logo, c1:m.c1, c2:m.c2, nom:m.nom };
  dessinerLogo(g, gl, x+l/2, y+h*0.32, Math.min(l,h)*0.20);
  g.fillStyle = encre;
  g.textAlign = "center"; g.textBaseline = "middle";
  texteAjuste(g, (m.nom || "").toUpperCase().slice(0,20), x+l/2, y+h*0.60,
              l*0.84, m.styleNom, Math.round(h*0.115));
  if (nomRecette){
    g.font = "600 " + Math.round(h*0.072) + "px 'Segoe UI', sans-serif";
    g.globalAlpha = 0.8;
    g.fillText(nomRecette.slice(0,22), x+l/2, y+h*0.73);
    g.globalAlpha = 1;
  }
  g.restore();
}

/* ------------------------------------------------------------ L'onglet */
function panneauMarque(z){
  const m = etat.marque;
  z.appendChild(elem('<h2 class="titrePan">La marque</h2>'));
  z.appendChild(elem('<p class="sousTitre">Ce que le public sait de vous, et ce que vous lui montrez.</p>'));

  /* --- les trois jauges --- */
  const bj = blocTitre("Où vous en êtes");
  const jauge = (nom, val, phrase, teinte) => {
    const l = document.createElement("div");
    l.className = "jaugeMarque";
    l.innerHTML = '<div class="jmTete"><span class="jmNom"></span><span class="jmVal"></span></div>'+
                  '<div class="jauge" style="height:8px"><i></i></div>'+
                  '<div class="jmPhrase"></div>';
    l.querySelector(".jmNom").textContent = nom;
    l.querySelector(".jmVal").textContent = Math.round(val) + " / 100";
    const i = l.querySelector("i");
    i.style.width = clamp(val,0,100) + "%";
    i.style.background = teinte;
    l.querySelector(".jmPhrase").textContent = phrase;
    bj.appendChild(l);
  };
  jauge("Notoriété", notoriete(), motNotoriete(notoriete()), "#e2b62c");
  jauge("Confiance", confiance(), motConfiance(confiance()), "#5cba6b");
  jauge("Standing", standing(), motStanding(standing()), "#9b6dc9");
  const cible = cibleStanding();
  if (Math.abs(cible - standing()) > 2)
    bj.appendChild(elem('<div class="reapproNote"></div>')).textContent =
      cible > standing()
        ? "Ce que vous montrez et ce que vous vendez tirent le standing vers " + Math.round(cible) +
          ". Il montera semaine après semaine."
        : "Attention : vos choix tirent le standing vers " + Math.round(cible) + ". Il va redescendre.";
  z.appendChild(bj);

  /* --- les marchés --- */
  const bm = blocTitre("Les marchés");
  for (const p of PALIERS){
    const ouvert = palierOuvert(p);
    const l = document.createElement("div");
    l.className = "palier" + (ouvert ? " ouvert" : "");
    l.innerHTML = '<div class="palTete"><span class="palNom"></span><span class="palEtat"></span></div>'+
                  '<div class="palResume"></div><div class="palCond"></div>';
    l.querySelector(".palNom").textContent = p.nom;
    l.querySelector(".palEtat").textContent = ouvert ? "ouvert" : "fermé";
    l.querySelector(".palResume").textContent = p.resume;
    const cond = l.querySelector(".palCond");
    if (ouvert){
      const pr = primePalier(p);
      cond.textContent = pr >= 1.02 ? "Ils paient " + Math.round((pr-1)*100) + " % au-dessus du prix courant."
                       : pr <= 0.98 ? "Ils paient " + Math.round((1-pr)*100) + " % en dessous du prix courant."
                       : "Ils paient le prix courant.";
    } else {
      cond.textContent = motPalier(p);
      cond.classList.add("ferme");
    }
    bm.appendChild(l);
  }
  z.appendChild(bm);

  /* --- le concurrent --- */
  const r = etat.rival;

function derniereRecetteNom(){
  const r = etat.recherche && etat.recherche.recettes;

function motNotoriete(v){
  if (v >= 80) return "Tout le monde connaît la maison.";
  if (v >= 55) return "On vous voit dans les rayons.";
  if (v >= 30) return "On commence à vous connaître.";
  if (v >= 12) return "Quelques-uns savent qui vous êtes.";
  return "Personne ne vous connaît encore.";
}
function motConfiance(v){
  if (v >= 85) return "On peut compter sur vous les yeux fermés.";
  if (v >= 70) return "Vous livrez, on le sait.";
  if (v >= 50) return "Correct, sans plus.";
  if (v >= 30) return "Vos retards commencent à se dire.";
  return "Plus personne ne vous fait confiance.";
}
function motStanding(v){
  if (v >= 80) return "Une marque de maison de luxe.";
  if (v >= 65) return "Une belle marque, qu'on offre.";
  if (v >= 45) return "Une marque honnête, de tous les jours.";
  if (v >= 28) return "Une marque de premier prix.";
  return "Une marque discount.";
}

/** Ce que fait le concurrent, dit simplement. */
function motRival(r){
  const ecart = r.standing - standing();
  if (ecart > 18) return r.nom + " joue plus haut de gamme que vous. Le volume vous est laissé.";
  if (ecart < -18) return r.nom + " casse les prix sous vous. Le haut du marché vous est laissé.";
  return r.nom + " vous suit sur le même terrain. C'est là que ça se joue au coude à coude.";
}

/* ============================================================================
   AUDIO — tout est synthétisé à la volée, aucun fichier (§13)
   ========================================================================== */

const audio = {
  ac:null, pret:false,
  gAmbiance:null, gEffets:null, gMusique:null,
  bruitBuf:null,
  ambiance:{ sources:[], filtre:null, gain:null },
  musique:{ osc:[], gain:null, prochain:0, accord:0 },
  dernierSon:{}
};

function initAudio(){
  if (audio.pret) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio.ac = new AC();
  const ac = audio.ac;

  audio.gAmbiance = ac.createGain(); audio.gAmbiance.gain.value = 0;
  audio.gEffets   = ac.createGain(); audio.gEffets.gain.value = 0.6;
  audio.gMusique  = ac.createGain(); audio.gMusique.gain.value = 0;
  audio.gAmbiance.connect(ac.destination);
  audio.gEffets.connect(ac.destination);
  audio.gMusique.connect(ac.destination);

  // Un buffer de bruit blanc réutilisé partout : jamais réalloué.
  const n = ac.sampleRate * 2;
  const b = ac.createBuffer(1, n, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
  audio.bruitBuf = b;

  construireAmbiance();
  construireMusique();
  audio.pret = true;
  majVolumes();
}

/** Le bourdonnement d'atelier : sa richesse suit le nombre de machines (§13). */
function construireAmbiance(){
  const ac = audio.ac;
  const g = ac.createGain(); g.gain.value = 1;
  g.connect(audio.gAmbiance);
  audio.ambiance.gain = g;

  // souffle grave filtré
  const src = ac.createBufferSource();
  src.buffer = audio.bruitBuf; src.loop = true;
  const f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 260; f.Q.value = 0.7;
  const gg = ac.createGain(); gg.gain.value = 0.5;
  src.connect(f); f.connect(gg); gg.connect(g);
  src.start();
  audio.ambiance.filtre = f;

  // deux bourdons de moteur
  for (const fr of [52, 78]){
    const o = ac.createOscillator();
    o.type = "sawtooth"; o.frequency.value = fr;
    const fo = ac.createBiquadFilter();
    fo.type = "lowpass"; fo.frequency.value = 180;
    const go = ac.createGain(); go.gain.value = 0.05;
    o.connect(fo); fo.connect(go); go.connect(g);
    o.start();
    audio.ambiance.sources.push({ osc:o, gain:go });
  }
}

function construireMusique(){
  const ac = audio.ac;
  const g = ac.createGain(); g.gain.value = 0.9;
  g.connect(audio.gMusique);
  audio.musique.gain = g;
  for (let i=0;i<3;i++){
    const o = ac.createOscillator();
    o.type = i === 2 ? "triangle" : "sine";
    o.frequency.value = 110;
    const go = ac.createGain(); go.gain.value = 0.12;
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    o.connect(f); f.connect(go); go.connect(g);
    o.start();
    audio.musique.osc.push({ osc:o, gain:go });
  }
}

const ACCORDS_MUSIQUE = [[110,164.81,220],[98,146.83,196],[123.47,164.81,246.94],[87.31,130.81,174.61]];

function majMusique(dts){
  if (!audio.pret || !etat) return;
  audio.musique.prochain -= dts;
  if (audio.musique.prochain <= 0){
    audio.musique.prochain = 14 + Math.random()*8;
    audio.musique.accord = (audio.musique.accord + 1 + Math.floor(Math.random()*2)) % ACCORDS_MUSIQUE.length;
    const a = ACCORDS_MUSIQUE[audio.musique.accord];
    const t = audio.ac.currentTime;
    // plus l'usine grandit, plus la nappe est ample
    const ampleur = 1 + Math.min(1, U().machines.length/10);
    audio.musique.osc.forEach((o,i) => {
      o.osc.frequency.setTargetAtTime(a[i] * (i===2 ? ampleur : 1), t, 2.5);
      o.gain.gain.setTargetAtTime(0.10/ampleur, t, 2.5);
    });
  }
}

function majVolumes(){
  if (!audio.pret || !etat) return;
  const r = etat.reglages;
  const m = r.muet ? 0 : 1;
  const t = audio.ac.currentTime;
  audio.gEffets.gain.setTargetAtTime(r.volEffets*m, t, 0.1);
  audio.gMusique.gain.setTargetAtTime(r.volMusique*0.5*m, t, 0.5);
}

/** Le fond sonore suit le nombre de machines qui tournent réellement. */
function majAmbiance(){
  if (!audio.pret || !etat) return;
  const u = U();
  let actives = 0;
  for (const m of u.machines) if (m.etat === "produit") actives++;
  const cible = etat.reglages.muet ? 0
    : etat.reglages.volAmbiance * clamp(0.12 + actives*0.1, 0, 0.85) * (etat.meta.vitesse > 0 ? 1 : 0.35);
  const t = audio.ac.currentTime;
  audio.gAmbiance.gain.setTargetAtTime(cible, t, 0.6);
  audio.ambiance.filtre.frequency.setTargetAtTime(200 + actives*90, t, 1.2);
  audio.ambiance.sources.forEach((s,i) => s.gain.gain.setTargetAtTime(0.03 + actives*0.012, t, 1.2));
}

/* ------------------------------------------------------- Sons ponctuels */
function ton(freq, duree, type, vol, glisse){
  if (!audio.pret || etat?.reglages.muet) return;
  const ac = audio.ac, t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(20,glisse), t+duree);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol ?? 0.2, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+duree);
  o.connect(g); g.connect(audio.gEffets);
  o.start(t); o.stop(t+duree+0.02);
}

function souffle(duree, freq, q, vol, type){
  if (!audio.pret || etat?.reglages.muet) return;
  const ac = audio.ac, t = ac.currentTime;
  const s = ac.createBufferSource();
  s.buffer = audio.bruitBuf;
  s.playbackRate.value = 0.8 + Math.random()*0.4;
  const f = ac.createBiquadFilter();
  f.type = type || "bandpass"; f.frequency.value = freq; f.Q.value = q ?? 1;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol ?? 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+duree);
  s.connect(f); f.connect(g); g.connect(audio.gEffets);
  s.start(t); s.stop(t+duree+0.02);
}

/** Anti-mitraillage : un même son ne se déclenche pas deux fois coup sur coup. */
function son(nom){
  if (!audio.pret || !etat || etat.reglages.muet) return;
  const t = audio.ac.currentTime;
  const mini = { laveuse:0.2, trancheuse:0.12, friteuse:0.25, tambour:0.25, ensacheuse:0.18, prise:0.18, depot:0.18 }[nom] || 0.04;
  if (audio.dernierSon[nom] && t - audio.dernierSon[nom] < mini) return;
  audio.dernierSon[nom] = t;

  switch (nom){
    // l'eau qui brasse : bruit large et grave
    case "laveuse":    souffle(0.5, 480, 0.7, 0.1, "lowpass"); break;
    // la lame : court et net
    case "trancheuse": souffle(0.09, 3200, 9, 0.13); break;
    // le grésillement de l'huile : long, médium, un peu sale
    case "friteuse":   souffle(0.75, 2100, 1.1, 0.11); break;
    // le tambour : roulement sourd
    case "tambour":    souffle(0.4, 240, 1.6, 0.09, "lowpass"); break;
    // l'ensacheuse : chuintement pneumatique puis clac de la soudure
    case "ensacheuse": souffle(0.13, 1800, 2.2, 0.1);
                       setTimeout(()=>ton(150,0.05,"square",0.08), 130); break;
    case "caisse":     break;
    case "prise":      ton(320, 0.05, "triangle", 0.05); break;
    case "depot":      ton(190, 0.09, "triangle", 0.07, 150); break;
    case "argent":     ton(880, 0.07, "sine", 0.14); setTimeout(()=>ton(1320,0.1,"sine",0.12), 70); break;
    case "valide":     ton(523,0.09,"sine",0.12); setTimeout(()=>ton(659,0.09,"sine",0.12),80); setTimeout(()=>ton(784,0.16,"sine",0.12),160); break;
    case "signature":  ton(392,0.12,"triangle",0.11); setTimeout(()=>ton(587,0.2,"triangle",0.1),110); break;
    case "panne":      ton(300, 0.6, "sawtooth", 0.16, 70); break;
    case "cle":        ton(700,0.05,"square",0.07); setTimeout(()=>ton(520,0.08,"square",0.06),70); break;
    case "pose":       souffle(0.14, 400, 1, 0.16, "lowpass"); ton(140,0.1,"sine",0.09,90); break;
    case "casse":      souffle(0.3, 900, 0.8, 0.16); break;
    case "refus":      ton(180, 0.14, "square", 0.09, 120); break;
    case "cloche":     ton(880,0.5,"sine",0.11); setTimeout(()=>ton(1174,0.7,"sine",0.09),160); break;
    case "age":        [261,329,392,523].forEach((f,i)=>setTimeout(()=>ton(f,0.5,"triangle",0.12),i*130)); break;
  }
}

/* ============================================================================
   SAUVEGARDE — localStorage + export/import de fichier (§12)
   ========================================================================== */

function serialiser(){
  const copie = JSON.parse(JSON.stringify(etat, (k,v) => {
    if (v instanceof Uint16Array) return undefined;   // traité à part
    return v;
  }));
  // La grille est un Uint16Array : on la range en tableau normal.
  copie.usines = etat.usines.map((u,i) => {
    const c = copie.usines[i];
    c.grille = Array.from(u.grille);
    return c;
  });
  copie.version = CONFIG.version;
  return JSON.stringify(copie);
}

function sauvegarder(cle){
  try {
    localStorage.setItem(cle || CONFIG.sauvegarde, serialiser());
    return true;
  } catch (e){
    notif("Sauvegarde impossible", "Le navigateur a refusé d'écrire.", "ko");
    return false;
  }
}

function sauvegardeAuto(){
  if (sauvegarder(CONFIG.sauvegarde)) notif("Partie enregistrée", "Fin de semaine, sauvegarde automatique.", "");
}

/** Prévue dès le départ : chaque version sait relire la précédente. */
function migrer(o){
  if (!o.version) o.version = 1;
  if (o.version < 2){
    // Version 2 : la grille couvre désormais la cour, une bande tout autour de
    // l'atelier. On la rebâtit à la bonne taille et on y réinscrit tout.
    for (const u of o.usines){
      u.cour = CONFIG.cour;
      u.grille = null;                 // reconstruite plus bas, une fois l'état posé
    }
    o.version = 2;
  }
  if (o.version < 3){
    // Version 3 : le labo passe de cinq axes à sept. Une recette d'avant n'a
    // ni texture ni touche : on lui met les valeurs d'origine, celles qui ne
    // changent rien à ce qu'elle était.
    const r = o.recherche;
    if (r){
      const combler = t => { for (const a of AXES_RECETTE) if (!t[a.cle]) t[a.cle] = a.options[0].id; };
      for (const x of (r.recettes || [])) if (x && x.traits) combler(x.traits);
      if (r.enCours && r.enCours.traits) combler(r.enCours.traits);
      r.connus = null;             // recalculé au chargement
    }
    o.version = 3;
  }
  if (o.version < 4){
    // Version 4 : la marque. La confiance existait déjà sous le nom de
    // réputation ; on ajoute le standing et l'identité visuelle.
    o.marque = marqueParDefaut(o.meta && o.meta.nomEntreprise);
    o.version = 4;
  }
  if (o.version < 5){
    o.labels = { obtenus:[], suite:{}, local:false };
    o.version = 5;
  }
  if (o.version < 6){
    o.rival = null;          // recréé au chargement
    o.version = 6;
  }
  return o;
}

/** Repose sur la grille tout ce qui l'occupe. Sert à la migration et de filet
 *  de sécurité : la grille est un index, elle se recalcule toujours. */
function reconstruireGrille(u){
  const c = profondeurCour(u);
  u.grille = new Uint16Array((u.largeur + 2*c) * (u.hauteur + 2*c));
  placerQuais(u);
  for (const m of u.machines) poserSurGrille(u, m);
  for (const cv of u.convoyeurs)
    for (const t of cv.chemin)
      if (dansPlan(u,t.x,t.y)) u.grille[indexCase(u,t.x,t.y)] = cv.id;
}

function appliquer(o){
  o = migrer(o);
  if (o.version > CONFIG.version){
    notif("Sauvegarde trop récente", "Ce fichier vient d'une version plus récente du jeu.", "ko");
    return false;
  }
  for (const u of o.usines) u.grille = u.grille ? Uint16Array.from(u.grille) : null;
  etat = o;
  for (const u of etat.usines){
    if (u.cour == null) u.cour = CONFIG.cour;
    if (!u.grille) reconstruireGrille(u);
  }
  // champs ajoutés après coup : on complète sans casser les vieilles parties
  etat.reglages = Object.assign({ volAmbiance:0.5, volEffets:0.6, volMusique:0.35, muet:false }, etat.reglages||{});
  etat.reappro = etat.reappro || {};
  etat.formations = etat.formations || [];
  etat.marque = Object.assign(marqueParDefaut(etat.meta.nomEntreprise), etat.marque || {});
  etat.labels = Object.assign({ obtenus:[], suite:{}, local:false }, etat.labels || {});
  if (!etat.rival || !etat.rival.nom) etat.rival = creerRival();
  cacheEnseigne = null;
  etat.finances.creances = etat.finances.creances || [];
  etat.progression.compteurs = etat.progression.compteurs || {};
  etat.stats.clients = etat.stats.clients || {};
  etat.recherche = Object.assign({ recettes:[], enCours:null, notoriete:0,
                                   tendance:0, tendanceSemaine:0, prochain:1 }, etat.recherche || {});
  if (!Array.isArray(etat.recherche.recettes)) etat.recherche.recettes = [];
  if (!Array.isArray(etat.recherche.connus)) verifierDeblocages(false);
  injecterRecettesJoueur();      // les recettes maison ne vivent pas dans les tables constantes
  etat.meta.mode = etat.meta.mode || "normal";
  for (const s of etat.stats.historiqueSemaines) s.depensesParMotif = s.depensesParMotif || {};
  etat.stats.semaineCourante.depensesParMotif = etat.stats.semaineCourante.depensesParMotif || {};
  if (etat.venteAuto === undefined) etat.venteAuto = true;
  etat.tuto = etat.tuto || { etape:TUTO.length, fait:[] };
  etat.stats.semaineCourante = etat.stats.semaineCourante || semaineVierge();
  reindexer();
  return true;
}

function charger(cle){
  const brut = localStorage.getItem(cle || CONFIG.sauvegarde);
  if (!brut) return false;
  try {
    return appliquer(JSON.parse(brut));
  } catch (e){
    notif("Sauvegarde illisible", "Le fichier est abîmé.", "ko");
    return false;
  }
}

function exporterFichier(){
  const blob = new Blob([serialiser()], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const s = semaineCourante()+1;
  a.download = "cadence-" + etat.meta.nomEntreprise.toLowerCase().replace(/[^a-z0-9]+/g,"-") + "-s" + s + ".json";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function importerFichier(){
  const i = document.createElement("input");
  i.type = "file"; i.accept = "application/json,.json";
  i.onchange = () => {
    const f = i.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        if (appliquer(JSON.parse(r.result))){
          fermer("#ecranTitre"); fermer("#ecranMenu");
          demarrer();
          notif("Partie chargée", etat.meta.nomEntreprise + ", semaine " + (semaineCourante()+1) + ".", "ok");
        }
      } catch (e){ notif("Fichier illisible", "Ce n'est pas une sauvegarde de Cadence.", "ko"); }
    };
    r.readAsText(f);
  };
  i.click();
}

/* ============================================================================
   INIT — boucle principale, clavier, démarrage
   ========================================================================== */

let dernierTemps = 0, accumulateur = 0;

/** Accumulateur à pas fixe : jamais de setTimeout pour la boucle (§16). */
function boucle(t){
  requestAnimationFrame(boucle);
  if (!dernierTemps) dernierTemps = t;
  let dts = (t - dernierTemps)/1000;
  dernierTemps = t;
  if (dts > 0.25) dts = 0.25;              // onglet en arrière-plan : on ne rattrape pas tout
  vue.temps += dts;
  if (vue.secousse > 0) vue.secousse = Math.max(0, vue.secousse - dts*22);

  if (etat){
    const v = unEcranOuvert() ? 0 : etat.meta.vitesse;
    if (v > 0){
      accumulateur += dts * CONFIG.hz * v;
      let n = 0;
      // On s'arrête net si la simulation vient de se mettre en pause
      // (vendredi soir, passage d'âge, dépôt de bilan).
      while (accumulateur >= 1 && n < 24){
        simTick(); accumulateur -= 1; n++;
        if (etat.meta.vitesse === 0) { accumulateur = 0; break; }
      }
      if (accumulateur > 24) accumulateur = 0;
    } else accumulateur = 0;

    vue.alpha = clamp(accumulateur, 0, 1);
    majParticules(dts);
    fumeeMachines(dts * (etat.meta.vitesse || 0));
    defilementBords(dts);
    dessiner();

    // Rafraîchissements peu fréquents : l'interface n'a pas besoin de 60 fps.
    cadenceUI += dts;
    if (cadenceUI > 0.25){
      cadenceUI = 0;
      majBandeau();
      majCadence(0.25);
      // Le guide ne bouge pas : le reconstruire en boucle casserait les
      // sections que le joueur vient d'ouvrir.
      if (vue.ongletActif !== "guide") majPanneau();
      majAmbiance();
      majMusique(0.25);
      verifierPremierProduit();
    }
  }
}
let cadenceUI = 0;

/** Le contremaître salue le premier produit fini (didacticiel). */
function verifierPremierProduit(){
  if (!etat.tuto || etat.tuto.etape >= TUTO.length) return;
  const total = Object.keys(etat.progression.produits)
    .filter(k => ITEMS[k].cat === "produit")
    .reduce((s,k)=>s+etat.progression.produits[k],0);
  if (total >= 1) tutoEvenement("premier_produit");
}

/** Déplacement de la caméra par les bords de l'écran. Réservé aux phases de
 *  construction : sinon la vue partirait dès qu'on va vers le panneau droit. */
function defilementBords(dts){
  if (!vue.souris.dedans || !vue.outil) return;
  if (vue.glisse && vue.glisse.type === "cam") return;
  const marge = 14, v = 9/vue.zoom*dts*CONFIG.tuile/CONFIG.tuile*8;
  if (vue.souris.x < marge) vue.camX -= v;
  if (vue.souris.x > largeurVue - marge) vue.camX += v;
  if (vue.souris.y < marge) vue.camY -= v;
  if (vue.souris.y > hauteurVue - marge) vue.camY += v;
  bornerCamera();
}

function bornerCamera(){
  const u = U();
  const co = profondeurCour(u) + 3;
  vue.camX = clamp(vue.camX, -co, u.largeur+co);
  vue.camY = clamp(vue.camY, -co, u.hauteur+co);
}

/* ------------------------------------------------------------- Clavier */
function initClavier(){
  window.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;

    if (e.code === "F2"){ e.preventDefault(); basculerDev(); return; }
    if (e.code === "Escape"){
      if ($("#panneauDev").classList.contains("visible")) return basculerDev();
      if (vue.convDepart){ annulerTrace(); return; }
      if ($("#ecranSortieRecette").classList.contains("visible")) return fermerSortieRecette();
      if (unEcranOuvert() && $("#ecranStats").classList.contains("visible")) fermer("#ecranStats");
      else if (unEcranOuvert() && $("#ecranRecherche").classList.contains("visible")) fermer("#ecranRecherche");
      else if (unEcranOuvert() && $("#ecranMenu").classList.contains("visible")) fermer("#ecranMenu");
      else if (vue.outil) annulerOutil();
      else if (vue.selection){ vue.selection = null; majPanneau(); }
      return;
    }
    if (unEcranOuvert()) return;

    switch (e.code){
      case "Space":
        e.preventDefault();
        reglerVitesse(etat.meta.vitesse === 0 ? 1 : 0);
        break;
      case "KeyR":
        if (vue.outil?.type === "machine") vue.rotation = (vue.rotation+1)%4;
        else if (etat.meta.age >= 4 || mode().toutDebloque) ouvrirRecherche();
        break;
      case "KeyX": basculerCroisement(); break;
      case "Digit1": reglerVitesse(1); break;
      case "Digit2": reglerVitesse(2); break;
      case "Digit3": reglerVitesse(4); break;
      case "KeyM": basculerSon(); break;
      case "KeyC": $("#cadenceHud").classList.toggle("hidden"); break;
      case "F2": e.preventDefault(); basculerDev(); break;
      case "KeyS": if (!e.ctrlKey && !e.metaKey) ouvrirStats(); break;
      case "Digit4": reglerVitesse(8); break;
      case "ArrowLeft":  vue.camX -= 1.2; bornerCamera(); break;
      case "ArrowRight": vue.camX += 1.2; bornerCamera(); break;
      case "ArrowUp":    vue.camY -= 1.2; bornerCamera(); break;
      case "ArrowDown":  vue.camY += 1.2; bornerCamera(); break;
      case "Equal": case "NumpadAdd":
        vue.zoom = clamp(vue.zoom*1.15, CONFIG.zoomMin, CONFIG.zoomMax); break;
      case "Minus": case "NumpadSubtract":
        vue.zoom = clamp(vue.zoom/1.15, CONFIG.zoomMin, CONFIG.zoomMax); break;
      case "Delete": case "Backspace": {
        const n = vue.selection ? noeudParId(vue.selection) : null;
        if (n && !estQuai(n)){ demolir(n); majBarreConstruction(); majPanneau(); }
        break;
      }
    }
  });
}

function reglerVitesse(v){
  etat.meta.vitesse = v;
  majBandeau();
  initAudio();
}

function basculerSon(){
  etat.reglages.muet = !etat.reglages.muet;
  $("#btSon").classList.toggle("off", etat.reglages.muet);
  $("#btSon").textContent = etat.reglages.muet ? "✕" : "♪";
  majVolumes(); majAmbiance();
}

/* ------------------------------------------------------------ Démarrage */
function demarrer(){
  reindexer();
  centrerCamera();
  vue.selection = null;
  vue.ongletActif = "detail";
  majOnglets();
  majBarreConstruction();
  majPanneau();
  majBandeau();
  dessinerTete($("#portrait").getContext("2d"), 3);
  tutoDemarrage();
  initAudio();
  majVolumes();
}

function init(){
  initRendu();
  initSouris();
  initClavier();

  $$("#vitesses button").forEach(b => b.onclick = () => reglerVitesse(+b.dataset.v));
  $$("#onglets button").forEach(b => b.onclick = () => {
    vue.ongletActif = b.dataset.o; majOnglets(); majPanneau();
  });
  $("#btMenu").onclick = () => { if (etat) ouvrirMenu(); };
  $("#btStats").onclick = () => { if (etat) ouvrirStats(); };

  $("#btSon").onclick = () => { initAudio(); basculerSon(); };
  $("#btAide").onclick = ouvrirAide;
  $("#portrait").onclick = () => { initAudio(); conseil(); };

  // Le contexte audio ne démarre qu'après un geste de l'utilisateur.
  window.addEventListener("pointerdown", initAudio, { once:true });
  window.addEventListener("beforeunload", () => { if (etat) sauvegarder(CONFIG.sauvegarde); });

  ouvrirTitre();
  requestAnimationFrame(boucle);
}

init();

</script>
