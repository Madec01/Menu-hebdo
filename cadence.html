<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadence</title>
<style>
/* ============================================================
   CADENCE — feuille de style unique
   L'interface de gestion est en DOM/CSS, la vue usine en Canvas.
   ============================================================ */

:root{
  --sol:#4a4d52;
  --fond:#15171a;
  --fond2:#1d2024;
  --fond3:#25292e;
  --bord:#33383f;
  --bord-clair:#454c55;
  --texte:#e6e8ea;
  --texte-doux:#9aa2ac;
  --texte-faible:#6b737d;
  --or:#f0b429;
  --vert:#5cba6b;
  --rouge:#e0574a;
  --orange:#e8863c;
  --bleu:#4b8fd4;
  --violet:#9b6dc9;
  --cyan:#3fb8c4;
  --ombre:0 8px 30px rgba(0,0,0,.45);
  --r:8px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fond);
  color:var(--texte);
  font:14px/1.45 "Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- Structure ---------- */
#app{display:flex;flex-direction:column;height:100vh;min-width:1180px}

#barreHaute{
  display:flex;align-items:center;gap:18px;
  height:52px;padding:0 14px;flex:0 0 52px;
  background:linear-gradient(180deg,#22262b,#191c20);
  border-bottom:1px solid var(--bord);
  box-shadow:0 2px 12px rgba(0,0,0,.4);
  z-index:30;
}
.marque{
  font-weight:700;letter-spacing:.22em;font-size:13px;color:var(--or);
  padding-right:14px;border-right:1px solid var(--bord);
}
.indic{display:flex;flex-direction:column;justify-content:center;min-width:78px}
.indic .lab{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--texte-faible)}
.indic .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.indic.hidden{display:none}
#indArgent .val.neg{color:var(--rouge)}
#indArgent .val.pos{color:var(--vert)}

.espaceur{flex:1}

#vitesses{display:flex;gap:3px;background:var(--fond);border:1px solid var(--bord);border-radius:6px;padding:3px}
#vitesses button{
  padding:4px 11px;border-radius:4px;font-size:12px;font-weight:600;
  color:var(--texte-doux);transition:background .12s,color .12s;
}
#vitesses button:hover{background:var(--fond3);color:var(--texte)}
#vitesses button.actif{background:var(--or);color:#221a02}

.btIcone{
  width:34px;height:34px;border-radius:6px;display:grid;place-items:center;
  color:var(--texte-doux);border:1px solid transparent;font-size:16px;
}
.btIcone:hover{background:var(--fond3);color:var(--texte);border-color:var(--bord)}
.btIcone.off{color:var(--texte-faible);opacity:.55}

/* ---------- Zone de jeu ---------- */
#zoneJeu{flex:1;display:flex;min-height:0}
#colGauche{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#cadreVue{flex:1;position:relative;overflow:hidden;background:#101215}
#vue{position:absolute;inset:0;display:block;cursor:crosshair}
#vue.deplace{cursor:grabbing}

/* ---------- Barre basse : construction ---------- */
#barreBasse{
  flex:0 0 auto;background:linear-gradient(180deg,#1d2126,#171a1e);
  border-top:1px solid var(--bord);padding:8px 12px;display:flex;gap:16px;align-items:flex-start;
  z-index:20;
}
.catBloc{display:flex;flex-direction:column;gap:5px}
.catTitre{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--texte-faible);padding-left:2px}
.catOutils{display:flex;gap:6px}
.outil{
  width:74px;padding:6px 4px;border-radius:var(--r);background:var(--fond3);
  border:1px solid var(--bord);display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .1s,border-color .12s,background .12s;
}
.outil:hover:not(.verrou){transform:translateY(-2px);border-color:var(--bord-clair);background:#2c3138}
.outil.actif{border-color:var(--or);background:#332a10;box-shadow:0 0 0 1px var(--or) inset}
.outil.verrou{opacity:.32;cursor:not-allowed}
.outil.cher{border-color:#5a2f2a}
.outil .glyphe{width:30px;height:22px;border-radius:3px;position:relative}
.outil .nom{font-size:10.5px;line-height:1.15;text-align:center;color:var(--texte-doux)}
.outil .prix{font-size:10px;font-variant-numeric:tabular-nums;color:var(--or)}
.outil.cher .prix{color:var(--rouge)}

/* ---------- Panneau droit ---------- */
#panneau{
  flex:0 0 336px;background:var(--fond2);border-left:1px solid var(--bord);
  display:flex;flex-direction:column;min-height:0;
}
#panneau.replie{flex-basis:44px}
#panneau.replie .ongletsLabel,#panneau.replie #contenuPanneau{display:none}
#onglets{display:flex;border-bottom:1px solid var(--bord);background:var(--fond)}
#onglets button{
  flex:1;padding:11px 4px;font-size:11px;letter-spacing:.04em;color:var(--texte-faible);
  border-bottom:2px solid transparent;transition:color .12s,border-color .12s,background .12s;
}
#onglets button:hover{color:var(--texte-doux);background:var(--fond2)}
#onglets button.actif{color:var(--or);border-bottom-color:var(--or);background:var(--fond2)}
#contenuPanneau{flex:1;overflow-y:auto;padding:14px}

/* barres de défilement discrètes */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a4048;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#4c545e}

/* ---------- Briques d'interface ---------- */
h2.titrePan{font-size:16px;font-weight:600;margin-bottom:3px}
p.sousTitre{font-size:12px;color:var(--texte-faible);margin-bottom:12px}
.bloc{background:var(--fond3);border:1px solid var(--bord);border-radius:var(--r);padding:11px;margin-bottom:10px}
.bloc h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-faible);margin-bottom:8px;font-weight:600}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.ligne .k{color:var(--texte-doux)}
.ligne .v{font-variant-numeric:tabular-nums;font-weight:600}
.vide{color:var(--texte-faible);font-size:12.5px;font-style:italic;padding:8px 0}

.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 13px;border-radius:6px;background:var(--fond3);border:1px solid var(--bord-clair);
  font-size:13px;font-weight:500;transition:background .12s,border-color .12s,transform .08s;
}
.bt:hover{background:#343a42;border-color:#59616c}
.bt:active{transform:translateY(1px)}
.bt.plein{background:var(--or);border-color:var(--or);color:#241b03;font-weight:600}
.bt.plein:hover{background:#ffc63f;border-color:#ffc63f}
.bt.danger{border-color:#6a3129;color:#f0a094}
.bt.danger:hover{background:#3a1d18}
.bt.large{width:100%}
.bt[disabled]{opacity:.4;pointer-events:none}
.btRang{display:flex;gap:6px;margin-top:8px}
.btRang .bt{flex:1;padding:7px 6px;font-size:12px}

.jauge{height:7px;background:#14161a;border-radius:4px;overflow:hidden;margin:6px 0}
.jauge>i{display:block;height:100%;background:var(--or);border-radius:4px;transition:width .3s}
.jauge.vert>i{background:var(--vert)}
.jauge.rouge>i{background:var(--rouge)}
.jauge.bleu>i{background:var(--bleu)}

.pastille{
  display:inline-block;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:600;
  letter-spacing:.03em;background:var(--fond);border:1px solid var(--bord);color:var(--texte-doux);
}
.pastille.ok{background:#1c3021;border-color:#2d5535;color:#8fd89c}
.pastille.att{background:#3a2e14;border-color:#5f4a1c;color:#f0c96a}
.pastille.ko{background:#3a1e1a;border-color:#5f2c25;color:#f0a094}

/* ---------- Notifications ---------- */
#notifs{position:absolute;top:12px;right:12px;width:252px;display:flex;flex-direction:column;gap:7px;z-index:25;pointer-events:none}
.notif{
  background:rgba(28,32,37,.96);border:1px solid var(--bord-clair);border-left:3px solid var(--bleu);
  border-radius:6px;padding:9px 11px;font-size:12.5px;box-shadow:var(--ombre);
  animation:glisseNotif .28s ease-out;backdrop-filter:blur(3px);
}
.notif.ok{border-left-color:var(--vert)}
.notif.att{border-left-color:var(--or)}
.notif.ko{border-left-color:var(--rouge)}
.notif b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--texte-faible);margin-bottom:2px;font-weight:600}
.notif.part{animation:sortNotif .3s ease-in forwards}
@keyframes glisseNotif{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes sortNotif{to{opacity:0;transform:translateX(26px);max-height:0;padding-block:0;margin-bottom:-7px}}

/* ---------- Contremaître ---------- */
#contremaitre{position:absolute;left:14px;bottom:14px;display:flex;align-items:flex-end;gap:10px;z-index:26;max-width:520px}
#portrait{
  width:60px;height:60px;flex:0 0 60px;border-radius:50%;background:#2a2f36;border:2px solid var(--or);
  cursor:pointer;box-shadow:var(--ombre);transition:transform .14s;
}
#portrait:hover{transform:scale(1.06)}
#bulle{
  position:relative;background:rgba(32,36,42,.97);border:1px solid var(--bord-clair);border-radius:10px;
  padding:11px 14px;font-size:13.5px;line-height:1.5;box-shadow:var(--ombre);backdrop-filter:blur(3px);
  animation:monteBulle .22s ease-out;
}
#bulle::before{content:"";position:absolute;left:-7px;bottom:16px;width:12px;height:12px;background:inherit;border-left:1px solid var(--bord-clair);border-bottom:1px solid var(--bord-clair);transform:rotate(45deg)}
#bulle .qui{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--or);font-weight:700;margin-bottom:3px}
#contremaitre.muet #bulle{display:none}
@keyframes monteBulle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Infobulle survol ---------- */
#infobulle{
  position:absolute;z-index:28;pointer-events:none;display:none;max-width:250px;
  background:rgba(20,23,27,.97);border:1px solid var(--bord-clair);border-radius:6px;
  padding:8px 10px;font-size:12.5px;line-height:1.42;box-shadow:var(--ombre);
}
#infobulle .t{font-weight:600;margin-bottom:2px}
#infobulle .d{color:var(--texte-doux)}
#infobulle .e{margin-top:3px}

/* ---------- Superpositions plein écran ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(9,10,12,.9);backdrop-filter:blur(5px);
  overflow-y:auto;padding:20px 26px;
}
.overlay.visible{display:block;animation:fondu .25s ease-out}
@keyframes fondu{from{opacity:0}to{opacity:1}}
.feuille{max-width:1080px;margin:0 auto}
.enteteFeuille{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--bord)}
.enteteFeuille h1{font-size:24px;font-weight:600;letter-spacing:.01em}
.enteteFeuille .sous{color:var(--texte-faible);font-size:14px}

.volets{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.bandeauObjectif{margin-bottom:16px;padding:14px 18px}
.objLigne{display:grid;grid-template-columns:minmax(180px,1fr) 2fr minmax(150px,1fr);gap:20px;align-items:center}
.objLigne h2{margin-bottom:3px}
.objTitre{font-size:15px;font-weight:600}
.objChiffre{font-size:12px;color:var(--texte-faible);margin-top:4px}
.objMot{font-size:13px;color:var(--texte-doux);font-style:italic;text-align:right}
.volet{background:var(--fond2);border:1px solid var(--bord);border-radius:12px;padding:18px}
.volet h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--texte-faible);margin-bottom:14px;font-weight:600}
.grandChiffre{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.grandChiffre.pos{color:var(--vert)}
.grandChiffre.neg{color:var(--rouge)}
.faitMarquant{margin-top:12px;padding:10px 12px;background:#2a2410;border:1px solid #4a3d12;border-radius:8px;font-size:13px;color:#f0d493}

.cartes{display:flex;flex-direction:column;gap:11px}
.carte{background:var(--fond3);border:1px solid var(--bord-clair);border-radius:10px;padding:14px;transition:border-color .15s}
.carte:hover{border-color:#5b636e}
.carte .cType{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.carte .cTitre{font-size:15px;font-weight:600;margin-bottom:5px}
.carte .cCorps{font-size:13px;color:var(--texte-doux);line-height:1.5}
.carte .cAvis{margin-top:9px;padding:8px 10px;border-radius:6px;background:rgba(240,180,41,.09);border-left:2px solid var(--or);font-size:12.5px;font-style:italic;color:#e3d2a8}
.carte.traitee{opacity:.4;pointer-events:none}
.tContrat{color:var(--bleu)}.tAchat{color:var(--cyan)}.tInvest{color:var(--violet)}.tRh{color:var(--vert)}.tBanque{color:var(--or)}

#graphSemaines{width:100%;height:96px;display:block;margin-top:6px;border-radius:6px;background:#14171b}

.piedFeuille{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:16px}

/* ---------- Écran-titre ---------- */
#ecranTitre .feuille{max-width:520px;margin-top:9vh;text-align:center}
#ecranTitre h1{font-size:60px;letter-spacing:.3em;color:var(--or);font-weight:300;margin-bottom:4px;text-indent:.3em}
#ecranTitre .accroche{color:var(--texte-doux);font-size:14.5px;line-height:1.6;margin-bottom:32px}
#ecranTitre .bt{width:100%;margin-bottom:9px;padding:13px}
#ecranTitre .credits{margin-top:26px;font-size:11.5px;color:var(--texte-faible);line-height:1.7}
.champTexte{
  width:100%;padding:10px 12px;background:var(--fond);border:1px solid var(--bord-clair);
  border-radius:6px;margin-bottom:14px;text-align:center;font-size:15px;
}
.champTexte:focus{outline:none;border-color:var(--or)}

/* ---------- Listes du panneau ---------- */
.item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.item:last-child{border-bottom:none}
.puce{width:16px;height:16px;border-radius:3px;flex:0 0 16px;border:1px solid rgba(0,0,0,.35)}
.item .nom{flex:1;font-size:12.5px}
.item .qte{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.item .sub{font-size:11px;color:var(--texte-faible)}
.mini{padding:3px 8px;font-size:11px;border-radius:4px;background:var(--fond);border:1px solid var(--bord-clair)}
.mini:hover{background:#333941}

.fiche{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.avatar{width:38px;height:38px;border-radius:50%;flex:0 0 38px;background:#333;border:1px solid var(--bord-clair)}

table.tab{width:100%;border-collapse:collapse;font-size:12.5px}
table.tab th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--texte-faible);padding:4px 6px;font-weight:600}
table.tab td{padding:5px 6px;border-top:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
table.tab tr:hover td{background:rgba(255,255,255,.028)}

.mev{color:var(--or);font-weight:600}
.tendHausse{color:var(--rouge)}
.tendBaisse{color:var(--vert)}

#coinAide{position:absolute;right:12px;bottom:12px;z-index:24;display:flex;gap:6px}
#coinAide .bt{background:rgba(30,34,39,.9);backdrop-filter:blur(3px)}

.rgl{display:flex;align-items:center;gap:9px;margin:7px 0}
.rgl label{flex:0 0 82px;font-size:12px;color:var(--texte-doux)}
.rgl input[type=range]{flex:1;accent-color:var(--or)}
</style>
</head>
<body>

<div id="app">

  <!-- ===================== BARRE HAUTE ===================== -->
  <header id="barreHaute">
    <div class="marque">CADENCE</div>

    <div class="indic" id="indArgent"><span class="lab">Caisse</span><span class="val">8 000 €</span></div>
    <div class="indic" id="indDate"><span class="lab">Date</span><span class="val">Semaine 1 · Lundi 8 h</span></div>
    <div class="indic" id="indCommande"><span class="lab">Commande</span><span class="val">—</span></div>
    <div class="indic hidden" id="indStock"><span class="lab">En stock</span><span class="val">—</span></div>
    <div class="indic hidden" id="indReput"><span class="lab">Réputation</span><span class="val">50</span></div>
    <div class="indic hidden" id="indPerso"><span class="lab">Équipe</span><span class="val">1</span></div>

    <div class="espaceur"></div>

    <div id="vitesses">
      <button data-v="0" title="Pause (Espace)">❚❚</button>
      <button data-v="1" class="actif" title="Vitesse normale">×1</button>
      <button data-v="2" title="Vitesse double">×2</button>
      <button data-v="4" title="Vitesse quadruple">×4</button>
    </div>
    <button class="btIcone" id="btSon" title="Couper le son">♪</button>
    <button class="btIcone" id="btMenu" title="Menu et sauvegarde">☰</button>
  </header>

  <!-- ===================== ZONE DE JEU ===================== -->
  <main id="zoneJeu">
    <div id="colGauche">
      <div id="cadreVue">
        <canvas id="vue"></canvas>
        <div id="notifs"></div>
        <div id="contremaitre" class="muet">
          <canvas id="portrait" width="120" height="120" title="Demander l'avis du contremaître"></canvas>
          <div id="bulle"><div class="qui">Gérard, contremaître</div><div id="bulleTexte"></div></div>
        </div>
        <div id="infobulle"></div>
        <div id="coinAide">
          <button class="bt mini" id="btAide" title="Aide et raccourcis">?</button>
        </div>
      </div>
      <footer id="barreBasse"></footer>
    </div>

    <!-- ===================== PANNEAU DROIT ===================== -->
    <aside id="panneau">
      <nav id="onglets">
        <button data-o="detail" class="actif">Détail</button>
        <button data-o="stocks">Stocks</button>
        <button data-o="perso">Équipe</button>
        <button data-o="commandes">Commandes</button>
        <button data-o="finances">Argent</button>
      </nav>
      <div id="contenuPanneau"></div>
    </aside>
  </main>
</div>

<!-- ===================== SUPERPOSITIONS ===================== -->
<div class="overlay" id="ecranTitre"></div>
<div class="overlay" id="ecranVendredi"></div>
<div class="overlay" id="ecranMenu"></div>
<div class="overlay" id="ecranFin"></div>

<script>
"use strict";
/* ============================================================================
   CONFIG — constantes du moteur
   ----------------------------------------------------------------------------
   Note d'équilibrage (écart assumé avec le document de game design) :
   le §6.1 donne à la fois « 1 journée = 40 s réelles » et « 1 minute de jeu
   = 12 ticks » ; les deux sont incompatibles (12 ticks/min à 4 Hz donnerait
   24 min réelles par journée). On garde 40 s/journée, qui est la contrainte
   de rythme du §14 — soit 3 minutes de jeu par tick.
   Les durées machine sont calées pour tenir le rythme visé au §14 : sortir
   de l'âge 1 en 20 à 30 minutes réelles.
   ----------------------------------------------------------------------------
   Unités : tout ce qui se transforme est en kilos, comme dans le métier.
   Seuls les sachets se comptent à l'unité. C'est le champ `unite` de ITEMS
   qui tranche, et `quantiteItem()` qui l'écrit correctement à l'écran.
   ========================================================================== */

const CONFIG = {
  hz: 4,                       // ticks de simulation par seconde à la vitesse ×1
  secondesParJour: 40,         // durée réelle d'une journée à ×1
  minutesParJour: 480,         // 8 heures de travail
  heureDebut: 8,
  joursParSemaine: 5,
  tuile: 32,                   // pixels par tuile à zoom 1
  zoomMin: 0.4, zoomMax: 2.0, zoomDefaut: 1,
  seuilDetail: 0.6,            // en dessous : rendu simplifié
  seuilSchema: 0.5,            // en dessous : vue schématique
  capaciteEntree: 260,         // tampon d'entrée par défaut, en kilos
  capaciteSortie: 200,
  vitesseOuvrier: 0.30,        // tuiles par minute de jeu
  decouvertMax: -5000,
  faillite: -15000,
  remboursementCasse: 0.6,     // remboursement à la démolition
  particulesMax: 300,
  itemsConvoyeurMax: 40,
  argentDepart: 8000,
  loyerParJour: [40, 110, 260, 520, 900],   // par âge
  energieParMachineJour: 9,
  reputationDepart: 50,
  decisionsMax: 4,
  sauvegarde: "cadence_save_v1",
  version: 1
};

// minutes de jeu écoulées par tick de simulation
CONFIG.minutesParTick = CONFIG.minutesParJour / (CONFIG.secondesParJour * CONFIG.hz); // = 3
CONFIG.ticksParJour   = CONFIG.secondesParJour * CONFIG.hz;                            // = 160

/* ============================================================================
   DONNÉES — tout l'équilibrage est ici, sans logique.
   ========================================================================== */

/* ------------------------------------------------------------- Utilitaires */
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a+(b-a)*t;
const hasard = (a,b) => a + Math.random()*(b-a);
const hasardInt = (a,b) => Math.floor(hasard(a,b+1));
const choix = t => t[Math.floor(Math.random()*t.length)];

// Bruit déterministe : même index → même valeur. Évite le scintillement des
// items figuratifs d'une frame à l'autre (§7.2).
function bruit(i){ const x = Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }

function euros(n){
  const s = Math.round(Math.abs(n)).toLocaleString("fr-FR");
  return (n<0?"−":"") + s + " €";
}
function eurosSigne(n){
  const s = Math.round(Math.abs(n)).toLocaleString("fr-FR");
  return (n<0?"−":"+") + s + " €";
}
function nb(n, dec=0){ return n.toLocaleString("fr-FR",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function pluriel(n, singulier, plur){ return n<=1 ? singulier : (plur || singulier+"s"); }

/** Nom d'une matière correctement accordé : « 94 vélos classiques », jamais
 *  « 94 vélo classiques ». Les pluriels sont déclarés dans ITEMS. */
function nomItem(id, n, court, minuscule){
  const it = ITEMS[id];
  if (!it) return id;
  let t = court ? (n > 1 ? (it.courtP || it.court) : it.court)
                : (n > 1 ? (it.nomP   || it.nom)   : it.nom);
  // un sigle ne se décapitalise pas.
  const sigle = t.length > 1 && t[1] === t[1].toUpperCase() && t[1] !== t[1].toLowerCase();
  return (minuscule && !sigle) ? t.charAt(0).toLowerCase() + t.slice(1) : t;
}

const JOURS = ["lundi","mardi","mercredi","jeudi","vendredi"];

/** Raccourci : l'usine active. */
function U(){ return etat.usines[etat.usineActive]; }

/** Une fonctionnalité est-elle débloquée à l'âge courant ? */
function debloque(cle){
  for (let i=0;i<etat.meta.age;i++) if (AGES[i].debloque.includes(cle)) return true;
  return false;
}

/** Écrit une quantité avec son unité : « 1 200 kg de chips », « 620 sachets ».
 *  Les kilos et les pièces ne se disent pas de la même façon (§3.1). */
function quantiteItem(id, q, court){
  const it = ITEMS[id];
  if (!it) return nb(q);
  if (it.unite === "kg"){
    const arrondi = Math.abs(q) < 10 ? 1 : 0;
    const n = nomItem(id, 2, court, true);
    return nb(q, arrondi) + " kg " + deDe(n) + n;
  }
  return nb(Math.round(q)) + " " + nomItem(id, q, court, true);
}

/** « de » ou « d' » selon l'initiale. Un h muet compte comme une voyelle. */
function deDe(mot){
  return /^[aeiouyéèêàâîïôûùh]/i.test(mot) ? "d'" : "de ";
}

/** Version courte, sans le nom : « 1 200 kg » ou « 620 ». */
function mesure(id, q){
  const it = ITEMS[id];
  if (it && it.unite === "kg") return nb(q, Math.abs(q) < 10 ? 1 : 0) + " kg";
  return nb(Math.round(q));
}

/* ------------------------------------------------------------------- Temps */
function jourCourant(){ return Math.floor(etat.meta.tempsJeu / CONFIG.minutesParJour); }
function minuteDuJour(){ return etat.meta.tempsJeu % CONFIG.minutesParJour; }
function jourSemaine(){ return jourCourant() % CONFIG.joursParSemaine; }        // 0 = lundi
function semaineCourante(){ return Math.floor(jourCourant() / CONFIG.joursParSemaine); }
function texteHeure(){
  const m = minuteDuJour();
  const h = CONFIG.heureDebut + Math.floor(m/60);
  const mn = Math.floor(m%60);
  return h + " h" + (mn ? " " + String(mn).padStart(2,"0") : "");
}
function texteDate(){
  return "Semaine " + (semaineCourante()+1) + " · " +
         JOURS[jourSemaine()].charAt(0).toUpperCase()+JOURS[jourSemaine()].slice(1) +
         " " + texteHeure();
}

function semaineVierge(){
  return { produits:{}, livres:{}, ca:0, depenses:0, pannes:0, retards:0, rebuts:0, faits:[] };

function creerUsine(nom, largeur, hauteur){
  const u = {
    id: 0, nom, largeur, hauteur,
    grille: new Uint16Array(largeur*hauteur),
    machines: [], convoyeurs: [], ouvriers: [],
    stocks: {},
    salete: 0,
    quai: { x:0, y:Math.floor(hauteur/2)-1, l:2, h:3 }
  };
  // Le quai est un obstacle physique : on l'inscrit dans la grille sous l'id 1.
  for (let dy=0; dy<u.quai.h; dy++)
    for (let dx=0; dx<u.quai.l; dx++)
      u.grille[(u.quai.y+dy)*largeur + (u.quai.x+dx)] = 1;
  return u;
}

function creerOuvrier(prenom, nom, competences, salaire, traitId){
  return {
    id: 0,                       // attribué à l'embauche
    prenom, nom,
    x: 2, y: 2, cible: null, chemin: null,
    competences: Object.assign({ lavage:0.5, decoupe:0.5, friture:0.5, assaisonnement:0.5, emballage:0.5 }, competences||{}),
    trait: traitId || "debutant",
    posteAssigne: null,
    charge: null,                // { item, qte }
    tache: null,                 // { type:'porte'|'opere', ... }
    minuteur: 0,
    fatigue: 0, moral: 0.7,
    salaire: salaire || 120,
    anciennete: 0,
    etat: "attend",
    // purement visuel, recalculé : direction et phase de marche
    dir: 0, phase: Math.random()*10
  };
}

/* ------------------------------------------------------ Grille et occupants */
function dansGrille(u,x,y){ return x>=0 && y>=0 && x<u.largeur && y<u.hauteur; }
function occupant(u,x,y){
  if (!dansGrille(u,x,y)) return -1;
  return u.grille[y*u.largeur+x];
}
function poserSurGrille(u, noeud){
  for (let dy=0; dy<noeud.h; dy++)
    for (let dx=0; dx<noeud.l; dx++)
      u.grille[(noeud.y+dy)*u.largeur + (noeud.x+dx)] = noeud.id;
}
function retirerDeGrille(u, noeud){
  for (let dy=0; dy<noeud.h; dy++)
    for (let dx=0; dx<noeud.l; dx++)
      if (u.grille[(noeud.y+dy)*u.largeur + (noeud.x+dx)] === noeud.id)
        u.grille[(noeud.y+dy)*u.largeur + (noeud.x+dx)] = 0;
}

/** Reconstruit l'index id → noeud. À rappeler après toute modification. */
function reindexer(){
  idx.parId.clear();
  idx.noeuds.length = 0;
  for (const u of etat.usines){
    for (const m of u.machines){ idx.parId.set(m.id, m); idx.noeuds.push(m); }
    for (const c of u.convoyeurs) idx.parId.set(c.id, c);
  }
  // Le quai n'est pas un objet posé : on lui donne un pseudo-nœud stable,
  // hors état de jeu, pour que convoyeurs et ouvriers le traitent comme
  // n'importe quel autre nœud.
  idx.quai = noeudQuai(U());
  idx.parId.set(1, idx.quai);
}
function noeudParId(id){ return idx.parId.get(id) || null; }

/** Le quai n'est pas un objet posé : on le représente par un pseudo-noeud. */
function noeudQuai(u){
  return { id:1, type:"quai", quai:true, x:u.quai.x, y:u.quai.y, l:u.quai.l, h:u.quai.h, etat:"produit" };
}
function estQuai(n){ return n && n.id === 1; }

function nouvelId(){ return ++etat.meta.prochainId; }

/* ------------------------------------------------------------------ Stocks */
function stockDe(item){ return U().stocks[item] || 0; }
function ajouterStock(item, qte){
  const u = U();
  u.stocks[item] = (u.stocks[item]||0) + qte;
  if (u.stocks[item] < 1e-6) delete u.stocks[item];
}

/* ---------------------------------------------------------------- Recettes */
function recetteDe(m){ return m.recetteId ? RECETTES[m.recetteId] : null; }
function defDe(m){ return MACHINES[m.type]; }

/** Items qu'un noeud accepte en entrée (pour l'aiguillage automatique). */
function itemsAcceptes(n){
  if (!n) return [];
  if (estQuai(n)) return Object.keys(ITEMS);
  const d = MACHINES[n.type];
  if (d && d.stockage) return Object.keys(ITEMS);
  const r = recetteDe(n);
  return r ? r.entrees.map(e => e.id) : [];
}

/* ============================================================================
   SIMULATION (1/2) — temps, machines, convoyeurs
   Pas fixe, 4 Hz. Le rendu n'écrit jamais dans l'état.
   ========================================================================== */

// Quelle compétence sert sur quelle machine
const COMP_MACHINE = { laveuse:"lavage", trancheuse:"decoupe", friteuse:"friture",
                       tambour:"assaisonnement", ensacheuse:"emballage" };

/** Capacité d'un tampon pour une matière donnée : un sachet ne s'entasse pas
 *  comme un kilo de rondelles. */
function capaciteItem(id, defaut){ return (ITEMS[id] && ITEMS[id].capacite) || defaut; }

/* ---------------------------------------------------- Accès générique aux nœuds
   Un nœud est une machine, une caisse ou le quai. Les convoyeurs et les
   ouvriers manipulent les trois de la même façon. */

function sortieDispo(n, item){
  if (!n) return 0;
  if (estQuai(n)) return U().stocks[item] || 0;
  return n.sortie[item] || 0;
}
function retirerSortie(n, item, q){
  if (estQuai(n)){ ajouterStock(item, -q); return; }
  n.sortie[item] = (n.sortie[item]||0) - q;
  if (n.sortie[item] < 1e-6) delete n.sortie[item];
}
function contenuTotal(o){ let s=0; for (const k in o) s += o[k]; return s; }

/** Combien d'unités de `item` ce nœud peut-il encore recevoir ? */
function placeEntree(n, item){
  if (!n) return 0;
  if (estQuai(n)) return 1e9;
  const d = MACHINES[n.type];
  if (d.stockage) return Math.max(0, d.capacite - contenuTotal(n.sortie));
  const r = recetteDe(n);
  if (!r || !r.entrees.some(e => e.id === item)) return 0;
  return Math.max(0, capaciteItem(item, CONFIG.capaciteEntree) - (n.entree[item]||0));
}
function livrer(n, item, q){
  if (estQuai(n)){ ajouterStock(item, q); return; }
  const d = MACHINES[n.type];
  if (d.stockage) n.sortie[item] = (n.sortie[item]||0) + q;
  else n.entree[item] = (n.entree[item]||0) + q;
}
/** Reste-t-il de la place en sortie pour un cycle complet ? */
function placeSortie(n, item, q){
  const d = MACHINES[n.type];
  const cap = d.stockage ? d.capacite : capaciteItem(item, CONFIG.capaciteSortie);
  const total = d.stockage ? contenuTotal(n.sortie) : (n.sortie[item]||0);
  return total + q <= cap;
}

/* --------------------------------------------------------------- Facteurs */
function ouvrierParId(id){
  const os = U().ouvriers;
  for (let i=0;i<os.length;i++) if (os[i].id === id) return os[i];
  return null;
}
function traitDe(o){ return TRAITS.find(t => t.id === o.trait) || TRAITS[0]; }

function facteurOperateur(o, machine){
  const comp = o.competences[COMP_MACHINE[machine.type]] ?? 0.5;
  return (0.6 + 0.7*comp) * traitDe(o).vitesse;
}
function facteurUsure(m){ return 1 - 0.35*clamp(m.usure,0,1); }
function facteurMoral(o){ return (0.8 + 0.35*clamp(o.moral,0,1)) * (1 - 0.15*clamp(o.fatigue,0,1)); }

/* ------------------------------------------------------------- Une machine */
function creerMachine(type, x, y, rotation){
  const d = MACHINES[type];
  const tourne = rotation % 2 === 1;
  return {
    id: nouvelId(), type, x, y, rotation: rotation||0,
    l: tourne ? d.h : d.l,
    h: tourne ? d.l : d.h,
    recetteId: d.recettes[0] || null,
    progression: 0, enCycle: false,
    entree: {}, sortie: {},
    usure: 0, enPanne: false,
    operateurId: null,
    debitReel: 0,
    produitAujourdhui: 0,
    etat: "arret",
    minuteBloquee: 0,
    flash: 0            // purement visuel, remis à zéro par le rendu
  };
}

function simMachine(m, dt){
  const d = MACHINES[m.type];
  if (d.stockage){ m.etat = "produit"; m.debitReel = 0; return; }

  const r = recetteDe(m);
  if (!r){ m.etat = "arret"; m.debitReel = 0; return; }

  if (m.enPanne){ m.etat = "panne"; m.debitReel = 0; m.minuteBloquee += dt; return; }

  // Opérateur : les machines manuelles ne tournent pas toutes seules.
  let op = null, fOp = 1, fMoral = 1;
  if (!d.auto){
    op = (m.operateurId != null) ? ouvrierParId(m.operateurId) : null;
    if (!op || !op.tache || op.tache.type !== "opere" || op.tache.machineId !== m.id){
      m.operateurId = null;
      m.etat = "sans_operateur"; m.debitReel = 0; m.minuteBloquee += dt;
      return;
    }
    fOp = facteurOperateur(op, m);
    fMoral = facteurMoral(op);
  }

  // Démarrage d'un cycle : on réserve les entrées tout de suite.
  if (!m.enCycle){
    if (!placeSortie(m, r.sortie.id, r.sortie.qte)){
      m.etat = "sortie_pleine"; m.debitReel = 0; m.minuteBloquee += dt; return;
    }
    let manque = false;
    for (const e of r.entrees) if ((m.entree[e.id]||0) < e.qte - 1e-9) manque = true;
    if (manque){
      m.etat = "attente_matiere"; m.debitReel = 0; m.minuteBloquee += dt; return;
    }
    for (const e of r.entrees){
      m.entree[e.id] -= e.qte;
      if (m.entree[e.id] < 1e-6) delete m.entree[e.id];
    }
    m.enCycle = true;
    m.progression = 0;
  }

  const v = fOp * facteurUsure(m) * fMoral;
  m.progression += (dt * v) / r.duree;
  m.etat = "produit";
  m.minuteBloquee = 0;
  // Débit affiché : toujours par jour, jamais par seconde (§3.1)
  m.debitReel = (v / r.duree) * r.sortie.qte * CONFIG.minutesParJour;

  // Usure proportionnelle à la charge
  m.usure = clamp(m.usure + d.usureParJour * (dt / CONFIG.minutesParJour), 0, 1);

  if (m.progression >= 1){
    m.progression = 0;
    m.enCycle = false;
    m.sortie[r.sortie.id] = (m.sortie[r.sortie.id]||0) + r.sortie.qte;
    m.produitAujourdhui += r.sortie.qte;
    compter(etat.progression.produits, r.sortie.id, r.sortie.qte);
    compter(etat.progression.produitsSemaine, r.sortie.id, r.sortie.qte);
    compter(etat.stats.semaineCourante.produits, r.sortie.id, r.sortie.qte);
    m.flash = 1;
    if (op){ op.fatigue = clamp(op.fatigue + 0.012, 0, 1); gagnerCompetence(op, m); }
    effetProduction(m, r);
  }

  // Pannes : à partir de l'âge 2, une machine usée finit par lâcher.
  if (etat.meta.age >= 2 && m.usure > 0.6){
    const p = (m.usure - 0.6) * 0.0016 * dt;
    if (Math.random() < p) declencherPanne(m);
  }
}

function gagnerCompetence(o, m){
  const c = COMP_MACHINE[m.type];
  if (!c) return;
  o.competences[c] = clamp((o.competences[c]||0.5) + 0.0012, 0, 1);
}

function declencherPanne(m){
  m.enPanne = true;
  m.enCycle = false;
  m.progression = 0;
  etat.stats.semaineCourante.pannes++;
  notif("Panne", MACHINES[m.type].nom + " s'est arrêtée. Un clic dessus pour la remettre en route.", "ko");
  son("panne");
  vue.secousse = 6;
  for (let i=0;i<12;i++) particule(m.x+m.l/2, m.y+m.h/2, "fumeeNoire");
  paroleContexte("panne", { machine: MACHINES[m.type].nom });
}

function reparerMachine(m){
  const cout = Math.round(MACHINES[m.type].cout * 0.12);
  if (etat.finances.solde < cout && etat.finances.solde < CONFIG.decouvertMax){
    notif("Impossible", "Pas assez d'argent pour la réparation.", "ko"); return;
  }
  depenser(cout, "reparation");
  m.enPanne = false;
  m.usure = Math.max(0.1, m.usure - 0.35);
  notif("Réparée", MACHINES[m.type].nom + " repart. " + euros(cout) + " de pièces.", "ok");
  son("cle");
}

function reviserMachine(m){
  const cout = Math.round(MACHINES[m.type].cout * 0.2);
  if (etat.finances.solde - cout < CONFIG.faillite){
    notif("Impossible", "La caisse ne suit pas.", "ko"); return;
  }
  depenser(cout, "revision");
  m.usure = 0.1;
  m.enPanne = false;
  notif("Révisée", MACHINES[m.type].nom + " est comme neuve. " + euros(cout) + ".", "ok");
  son("cle");
}

/* ------------------------------------------------------------ Convoyeurs */
const CONV = {
  coutParTuile: 45,
  debitMax: 6,        // unités par minute de jeu
  vitesse: 0.5        // tuiles par minute de jeu
};

function creerConvoyeur(chemin, source, destination){
  return {
    id: nouvelId(), type:"convoyeur",
    chemin: chemin.map(p => ({x:p.x, y:p.y})),
    source, destination,
    debitMax: CONV.debitMax,
    debitActuel: 0,
    latence: Math.max(0.5, chemin.length / CONV.vitesse),
    transit: [],        // [{item, qte, t}] — t = minutes restantes
    etat: "produit"
  };
}

function simConvoyeur(c, dt){
  const src = noeudParId(c.source);
  const dst = noeudParId(c.destination);

  // 1. Avancement de ce qui est déjà sur la bande.
  let livrable = 0;
  for (let i=0; i<c.transit.length; i++){
    const p = c.transit[i];
    if (p.t > 0) p.t = Math.max(0, p.t - dt);
  }
  // 2. Déchargement en bout de bande (dans l'ordre d'arrivée).
  while (c.transit.length && c.transit[0].t <= 0){
    const p = c.transit[0];
    const place = dst ? placeEntree(dst, p.item) : 0;
    if (place <= 1e-6) break;                 // bouchon : ça s'entasse au bout
    const q = Math.min(p.qte, place);
    livrer(dst, p.item, q);
    p.qte -= q;
    livrable += q;
    if (p.qte <= 1e-6) c.transit.shift(); else break;
  }

  // 3. Chargement en tête de bande.
  c.debitActuel = 0;
  if (!src || !dst){ c.etat = "non_relie"; return; }

  const souhaites = itemsAcceptes(dst);
  let budget = c.debitMax * dt;
  let charge = 0;

  // Le quai et les caisses fournissent ce dont l'aval a besoin ; une machine
  // pousse simplement ce qu'elle a produit.
  let candidats;
  if (estQuai(src) || MACHINES[src.type]?.stockage){
    candidats = souhaites.filter(it => sortieDispo(src, it) > 1e-6 && placeEntree(dst, it) > 1e-6);
    // on sert d'abord ce qui manque le plus à l'aval
    candidats.sort((a,b) => manqueRelatif(dst,a) - manqueRelatif(dst,b));
  } else {
    candidats = Object.keys(src.sortie).filter(it => src.sortie[it] > 1e-6);
  }

  for (const it of candidats){
    if (budget <= 1e-6) break;
    const place = placeEntree(dst, it);
    if (place <= 1e-6) continue;
    const q = Math.min(budget, sortieDispo(src, it), place + 40); // on tolère un peu de file
    if (q <= 1e-6) continue;
    retirerSortie(src, it, q);
    // fusion avec le dernier colis si l'écart de position est négligeable
    const dernier = c.transit[c.transit.length-1];
    if (dernier && dernier.item === it && c.latence - dernier.t < dt*0.5) dernier.qte += q;
    else c.transit.push({ item:it, qte:q, t:c.latence });
    budget -= q;
    charge += q;
  }

  c.debitActuel = (charge / dt) * CONFIG.minutesParJour;   // par jour, pour l'affichage
  c.etat = c.transit.length && c.transit[0].t <= 0 ? "sortie_pleine"
         : (charge > 0 ? "produit" : "attente_matiere");
}

/** 0 = vide, 1 = plein : sert à choisir quoi envoyer en priorité. */
function manqueRelatif(n, item){
  if (estQuai(n)) return 1;
  const d = MACHINES[n.type];
  if (d.stockage) return contenuTotal(n.sortie) / d.capacite;
  return (n.entree[item]||0) / capaciteItem(item, CONFIG.capaciteEntree);
}

/** Ce qu'un convoyeur donné est capable d'apporter à son aval : une machine
 *  ne pousse que ce qu'elle fabrique, un quai ou une caisse peut tout fournir. */
function itemsPortes(src, dst){
  if (estQuai(src) || MACHINES[src.type]?.stockage) return itemsAcceptes(dst);
  const r = recetteDe(src);
  return r ? [r.sortie.id] : [];
}

/** Un besoin d'entrée est-il déjà couvert par un convoyeur en état de marche ?
 *  Sinon les ouvriers s'en chargent à la main. Attention : un convoyeur qui
 *  amène les cadres ne dispense pas d'apporter la peinture. */
function recalculerBesoinsServis(){
  idx.besoinsServis.clear();
  for (const c of U().convoyeurs){
    if (c.etat === "non_relie") continue;
    const dst = noeudParId(c.destination);
    const src = noeudParId(c.source);
    if (!dst || !src) continue;
    for (const it of itemsPortes(src, dst)) idx.besoinsServis.add(dst.id + ":" + it);
  }
}

/** Le convoyeur évacue-t-il déjà la sortie de ce nœud ? */
function sortieEvacuee(n){
  for (const c of U().convoyeurs)
    if (c.source === n.id && c.etat !== "non_relie") return true;
  return false;
}

/* ============================================================================
   SIMULATION (2/2) — ouvriers, temps, argent, commandes, marché, progression
   ========================================================================== */

function compter(o, k, v){ o[k] = (o[k]||0) + v; }

/* ------------------------------------------------- Déplacement sur la grille */
function traversable(u, x, y){
  const o = occupant(u,x,y);
  if (o === -1) return false;
  if (o === 0) return true;
  const n = noeudParId(o);
  return !!(n && n.type === "convoyeur");     // on marche sur les convoyeurs
}

/** A* simplifié. Grilles petites, appels rares : pas besoin de tas binaire. */
function cheminVers(u, sx, sy, tx, ty){
  if (sx === tx && sy === ty) return [];
  const L = u.largeur, H = u.hauteur;
  const dep = sy*L+sx, arr = ty*L+tx;
  if (!traversable(u,tx,ty)) return null;

  const ouvert = [dep];
  const vientDe = new Map();
  const g = new Map([[dep,0]]);
  const f = new Map([[dep, Math.abs(tx-sx)+Math.abs(ty-sy)]]);
  const clos = new Set();
  let garde = 0;

  while (ouvert.length && garde++ < 4000){
    let bi = 0;
    for (let i=1;i<ouvert.length;i++) if ((f.get(ouvert[i])||1e9) < (f.get(ouvert[bi])||1e9)) bi = i;
    const cur = ouvert.splice(bi,1)[0];
    if (cur === arr){
      const chemin = [];
      let c = cur;
      while (c !== dep){ chemin.push({ x:c%L, y:Math.floor(c/L) }); c = vientDe.get(c); }
      chemin.reverse();
      return chemin;
    }
    clos.add(cur);
    const cx = cur%L, cy = Math.floor(cur/L);
    for (let d=0; d<4; d++){
      const nx = cx + (d===0?1:d===1?-1:0), ny = cy + (d===2?1:d===3?-1:0);
      if (!dansGrille(u,nx,ny)) continue;
      const ni = ny*L+nx;
      if (clos.has(ni) || !traversable(u,nx,ny)) continue;
      const ng = (g.get(cur)||0) + 1;
      if (ng < (g.get(ni) ?? 1e9)){
        vientDe.set(ni,cur); g.set(ni,ng);
        f.set(ni, ng + Math.abs(tx-nx) + Math.abs(ty-ny));
        if (!ouvert.includes(ni)) ouvert.push(ni);
      }
    }
  }
  return null;
}

/** Tuile libre au contact d'un nœud, la plus proche de (px,py). */
function tuileAcces(u, n, px, py){
  let best = null, bd = 1e9;
  for (let dy=-1; dy<=n.h; dy++){
    for (let dx=-1; dx<=n.l; dx++){
      const bordX = dx === -1 || dx === n.l;
      const bordY = dy === -1 || dy === n.h;
      if (bordX === bordY) continue;                     // pas les diagonales
      const x = n.x+dx, y = n.y+dy;
      if (!traversable(u,x,y)) continue;
      const d = (x-px)*(x-px) + (y-py)*(y-py);
      if (d < bd){ bd = d; best = {x,y}; }
    }
  }
  return best;
}

function envoyerVers(o, tx, ty){
  const u = U();
  const ch = cheminVers(u, Math.round(o.x-0.5), Math.round(o.y-0.5), tx, ty);
  o.chemin = ch;                       // null = pas de route
  o.cible = { x:tx, y:ty };
  return ch !== null;
}

/** Avance l'ouvrier le long de son chemin. Renvoie true à l'arrivée. */
function avancer(o, dt){
  if (!o.chemin) return true;
  if (!o.chemin.length){ o.cible = null; return true; }
  let reste = CONFIG.vitesseOuvrier * dt * (1 - 0.2*o.fatigue) * (o.etat === "porte" ? 0.9 : 1);
  while (reste > 0 && o.chemin.length){
    const p = o.chemin[0];
    const cx = p.x + 0.5, cy = p.y + 0.5;
    const dx = cx - o.x, dy = cy - o.y;
    const d = Math.hypot(dx,dy);
    if (d < 1e-4){ o.chemin.shift(); continue; }
    if (Math.abs(dx) > Math.abs(dy)) o.dir = dx > 0 ? 1 : 3; else o.dir = dy > 0 ? 2 : 0;
    if (d <= reste){ o.x = cx; o.y = cy; reste -= d; o.chemin.shift(); }
    else { o.x += dx/d*reste; o.y += dy/d*reste; reste = 0; }
    o.phase += 0.9;
  }
  if (!o.chemin.length){ o.cible = null; return true; }
  return false;
}

/* ------------------------------------------------------ Choix d'une tâche */

/** Tâches déjà prises par d'autres, pour éviter que deux ouvriers se doublent. */
function reservations(){
  const r = new Set();
  for (const o of U().ouvriers)
    if (o.tache && o.tache.type === "porte") r.add(o.tache.cibleId + ":" + o.tache.item);
  return r;
}

function listerSources(item, exclureId){
  const u = U(), out = [];
  if ((u.stocks[item]||0) > 0.5) out.push(noeudParId(1));
  for (const m of u.machines){
    if (m.id === exclureId) continue;
    if ((m.sortie[item]||0) > 0.5) out.push(m);
  }
  return out;
}

function meilleurTransport(o){
  const u = U(), res = reservations();
  let best = null, bs = -1e9;

  // a) alimenter les machines qui ont faim
  for (const m of u.machines){
    const r = recetteDe(m);
    if (!r) continue;
    for (const e of r.entrees){
      if (idx.besoinsServis.has(m.id + ":" + e.id)) continue;    // un convoyeur s'en charge
      if (res.has(m.id + ":" + e.id)) continue;
      const dispo = m.entree[e.id]||0;
      const voulu = e.qte * 6;
      if (dispo >= voulu) continue;
      const sources = listerSources(e.id, m.id);
      if (!sources.length) continue;
      for (const s of sources){
        const acces = tuileAcces(u, s, o.x, o.y);
        if (!acces) continue;
        const dist = Math.hypot(acces.x-o.x, acces.y-o.y) + Math.hypot(s.x-m.x, s.y-m.y);
        const urgence = 1 - dispo/voulu;
        const score = 10*urgence + (m.id === o.posteAssigne ? 6 : 0) - dist*0.22;
        if (score > bs){
          bs = score;
          best = { type:"porte", item:e.id, sourceId:s.id, cibleId:m.id, phase:"vers_source" };
        }
      }
    }
  }

  // b) évacuer ce qui s'entasse (produits finis vers le quai, pièces vers une caisse)
  for (const m of u.machines){
    if (MACHINES[m.type].stockage) continue;
    if (sortieEvacuee(m)) continue;
    for (const it in m.sortie){
      const q = m.sortie[it];
      if (q < 1) continue;
      const estProduit = ITEMS[it].cat === "produit";
      const remplissage = q / capaciteItem(it, CONFIG.capaciteSortie);
      if (!estProduit && remplissage < 0.45) continue;
      // destination : le quai pour un produit fini, sinon une caisse qui a de la place
      let dest = null;
      if (estProduit) dest = noeudParId(1);
      else {
        for (const c of u.machines)
          if (MACHINES[c.type].stockage && placeEntree(c, it) > 2){ dest = c; break; }
        if (!dest && remplissage > 0.9) dest = noeudParId(1);
      }
      if (!dest || res.has(dest.id + ":" + it)) continue;
      const acces = tuileAcces(u, m, o.x, o.y);
      if (!acces) continue;
      const dist = Math.hypot(acces.x-o.x, acces.y-o.y);
      const score = (estProduit ? 8.5 : 4) + 5*remplissage - dist*0.22;
      if (score > bs){
        bs = score;
        best = { type:"porte", item:it, sourceId:m.id, cibleId:dest.id, phase:"vers_source" };
      }
    }
  }
  return best ? { tache:best, score:bs } : null;
}

function machinePeutTourner(m){
  const r = recetteDe(m);
  if (!r || m.enPanne) return false;
  if (!placeSortie(m, r.sortie.id, r.sortie.qte)) return false;
  if (m.enCycle) return true;
  for (const e of r.entrees) if ((m.entree[e.id]||0) < e.qte - 1e-9) return false;
  return true;
}

function meilleureMachineAOperer(o){
  const u = U();
  let best = null, bs = -1e9;
  for (const m of u.machines){
    const d = MACHINES[m.type];
    if (d.auto || d.stockage || m.enPanne) continue;
    if (m.operateurId && m.operateurId !== o.id) continue;
    if (!machinePeutTourner(m)) continue;
    const acces = tuileAcces(u, m, o.x, o.y);
    if (!acces) continue;
    const dist = Math.hypot(acces.x-o.x, acces.y-o.y);
    const comp = o.competences[COMP_MACHINE[m.type]] ?? 0.5;
    // Produire dans un tampon déjà plein ne sert à rien : ça compte contre.
    const encombre = contenuTotal(m.sortie) / CONFIG.capaciteSortie;
    let score = 7 + 3*comp - dist*0.22 - 6*clamp(encombre,0,1);
    if (o.posteAssigne === m.id) score += 12;
    else if (o.posteAssigne) score -= 8;                    // il a un poste, il y reste
    if (score > bs){ bs = score; best = m; }
  }
  return best ? { machine:best, score:bs } : null;
}

/* ---------------------------------------------------------- Un ouvrier, un tick */
function simOuvrier(o, dt){
  o.fatigue = clamp(o.fatigue + dt/CONFIG.minutesParJour * 0.55 * (1/(traitDe(o).fatigue||1)), 0, 1);
  o.minuteur -= dt;

  // Coup de barre
  if (o.etat === "pause"){
    o.fatigue = clamp(o.fatigue - dt*0.008, 0, 1);
    if (o.minuteur <= 0) o.etat = "attend";
    return;
  }
  if (o.fatigue > 0.93 && (!o.tache || o.tache.type !== "porte")){
    libererTache(o);
    o.etat = "pause"; o.minuteur = 25;
    return;
  }

  if (!o.tache) choisirTache(o);
  if (!o.tache){ flaner(o, dt); return; }

  if (o.tache.type === "porte") tachePorte(o, dt);
  else tacheOpere(o, dt);
}

function choisirTache(o){
  const t = meilleurTransport(o);
  const m = meilleureMachineAOperer(o);
  if (t && (!m || t.score >= m.score)){
    o.tache = t.tache;
    const src = noeudParId(o.tache.sourceId);
    const acc = src ? tuileAcces(U(), src, o.x, o.y) : null;
    if (!acc || !envoyerVers(o, acc.x, acc.y)){ o.tache = null; return; }
    o.etat = "deplace";
  } else if (m){
    const acc = tuileAcces(U(), m.machine, o.x, o.y);
    if (!acc || !envoyerVers(o, acc.x, acc.y)) return;
    o.tache = { type:"opere", machineId:m.machine.id, phase:"vers_poste" };
    o.etat = "deplace";
  }
}

function libererTache(o){
  if (o.tache && o.tache.type === "opere"){
    const m = noeudParId(o.tache.machineId);
    if (m && m.operateurId === o.id) m.operateurId = null;
  }
  o.tache = null; o.chemin = null; o.cible = null;
  if (o.etat !== "pause") o.etat = "attend";
}

function tachePorte(o, dt){
  const u = U();
  const src = noeudParId(o.tache.sourceId);
  const cib = noeudParId(o.tache.cibleId);
  if (!src || !cib){ deposerAuQuai(o); libererTache(o); return; }

  if (o.tache.phase === "vers_source"){
    o.etat = o.charge ? "porte" : "deplace";
    if (avancer(o, dt)){
      const place = placeEntree(cib, o.tache.item);
      const q = Math.min(ITEMS[o.tache.item].portee, sortieDispo(src, o.tache.item), Math.max(place, 0));
      if (q < 0.5){ libererTache(o); return; }
      retirerSortie(src, o.tache.item, q);
      o.charge = { item:o.tache.item, qte:q };
      o.tache.phase = "vers_cible";
      const acc = tuileAcces(u, cib, o.x, o.y);
      if (!acc || !envoyerVers(o, acc.x, acc.y)){ deposerAuQuai(o); libererTache(o); return; }
      o.etat = "porte";
      son("prise");
    }
  } else {
    o.etat = "porte";
    if (avancer(o, dt)){
      if (o.charge){
        const place = placeEntree(cib, o.charge.item);
        const q = Math.min(o.charge.qte, place);
        if (q > 0){ livrer(cib, o.charge.item, q); o.charge.qte -= q; }
        if (o.charge.qte > 0.5){
          // ça ne rentre pas : on repose au quai
          deposerAuQuai(o);
        } else o.charge = null;
        if (estQuai(cib)) son("depot");
      }
      libererTache(o);
    }
  }
}

function deposerAuQuai(o){
  if (!o.charge) return;
  ajouterStock(o.charge.item, o.charge.qte);
  o.charge = null;
}

function tacheOpere(o, dt){
  const m = noeudParId(o.tache.machineId);
  if (!m || m.enPanne){ libererTache(o); return; }

  if (o.tache.phase === "vers_poste"){
    o.etat = "deplace";
    if (avancer(o, dt)){
      if (m.operateurId && m.operateurId !== o.id){ libererTache(o); return; }
      m.operateurId = o.id;
      o.tache.phase = "poste";
      o.minuteur = 18;                     // durée minimale d'un poste, évite le zapping
      o.etat = "travaille";
    }
    return;
  }

  o.etat = "travaille";
  m.operateurId = o.id;

  // La machine ne peut plus tourner et ça dure : on va voir ailleurs.
  if (m.etat !== "produit" && o.minuteur <= 0 && m.minuteBloquee > 12){ libererTache(o); return; }

  // Fin de vacation : on relève la tête. Si un poste en aval crie famine
  // pendant qu'on produit tranquillement, on lâche la machine et on va porter.
  if (o.minuteur <= 0){
    o.minuteur = 12;                       // on ne se repose pas la question à chaque tick
    const comp = o.competences[COMP_MACHINE[m.type]] ?? 0.5;
    const encombre = contenuTotal(m.sortie) / CONFIG.capaciteSortie;
    const scoreIci = 7 + 3*comp - 6*clamp(encombre,0,1) + (o.posteAssigne === m.id ? 12 : 0);
    const t = meilleurTransport(o);
    if (t && t.score > scoreIci + 2) libererTache(o);
  }
}

function flaner(o, dt){
  o.etat = "attend";
  if (o.chemin && o.chemin.length){ avancer(o, dt); return; }
  if (Math.random() < 0.02){
    const u = U();
    for (let i=0;i<8;i++){
      const x = hasardInt(0,u.largeur-1), y = hasardInt(0,u.hauteur-1);
      if (traversable(u,x,y)){ envoyerVers(o,x,y); break; }
    }
  }
}

/* ==========================================================================
   Le tick de simulation
   ========================================================================== */
function simTick(){
  const dt = CONFIG.minutesParTick;
  const u = U();

  etat.meta.tempsJeu += dt;

  for (const m of u.machines) simMachine(m, dt);
  for (const c of u.convoyeurs) simConvoyeur(c, dt);
  recalculerBesoinsServis();
  for (const o of u.ouvriers) simOuvrier(o, dt);

  // Fin de journée
  const j = jourCourant();
  if (j !== etat.meta.dernierJourTraite){
    if (etat.meta.dernierJourTraite >= 0) finJournee();
    etat.meta.dernierJourTraite = j;
    debutJournee();
  }
}

/* ------------------------------------------------------------- Journées */
function debutJournee(){
  const u = U();
  for (const o of u.ouvriers){ o.fatigue = 0.08; o.anciennete++; }
  for (const m of u.machines) m.produitAujourdhui = 0;
  majMarche();
  reapprovisionner();
}

function finJournee(){
  const u = U();

  // 1. Livraisons du jour, puis vente du surplus aux commerces du coin
  livrerContrats();
  vendreSurplus();

  // 2. Charges
  let salaires = 0;
  for (const o of u.ouvriers) salaires += o.salaire;
  const loyer = CONFIG.loyerParJour[etat.meta.age-1];
  const energie = u.machines.length * CONFIG.energieParMachineJour;
  depenser(salaires, "salaires");
  depenser(loyer, "loyer");
  depenser(energie, "energie");
  etat.finances.totalSalaires += salaires;

  // 3. Emprunts
  for (const e of etat.finances.emprunts){
    if (e.restant <= 0) continue;
    const m = Math.min(e.mensualite, e.restant);
    depenser(m, "emprunt");
    e.restant -= m;
  }
  etat.finances.emprunts = etat.finances.emprunts.filter(e => e.restant > 0.5);

  // 4. Retards de commande
  for (const c of etat.contrats.acceptes){
    if (c.livre >= c.quantite) continue;
    if (jourCourant() > c.dateLimite){
      depenser(c.penaliteRetard, "penalite");
      c.joursRetard = (c.joursRetard||0) + 1;
      etat.stats.semaineCourante.retards++;
      if (c.joursRetard === 1){
        notif("Retard", c.client + " attend toujours " + quantiteItem(c.produitId, c.quantite-c.livre, true) + ". " + euros(c.penaliteRetard) + " par jour.", "ko");
        etat.reputation = clamp(etat.reputation - 3, 0, 100);
        paroleContexte("retard", { client:c.client });
      }
      if (c.joursRetard > 6) annulerContrat(c);
    }
  }

  // 5. Moral, saleté, usure du décor
  majMoral();
  u.salete = clamp(u.salete + 0.012 + u.machines.length*0.0015, 0, 1);

  // 6. Rupture de matière : le joueur ne doit pas la découvrir en voyant
  //    ses machines à l'arrêt (§3.2 — le problème s'annonce).
  alerterRupture();

  // 7. État de la caisse
  verifierFaillite();

  // 8. Objectif
  verifierObjectif();

  // 9. Vendredi soir : on arrête tout et on décide.
  if (jourSemaine() === 0 && jourCourant() > 0) finSemaine();
  else majBandeau();
}

/** Ce que l'atelier consomme d'une matière en une journée pleine : sert à
 *  prévenir avant la rupture, pas après. */
function uneJourneeDe(id){
  let parJour = 0;
  for (const m of U().machines){
    const r = recetteDe(m);
    if (!r) continue;
    for (const e of r.entrees)
      if (e.id === id) parJour += e.qte * (CONFIG.minutesParJour / r.duree) * 0.3;
  }
  return Math.max(5, parJour * 0.5);
}

/** Prévient quand une matière achetée va manquer, une fois par jour au plus. */
function alerterRupture(){
  const u = U();
  const besoins = new Set();
  for (const m of u.machines){
    const r = recetteDe(m);
    if (!r) continue;
    for (const e of r.entrees) if (ITEMS[e.id].achat) besoins.add(e.id);
  }
  const court = [];
  for (const id of besoins) if (stockDe(id) < uneJourneeDe(id)) court.push(id);
  if (!court.length) return;
  const noms = court.map(id => nomItem(id, 2, true, true)).join(", ");
  notif("Bientôt à court", "Il ne reste presque plus " + deDe(noms) + noms + ". Onglet Stocks pour en recommander.", "att");
  if (court.some(id => stockDe(id) < 1))
    parle("On n'a plus " + deDe(noms) + noms + ", patron. Les machines vont s'arrêter.", 11000);
}

function majMoral(){
  const u = U();
  const salaireMoyen = u.ouvriers.reduce((s,o)=>s+o.salaire,0) / Math.max(1,u.ouvriers.length);
  for (const o of u.ouvriers){
    let cible = 0.55;
    cible += clamp((o.salaire - salaireMoyen)/120, -0.15, 0.15);
    cible += (o.salaire >= 130 ? 0.12 : 0) + traitDe(o).moral;
    cible -= u.salete * 0.25;
    cible -= o.fatigue * 0.12;
    if (etat.finances.solde < 0) cible -= 0.1;
    o.moral = clamp(lerp(o.moral, clamp(cible,0,1), 0.25), 0, 1);
    if (o.moral < 0.2 && Math.random() < 0.15){
      notif("Démission", o.prenom + " " + o.nom + " s'en va. « Ça n'allait plus. »", "ko");
      u.ouvriers.splice(u.ouvriers.indexOf(o),1);
      etat.reputation = clamp(etat.reputation-1,0,100);
    }
  }
}

/* ------------------------------------------------------------- Argent */
function depenser(n, motif){
  if (n <= 0) return;
  etat.finances.solde -= n;
  etat.stats.semaineCourante.depenses += n;
  if (motif === "achat") etat.finances.totalAchats += n;
}
function encaisser(n, motif){
  if (n <= 0) return;
  etat.finances.solde += n;
  etat.stats.semaineCourante.ca += n;
  if (motif === "vente") etat.finances.totalVentes += n;
}

function verifierFaillite(){
  const s = etat.finances.solde;
  if (s < CONFIG.faillite){ finDePartie(); return; }
  if (s < CONFIG.decouvertMax){
    const u = U();
    const vendables = u.machines.filter(m => !MACHINES[m.type].stockage);
    if (vendables.length){
      vendables.sort((a,b)=>MACHINES[b.type].cout - MACHINES[a.type].cout);
      const m = vendables[0];
      const prix = Math.round(MACHINES[m.type].cout * 0.5);
      demolir(m, prix);
      notif("La banque a tranché", "Découvert trop lourd : " + MACHINES[m.type].nom + " a été revendue " + euros(prix) + ".", "ko");
      paroleContexte("banque", {});
    }
  }
}

/* ------------------------------------------------------------- Marché */
function initMarche(){
  for (const id in ITEMS){
    const it = ITEMS[id];
    if (!it.achat) continue;
    etat.marche.prix[id] = it.achat;
    etat.marche.tendances[id] = hasard(-0.4,0.4);
  }
}
function majMarche(){
  const j = jourCourant();
  if (etat.marche.dernierJour === j) return;
  etat.marche.dernierJour = j;
  for (const id in ITEMS){
    const it = ITEMS[id];
    if (!it.achat) continue;
    if (Math.random() < 0.09) etat.marche.tendances[id] = hasard(-0.5,0.5);
    const t = etat.marche.tendances[id];
    let p = etat.marche.prix[id] * (1 + t*0.012 + hasard(-0.02,0.02));
    p = clamp(p, it.achat*0.75, it.achat*1.25);
    etat.marche.prix[id] = p;
  }
}
function prixAchat(id){ return etat.marche.prix[id] ?? ITEMS[id].achat ?? 0; }

function acheter(id, qte){
  const it = ITEMS[id];
  const prix = prixAchat(id) * qte;
  if (etat.finances.solde - prix < CONFIG.faillite){
    notif("Refusé", "La caisse ne suit pas.", "ko"); return false;
  }
  depenser(prix, "achat");
  ajouterStock(id, qte);
  son("argent");
  flottant(U().quai.x+1, U().quai.y+1, "−" + Math.round(prix) + " €", "#e0574a");
  notif("Livraison", quantiteItem(id, qte, true) + " pour " + euros(prix) + ".", "");
  tutoEvenement("achat");
  return true;
}

function reapprovisionner(){
  if (!debloque("reappro")) return;
  for (const id in etat.reappro){
    const r = etat.reappro[id];
    if (!r.actif) continue;
    if (stockDe(id) < r.seuil) acheter(id, r.lot);
  }
}

function vendreComptant(id, qte){
  const it = ITEMS[id];
  if (!it.vente) return;
  qte = Math.min(Math.floor(qte), Math.floor(stockDe(id)));
  if (qte < 1) return;
  const prix = it.vente * 0.88 * qte;
  ajouterStock(id, -qte);
  encaisser(prix, "vente");
  compter(etat.progression.vendus, id, qte);
  compter(etat.stats.semaineCourante.livres, id, qte);
  son("argent");
  flottant(U().quai.x+1, U().quai.y+1, "+" + Math.round(prix) + " €", "#5cba6b");
  notif("Vendu", quantiteItem(id, qte, true) + " au comptant : " + euros(prix) + ".", "ok");
}

/* ------------------------------------------------------------- Commandes */

function capaciteHebdoEstimee(produitId){
  // Ce que l'atelier a réellement sorti la semaine passée, sinon une estimation
  // à partir du poste le plus lent de la chaîne.
  const h = etat.stats.historiqueSemaines;
  for (let i=h.length-1; i>=Math.max(0,h.length-3); i--){
    const q = h[i].produits[produitId] || 0;
    if (q > 0) return q;
  }
  // Sinon : le poste qui sort ce produit, à cadence réduite par le portage.
  const u = U();
  const r = Object.values(RECETTES).find(x => x.sortie.id === produitId);
  if (!r) return 10;
  const postes = u.machines.filter(m => m.type === r.machine).length;
  const parJour = postes * r.sortie.qte * (CONFIG.minutesParJour / r.duree) * 0.42;
  return Math.max(ITEMS[produitId].unite === "kg" ? 30 : 200, Math.round(parJour * CONFIG.joursParSemaine));
}

function creerContrat(produitId){
  const dispo = CLIENTS.filter(c => c.ageMin <= etat.meta.age);
  const cl = choix(dispo);
  const cap = capaciteHebdoEstimee(produitId);
  const semaines = hasardInt(1,3);
  const facteur = hasard(0.5, 1.35);
  // On arrondit à quelque chose qu'un client dirait vraiment : 250 kg, 4 000 sachets.
  const brut = Math.max(5, cap * semaines * facteur);
  const pas = ITEMS[produitId].unite === "kg" ? (brut > 800 ? 100 : 25) : (brut > 4000 ? 500 : 100);
  const quantite = Math.max(pas, Math.round(brut / pas) * pas);
  const base = ITEMS[produitId].vente;
  const prixUnitaire = Math.round(base * cl.marge * (0.9 + etat.reputation/100*0.18) * hasard(0.97,1.06));
  return {
    id: nouvelId(),
    client: cl.nom, ton: cl.ton,
    produitId, quantite, livre:0,
    prixUnitaire,
    dateLimite: jourCourant() + semaines*CONFIG.joursParSemaine,
    penaliteRetard: Math.max(30, Math.round(prixUnitaire*quantite*0.012)),
    reputationRequise: 0,
    joursRetard: 0,
    accepteLe: null
  };
}

/** L'avis du contremaître, en français d'atelier (§8.2). */
function avisContremaitre(c){
  const cap = capaciteHebdoEstimee(c.produitId);
  const jours = Math.max(1, c.dateLimite - jourCourant());
  const semaines = jours / CONFIG.joursParSemaine;
  const besoin = c.quantite / semaines;
  const ratio = besoin / Math.max(1,cap);
  const n = nomItem(c.produitId, 2, true, true);
  const b = mesure(c.produitId, Math.ceil(besoin)), capT = mesure(c.produitId, cap);
  if (ratio < 0.55) return "On tient largement : " + b + " de " + n + " par semaine, et on en sort " + capT + ".";
  if (ratio < 0.9)  return "Ça passe, sans traîner. Il faut " + b + " par semaine, on en sort " + capT + ".";
  if (ratio < 1.25) return "Ça va être juste : " + b + " par semaine et on plafonne à " + capT + ". Aucune panne, sinon c'est mort.";
  return "On n'y arrivera jamais. " + b + " par semaine, on en fait " + capT + " au mieux. À moins d'embaucher.";
}

function accepterContrat(c){
  c.accepteLe = jourCourant();
  etat.contrats.acceptes.push(c);
  etat.contrats.proposes = etat.contrats.proposes.filter(x => x.id !== c.id);
  notif("Commande signée", c.client + " : " + quantiteItem(c.produitId, c.quantite, true) + " à " + euros(c.prixUnitaire) + " pièce.", "ok");
  son("signature");
}
function refuserContrat(c){
  etat.contrats.proposes = etat.contrats.proposes.filter(x => x.id !== c.id);
}
function annulerContrat(c){
  etat.contrats.acceptes = etat.contrats.acceptes.filter(x => x.id !== c.id);
  c.annule = true;
  etat.contrats.termines.push(c);
  etat.reputation = clamp(etat.reputation - 8, 0, 100);
  notif("Commande annulée", c.client + " a repris sa commande. Ça se saura.", "ko");
}

function livrerContrats(){
  const acc = etat.contrats.acceptes.slice().sort((a,b) => a.dateLimite - b.dateLimite);
  for (const c of acc){
    const reste = c.quantite - c.livre;
    if (reste <= 0) continue;
    const dispo = stockDe(c.produitId);
    if (dispo < 1) continue;
    const q = Math.min(Math.floor(dispo), reste);
    if (q < 1) continue;
    ajouterStock(c.produitId, -q);
    c.livre += q;
    const montant = q * c.prixUnitaire;
    encaisser(montant, "vente");
    compter(etat.progression.vendus, c.produitId, q);
    compter(etat.stats.semaineCourante.livres, c.produitId, q);
    flottant(U().quai.x+1, U().quai.y+1, "+" + Math.round(montant) + " €", "#5cba6b");
    son("argent");
    if (c.livre >= c.quantite){
      const aLheure = jourCourant() <= c.dateLimite;
      etat.reputation = clamp(etat.reputation + (aLheure ? 4 : 1), 0, 100);
      etat.contrats.acceptes = etat.contrats.acceptes.filter(x => x.id !== c.id);
      etat.contrats.termines.push(c);
      notif("Commande honorée", c.client + " est livré" + (aLheure ? ", dans les temps." : ", avec du retard."), aLheure ? "ok" : "att");
      son("valide");
      fait(aLheure ? ("Commande " + c.client + " livrée dans les temps") : ("Commande " + c.client + " livrée en retard"));
    } else {
      notif("Expédition", quantiteItem(c.produitId, q, true) + " partis chez " + c.client + " : " + euros(montant) + ".", "ok");
    }
  }
}

/** Ce qu'il faut encore livrer sur les commandes signées : on ne brade jamais
 *  un produit déjà promis à un client. */
function reserveContrats(produitId){
  let r = 0;
  for (const c of etat.contrats.acceptes)
    if (c.produitId === produitId) r += Math.max(0, c.quantite - c.livre);
  return r;
}

/** Les commerces du coin passent tous les soirs prendre ce qui dépasse.
 *  Moins payé qu'une commande : c'est tout l'intérêt d'en signer. */
function vendreSurplus(){
  if (!etat.venteAuto) return;
  let total = 0, detail = [];
  for (const id in ITEMS){
    if (!ITEMS[id].vente) continue;
    const surplus = Math.floor(stockDe(id) - reserveContrats(id));
    if (surplus < 1) continue;
    const prix = ITEMS[id].vente * 0.88 * surplus;
    ajouterStock(id, -surplus);
    encaisser(prix, "vente");
    compter(etat.progression.vendus, id, surplus);
    compter(etat.stats.semaineCourante.livres, id, surplus);
    total += prix;
    detail.push(quantiteItem(id, surplus, true));
  }
  if (total > 0){
    flottant(U().quai.x+1, U().quai.y+1, "+" + Math.round(total) + " €", "#5cba6b");
    son("argent");
    notif("Commerces du coin", detail.join(", ") + " partis pour " + euros(total) + ".", "ok");
  }
}

/* ------------------------------------------------------- Fin de semaine */
function fait(t){ etat.stats.semaineCourante.faits.push(t); }

function finSemaine(){
  const s = etat.stats.semaineCourante;
  s.semaine = semaineCourante();
  s.resultat = s.ca - s.depenses;
  s.solde = etat.finances.solde;
  etat.stats.historiqueSemaines.push(s);
  if (etat.stats.historiqueSemaines.length > 60) etat.stats.historiqueSemaines.shift();

  etat.stats.semaineCourante = semaineVierge();
  etat.progression.produitsSemaine = {};

  // Nouvelles propositions de commande
  const produits = Object.keys(ITEMS).filter(id => ITEMS[id].vente && (ITEMS[id].ageMin||1) <= etat.meta.age);
  etat.contrats.proposes = [];
  const n = etat.meta.age >= 2 ? 3 : 2;
  for (let i=0;i<n;i++) etat.contrats.proposes.push(creerContrat(choix(produits)));

  etat.meta.vitesse = 0;
  sauvegardeAuto();
  ouvrirVendredi(s);
}

/* ------------------------------------------------------- Progression */
function progressionObjectif(){
  const age = AGES[etat.meta.age-1];
  const o = age.objectif;
  let val = 0, cible = o.cible;
  if (o.type === "vendus") val = etat.progression.vendus[o.produit] || 0;
  else if (o.type === "produitsSemaine") val = etat.progression.produitsSemaine[o.produit] || 0;
  else if (o.type === "argent") val = etat.finances.solde;
  else val = 0;
  let p = clamp(val/cible, 0, 1);
  if (o.secours && o.secours.type === "argent")
    p = Math.max(p, clamp(etat.finances.solde/o.secours.cible, 0, 1));
  return { valeur:val, cible, part:p, texte:age.objectif.texte };
}

function verifierObjectif(){
  if (etat.meta.age >= AGES.length) return;
  const p = progressionObjectif();
  etat.progression.jaugeObjectif = p.part;
  if (p.part >= 1 && !etat.progression.objectifsCompletes.includes(etat.meta.age))
    passerAgeSuivant();
}

function passerAgeSuivant(){
  etat.progression.objectifsCompletes.push(etat.meta.age);
  const ancien = AGES[etat.meta.age-1];
  if (etat.meta.age >= 2){
    // Les âges 3 à 5 sont décrits au document mais pas encore construits.
    notif("Bravo", "Vous avez bouclé « " + ancien.nom + " ». La suite (l'hygiène, la saison, les autres sites) reste à bâtir : la partie continue en mode libre.", "ok");
    paroleContexte("fin_contenu", {});
    etat.meta.age = Math.min(etat.meta.age, AGES.length);
    return;
  }
  etat.meta.age++;
  const nouv = AGES[etat.meta.age-1];
  agrandirUsine(nouv.largeur, nouv.hauteur);
  U().nom = nouv.nom;
  etat.meta.vitesse = 0;
  son("age");
  notif("Nouvel âge : " + nouv.nom, nouv.intro, "ok");
  paroleContexte("age" + etat.meta.age, {});
  majBarreConstruction();
  majBandeau();
  ouvrirAnnonceAge(nouv);
}

function agrandirUsine(l, h){
  const u = U();
  const g = new Uint16Array(l*h);
  for (let y=0; y<u.hauteur; y++)
    for (let x=0; x<u.largeur; x++)
      g[y*l+x] = u.grille[y*u.largeur+x];
  u.grille = g; u.largeur = l; u.hauteur = h;
}

function finDePartie(){
  etat.meta.vitesse = 0;
  ouvrirFin();
}

/* ------------------------------------------------------- Poser / démolir */
function peutPoser(u, type, x, y, rotation){
  const d = MACHINES[type];
  const tourne = rotation % 2 === 1;
  const l = tourne ? d.h : d.l, h = tourne ? d.l : d.h;
  if (x < 0 || y < 0 || x+l > u.largeur || y+h > u.hauteur) return false;
  for (let dy=0; dy<h; dy++)
    for (let dx=0; dx<l; dx++)
      if (u.grille[(y+dy)*u.largeur + (x+dx)] !== 0) return false;
  return true;
}

function poserMachine(type, x, y, rotation){
  const u = U(), d = MACHINES[type];
  if (!peutPoser(u, type, x, y, rotation)) return false;
  if (etat.finances.solde - d.cout < CONFIG.faillite){
    notif("Trop cher", "Il n'y a pas " + euros(d.cout) + " en caisse.", "ko"); return false;
  }
  const m = creerMachine(type, x, y, rotation);
  u.machines.push(m);
  poserSurGrille(u, m);
  depenser(d.cout, "investissement");
  reindexer();
  son("pose");
  for (let i=0;i<8;i++) particule(x+m.l/2, y+m.h/2, "poussiere");
  flottant(x+m.l/2, y, "−" + d.cout + " €", "#e0574a");
  tutoEvenement("pose_" + type);
  return true;
}

function demolir(n, remboursementForce){
  const u = U();
  if (n.type === "convoyeur"){
    for (const t of n.chemin) if (u.grille[t.y*u.largeur+t.x] === n.id) u.grille[t.y*u.largeur+t.x] = 0;
    u.convoyeurs = u.convoyeurs.filter(c => c.id !== n.id);
    encaisser(Math.round(CONV.coutParTuile * n.chemin.length * CONFIG.remboursementCasse), "casse");
  } else {
    // ce qu'il y avait dedans retourne au stock
    for (const it in n.entree) ajouterStock(it, n.entree[it]);
    for (const it in n.sortie) ajouterStock(it, n.sortie[it]);
    if (n.operateurId != null){ const o = ouvrierParId(n.operateurId); if (o) libererTache(o); }
    for (const o of u.ouvriers) if (o.posteAssigne === n.id) o.posteAssigne = null;
    retirerDeGrille(u, n);
    u.machines = u.machines.filter(m => m.id !== n.id);
    encaisser(remboursementForce ?? Math.round(MACHINES[n.type].cout * CONFIG.remboursementCasse), "casse");
    // les convoyeurs qui pointaient dessus deviennent orphelins
    for (const c of u.convoyeurs)
      if (c.source === n.id || c.destination === n.id) c.etat = "non_relie";
  }
  if (vue.selection === n.id) vue.selection = null;
  reindexer();
  son("casse");
}

/* --------------------------------------------------------------- Équipe */
function creerCandidat(){
  const t = choix(TRAITS);
  const base = hasard(0.35, 0.85);
  const comp = {};
  for (const k of ["lavage","decoupe","friture","assaisonnement","emballage"])
    comp[k] = clamp(base + hasard(-0.2,0.2), 0.1, 1);
  const c = creerOuvrier(choix(PRENOMS), choix(NOMS), comp, Math.round(hasard(100,165)/5)*5, t.id);
  return c;
}

function embaucher(c){
  const u = U();
  c.id = nouvelId();
  const q = u.quai;
  c.x = q.x + q.l + 0.5; c.y = q.y + 1.5;
  c.moral = 0.75;
  u.ouvriers.push(c);
  notif("Embauche", c.prenom + " " + c.nom + " commence lundi. " + euros(c.salaire) + " par jour.", "ok");
  son("valide");
  majBandeau();
}

function licencier(o){
  const u = U();
  libererTache(o);
  u.ouvriers = u.ouvriers.filter(x => x.id !== o.id);
  const indem = o.salaire * 5;
  depenser(indem, "indemnite");
  for (const p of u.ouvriers) p.moral = clamp(p.moral - 0.12, 0, 1);
  notif("Départ", o.prenom + " " + o.nom + " quitte l'atelier. " + euros(indem) + " d'indemnité.", "att");
}

function emprunter(b){
  const total = b.montant * (1 + b.taux);
  etat.finances.emprunts.push({
    banque:b.nom, montant:b.montant, restant:total,
    mensualite: total / b.jours, taux:b.taux, debut:jourCourant()
  });
  encaisser(b.montant, "emprunt");
  notif("Emprunt accordé", b.nom + " vous prête " + euros(b.montant) + ". Remboursement " + euros(total/b.jours) + " par jour.", "ok");
  son("argent");
}

/* ============================================================================
   RENDU (1/3) — caméra, sol, pictogrammes
   Le rendu ne modifie jamais l'état de jeu (§11).
   ========================================================================== */

let cnv, ctx, largeurVue = 0, hauteurVue = 0, dpr = 1;
let texSol = null, texSalete = null;
// Images pré-calculées : le sol, le halo des lampes et la vignette sont
// recomposés une fois pour toutes, jamais à chaque image (§16).
let cacheSol = null, cacheSolCle = "", spriteHalo = null, gradVignette = null;

function initRendu(){
  cnv = document.getElementById("vue");
  ctx = cnv.getContext("2d", { alpha:false });
  texSol = fabriquerTextureSol();
  texSalete = fabriquerTextureSalete();
  spriteHalo = fabriquerHalo();
  redimensionner();
  window.addEventListener("resize", redimensionner);
}

function redimensionner(){
  const r = cnv.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  largeurVue = r.width; hauteurVue = r.height;
  cnv.width = Math.round(r.width*dpr);
  cnv.height = Math.round(r.height*dpr);
  cnv.style.width = r.width+"px";
  cnv.style.height = r.height+"px";
  // la vignette ne dépend que de la taille de la fenêtre
  gradVignette = ctx.createRadialGradient(
    largeurVue/2, hauteurVue/2, Math.min(largeurVue,hauteurVue)*0.34,
    largeurVue/2, hauteurVue/2, Math.max(largeurVue,hauteurVue)*0.78);
  gradVignette.addColorStop(0,"rgba(0,0,0,0)");
  gradVignette.addColorStop(1,"rgba(0,0,0,.42)");
  if (typeof cacheGradCorps !== "undefined") cacheGradCorps.clear();
}

/** Halo chaud d'une lampe d'atelier, dessiné une seule fois. */
function fabriquerHalo(){
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,"rgba(255,214,150,1)");
  grd.addColorStop(1,"rgba(255,214,150,0)");
  g.fillStyle = grd; g.fillRect(0,0,128,128);
  return c;
}

/** Le béton et la crasse : une seule composition, refaite quand l'atelier
 *  s'agrandit ou quand la saleté a visiblement changé. */
function majCacheSol(){
  const u = U();
  const cle = u.largeur + "x" + u.hauteur + ":" + Math.round(clamp(u.salete,0,1)*10);
  if (cacheSol && cle === cacheSolCle) return;
  cacheSolCle = cle;
  if (!cacheSol) cacheSol = document.createElement("canvas");
  cacheSol.width = u.largeur*CONFIG.tuile;
  cacheSol.height = u.hauteur*CONFIG.tuile;
  const g = cacheSol.getContext("2d");
  g.fillStyle = g.createPattern(texSol,"repeat");
  g.fillRect(0,0,cacheSol.width,cacheSol.height);
  if (u.salete > 0.03){
    g.globalAlpha = clamp(u.salete,0,1)*0.75;
    g.fillStyle = g.createPattern(texSalete,"repeat");
    g.fillRect(0,0,cacheSol.width,cacheSol.height);
    g.globalAlpha = 1;
  }
}

/** Béton : bruit fin pré-calculé une fois, jamais recalculé par frame. */
function fabriquerTextureSol(){
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#4a4d52"; g.fillRect(0,0,128,128);
  const img = g.getImageData(0,0,128,128), d = img.data;
  for (let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*17;
    d[i]=clamp(d[i]+n,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n,0,255);
  }
  g.putImageData(img,0,0);
  // quelques éclats plus sombres, comme du béton usé
  for (let i=0;i<40;i++){
    g.fillStyle = "rgba(0,0,0,"+(0.02+Math.random()*0.05)+")";
    g.beginPath(); g.ellipse(Math.random()*128, Math.random()*128, 2+Math.random()*9, 1+Math.random()*5, Math.random()*3, 0, 7); g.fill();
  }
  return c;
}

function fabriquerTextureSalete(){
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  for (let i=0;i<26;i++){
    const x = Math.random()*256, y = Math.random()*256, r = 6+Math.random()*26;
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,"rgba(20,16,10,0.5)");
    grd.addColorStop(1,"rgba(20,16,10,0)");
    g.fillStyle = grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  return c;
}

/* ------------------------------------------------------------- Caméra */
function T(){ return CONFIG.tuile * vue.zoom; }

function appliquerCamera(){
  const t = T();
  let sx = 0, sy = 0;
  if (vue.secousse > 0){
    sx = (Math.random()-0.5)*vue.secousse;
    sy = (Math.random()-0.5)*vue.secousse;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.translate(largeurVue/2 - vue.camX*t + sx, hauteurVue/2 - vue.camY*t + sy);
  ctx.scale(t,t);
}
function ecranSeul(){ ctx.setTransform(dpr,0,0,dpr,0,0); }

function ecranVersMonde(px, py){
  const t = T();
  return {
    x: (px - largeurVue/2) / t + vue.camX,
    y: (py - hauteurVue/2) / t + vue.camY
  };
}
function mondeVersEcran(x, y){
  const t = T();
  return { x: (x - vue.camX)*t + largeurVue/2, y: (y - vue.camY)*t + hauteurVue/2 };
}

function centrerCamera(){
  const u = U();
  vue.camX = u.largeur/2; vue.camY = u.hauteur/2;
  const t = CONFIG.tuile;
  vue.zoom = clamp(Math.min(largeurVue/(u.largeur*t+90), hauteurVue/(u.hauteur*t+90)), CONFIG.zoomMin, 1.4);
}

/* ------------------------------------------------- Pictogrammes de pièces
   Un dessin par forme, en coordonnées tuile, centré sur (0,0). `s` = taille. */
function dessinerItem(x, y, s, itemId, alpha){
  const it = ITEMS[itemId];
  if (!it) return;
  ctx.save();
  ctx.translate(x,y);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.fillStyle = it.couleur;
  ctx.strokeStyle = "rgba(0,0,0,.45)";
  ctx.lineWidth = Math.max(0.012, s*0.07);

  switch (it.forme){

    case "tubercule": {              // pomme de terre brute, avec ses yeux
      ctx.beginPath();
      ctx.ellipse(0, 0, s*0.44, s*0.32, 0.4, 0, 7);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(70,48,26,.55)";
      ctx.beginPath(); ctx.arc(-s*0.14, -s*0.06, s*0.05, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc( s*0.16,  s*0.08, s*0.04, 0, 7); ctx.fill();
      break;
    }

    case "tubercule_pele": {         // épluchée : plus claire, plus lisse
      ctx.beginPath();
      ctx.ellipse(0, 0, s*0.42, s*0.3, 0.4, 0, 7);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.beginPath(); ctx.ellipse(-s*0.1, -s*0.09, s*0.16, s*0.08, 0.4, 0, 7); ctx.fill();
      break;
    }

    case "rondelle": {               // rondelle crue vue de dessus
      ctx.beginPath(); ctx.arc(0, 0, s*0.36, 0, 7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(190,180,130,.7)";
      ctx.lineWidth = Math.max(0.008, s*0.04);
      ctx.beginPath(); ctx.arc(0, 0, s*0.2, 0, 7); ctx.stroke();
      break;
    }

    case "chips": {                  // chips : disque gondolé, doré
      ctx.beginPath();
      for (let i=0; i<=12; i++){
        const a = i/12*Math.PI*2;
        const r = s*0.36 * (1 + 0.16*Math.sin(a*3));
        const px = Math.cos(a)*r, py = Math.sin(a)*r*0.86;
        if (i === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
