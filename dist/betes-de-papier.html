<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140e08">
<meta name="color-scheme" content="dark">
<meta name="description" content="Bêtes de Papier — un théâtre d’ombres de poche : posez des découpes entre la lampe et le drap pour composer la bête que le conteur nomme.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bêtes de Papier</title>
<style>
@charset "utf-8";
/* Bêtes de Papier — feuille de style de l'interface.
   Palette : ocre et crème du drap, brun-noir des ombres, ambre de la lampe,
   carmin et bleu de Prusse pour les deux lampes de l'acte II. */

:root {
  --night:      #140e08;
  --night-2:    #1e150d;
  --night-3:    #2a1e13;
  --ink:        #f0e4cb;
  --ink-soft:   #cbb794;
  --ink-dim:    #9c876a;
  --paper:      #e7d6ae;
  --paper-2:    #f2e5c6;
  --paper-line: rgba(74, 48, 22, .16);
  --brown:      #4a3018;
  --ocre:       #b4823a;
  --amber:      #e8a838;
  --gold:       #f2d98a;
  --carmin:     #a02f26;
  --prusse:     #23496f;
  --rule:       rgba(240, 228, 203, .16);
  --pad-t: env(safe-area-inset-top, 0px);
  --pad-b: env(safe-area-inset-bottom, 0px);
  --pad-l: env(safe-area-inset-left, 0px);
  --pad-r: env(safe-area-inset-right, 0px);
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--night);
  color: var(--ink);
  font-family: var(--serif);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
body {
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  /* Interface de jeu : un appui long ne doit ni sélectionner du texte ni ouvrir le menu système. */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
button, input, output { font-family: inherit; color: inherit; }
h1, h2, h3, h4, p, ul, li { margin: 0; }
ul { list-style: none; padding: 0; }

svg { width: 1em; height: 1em; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------------ trame */

#app {
  position: relative;
  width: 100%;
  height: 100dvh;
  max-width: 1500px;
  margin: 0 auto;
  overflow: hidden;
  display: grid;
  grid-template-columns: 100%;
  grid-template-rows: auto 1fr auto;
  grid-template-areas: "top" "stage" "panel";
  padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
  background:
    radial-gradient(120% 80% at 50% 8%, rgba(232, 168, 56, .10), transparent 60%),
    var(--night);
}

#hud { display: contents; }
#hud[hidden] { display: none; }

#stage-wrap { grid-area: stage; position: relative; min-width: 0; min-height: 0; }
#stage { width: 100%; height: 100%; display: block; touch-action: none; }

#screens { position: absolute; inset: 0; z-index: 30; }
#screens[hidden] { display: none; }

#tuto { position: fixed; inset: 0; z-index: 60; }
#tuto[hidden] { display: none; }

#toast { position: fixed; top: calc(var(--pad-t) + 64px); left: 0; right: 0; z-index: 70; pointer-events: none; display: flex; justify-content: center; }

/* ------------------------------------------------------------- HUD : haut */

.hud-top {
  grid-area: top;
  padding: 8px 12px 6px;
  border-bottom: 1px solid var(--rule);
  background: linear-gradient(180deg, rgba(0, 0, 0, .35), rgba(0, 0, 0, 0));
}
.hud-line {
  display: grid; align-items: center; gap: 4px 12px;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "title moves" "gauge gauge";
}
.hud-title {
  grid-area: title; min-width: 0;
  font-size: 17px; letter-spacing: .01em; color: var(--paper);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hud-moves { grid-area: moves; color: var(--ink-soft); font-size: 13px; display: flex; align-items: baseline; gap: 3px; }
.hud-moves b { font-size: 17px; color: var(--paper); font-weight: normal; }
.hud-moves i { font-style: normal; opacity: .7; }
.hud-moves small { font-size: 11px; letter-spacing: .04em; opacity: .6; margin-left: 3px; }

.gauge { grid-area: gauge; display: flex; align-items: center; gap: 9px; margin-top: 3px; }
/* Sans étiquette, la barre ne dit pas ce qu'elle mesure. */
.gauge-lab {
  flex: 0 0 auto; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-dim); white-space: nowrap;
}
@media (max-width: 340px) { .gauge-lab { display: none; } }
.gauge-track {
  position: relative; flex: 1 1 auto; height: 11px; border-radius: 6px;
  background: rgba(0, 0, 0, .45);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .6);
  overflow: hidden;
}
.gauge-fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: var(--ocre); border-radius: 6px;
  transition: width .28s ease, background .28s ease;
}
.gauge-fill.gold { box-shadow: 0 0 10px rgba(242, 217, 138, .55); }
.tick { position: absolute; top: -1px; bottom: -1px; width: 2px; background: rgba(240, 228, 203, .45); }
.tick.gold { background: rgba(242, 217, 138, .75); }
.gauge-val { flex: 0 0 auto; width: 52px; text-align: right; font-size: 15px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.gauge-val.pass { color: var(--amber); }
.gauge-val.gold { color: var(--gold); }

.sub-gauges { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
.sub { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-dim); flex: 1 1 96px; min-width: 0; }
.sub-lab { flex: 0 0 auto; letter-spacing: .02em; }
.sub-track { position: relative; flex: 1 1 auto; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .45); overflow: hidden; }
.sub-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink-dim); transition: width .28s ease; }
.sub-fill.r-red { background: var(--carmin); }
.sub-fill.r-blue { background: #3f7cb0; }
.sub-fill.r-umbra { background: #d8cbae; }
.sub-fill.r-main { background: var(--amber); }
.sub-val { flex: 0 0 34px; text-align: right; font-variant-numeric: tabular-nums; }

.beatbar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--amber); }
.beatbar[hidden] { display: none; }
.beat-lab { flex: 0 0 auto; letter-spacing: .03em; }
.beat-track { flex: 1 1 auto; height: 4px; background: rgba(0, 0, 0, .5); border-radius: 2px; overflow: hidden; }
.beat-track i { display: block; height: 100%; width: 100%; background: var(--carmin); }

/* --------------------------------------------------------- HUD : panneau */

.hud-panel {
  grid-area: panel;
  padding: 8px 10px calc(8px + var(--pad-b));
  border-top: 1px solid var(--rule);
  background: linear-gradient(180deg, rgba(0, 0, 0, .18), rgba(0, 0, 0, .42));
}
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
@media (max-width: 330px) { .pad { grid-template-columns: repeat(3, 1fr); } }
.pbtn, .vbtn {
  -webkit-appearance: none; appearance: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 50px; padding: 6px 3px;
  border: 1px solid rgba(180, 130, 58, .38);
  border-radius: 7px;
  background: linear-gradient(180deg, rgba(74, 48, 24, .55), rgba(35, 23, 12, .55));
  color: var(--paper);
  font-size: 10.5px; letter-spacing: .01em;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, transform .12s ease, opacity .2s ease;
  touch-action: manipulation;
}
.pbtn .bi svg, .vbtn .bi svg { width: 21px; height: 21px; }
.pbtn .pl { line-height: 1.05; text-align: center; }
.pbtn:hover, .vbtn:hover { background: linear-gradient(180deg, rgba(103, 68, 32, .7), rgba(48, 32, 16, .7)); border-color: rgba(232, 168, 56, .5); }
.pbtn:active, .vbtn:active { transform: translateY(1px); }
.pbtn.dim { opacity: .42; }
.pbtn.on { border-color: var(--amber); color: var(--gold); background: linear-gradient(180deg, rgba(128, 88, 34, .7), rgba(60, 40, 18, .7)); }
.pbtn[data-act="menu"] { border-color: rgba(240, 228, 203, .22); }

.views { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 7px; }
/* Croix de déplacement fin (écrans tactiles) : un cran de grille par pression. */
.nudge { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 44px 44px; gap: 4px; width: 148px; margin: 0 auto 7px; }
.nbtn {
  -webkit-appearance: none; appearance: none; min-width: 44px; min-height: 44px;
  border: 1px solid rgba(180, 130, 58, .38); border-radius: 7px; color: var(--ink-light, #f1e6cf);
  background: linear-gradient(180deg, rgba(74, 48, 24, .55), rgba(35, 23, 12, .55)); font-size: 14px;
}
.nbtn:active { background: rgba(128, 88, 34, .75); }
.nbtn.n0__1 { grid-column: 2; grid-row: 1; }
.nbtn.n_1_0 { grid-column: 1; grid-row: 2; }
.nbtn.n1_0 { grid-column: 3; grid-row: 2; }
.nbtn.n0_1 { grid-column: 2; grid-row: 2; }
.nudge-lab { grid-column: 1; grid-row: 1; align-self: center; justify-self: center; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
.nudge .needs-sel[disabled] { opacity: .35; }
.vbtn { min-height: 46px; font-size: 10.5px; }
.vbtn.on { border-color: var(--amber); color: var(--gold); background: linear-gradient(180deg, rgba(128, 88, 34, .75), rgba(60, 40, 18, .75)); }
.vbtn.v-red { color: #e8a49c; }
.vbtn.v-blue { color: #a8c6e2; }
.vbtn.v-red.on { color: #ffd2c9; border-color: var(--carmin); }
.vbtn.v-blue.on { color: #d8ebff; border-color: #4d7fae; }

.curtain-btn { width: 100%; margin-bottom: 8px; }

/* ------------------------------------------------------------- écrans */

.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column;
  padding: calc(var(--pad-t)) calc(var(--pad-r)) calc(var(--pad-b)) calc(var(--pad-l));
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(232, 168, 56, .09), transparent 62%),
    linear-gradient(180deg, #1b130b, #120c07);
  opacity: 0;
  transition: opacity .34s ease;
}
.screen.in { opacity: 1; }
.screen-result, .screen-lost, .screen-tourend { background: rgba(15, 10, 6, .55); }
.screen-pause { background: rgba(12, 8, 4, .88); }
.veil { position: absolute; inset: 0; background: radial-gradient(90% 70% at 50% 40%, rgba(20, 14, 8, .72), rgba(12, 8, 4, .93)); }

.sc-head {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule);
  background: linear-gradient(180deg, rgba(20, 14, 8, .96), rgba(20, 14, 8, .82));
  backdrop-filter: blur(2px);
}
.sc-head h2 { flex: 1 1 auto; font-size: 20px; font-weight: normal; letter-spacing: .04em; color: var(--paper); }
.head-sp { width: 44px; }
.head-count { font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.sc-body { flex: 1 1 auto; padding: 14px 12px 28px; width: 100%; max-width: 860px; margin: 0 auto; }

.icon-btn {
  flex: 0 0 auto;
  width: 44px; height: 44px; display: grid; place-items: center;   /* cible tactile minimale */
  border: 1px solid var(--rule); border-radius: 8px;
  background: rgba(255, 255, 255, .03); color: var(--ink-soft);
  cursor: pointer; transition: background .18s ease, color .18s ease;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { background: rgba(232, 168, 56, .12); color: var(--gold); }

/* boutons « tampons » */
.btn {
  -webkit-appearance: none; appearance: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  min-height: 48px; padding: 11px 18px;
  border: 1px solid rgba(180, 130, 58, .45);
  border-radius: 3px;
  background: linear-gradient(180deg, rgba(60, 40, 20, .5), rgba(30, 20, 10, .5));
  color: var(--paper);
  font-size: 16px; letter-spacing: .03em;
  cursor: pointer;
  transition: background .2s ease, border-color .2s ease, color .2s ease, transform .12s ease;
  touch-action: manipulation;
}
.btn .bi svg { width: 19px; height: 19px; }
.btn:hover { background: linear-gradient(180deg, rgba(92, 62, 28, .6), rgba(46, 30, 14, .6)); border-color: rgba(232, 168, 56, .6); color: var(--gold); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  border-color: rgba(232, 168, 56, .75);
  background: linear-gradient(180deg, rgba(150, 102, 38, .55), rgba(78, 50, 20, .6));
  color: #fbeed0;
  box-shadow: inset 0 0 0 1px rgba(242, 217, 138, .12);
}
.btn.primary:hover { background: linear-gradient(180deg, rgba(184, 128, 48, .68), rgba(96, 62, 24, .7)); }
.btn.ghost { border-color: var(--rule); background: transparent; color: var(--ink-soft); }
.btn.small { min-height: 44px; padding: 7px 13px; font-size: 14px; }
.btn.armed { border-color: var(--carmin); color: #f0c4bd; background: rgba(160, 47, 38, .3); }

.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.row .btn { flex: 1 1 auto; }
.menu-col { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; margin: 0 auto; }
.menu-col .btn { justify-content: flex-start; }

/* ---------------------------------------------------------- écran titre */

.screen-title { justify-content: center; align-items: center; overflow-x: hidden; }
.halo {
  position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%);
  width: 150vmax; height: 150vmax; pointer-events: none;
  background: radial-gradient(circle at center,
    rgba(255, 206, 122, .28) 0%, rgba(232, 168, 56, .13) 18%,
    rgba(120, 76, 26, .07) 34%, rgba(0, 0, 0, 0) 58%);
  animation: flicker 5.5s ease-in-out infinite;
}
.halo.soft { opacity: .55; top: 40%; }
@keyframes flicker {
  0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  42%      { opacity: .88; transform: translate(-50%, -50%) scale(1.03); }
  67%      { opacity: .96; transform: translate(-50%, -50%) scale(.99); }
}
.title-inner { position: relative; z-index: 1; text-align: center; padding: 24px 20px calc(24px + var(--pad-b)); width: 100%; max-width: 460px; }
/* petit drap éclairé : la silhouette y est projetée */
.vitrine {
  position: relative;
  width: min(300px, 70vw); aspect-ratio: 3 / 2;
  margin: 0 auto 20px;
  border-radius: 2px;
  background:
    radial-gradient(76% 74% at 50% 44%, #f2e2b8 0%, #dcc48f 46%, #b79764 82%, #9c7d51 100%);
  box-shadow:
    0 0 0 1px rgba(58, 38, 16, .55),
    0 0 34px 6px rgba(232, 168, 56, .16),
    0 20px 46px rgba(0, 0, 0, .6),
    inset 0 0 40px rgba(96, 62, 24, .3);
  overflow: hidden;
}
.vitrine svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.vitrine .sil { fill: #1c1108; stroke: none; opacity: .93; }
.vitrine .sil.bird { opacity: .55; }
.game-title {
  font-size: clamp(34px, 11vw, 54px);
  font-weight: normal; letter-spacing: .04em; line-height: 1.05;
  color: #f7e9c8;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .45), 0 0 26px rgba(232, 168, 56, .22);
}
.game-title.small { font-size: 28px; margin-bottom: 12px; }
.tagline { margin: 12px auto 24px; max-width: 30em; font-size: 15px; line-height: 1.55; color: var(--ink-soft); font-style: italic; }
.version { margin-top: 18px; font-size: 11.5px; letter-spacing: .08em; color: var(--ink-dim); opacity: .75; text-align: center; }

/* ------------------------------------------------------------ la carte */

.act { margin-bottom: 26px; }
.act-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 9px; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--rule); }
.act-num { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--ocre); }
.act-name { font-size: 21px; font-weight: normal; color: var(--paper); }
.act-lock { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; font-size: 12px; color: var(--ink-dim); font-style: italic; }
.act-lock svg { width: 13px; height: 13px; }
.act.locked { opacity: .55; }

.vignettes { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 12px; }
.vign {
  -webkit-appearance: none; appearance: none;
  display: flex; flex-direction: column; align-items: stretch; gap: 6px;
  padding: 8px 8px 10px;
  border: 1px solid var(--rule); border-radius: 4px;
  background: rgba(255, 245, 220, .035);
  color: var(--ink); text-align: left; cursor: pointer;
  transition: border-color .2s ease, background .2s ease, transform .15s ease;
}
.vign:hover { border-color: rgba(232, 168, 56, .55); background: rgba(232, 168, 56, .07); }
.vign.locked { cursor: not-allowed; opacity: .62; }
.vign.locked:hover { border-color: var(--rule); background: rgba(255, 245, 220, .035); }
.vign.perf { border-left: 3px solid var(--carmin); }
.thumb-box { position: relative; display: block; border-radius: 3px; overflow: hidden; background: #e0cfa6; aspect-ratio: 4 / 3; }
.thumb { width: 100%; height: 100%; display: block; }
.vlock { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(22, 15, 8, .68); color: var(--paper); }
.vlock svg { width: 26px; height: 26px; }
.vign-t { font-size: 14.5px; color: var(--paper); line-height: 1.2; }
.vtag { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #d08c84; }
.stars { display: flex; gap: 3px; color: rgba(240, 228, 203, .3); }
.stars svg { width: 15px; height: 15px; }
.star.on { color: var(--gold); }
.star.on svg { fill: currentColor; }
.shake { animation: shake .38s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 75%{transform:translateX(-2px)} }
.empty { color: var(--ink-dim); font-style: italic; text-align: center; padding: 30px 0; }

/* ------------------------------------------------- carnet (textes) */

.screen-interlude, .screen-brief, .screen-notice, .screen-epilogue, .screen-credits,
.screen-pause, .screen-result, .screen-lost, .screen-tourend { justify-content: center; align-items: center; }
.screen-interlude, .screen-epilogue { cursor: pointer; }

.carnet {
  position: relative; z-index: 1;
  width: min(560px, calc(100% - 28px)); margin: auto;
  padding: 24px 22px 26px 44px;
  background:
    repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-line) 27px 28px),
    linear-gradient(160deg, var(--paper-2), var(--paper));
  color: #2f1f10;
  border-radius: 2px;
  border: 1px solid rgba(70, 45, 20, .3);
  box-shadow: 0 14px 40px rgba(0, 0, 0, .55), inset 0 0 40px rgba(160, 120, 60, .18);
}
.carnet::before {
  content: ''; position: absolute; left: 30px; top: 0; bottom: 0; width: 1px;
  background: rgba(160, 47, 38, .28);
}
.carnet.narrow { width: min(400px, calc(100% - 28px)); }
.carnet h2, .carnet h3 { font-weight: normal; color: #3a2412; }
.carnet h2 { font-size: 26px; line-height: 1.15; margin-bottom: 10px; }
.carnet .menu-col { margin-top: 18px; }
.carnet .menu-col .btn { border-color: rgba(90, 58, 24, .45); background: rgba(90, 58, 24, .1); color: #3a2412; }
.carnet .menu-col .btn:hover { background: rgba(150, 100, 40, .2); color: #241505; border-color: rgba(120, 78, 30, .7); }
.carnet .menu-col .btn.primary { background: rgba(160, 110, 40, .28); border-color: rgba(120, 78, 30, .7); }
.carnet .row .btn { border-color: rgba(90, 58, 24, .45); background: rgba(90, 58, 24, .1); color: #3a2412; }
.carnet .row .btn:hover { background: rgba(150, 100, 40, .2); color: #241505; }
.carnet .row .btn.primary { background: rgba(160, 110, 40, .3); border-color: rgba(120, 78, 30, .75); }
.carnet .row .btn.ghost { background: transparent; color: #6b4c2c; }

.kicker { font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: #8a5f2c; margin-bottom: 6px; }
.act-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.act-head small { font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: #8a5f2c; }
.brief-title { font-size: 26px; margin-bottom: 12px; }
.carnet-body { min-height: 1em; }
.para {
  font-size: 16px; line-height: 1.62; color: #33220f;
  margin: 0 0 12px;
  opacity: 0; transform: translateY(6px);
  transition: opacity .5s ease, transform .5s ease;
}
.para.in { opacity: 1; transform: none; }
.tap-hint { margin-top: 16px; font-size: 12px; letter-spacing: .14em; text-transform: lowercase; color: #9a7444; font-style: italic; text-align: right; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
.perf-flag { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #8f2c22; margin-bottom: 10px; letter-spacing: .04em; }
.perf-flag svg { width: 17px; height: 17px; }
.brief-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; padding-top: 10px; border-top: 1px dashed rgba(90, 58, 24, .35); font-size: 12.5px; color: #7a5730; letter-spacing: .03em; }
.record { margin-top: 14px; font-size: 14px; color: #5d3f1e; }
.record.muted { color: #927041; font-style: italic; }
.record-box, .result-figures { display: flex; gap: 22px; margin-top: 16px; }
.record-box div, .result-figures div { display: flex; flex-direction: column; }
.record-box b, .result-figures b { font-size: 25px; font-weight: normal; color: #3a2412; font-variant-numeric: tabular-nums; }
.record-box i, .result-figures i { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: #8a5f2c; font-style: normal; }
.improv-thumb { margin: 4px 0 14px; }
.improv-thumb canvas { width: 100%; max-width: 260px; height: auto; border: 1px solid rgba(90, 58, 24, .35); border-radius: 2px; background: #e0cfa6; display: block; }
.credit-line { margin-top: 18px; font-size: 13px; font-style: italic; color: #7a5730; }

/* ------------------------------------------------------ fin de tableau */

.result-card { width: min(480px, calc(100% - 28px)); padding-left: 22px; text-align: center; }
.result-card::before { display: none; }
.carnet .game-title { color: #3a2412; text-shadow: none; }
.result-card .result-figures, .result-card .record-box { justify-content: center; }
.big-stars { display: flex; justify-content: center; gap: 12px; margin: 14px 0 6px; }
/* Les étoiles éteintes disent « une sur trois » : à 22 % elles disparaissaient sur le carnet. */
.bstar { color: rgba(90, 58, 24, .34); }
.bstar svg { width: 42px; height: 42px; stroke-width: 1.2; }
.bstar.on { color: #cf9c22; animation: pop .5s cubic-bezier(.2, 1.5, .4, 1); }
.bstar.on svg { fill: #e5b73a; }
@keyframes pop { 0% { transform: scale(.3) rotate(-18deg); opacity: 0; } 60% { transform: scale(1.18) rotate(4deg); opacity: 1; } 100% { transform: scale(1); } }
.read-list { margin-top: 14px; border-top: 1px dashed rgba(90, 58, 24, .35); }
.read-list li { display: flex; justify-content: space-between; padding: 5px 2px; font-size: 14px; color: #5d3f1e; border-bottom: 1px dashed rgba(90, 58, 24, .18); }
.read-list b { font-weight: normal; font-variant-numeric: tabular-nums; color: #3a2412; }
.lost .kicker { color: #9a2b22; }
.lost-txt { font-size: 15px; line-height: 1.6; color: #33220f; margin-top: 6px; }

/* --------------------------------------------------------------- succès */

.ach-list { display: flex; flex-direction: column; gap: 8px; }
.ach { display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; border: 1px solid var(--rule); border-radius: 4px; background: rgba(255, 245, 220, .03); opacity: .6; }
.ach.got { opacity: 1; border-color: rgba(232, 168, 56, .4); background: rgba(232, 168, 56, .07); }
.ach-ic { flex: 0 0 auto; color: var(--ink-dim); margin-top: 2px; }
.ach.got .ach-ic { color: var(--gold); }
.ach-ic svg { width: 22px; height: 22px; }
.ach-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ach-txt b { font-weight: normal; font-size: 16px; color: var(--paper); }
.ach-txt i { font-style: normal; font-size: 13.5px; line-height: 1.4; color: var(--ink-soft); }
.ach-txt u { text-decoration: none; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); margin-top: 2px; }
.ach.got .ach-txt u { color: var(--ocre); }

#toast .toast-card {
  display: flex; align-items: center; gap: 11px;
  max-width: min(420px, calc(100vw - 24px));
  padding: 11px 16px;
  border: 1px solid rgba(232, 168, 56, .55); border-radius: 3px;
  background: linear-gradient(180deg, rgba(50, 33, 15, .97), rgba(30, 20, 9, .97));
  box-shadow: 0 10px 26px rgba(0, 0, 0, .5);
  transform: translateY(-140%); opacity: 0;
  transition: transform .45s cubic-bezier(.2, 1.2, .4, 1), opacity .35s ease;
}
#toast.show .toast-card { transform: none; opacity: 1; }
.toast-ic { color: var(--gold); }
.toast-ic svg { width: 24px; height: 24px; }
.toast-txt { display: flex; flex-direction: column; }
.toast-txt b { font-weight: normal; font-size: 15.5px; color: var(--gold); }
.toast-txt i { font-style: normal; font-size: 12.5px; color: var(--ink-soft); }

/* -------------------------------------------------------------- options */

.opts { display: flex; flex-direction: column; gap: 4px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 13px 4px; border-bottom: 1px solid var(--rule); }
.opt-lab { flex: 1 1 auto; font-size: 15.5px; color: var(--paper); }
.opt.danger .opt-lab { color: #d99189; }
.opt output { width: 34px; text-align: right; font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 148px; height: 22px; background: transparent; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(240, 228, 203, .22); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(240, 228, 203, .22); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;
  background: var(--amber); border: 1px solid rgba(0, 0, 0, .35);
}
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--amber); border: 1px solid rgba(0, 0, 0, .35); }
.switch { position: relative; display: inline-block; width: 50px; height: 28px; flex: 0 0 auto; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 14px; background: rgba(240, 228, 203, .14); border: 1px solid var(--rule); transition: background .2s ease; pointer-events: none; }
.switch span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-soft); transition: transform .2s ease, background .2s ease; }
.switch input:checked + span { background: rgba(232, 168, 56, .32); border-color: rgba(232, 168, 56, .6); }
.switch input:checked + span::after { transform: translateX(22px); background: var(--gold); }

/* ------------------------------------------------------------- tutoriel */

.tuto-wrap { position: absolute; inset: 0; background: rgba(12, 8, 4, .5); opacity: 0; transition: opacity .25s ease; }
.tuto-wrap.in { opacity: 1; }
.tuto {
  position: absolute;
  padding: 14px 16px 12px;
  background:
    repeating-linear-gradient(180deg, transparent 0 22px, var(--paper-line) 22px 23px),
    linear-gradient(160deg, var(--paper-2), var(--paper));
  color: #2f1f10;
  border: 1px solid rgba(70, 45, 20, .35);
  border-radius: 2px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .55);
}
.tuto h4 { font-size: 12px; font-weight: normal; letter-spacing: .16em; text-transform: uppercase; color: #8a5f2c; margin-bottom: 5px; }
.tuto p { font-size: 14.5px; line-height: 1.5; color: #33220f; }
.tuto-ok { display: block; margin-top: 9px; text-align: right; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: #96702f; }
.tuto-arrow { position: absolute; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; transform: translateX(-9px); }
.tuto-arrow.down { border-top: 11px solid var(--paper); }
.tuto-arrow.up { border-bottom: 11px solid var(--paper-2); }
.tuto-ring { position: absolute; border: 2px solid var(--amber); border-radius: 9px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0); animation: ring 1.6s ease-in-out infinite; pointer-events: none; }
@keyframes ring { 0%,100% { box-shadow: 0 0 0 0 rgba(232,168,56,.45); } 50% { box-shadow: 0 0 0 7px rgba(232,168,56,0); } }

/* ------------------------------------------------ paysage / grand écran */

@media (min-width: 700px) and (min-aspect-ratio: 1/1) {
  #app {
    grid-template-columns: 1fr minmax(196px, 236px);
    grid-template-rows: auto 1fr;
    grid-template-areas: "top top" "stage panel";
  }
  .hud-panel {
    border-top: none; border-left: 1px solid var(--rule);
    padding: 10px 10px calc(10px + var(--pad-b));
    overflow-y: auto;
    background: linear-gradient(180deg, rgba(0, 0, 0, .22), rgba(0, 0, 0, .38));
  }
  .pad { grid-template-columns: repeat(2, 1fr); gap: 7px; }
  .pbtn { min-height: 56px; font-size: 11.5px; }
  .views { grid-template-columns: repeat(2, 1fr); }
  .hud-top { padding: 10px 16px 8px; }
  .hud-line {
    grid-template-columns: minmax(90px, 1fr) minmax(220px, 520px) auto;
    grid-template-areas: "title gauge moves";
    gap: 0 22px;
  }
  .hud-title { font-size: 19px; }
  .gauge { margin-top: 0; }
  .gauge-track { height: 13px; }
  .sub-gauges { gap: 4px 22px; }
  .sub { flex: 0 1 190px; }
  .sc-body { padding: 20px 20px 34px; }
  .title-inner { max-width: 520px; }
  .tagline { font-size: 16.5px; }
  .vignettes { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
}

@media (min-width: 820px) {
  .ach-list { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
}
@media (min-width: 1100px) {
  .menu-col { max-width: 380px; }
  .sc-body { max-width: 920px; }
}

/* paysage court : le titre passe en deux colonnes (drap à gauche, menu à droite) */
@media (max-height: 620px) and (min-aspect-ratio: 1/1) {
  .title-inner {
    display: grid; max-width: 780px; gap: 2px 34px; text-align: left;
    grid-template-columns: auto minmax(250px, 330px);
    justify-content: center; align-items: center;
    padding: 14px 20px calc(14px + var(--pad-b));
  }
  .vitrine { grid-column: 1; grid-row: 1 / span 4; width: min(290px, 38vw); margin: 0; }
  .game-title { grid-column: 2; font-size: clamp(28px, 5.2vw, 40px); }
  .tagline { grid-column: 2; margin: 8px 0 14px; font-size: 14px; }
  .menu-col { grid-column: 2; margin: 0; max-width: none; gap: 7px; }
  .menu-col .btn { min-height: 46px; font-size: 15px; padding: 8px 16px; }
  .version { grid-column: 2; text-align: left; margin-top: 11px; }
}

/* écrans très courts en paysage mobile : on comprime le HUD */
@media (max-height: 460px) and (min-aspect-ratio: 1/1) {
  .hud-top { padding: 5px 12px 4px; }
  .hud-title { font-size: 15px; }
  .gauge-track { height: 9px; }
  #app { grid-template-columns: 1fr minmax(212px, 252px); }
  .hud-panel { padding: 7px 8px calc(7px + var(--pad-b)); }
  .pad { grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .views { grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 5px; }
  .pbtn { min-height: 46px; font-size: 10px; }
  .pbtn .bi svg, .vbtn .bi svg { width: 18px; height: 18px; }
  .vbtn { min-height: 44px; font-size: 9.5px; }
  .carnet { padding: 16px 18px; }
  .carnet h2, .brief-title { font-size: 21px; }
  .para { font-size: 14.5px; margin-bottom: 8px; }
  .title-inner { padding: 10px 18px calc(10px + var(--pad-b)); }
  .game-title { font-size: clamp(25px, 4.4vw, 34px); }
  .tagline { margin: 6px 0 10px; font-size: 13.5px; }
  .menu-col { gap: 6px; }
  .menu-col .btn { min-height: 44px; font-size: 14.5px; }
  .version { margin-top: 8px; }
}

/* ------------------------------------------------------ mouvements réduits */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
  animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important;
}
body.reduce-motion .para { opacity: 1; transform: none; }

<script>
/* ---- js/bp.js ---- */
'use strict';
/* Bêtes de Papier — espace de noms partagé, constantes et utilitaires. */
window.BP = window.BP || {};
(function (BP) {
  BP.VERSION = '1.0.0';
  BP.DRAP_W = 400;
  BP.DRAP_H = 300;
  BP.GRID = 4;
  BP.DEPTHS = [1, 0.85, 0.72, 0.6, 0.5];   // distance lampe -> pièce (drap à 1)
  BP.TILTS = [1, 0.7, 0.35];               // facteur d'écrasement de l'axe X local
  BP.MASK_W = 128;
  BP.MASK_H = 96;
  BP.PASS = 0.90;
  BP.GOLD = 0.97;
  BP.ROT_STEP = 15;

  /** Facteur d'agrandissement d'une pièce à la profondeur donnée. */
  BP.scaleOf = function (depth) { return 1 / BP.DEPTHS[depth]; };

  /** Centre de l'ombre de la pièce sous la lampe j (lamps[0] = lampe principale). */
  BP.shadowCenter = function (piece, lamps, j) {
    var k = BP.scaleOf(piece.depth);
    var L0 = lamps[0], Lj = lamps[j] || lamps[0];
    return { x: piece.sx + (L0.x - Lj.x) * (k - 1), y: piece.sy + (L0.y - Lj.y) * (k - 1) };
  };

  /** Transforme un point local du polygone en point drap sous la lampe j. */
  BP.projectPoint = function (px, py, piece, lamps, j) {
    var k = BP.scaleOf(piece.depth);
    var x = px * (piece.flip ? -1 : 1) * BP.TILTS[piece.tilt];
    var y = py;
    var a = piece.rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    var rx = x * c - y * s, ry = x * s + y * c;
    var C = BP.shadowCenter(piece, lamps, j);
    return { x: C.x + rx * k, y: C.y + ry * k };
  };

  /** RNG déterministe (mulberry32) ; seed = entier ou chaîne. */
  BP.rng = function (seed) {
    var h = 0;
    if (typeof seed === 'string') {
      for (var i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 2654435761) >>> 0;
    } else h = (seed >>> 0);
    var a = h || 0x9E3779B9;
    var r = function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    r.int = function (lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); };
    r.pick = function (arr) { return arr[Math.floor(r() * arr.length)]; };
    r.shuffle = function (arr) { var b = arr.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; };
    return r;
  };

  /** Petit émetteur d'événements. */
  BP.Emitter = function () { this._h = {}; };
  BP.Emitter.prototype.on = function (ev, fn) { (this._h[ev] = this._h[ev] || []).push(fn); return this; };
  BP.Emitter.prototype.off = function (ev, fn) { var a = this._h[ev]; if (!a) return this; var i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); return this; };
  BP.Emitter.prototype.emit = function (ev, data) { var a = this._h[ev]; if (!a) return; a.slice().forEach(function (f) { try { f(data); } catch (e) { console.error('[BP] handler ' + ev, e); } }); };

  BP.clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
  BP.lerp = function (a, b, t) { return a + (b - a) * t; };
  BP.dateKey = function (d) { d = d || new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
})(window.BP);

</script>
<script>
/* ---- js/shapes.js ---- */
'use strict';
/* Bêtes de Papier — bibliothèque des découpes (BP.shapes).
 *
 * Toutes les formes sont GÉNÉRÉES PAR CODE : cercles, ellipses, courbes de Bézier,
 * profils tracés le long d'une ligne moyenne, et pour les formes organiques un contour
 * extrait d'un champ de distance signé par « marching squares ».
 *
 * Convention (SPEC §4) :
 *   - un polygone = [[x, y], …] en unités-monde, centré sur (0,0) (centre du rectangle englobant) ;
 *   - polys[0] = contour extérieur, les suivants = trous ou parties disjointes (règle evenodd) ;
 *   - taille indicative entre 20 et 120 unités.
 */
window.BP = window.BP || {};
(function (BP) {

  var TAU = Math.PI * 2;
  var DEG = Math.PI / 180;

  /* =================================================================================
   * 1. Petits utilitaires de courbes
   * ================================================================================= */

  /** Arc d'ellipse : angles en degrés, n segments. Renvoie n+1 points (bornes incluses). */
  function arcPts(cx, cy, rx, ry, a0, a1, n) {
    var out = [], i;
    for (i = 0; i <= n; i++) {
      var a = (a0 + (a1 - a0) * (i / n)) * DEG;
      out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    return out;
  }

  /** Ellipse complète (n points, sans doublon de fermeture). */
  function ellipsePts(cx, cy, rx, ry, n) {
    var out = [], i;
    for (i = 0; i < n; i++) {
      var a = (i / n) * TAU;
      out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    return out;
  }

  /** Bézier quadratique échantillonnée (n+1 points). */
  function quadPts(p0, p1, p2, n) {
    var out = [], i;
    for (i = 0; i <= n; i++) {
      var t = i / n, u = 1 - t;
      out.push([
        u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
        u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]
      ]);
    }
    return out;
  }

  /** Contour radial : r(θ) donné par une fonction, n points. */
  function radialPts(cx, cy, fn, n) {
    var out = [], i;
    for (i = 0; i < n; i++) {
      var a = (i / n) * TAU, r = fn(a);
      out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return out;
  }

  /** Épaissit une ligne moyenne : renvoie un polygone fermé (aller par la gauche, retour par la droite).
   *  hw : nombre, tableau (même longueur) ou fonction de u ∈ [0,1]. */
  function stroke(line, hw) {
    var n = line.length, left = [], right = [], i;
    for (i = 0; i < n; i++) {
      var p = line[i];
      var a = line[Math.max(0, i - 1)], b = line[Math.min(n - 1, i + 1)];
      var dx = b[0] - a[0], dy = b[1] - a[1];
      var L = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / L, ny = dx / L;
      var w = typeof hw === 'function' ? hw(i / (n - 1)) : (typeof hw === 'number' ? hw : hw[i]);
      left.push([p[0] + nx * w, p[1] + ny * w]);
      right.push([p[0] - nx * w, p[1] - ny * w]);
    }
    right.reverse();
    return left.concat(right);
  }

  /** Ligne moyenne le long d'un arc de cercle. */
  function arcLine(cx, cy, r, a0, a1, n) { return arcPts(cx, cy, r, r, a0, a1, n); }

  /* =================================================================================
   * 2. Champs de distance signés (positif = intérieur) et opérations booléennes
   * ================================================================================= */

  function fCircle(cx, cy, r) {
    return function (x, y) { return r - Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)); };
  }
  function fEllipse(cx, cy, rx, ry) {
    var m = Math.min(rx, ry);
    return function (x, y) {
      var u = (x - cx) / rx, v = (y - cy) / ry;
      return (1 - Math.sqrt(u * u + v * v)) * m;
    };
  }
  /** Boîte à coins arrondis (hw, hh = demi-dimensions ; r = rayon de congé). */
  function fBox(cx, cy, hw, hh, r) {
    r = r || 0;
    return function (x, y) {
      var dx = Math.abs(x - cx) - (hw - r), dy = Math.abs(y - cy) - (hh - r);
      var ax = Math.max(dx, 0), ay = Math.max(dy, 0);
      var d = Math.sqrt(ax * ax + ay * ay) + Math.min(Math.max(dx, dy), 0) - r;
      return -d;
    };
  }
  /** Capsule (segment épaissi). */
  function fSeg(ax, ay, bx, by, r) {
    var bax = bx - ax, bay = by - ay, ll = bax * bax + bay * bay || 1;
    return function (x, y) {
      var pax = x - ax, pay = y - ay;
      var h = Math.max(0, Math.min(1, (pax * bax + pay * bay) / ll));
      var qx = pax - bax * h, qy = pay - bay * h;
      return r - Math.sqrt(qx * qx + qy * qy);
    };
  }
  function fUnion() {
    var fs = Array.prototype.slice.call(arguments);
    return function (x, y) {
      var m = -1e9;
      for (var i = 0; i < fs.length; i++) { var v = fs[i](x, y); if (v > m) m = v; }
      return m;
    };
  }
  function fSub(a, b) { return function (x, y) { return Math.min(a(x, y), -b(x, y)); }; }

  /* --- Marching squares : extraction des contours du champ (valeur 0) --------------- */

  var MS_TABLE = [
    [], [[3, 0]], [[0, 1]], [[3, 1]],
    [[1, 2]], null, [[0, 2]], [[3, 2]],
    [[2, 3]], [[2, 0]], null, [[2, 1]],
    [[1, 3]], [[1, 0]], [[0, 3]], []
  ];

  /** Extrait les boucles du contour f = 0 sur la boîte donnée. Renvoie [[ [x,y], … ], …]. */
  function contourOf(f, x0, y0, x1, y1, cell) {
    cell = cell || 1.6;
    var nx = Math.max(8, Math.min(160, Math.ceil((x1 - x0) / cell)));
    var ny = Math.max(8, Math.min(160, Math.ceil((y1 - y0) / cell)));
    var dx = (x1 - x0) / nx, dy = (y1 - y0) / ny;
    var vals = new Float64Array((nx + 1) * (ny + 1));
    var i, j;
    for (j = 0; j <= ny; j++) {
      for (i = 0; i <= nx; i++) vals[j * (nx + 1) + i] = f(x0 + i * dx, y0 + j * dy);
    }
    function V(a, b) { return vals[b * (nx + 1) + a]; }

    var pts = {}, link = {};
    function edge(e, i, j) {
      var v0 = V(i, j), v1 = V(i + 1, j), v2 = V(i + 1, j + 1), v3 = V(i, j + 1), t, k, px, py;
      if (e === 0) { t = v0 / (v0 - v1); k = 'h' + i + ',' + j; px = x0 + (i + t) * dx; py = y0 + j * dy; }
      else if (e === 1) { t = v1 / (v1 - v2); k = 'v' + (i + 1) + ',' + j; px = x0 + (i + 1) * dx; py = y0 + (j + t) * dy; }
      else if (e === 2) { t = v3 / (v3 - v2); k = 'h' + i + ',' + (j + 1); px = x0 + (i + t) * dx; py = y0 + (j + 1) * dy; }
      else { t = v0 / (v0 - v3); k = 'v' + i + ',' + j; px = x0 + i * dx; py = y0 + (j + t) * dy; }
      pts[k] = [px, py];
      return k;
    }
    function connect(ka, kb) {
      (link[ka] = link[ka] || []).push(kb);
      (link[kb] = link[kb] || []).push(ka);
    }

    for (j = 0; j < ny; j++) {
      for (i = 0; i < nx; i++) {
        var v0 = V(i, j), v1 = V(i + 1, j), v2 = V(i + 1, j + 1), v3 = V(i, j + 1);
        var c = (v0 > 0 ? 1 : 0) | (v1 > 0 ? 2 : 0) | (v2 > 0 ? 4 : 0) | (v3 > 0 ? 8 : 0);
        if (c === 0 || c === 15) continue;
        var segs = MS_TABLE[c];
        if (segs === null) {                       // cas ambigus (selle) : arbitrage par le centre
          var mid = (v0 + v1 + v2 + v3) / 4;
          if (c === 5) segs = mid > 0 ? [[0, 1], [2, 3]] : [[3, 0], [1, 2]];
          else segs = mid > 0 ? [[3, 0], [1, 2]] : [[0, 1], [2, 3]];

        for (var s = 0; s < segs.length; s++) connect(edge(segs[s][0], i, j), edge(segs[s][1], i, j));

    Object.keys(link).forEach(function (start) {
      if (used[start]) return;
      var loop = [], cur = start;
      while (cur && !used[cur]) {
        used[cur] = 1;
        loop.push(pts[cur]);
        var ns = link[cur], nxt = null;
        for (var q = 0; q < ns.length; q++) if (!used[ns[q]]) { nxt = ns[q]; break; }

    return loops;
  }

  function polyArea(p) {
    var a = 0;
    for (var i = 0, n = p.length; i < n; i++) {
      var q = p[(i + 1) % n];
      a += p[i][0] * q[1] - q[0] * p[i][1];

  /** Ré-échantillonne une boucle fermée à intervalle constant (12 à 40 points). */
  function resample(pts, forced) {
    var n = pts.length, seg = [], per = 0, i;
    for (i = 0; i < n; i++) {
      var a = pts[i], b = pts[(i + 1) % n];
      var d = Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1]));
      seg.push(d); per += d;

    var N = forced || Math.max(12, Math.min(40, Math.round(per / 7)));

    for (var k = 0; k < N; k++) {

  /** Forme organique : contour du champ f dans la boîte donnée, lissé et ré-échantillonné. */
  function csg(f, x0, y0, x1, y1, cell) {
    var loops = contourOf(f, x0, y0, x1, y1, cell);

    loops.sort(function (a, b) { return Math.abs(polyArea(b)) - Math.abs(polyArea(a)); });

  /* =================================================================================
   * 3. Enregistrement des découpes
   * ================================================================================= */

  var REG = {};
  var LIST = [];

  function round2(v) { return Math.round(v * 100) / 100; }

  /** Normalise (centrage sur le milieu du rectangle englobant) et enregistre une découpe. */
  function def(id, name, polys) {
    var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    polys.forEach(function (p) {
      p.forEach(function (q) {
        if (q[0] < minx) minx = q[0];
        if (q[0] > maxx) maxx = q[0];
        if (q[1] < miny) miny = q[1];
        if (q[1] > maxy) maxy = q[1];
      });
    });
    var cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
    var out = polys.map(function (p) {
      return p.map(function (q) { return [round2(q[0] - cx), round2(q[1] - cy)]; });
    });
    var shape = {
      id: id, name: name, polys: out,
      w: round2(maxx - minx), h: round2(maxy - miny)

  }

  /* --------------------------------------------------------------- formes de base */

  // Disque — la lune pleine, la tête, la roue.
  def('disc', 'Disque', [ellipsePts(0, 0, 30, 30, 32)]);

  // Anneau — un vrai trou (règle evenodd).
  def('ring', 'Anneau', [ellipsePts(0, 0, 34, 34, 34), ellipsePts(0, 0, 21, 21, 26)]);

  // Goutte — cercle du bas + pointe en haut, raccordés par les tangentes.

      var u = -1 + 2 * i / N;

    }
    for (i = N - 1; i >= 1; i--) {
      var v = -1 + 2 * i / N;

  // Aiguille — triangle très fin.
  def('thin_tri', 'Aiguille', [[[0, -50], [8, 50], [-8, 50]]]);

  // Triangle.
  def('tri', 'Triangle', [[[0, -34], [34, 28], [-34, 28]]]);

  // Carré.
  def('square', 'Carré', [[[-24, -24], [24, -24], [24, 24], [-24, 24]]]);

  // Barre.
  def('bar', 'Barre', [[[-32, -7], [32, -7], [32, 7], [-32, 7]]]);

  // Longue barre.
  def('long_bar', 'Longue barre', [[[-64, -5.5], [64, -5.5], [64, 5.5], [-64, 5.5]]]);

  // Arc — bande annulaire ouverte vers la droite.
  (function () {

    def('arc', 'Arc', [p]);

  // Crochet — hampe droite puis boucle.
  (function () {

    def('hook', 'Crochet', [stroke(line, function (u) { return 6.5 - 2.2 * u; })]);

  // Peigne — barre dentée.
  (function () {
    var p = [[-40, -10], [40, -10], [40, 4]];

    centres.forEach(function (c) { p.push([c + 4, 4], [c + 4, 28], [c - 4, 28], [c - 4, 4]); });
    p.push([-40, 4]);
    def('comb', 'Peigne', [p]);
  })();

  // Coin — part de tarte pointant vers la droite.
  (function () {
    var p = [[0, 0]].concat(arcPts(0, 0, 56, 56, -25, 25, 12));

  })();

  // Masse — trois disques fondus, forme de corps.
  def('blob', 'Masse', csg(fUnion(fCircle(0, 0, 26), fCircle(17, -11, 20), fCircle(-15, 13, 18)),
    -50, -50, 50, 50, 2.0));

  // Étoile à cinq branches.
  (function () {
    var p = [], i;

  // Croix.
  (function () {
    var a = 9, b = 34;
    def('cross', 'Croix', [[
      [-a, -b], [a, -b], [a, -a], [b, -a], [b, a], [a, a],
      [a, b], [-a, b], [-a, a], [-b, a], [-b, -a], [-a, -a]
    ]]);
  })();

  // Cœur — feuille cordiforme.
  (function () {
    var p = [], i, N = 34;
    for (i = 0; i < N; i++) {
      var t = (i / N) * TAU;
      var x = 16 * Math.pow(Math.sin(t), 3);

    var apex = [0, 30], N = 30, p = [apex], i;
    for (i = 0; i <= N; i++) {
      var u = i / N;
      var a = (-145 + 110 * u) * DEG;
      var r = 62 + 4 * Math.cos(u * 5 * TAU);
      p.push([apex[0] + Math.cos(a) * r, apex[1] + Math.sin(a) * r]);
    }
    def('fan', 'Éventail', [p]);
  })();

  // Clé — anneau percé, tige, panneton.
  def('key', 'Clé', csg(fSub(
    fUnion(fCircle(-44, 0, 18), fBox(0, 0, 46, 5, 2), fBox(21, 10, 4.5, 10, 1.5), fBox(35, 10, 4.5, 10, 1.5)),

    fCircle(-24, -9, 12), fCircle(24, -9, 12), fCircle(-24, 9, 12), fCircle(24, 9, 12)

  // Dent — couronne et deux racines.
  def('tooth', 'Dent', csg(fUnion(
    fBox(0, -10, 21, 15, 9),
    fSeg(-11, -2, -14, 32, 6.5), fSeg(11, -2, 14, 32, 6.5)

  def('pebble', 'Caillou', [radialPts(0, 0, function (a) {
    return 28 + 4.5 * Math.cos(2 * a + 1) + 3 * Math.cos(3 * a + 2.2) + 1.8 * Math.cos(5 * a + 0.4);
  }, 28)]);

  /* ------------------------------------------- formes figuratives partielles */

  // Tête de profil (museau à droite), avec l'œil percé.
  def('head', 'Tête de profil', csg(fSub(
    fUnion(
      fEllipse(0, 0, 30, 26),
      fCircle(-9, -6, 22),
      fSeg(14, 2, 40, 7, 11),

    fCircle(15, -7, 4.6)
  ), -46, -36, 56, 40, 1.5));

  // Oreille — pointue, légèrement courbe.
  (function () {
    var outer = quadPts([-13, 25], [24, 4], [2, -27], 13);

  // Patte — coussinet et quatre doigts (les doigts ne se touchent pas : pas de trou parasite).
  def('paw', 'Patte', csg(fUnion(
    fEllipse(0, 6, 23, 18),
    fCircle(-19, -7, 5.4), fCircle(-7, -10.5, 6.5), fCircle(7, -10.5, 6.5), fCircle(19, -7, 5.4)

  // Aile — plume échancrée, racine à gauche.
  def('wing', 'Aile', csg(fSub(
    fUnion(fEllipse(0, 0, 46, 21), fSeg(-40, -8, 32, -14, 10)),
    fUnion(fCircle(-30, 26, 11), fCircle(-14, 28, 11), fCircle(2, 29, 11), fCircle(18, 27, 11), fCircle(34, 24, 11))

  // Queue — fouet courbe qui s'affine.
  (function () {
    var line = arcLine(0, 44, 46, 202, 340, 18);
    def('tail', 'Queue', [stroke(line, function (u) { return 12 * Math.pow(1 - u, 0.8) + 1.2; })]);

    fSeg(-4, 2, -5, -25, 4.8),

    fSeg(14, 5, 17, -13, 4.4),

    fBox(0, 0, 34, 12, 4),
    fCircle(0, -42, 42)
  ), -40, -18, 40, 18, 1.3));

  // Barreau — tige fine (grille, cage, hampe).
  def('rod', 'Barreau', [[[-55, -2.6], [55, -2.6], [55, 2.6], [-55, 2.6]]]);

  // Corne — cône recourbé.
  (function () {
    var line = arcLine(24, 14, 42, 152, 238, 16);
    def('horn', 'Corne', [stroke(line, function (u) { return 11.5 * Math.pow(1 - u, 0.75) + 0.8; })]);
  })();

  // Griffe — petit crochet acéré.
  (function () {
    var line = arcLine(14, -8, 28, 62, 158, 14);
    def('claw', 'Griffe', [stroke(line, function (u) { return 7.5 * Math.pow(1 - u, 0.7) + 0.5; })]);
  })();

  /* =================================================================================
   * 4. API publique
   * ================================================================================= */

  var shapes = {
    /** Liste des identifiants disponibles. */
    list: LIST.slice(),

    /** Renvoie la découpe { id, name, polys, w, h } ou null. */
    get: function (id) { return REG[id] || null; },

    /** Vrai si l'identifiant existe. */
    has: function (id) { return !!REG[id]; },

    /** Construit le tracé des polygones dans le contexte (sans remplir ni tracer). */
    path: function (ctx, shape) {

  BP.shapes = shapes;

<script>
/* ---- js/levels.js ---- */
'use strict';
/* Bêtes de Papier — tableaux, actes et générateurs (BP.levels).
 *
 * Voir SPEC §3. Chaque tableau porte une `solution` : une configuration qui produit la cible.
 * La cible étant toujours rendue à partir de la solution, tout tableau est atteignable à 100 %.
 *
 * Contrainte géométrique respectée partout (vérifiée par le script de contrôle) :
 * sous CHACUNE des lampes, l'ombre de chaque pièce tient dans le drap 400×300 avec 10 de marge.
 * Rappel : sous la lampe j, le centre de l'ombre est décalé de (L0 - Lj) * (k - 1) ; avec deux
 * lampes écartées de 100, une pièce à la profondeur 4 (k = 2) voit son ombre bleue décalée de 100.
 */
window.BP = window.BP || {};
(function (BP) {

  var DRAP_W = BP.DRAP_W, DRAP_H = BP.DRAP_H, MARGIN = 10;

  /* =================================================================================
   * 1. Fabriques
   * ================================================================================= */

  /** Lampe unique, ambre, au centre. */
  function warmLamps() { return [{ x: 200, y: 150, tint: 'warm' }]; }
  /** Deux lampes de couleur : cuivre rouge à gauche, verre bleu à droite. */
  function twoLamps() {
    return [{ x: 150, y: 150, tint: 'red' }, { x: 250, y: 150, tint: 'blue' }];
  }

  /** Pièce : p(forme, sx, sy, { d:profondeur, r:rotation, t:basculement, f:miroir, m:matière }). */
  function p(shape, sx, sy, o) {
    o = o || {};
    return {
      shape: shape, sx: sx, sy: sy,
      depth: o.d || 0, rot: o.r || 0, tilt: o.t || 0,
      flip: !!o.f, material: o.m || 'paper'

  }

  /** Coût minimal en manipulations d'une pièce : pose, glisser, profondeurs, rotations, etc. */
  function pieceCost(pc) {
    var c = 1;                                            // pose depuis le coffre
    // (le glisser depuis le coffre dépose déjà la pièce à sa place : pas de coût supplémentaire)
    c += pc.depth;                                        // profondeur+ répétée
    var steps = (((pc.rot % 360) + 360) % 360) / 15;
    c += Math.min(steps, 24 - steps);                     // rotation dans le sens le plus court
    c += pc.tilt;                                         // le basculement cycle 0→1→2
    if (pc.flip) c += 1;
    return c;
  }

  /** Par d'un tableau : coût minimal estimé + un peu d'air. */
  function parFor(sol, slack) {
    var s = 0;
    for (var i = 0; i < sol.length; i++) s += pieceCost(sol[i]);
    return Math.round(s) + (slack == null ? 2 : slack);
  }

  /** Par d'une représentation : la pose de départ, puis deux manipulations par changement. */
  function parForBeats(beats, slack) {
    var s = parFor(beats[0].solution, 0), i, j;
    for (i = 1; i < beats.length; i++) {
      var prev = beats[i - 1].solution, cur = beats[i].solution, changed = 0;
      var n = Math.max(prev.length, cur.length);
      for (j = 0; j < n; j++) {
        var a = prev[j], b = cur[j];
        if (!a || !b || a.shape !== b.shape || a.sx !== b.sx || a.sy !== b.sy ||
          a.depth !== b.depth || a.rot !== b.rot || a.tilt !== b.tilt ||
          a.flip !== b.flip || a.material !== b.material) changed++;
      }
      s += changed * 2;
    }
    return s + (slack == null ? 3 : slack);
  }

  /** Étiquette de coffre d'une pièce ('leaf' ou 'leaf:oiled'). */
  function tag(pc) { return pc.material === 'oiled' ? pc.shape + ':oiled' : pc.shape; }

  /** Coffre = pièces de la solution + leurres, mélangé de façon déterministe
   *  (l'ordre ne doit rien révéler de la solution). */
  function makeCoffre(id, sols, leurres) {
    var i, k;
    // Doublons requis : on garde le maximum de chaque étiquette sur l'ensemble des beats.
    var need = {};
    for (i = 0; i < sols.length; i++) {
      var count = {};
      for (k = 0; k < sols[i].length; k++) { var t = tag(sols[i][k]); count[t] = (count[t] || 0) + 1; }
      Object.keys(count).forEach(function (t) { need[t] = Math.max(need[t] || 0, count[t]); });
    }
    var out = [];
    Object.keys(need).forEach(function (t) { for (var q = 0; q < need[t]; q++) out.push(t); });
    out = out.concat(leurres || []);
    // On mélange jusqu'à ce que la tête du coffre ne recopie plus l'ordre de la solution.
    var head = sols[0].map(tag).join('|'), mixed = out, attempt = 0;
    do {
      mixed = BP.rng('coffre-' + id + (attempt ? '-' + attempt : '')).shuffle(out);
      attempt++;
    } while (attempt < 6 && mixed.slice(0, sols[0].length).join('|') === head);
    return mixed;
  }

          p('key', 268, 152, { d: 3, r: 15 }),
          p('claw', 168, 100, { d: 1, r: 330 }),
          p('pan', 140, 216, { d: 1 })
        ]
      }
    ],
    leurres: ['disc', 'bar', 'leaf', 'tri']
  });

  /* =================================================================================
   * 5. Assemblage
   * ================================================================================= */

  var ACT_TITLES = { 1: 'Les foires', 2: 'Les villes fermées', 3: 'Le procès' };

  function finish(list, act) {
    return list.map(function (lv, i) {
      lv.act = act;
      lv.index = i + 1;
      lv.type = lv.type || 'tableau';
      lv.readings = lv.readings || ['main'];
      lv.unlocks = lv.unlocks || [];
      var sols = lv.type === 'performance'
        ? lv.beats.map(function (b) { return b.solution; })
        : [lv.solution];
      if (lv.type === 'performance') lv.solution = lv.beats[0].solution.map(function (q) {
        return { shape: q.shape, sx: q.sx, sy: q.sy, depth: q.depth, rot: q.rot, tilt: q.tilt, flip: q.flip, material: q.material };
      });
      lv.coffre = lv.coffre || makeCoffre(lv.id, sols, lv.leurres);
      if (lv.par == null) lv.par = lv.type === 'performance' ? parForBeats(lv.beats) : parFor(lv.solution);
      delete lv.leurres;
      return lv;
    });
  }

  var acts = [
    { act: 1, title: ACT_TITLES[1], levels: finish(A1, 1) },
    { act: 2, title: ACT_TITLES[2], levels: finish(A2, 2) },
    { act: 3, title: ACT_TITLES[3], levels: finish(A3, 3) }
  ];

  var all = [];
  acts.forEach(function (a) { all = all.concat(a.levels); });
  var index = {};
  all.forEach(function (lv) { index[lv.id] = lv; });

  /* =================================================================================
   * 6. Générateurs (improvisation, tournée)
   * ================================================================================= */

  /** Rectangle englobant de l'ombre d'une pièce sous la lampe j. */
  function projBounds(piece, lamps, j) {
    var sh = BP.shapes.get(piece.shape);
    if (!sh) return null;
    var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (var a = 0; a < sh.polys.length; a++) {
      var poly = sh.polys[a];
      for (var b = 0; b < poly.length; b++) {
        var q = BP.projectPoint(poly[b][0], poly[b][1], piece, lamps, j);
        if (q.x < minx) minx = q.x;
        if (q.x > maxx) maxx = q.x;
        if (q.y < miny) miny = q.y;
        if (q.y > maxy) maxy = q.y;
      }
    }
    return { minx: minx, miny: miny, maxx: maxx, maxy: maxy };
  }

  /** Vrai si l'ombre de la pièce tient dans le drap (marge 10) sous TOUTES les lampes. */
  function fits(piece, lamps) {
    for (var j = 0; j < lamps.length; j++) {
      var b = projBounds(piece, lamps, j);
      if (!b) return false;
      if (b.minx < MARGIN || b.miny < MARGIN) return false;
      if (b.maxx > DRAP_W - MARGIN || b.maxy > DRAP_H - MARGIN) return false;
    }
    return true;
  }
  var POOL_FIGURE = ['head', 'ear', 'paw', 'wing', 'tail', 'beak', 'crown', 'hand', 'horn', 'claw',
    'leaf', 'drop', 'crescent', 'blade', 'hook', 'heart_leaf', 'fan', 'key', 'bone', 'egg',
    'tooth', 'pebble', 'blob', 'star', 'wave', 'comb', 'arc'];
  var POOL_NEUTRE = ['disc', 'ring', 'square', 'bar', 'long_bar', 'rod', 'wedge', 'tri',
    'thin_tri', 'cross', 'pebble', 'egg', 'arc', 'blob'];

  var NOMS = ['sept pattes', 'la longue oreille', 'deux gueules', 'la crête de papier',
    'l\'aile cassée', 'la queue de fumée', 'la corne unique', 'la main ouverte',
    'la couronne renversée', 'trois yeux', 'la lune dans le ventre', 'la griffe patiente',
    'l\'échine courbe', 'la dent de lait', 'le bec fermé', 'la plume de suie'];

  // Rotations tirées au sort : jamais plus de quatre crans, pour que le par reste jouable.
  var ROTS = [0, 0, 0, 15, 345, 30, 330, 45, 315, 60, 300];

  /** Tire une pièce au hasard qui tient dans le drap ; null après trop d'essais. */
  function randomPiece(r, pool, lamps, maxDepth, allowTilt) {
    for (var attempt = 0; attempt < 60; attempt++) {
      var piece = p(r.pick(pool), 0, 0, {
        d: r.int(0, maxDepth),
        r: r.pick(ROTS),
        t: allowTilt ? (r() < 0.22 ? r.int(1, 2) : 0) : 0,
        f: r() < 0.35
      });
      // Position tirée autour du centre du drap (deux tirages moyennés = compositions groupées).
      piece.sx = BP.clamp(Math.round((200 + (r() + r() - 1) * 95) / 4), 14, 86) * 4;
      piece.sy = BP.clamp(Math.round((150 + (r() + r() - 1) * 72) / 4), 10, 65) * 4;
      if (fits(piece, lamps)) return piece;
      // Deuxième chance : on aplatit la profondeur avant d'abandonner ce tirage.
      while (piece.depth > 0) {
        piece.depth--;
        if (fits(piece, lamps)) return piece;
      }
    }
    return null;
  }

  /** Composition aléatoire déterministe. */
  function generate(seedKey, opts) {
    var r = BP.rng(seedKey);
    var lamps = opts.lamps;
    var sol = [], guard = 0;
    while (sol.length < opts.count && guard++ < 400) {
      var piece = randomPiece(r, opts.pool, lamps, opts.maxDepth, opts.allowTilt);
      if (piece) sol.push(piece);
    }
    if (!sol.length) sol.push(p('disc', 200, 150));
    var leurres = [];
    for (var i = 0; i < opts.leurres; i++) leurres.push(r.pick(opts.pool));
    return { solution: sol, leurres: leurres };
  }

  /** Improvisation du jour : graine libre (l'UI passe AAAAMMJJ).
   *  Le par est le coût minimal réel de la composition (au moins deux manipulations par pièce,
   *  plus les crans de profondeur et de rotation), augmenté d'une manipulation d'aisance. */
  function makeImprov(seed) {
    var key = 'improv-' + seed;
    var r = BP.rng(key + '-meta');
    var count = r.int(3, 5);
    var g = generate(key, {
      lamps: warmLamps(), pool: POOL_FIGURE, count: count,
      maxDepth: 3, allowTilt: true, leurres: r.int(1, 3)
    });
    var lv = {
      id: 'improv-' + seed, act: 0, index: 0, type: 'tableau',
      title: 'Improvisation : la bête à ' + r.pick(NOMS),
      intro: 'Personne ne l\'a jamais nommée. Trouve-lui une ombre avant que le tambour ne s\'arrête.',
      outro: 'Une bête de plus au répertoire.',
      hint: 'Regarde la cible en fantôme : les pièces les plus grandes sont les plus proches de la lampe.',
      lamps: warmLamps(), readings: ['main'], unlocks: [],
      solution: g.solution,
      coffre: makeCoffre(key, [g.solution], g.leurres),
      par: parFor(g.solution, 1)
    };
    return lv;
  }

  /** Étape de tournée : difficulté croissante, coffre qui s'appauvrit. */
  function makeTournee(seed, stage) {
    stage = Math.max(1, stage | 0);
    var key = 'tour-' + seed + '-' + stage;
    var r = BP.rng(key + '-meta');
    var count = Math.min(6, 1 + Math.ceil(stage / 2));
    var two = stage > 4;
    var lamps = two ? twoLamps() : warmLamps();
    var readings = two ? (stage > 7 ? ['red', 'blue', 'umbra'] : ['red', 'blue']) : ['main'];
    var pool = stage > 6 ? POOL_NEUTRE : POOL_FIGURE;
    var leurres = Math.max(0, 3 - Math.floor(stage / 3));
    var g = generate(key, {
      lamps: lamps, pool: pool, count: count,
      maxDepth: two ? 3 : 4, allowTilt: stage > 2, leurres: leurres
    });
    return {
      id: 'tour-' + seed + '-' + stage, act: 0, index: stage, type: 'tableau',
      title: 'Étape ' + stage + ' : la bête à ' + r.pick(NOMS),
      intro: stage === 1
        ? 'La tournée commence. Une ville, une ombre, et on repart.'
        : 'Ville suivante. Le coffre s\'allège, le public grossit.',
      outro: 'On plie le drap. La route continue.',
      hint: 'Le coffre contient exactement ce qu\'il faut — et parfois un peu de trop.',
      lamps: lamps, readings: readings, unlocks: [],
      solution: g.solution,
      coffre: makeCoffre(key, [g.solution], g.leurres),
      par: parFor(g.solution, 1)
    };
  }

  /* =================================================================================
   * 7. API publique
   * ================================================================================= */

  BP.levels = {
    acts: acts,
    all: all,
    byId: function (id) { return index[id] || null; },
    next: function (id) {
      var i = all.findIndex ? all.findIndex(function (l) { return l.id === id; }) : -1;
      if (i < 0) { for (var k = 0; k < all.length; k++) if (all[k].id === id) { i = k; break; } }
      return (i >= 0 && i + 1 < all.length) ? all[i + 1] : null;
    },
    makeImprov: makeImprov,
    makeTournee: makeTournee,
    // utilitaires partagés (rendu de miniatures, outils de contrôle)
    projBounds: projBounds,
    fits: fits,
    parFor: parFor
  };
})(window.BP);

</script>

/* ---- js/audio.js ---- */
'use strict';
/* Bêtes de Papier — audio.
 *
 * Tout est synthétisé à la volée avec la Web Audio API : aucun fichier, aucune dépendance.
 * Palette : troupe ambulante d'Europe du Sud-Est / Anatolie —
 *   saz pincé (Karplus-Strong doublé et désaccordé), tambour à main (dum/tek),
 *   cloches et bois (synthèse modale inharmonique), flûte de roseau (bruit soufflé + résonateur),
 *   papier (grains de bruit passe-bande), lampe à suif (bruit rose modulé + crépitements),
 *   public (bruit à formants) — le tout dans une petite salle basse (réverbération à

      if (!budget(1)) return;
      var dur = o.dur || 0.12;
      var s = noiseSrc(false);
      s.playbackRate.value = rnd(0.85, 1.15);
      var f = bpf(1, 3.6);
      var a = o.from || (dir >= 0 ? 900 : 3200);
      var b = o.to || (dir >= 0 ? 3400 : 800);
      f.frequency.setValueAtTime(a, t0);
      f.frequency.exponentialRampToValueAtTime(b, t0 + dur);
      var g = gainNode(0.0001);
      var lv = o.level != null ? o.level : 0.32;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(lv, t0 + dur * 0.25);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      var p = panner(rnd(-0.25, 0.25));
      s.connect(f); f.connect(g); g.connect(p); p.connect((o.bus || busSfx).in);
      fire(s, t0, t0 + dur + 0.03, [f, g, p]);
    }

    /* Frottement long de tissu (rideau). */
    function clothRustle(t0, dur, level) {
      if (!budget(2)) return;
      var s = noiseSrc(true, true);
      s.playbackRate.value = rnd(0.8, 1.1);
      var f = bpf(600, 0.8);
      f.frequency.setValueAtTime(420, t0);
      f.frequency.linearRampToValueAtTime(1500, t0 + dur * 0.45);
      f.frequency.linearRampToValueAtTime(500, t0 + dur);
      var hp = hpf(220);
      var g = gainNode(0.0001);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(level, t0 + dur * 0.35);
      g.gain.linearRampToValueAtTime(level * 0.75, t0 + dur * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      /* frémissement d'amplitude */
      var lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = rnd(2.4, 4.2);
      var lg = gainNode(level * 0.35);
      lfo.connect(lg); lg.connect(g.gain);
      var p = panner(rnd(-0.2, 0.2));
      s.connect(f); f.connect(hp); hp.connect(g); g.connect(p); p.connect(busSfx.in);
      fire(s, t0, t0 + dur + 0.05, [f, hp, g, p]);
      fire(lfo, t0, t0 + dur + 0.05, [lg]);
    }

    /* ------------------------------------------------------------------ */
    /* Flûte de roseau (ney)                                               */
    /* ------------------------------------------------------------------ */

    function ney(t0, freq, dur, vel, bus) {
      if (!budget(3)) return;
      bus = bus || busMusic;
      vel = vel != null ? vel : 0.5;
      var s = noiseSrc(true);
      s.playbackRate.value = rnd(0.9, 1.1);

      var r1 = bpf(freq, 24);           // résonateur à haut Q = la hauteur
      var r2 = bpf(freq * 2, 14);
      var r3 = bpf(freq * 3, 9);
      var g1 = gainNode(1.0), g2 = gainNode(0.34), g3 = gainNode(0.12);
      var breath = hpf(2200);
      var gb = gainNode(0.035);

      var out = gainNode(0.0001);
      var atk = Math.min(0.16, dur * 0.35);
      out.gain.setValueAtTime(0.0001, t0);
      out.gain.exponentialRampToValueAtTime(Math.max(0.002, vel * 15), t0 + atk);
      out.gain.setValueAtTime(Math.max(0.002, vel * 15), t0 + Math.max(atk, dur - 0.22));
      out.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      /* vibrato irrégulier : deux LFO incommensurables + léger souffle de hauteur */
      var v1 = ctx.createOscillator(); v1.type = 'sine'; v1.frequency.value = rnd(4.1, 5.0);
      var v2 = ctx.createOscillator(); v2.type = 'sine'; v2.frequency.value = rnd(6.3, 7.9);
      var vg1 = gainNode(freq * 0.012), vg2 = gainNode(freq * 0.006);
      var vdep = gainNode(0.0001);
      vdep.gain.setValueAtTime(0.0001, t0);
      vdep.gain.linearRampToValueAtTime(1, t0 + Math.min(0.5, dur * 0.6));
      v1.connect(vg1); v2.connect(vg2);
      vg1.connect(vdep); vg2.connect(vdep);
      vdep.connect(r1.frequency); vdep.connect(r2.frequency);

      s.connect(r1); r1.connect(g1); g1.connect(out);
      s.connect(r2); r2.connect(g2); g2.connect(out);
      s.connect(r3); r3.connect(g3); g3.connect(out);
      s.connect(breath); breath.connect(gb); gb.connect(out);
      var p = panner(rnd(-0.15, 0.15));
      out.connect(p); p.connect(bus.in);

      fire(s, t0, t0 + dur + 0.08, [r1, r2, r3, g1, g2, g3, breath, gb, out, p]);
      fire(v1, t0, t0 + dur + 0.08, [vg1]);
      fire(v2, t0, t0 + dur + 0.08, [vg2, vdep]);
    }

    /* ------------------------------------------------------------------ */
    /* Ambiance : lampe + public                                            */
    /* ------------------------------------------------------------------ */

    var amb = {
      on: false,
      audience: 0.25,
      lampSrc: null, lampGain: null,
      audSrc: null, audGain: null,
      nextCrackle: 0, nextBrown: 0, nextGrain: 0,
      brown: 0
    };

    function buildAmbience() {
      if (amb.lampSrc) return;
      /* lampe : bruit rose passe-bas ~800 Hz, amplitude en mouvement brownien lent */
      var s = noiseSrc(true, true);
      s.playbackRate.value = 0.85;
      var f = lpf(800, 0.7);
      var hp = hpf(80);
      var g = gainNode(0.10);
      s.connect(f); f.connect(hp); hp.connect(g); g.connect(busAmb.in);
      try { s.start(0); } catch (e) {}
      amb.lampSrc = s; amb.lampGain = g;

      /* public : bruit granulaire passé par deux formants */
      var a = noiseSrc(true, true);
      a.playbackRate.value = 0.55;
      var f1 = bpf(500, 4.5), f2 = bpf(1500, 6);
      var ag1 = gainNode(3.2), ag2 = gainNode(2.0);
      var ag = gainNode(0.0001);
      var alp = lpf(2600, 0.6);
      a.connect(f1); f1.connect(ag1); ag1.connect(ag);
      a.connect(f2); f2.connect(ag2); ag2.connect(ag);
      ag.connect(alp); alp.connect(busAmb.in);
      try { a.start(0); } catch (e) {}
      amb.audSrc = a; amb.audGain = ag;
    }

    function ambienceSchedule(until) {
      if (!amb.on) return;
      var t;
      /* mouvement brownien lent sur la lampe */
      while (amb.nextBrown < until) {
        t = Math.max(amb.nextBrown, ctx.currentTime);
        amb.brown = clamp(amb.brown + rnd(-0.28, 0.28), -1, 1);
        var lv = 0.075 + 0.038 * amb.brown;
        try { amb.lampGain.gain.setTargetAtTime(lv, t, 0.22); } catch (e) {}
        amb.nextBrown += rnd(0.12, 0.3);
      }
      /* crépitements (processus de Poisson) */
      while (amb.nextCrackle < until) {
        t = Math.max(amb.nextCrackle, ctx.currentTime + 0.001);
        if (budget(1)) {
          var s = noiseSrc(false);
          s.playbackRate.value = rnd(0.8, 1.4);
          var f = bpf(rnd(900, 3400), rnd(1.5, 5));
          var g = gainNode(0.0001);
          var d = rnd(0.004, 0.018);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(rnd(0.03, 0.14), t + 0.001);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          var p = panner(rnd(-0.5, 0.5));
          s.connect(f); f.connect(g); g.connect(p); p.connect(busAmb.in);
          fire(s, t, t + d + 0.02, [f, g, p]);
        }
        amb.nextCrackle += -Math.log(1 - Math.random()) * 0.55;   // ~1.8 crépitement/s
      }
      /* public : densité pilotée par setAudience */
      var v = amb.audience;
      try { amb.audGain.gain.setTargetAtTime(0.0001 + v * 0.30, ctx.currentTime, 0.5); } catch (e) {}
      while (amb.nextGrain < until) {
        t = Math.max(amb.nextGrain, ctx.currentTime + 0.001);
        if (v > 0.02 && budget(1) && chance(0.35 + v * 0.6)) {
          var gs = noiseSrc(true, true);
          gs.playbackRate.value = rnd(0.5, 0.9);
          var gf = bpf(rnd(380, 1700), rnd(3, 7));
          var gg = gainNode(0.0001);
          var gd = rnd(0.06, 0.28);
          gg.gain.setValueAtTime(0.0001, t);
          gg.gain.linearRampToValueAtTime(rnd(0.05, 0.20) * (0.25 + v), t + gd * 0.4);
          gg.gain.exponentialRampToValueAtTime(0.0001, t + gd);
          var gp = panner(rnd(-0.7, 0.7));
          gs.connect(gf); gf.connect(gg); gg.connect(gp); gp.connect(busAmb.in);
          fire(gs, t, t + gd + 0.03, [gf, gg, gp]);
        }
        amb.nextGrain += rnd(0.09, 0.34) / (0.35 + v);
      }
    }

    function setAmbience(on) {
      on = !!on;
      if (on === amb.on) return;
      amb.on = on;
      if (on) {
        buildAmbience();
        var now = ctx.currentTime;
        amb.nextCrackle = now + 0.2; amb.nextBrown = now + 0.05; amb.nextGrain = now + 0.3;
        try { amb.lampGain.gain.setTargetAtTime(0.075, now, 0.8); } catch (e) {}
        startClock();
      } else if (amb.lampGain) {
        try { amb.lampGain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.4); } catch (e) {}
        try { amb.audGain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.4); } catch (e) {}
      }
    }

    /* Applaudissements                                                     */
    /* ------------------------------------------------------------------ */

    /* Grains d'applaudissements à densité décroissante, à un instant donné. */
    function applauseAt(t0, v, dur) {
      v = clamp(v != null ? v : 0.6, 0, 1);
      dur = dur || (1.5 + v * 2.5);                   // 1.5 s .. 4 s
      var mix = gainNode(0.9);
      var wide = panner(0);
      mix.connect(wide); wide.connect(busSfx.in);
      var t = t0, n = 0;
      var maxGrains = offline ? 900 : 380;
      while (t < t0 + dur && n < maxGrains) {
        var frac = (t - t0) / dur;
        var dens = (14 + v * 46) * Math.exp(-frac * 2.1) + 3;   // densité décroissante
        if (budget(1)) {
          var s = noiseSrc(false);
          s.playbackRate.value = rnd(0.7, 1.4);
          var f = bpf(rnd(1100, 3600), rnd(0.8, 2.4));
          var g = gainNode(0.0001);
          var d = rnd(0.006, 0.016);
          var amp = rnd(0.14, 0.55) * (0.5 + v * 0.6) * (1 - frac * 0.5);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(Math.max(0.0004, amp), t + 0.0015);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          var p = panner(rnd(-0.85, 0.85));
          s.connect(f); f.connect(g); g.connect(p); p.connect(mix);
          fire(s, t, t + d + 0.01, [f, g, p]);
          n++;
        }
        t += -Math.log(1 - Math.random()) / dens;
      }
      /* quelques « bravo » : formants glissants */
      if (v > 0.45) {
        var shouts = rndi(1, 1 + Math.round(v * 3));
        for (var i = 0; i < shouts; i++) bravo(t0 + rnd(0.25, dur * 0.7), mix);
      }
      var stop = ctx.createBufferSource();
      stop.buffer = getWhite(); stop.loop = true;
      var mute = gainNode(0);
      stop.connect(mute); mute.connect(master);
      fire(stop, t0, t0 + dur + 0.6, [mute, mix, wide]);
    }

    function applause(v) { applauseAt(ctx.currentTime + 0.02, v); }

    function bravo(t0, dest) {
      if (!budget(2)) return;
      var d = rnd(0.28, 0.5);
      var s = noiseSrc(true, true);
      s.playbackRate.value = rnd(0.6, 1.0);
      var f1 = bpf(700, 7), f2 = bpf(1200, 8);
      var a = rnd(0.75, 1.3);
      f1.frequency.setValueAtTime(620 * a, t0);
      f1.frequency.linearRampToValueAtTime(430 * a, t0 + d);
      f2.frequency.setValueAtTime(1100 * a, t0);
      f2.frequency.linearRampToValueAtTime(1650 * a, t0 + d);
      var g1 = gainNode(1), g2 = gainNode(0.6);
      var g = gainNode(0.0001);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(rnd(0.10, 0.22), t0 + d * 0.25);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      var p = panner(rnd(-0.8, 0.8));
      s.connect(f1); f1.connect(g1); g1.connect(g);
      s.connect(f2); f2.connect(g2); g2.connect(g);
      g.connect(p); p.connect(dest || busSfx.in);
      fire(s, t0, t0 + d + 0.05, [f1, f2, g1, g2, g, p]);
    }
