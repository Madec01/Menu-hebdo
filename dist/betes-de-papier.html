    /* ---------------- séquenceur musical ---------------- */

    var music = {
      name: null,
      theme: null,
      gain: null,
      drone: null,
      next: 0,          // prochaine note (temps absolu)
      idx: 0,
      beat: 0,          // position en temps depuis le début
      intensity: 0.55,
      stopAt: 0,
      dead: false
    };
    var oldMusics = [];
    var FADE = 1.5;

    function makeDrone(theme, dest, level) {
      var root = theme.root * Math.pow(2, theme.droneOct || 0);
      var g = gainNode(0.0001);
      var band = bpf(root * 2.4, 1.6);
      var lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.055 + Math.random() * 0.04;
      var lg = gainNode(root * 1.1);
      lfo.connect(lg); lg.connect(band.frequency);
      var soft = lpf(1800, 0.5);
      band.connect(soft); soft.connect(g); g.connect(dest);

      var oscs = [];
      var specs = [
        { f: root, det: -9, a: 0.5 },
        { f: root, det: +11, a: 0.5 },
        { f: root * 1.5, det: -6, a: 0.22 }
      ];
      for (var i = 0; i < specs.length; i++) {
        var o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = specs[i].f;
        o.detune.value = specs[i].det;
        var og = gainNode(specs[i].a);
        o.connect(og); og.connect(band);
        try { o.start(0); } catch (e) {}
        oscs.push(o, og);
      }
      try { lfo.start(0); } catch (e) {}
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.linearRampToValueAtTime(level, ctx.currentTime + 2.0);
      return {
        gain: g, level: level,
        stop: function (when) {
          try { g.gain.cancelScheduledValues(when); } catch (e) {}
          try { g.gain.setTargetAtTime(0.0001, when, 0.4); } catch (e) {}
          for (var k = 0; k < oscs.length; k++) {
            if (oscs[k].stop) { try { oscs[k].stop(when + 2.2); } catch (e) {} }
          }
          try { lfo.stop(when + 2.2); } catch (e) {}
          lfo.onended = function () {
            try { g.disconnect(); band.disconnect(); soft.disconnect(); lg.disconnect(); } catch (e) {}
          };
        }
      };
    }

    function startTheme(name, t0) {
      var theme = THEMES[name];
      if (!theme) return;
      var g = gainNode(0.0001);
      g.connect(busMusic.in);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(1, t0 + FADE);
      music = {
        name: name, theme: theme, gain: g, bus: { in: g },
        drone: makeDrone(theme, g, 0.042 * (theme.droneLevel || 0.5) + 0.006),
        next: t0 + 0.05, idx: 0, beat: 0,
        intensity: music.intensity, dead: false
      };
    }

    function fadeOutMusic(m, t0) {
      if (!m || !m.gain || m.dead) return;
      m.dead = true;
      try { m.gain.gain.cancelScheduledValues(t0); } catch (e) {}
      try { m.gain.gain.setValueAtTime(m.gain.gain.value, t0); } catch (e) {}
      try { m.gain.gain.linearRampToValueAtTime(0.0001, t0 + FADE); } catch (e) {}
      if (m.drone) m.drone.stop(t0);
      m.stopAt = t0 + FADE + 2.4;
      oldMusics.push(m);
    }

    function musicSchedule(until) {
      /* nettoyage des thèmes en cours d'extinction */
      for (var i = oldMusics.length - 1; i >= 0; i--) {
        if (oldMusics[i].stopAt < ctx.currentTime) {
          try { oldMusics[i].gain.disconnect(); } catch (e) {}
          oldMusics.splice(i, 1);
        }
      }
      var m = music;
      if (!m.theme || m.dead) return;
      var th = m.theme;
      var mbus = m.bus;
      var beatDur = 60 / th.bpm;
      var iv = clamp(m.intensity, 0, 1);
      var motif = th.motif;

      while (m.next < until) {
        var t = m.next;
        if (t < ctx.currentTime) t = ctx.currentTime + 0.005;
        var step = motif[m.idx % motif.length];
        var dur = step.b * beatDur;
        var barPos = m.beat % th.beatsPerBar;
        var strong = Math.abs(barPos) < 0.001;

        if (!step.r) {
          var f = th.root * degRatio(SCALES[th.scale], step.d);
          var vel = (step.v != null ? step.v : 0.5) * (0.85 + rnd(-0.09, 0.09));
          /* silences aléatoires : la troupe respire */
          var skip = chance(0.05 + (1 - iv) * 0.10) && !strong;
          if (!skip) {
            var lvl = (th.sazLevel || 0.5) * (0.42 + 0.58 * iv);
            if (th.voice === 'ney') {
              ney(t, f, Math.max(0.35, dur * 0.92), vel * lvl * 0.42, mbus);
              if (iv > 0.5 && chance(0.35)) {
                saz(t + dur * 0.5, f * 0.5, {
                  vel: vel * lvl * 0.5, double: iv > 0.62, damp: th.damp, bright: th.bright, bus: mbus
                });
              }
            } else {
              /* ornement : appogiature juste avant la note */
              if (iv > 0.5 && chance(0.10 + iv * 0.22)) {
                var od = chance(0.5) ? 1 : -1;
                var of = th.root * degRatio(SCALES[th.scale], step.d + od);
                saz(Math.max(ctx.currentTime + 0.001, t - 0.075), of, {
                  vel: vel * lvl * 0.42, double: false, damp: th.damp, bus: mbus,
                  bright: th.bright, pluck: rndi(2, 3), pan: rnd(-0.2, 0.2)
                });
              }
              saz(t, f, {
                vel: vel * lvl, double: iv > 0.32, doubleLevel: clamp((iv - 0.28) * 1.7, 0.15, 0.85),
                damp: th.damp, bright: th.bright, pluck: rndi(0, 3), pan: rnd(-0.18, 0.18),
                bus: mbus, dur: Math.max(0.7, dur * 2.2)
              });
              /* trille court sur les notes longues */
              if (iv > 0.72 && step.b >= 1.5 && chance(0.22)) {
                var tf = th.root * degRatio(SCALES[th.scale], step.d + 1);
                saz(t + dur * 0.45, tf, { vel: vel * lvl * 0.34, double: false, damp: th.damp, bright: th.bright, bus: mbus });
                saz(t + dur * 0.55, f, { vel: vel * lvl * 0.30, double: false, damp: th.damp, bright: th.bright, bus: mbus });
              }
            }
          }
        }

        /* petite cloche modale sur les temps forts quand l'intensité monte */
        if (strong && iv > 0.66 && th.bellLevel) {
          var everyBar = th.bellFar ? 4 : 2;
          if (Math.round(m.beat / th.beatsPerBar) % everyBar === 0) {
            var bf = th.root * degRatio(SCALES[th.scale], th.bellDeg) * (th.bellFar ? 2 : 2);
            modal(t, bf, {
              kind: 'bell',
              vel: th.bellLevel * (0.4 + (iv - 0.66) * 1.8) * (th.bellFar ? 0.5 : 1),
              decay: th.bellDecay, bus: mbus, pan: rnd(-0.4, 0.4),
              partials: th.bellFar ? 3 : 5
            });
          }
        }

        m.beat += step.b;
        m.next = t + dur;
        m.idx++;
        if (m.idx >= motif.length * 64) m.idx = m.idx % motif.length;
      }
    }

    /* ---------------- séquenceur de tambour ---------------- */

    var drumSeq = { on: false, steps: null, stepDur: 0.25, loopLen: 1, next: 0, pos: 0 };

    function parsePattern(pattern) {
      var steps = [], i;
      if (typeof pattern === 'string') {
        var sd = 60 / ((music.theme && music.theme.bpm) || 92) / 2;   // une croche
        for (i = 0; i < pattern.length; i++) {
          var c = pattern.charAt(i);
          if (c === 'D' || c === 'd') steps.push({ t: i * sd, type: 'dum', v: c === 'D' ? 1 : 0.7 });
          else if (c === 'T' || c === 't') steps.push({ t: i * sd, type: 'tek', v: c === 'T' ? 0.9 : 0.6 });
        }
        return { steps: steps, loopLen: pattern.length * sd };
      }
      if (Object.prototype.toString.call(pattern) === '[object Array]') {
        var maxT = 0;
        for (i = 0; i < pattern.length; i++) {
          var p = pattern[i];
          if (!p || p.type === 'rest') { if (p && p.t > maxT) maxT = p.t; continue; }
          steps.push({ t: p.t || 0, type: p.type === 'tek' ? 'tek' : 'dum', v: p.v != null ? p.v : 0.85 });
          if (p.t > maxT) maxT = p.t;
        }
        var len = pattern.loopLength || (maxT + (60 / ((music.theme && music.theme.bpm) || 92) / 2));
        return { steps: steps, loopLen: Math.max(0.2, len) };
      }
      return { steps: [], loopLen: 1 };
    }

    function startDrum(pattern) {
      var p = parsePattern(pattern);
      if (!p.steps.length) { stopDrum(); return; }
      drumSeq.on = true;
      drumSeq.steps = p.steps;
      drumSeq.loopLen = p.loopLen;
      drumSeq.next = ctx.currentTime + 0.06;
      drumSeq.pos = 0;
      startClock();
    }

    function stopDrum() { drumSeq.on = false; drumSeq.steps = null; }

    /* Planification coup par coup (motifs de longueur quelconque). */
    function drumSchedule(until) {
      if (!drumSeq.on || !drumSeq.steps) return;
      var guard = 0;
      while (guard++ < 400) {
        var loopIdx = Math.floor(drumSeq.pos / drumSeq.steps.length);
        var i = drumSeq.pos % drumSeq.steps.length;
        var s = drumSeq.steps[i];
        var t = drumSeq.next + loopIdx * drumSeq.loopLen + s.t;
        if (t >= until) break;
        if (t >= ctx.currentTime) drumHit(t, s.type, s.v * rnd(0.78, 1.05), busSfx);
        drumSeq.pos++;
      }
    }

    /* ---------------- horloge de planification ---------------- */

    var timer = null;

    function runSchedulers(until) {
      try { musicSchedule(until); } catch (e) { if (window.console) console.error('[BP.audio] music', e); }
      try { drumSchedule(until); } catch (e) { if (window.console) console.error('[BP.audio] drum', e); }
      try { ambienceSchedule(until); } catch (e) { if (window.console) console.error('[BP.audio] amb', e); }
    }

    function tick() {
      runSchedulers(ctx.currentTime + LOOKAHEAD);
      if (!music.theme && !drumSeq.on && !amb.on && !oldMusics.length) stopClock();
    }

    function startClock() {
      if (offline || timer) return;
      timer = setInterval(tick, TICK_MS);
      tick();
    }
    function stopClock() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    /* ------------------------------------------------------------------ */
    /* Effets                                                              */
    /* ------------------------------------------------------------------ */

    function arpeggio(t0, root, scale, degs, opts) {
      opts = opts || {};
      for (var i = 0; i < degs.length; i++) {
        var f = root * degRatio(SCALES[scale], degs[i]);
        saz(t0 + i * (opts.step || 0.085) + rnd(-0.006, 0.006), f, {
          vel: (opts.vel || 0.5) * (0.85 + i * 0.03), double: true, damp: opts.damp != null ? opts.damp : 2,
          bright: 5200, bus: busSfx, pan: rnd(-0.3, 0.3), pluck: rndi(0, 2)
        });
      }
    }

    var SFX = {
      pick: function (t) {
        paperBurst(t, { count: rndi(8, 11), spread: 0.045, level: 1.3, lo: 2400, hi: 6000, decay: true });
      },
      select: function (t) {
        paperBurst(t, { count: rndi(5, 8), spread: 0.022, level: 1.25, lo: 2600, hi: 6000, decay: true });
      },
      place: function (t) {
        paperBurst(t, { count: rndi(10, 15), spread: 0.06, level: 1.05, lo: 2000, hi: 5200, decay: true });
        if (budget(1)) {                                   // le papier qui touche la planche
          var s = noiseSrc(false);
          var f = lpf(320, 1.1);
          var g = gainNode(0.0001);
          env(g, t + 0.004, 0.42, 0.003, 0.075);
          var p = panner(rnd(-0.2, 0.2));
          s.connect(f); f.connect(g); g.connect(p); p.connect(busSfx.in);
          fire(s, t, t + 0.14, [f, g, p]);
        }
      },
      rotate: function (t) {
        paperBurst(t, { count: rndi(9, 14), spread: 0.09, level: 0.85, lo: 1800, hi: 5200, even: true, tiltUp: true });
      },
      depth: function (t, dir) {
        paperGlide(t, dir >= 0 ? 1 : -1, { level: 0.62 });
        paperBurst(t, { count: rndi(6, 9), spread: 0.05, level: 0.6, lo: 2600, hi: 6000, decay: true });
      },
      tilt: function (t) {
        paperBurst(t, { count: rndi(8, 12), spread: 0.07, level: 0.8, lo: 2200, hi: 5600, even: true });
        paperGlide(t + 0.01, -1, { level: 0.34, dur: 0.1, from: 2600, to: 1300 });
      },
      flip: function (t) {
        paperBurst(t, { count: rndi(6, 9), spread: 0.03, level: 0.85, lo: 2400, hi: 6000, decay: true });
        paperBurst(t + 0.065, { count: rndi(7, 11), spread: 0.045, level: 1.0, lo: 2000, hi: 5400, decay: true });
      },
      page: function (t) {
        paperBurst(t, { count: rndi(12, 15), spread: 0.16, level: 0.9, lo: 1800, hi: 5600, even: true, tiltUp: true });
        paperGlide(t + 0.02, 1, { level: 0.46, dur: 0.22, from: 700, to: 2600 });
      },
      remove: function (t) {                                // papier froissé
        paperBurst(t, { count: 15, spread: 0.18, level: 1.0, lo: 1800, hi: 6000 });
        paperBurst(t + 0.09, { count: 13, spread: 0.16, level: 0.78, lo: 2200, hi: 6000, decay: true });
        paperGlide(t + 0.02, -1, { level: 0.3, dur: 0.24, from: 3000, to: 900 });
      },
      undo: function (t) {
        paperBurst(t, { count: rndi(6, 9), spread: 0.03, level: 0.78, lo: 2600, hi: 6000, decay: true });
        paperGlide(t + 0.015, -1, { level: 0.6, dur: 0.13, from: 3200, to: 800 });
      },
      ui: function (t) { modal(t, 620, { kind: 'wood', vel: 0.16, decay: 0.16, partials: 3 }); },
      error: function (t) {                                 // corde étouffée grave
        pluckString(t, 98, { vel: 0.42, pluck: 0, damp: 0, dur: 0.5, bright: 1400, bus: busSfx, pan: 0 });
        pluckString(t + 0.01, 97.2, { vel: 0.30, pluck: 0, damp: 0, dur: 0.45, bright: 1200, bus: busSfx, pan: 0.1 });
        modal(t, 150, { kind: 'wood', vel: 0.12, decay: 0.2, partials: 2, bus: busSfx });
      },
      beat: function (t) { drumHit(t, 'dum', 0.95, busSfx); },
      star: function (t) { modal(t, 1180, { kind: 'bell', vel: 0.30, decay: 2.0, bus: busSfx }); },
      achievement: function (t) {
        modal(t, 880, { kind: 'bell', vel: 0.26, decay: 2.2, bus: busSfx, pan: -0.2 });
        modal(t + 0.19, 1320, { kind: 'bell', vel: 0.24, decay: 2.6, bus: busSfx, pan: 0.22 });
      },
      unlock: function (t) {
        saz(t, 293.66, { vel: 0.5, double: true, damp: 2, bright: 5200, bus: busSfx });
        modal(t + 0.14, 1174, { kind: 'tine', vel: 0.2, decay: 1.6, bus: busSfx, pan: 0.15 });
      },
      success: function (t) {
        arpeggio(t, 293.66, 'hijaz', [0, 2, 4, 7], { vel: 0.5, step: 0.09 });
        applauseAt(t + 0.32, 0.32, 0.9);
      },
      gold: function (t) {
        arpeggio(t, 293.66, 'hijaz', [0, 2, 3, 4, 6, 7, 9], { vel: 0.55, step: 0.075 });
        modal(t + 0.55, 1174, { kind: 'bell', vel: 0.28, decay: 3.0, bus: busSfx });
        applauseAt(t + 0.4, 0.95, 3.6);
      },
      curtain: function (t) {
        clothRustle(t, 1.7, 0.17);
        drumHit(t + 1.35, 'dum', 0.7, busSfx);
        drumHit(t + 1.55, 'tek', 0.45, busSfx);
      }
    };

    /* ------------------------------------------------------------------ */
    /* API du moteur                                                       */
    /* ------------------------------------------------------------------ */

    var api = {
      ctx: ctx,
      offline: offline,
      master: master,

      sfx: function (name, arg) {
        var fn = SFX[name];
        if (!fn) return;
        var t = ctx.currentTime + 0.005;
        fn(t, arg);
      },

      playMusic: function (name) {
        if (!THEMES[name]) return;
        var t0 = ctx.currentTime + 0.02;
        if (music.name === name && !music.dead) return;
        if (music.theme) fadeOutMusic(music, t0);
        startTheme(name, t0);
        startClock();
      },

      stopMusic: function () {
        if (music.theme) fadeOutMusic(music, ctx.currentTime + 0.01);
        music = { name: null, theme: null, gain: null, drone: null, next: 0, idx: 0, beat: 0, intensity: music.intensity, dead: true };
      },

      setIntensity: function (v) { music.intensity = clamp(v, 0, 1); },
      setAudience: function (v) { amb.audience = clamp(v, 0, 1); if (amb.on) startClock(); },
      applause: applause,
      ambience: setAmbience,
      drum: startDrum,
      stopDrum: stopDrum,

      setVolumes: function (v) {
        var t = ctx.currentTime;
        if (v.music != null) {
          busMusic.dry.gain.setTargetAtTime(0.62 * v.music, t, 0.05);
          busMusic.wet.gain.setTargetAtTime(0.30 * v.music, t, 0.05);
        }
        if (v.sfx != null) {
          busSfx.dry.gain.setTargetAtTime(0.85 * v.sfx, t, 0.05);
          busSfx.wet.gain.setTargetAtTime(0.20 * v.sfx, t, 0.05);
          busAmb.dry.gain.setTargetAtTime(0.40 * v.sfx, t, 0.05);
          busAmb.wet.gain.setTargetAtTime(0.12 * v.sfx, t, 0.05);
        }
      },

      setMuted: function (b) {
        master.gain.setTargetAtTime(b ? 0.0001 : 0.82, ctx.currentTime, 0.03);
      },

      /* Utilitaires internes (tests / rendu hors ligne) */
      _prerender: function (seconds, step) {
        step = step || 0.1;
        for (var t = 0; t < seconds + step; t += step) runSchedulers(t + step);
      },
      _themes: THEMES,
      _sfxAt: function (name, t, arg) { if (SFX[name]) SFX[name](t, arg); },
      _dispose: function () {
        stopClock();
        try { master.disconnect(); } catch (e) {}
      },
      _stats: function () { return { voices: voices, ks: ksKeys.length, old: oldMusics.length }; }
    };

    return api;
  }

  /* ------------------------------------------------------------------ */
  /* Façade publique                                                     */
  /* ------------------------------------------------------------------ */

  var engine = null;
  var ctx = null;
  var state = { muted: false, music: 0.7, sfx: 0.9, ready: false, wantAmbience: false, wantMusic: null, intensity: 0.55, audience: 0.25 };
  var visBound = false;
  var suspendedByHide = false;

  function ensure() { return engine; }

  var audio = {

    /** Crée le contexte audio. Idempotent. À appeler dans un geste utilisateur. */
    init: function () {
      if (engine || !AC) { if (!AC) state.ready = false; return !!engine; }
      try {
        ctx = new AC();
      } catch (e) {
        ctx = null;
        return false;
      }
      try {
        engine = createEngine(ctx);
      } catch (e2) {
        if (window.console) console.error('[BP.audio] init', e2);
        engine = null;
        return false;
      }
      state.ready = true;
      engine.setVolumes({ music: state.music, sfx: state.sfx });
      engine.setMuted(state.muted);
      engine.setIntensity(state.intensity);
      engine.setAudience(state.audience);
      if (state.wantAmbience) engine.ambience(true);
      if (state.wantMusic) engine.playMusic(state.wantMusic);

      if (!visBound && typeof document !== 'undefined' && document.addEventListener) {
        visBound = true;
        document.addEventListener('visibilitychange', function () {
          if (!ctx) return;
          if (document.hidden) {
            if (ctx.state === 'running') { suspendedByHide = true; try { ctx.suspend(); } catch (e) {} }
          } else if (suspendedByHide) {
            suspendedByHide = false;
            try { ctx.resume(); } catch (e) {}
          }
        }, false);
      }
      this.resume();
      return true;
    },

    /** Reprend le contexte (politique d'autoplay). */
    resume: function () {
      if (!ctx) return;
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    },

    isReady: function () { return !!engine; },
    state: function () { return ctx ? ctx.state : 'unavailable'; },

    setMuted: function (b) {
      state.muted = !!b;
      if (engine) engine.setMuted(state.muted);
    },

    setVolumes: function (v) {
      v = v || {};
      if (v.music != null) state.music = clamp(v.music, 0, 1);
      if (v.sfx != null) state.sfx = clamp(v.sfx, 0, 1);
      if (engine) engine.setVolumes({ music: state.music, sfx: state.sfx });
    },

    sfx: function (name, arg) { if (engine) engine.sfx(name, arg); },

    playMusic: function (theme) {
      state.wantMusic = theme;
      if (engine) engine.playMusic(theme);
    },

    stopMusic: function () {
      state.wantMusic = null;
      if (engine) engine.stopMusic();
    },

    setIntensity: function (v) {
      state.intensity = clamp(v, 0, 1);
      if (engine) engine.setIntensity(state.intensity);
    },

    setAudience: function (v) {
      state.audience = clamp(v, 0, 1);
      if (engine) engine.setAudience(state.audience);
    },

    applause: function (v) { if (engine) engine.applause(v); },

    drum: function (pattern) { if (engine) engine.drum(pattern); },
    stopDrum: function () { if (engine) engine.stopDrum(); },

    ambience: function (on) {
      state.wantAmbience = !!on;
      if (engine) engine.ambience(!!on);
    },

    /** Usage interne / tests : monte un moteur sur un contexte fourni (OfflineAudioContext). */
    _createEngine: function (c) { return createEngine(c); },
    _engine: function () { return engine; },
    _available: !!AC
  };

  if (!AC) {
    /* Aucun AudioContext : tout devient no-op silencieux. */
    for (var k in audio) {
      if (typeof audio[k] === 'function' && k !== '_createEngine' && k !== 'state') audio[k] = noop;
    }
    audio.init = function () { return false; };
    audio.isReady = function () { return false; };
    audio.state = function () { return 'unavailable'; };
    audio._createEngine = function () { return null; };
  }

  BP.audio = audio;

})(window.BP);

</script>
<script>
/* ---- js/core.js ---- */
'use strict';
/* =====================================================================================
   Bêtes de Papier — js/core.js
   Moteur du jeu : modèle des pièces, projection des ombres, masques et score,
   rendu canvas 2D, entrées unifiées (pointeur / clavier), mode représentation,
   et sauvegarde locale (BP.save).

   Ce fichier n'expose que `BP.engine` et `BP.save`. Tous les appels vers les autres
   modules (BP.shapes, BP.audio, BP.levels) sont gardés par une vérification.
   ===================================================================================== */
window.BP = window.BP || {};
(function (BP) {

  /* ===================================================================================
     0. Petits utilitaires internes
     =================================================================================== */

  var TAU = Math.PI * 2;
  var DEG = Math.PI / 180;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function isFn(f) { return typeof f === 'function'; }

  /** Appel défensif d'un effet sonore. */
  function sfx(name) {
    if (BP.audio && isFn(BP.audio.sfx)) { try { BP.audio.sfx(name); } catch (e) { /* silencieux */ } }
  }
  function audioIntensity(v) {
    if (BP.audio && isFn(BP.audio.setIntensity)) { try { BP.audio.setIntensity(v); } catch (e) { } }
  }

  /* ===================================================================================
     1. Sauvegarde — BP.save
     =================================================================================== */

  var SAVE_KEY = 'bp_save_v1';

  function saveDefaults() {
    return {
      levels: {},                 // { [id]: { best, stars, bestMoves, done } }
      achievements: {},           // { [id]: timestamp }
      settings: { music: 0.7, sfx: 0.9, muted: false, reduceMotion: false, sideView: true },
      improv: {},                 // { [dateKey]: { best, moves } }
      tournee: { best: 0, bestScore: 0 },
      seen: {}                    // { [unlock]: true }
    };
  }

  /** Fusion profonde : les clés absentes de `src` prennent la valeur par défaut. */
  function deepMerge(def, src) {
    if (src === null || src === undefined) return def;
    if (Object.prototype.toString.call(def) !== '[object Object]') {
      return (typeof src === typeof def) ? src : def;
    }
    if (Object.prototype.toString.call(src) !== '[object Object]') return def;
    var out = {}, k;
    for (k in def) if (Object.prototype.hasOwnProperty.call(def, k)) out[k] = deepMerge(def[k], src[k]);
    for (k in src) if (Object.prototype.hasOwnProperty.call(src, k) && !(k in out)) out[k] = src[k];
    return out;
  }

  var saveData = null;

  function saveLoad() {
    var def = saveDefaults(), raw = null;
    try { raw = window.localStorage ? window.localStorage.getItem(SAVE_KEY) : null; } catch (e) { raw = null; }
    if (!raw) return def;
    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    return deepMerge(def, parsed);
  }

  function savePersist() {
    try {
      if (window.localStorage) window.localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    } catch (e) { /* mode privé / quota : on continue en mémoire */ }
  }

  BP.save = {
    /** Objet persistant (toujours complété par la structure par défaut). */
    get: function () {
      if (!saveData) saveData = saveLoad();
      return saveData;
    },
    /** Applique un mutateur puis persiste. Renvoie l'objet. */
    set: function (mutator) {
      var d = BP.save.get();
      if (isFn(mutator)) { try { mutator(d); } catch (e) { console.error('[BP.save]', e); } }
      savePersist();
      return d;
    },
    /** Remet la sauvegarde à zéro. */
    reset: function () {
      saveData = saveDefaults();
      try { if (window.localStorage) window.localStorage.removeItem(SAVE_KEY); } catch (e) { }
      return saveData;
    },
    KEY: SAVE_KEY
  };

  /* ===================================================================================
     2. Découpes — accès défensif à BP.shapes
     =================================================================================== */

    coffre: [],            // [{ index, shape, material, name, pieceUid }]
    selected: null,
    moves: 0,
    undoCount: 0,
    undo: [],
    score: 0,
    scores: {},
    status: 'playing',     // 'playing' | 'won' | 'lost'

  function computeLayout() {
    var w = L.w, h = L.h;
    var pad = clamp(Math.round(Math.min(w, h) * 0.022), 6, 18);
    var portrait = h >= w;
    var band;

      // profite d'abord au coffre (cibles tactiles confortables), le reste sert de coulisses
      // et laisse la place au HUD (DOM) posé par l'UI.

  function paintRoomAndSheet(c) {

    roundRect(c, r.x, r.y, r.w, r.h, 5);
    c.fill();
    c.strokeStyle = 'rgba(160,124,70,0.45)';
    c.lineWidth = 1;
    c.stroke();

    var pad = 9;
    var x0 = r.x + pad, x1 = r.x + r.w - pad;
    var yc = r.y + r.h / 2;

    // Drap (à droite) et lampe (à gauche)
    c.strokeStyle = 'rgba(232,214,176,0.85)';
    c.lineWidth = 2;
    c.beginPath(); c.moveTo(x1, r.y + pad * 0.7); c.lineTo(x1, r.y + r.h - pad * 0.7); c.stroke();

    var lampCol = S.lamps.length > 1 ? ['rgba(216,90,80,0.95)', 'rgba(110,150,235,0.95)'] : ['rgba(255,206,138,0.95)'];
    var j;
    for (j = 0; j < S.lamps.length; j++) {
      var ly = yc + (S.lamps.length > 1 ? (j === 0 ? -7 : 7) : 0);
      c.fillStyle = lampCol[j] || lampCol[0];
      c.beginPath(); c.arc(x0, ly, 3.4, 0, TAU); c.fill();
    }

    // Plans de profondeur
    var d;
    for (d = 0; d < BP.DEPTHS.length; d++) {
      var t = BP.DEPTHS[d];
      var px = x0 + (x1 - x0) * t;
      c.strokeStyle = 'rgba(200,170,120,0.16)';
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(px, r.y + pad); c.lineTo(px, r.y + r.h - pad); c.stroke();
    }

    // Pièces posées
    var i;
    for (i = 0; i < S.pieces.length; i++) {
      var p = S.pieces[i];
      var px2 = x0 + (x1 - x0) * BP.DEPTHS[p.depth];
      var py = r.y + pad + (r.h - pad * 2) * clamp(p.sy / BP.DRAP_H, 0, 1);
      var sel = (p.uid === S.selected);
      c.strokeStyle = sel ? 'rgba(255,214,140,0.95)' : 'rgba(238,222,190,0.6)';
      c.lineWidth = sel ? 2.4 : 1.6;
      c.beginPath(); c.moveTo(px2, py - 4); c.lineTo(px2, py + 4); c.stroke();
    }

    c.fillStyle = 'rgba(226,208,172,0.6)';
    c.font = '9px Georgia, serif';
    c.textAlign = 'left'; c.textBaseline = 'top';
    c.fillText('profondeur', r.x + pad, r.y + 3);
    c.restore();
  }

  /* --- Représentation : barre de compte à rebours ---------------------------------- */

  function drawBeatBar(c) {
    if (!S.beat || S.perfPhase !== 'run') return;
    var b = S.beat;
    var w = L.drapW * 0.5, x = L.drapX + (L.drapW - w) / 2, y = L.drapY + 10, h = 4;
    var t = b.total > 0 ? clamp(b.remaining / b.total, 0, 1) : 0;
    c.save();
    c.globalAlpha = 0.85;
    c.fillStyle = 'rgba(60,40,20,0.28)';
    roundRect(c, x, y, w, h, h / 2); c.fill();
    c.fillStyle = t < 0.25 ? 'rgba(170,44,40,0.95)' : 'rgba(70,48,26,0.75)';
    roundRect(c, x, y, Math.max(2, w * t), h, h / 2); c.fill();
    c.font = '11px Georgia, serif';
    c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillStyle = 'rgba(60,42,22,0.8)';
    c.fillText('frappe ' + (b.index + 1) + ' / ' + (S.level.beats ? S.level.beats.length : 1), x + w / 2, y + h + 3);
    c.restore();
  }

  /* --- Fantôme de glisser depuis le coffre ------------------------------------------ */

  function drawDragGhost(c) {
    if (!drag.active || drag.kind !== 'coffre') return;
    var entry = S.coffre[drag.coffreIndex];
    if (!entry) return;
    var sh = getShape(entry.shape);
    var ext = shapeExtent(sh);
    var s = L.scale;
    c.save();
    c.globalAlpha = 0.55;
    c.translate(drag.px, drag.py - (drag.lift || 0));
    c.scale(s, s);
    c.translate(-ext.cx, -ext.cy);
    c.fillStyle = entry.material === 'oiled' ? 'rgba(40,28,16,0.5)' : 'rgba(40,28,16,0.85)';
    pathShape(c, sh);
    c.fill('evenodd');
    c.restore();
  }

  /* --- Frame complète --------------------------------------------------------------- */

  function render() {
    if (!ctx) return;
    var c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';

    drawSheet(c);
    drawTargetGhost(c, 'fill');
    drawShadows(c);
    drawGlassVeil(c);
    drawTargetGhost(c, 'line');
    drawSelection(c);
    drawBeatBar(c);
    drawSideView(c);
    drawCoffre(c);
    drawDragGhost(c);
  }

  /* ===================================================================================
     12. Boucle
     =================================================================================== */

  function frame(t) {
    rafId = 0;
    if (!running) return;
    if (paused) { running = false; return; }   // la boucle pourra être relancée
    var dt = lastTime ? Math.min(0.1, (t - lastTime) / 1000) : 0;
    lastTime = t;
    clock += dt;
    // Filet de sécurité (navigateurs sans ResizeObserver, panneaux d'UI qui apparaissent) :
    // on vérifie la taille du canvas une fois toutes les 20 images.
    if ((sizeCheck = (sizeCheck + 1) % 20) === 0 &&
        (canvas.clientWidth !== L.w || canvas.clientHeight !== L.h) &&
        canvas.clientWidth > 0 && canvas.clientHeight > 0) resize();
    updateFlicker(clock);
    tickPerformance(dt);
    tickCurtain(dt);
    render();
    rafId = window.requestAnimationFrame(frame);
  }

  function startLoop() {
    if (running || paused || !ctx) return;
    running = true; lastTime = 0;
    rafId = window.requestAnimationFrame(frame);
  }
  function stopLoop() {
    running = false;
    if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
  }

  /* ===================================================================================
     13. Score, victoire, sauvegarde du résultat
     =================================================================================== */

  function recompute(emitScore) {
    if (!S.level) return;
    S.rev++;
    masksFor(S.pieces, S.lamps, curMasks);
    var reads = S.readings, i, name, sc, min = 1;
    var out = S.scores;
    for (name in out) delete out[name];
    for (i = 0; i < reads.length; i++) {
      name = reads[i];
      sc = iouScore(readingMask(tgtMasks, name), readingMask(curMasks, name));
      out[name] = sc;
      if (sc < min) min = sc;
    }
    if (!reads.length) min = 0;
    S.score = min;
    audioIntensity(min);
    if (paused) render();   // en pause, on garde l'image à jour
    if (emitScore !== false) E.emit('score', { score: S.score, scores: S.scores });
    checkWin();
  }

  function starsFor(score, moves, par) {
    if (score < BP.PASS) return 0;
    if (score < BP.GOLD) return 1;
    return (par && moves <= par) ? 3 : 2;
  }

  // Temps d'attente avant que le rideau ne tombe quand le seuil de réussite est franchi mais
  // que l'ombre peut encore être améliorée : le monteur doit pouvoir finir son geste (poser la
  // dernière pièce, la tourner) et viser l'ovation sans être interrompu. Toute manipulation
  // relance le compte ; l'ovation, elle, fait tomber le rideau tout de suite.
  var CURTAIN_SETTLE = 5;
  var curtainWait = 0;

  function checkWin() {
    if (!S.level || S.level.type === 'performance') return;
    if (S.status === 'won') return;
    if (S.score < BP.PASS) { curtainWait = 0; return; }
    if (S.score >= BP.GOLD) { finishTableau(); return; }
    curtainWait = CURTAIN_SETTLE;
  }

  /** Décompte du rideau (appelé par la boucle ; la pause le suspend d'elle-même). */
  function tickCurtain(dt) {
    if (curtainWait <= 0) return;
    curtainWait -= dt;
    if (curtainWait <= 0) { curtainWait = 0; finishTableau(); }
  }

  function finishTableau() {
    curtainWait = 0;
    if (!S.level || S.status === 'won') return;
    var stars = starsFor(S.score, S.moves, S.level.par);
    S.bestStars = stars;
    S.status = 'won';
    saveResult(S.score, stars, S.moves);
    sfx(S.score >= BP.GOLD ? 'gold' : 'success');
    E.emit('won', { score: S.score, stars: stars, moves: S.moves, par: S.level.par, level: S.level });
  }

  function saveResult(score, stars, moves) {
    if (!S.level || S.mode !== 'story') return;
    var id = S.level.id;
    if (!id) return;
    BP.save.set(function (d) {
      var r = d.levels[id] || (d.levels[id] = { best: 0, stars: 0, bestMoves: 0, done: false });
      if (score > (r.best || 0)) r.best = score;
      if (stars > (r.stars || 0)) r.stars = stars;
      if (!r.bestMoves || moves < r.bestMoves) r.bestMoves = moves;
      r.done = true;
    });
  }

  /* ===================================================================================
     14. Chargement d'un tableau
     =================================================================================== */

  function parseCoffre(list) {
    var out = [], i;
    list = list || [];
    for (i = 0; i < list.length; i++) {
      var raw = String(list[i]), material = 'paper', id = raw;
      var k = raw.indexOf(':');
      if (k >= 0) { id = raw.slice(0, k); material = (raw.slice(k + 1) === 'oiled') ? 'oiled' : 'paper'; }
      out.push({ index: i, key: raw, shape: id, material: material, pieceUid: null });
    }
    return out;
  }

  /** Trouve une entrée libre du coffre correspondant à (shape, material). */
  function takeCoffreEntry(shape, material) {
    var i;
    for (i = 0; i < S.coffre.length; i++) {
      var e = S.coffre[i];
      if (e.pieceUid === null && e.shape === shape && e.material === material) return e;
    }
    // Repli : même découpe, matière différente.
    for (i = 0; i < S.coffre.length; i++) {
      if (S.coffre[i].pieceUid === null && S.coffre[i].shape === shape) return S.coffre[i];
    }
    return null;
  }

  function setTarget(solution) {
    targetPieces.length = 0;
    var i, list = solution || [];
    for (i = 0; i < list.length; i++) targetPieces.push(makePiece(list[i], 't' + i));
    masksFor(targetPieces, S.lamps, tgtMasks);
    targetPathDirty = true;
  }

  function loadLevel(level, options) {
    if (!level) return;
    options = options || {};
    S.level = level;
    S.mode = options.mode || 'story';
    S.lamps = lampsOf(level);
    S.readings = (level.readings && level.readings.length) ? level.readings.slice() : ['main'];
    S.pieces = [];
    S.coffre = parseCoffre(level.coffre);
    S.selected = null;
    S.moves = 0;
    S.undoCount = 0;
    S.undo.length = 0;
    S.status = 'playing';
    S.bestStars = 0;
    curtainWait = 0;
    S.view = 'all';
    S.showTarget = true;
    S.beat = null;
    S.perfPhase = (level.type === 'performance') ? 'prep' : 'none';
    uidSeq = 1;

    setTarget(level.solution);

    // Représentation : la configuration de départ est posée d'office.
    if (level.type === 'performance' && level.solution) {
      var i;
      for (i = 0; i < level.solution.length; i++) {
        var spec = level.solution[i];
        var p = makePiece(spec);
        var e = takeCoffreEntry(p.shape, p.material);
        if (e) e.pieceUid = p.uid;
        clampPiece(p, S.lamps);
        S.pieces.push(p);
      }
    }

    if (canvas) resize(); else computeLayout();   // re-mesure (l'UI a pu changer la mise en page)
    emitUnlocks(level);
    recompute();
    E.emit('select', null);
    startLoop();
    if (paused) render();   // en pause, on montre tout de même le tableau chargé
  }

  function emitUnlocks(level) {
    var list = level.unlocks || [], i, fresh = [];
    var d = BP.save.get();
    for (i = 0; i < list.length; i++) if (!d.seen[list[i]]) fresh.push(list[i]);
    // Le marquage « vu » est fait par l'UI après le tutoriel ; le moteur se contente de signaler.
    for (i = 0; i < fresh.length; i++) E.emit('unlock', fresh[i]);
  }

  /* ===================================================================================
     15. Historique (undo)
     =================================================================================== */

  function snapshot() {
    var ps = [], i, p;
    for (i = 0; i < S.pieces.length; i++) {
      p = S.pieces[i];
      ps.push({ uid: p.uid, shape: p.shape, sx: p.sx, sy: p.sy, depth: p.depth, rot: p.rot, tilt: p.tilt, flip: p.flip, material: p.material });
    }
    var cf = [];
    for (i = 0; i < S.coffre.length; i++) cf.push(S.coffre[i].pieceUid);
    return { pieces: ps, coffre: cf, selected: S.selected, moves: S.moves };
  }

  function pushUndo() {
    S.undo.push(snapshot());
    if (S.undo.length > 120) S.undo.shift();
  }

  function restoreSnapshot(sn) {
    S.pieces = sn.pieces;
    var i;
    for (i = 0; i < S.coffre.length; i++) S.coffre[i].pieceUid = (i < sn.coffre.length ? sn.coffre[i] : null);
    S.selected = sn.selected;
    S.moves = sn.moves;
  }

  function countMove() {
    S.moves++;
    E.emit('move', { moves: S.moves });
  }

  /* ===================================================================================
     16. Actions
     =================================================================================== */

  function pieceByUid(uid) {
    for (var i = 0; i < S.pieces.length; i++) if (S.pieces[i].uid === uid) return S.pieces[i];
    return null;
  }

  function selectedPiece() { return S.selected ? pieceByUid(S.selected) : null; }

  function setSelected(uid) {
    if (S.selected === uid) return;
    S.selected = uid;
    E.emit('select', uid);
  }

  function coffreEntryOfPiece(uid) {
    for (var i = 0; i < S.coffre.length; i++) if (S.coffre[i].pieceUid === uid) return S.coffre[i];
    return null;
  }

  /** Pose la pièce du coffre `index` à (wx, wy) — centre du drap par défaut. */
  function placeFromCoffre(index, wx, wy) {
    var e = S.coffre[index];
    if (!e) { sfx('error'); return null; }
    if (e.pieceUid !== null) { sfx('error'); return null; }
    pushUndo();
    var p = makePiece({
      shape: e.shape,
      sx: snapGrid(wx === undefined ? BP.DRAP_W / 2 : wx),
      sy: snapGrid(wy === undefined ? BP.DRAP_H / 2 : wy),
      depth: 0, rot: 0, tilt: 0, flip: false, material: e.material
    });
    clampPiece(p, S.lamps);
    S.pieces.push(p);
    e.pieceUid = p.uid;
    setSelected(p.uid);
    countMove();
    sfx('place');
    E.emit('place', { uid: p.uid, shape: p.shape });
    recompute();
    return p;
  }

  function removePiece(uid) {
    var p = pieceByUid(uid);
    if (!p) { sfx('error'); return; }
    pushUndo();
    var e = coffreEntryOfPiece(uid);
    if (e) e.pieceUid = null;
    var i = S.pieces.indexOf(p);
    if (i >= 0) S.pieces.splice(i, 1);
    if (S.selected === uid) setSelected(null);
    countMove();
    sfx('remove');
    E.emit('remove', { uid: uid });
    recompute();
  }

  function actOnSelected(name, arg) {
    var p = selectedPiece();
    if (!p) { sfx('error'); return false; }
    var changed = false;
    switch (name) {
      case 'depth+':
        if (p.depth < BP.DEPTHS.length - 1) { pushUndo(); p.depth++; clampPiece(p, S.lamps); changed = true; sfx('depth'); E.emit('depth', { uid: p.uid, depth: p.depth }); }
        break;
      case 'depth-':
        if (p.depth > 0) { pushUndo(); p.depth--; clampPiece(p, S.lamps); changed = true; sfx('depth'); E.emit('depth', { uid: p.uid, depth: p.depth }); }
        break;
      case 'rot+':
      case 'rot-':
        pushUndo();
        p.rot = ((p.rot + (name === 'rot+' ? BP.ROT_STEP : -BP.ROT_STEP)) % 360 + 360) % 360;
        clampPiece(p, S.lamps);
        changed = true; sfx('rotate'); E.emit('rotate', { uid: p.uid, rot: p.rot });
        break;
      case 'tilt':
        pushUndo();
        p.tilt = (p.tilt + 1) % BP.TILTS.length;
        clampPiece(p, S.lamps);
        changed = true; sfx('tilt'); E.emit('tilt', { uid: p.uid, tilt: p.tilt });
        break;
      case 'flip':
        pushUndo();
        p.flip = !p.flip;
        clampPiece(p, S.lamps);
        changed = true; sfx('flip'); E.emit('flip', { uid: p.uid, flip: p.flip });
        break;
      case 'nudge':
        var dx = (arg && arg.dx) || 0, dy = (arg && arg.dy) || 0;
        if (!dx && !dy) return false;
        pushUndo();
        p.sx = p.sx + dx * BP.GRID;   // déplacement relatif : conserve le réseau de la pièce
        p.sy = p.sy + dy * BP.GRID;
        clampPiece(p, S.lamps);
        changed = true; sfx('pick'); E.emit('place', { uid: p.uid, nudge: true });
        break;
      case 'remove':
        removePiece(p.uid);
        return true;
    }
    if (changed) { countMove(); recompute(); }
    else if (name !== 'remove') sfx('error');
    return changed;
  }

  function undo() {
    if (!S.undo.length) { sfx('error'); return; }
    var sn = S.undo.pop();
    var prevSel = S.selected;
    restoreSnapshot(sn);
    S.undoCount++;
    sfx('undo');
    if (prevSel !== S.selected) E.emit('select', S.selected);
    E.emit('undo', { undoCount: S.undoCount });
    recompute();
  }

  function reset() {
    if (!S.level) return;
    S.pieces = [];
    S.coffre = parseCoffre(S.level.coffre);
    S.selected = null;
    S.moves = 0;
    S.undo.length = 0;
    if (S.level.type === 'performance' && S.level.solution) {
      var i;
      for (i = 0; i < S.level.solution.length; i++) {
        var p = makePiece(S.level.solution[i]);
        var e = takeCoffreEntry(p.shape, p.material);
        if (e) e.pieceUid = p.uid;
        clampPiece(p, S.lamps);
        S.pieces.push(p);
      }
    }
    layoutCoffre();
    sfx('undo');
    E.emit('select', null);
    E.emit('reset', {});
    recompute();
  }

  function selectNext() {
    if (!S.pieces.length) { setSelected(null); return; }
    var i = -1, k;
    for (k = 0; k < S.pieces.length; k++) if (S.pieces[k].uid === S.selected) { i = k; break; }
    var next = S.pieces[(i + 1) % S.pieces.length];
    setSelected(next.uid);
    sfx('select');
  }

  /* ===================================================================================
     17. Mode représentation
     =================================================================================== */

  function startCurtain() {
    if (!S.level || S.level.type !== 'performance') { sfx('error'); return; }
    var beats = S.level.beats || [];
    if (!beats.length) { sfx('error'); return; }
    S.perfPhase = 'run';
    S.status = 'playing';
    S.beat = { index: 0, remaining: beats[0].seconds || 8, total: beats[0].seconds || 8, scores: [] };
    setTarget(beats[0].solution);
    sfx('curtain');
    if (BP.audio && isFn(BP.audio.drum)) { try { BP.audio.drum(S.level.drum || 'performance'); } catch (e) { } }
    recompute();
  }

  function tickPerformance(dt) {
    if (S.perfPhase !== 'run' || !S.beat) return;
    var beats = S.level.beats || [];
    S.beat.remaining -= dt;
    if (S.beat.remaining > 0) return;

    // Fin du beat : on fige le score.
    recompute(false);
    var sc = S.score;
    S.beat.scores.push(sc);
    // Mémorise aussi les scores par lecture de cette frappe (pour l'épilogue et l'écran de fin).
    S.beat.readingScores = S.beat.readingScores || [];
    S.beat.readingScores.push(S.scores ? JSON.parse(JSON.stringify(S.scores)) : {});
    E.emit('beat', { index: S.beat.index, score: sc, scores: S.beat.scores.slice() });
    sfx('beat');

    var next = S.beat.index + 1;
    if (next < beats.length) {
      S.beat.index = next;
      S.beat.total = beats[next].seconds || 8;
      S.beat.remaining = S.beat.total;
      setTarget(beats[next].solution);
      recompute();
    } else {
      finishPerformance();
    }
  }

  function finishPerformance() {
    var list = S.beat ? S.beat.scores : [];
    var sum = 0, worst = 1, i;
    for (i = 0; i < list.length; i++) { sum += list[i]; if (list[i] < worst) worst = list[i]; }
    var avg = list.length ? sum / list.length : 0;
    S.perfPhase = 'over';
    S.beat.remaining = 0;
    S.score = avg;
    // Score moyen par lecture sur l'ensemble des frappes (objet {main|red|blue|umbra}).
    var rs = S.beat.readingScores || [], byReading = {}, r, k;
    for (r = 0; r < rs.length; r++) for (k in rs[r]) if (rs[r].hasOwnProperty(k)) byReading[k] = (byReading[k] || 0) + rs[r][k] / rs.length;
    S.scores = byReading;
    if (BP.audio && isFn(BP.audio.stopDrum)) { try { BP.audio.stopDrum(); } catch (e) { } }
    var ok = (avg >= BP.PASS && worst >= 0.75);
    if (ok) {
      var stars = starsFor(avg, S.moves, S.level.par);
      if (stars < 1) stars = 1;
      S.status = 'won';
      S.bestStars = stars;
      saveResult(avg, stars, S.moves);
      sfx(avg >= BP.GOLD ? 'gold' : 'success');
      E.emit('won', { score: avg, stars: stars, moves: S.moves, par: S.level.par, level: S.level, scores: byReading, beatScores: list.slice() });
    } else {
      S.status = 'lost';
      sfx('error');
      E.emit('lost', { scores: list.slice(), score: avg });
    }
    E.emit('score', { score: S.score, scores: S.scores });
  }

  /* ===================================================================================
     18. Test de survol (point dans polygone, règle evenodd)
     =================================================================================== */

  // Tampon réutilisé pour les points projetés.
  var hitBuf = new Float64Array(4096);

  function pieceHit(piece, wx, wy) {
    var sh = getShape(piece.shape);
    pieceMatrix(piece, S.lamps, 0, MAT);
    var a = MAT[0], b = MAT[1], c = MAT[2], d = MAT[3], e = MAT[4], f = MAT[5];
    var ps = sh.polys, i, q, p, n, inside = false;
    for (i = 0; i < ps.length; i++) {
      p = ps[i]; if (!p || p.length < 3) continue;
      n = p.length;
      if (n * 2 > hitBuf.length) hitBuf = new Float64Array(n * 2 * 2);
      for (q = 0; q < n; q++) {
        hitBuf[q * 2] = a * p[q][0] + c * p[q][1] + e;
        hitBuf[q * 2 + 1] = b * p[q][0] + d * p[q][1] + f;
      }
      var j2 = n - 1;
      for (q = 0; q < n; q++) {
        var xi = hitBuf[q * 2], yi = hitBuf[q * 2 + 1];

        ring.style.width = a.width + 12 + 'px'; ring.style.height = a.height + 12 + 'px';
        wrap.appendChild(ring);
      }
    } else arrow.hidden = true;
    void wrap.offsetWidth;
    wrap.classList.add('in');
    var close = function () {
      bubbleOpts = null;
      wrap.classList.remove('in');
      setTimeout(function () {
        if (bubbleOpts) return;   // une autre bulle a pris la place
        tutoLayer.hidden = true; tutoLayer.innerHTML = '';
      }, 220);
      sfx('page');
      if (o.onClose) o.onClose();
    };
    wrap.addEventListener('click', close);
  }

  /* ------------------------------------------------------------- pause */

  function screenPause() {
    if (BP.engine && BP.engine.setPaused) BP.engine.setPaused(true);
    ctx.playing = false; stopPlayLoop();
    showScreen('pause', function (sec) {
      sec.innerHTML = '<div class="carnet narrow">' +
        '<h2>Entracte</h2>' +
        '<div class="menu-col">' + btn('Reprendre', 'primary js-res', I.play) +
        btn('Recommencer le tableau', 'js-again', I.reset) +
        btn('Options', 'js-opt', I.gear) +
        btn(ctx.mode === 'tournee' ? 'Abandonner la tournée' : 'Carte de la tournée', 'ghost js-map', I.map) +
        '</div></div>';
      bind(sec, '.js-res', function () {
        hideScreens(); ctx.playing = true;
        if (BP.engine && BP.engine.setPaused) BP.engine.setPaused(false);
        hudShow(); startPlayLoop(); kickResize();
      });
      bind(sec, '.js-again', function () { restartLevel(); });
      bind(sec, '.js-opt', function () { screenOptions('pause'); });
      bind(sec, '.js-map', function () {
        if (ctx.mode === 'tournee') { endTournee('abandon'); return; }
        hudHide(); A('ambience', false); A('playMusic', 'menu');
        if (ctx.mode === 'story') screenMap(); else screenTitle();
      });
    });
  }

  /* --------------------------------------------------------- fin de tableau */

  function onWon(d) {
    d = d || {};
    if (d.success === false || d.lost === true) { onLost(d); return; }
    ctx.playing = false; stopPlayLoop();
    var st = engineState();
    var level = ctx.level || d.level || st.level || {};
    var score = (d.score !== undefined) ? d.score : (st.score || 0);
    var moves = (d.moves !== undefined) ? d.moves : (st.moves || 0);
    var par = d.par || level.par || 0;
    var stars = (d.stars !== undefined) ? d.stars : computeStars(score, moves, par);
    var scores = d.scores || st.scores || {};
    ctx.lastResult = { score: score, moves: moves, stars: stars, scores: scores, level: level };

    noteShapesUsed();
    if (ctx.mode === 'story') {
      SAVE(function (s) {
        var r = s.levels[level.id] || { best: 0, stars: 0, bestMoves: 0, done: false };
        r.best = Math.max(r.best || 0, score);
        r.stars = Math.max(r.stars || 0, stars);
        r.bestMoves = r.bestMoves ? Math.min(r.bestMoves, moves) : moves;
        r.done = true;
        s.levels[level.id] = r;
      });
    } else if (ctx.mode === 'improv') {
      var key = ctx.improvKey;
      SAVE(function (s) {
        var r = s.improv[key] || { best: 0, moves: 0 };
        if (score > (r.best || 0)) { r.best = score; r.moves = moves; }
        s.improv[key] = r;
      });
    } else if (ctx.mode === 'tournee' && ctx.tour) {
      ctx.tour.scores.push(score);
      ctx.tour.total += score;
      if (ctx.tour.stage >= 5) grant('tournee_5');
      if (ctx.tour.stage >= 10) grant('tournee_10');
      SAVE(function (s) {
        if (ctx.tour.stage > (s.tournee.best || 0)) s.tournee.best = ctx.tour.stage;
        if (ctx.tour.total > (s.tournee.bestScore || 0)) s.tournee.bestScore = ctx.tour.total;
      });
    }
    checkAchievements({ level: level, state: st, score: score, stars: stars, moves: moves, mode: ctx.mode, scores: scores });

    A('setIntensity', 1);
    A('applause', Math.max(0, Math.min(1, (score - 0.7) / 0.3)));
    sfx(score >= (BP.GOLD || 0.97) ? 'gold' : 'success');

    var isFinale = ctx.mode === 'story' && level.act === 3 && level.type === 'performance';
    screenResult(level, score, stars, moves, par, scores, isFinale);
  }

  function computeStars(score, moves, par) {
    var pass = BP.PASS || 0.9, gold = BP.GOLD || 0.97;
    if (score < pass) return 0;
    if (score < gold) return 1;
    return (par && moves <= par) ? 3 : 2;
  }

  function screenResult(level, score, stars, moves, par, scores, isFinale) {
    hudHide();
    var nextLv = null;
    if (ctx.mode === 'story' && BP.levels && BP.levels.next) { try { nextLv = BP.levels.next(level.id); } catch (e) { } }
    showScreen('result', function (sec) {
      var readings = level.readings || [];
      var detail = readings.length > 1 ? '<ul class="read-list">' + readings.map(function (r) {
        return '<li><span>' + readingLabel(r) + '</span><b>' + pct(scores[r] || 0) + '</b></li>';
      }).join('') + '</ul>' : '';
      var actions = '';
      if (ctx.mode === 'tournee') {
        actions = btn('Étape suivante', 'primary js-next', I.next) + btn('Arrêter la tournée', 'ghost js-stop', I.back);
      } else if (ctx.mode === 'improv') {
        actions = btn('Rejouer', 'js-again', I.reset) + btn('Retour', 'ghost js-map', I.back);
      } else if (isFinale) {
        actions = btn('Épilogue', 'primary js-epi', I.next);
      } else {
        actions = (nextLv ? btn('Suivant', 'primary js-next', I.next) : '') +
          btn('Rejouer', 'js-again', I.reset) + btn('La carte', 'ghost js-map', I.map);
      }
      sec.innerHTML = '<div class="veil"></div><div class="carnet result-card">' +
        '<p class="kicker">' + (score >= (BP.GOLD || 0.97) ? 'Ovation' : score >= (BP.PASS || 0.9) ? 'Le public applaudit' : 'Rideau') + '</p>' +
        '<h2>' + esc(level.title || '') + '</h2>' +
        '<div class="big-stars">' + [0, 1, 2].map(function (i) {
          return '<span class="bstar" data-i="' + i + '">' + I.star + '</span>';
        }).join('') + '</div>' +
        '<div class="result-figures"><div><b>' + pct(score) + '</b><i>ressemblance</i></div>' +
        '<div><b>' + moves + (par ? ' / ' + par : '') + '</b><i>manipulations</i></div></div>' +
        detail +
        (level.outro ? '<div class="carnet-body">' + paras(level.outro).map(function (p) { return '<p class="para in">' + esc(p) + '</p>'; }).join('') + '</div>' : '') +
        '<div class="row">' + actions + '</div></div>';

      // étoiles animées
      var bs = sec.querySelectorAll('.bstar');
      var reduce = reduceMotion();
      for (var i = 0; i < stars; i++) {
        (function (i) {
          var d = reduce ? 0 : 260 + i * 340;
          setTimeout(function () {
            if (!bs[i]) return;
            bs[i].classList.add('on');
            sfx('star');
          }, d);
        })(i);
      }
      bind(sec, '.js-next', function () {
        if (ctx.mode === 'tournee') { nextTourneeStage(); return; }
        if (nextLv) enterLevel(nextLv); else screenMap();
      });
      bind(sec, '.js-again', function () { restartLevel(); });
      bind(sec, '.js-map', function () { A('playMusic', 'menu'); if (ctx.mode === 'story') screenMap(); else screenTitle(); });
      bind(sec, '.js-stop', function () { endTournee('arret'); });
      bind(sec, '.js-epi', function () { screenEpilogue(scores, level); });
    });
  }

  function onLost(d) {
    ctx.playing = false; stopPlayLoop(); hudHide();
    d = d || {};
    var level = ctx.level || {};
    SAVE(function (s) { s.fails[level.id] = (s.fails[level.id] || 0) + 1; });
    sfx('error');
    A('applause', 0);
    if (ctx.mode === 'tournee') { endTournee('echec'); return; }
    showScreen('lost', function (sec) {
      sec.innerHTML = '<div class="veil"></div><div class="carnet result-card lost">' +
        '<p class="kicker">Le public gronde</p>' +
        '<h2>' + esc(level.title || '') + '</h2>' +
        '<p class="lost-txt">L’ombre s’est défaite sous le tambour. On rallume la lampe, on recommence : ' +
        'personne n’a jamais tenu une représentation du premier coup.</p>' +
        (d.score !== undefined ? '<div class="result-figures"><div><b>' + pct(d.score) + '</b><i>ressemblance</i></div></div>' : '') +
        '<div class="row">' + btn('Réessayer', 'primary js-again', I.reset) + btn('La carte', 'ghost js-map', I.map) + '</div></div>';
      bind(sec, '.js-again', function () { restartLevel(); });
      bind(sec, '.js-map', function () { A('playMusic', 'menu'); screenMap(); });
    });
  }

  /* -------------------------------------------------------------- épilogue */

  function pickEnding(scores, level) {
    var rs = (level && level.readings) || ['main'];
    var min = 1;
    rs.forEach(function (r) { min = Math.min(min, (scores && scores[r] !== undefined) ? scores[r] : 0); });
    var tier = min >= 0.95 ? 2 : min >= (BP.PASS || 0.9) ? 1 : 0;
    var e = story().endings;
    var got = null;
    if (typeof story().pickEnding === 'function') {
      // Règle canonique du récit : transmission / évasion / dissolution selon les trois lectures.
      try { got = story().pickEnding(scores || {}); } catch (err) { got = null; }
    }
    if (got) { /* déjà choisi */ }
    else if (Array.isArray(e) && e.length) {
      var withMin = e.filter(function (x) { return x && typeof x.min === 'number'; });
      if (withMin.length === e.length) {
        var sorted = e.slice().sort(function (a, b) { return a.min - b.min; });
        got = sorted[0];
        sorted.forEach(function (x) { if (min >= x.min) got = x; });
      } else got = e[Math.min(e.length - 1, tier)];
    } else if (e && typeof e === 'object') {
      var keys = [['bad', 'sombre', 'echec', 'low', 'poor'], ['mixed', 'moyen', 'doute', 'mid'], ['good', 'bonne', 'best', 'high', 'lumiere']][tier];
      for (var i = 0; i < keys.length && !got; i++) if (e[keys[i]]) got = e[keys[i]];
      if (!got) { var ks = Object.keys(e); got = e[ks[Math.min(ks.length - 1, tier)]]; }
    }
    if (typeof got === 'string') got = { title: '', text: got };
    if (!got) got = FALLBACK.endings[tier];
    var text = got.text || got.body || (Array.isArray(got.paragraphs) ? got.paragraphs.join('\n\n') : '') || FALLBACK.endings[tier].text;
    return { title: got.title || FALLBACK.endings[tier].title, text: text, min: min };
  }

  function screenEpilogue(scores, level) {
    var end = pickEnding(scores, level);
    A('playMusic', 'ending');
    var ps = paras(end.text);
    var i = 0;
    showScreen('epilogue', function (sec) {
      sec.innerHTML = '<div class="halo soft"></div><div class="carnet epilogue">' +
        '<p class="kicker">Épilogue</p><h2>' + esc(end.title) + '</h2>' +
        '<div class="carnet-body"></div><p class="tap-hint">' + tapWord() + ' pour continuer</p></div>';
      var body = $('.carnet-body', sec);
      function step() {
        if (i >= ps.length) { screenCredits(); return; }
        var p = el('p', { 'class': 'para' }, esc(ps[i]));
        body.appendChild(p);
        requestAnimationFrame(function () { p.classList.add('in'); });
        sfx('page'); i++;
        if (i >= ps.length) $('.tap-hint', sec).textContent = tapWord() + ' pour les remerciements';
      }
      sec.addEventListener('click', step);
      step();
    });
  }

  function screenCredits() {
    var c = story().credits || FALLBACK.credits;
    showScreen('credits', function (sec) {
      sec.innerHTML = '<div class="halo soft"></div><div class="carnet narrow">' +
        '<h2 class="game-title small">' + esc(gameTitle()) + '</h2>' +
        '<div class="carnet-body">' + paras(c).map(function (p) { return '<p class="para in">' + esc(p) + '</p>'; }).join('') + '</div>' +
        '<p class="credit-line">Le coffre passe à quelqu’un d’autre.</p>' +
        '<div class="row">' + btn('Retour au titre', 'primary js-title', I.back) + '</div></div>';
      bind(sec, '.js-title', function () { screenTitle(); });
    });
  }

  /* --------------------------------------------------------------- succès */

  function screenAchievements(from) {
    hudHide();
    var s = S();
    showScreen('achievements', function (sec) {
      var got = 0;
      var items = ACHIEVEMENTS.map(function (a) {
        var t = s.achievements[a.id];
        if (t) got++;
        return '<li class="ach' + (t ? ' got' : '') + '"><span class="ach-ic">' + (t ? I.trophy : I.lock) + '</span>' +
          '<span class="ach-txt"><b>' + esc(a.name) + '</b><i>' + esc(a.desc) + '</i>' +
          (t ? '<u>obtenu le ' + esc(fmtDate(t)) + '</u>' : '<u>verrouillé</u>') + '</span></li>';
      }).join('');
      sec.innerHTML = '<header class="sc-head"><button type="button" class="icon-btn js-back" aria-label="Retour">' + I.back + '</button>' +
        '<h2>Succès</h2><span class="head-count">' + got + ' / ' + ACHIEVEMENTS.length + '</span></header>' +
        '<div class="sc-body"><ul class="ach-list">' + items + '</ul></div>';
      bind(sec, '.js-back', function () { from === 'pause' ? screenPause() : screenTitle(); });
    });
  }
  function fmtDate(t) {
    try { return new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return ''; }
  }

  /* --------------------------------------------------------------- options */

  function reduceMotion() {
    if (S().settings.reduceMotion) return true;
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  }
  /** La vue de côté (échelle des profondeurs) n'a de sens qu'une fois la profondeur introduite. */
  function sideViewOn() {
    if (!S().settings.sideView) return false;
    if (ctx.playing && ctx.level) return !!unlockedSet(ctx.level).depth;
    return true;
  }
  function applySettings() {
    var st = S().settings;
    document.body.classList.toggle('reduce-motion', reduceMotion());
    A('setVolumes', { music: st.music, sfx: st.sfx });
    A('setMuted', !!st.muted);
    if (BP.engine && BP.engine.setOptions) {
      try { BP.engine.setOptions({ reduceMotion: reduceMotion(), showSideView: sideViewOn() }); } catch (e) { }
    }
  }

  function screenOptions(from) {
    ctx.optionsFrom = from || 'title';
    hudHide();
    var st = S().settings;
    showScreen('options', function (sec) {
      sec.innerHTML = '<header class="sc-head"><button type="button" class="icon-btn js-back" aria-label="Retour">' + I.back + '</button>' +
        '<h2>Options</h2><span class="head-sp"></span></header><div class="sc-body"><div class="opts">' +
        row('music', 'Musique', 'range', st.music) +
        row('sfx', 'Effets', 'range', st.sfx) +
        row('muted', 'Silence complet', 'check', st.muted) +
        row('reduceMotion', 'Mouvements réduits', 'check', st.reduceMotion) +
        row('sideView', 'Vue de côté (profondeurs)', 'check', st.sideView) +
        '<div class="opt danger"><div class="opt-lab">Effacer la sauvegarde</div>' +
        '<button type="button" class="btn ghost small js-erase"><span>Effacer…</span></button></div>' +
        '<p class="version">Bêtes de Papier — version ' + esc(BP.VERSION || '1.0') + '</p>' +
        '</div></div>';

      function row(id, label, kind, v) {
        if (kind === 'range') {
          return '<div class="opt"><label class="opt-lab" for="o-' + id + '">' + esc(label) + '</label>' +
            '<input type="range" id="o-' + id + '" data-opt="' + id + '" min="0" max="1" step="0.05" value="' + v + '">' +
            '<output data-out="' + id + '">' + Math.round(v * 100) + '</output></div>';
        }
        return '<div class="opt"><label class="opt-lab" for="o-' + id + '">' + esc(label) + '</label>' +
          '<label class="switch"><input type="checkbox" id="o-' + id + '" data-opt="' + id + '"' + (v ? ' checked' : '') + '><span></span></label></div>';
      }

      var ins = sec.querySelectorAll('[data-opt]');
      for (var i = 0; i < ins.length; i++) {
        (function (inp) {
          var key = inp.getAttribute('data-opt');
          inp.addEventListener('input', function () {
            var v = inp.type === 'checkbox' ? inp.checked : parseFloat(inp.value);
            SAVE(function (s) { s.settings[key] = v; });
            var out = sec.querySelector('[data-out="' + key + '"]');
            if (out) out.textContent = Math.round(v * 100);
            applySettings();
            if (inp.type !== 'range') sfx('ui');
          });
          if (inp.type === 'range') inp.addEventListener('change', function () { sfx('ui'); });
        })(ins[i]);
      }
      bind(sec, '.js-back', function () {
        if (ctx.optionsFrom === 'pause') screenPause(); else screenTitle();
      });
      bind(sec, '.js-erase', function (ev, n) {
        if (n.getAttribute('data-armed')) {
          resetSave(); applySettings(); screenTitle(); return;
        }
        n.setAttribute('data-armed', '1');
        n.classList.add('armed');
        n.innerHTML = '<span>Confirmer l’effacement</span>';
        setTimeout(function () {
          if (!n.parentNode) return;
          n.removeAttribute('data-armed'); n.classList.remove('armed');
          n.innerHTML = '<span>Effacer…</span>';
        }, 4000);
      });
    });
  }

  /* ------------------------------------------------------ improvisation */

  function startImprov() {
    var key = (BP.dateKey ? BP.dateKey() : 0);
    ctx.mode = 'improv'; ctx.improvKey = key;
    var lv = null;
    if (BP.levels && BP.levels.makeImprov) { try { lv = BP.levels.makeImprov(key); } catch (e) { console.error('[ui] makeImprov', e); } }
    if (!lv) { notice('L’improvisation du jour n’est pas disponible.'); return; }
    ctx.level = lv;
    var best = S().improv[key];
    hudHide();
    showScreen('improv', function (sec) {
      sec.innerHTML = '<header class="sc-head"><button type="button" class="icon-btn js-back" aria-label="Retour">' + I.back + '</button>' +
        '<h2>Improvisation du jour</h2><span class="head-sp"></span></header>' +
        '<div class="sc-body"><div class="carnet">' +
        '<p class="kicker">' + esc(dateHuman(key)) + '</p>' +
        '<h3 class="brief-title">' + esc(lv.title || 'Silhouette du jour') + '</h3>' +
        '<div class="improv-thumb"><canvas width="220" height="165" data-improv></canvas></div>' +
        '<p class="para in">Une bête tirée du hasard du jour, la même pour tout le monde. Coffre imposé, une seule tentative à la fois — mais vous pouvez recommencer autant que vous voulez.</p>' +
        '<div class="brief-meta"><span>Coffre : ' + ((lv.coffre || []).length) + ' découpes</span><span>Par : ' + (lv.par || '—') + '</span></div>' +
        (best ? '<p class="record">Meilleur du jour : <b>' + pct(best.best) + '</b> en ' + best.moves + ' manipulations</p>'
          : '<p class="record muted">Pas encore de score aujourd’hui.</p>') +
        '<div class="row">' + btn('Lever le rideau', 'primary js-go', I.curtain) + '</div></div></div>';
      var c = $('[data-improv]', sec);
      if (c && BP.engine && BP.engine.renderThumb) { try { BP.engine.renderThumb(c, lv); } catch (e) { placeholderThumb(c, true); } }
      else if (c) placeholderThumb(c, true);
      bind(sec, '.js-go', function () { sfx('curtain'); startLevel(lv); });
      bind(sec, '.js-back', function () { screenTitle(); });
    });
  }

  /* ------------------------------------------------------------- tournée */

  function screenTourneeStart() {
    hudHide();
    var s = S();
    showScreen('tournee', function (sec) {
      sec.innerHTML = '<header class="sc-head"><button type="button" class="icon-btn js-back" aria-label="Retour">' + I.back + '</button>' +
        '<h2>Tournée</h2><span class="head-sp"></span></header>' +
        '<div class="sc-body"><div class="carnet">' +
        '<p class="para in">On monte le drap de village en village. À chaque étape, une bête nouvelle et un coffre un peu plus maigre. ' +
        'Un tableau raté, et la troupe rentre.</p>' +
        '<div class="record-box"><div><b>' + (s.tournee.best || 0) + '</b><i>étapes (record)</i></div>' +
        '<div><b>' + num2(s.tournee.bestScore || 0) + '</b><i>score cumulé</i></div></div>' +
        '<div class="row">' + btn('Prendre la route', 'primary js-go', I.road) + '</div></div></div>';
      bind(sec, '.js-back', function () { screenTitle(); });
      bind(sec, '.js-go', function () { startTournee(); });
    });
  }

  function startTournee() {
    ctx.mode = 'tournee';
    ctx.tour = { seed: Math.floor(Math.random() * 1e9), stage: 1, total: 0, scores: [] };
    loadTourneeStage();
  }
  function nextTourneeStage() {
    if (!ctx.tour) { screenTitle(); return; }
    ctx.tour.stage++;
    loadTourneeStage();
  }
  function loadTourneeStage() {
    var lv = null;
    if (BP.levels && BP.levels.makeTournee) {
      try { lv = BP.levels.makeTournee(ctx.tour.seed, ctx.tour.stage); } catch (e) { console.error('[ui] makeTournee', e); }
    }
    if (!lv) { notice('La tournée n’est pas disponible.'); return; }
    ctx.level = lv;
    screenBrief(lv);
  }
  function endTournee(reason) {
    var t = ctx.tour || { stage: 1, total: 0 };
    var stages = Math.max(0, t.stage - (reason === 'echec' || reason === 'abandon' ? 1 : 0));
    var s = S();
    hudHide();
    A('playMusic', 'menu');
    showScreen('tourend', function (sec) {
      sec.innerHTML = '<div class="veil"></div><div class="carnet result-card">' +
        '<p class="kicker">' + (reason === 'echec' ? 'La troupe rentre' : reason === 'abandon' ? 'On plie le drap' : 'Fin de tournée') + '</p>' +
        '<h2>Tournée terminée</h2>' +
        '<div class="result-figures"><div><b>' + stages + '</b><i>étape' + (stages > 1 ? 's' : '') + '</i></div>' +
        '<div><b>' + num2(t.total) + '</b><i>score cumulé</i></div></div>' +
        '<p class="record">Record : <b>' + (s.tournee.best || 0) + '</b> étapes · <b>' + num2(s.tournee.bestScore || 0) + '</b></p>' +
        '<div class="row">' + btn('Repartir', 'primary js-again', I.road) + btn('Titre', 'ghost js-title', I.back) + '</div></div>';
      bind(sec, '.js-again', function () { startTournee(); });
      bind(sec, '.js-title', function () { ctx.tour = null; ctx.mode = 'story'; screenTitle(); });
    });
  }

  function notice(msg) {
    showScreen('notice', function (sec) {
      sec.innerHTML = '<div class="carnet narrow"><h2>Un instant…</h2><p class="para in">' + esc(msg) + '</p>' +
        '<div class="row">' + btn('Retour', 'primary js-back', I.back) + '</div></div>';
      bind(sec, '.js-back', function () { screenTitle(); });
    });
  }

  /* ---------------------------------------------------------------- init */

  function firstGesture() {
    A('init');
    A('resume');
    applySettings();
    var lv = ctx.playing && ctx.level;
    A('playMusic', !lv ? 'menu' : (lv.type === 'performance' ? 'performance' : 'act' + (lv.act || 1)));
    A('ambience', true);
  }

  function wireEngine() {
    if (!(BP.engine && BP.engine.on)) return;
    BP.engine.on('score', function (d) {
      d = d || {};
      setGauge(d.score !== undefined ? d.score : 0, d.scores || {});
      // L'intensité musicale est déjà pilotée par le moteur à chaque recalcul : pas de doublon.
    });
    BP.engine.on('showTarget', syncTarget);
    BP.engine.on('won', onWon);
    BP.engine.on('lost', onLost);
    BP.engine.on('unlock', function (name) {
      if (!name || !ctx.level) return;
      // le contrôle apparaît immédiatement dans le panneau, puis le tutoriel le désigne
      if (ctx.extra.indexOf(name) < 0 && !unlockedSet(ctx.level)[name]) {
        ctx.extra.push(name);
        if (ctx.playing) { hudBuild(ctx.level); kickResize(); }
      }
      // Le tutoriel est planifié par runTutorials() au lancement du tableau (évite les doublons).
      if (S().seen[name] || tutoQueue.indexOf(name) >= 0 || !ctx.playing) return;
      tutoQueue.push(name);
      nextTutorial();
    });
    // Les sons de manipulation sont émis par le moteur/l'audio : l'UI ne les double pas.
    BP.engine.on('place', function () { noteShapesUsed(); });
  }

  function init() {
    if (mounted) return;
    mounted = true;
    app = $('#app'); stageWrap = $('#stage-wrap'); stageCanvas = $('#stage');
    hud = $('#hud'); screensEl = $('#screens');
    if (!app || !screensEl) { console.error('[BP.ui] squelette HTML absent'); return; }

    tutoLayer = $('#tuto');
    if (!tutoLayer) { tutoLayer = el('div', { id: 'tuto' }); tutoLayer.hidden = true; app.appendChild(tutoLayer); }
    if (!$('#toast')) app.appendChild(el('div', { id: 'toast', role: 'status', 'aria-live': 'polite' }));

    hud.hidden = true;
    screensEl.hidden = true;

    if (BP.engine && BP.engine.init && stageCanvas) {
      try { BP.engine.init(stageCanvas); } catch (e) { console.error('[ui] engine.init', e); }
    }
    wireEngine();
    applySettings();

    document.addEventListener('pointerdown', firstGesture, { once: true });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (ctx.playing) { screenPause(); e.preventDefault(); }
        else if (document.body.getAttribute('data-screen') === 'pause') {
          hideScreens(); ctx.playing = true;
          if (BP.engine && BP.engine.setPaused) BP.engine.setPaused(false);
          hudShow(); startPlayLoop();
        }
      }
    });
    var vpW = window.innerWidth, vpH = window.innerHeight;
    window.addEventListener('resize', function () {
      // ne réagir qu'à un vrai changement de fenêtre (kickResize() en émet aussi)
      if (window.innerWidth === vpW && window.innerHeight === vpH) return;
      vpW = window.innerWidth; vpH = window.innerHeight;
      if (bubbleOpts) bubble(bubbleOpts);   // ré-ancrage de la bulle ouverte
    });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    screenTitle();
  }

  BP.ui = {
    init: init,
    show: {
      title: screenTitle, map: screenMap, options: screenOptions,
      achievements: screenAchievements, improv: startImprov, tournee: screenTourneeStart
    },
    startLevel: function (id) { var l = findLevel(id); if (l) { ctx.mode = 'story'; startLevel(l); } },
    achievements: ACHIEVEMENTS,
    _ctx: ctx
  };

})(window.BP);

</script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    if (window.BP && BP.ui && BP.ui.init) BP.ui.init();
  });
</script>
</body>
</html>
