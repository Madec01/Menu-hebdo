<script>
/* === MOTEUR — règles, navires, faisceau, rendu === */
/* ============================================================
   VEILLEUR — Les nuits d'Ys
   Moteur de jeu : faisceau, navires, brume, feux d'Ys.
   ============================================================ */
(function () {
  'use strict';

  var C = (typeof CONTENT !== 'undefined') ? CONTENT : {};
  function pick(arr, fb) { return (arr && arr.length) ? arr[(Math.random() * arr.length) | 0] : fb; }

  // ---------- utilitaires ----------
  var TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function wrapPi(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function irnd(a, b) { return (a + Math.random() * (b - a + 1)) | 0; }
  function smooth(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
  function segCircle(x1, y1, x2, y2, cx, cy, r) {
    var dx = x2 - x1, dy = y2 - y1, fx = x1 - cx, fy = y1 - cy;
    var a = dx * dx + dy * dy; if (a < 1e-6) return (fx * fx + fy * fy) <= r * r;
    var t = clamp(-(fx * dx + fy * dy) / a, 0, 1);
    var px = fx + dx * t, py = fy + dy * t;
    return (px * px + py * py) <= r * r;
  }

  // ---------- palette ----------
  var COL = {
    sea0: '#050a13', sea1: '#0b1728', foam: '#9fc4e8',
    warm: '#ffc46b', warm2: '#ff9a45', ember: '#ffe3b0',
    ys: '#8ff2d4', ysDim: '#2f6f63',
    ink: '#dce9f7', dim: 'rgba(220,233,247,0.45)'
  };

  // ---------- types de navires ----------
  var TYPES = {
    chalutier: { speed: 37, r: 11, gain: 1.00, decay: 0.100, souls: 8, len: 30, beam: 11 },
    caboteur: { speed: 29, r: 14, gain: 0.72, decay: 0.075, souls: 14, len: 41, beam: 15 },
    barque: { speed: 55, r: 9, gain: 1.55, decay: 0.215, souls: 3, len: 21, beam: 8 },
    kerloch: { speed: 21, r: 22, gain: 0.44, decay: 0.055, souls: 220, len: 66, beam: 22 },
    aurore: { speed: 30, r: 17, gain: 0.58, decay: 0.085, souls: 40, len: 47, beam: 17 }
  };

  var NIGHTS = [null,
    { ships: 5, types: ['chalutier'], every: 2.8, fog: 0, wreck: 0, storm: 0.22, spd: 0.62 },
    { ships: 7, types: ['chalutier', 'caboteur'], every: 3.0, fog: 2, wreck: 0, storm: 0.38, spd: 0.72 },
    { ships: 8, types: ['chalutier', 'caboteur'], every: 2.7, fog: 2, wreck: 1, storm: 0.50, spd: 0.80 },
    { ships: 9, types: ['chalutier', 'barque', 'barque'], every: 2.5, fog: 3, wreck: 1, storm: 0.62, spd: 0.88 },
    { ships: 9, types: ['barque', 'chalutier', 'caboteur'], every: 2.0, fog: 4, wreck: 2, storm: 0.76, spd: 0.95 },
    { ships: 10, types: ['barque', 'chalutier', 'caboteur'], every: 1.9, fog: 4, wreck: 2, storm: 0.88, spd: 1.02, special: 'kerloch' },
    { ships: 11, types: ['barque', 'chalutier', 'caboteur'], every: 1.8, fog: 5, wreck: 3, storm: 1.00, spd: 1.10, special: 'aurore' }
  ];

  // ---------- réglages de sensation ----------
  var K = {
    stiff: 92, damp: 0.855,        // ressort angulaire du faisceau
    stiffF: 34, dampF: 0.800,      // en focus : plus lourd
    whip: 3.4,                     // rad/s au-delà desquels le faisceau se dilue
    hwMin: 0.105, hwMax: 0.44,     // demi-ouverture du cône (immobile -> balayage)
    focusHw: 0.55, focusRange: 1.75, focusGain: 1.7,
    gain: 0.70, range: 0.52,       // portée = 0.52 * min(w,h)... recalculée au resize
    heatUp: 0.36, heatDown: 0.30, blackout: 2.5,
    oilMax: 100, flareCost: 34, oilPerSave: 15, oilPerNight: 35,
    flareR: 300, flareBoost: 0.42
  };

  // ---------- état ----------
  var S = {
    mode: 'title',      // title | journal | play | over | pause
    prevMode: 'play',
    night: 1, souls: 0, lives: 3, best: 0,
    ships: [], rocks: [], fogs: [], lights: [], notes: [],
    spawned: 0, spawnT: 0, wreckT: 0, nightT: 0,
    angle: -Math.PI / 2, angVel: 0, aimAngle: -Math.PI / 2,
    focus: false, heat: 0, lamp: true, blackout: 0,
    oil: K.oilMax, flareFlash: 0,
    saved: 0, lostShips: 0, extinguished: 0, combo: 0, bestCombo: 0,
    auroreSaved: false, auroreSeen: false,
    bilan: null, nSaved: 0, nLost: 0, nSouls: 0,
    t: 0, w: 0, h: 0, cx: 0, cy: 0, range: 420,
    hw: 0.2, beamRange: 420, power: 1, sweep: 0, hist: [], histT: 0,
    shake: 0, msg: null, msgT: 0, endKind: 'defeat',
    started: false, hintT: 0
  };

  var cv, ctx, FX, AU, DPR = 1;

  // ---------- initialisation ----------
  function boot() {
    cv = document.getElementById('cv');
    ctx = cv.getContext('2d', { alpha: false });
    FX = createFX();
    AU = createAudio();
    try { S.best = parseInt(localStorage.getItem('veilleur.best') || '0', 10) || 0; } catch (e) { S.best = 0; }
    resize();
    FX.setStorm(0.35); FX.setWind(-46);
    window.addEventListener('resize', resize);
    bindInput();
    requestAnimationFrame(frame);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    S.w = window.innerWidth; S.h = window.innerHeight;
    cv.width = Math.floor(S.w * DPR); cv.height = Math.floor(S.h * DPR);
    cv.style.width = S.w + 'px'; cv.style.height = S.h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S.cx = S.w * 0.5; S.cy = S.h * 0.46;
    S.range = Math.max(360, Math.min(S.w, S.h) * 0.62);
    FX.resize(S.w, S.h);
  }

  // ---------- entrées ----------
  function bindInput() {
    window.addEventListener('mousemove', function (e) {
      S.aimAngle = Math.atan2(e.clientY - S.cy, e.clientX - S.cx);
    });
    window.addEventListener('mousedown', function (e) {
      AU.resume();
      if (e.button === 2) { S.focus = true; return; }
      if (S.mode === 'title') { startRun(); }
      else if (S.mode === 'journal') { S.mode = 'play'; AU.sfx('foghorn'); }
      else if (S.mode === 'over') { startRun(); }
      else if (S.mode === 'play') { flare(); }
    });
    window.addEventListener('mouseup', function (e) { if (e.button === 2) S.focus = false; });
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    window.addEventListener('keydown', function (e) {
      AU.resume();
      var k = e.key;
      if (k === 'Shift') { S.focus = true; e.preventDefault(); return; }
      if (k === ' ' || k === 'Spacebar') {
        e.preventDefault();
        if (S.mode === 'title') startRun();
        else if (S.mode === 'journal') { S.mode = 'play'; AU.sfx('foghorn'); }
        else if (S.mode === 'over') startRun();
        else flare();
        return;
      }
      if (k === 'Escape' || k === 'p' || k === 'P') {
        if (S.mode === 'play') { S.prevMode = 'play'; S.mode = 'pause'; }
        else if (S.mode === 'pause') S.mode = 'play';
        return;
      }
      if (k === 'r' || k === 'R') { if (S.mode !== 'title') startRun(); return; }
      if (k === 'm' || k === 'M') { AU.toggleMute(); return; }
      if (S.mode === 'journal' || S.mode === 'over' || S.mode === 'title') {
        if (k === 'Enter') { if (S.mode === 'journal') { S.mode = 'play'; AU.sfx('foghorn'); } else startRun(); }
      }
    });
    window.addEventListener('keyup', function (e) { if (e.key === 'Shift') S.focus = false; });
    window.addEventListener('blur', function () {
      S.focus = false;
      if (S.mode === 'play') { S.prevMode = 'play'; S.mode = 'pause'; }
    });
  }

  // ---------- cycle de partie ----------
  function startRun() {
    S.night = 1; S.souls = 0; S.lives = 3; S.saved = 0; S.lostShips = 0;
    S.extinguished = 0; S.combo = 0; S.bestCombo = 0;
    S.auroreSaved = false; S.auroreSeen = false; S.started = true; S.hintT = 12;
    beginNight();
    AU.resume();
  }

  function beginNight() {
    var cfg = NIGHTS[S.night];
    S.ships.length = 0; S.lights.length = 0; S.fogs.length = 0; S.notes.length = 0;
    S.spawned = 0; S.spawnT = 1.2; S.wreckT = 8; S.nightT = 0;
    S.oil = K.oilMax; S.heat = 0; S.lamp = true; S.blackout = 0;
    S.nSaved = 0; S.nLost = 0; S.nSouls = 0;
    S.angVel = 0; S.msg = null;
    buildReef();
    for (var i = 0; i < cfg.fog; i++) spawnFog(true);
    FX.setStorm(cfg.storm);
    AU.setStorm(cfg.storm); AU.setLamp(true);
    S.mode = 'journal';
  }

  function buildReef() {
    S.rocks.length = 0;
    var base = Math.min(S.w, S.h);
    var n = irnd(9, 12);
    var used = [];
    for (var i = 0; i < n; i++) {
      var a, tries = 0;
      do {
        a = rnd(-Math.PI, Math.PI); tries++;
        // laisser la passe libre vers le bas
      } while (tries < 40 && (Math.abs(wrapPi(a - Math.PI / 2)) < 0.62 || tooClose(used, a, 0.34)));
      used.push(a);
      var rr = base * rnd(0.16, 0.235);
      S.rocks.push(makeRock(S.cx + Math.cos(a) * rr, S.cy + Math.sin(a) * rr, rnd(13, 26)));
    }
    // quelques écueils isolés au large
    for (var j = 0; j < 3; j++) {
      var ang = rnd(-Math.PI, Math.PI);
      if (Math.abs(wrapPi(ang - Math.PI / 2)) < 0.7) ang += 1.4;
      var d = base * rnd(0.34, 0.44);
      S.rocks.push(makeRock(S.cx + Math.cos(ang) * d, S.cy + Math.sin(ang) * d, rnd(10, 18)));
    }
  }
  function tooClose(list, a, m) { for (var i = 0; i < list.length; i++) if (Math.abs(wrapPi(list[i] - a)) < m) return true; return false; }
  function makeRock(x, y, r) {
    var pts = [], n = irnd(6, 9);
    for (var i = 0; i < n; i++) pts.push(r * rnd(0.68, 1.25));
    return { x: x, y: y, r: r, pts: pts, ph: rnd(0, TAU) };
  }

  // ---------- entités ----------
  function spawnShip(kind) {
    var t = TYPES[kind];
    var a = -Math.PI / 2 + rnd(-1, 1) * 2.28;      // large éventail, jamais par la passe
    var ca = Math.cos(a), sa = Math.sin(a);
    // point d'apparition juste au-delà du bord de l'écran, dans la direction a
    var R = Math.min(Math.abs((S.w * 0.5 + 46) / (ca || 1e-6)), Math.abs((S.h * 0.5 + 46) / (sa || 1e-6)));
    var sh = {
      kind: kind, t: t, name: shipName(kind),
      x: S.cx + ca * R, y: S.cy + sa * R,
      hd: a + Math.PI + rnd(-0.35, 0.35),
      conf: 0, state: 'lost', lit: 0, wob: rnd(0, TAU),
      alive: true, fade: 1, milestone: 0, panic: 0, danger: 0, born: 0,
      spdMul: (NIGHTS[S.night] && NIGHTS[S.night].spd) || 1
    };
    S.ships.push(sh);
    return sh;
  }
  function shipName(kind) {
    if (kind === 'kerloch') return 'KERLOCH';
    if (kind === 'aurore') return 'L’AURORE';
    return pick(C.shipNames, 'Sainte-Anne');
  }
  function spawnFog(anywhere) {
    var a = rnd(-Math.PI, Math.PI), d = anywhere ? rnd(0.15, 0.55) : 0.62;
    var base = Math.min(S.w, S.h);
    S.fogs.push({
      x: S.cx + Math.cos(a) * base * d, y: S.cy + Math.sin(a) * base * d,
      r: rnd(80, 150), r0: 0, vx: rnd(-14, 14), vy: rnd(-9, 9), ph: rnd(0, TAU), life: rnd(26, 48)
    });
    S.fogs[S.fogs.length - 1].r0 = S.fogs[S.fogs.length - 1].r;
  }
  function spawnWrecker() {
    var a = rnd(-Math.PI, Math.PI);
    var base = Math.min(S.w, S.h);
    var d = base * rnd(0.30, 0.46);
    var l = { x: S.cx + Math.cos(a) * d, y: S.cy + Math.sin(a) * d, ph: rnd(0, TAU), life: rnd(20, 30), hold: 0, stun: 0, dead: 0 };
    S.lights.push(l);
    AU.sfx('wrecker_in');
    note(pick(C.wreckerLines, 'Un feu s’allume sous la mer.'), l.x, l.y, COL.ys);
    FX.glowPulse(l.x, l.y, COL.ys, 90, 0.8);
    return l;
  }
  function note(text, x, y, color) {
    S.notes.push({ text: text, x: x, y: y, t: 0, dur: 2.6, color: color || COL.ink });
  }

  // ---------- actions ----------
  function flare() {
    if (S.mode !== 'play' || S.oil < K.flareCost) { if (S.mode === 'play') AU.sfx('ui', { vol: 0.3 }); return; }
    S.oil -= K.flareCost; S.flareFlash = 1;
    FX.ring(S.cx, S.cy, COL.warm, K.flareR, 0.75, 5);
    FX.spark(S.cx, S.cy, 46, COL.ember, 320);
    FX.shake(7);
    AU.sfx('flare');
    var i, d;
    for (i = 0; i < S.ships.length; i++) {
      var sh = S.ships[i]; if (!sh.alive || sh.state !== 'lost') continue;
      d = Math.hypot(sh.x - S.cx, sh.y - S.cy);
      if (d < K.flareR) addConf(sh, K.flareBoost * (1 - d / K.flareR * 0.5));
    }
    for (i = 0; i < S.fogs.length; i++) {
      var f = S.fogs[i]; d = Math.hypot(f.x - S.cx, f.y - S.cy);
      if (d < K.flareR + f.r) { f.r *= 0.45; f.life = Math.min(f.life, 6); }
    }
    for (i = 0; i < S.lights.length; i++) {
      var l = S.lights[i]; d = Math.hypot(l.x - S.cx, l.y - S.cy);
      if (d < K.flareR) { l.stun = 3.2; FX.glowPulse(l.x, l.y, '#ffffff', 60, 0.5); }
    }
  }

  function addConf(sh, amount) {
    if (sh.state !== 'lost') return;
    sh.conf = clamp(sh.conf + amount, 0, 1);
    if (sh.conf >= 0.5 && sh.milestone < 1) { sh.milestone = 1; AU.sfx('confidence', { vol: 0.5 }); }
    if (sh.conf >= 1) {
      sh.state = 'guided'; sh.milestone = 2;
      FX.glowPulse(sh.x, sh.y, COL.warm, 46, 0.6);
      AU.sfx('confidence', { vol: 0.9, pitch: 1.5 });
    }
  }

  // ---------- mise à jour ----------
  function update(dt) {
    S.t += dt;
    if (S.mode !== 'play') {
      if (S.mode === 'title') {
        S.angle = wrapPi(S.angle + dt * 0.42);
        S.hw = 0.19; S.beamRange = S.range; S.power = 1; S.sweep = 0;
        S.histT += dt;
        if (S.histT > 0.028) { S.histT = 0; S.hist.push({ a: S.angle, hw: S.hw }); if (S.hist.length > 4) S.hist.shift(); }
      }
      FX.update(dt);
      return;
    }
    var cfg = NIGHTS[S.night];
    S.nightT += dt;
    if (S.hintT > 0) S.hintT -= dt;

    // --- faisceau ---
    var diff = wrapPi(S.aimAngle - S.angle);
    var st = S.focus ? K.stiffF : K.stiff, dp = S.focus ? K.dampF : K.damp;
    S.angVel += diff * st * dt;
    S.angVel *= Math.pow(dp, dt * 60);
    S.angle = wrapPi(S.angle + S.angVel * dt);
    var spd = Math.abs(S.angVel);
    var sweep = smooth(0.15, K.whip, spd);            // 0 = immobile, 1 = balayage rapide
    var power = lerp(1, 0.22, sweep);                  // intensité utile
    var hw = lerp(K.hwMin, K.hwMax, sweep);
    var range = S.range;
    if (S.focus) { hw *= K.focusHw; range *= K.focusRange; }
    S.hw = hw; S.beamRange = range; S.power = power; S.sweep = sweep;
    S.histT += dt;
    if (S.histT > 0.028) {
      S.histT = 0;
      S.hist.push({ a: a2angle(), hw: hw });
      if (S.hist.length > 4) S.hist.shift();
    }

    // --- chaleur / lampe ---
    if (S.lamp) {
      if (S.focus) S.heat += K.heatUp * dt; else S.heat -= K.heatDown * dt;
      S.heat = clamp(S.heat, 0, 1);
      if (S.heat >= 1) {
        S.lamp = false; S.blackout = K.blackout; S.focus = false;
        AU.sfx('overheat'); AU.setLamp(false); FX.shake(9);
        FX.smoke(S.cx, S.cy - 6, 18);
        note(pick(C.overheat, 'La lentille a craqué.'), S.cx, S.cy - 70, COL.warm2);
      }
    } else {
      S.blackout -= dt; S.heat = Math.max(0, S.heat - dt / K.blackout);
      if (S.blackout <= 0) { S.lamp = true; S.heat = 0; AU.sfx('relight'); AU.setLamp(true); FX.glowPulse(S.cx, S.cy, COL.warm, 120, 0.7); }
    }
    AU.setFocus(S.focus && S.lamp);

    // --- apparitions ---
    if (S.spawned < cfg.ships) {
      S.spawnT -= dt;
      if (S.spawnT <= 0) {
        S.spawnT = cfg.every * rnd(0.75, 1.25);
        var kind;
        if (cfg.special && S.spawned === Math.floor(cfg.ships * 0.55)) {
          kind = cfg.special;
          if (kind === 'aurore') { S.auroreSeen = true; AU.sfx('bell'); }
        } else kind = pick(cfg.types, 'chalutier');
        var nsh = spawnShip(kind);
        S.spawned++;
        if (kind === 'aurore' || kind === 'kerloch') { note(nsh.name, nsh.x, nsh.y, COL.ember); FX.glowPulse(nsh.x, nsh.y, COL.ember, 70, 1.2); }
      }
    }
    if (cfg.wreck > 0) {
      S.wreckT -= dt;
      if (S.wreckT <= 0) {
        S.wreckT = rnd(9, 15) / cfg.wreck;
        var alive = 0; for (var q = 0; q < S.lights.length; q++) if (!S.lights[q].dead) alive++;
        if (alive < cfg.wreck) spawnWrecker();
      }
    }
    if (cfg.fog > 0 && S.fogs.length < cfg.fog && Math.random() < dt * 0.35) spawnFog(false);

    // --- brume ---
    for (var i = S.fogs.length - 1; i >= 0; i--) {
      var f = S.fogs[i];
      f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; f.ph += dt * 0.6;
      if (f.life < 4) f.r = Math.max(0, f.r - dt * 22);
      if (f.life <= 0 || f.r < 6) S.fogs.splice(i, 1);
    }

    // --- feux d'Ys ---
    for (var j = S.lights.length - 1; j >= 0; j--) {
      var l = S.lights[j];
      l.ph += dt * 2.2; l.life -= dt;
      if (l.stun > 0) l.stun -= dt;
      if (l.dead > 0) { l.dead += dt; if (l.dead > 0.8) S.lights.splice(j, 1); continue; }
      // extinction au focus
      if (S.lamp && S.focus && inBeam(l.x, l.y, 1, 26)) {
        l.hold += dt;
        FX.spark(l.x, l.y, 1, COL.ys, 60);
        if (l.hold >= 1.2) {
          l.dead = 0.001; S.extinguished++; S.souls += 5;
          AU.sfx('wrecker_out'); FX.ring(l.x, l.y, COL.ys, 90, 0.6, 3); FX.spark(l.x, l.y, 24, COL.ys, 200);
        }
      } else l.hold = Math.max(0, l.hold - dt * 0.6);
      if (l.life <= 0) l.dead = 0.001;
    }

    // --- navires ---
    for (var s = S.ships.length - 1; s >= 0; s--) {
      var sh = S.ships[s];
      if (!sh.alive) { sh.fade -= dt * 1.2; if (sh.fade <= 0) S.ships.splice(s, 1); continue; }
      updateShip(sh, dt);
    }

    // --- notes flottantes ---
    for (var n = S.notes.length - 1; n >= 0; n--) { S.notes[n].t += dt; if (S.notes[n].t > S.notes[n].dur) S.notes.splice(n, 1); }

    // --- tension audio ---
    var danger = 0;
    for (var d2 = 0; d2 < S.ships.length; d2++) {
      var sd = S.ships[d2]; if (!sd.alive || sd.state !== 'lost') continue;
      var dist = Math.hypot(sd.x - S.cx, sd.y - S.cy);
      danger = Math.max(danger, 1 - clamp((dist - 120) / 260, 0, 1));
    }
    AU.setDanger(danger);

    S.flareFlash = Math.max(0, S.flareFlash - dt * 2.4);
    FX.setWind(lerp(-30, -95, cfg.storm));
    FX.update(dt);

    // --- fin de nuit ---
    if (S.spawned >= cfg.ships && S.ships.length === 0) endNight();
    if (S.lives <= 0) gameOver('defeat');
  }

  function a2angle() { return S.angle; }

  function inBeam(x, y, ignoreFog, radius) {
    if (!S.lamp) return 0;
    var dx = x - S.cx, dy = y - S.cy;
    var d = Math.hypot(dx, dy);
    if (d > S.beamRange || d < 8) return 0;
    // une cible n'est pas un point : sa largeur angulaire élargit le cône utile
    var hw = S.hw + (radius ? Math.asin(Math.min(0.85, radius / d)) : 0);
    var da = Math.abs(wrapPi(Math.atan2(dy, dx) - S.angle));
    if (da > hw) return 0;
    var edge = 1 - Math.pow(da / hw, 2) * 0.65;
    var falloff = 1 - 0.3 * (d / S.beamRange);
    var fog = 1;
    if (!ignoreFog) {
      for (var i = 0; i < S.fogs.length; i++) {
        var f = S.fogs[i];
        if (segCircle(S.cx, S.cy, x, y, f.x, f.y, f.r * 0.85)) fog *= 0.34;
      }
      fog = Math.max(fog, 0.06);
    }
    return edge * falloff * fog;
  }

  function updateShip(sh, dt) {
    var t = sh.t;
    sh.wob += dt * 1.6;
    if (sh.born < 1) sh.born = Math.min(1, sh.born + dt * 1.6);

    if (sh.state === 'lost') {
      var lit = inBeam(sh.x, sh.y, 0, t.r) * S.power;
      sh.lit = lerp(sh.lit, lit, 1 - Math.pow(0.001, dt));
      if (lit > 0.02) addConf(sh, K.gain * lit * t.gain * (S.focus ? K.focusGain : 1) * dt);
      else sh.conf = Math.max(0, sh.conf - t.decay * dt * (1 + sh.panic));

      // cible de dérive : un feu d'Ys proche, sinon le phare
      var tx = S.cx, ty = S.cy, best = 1e9, boost = 1;
      for (var i = 0; i < S.lights.length; i++) {
        var l = S.lights[i]; if (l.dead || l.stun > 0) continue;
        var dl = Math.hypot(l.x - sh.x, l.y - sh.y);
        if (dl < 300 && dl < best) { best = dl; tx = l.x; ty = l.y; boost = 1.35; }
      }
      var want = Math.atan2(ty - sh.y, tx - sh.x);
      sh.hd = wrapPi(sh.hd + clamp(wrapPi(want - sh.hd), -0.55 * dt, 0.55 * dt));
      var sp = t.speed * sh.spdMul * boost * (1 - sh.conf * 0.45) * (1 + sh.panic * 0.4);
      moveShip(sh, sp, dt, 0.35);
    } else if (sh.state === 'guided') {
      sh.lit = lerp(sh.lit, 0.55, dt * 2);
      var hy = S.h + 80, hx = S.cx + Math.sin(sh.wob * 0.3) * 30;
      var wantG = avoid(sh, Math.atan2(hy - sh.y, hx - sh.x));
      sh.hd = wrapPi(sh.hd + clamp(wrapPi(wantG - sh.hd), -2.2 * dt, 2.2 * dt));
      moveShip(sh, Math.max(t.speed * 1.8, 78), dt, 0.12);
      if (sh.y > S.h + 30) return saveShip(sh);
    }

    // collision écueils
    for (var k = 0; k < S.rocks.length; k++) {
      var rk = S.rocks[k];
      if (Math.hypot(sh.x - rk.x, sh.y - rk.y) < rk.r * 0.92 + t.r * 0.6) return wreckShip(sh);
    }
    if (Math.hypot(sh.x - S.cx, sh.y - S.cy) < 34 + t.r * 0.5) return wreckShip(sh);

    // panique : les barques s'affolent près des récifs
    var dc = Math.hypot(sh.x - S.cx, sh.y - S.cy);
    sh.panic = (sh.kind === 'barque' && sh.state === 'lost') ? clamp(1 - (dc - 130) / 200, 0, 1) : 0;
    sh.danger = sh.state === 'lost' ? clamp(1 - (dc - 110) / 230, 0, 1) : 0;
  }

  // Dévie le cap voulu pour qu'aucun obstacle ne reste dans l'axe : on sort du
  // cône interdit par le côté le plus proche, ce qui contourne au lieu de foncer.
  function avoid(sh, want) {
    var turn = 0, t = sh.t;
    for (var i = -1; i < S.rocks.length; i++) {
      var ox, oy, orad;
      if (i < 0) { ox = S.cx; oy = S.cy; orad = 46; }
      else { var ro = S.rocks[i]; ox = ro.x; oy = ro.y; orad = ro.r; }
      var dx = ox - sh.x, dy = oy - sh.y, d = Math.hypot(dx, dy);
      var safe = orad + t.r + 30;
      if (d < 1 || d > safe + 170) continue;
      var rel = wrapPi(Math.atan2(dy, dx) - want);
      var need = Math.asin(Math.min(0.999, safe / Math.max(d, safe)));
      if (Math.abs(rel) < need) {
        var tn = rel - (rel >= 0 ? 1 : -1) * need;
        if (Math.abs(tn) > Math.abs(turn)) turn = tn;
      }
    }
    return wrapPi(want + turn);
  }

  function moveShip(sh, sp, dt, wobAmt) {
    var h = sh.hd + Math.sin(sh.wob) * wobAmt * 0.25;
    sh.x += Math.cos(h) * sp * dt;
    sh.y += Math.sin(h) * sp * dt;
    if (Math.random() < dt * 2.2) FX.splash(sh.x - Math.cos(h) * sh.t.len * 0.4, sh.y - Math.sin(h) * sh.t.len * 0.4, 1);
  }

  function saveShip(sh) {
    sh.alive = false; sh.fade = 0;
    S.saved++; S.nSaved++; S.combo++; if (S.combo > S.bestCombo) S.bestCombo = S.combo;
    var gain = sh.t.souls + Math.min(S.combo, 10) * 2;
    S.souls += gain; S.nSouls += gain;
    S.oil = clamp(S.oil + K.oilPerSave, 0, K.oilMax);
    if (sh.kind === 'aurore') S.auroreSaved = true;
    AU.sfx('save', { pitch: 1 + Math.min(S.combo, 8) * 0.06 });
    note(sh.kind === 'aurore' ? 'L’AURORE EST À QUAI' : pick(C.saved, 'À bon port.'), S.cx, S.h - 110, COL.warm);
    FX.glowPulse(S.cx, S.h - 20, COL.warm, 120, 0.9);
  }

  function wreckShip(sh) {
    sh.alive = false; sh.fade = 1;
    S.lives--; S.combo = 0; S.lostShips++; S.nLost++;
    AU.sfx('wreck'); FX.shake(12);
    FX.debris(sh.x, sh.y, 16); FX.splash(sh.x, sh.y, 22); FX.smoke(sh.x, sh.y, 8);
    note(sh.name + ' — ' + pick(C.lost, 'perdu corps et biens'), sh.x, sh.y, '#e2715f');
  }

  function endNight() {
    var bonus = 20 + S.night * 10 + (S.nLost === 0 ? 40 : 0);
    S.souls += bonus; S.nSouls += bonus;
    var clean = S.nLost === 0 && S.nSaved > 0;
    var regained = false;
    if (clean && S.lives < 5) { S.lives++; regained = true; }
    S.bilan = { night: S.night, saved: S.nSaved, lost: S.nLost, souls: S.nSouls, clean: clean, regained: regained };
    S.oil = clamp(S.oil + K.oilPerNight, 0, K.oilMax);
    AU.sfx('nightclear');
    if (S.night >= 7) { gameOver(S.auroreSaved ? 'victory' : 'bittersweet'); return; }
    S.night++;
    beginNight();
  }

  function gameOver(kind) {
    S.endKind = kind; S.mode = 'over';
    AU.sfx(kind === 'victory' ? 'victory' : 'gameover');
    AU.setDanger(0);
    if (S.souls > S.best) { S.best = S.souls; try { localStorage.setItem('veilleur.best', String(S.best)); } catch (e) { } }
    S.tip = pick(C.tips, 'Immobile, le faisceau convainc. En mouvement, il cherche.');
  }

  // ============================================================
  //  RENDU
  // ============================================================
  function draw() {
    var w = S.w, h = S.h;
    ctx.save();
    ctx.translate(FX.shakeX(), FX.shakeY());
    FX.drawSea(ctx, w, h, S.t);
    drawHarbour();
    drawRocks();
    if (S.mode === 'title') drawBeam();
    else if (S.started) { drawBeam(); drawFog(); drawLights(); drawShips(); }
    drawTower();
    FX.drawFront(ctx, w, h);
    ctx.restore();

    var fl = FX.flashAlpha() + S.flareFlash * 0.20;
    if (fl > 0.001) { ctx.fillStyle = 'rgba(190,220,255,' + Math.min(0.3, fl) + ')'; ctx.fillRect(0, 0, w, h); }

    if (S.mode === 'play' || S.mode === 'pause') drawHUD();
    drawNotes();
    if (S.mode === 'title') drawTitle();
    else if (S.mode === 'journal') drawJournal();
    else if (S.mode === 'over') drawOver();
    else if (S.mode === 'pause') drawPause();
  }

  function drawHarbour() {
    var w = S.w, h = S.h, cx = S.cx;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(cx, h + 40, 10, cx, h + 40, 300);
    g.addColorStop(0, 'rgba(255,186,102,0.30)');
    g.addColorStop(0.55, 'rgba(255,168,86,0.10)');
    g.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, h + 40, 300, 0, TAU); ctx.fill();
    ctx.restore();
    // bouées de la passe
    for (var i = -1; i <= 1; i += 2) {
      var bx = cx + i * 175, by = h - 20;
      var pulse = 0.55 + 0.45 * Math.sin(S.t * 2.2 + (i > 0 ? 1.6 : 0));
      ctx.globalCompositeOperation = 'lighter';
      var rg = ctx.createRadialGradient(bx, by, 0, bx, by, 40);
      rg.addColorStop(0, 'rgba(255,190,110,' + (0.5 * pulse) + ')');
      rg.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(bx, by, 40, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(255,214,150,' + (0.55 + 0.4 * pulse) + ')';
      ctx.beginPath(); ctx.arc(bx, by, 3.2, 0, TAU); ctx.fill();
    }
    ctx.save();
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,214,150,0.35)';
    ctx.letterSpacing = '3px';
    ctx.fillText('LA PASSE', cx, h - 44);
    ctx.restore(); ctx.save(); ctx.textAlign = 'center';
    ctx.restore();
  }

  function drawRocks() {
    for (var i = 0; i < S.rocks.length; i++) {
      var r = S.rocks[i];
      // écume
      var fo = 0.13 + 0.07 * Math.sin(S.t * 1.7 + r.ph);
      var fr = r.r * 1.45 + Math.sin(S.t * 2 + r.ph) * 2.5;
      ctx.strokeStyle = 'rgba(159,196,232,' + fo + ')';
      ctx.lineWidth = 2.2;
      for (var a2 = 0; a2 < 3; a2++) {
        var st2 = r.ph + a2 * 2.09 + Math.sin(S.t * 0.8 + a2) * 0.2;
        ctx.beginPath(); ctx.arc(r.x, r.y, fr, st2, st2 + 1.25); ctx.stroke();
      }
      ctx.beginPath();
      for (var p = 0; p < r.pts.length; p++) {
        var a = p / r.pts.length * TAU;
        var x = r.x + Math.cos(a) * r.pts[p], y = r.y + Math.sin(a) * r.pts[p] * 0.85;
        if (p === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = '#060a12'; ctx.fill();
      ctx.strokeStyle = 'rgba(120,155,195,0.22)'; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  function drawFog() {
    ctx.save();
    for (var i = 0; i < S.fogs.length; i++) {
      var f = S.fogs[i];
      var r = f.r * (1 + Math.sin(f.ph) * 0.05);
      var g = ctx.createRadialGradient(f.x, f.y, r * 0.15, f.x, f.y, r);
      g.addColorStop(0, 'rgba(150,175,205,0.24)');
      g.addColorStop(0.6, 'rgba(120,145,180,0.13)');
      g.addColorStop(1, 'rgba(110,135,170,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // Le cône est peint en plusieurs couches concentriques (de la plus large et
  // pâle à la plus étroite et vive) : les bords s'estompent au lieu de couper net.
  var CONE_K = [1.00, 0.86, 0.70, 0.54, 0.38, 0.22, 0.10];
  var CONE_A = [0.045, 0.050, 0.055, 0.062, 0.070, 0.080, 0.095];

  function cone(a, hw, range, mul) {
    for (var i = 0; i < CONE_K.length; i++) {
      var k = CONE_K[i], al = CONE_A[i] * mul;
      if (al < 0.002) continue;
      var g = ctx.createRadialGradient(S.cx, S.cy, 10, S.cx, S.cy, range);
      g.addColorStop(0, 'rgba(255,214,150,' + al * 1.35 + ')');
      g.addColorStop(0.30, 'rgba(255,182,96,' + al + ')');
      g.addColorStop(0.72, 'rgba(255,150,68,' + al * 0.5 + ')');
      g.addColorStop(1, 'rgba(255,130,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(S.cx, S.cy);
      ctx.arc(S.cx, S.cy, range, a - hw * k, a + hw * k);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawBeam() {
    if (!S.lamp || !isFinite(S.beamRange) || !isFinite(S.hw) || !isFinite(S.angle)) return;
    var range = S.beamRange, hw = S.hw, a = S.angle;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // rémanence : la lumière traîne derrière le balayage
    for (var t = S.hist.length - 1; t >= 0; t--) {
      var h = S.hist[t];
      if (Math.abs(wrapPi(h.a - a)) < 0.02) continue;
      cone(h.a, h.hw, range, 0.10 * (t + 1) / S.hist.length);
    }
    cone(a, hw, range, lerp(0.75, 1.5, S.power));
    // trait central
    ctx.strokeStyle = 'rgba(255,240,210,' + (0.08 + 0.20 * S.power) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(S.cx, S.cy);
    ctx.lineTo(S.cx + Math.cos(a) * range, S.cy + Math.sin(a) * range); ctx.stroke();
    ctx.restore();
  }

  function drawLights() {
    for (var i = 0; i < S.lights.length; i++) {
      var l = S.lights[i];
      var life = l.dead ? Math.max(0, 1 - l.dead / 0.8) : 1;
      var stun = l.stun > 0 ? 0.22 : 1;
      var p = (0.6 + 0.4 * Math.sin(l.ph)) * life * stun;
      var R = 34 + 10 * Math.sin(l.ph * 0.7);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, R * 2.4);
      g.addColorStop(0, 'rgba(143,242,212,' + (0.55 * p) + ')');
      g.addColorStop(0.4, 'rgba(90,200,190,' + (0.18 * p) + ')');
      g.addColorStop(1, 'rgba(60,150,150,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(l.x, l.y, R * 2.4, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(200,255,240,' + (0.75 * p) + ')';
      ctx.beginPath(); ctx.arc(l.x, l.y, 3, 0, TAU); ctx.fill();
      if (l.hold > 0.05 && !l.dead) {
        ctx.strokeStyle = 'rgba(255,220,160,0.8)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(l.x, l.y, 16, -Math.PI / 2, -Math.PI / 2 + TAU * (l.hold / 1.2)); ctx.stroke();
      }
    }
  }

  function drawShips() {
    for (var i = 0; i < S.ships.length; i++) {
      var sh = S.ships[i], t = sh.t;
      var vis = sh.alive ? sh.born : Math.max(0, sh.fade);
      if (vis <= 0) continue;
      var glow = sh.state === 'guided' ? 0.95 : (0.42 + sh.lit * 0.5 + sh.conf * 0.25);
      ctx.save();
      ctx.translate(sh.x, sh.y); ctx.rotate(sh.hd);
      var L = t.len, B = t.beam;
      // sillage
      ctx.strokeStyle = 'rgba(159,196,232,' + (0.16 * vis) + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-L * 0.5, 0); ctx.lineTo(-L * 1.9, 0); ctx.stroke();
      // coque
      ctx.beginPath();
      ctx.moveTo(L * 0.55, 0);
      ctx.quadraticCurveTo(L * 0.1, B * 0.55, -L * 0.5, B * 0.42);
      ctx.lineTo(-L * 0.5, -B * 0.42);
      ctx.quadraticCurveTo(L * 0.1, -B * 0.55, L * 0.55, 0);
      ctx.closePath();
      ctx.fillStyle = 'rgba(13,22,36,' + vis + ')'; ctx.fill();
      ctx.strokeStyle = 'rgba(' + (sh.state === 'guided' ? '255,200,130' : '150,185,225') + ',' + (glow * vis) + ')';
      ctx.lineWidth = 1.4; ctx.stroke();
      // mât
      ctx.strokeStyle = 'rgba(' + (sh.state === 'guided' ? '255,210,150' : '150,185,225') + ',' + (glow * 0.8 * vis) + ')';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-2, -B * 0.9); ctx.stroke();
      // fanal froid du navire perdu : il reste repérable dans la nuit
      if (sh.state === 'lost') {
        var cp = 0.55 + 0.45 * Math.sin(sh.wob * 1.7);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        var cg = ctx.createRadialGradient(0, -B * 0.9, 0, 0, -B * 0.9, 20);
        var cc = sh.danger > 0.55 ? '226,113,95' : '150,190,235';
        cg.addColorStop(0, 'rgba(' + cc + ',' + (0.5 * cp * vis) + ')');
        cg.addColorStop(1, 'rgba(' + cc + ',0)');
        ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, -B * 0.9, 20, 0, TAU); ctx.fill();
        ctx.restore();
        ctx.fillStyle = 'rgba(220,240,255,' + (0.55 * cp * vis) + ')';
        ctx.beginPath(); ctx.arc(0, -B * 0.9, 1.6, 0, TAU); ctx.fill();
      }
      // fanal chaud
      if (sh.state === 'guided' || sh.lit > 0.15) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        var gg = ctx.createRadialGradient(L * 0.35, 0, 0, L * 0.35, 0, 26);
        gg.addColorStop(0, 'rgba(255,205,140,' + (0.5 * glow * vis) + ')');
        gg.addColorStop(1, 'rgba(255,180,110,0)');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(L * 0.35, 0, 26, 0, TAU); ctx.fill();
        ctx.restore();
      }
      ctx.restore();

      // jauge de confiance
      if (sh.alive && sh.state === 'lost') {
        var rr = t.r + 13;
        ctx.strokeStyle = 'rgba(150,185,225,' + (0.20 + 0.22 * sh.danger) + ')'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(sh.x, sh.y, rr, 0, TAU); ctx.stroke();
        if (sh.danger > 0.6) {
          var dp = 0.5 + 0.5 * Math.sin(S.t * 7);
          ctx.strokeStyle = 'rgba(226,113,95,' + (0.5 * dp * (sh.danger - 0.6) / 0.4) + ')';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(sh.x, sh.y, rr + 5 + dp * 3, 0, TAU); ctx.stroke();
        }
        if (sh.conf > 0.005) {
          ctx.strokeStyle = 'rgba(255,196,107,0.95)';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(sh.x, sh.y, rr, -Math.PI / 2, -Math.PI / 2 + TAU * sh.conf); ctx.stroke();
        }
      }
      // nom
      var na = (sh.lit * 0.6 + sh.conf * 0.35 + (sh.kind === 'aurore' || sh.kind === 'kerloch' ? 0.5 : 0.2)) * vis;
      if (na > 0.06) {
        ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(220,233,247,' + Math.min(0.75, na) + ')';
        ctx.fillText(sh.name, sh.x, sh.y + t.r + 26);
      }
    }
  }

  function drawTower() {
    var cx = S.cx, cy = S.cy;
    // rocher
    ctx.beginPath(); ctx.ellipse(cx, cy + 10, 40, 26, 0, 0, TAU);
    ctx.fillStyle = '#070c15'; ctx.fill();
    ctx.strokeStyle = 'rgba(130,165,205,0.25)'; ctx.lineWidth = 1; ctx.stroke();
    // tour
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy + 12); ctx.lineTo(cx - 7, cy - 26);
    ctx.lineTo(cx + 7, cy - 26); ctx.lineTo(cx + 12, cy + 12);
    ctx.closePath();
    ctx.fillStyle = '#0d1523'; ctx.fill();
    ctx.strokeStyle = 'rgba(160,195,235,0.4)'; ctx.stroke();
    // lanterne
    var on = S.lamp && S.mode !== 'title' ? 1 : (S.mode === 'title' ? 0.7 : 0.12);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(cx, cy - 30, 0, cx, cy - 30, 60);
    g.addColorStop(0, 'rgba(255,225,170,' + (0.75 * on) + ')');
    g.addColorStop(1, 'rgba(255,180,100,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy - 30, 60, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,236,205,' + (0.35 + 0.6 * on) + ')';
    ctx.beginPath(); ctx.arc(cx, cy - 30, 4.5, 0, TAU); ctx.fill();
  }

  // ---------- interface ----------
  function bar(x, y, w, h, v, col, label, warn) {
    ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(v, 0, 1), h);
    if (warn) { ctx.strokeStyle = 'rgba(255,120,90,0.9)'; ctx.lineWidth = 1; ctx.strokeRect(x - 0.5, y - 0.5, w + 1, h + 1); }
    ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(220,233,247,0.5)';
    ctx.fillText(label, x, y - 6);
  }

  function drawHUD() {
    var w = S.w, h = S.h;
    ctx.save();
    ctx.textAlign = 'left';
    ctx.font = '600 12px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(220,233,247,0.85)';
    ctx.fillText('NUIT ' + S.night + ' / 7', 22, 32);
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = COL.dim;
    ctx.fillText(S.souls + ' âmes', 22, 50);
    // lanternes restantes
    for (var i = 0; i < Math.max(3, S.lives); i++) {
      var on = i < S.lives;
      ctx.beginPath(); ctx.arc(26 + i * 15, 66, 4, 0, TAU);
      ctx.fillStyle = on ? 'rgba(255,196,107,0.9)' : 'rgba(255,255,255,0.13)'; ctx.fill();
    }
    ctx.textAlign = 'right';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = COL.dim;
    ctx.fillText('record ' + S.best, w - 22, 32);
    if (S.combo > 1) { ctx.fillStyle = 'rgba(255,196,107,0.8)'; ctx.fillText('série ×' + S.combo, w - 22, 50); }

    bar(22, 96, 132, 6, S.oil / K.oilMax, 'rgba(255,196,107,0.85)', 'HUILE', S.oil < K.flareCost);
    bar(22, 126, 132, 6, S.heat, S.heat > 0.75 ? 'rgba(255,110,80,0.95)' : 'rgba(255,150,90,0.7)', 'LENTILLE', S.heat > 0.85);
    if (!S.lamp) {
      ctx.textAlign = 'center'; ctx.font = '600 13px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,140,100,' + (0.5 + 0.5 * Math.sin(S.t * 9)) + ')';
      ctx.fillText('LAMPE ÉTEINTE — ' + S.blackout.toFixed(1) + 's', w / 2, S.cy - 96);
    }
    if (S.hintT > 0 && S.night === 1) {
      ctx.textAlign = 'center'; ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
      ctx.globalAlpha = clamp(S.hintT / 3, 0, 1) * 0.75;
      ctx.fillStyle = COL.ink;
      ctx.fillText('Immobilisez le faisceau sur un navire pour le convaincre — balayez pour ne perdre personne', w / 2, h - 42);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawNotes() {
    ctx.save(); ctx.textAlign = 'center';
    ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
    for (var i = 0; i < S.notes.length; i++) {
      var n = S.notes[i], p = n.t / n.dur;
      ctx.globalAlpha = (p < 0.15 ? p / 0.15 : 1 - smooth(0.6, 1, p)) * 0.95;
      ctx.fillStyle = n.color;
      ctx.fillText(n.text, n.x, n.y - p * 24);
    }
    ctx.restore();
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = 'rgba(4,8,15,0.82)';
    ctx.strokeStyle = 'rgba(255,196,107,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
  }

  function drawTitle() {
    var w = S.w, h = S.h;
    ctx.save();
    ctx.fillStyle = 'rgba(3,6,12,0.55)'; ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.ember;
    var ts = clamp(w / 13, 34, 64);
    ctx.font = '300 ' + Math.round(ts) + 'px Georgia, "Times New Roman", serif';
    ctx.letterSpacing = Math.round(ts * 0.22) + 'px';
    ctx.fillText(C.title || 'VEILLEUR', w / 2, h * 0.28);
    ctx.letterSpacing = '4px';
    ctx.font = 'italic 15px Georgia, serif';
    ctx.fillStyle = 'rgba(255,196,107,0.7)';
    ctx.fillText(C.subtitle || 'Les nuits d’Ys', w / 2, h * 0.28 + 34);
    ctx.letterSpacing = '0px';
    ctx.font = '13px Georgia, serif';
    ctx.fillStyle = 'rgba(220,233,247,0.62)';
    var pitch = C.pitch || [];
    for (var i = 0; i < pitch.length; i++) ctx.fillText(pitch[i], w / 2, h * 0.63 + i * 22);
    ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(220,233,247,0.5)';
    var ht = C.howto || [];
    for (var j = 0; j < ht.length; j++) ctx.fillText(ht[j], w / 2, h * 0.74 + j * 21);
    ctx.font = '600 13px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,196,107,' + (0.55 + 0.45 * Math.sin(S.t * 3)) + ')';
    ctx.fillText('CLIQUEZ POUR ALLUMER LA LAMPE', w / 2, h * 0.885);
    if (S.best > 0) {
      ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = COL.dim;
      ctx.fillText('record : ' + S.best + ' âmes', w / 2, h * 0.885 + 24);
    }
    ctx.restore();
  }

  function drawJournal() {
    var w = S.w, h = S.h;
    var nt = (C.nights && C.nights[S.night - 1]) || { title: 'Nuit ' + S.night, log: [] };
    ctx.save();
    ctx.fillStyle = 'rgba(3,6,12,0.78)'; ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,196,107,0.6)';
    ctx.letterSpacing = '5px';
    ctx.fillText('NUIT ' + S.night, w / 2, h * 0.32);
    ctx.letterSpacing = '0px';
    ctx.font = '300 30px Georgia, serif';
    ctx.fillStyle = COL.ember;
    ctx.fillText(nt.title || '', w / 2, h * 0.32 + 44);
    ctx.font = 'italic 15px Georgia, serif';
    ctx.fillStyle = 'rgba(220,233,247,0.72)';
    var log = nt.log || [];
    for (var i = 0; i < log.length; i++) ctx.fillText(log[i], w / 2, h * 0.32 + 96 + i * 26);
    if (S.bilan && S.bilan.night === S.night - 1) {
      var bl = S.bilan;
      ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
      ctx.letterSpacing = '2px';
      ctx.fillStyle = bl.clean ? 'rgba(255,196,107,0.75)' : 'rgba(220,233,247,0.45)';
      ctx.fillText('NUIT ' + bl.night + ' — ' + bl.saved + ' NAVIRE' + (bl.saved > 1 ? 'S' : '') + ' À QUAI, '
        + bl.lost + ' PERDU' + (bl.lost > 1 ? 'S' : '') + '  ·  +' + bl.souls + ' ÂMES'
        + (bl.clean ? '  ·  QUART SANS FAUTE' + (bl.regained ? ', UNE LANTERNE RENDUE' : '') : ''), w / 2, h * 0.68);
      ctx.letterSpacing = '0px';
    }
    ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,196,107,' + (0.4 + 0.4 * Math.sin(S.t * 3)) + ')';
    ctx.fillText('CLIC OU ESPACE — PRENDRE LE QUART', w / 2, h * 0.78);
    ctx.restore();
  }

  function drawPause() {
    ctx.save();
    ctx.fillStyle = 'rgba(3,6,12,0.7)'; ctx.fillRect(0, 0, S.w, S.h);
    ctx.textAlign = 'center';
    ctx.font = '300 34px Georgia, serif'; ctx.fillStyle = COL.ember;
    ctx.fillText('Quart suspendu', S.w / 2, S.h * 0.46);
    ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = COL.dim;
    ctx.fillText('Échap pour reprendre — R pour recommencer — M pour le son', S.w / 2, S.h * 0.46 + 30);
    ctx.restore();
  }

  function drawOver() {
    var w = S.w, h = S.h;
    var e = (C.endings && C.endings[S.endKind]) || { title: 'Fin', body: [] };
    ctx.save();
    ctx.fillStyle = 'rgba(3,6,12,0.84)'; ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center';
    ctx.font = '300 40px Georgia, serif';
    ctx.fillStyle = S.endKind === 'victory' ? COL.ember : (S.endKind === 'defeat' ? '#e2715f' : '#cbd9ea');
    ctx.fillText(e.title || '', w / 2, h * 0.28);
    ctx.font = 'italic 15px Georgia, serif';
    ctx.fillStyle = 'rgba(220,233,247,0.72)';
    var b = e.body || [];
    for (var i = 0; i < b.length; i++) ctx.fillText(b[i], w / 2, h * 0.28 + 42 + i * 26);
    var y = h * 0.28 + 60 + b.length * 26;
    ctx.font = '600 15px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = COL.ember;
    ctx.fillText(S.souls + ' âmes ramenées', w / 2, y + 24);
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = COL.dim;
    ctx.fillText('nuit ' + S.night + '  ·  ' + S.saved + ' navires  ·  ' + S.lostShips + ' naufrages  ·  ' + S.extinguished + ' feux éteints  ·  record ' + S.best, w / 2, y + 46);
    if (S.tip) {
      ctx.font = 'italic 12px Georgia, serif';
      ctx.fillStyle = 'rgba(255,196,107,0.6)';
      ctx.fillText('« ' + S.tip + ' »', w / 2, y + 78);
    }
    ctx.font = '600 13px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,196,107,' + (0.5 + 0.45 * Math.sin(S.t * 3)) + ')';
    ctx.fillText('R OU CLIC — REPRENDRE LE QUART', w / 2, h * 0.84);
    if (C.credits) {
      ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(220,233,247,0.22)';
      ctx.fillText(C.credits, w / 2, h - 24);
    }
    ctx.restore();
  }

  // ---------- boucle ----------
  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }


  // --- crochet de test (inoffensif en jeu) ---
  window.__V = {
    S: S, K: K, NIGHTS: NIGHTS,
    run: startRun,
    night: function (n) { S.started = true; S.night = n; beginNight(); S.mode = 'play'; },
    aim: function (a) { S.aimAngle = a; },
    tick: function (dt, steps) { for (var i = 0; i < (steps || 1); i++) update(dt); }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
