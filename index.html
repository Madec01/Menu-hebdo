<script>
/* === AUDIO — synthèse Web Audio, aucun fichier son === */
/* =============================================================================
 * VEILLEUR — Les nuits d'Ys
 * Module audio : tout est synthetise avec la Web Audio API.
 * Aucune dependance, aucun asset, aucun import/export.
 *
 * Usage :
 *   var audio = createAudio();
 *   // sur le premier geste utilisateur (clic / touche) :
 *   audio.resume();
 *   audio.setStorm(0.6); audio.setDanger(0.2); audio.setFocus(true);
 *   audio.sfx('save', { vol: 0.9, pan: -0.3 });
 *
 * Tonalite : re mineur / re dorien (D3 = 146.83 Hz).
 * Mix feutre : master ~0.35 + compresseur en sortie.
 * ========================================================================== */

function createAudio() {
  'use strict';

  /* ---------------------------------------------------------------- etat */
  var ctx = null;          // cree UNIQUEMENT au premier resume()
  var started = false;     // graphe persistant construit ?

  var muted = false;
  var storm = 0;           // 0..1
  var danger = 0;          // 0..1
  var focus = false;
  var lampOn = true;

  var MASTER_VOL = 0.35;
  var D3 = 146.8324;       // tonique : re
  var MAX_VOICES = 28;     // garde-fou CPU
  var voices = 0;

  var timers = [];         // setTimeout de nettoyage en cours
  var swellTimer = null;
  var confIdx = 0;         // rotation des hauteurs de 'confidence'

  /* --------------------------------------------------- noeuds persistants */
  var master = null, comp = null, ambBus = null, sfxBus = null;
  var whiteBuf = null, pinkBuf = null;

  var windSrc = null, windBp = null, windLp = null, windGain = null;
  var windLfo = null, windLfoGain = null, windAmp = null, windAmpGain = null;

  var swellSrc = null, swellLp = null, swellGain = null;

  var humA = null, humB = null, humLp = null, humGain = null;
  var humVib = null, humVibGain = null;

  var droneA = null, droneB = null, droneLp = null, droneGain = null;

  /* ------------------------------------------------------------- helpers */

  // frequence d'un degre (en demi-tons) au-dessus de re3
  function nf(semis) { return D3 * Math.pow(2, semis / 12); }

  function clamp(x, lo, hi) {
    x = +x;
    if (!isFinite(x)) return lo;
    return x < lo ? lo : (x > hi ? hi : x);
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }

  // rampe douce, sans empilement d'evenements d'automation
  function glide(param, value, tc) {
    if (!param) return;
    try { param.setTargetAtTime(value, ctx.currentTime, tc || 0.25); } catch (e) {}
  }

  function normOpts(opts) {
    opts = opts || {};
    var v = +opts.vol;   if (!isFinite(v) || v < 0) v = 1;
    var p = +opts.pan;   if (!isFinite(p)) p = 0;
    var q = +opts.pitch; if (!isFinite(q) || q <= 0) q = 1;   // ratio de frequence
    return { vol: clamp(v, 0, 4), pan: clamp(p, -1, 1), pitch: clamp(q, 0.25, 4) };
  }

  // nettoyage : arrete + deconnecte tous les noeuds ephemeres d'un son
  function reap(nodes, when) {
    voices++;
    var delay = Math.max(0, when - ctx.currentTime) * 1000 + 180;
    var id = setTimeout(function () {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (!n) continue;
        try { if (n.stop) n.stop(); } catch (e) {}
        try { n.disconnect(); } catch (e2) {}
      }
      nodes.length = 0;
      voices--;
      if (voices < 0) voices = 0;
      var k = timers.indexOf(id);
      if (k >= 0) timers.splice(k, 1);
    }, delay);
    timers.push(id);
  }

  // sortie d'un son ponctuel : gain de volume (+ panoramique si dispo)
  function voiceOut(pan, vol) {
    var g = ctx.createGain();
    g.gain.value = vol;
    var nodes = [g];
    if (ctx.createStereoPanner) {
      var p = ctx.createStereoPanner();
      try { p.pan.value = pan; } catch (e) {}
      g.connect(p);
      p.connect(sfxBus);
      nodes.push(p);
    } else {
      g.connect(sfxBus);
    }
    return { input: g, nodes: nodes };
  }

  function biquad(type, freq, q, nodes) {
    var f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    if (q !== undefined && q !== null) f.Q.value = q;
    nodes.push(f);
    return f;
  }

  function gain(v, nodes) {
    var g = ctx.createGain();
    g.gain.value = v;
    nodes.push(g);
    return g;
  }

  // source de bruit ephemere (lit de bruit partage, lecture a offset aleatoire)
  function noiseSrc(buf, dest, nodes, t, tEnd) {
    var s = ctx.createBufferSource();
    s.buffer = buf;
    s.loop = true;
    s.connect(dest);
    var off = Math.random() * Math.max(0.001, buf.duration - 0.05);
    try { s.start(t, off); } catch (e) { try { s.start(t); } catch (e2) {} }
    try { s.stop(tEnd); } catch (e3) {}
    nodes.push(s);
    return s;
  }

  // oscillateur ephemere
  function oscSrc(type, freq, dest, nodes, t, tEnd, detune) {
    var o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = freq;
    if (detune) { try { o.detune.value = detune; } catch (e) {} }
    o.connect(dest);
    try { o.start(t); } catch (e2) {}
    try { o.stop(tEnd); } catch (e3) {}
    nodes.push(o);
    return o;
  }

  // enveloppe percussive simple sur un gain
  function pluck(g, t, peak, atk, dec) {
    var p = g.gain;
    var a = Math.max(0.002, atk);
    var d = Math.max(0.01, dec);
    p.cancelScheduledValues(t);
    p.setValueAtTime(0.0001, t);
    p.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    p.exponentialRampToValueAtTime(0.0001, t + a + d);
  }

  // enveloppe de nappe (attaque lente, longue extinction)
  function pad(g, t, peak, atk, hold, rel) {
    var p = g.gain;
    p.cancelScheduledValues(t);
    p.setValueAtTime(0.0001, t);
    p.linearRampToValueAtTime(Math.max(0.0002, peak), t + atk);
    p.setValueAtTime(Math.max(0.0002, peak), t + atk + hold);
    p.exponentialRampToValueAtTime(0.0001, t + atk + hold + rel);
  }

  // partiel de cloche : sinus + decroissance exponentielle
  function partial(dest, nodes, t, freq, amp, dur, detune) {
    var g = gain(0.0001, nodes);
    g.connect(dest);
    oscSrc('sine', freq, g, nodes, t, t + dur + 0.06, detune || 0);
    pluck(g, t, amp, 0.008, dur);
    return g;
  }

  /* ------------------------------------------------------ lits de bruit */

  function makeWhite(sec) {
    var n = Math.floor(ctx.sampleRate * sec);
    var b = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  function makePink(sec) {
    var n = Math.floor(ctx.sampleRate * sec);
    var b = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = b.getChannelData(0);
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (var i = 0; i < n; i++) {
      var w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    return b;
  }

  /* ------------------------------------------------- graphe d'ambiance */

  function build() {
    whiteBuf = makeWhite(2.0);
    pinkBuf = makePink(4.0);

    comp = ctx.createDynamicsCompressor();
    try {
      comp.threshold.value = -16;
      comp.knee.value = 14;
      comp.ratio.value = 4;
      comp.attack.value = 0.006;
      comp.release.value = 0.28;
    } catch (e) {}

    master = ctx.createGain();
    master.gain.value = muted ? 0.0001 : MASTER_VOL;
    master.connect(comp);
    comp.connect(ctx.destination);

    ambBus = ctx.createGain(); ambBus.gain.value = 1;   ambBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);

    /* --- vent : bruit blanc passe-bande + LFO lents (frequence & gain) --- */
    windBp = ctx.createBiquadFilter();
    windBp.type = 'bandpass';
    windBp.frequency.value = 900;
    windBp.Q.value = 0.85;

    windLp = ctx.createBiquadFilter();
    windLp.type = 'lowpass';
    windLp.frequency.value = 2400;
    windLp.Q.value = 0.4;

    windGain = ctx.createGain();
    windGain.gain.value = 0.035;

    windSrc = ctx.createBufferSource();
    windSrc.buffer = whiteBuf;
    windSrc.loop = true;
    windSrc.connect(windBp);
    windBp.connect(windLp);
    windLp.connect(windGain);
    windGain.connect(ambBus);
    windSrc.start(0);

    windLfo = ctx.createOscillator();
    windLfo.type = 'sine';
    windLfo.frequency.value = 0.061;
    windLfoGain = ctx.createGain();
    windLfoGain.gain.value = 150;
    windLfo.connect(windLfoGain);
    windLfoGain.connect(windBp.frequency);
    windLfo.start(0);

    windAmp = ctx.createOscillator();
    windAmp.type = 'sine';
    windAmp.frequency.value = 0.093;
    windAmpGain = ctx.createGain();
    windAmpGain.gain.value = 0.018;
    windAmp.connect(windAmpGain);
    windAmpGain.connect(windGain.gain);   // s'ajoute a la valeur intrinseque
    windAmp.start(0);

    /* --- houle : bruit rose + enveloppe lente aleatoire (4-9 s) --- */
    swellLp = ctx.createBiquadFilter();
    swellLp.type = 'lowpass';
    swellLp.frequency.value = 340;
    swellLp.Q.value = 0.5;

    swellGain = ctx.createGain();
    swellGain.gain.value = 0.004;

    swellSrc = ctx.createBufferSource();
    swellSrc.buffer = pinkBuf;
    swellSrc.loop = true;
    swellSrc.connect(swellLp);
    swellLp.connect(swellGain);
    swellGain.connect(ambBus);
    swellSrc.start(0);

    /* --- bourdon chaud de la lampe : 55 Hz + 110 Hz, leger vibrato --- */
    humLp = ctx.createBiquadFilter();
    humLp.type = 'lowpass';
    humLp.frequency.value = 230;
    humLp.Q.value = 0.7;

    humGain = ctx.createGain();
    humGain.gain.value = 0.0001;

    humA = ctx.createOscillator();
    humA.type = 'sine';
    humA.frequency.value = 55;

    humB = ctx.createOscillator();
    humB.type = 'triangle';
    humB.frequency.value = 110;

    var humBG = ctx.createGain();
    humBG.gain.value = 0.34;

    humA.connect(humLp);
    humB.connect(humBG);
    humBG.connect(humLp);
    humLp.connect(humGain);
    humGain.connect(ambBus);
    humA.start(0);
    humB.start(0);

    humVib = ctx.createOscillator();
    humVib.type = 'sine';
    humVib.frequency.value = 4.7;
    humVibGain = ctx.createGain();
    humVibGain.gain.value = 7;            // cents
    humVib.connect(humVibGain);
    humVibGain.connect(humA.detune);
    humVibGain.connect(humB.detune);
    humVib.start(0);

    /* --- drone grave de tension (tres discret) --- */
    droneLp = ctx.createBiquadFilter();
    droneLp.type = 'lowpass';
    droneLp.frequency.value = 130;
    droneLp.Q.value = 1.1;

    droneGain = ctx.createGain();
    droneGain.gain.value = 0.0001;

    droneA = ctx.createOscillator();
    droneA.type = 'sawtooth';
    droneA.frequency.value = nf(0) / 4;    // re 1
    droneB = ctx.createOscillator();
    droneB.type = 'triangle';
    droneB.frequency.value = nf(7) / 4;    // la 1
    droneB.detune.value = -6;

    var droneBG = ctx.createGain();
    droneBG.gain.value = 0.55;

    droneA.connect(droneLp);
    droneB.connect(droneBG);
    droneBG.connect(droneLp);
    droneLp.connect(droneGain);
    droneGain.connect(ambBus);
    droneA.start(0);
    droneB.start(0);

    applyStorm();
    applyLamp(false);
    applyDanger();
    scheduleSwell(2200);
  }

  /* --------------------------------------------- application des etats */

  function applyStorm() {
    if (!started) return;
    var base = 0.032 + storm * 0.105;
    glide(windGain.gain, base, 0.9);
    glide(windBp.frequency, 940 - storm * 470, 1.2);   // plus sombre
    glide(windBp.Q, 0.85 + storm * 0.6, 1.0);
    glide(windLp.frequency, 2600 - storm * 1250, 1.2);
    glide(windLfoGain.gain, 130 + storm * 240, 1.0);
    glide(windAmpGain.gain, base * 0.5, 1.0);
    glide(swellLp.frequency, 350 - storm * 140, 1.2);
  }

  function applyDanger() {
    if (!started) return;
    glide(droneGain.gain, danger > 0.001 ? 0.006 + danger * 0.048 : 0.0001, 1.4);
    glide(droneLp.frequency, 110 + danger * 90, 1.4);
  }

  function applyLamp(withClick) {
    if (!started) return;
    var lvl = lampOn ? (focus ? 0.058 : 0.046) : 0.0001;
    glide(humGain.gain, lvl, lampOn ? 0.09 : 0.035);
    glide(humLp.frequency, focus ? 150 : 235, 0.25);
    glide(humLp.Q, focus ? 3.4 : 0.7, 0.25);
    glide(humVibGain.gain, focus ? 4 : 7, 0.3);
    if (withClick && !muted && ctx.state === 'running') {
      tick(ctx.currentTime, lampOn ? 0.10 : 0.13, lampOn ? 1500 : 2400);
    }
  }

  // petit declic (relais / interrupteur)
  function tick(t, amp, bright) {
    var h = voiceOut(0, amp);
    var n = h.nodes;
    var f = biquad('bandpass', bright, 1.4, n);
    f.connect(h.input);
    var g = gain(0.0001, n);
    g.connect(f);
    pluck(g, t, 1, 0.001, 0.035);
    noiseSrc(whiteBuf, g, n, t, t + 0.06);
    reap(n, t + 0.06);
  }

  function scheduleSwell(ms) {
    if (swellTimer !== null) return;
    swellTimer = setTimeout(function () {
      swellTimer = null;
      if (started && ctx && ctx.state === 'running') {
        try {
          var t = ctx.currentTime;
          var peak = 0.045 + storm * 0.15;
          var atk = rnd(1.2, 2.2);
          var dec = rnd(1.8, 3.2);
          var p = swellGain.gain;
          var cur = p.value;
          if (!isFinite(cur) || cur < 0.0005) cur = 0.0005;
          p.cancelScheduledValues(t);
          p.setValueAtTime(cur, t);
          p.linearRampToValueAtTime(peak, t + atk);
          p.linearRampToValueAtTime(0.004, t + atk + dec);
        } catch (e) {}
      }
      scheduleSwell(rnd(4000, 9000));
    }, ms);
  }

  /* ============================================================ SONS ==== */

  var SFX = {};

  /* fusee : whoosh + boum feutre + crepitement */
  SFX.flare = function (t, o) {
    var h = voiceOut(o.pan, 0.5 * o.vol);
    var n = h.nodes;

    // whoosh
    var bp = biquad('bandpass', 320, 1.3, n);
    var wg = gain(0.0001, n);
    bp.connect(wg); wg.connect(h.input);
    bp.frequency.setValueAtTime(300 * o.pitch, t);
    bp.frequency.exponentialRampToValueAtTime(2400 * o.pitch, t + 0.26);
    bp.frequency.exponentialRampToValueAtTime(620 * o.pitch, t + 0.75);
    var wp = wg.gain;
    wp.setValueAtTime(0.0001, t);
    wp.linearRampToValueAtTime(0.5, t + 0.09);
    wp.exponentialRampToValueAtTime(0.0001, t + 0.8);
    noiseSrc(whiteBuf, bp, n, t, t + 0.85);

    // boum feutre
    var lp = biquad('lowpass', 220, 0.8, n);
    var bg = gain(0.0001, n);
    lp.connect(bg); bg.connect(h.input);
    var bo = oscSrc('sine', 72 * o.pitch, lp, n, t + 0.02, t + 0.6);
    bo.frequency.setValueAtTime(72 * o.pitch, t + 0.02);
    bo.frequency.exponentialRampToValueAtTime(34 * o.pitch, t + 0.42);
    pluck(bg, t + 0.02, 0.55, 0.02, 0.42);

    // crepitement (une seule source, gain module par pics)
    var hp = biquad('highpass', 2300, 0.8, n);
    var cg = gain(0.0001, n);
    hp.connect(cg); cg.connect(h.input);
    var cp = cg.gain;
    cp.setValueAtTime(0.0001, t);
    var last = t + 0.1;
    for (var i = 0; i < 9; i++) {
      // chaque pic est entierement resolu avant le suivant : evenements ordonnes
      var ti = last + rnd(0.025, 0.05);
      var a = 0.16 * (1 - i / 11) * rnd(0.5, 1);
      cp.setValueAtTime(0.0001, ti);
      cp.linearRampToValueAtTime(a, ti + 0.004);
      cp.exponentialRampToValueAtTime(0.0001, ti + 0.032);
      last = ti + 0.032;
    }
    noiseSrc(whiteBuf, hp, n, t + 0.1, t + 0.82);

    reap(n, t + 0.9);
  };

  /* surchauffe : verre qui craque puis coupure */
  SFX.overheat = function (t, o) {
    var h = voiceOut(o.pan, 0.42 * o.vol);
    var n = h.nodes;

    // craquements de verre
    var bp = biquad('bandpass', 3200, 11, n);
    var cg = gain(0.0001, n);
    bp.connect(cg); cg.connect(h.input);
    var cp = cg.gain;
    cp.setValueAtTime(0.0001, t);
    var last = t;
    for (var i = 0; i < 6; i++) {
      var ti = last + rnd(0.02, 0.045);
      bp.frequency.setValueAtTime(rnd(2100, 6200) * o.pitch, ti);
      cp.setValueAtTime(0.0001, ti);
      cp.linearRampToValueAtTime(rnd(0.25, 0.6), ti + 0.003);
      cp.exponentialRampToValueAtTime(0.0001, ti + 0.032);
      last = ti + 0.032;
    }
    noiseSrc(whiteBuf, bp, n, t, t + 0.48);

    // coupure : chute rapide + souffle qui meurt
    var lp = biquad('lowpass', 900, 1.2, n);
    var dg = gain(0.0001, n);
    lp.connect(dg); dg.connect(h.input);
    var dv = oscSrc('triangle', 420 * o.pitch, lp, n, t + 0.30, t + 0.62);
    dv.frequency.setValueAtTime(420 * o.pitch, t + 0.30);
    dv.frequency.exponentialRampToValueAtTime(72 * o.pitch, t + 0.52);
    lp.frequency.setValueAtTime(900, t + 0.30);
    lp.frequency.exponentialRampToValueAtTime(160, t + 0.55);
    pluck(dg, t + 0.30, 0.42, 0.008, 0.26);

    tick(t + 0.30, 0.11, 2200);
    reap(n, t + 0.7);
  };

  /* rallumage : souffle + montee chaude */
  SFX.relight = function (t, o) {
    var h = voiceOut(o.pan, 0.42 * o.vol);
    var n = h.nodes;

    // souffle d'allumage
    var lp = biquad('lowpass', 200, 0.9, n);
    var sg = gain(0.0001, n);
    lp.connect(sg); sg.connect(h.input);
    lp.frequency.setValueAtTime(200, t);
    lp.frequency.exponentialRampToValueAtTime(1500, t + 0.22);
    lp.frequency.exponentialRampToValueAtTime(400, t + 0.62);
    var sp = sg.gain;
    sp.setValueAtTime(0.0001, t);
    sp.linearRampToValueAtTime(0.34, t + 0.06);
    sp.exponentialRampToValueAtTime(0.0001, t + 0.66);
    noiseSrc(whiteBuf, lp, n, t, t + 0.7);

    // montee chaude : re2 -> re3, quinte a la suite
    var wlp = biquad('lowpass', 300, 0.9, n);
    var wg = gain(0.0001, n);
    wlp.connect(wg); wg.connect(h.input);
    wlp.frequency.setValueAtTime(280, t);
    wlp.frequency.exponentialRampToValueAtTime(1100, t + 0.7);
    var wo = oscSrc('triangle', nf(0) / 2 * o.pitch, wlp, n, t + 0.03, t + 1.25);
    wo.frequency.setValueAtTime(nf(0) / 2 * o.pitch, t + 0.03);
    wo.frequency.exponentialRampToValueAtTime(nf(0) * o.pitch, t + 0.55);
    oscSrc('sine', nf(7) * o.pitch, wlp, n, t + 0.18, t + 1.25, -4);
    pad(wg, t + 0.03, 0.30, 0.30, 0.15, 0.7);

    tick(t, 0.08, 1700);
    reap(n, t + 1.35);
  };

  /* sauvetage : cloche de port claire, note douce */
  SFX.save = function (t, o) {
    var h = voiceOut(o.pan, 0.34 * o.vol);
    var n = h.nodes;
    var lp = biquad('lowpass', 3400, 0.6, n);
    lp.connect(h.input);

    var f1 = nf(19) * o.pitch;              // la 4
    partial(lp, n, t, f1, 0.30, 1.5);
    partial(lp, n, t, f1 * 2.0, 0.13, 1.0, 3);
    partial(lp, n, t, f1 * 2.98, 0.07, 0.7, -4);
    partial(lp, n, t, f1 * 0.5, 0.16, 1.8);  // octave grave, chaleur

    var f2 = nf(24) * o.pitch;              // re 5 : resolution douce
    partial(lp, n, t + 0.20, f2, 0.22, 1.7);
    partial(lp, n, t + 0.20, f2 * 0.5, 0.12, 1.9);
    partial(lp, n, t + 0.20, f2 * 2.01, 0.06, 0.8);

    reap(n, t + 2.3);
  };

  /* naufrage : craquement de bois grave + fracas d'eau */
  SFX.wreck = function (t, o) {
    var h = voiceOut(o.pan, 0.5 * o.vol);
    var n = h.nodes;

    // craquements de bois
    var bp = biquad('bandpass', 420, 7, n);
    var cg = gain(0.0001, n);
    bp.connect(cg); cg.connect(h.input);
    var cp = cg.gain;
    cp.setValueAtTime(0.0001, t);
    var last = t;
    for (var i = 0; i < 7; i++) {
      var ti = last + rnd(0.02, 0.05);
      bp.frequency.setValueAtTime(rnd(190, 820) * o.pitch, ti);
      cp.setValueAtTime(0.0001, ti);
      cp.linearRampToValueAtTime(rnd(0.3, 0.75), ti + 0.005);
      cp.exponentialRampToValueAtTime(0.0001, ti + 0.062);
      last = ti + 0.062;
    }
    noiseSrc(whiteBuf, bp, n, t, t + 0.78);

    // grondement de coque
    var glp = biquad('lowpass', 260, 1.1, n);
    var gg = gain(0.0001, n);
    glp.connect(gg); gg.connect(h.input);
    var lo = oscSrc('sawtooth', 88 * o.pitch, glp, n, t, t + 0.9);
    lo.frequency.setValueAtTime(88 * o.pitch, t);
    lo.frequency.exponentialRampToValueAtTime(32 * o.pitch, t + 0.7);
    pluck(gg, t, 0.34, 0.03, 0.75);

    // fracas d'eau
    var wlp = biquad('lowpass', 2600, 0.7, n);
    var wg = gain(0.0001, n);
    wlp.connect(wg); wg.connect(h.input);
    wlp.frequency.setValueAtTime(2600, t + 0.18);
    wlp.frequency.exponentialRampToValueAtTime(240, t + 1.5);
    var wp = wg.gain;
    wp.setValueAtTime(0.0001, t + 0.18);
    wp.linearRampToValueAtTime(0.42, t + 0.30);
    wp.exponentialRampToValueAtTime(0.0001, t + 1.75);
    noiseSrc(pinkBuf, wlp, n, t + 0.18, t + 1.8);

    reap(n, t + 1.9);
  };

  /* feu d'Ys qui s'allume : vitreux, desaccorde, inquietant */
  SFX.wrecker_in = function (t, o) {
    var h = voiceOut(o.pan, 0.3 * o.vol);
    var n = h.nodes;

    var hp = biquad('highpass', 380, 0.7, n);
    var trem = gain(1, n);                 // module par un LFO ephemere
    hp.connect(trem); trem.connect(h.input);

    var lfoG = gain(0.28, n);
    lfoG.connect(trem.gain);
    oscSrc('sine', 5.3, lfoG, n, t, t + 1.9);

    var g = gain(0.0001, n);
    g.connect(hp);
    var base = nf(12) * o.pitch;           // re 4
    oscSrc('triangle', base, g, n, t, t + 1.9, -32);
    oscSrc('sine', nf(18) * o.pitch, g, n, t + 0.05, t + 1.9, 26);   // triton
    oscSrc('sine', base * 2, g, n, t + 0.1, t + 1.9, -46);
    pad(g, t, 0.26, 0.34, 0.25, 1.1);

    reap(n, t + 2.0);
  };

  /* feu d'Ys eteint : souffle inverse, soulagement */
  SFX.wrecker_out = function (t, o) {
    var h = voiceOut(o.pan, 0.36 * o.vol);
    var n = h.nodes;

    var bp = biquad('bandpass', 300, 1.1, n);
    var sg = gain(0.0001, n);
    bp.connect(sg); sg.connect(h.input);
    bp.frequency.setValueAtTime(300 * o.pitch, t);
    bp.frequency.exponentialRampToValueAtTime(2600 * o.pitch, t + 0.5);
    var sp = sg.gain;
    sp.setValueAtTime(0.0001, t);
    sp.linearRampToValueAtTime(0.42, t + 0.5);     // souffle inverse
    sp.exponentialRampToValueAtTime(0.0001, t + 0.58);
    noiseSrc(whiteBuf, bp, n, t, t + 0.62);

    // resolution chaude : la3 + re4
    var lp = biquad('lowpass', 1600, 0.7, n);
    lp.connect(h.input);
    partial(lp, n, t + 0.48, nf(7) * o.pitch, 0.22, 1.1);
    partial(lp, n, t + 0.48, nf(12) * o.pitch, 0.11, 1.0, -3);

    reap(n, t + 1.7);
  };

  /* cloche lointaine d'Ys : spectrale, inharmonique, voilee */
  SFX.bell = function (t, o) {
    var h = voiceOut(o.pan, 0.24 * o.vol);
    var n = h.nodes;
    var lp = biquad('lowpass', 1150, 0.6, n);
    lp.connect(h.input);

    var f = nf(0) * o.pitch;                 // re 3
    partial(lp, n, t, f, 0.26, 3.6);
    partial(lp, n, t, f * 2.01, 0.15, 2.9, 6);
    partial(lp, n, t, f * 2.76, 0.09, 2.1, -9);
    partial(lp, n, t, f * 5.42, 0.04, 1.2, 11);
    partial(lp, n, t, f * 0.5, 0.10, 3.9);

    reap(n, t + 4.2);
  };

  /* corne de brume : grave, deux couches, debut de nuit */
  SFX.foghorn = function (t, o) {
    var h = voiceOut(o.pan, 0.3 * o.vol);
    var n = h.nodes;

    var lp = biquad('lowpass', 430, 1.6, n);
    var g = gain(0.0001, n);
    lp.connect(g); g.connect(h.input);

    var base = nf(0) / 2 * o.pitch;          // re 2
    var a = oscSrc('sawtooth', base, lp, n, t, t + 2.9);
    oscSrc('sine', base / 2, lp, n, t, t + 2.9, 4);
    oscSrc('triangle', base * 1.005, lp, n, t, t + 2.9, -7);
    a.frequency.setValueAtTime(base, t + 1.6);
    a.frequency.linearRampToValueAtTime(base * 0.972, t + 2.7);   // affaissement final

    pad(g, t, 0.34, 0.38, 1.15, 1.2);
    lp.frequency.setValueAtTime(300, t);
    lp.frequency.linearRampToValueAtTime(470, t + 0.5);
    lp.frequency.linearRampToValueAtTime(260, t + 2.8);

    reap(n, t + 3.0);
  };

  /* clic d'interface : sec, discret */
  SFX.ui = function (t, o) {
    var h = voiceOut(o.pan, 0.24 * o.vol);
    var n = h.nodes;
    var bp = biquad('bandpass', 1900 * o.pitch, 1.6, n);
    var g = gain(0.0001, n);
    bp.connect(g); g.connect(h.input);
    pluck(g, t, 0.55, 0.001, 0.028);
    noiseSrc(whiteBuf, bp, n, t, t + 0.05);

    var tg = gain(0.0001, n);
    tg.connect(h.input);
    oscSrc('sine', nf(31) * o.pitch, tg, n, t, t + 0.07);   // la 5
    pluck(tg, t, 0.16, 0.002, 0.045);

    reap(n, t + 0.1);
  };

  /* palier de confiance : ping tres court, rotation de hauteurs (re dorien) */
  var CONF = [24, 26, 27, 31];                 // re5, mi5, fa5, la5
  SFX.confidence = function (t, o) {
    var h = voiceOut(o.pan, 0.16 * o.vol);
    var n = h.nodes;
    var lp = biquad('lowpass', 4200, 0.6, n);
    lp.connect(h.input);
    var f = nf(CONF[confIdx % CONF.length]) * o.pitch;
    confIdx++;
    var g = gain(0.0001, n);
    g.connect(lp);
    oscSrc('sine', f, g, n, t, t + 0.24);
    oscSrc('triangle', f * 2, g, n, t, t + 0.16, 4);
    pluck(g, t, 0.34, 0.004, 0.16);
    reap(n, t + 0.3);
  };

  /* fin de nuit : accord ouvert (quintes), apaise */
  SFX.nightclear = function (t, o) {
    var h = voiceOut(o.pan, 0.26 * o.vol);
    var n = h.nodes;
    var lp = biquad('lowpass', 1900, 0.6, n);
    lp.connect(h.input);
    lp.frequency.setValueAtTime(900, t);
    lp.frequency.linearRampToValueAtTime(2400, t + 1.1);

    var degs = [0, 7, 14, 19];                 // re3 la3 mi4 la4
    for (var i = 0; i < degs.length; i++) {
      var g = gain(0.0001, n);
      g.connect(lp);
      var ti = t + i * 0.06;
      oscSrc('triangle', nf(degs[i]) * o.pitch, g, n, ti, ti + 2.9, i % 2 ? 4 : -4);
      oscSrc('sine', nf(degs[i]) * 2 * o.pitch, g, n, ti, ti + 2.4);
      pad(g, ti, 0.13, 0.35, 0.5, 1.7);
    }
    reap(n, t + 3.1);
  };

  /* fin de partie : descente grave */
  SFX.gameover = function (t, o) {
    var h = voiceOut(o.pan, 0.4 * o.vol);
    var n = h.nodes;
    var lp = biquad('lowpass', 900, 1.0, n);
    var g = gain(0.0001, n);
    lp.connect(g); g.connect(h.input);
    lp.frequency.setValueAtTime(900, t);
    lp.frequency.exponentialRampToValueAtTime(130, t + 2.0);

    var a = oscSrc('triangle', nf(0) * o.pitch, lp, n, t, t + 2.6);
    a.frequency.setValueAtTime(nf(0) * o.pitch, t);
    a.frequency.exponentialRampToValueAtTime(nf(0) / 4 * o.pitch, t + 1.9);

    var b = oscSrc('sine', nf(3) * o.pitch, lp, n, t + 0.08, t + 2.6, -8);
    b.frequency.setValueAtTime(nf(3) * o.pitch, t + 0.08);
    b.frequency.exponentialRampToValueAtTime(nf(3) / 4 * o.pitch, t + 2.0);

    pad(g, t, 0.36, 0.12, 1.1, 1.2);
    reap(n, t + 2.7);
  };

  /* victoire : accord majeur voile (tierce picarde sur re) */
  SFX.victory = function (t, o) {
    var h = voiceOut(o.pan, 0.28 * o.vol);
    var n = h.nodes;
    var lp = biquad('lowpass', 1300, 0.7, n);
    lp.connect(h.input);
    lp.frequency.setValueAtTime(800, t);
    lp.frequency.linearRampToValueAtTime(2600, t + 1.6);

    var degs = [0, 7, 16, 24, 31];             // re3 la3 fa#4 re5 la5
    var amps = [0.16, 0.13, 0.10, 0.09, 0.05];
    for (var i = 0; i < degs.length; i++) {
      var g = gain(0.0001, n);
      g.connect(lp);
      var ti = t + i * 0.11;
      oscSrc('triangle', nf(degs[i]) * o.pitch, g, n, ti, ti + 3.4, i % 2 ? 5 : -5);
      oscSrc('sine', nf(degs[i]) * 0.5 * o.pitch, g, n, ti, ti + 3.0);
      pad(g, ti, amps[i], 0.4, 0.7, 2.0);
    }
    // petite cloche de port par-dessus
    partial(lp, n, t + 0.5, nf(31) * o.pitch, 0.10, 2.0);
    reap(n, t + 3.9);
  };

  /* ============================================================== API === */

  function resume() {
    try {
      if (!ctx) {
        var AC = (typeof window !== 'undefined')
          ? (window.AudioContext || window.webkitAudioContext)
          : null;
        if (!AC) return;
        ctx = new AC();
        try {
          build();
          started = true;
        } catch (eb) {
          try { if (ctx.close) ctx.close(); } catch (ec) {}
          ctx = null;
          started = false;
          return;
        }
      }
      if (ctx.state !== 'running' && ctx.resume) {
        var p = ctx.resume();
        if (p && p['catch']) p['catch'](function () {});
      }
    } catch (e) {}
  }

  function suspend() {
    if (!ctx) return;
    try {
      if (ctx.state === 'running' && ctx.suspend) {
        var p = ctx.suspend();
        if (p && p['catch']) p['catch'](function () {});
      }
    } catch (e) {}
  }

  function setMute(v) {
    muted = !!v;
    if (!started) return;
    try { glide(master.gain, muted ? 0.0001 : MASTER_VOL, 0.05); } catch (e) {}
  }

  function toggleMute() {
    setMute(!muted);
    return muted;
  }

  function isMuted() { return muted; }

  function setStorm(x) {
    storm = clamp(x, 0, 1);
    applyStorm();
  }

  function setDanger(x) {
    danger = clamp(x, 0, 1);
    applyDanger();
  }

  function setFocus(v) {
    v = !!v;
    if (v === focus) return;
    focus = v;
    applyLamp(false);
  }

  function setLamp(v) {
    v = !!v;
    if (v === lampOn) return;
    lampOn = v;
    applyLamp(true);
  }

  function sfx(name, opts) {
    if (!ctx || !started || muted) return;
    if (ctx.state !== 'running') return;
    if (voices > MAX_VOICES) return;
    if (!Object.prototype.hasOwnProperty.call(SFX, name)) return;  // pas de 'toString' & co
    var fn = SFX[name];
    if (typeof fn !== 'function') return;
    try {
      fn(ctx.currentTime + 0.005, normOpts(opts));
    } catch (e) {}
  }

  return {
    resume: resume,
    suspend: suspend,
    setMute: setMute,
    toggleMute: toggleMute,
    isMuted: isMuted,
    setStorm: setStorm,
    setFocus: setFocus,
    setLamp: setLamp,
    setDanger: setDanger,
    sfx: sfx
  };
}

<script>
/* === EFFETS — mer, pluie, particules === */
/* =========================================================================
   VEILLEUR — Les nuits d'Ys : module d'effets visuels (canvas 2D, vanilla)
   Aucune dependance, aucun asset, aucun code execute au chargement.
   Usage :  var fx = createFX();
            fx.resize(w, h); fx.setStorm(0.6); fx.setWind(-40);
            fx.update(dt);
            fx.drawSea(ctx, w, h, t);   // couche arriere
            ... jeu ...
            fx.drawFront(ctx, w, h);    // couche avant
   Toutes les coordonnees sont en pixels CSS.
   ========================================================================= */

function createFX() {
  'use strict';

  /* ---------------------------------------------------------------
     Constantes / palette (chaines pre-allouees : aucune concatenation
     de couleur dans les boucles chaudes).
     --------------------------------------------------------------- */
  var TAU = Math.PI * 2;

  var C_NIGHT   = '#070d18';
  var C_DEEP    = '#0d1a2e';
  var C_CREST   = '#16304f';
  var C_FOAM    = '#9fc4e8';
  var C_AMBER   = '#ffc46b';
  var C_AMBER_D = '#ff8a3c';
  var C_RAIN    = '#9fc4e8';
  var C_BOLT    = '#e6f0ff';
  var C_WOOD_A  = '#2e2318';
  var C_WOOD_B  = '#4a3726';
  var C_SMOKE   = '#33455f';
  var TRANSP    = 'rgba(0,0,0,0)';

  // Plafonds durs
  var MAX_P     = 1200;   // particules (spark/smoke/debris/splash)
  var MAX_SPRAY = 260;    // embruns
  var MAX_RAIN  = 460;    // gouttes (3 couches de parallaxe)
  var MAX_RING  = 24;
  var MAX_GLOW  = 24;
  var BOLT_SEG  = 14;

  // Types de particules
  var K_SPARK = 0, K_SMOKE = 1, K_DEBRIS = 2, K_SPLASH = 3;

  /* ---------------------------------------------------------------
     Etat global
     --------------------------------------------------------------- */
  var W = 800, H = 600;
  var wind = 0;          // px/s
  var storm = 0.35;      // 0..1
  var time = 0;

  var shakeMag = 0, shakeT = 0;
  var shPhA = Math.random() * TAU, shPhB = Math.random() * TAU;
  var shOffX = 0, shOffY = 0;

  var flash = 0;          // 0..0.25
  var flashPeak = 0.25;
  var restrikeT = -1;     // < 0 : pas de re-amorcage programme
  var restrikeAmp = 0;
  var boltLife = 0, boltDur = 0.34, boltAlpha = 0;
  var boltPts = new Float32Array(BOLT_SEG * 2);
  var boltBranch = new Float32Array(8); // 2 petites ramifications (2 pts chacune)
  var nextBolt = 6 + Math.random() * 10;

  // caches de degrades (recrees uniquement au resize)
  var gSea = null, gVign = null, gHaze = null, gW = -1, gH = -1;

  /* ---------------------------------------------------------------
     Pool de particules : tableau d'objets pre-alloues, compaction par
     swap (aucune allocation dans update/draw).
     --------------------------------------------------------------- */
  var P = new Array(MAX_P);
  var pCount = 0;
  (function () {
    for (var i = 0; i < MAX_P; i++) {
      P[i] = {
        x: 0, y: 0, vx: 0, vy: 0,
        life: 0, max: 1, size: 1, grow: 0,
        rot: 0, vrot: 0, drag: 0, grav: 0,
        a0: 1, kind: 0, col: C_FOAM
      };
    }
  })();

  function spawn() {
    if (pCount >= MAX_P) return null;
    return P[pCount++];
  }

  /* ---------------- embruns (pool separe) ---------------- */
  var SP = new Array(MAX_SPRAY);
  var spCount = 0;
  var sprayAcc = 0;
  (function () {
    for (var i = 0; i < MAX_SPRAY; i++) {
      SP[i] = { x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, a0: 1 };
    }
  })();

  /* ---------------- anneaux de choc ---------------- */
  var RG = new Array(MAX_RING);
  var rgCount = 0;
  (function () {
    for (var i = 0; i < MAX_RING; i++) {
      RG[i] = { x: 0, y: 0, life: 0, max: 1, maxR: 40, w: 2, col: C_FOAM };
    }
  })();

  /* ---------------- halos ---------------- */
  var GL = new Array(MAX_GLOW);
  var glCount = 0;
  (function () {
    for (var i = 0; i < MAX_GLOW; i++) {
      GL[i] = { x: 0, y: 0, life: 0, max: 1, r: 40, grad: null, col: '' };
    }
  })();

  /* ---------------- pluie : 3 couches de parallaxe ---------------- */
  var rainX = new Float32Array(MAX_RAIN);
  var rainY = new Float32Array(MAX_RAIN);
  var rainV = new Float32Array(MAX_RAIN);   // vitesse verticale px/s
  var rainL = new Float32Array(MAX_RAIN);   // longueur du trait
  var rainK = new Uint8Array(MAX_RAIN);     // couche 0..2
  var rainActive = 0;

  var LAYER_V  = [340, 560, 880];           // vitesse par couche
  var LAYER_A  = [0.15, 0.27, 0.46];        // opacite par couche
  var LAYER_W  = [0.7, 1.0, 1.5];           // epaisseur
  var LAYER_WF = [0.35, 0.62, 1.0];         // sensibilite au vent

  /* ---------------- mer : houle longue + chevrons de crete ------- */
  var NBAND = 15;
  var bandY  = new Float32Array(NBAND);
  var bandPh = new Float32Array(NBAND);
  var bandSp = new Float32Array(NBAND);
  var bandAm = new Float32Array(NBAND);
  var bandAl = new Float32Array(NBAND);

  var NCREST = 150;
  var crX = new Float32Array(NCREST);
  var crY = new Float32Array(NCREST);
  var crL = new Float32Array(NCREST);
  var crS = new Float32Array(NCREST);
  var crD = new Float32Array(NCREST);   // profondeur 0..1 (parallaxe)
  var crF = new Uint8Array(NCREST);     // 1 = ecume claire

  function seedSea() {
    var i;
    for (i = 0; i < NBAND; i++) {
      bandY[i]  = (i + Math.random() * 0.6) * (H + 80) / NBAND - 40;
      bandPh[i] = Math.random() * TAU;
      bandSp[i] = 10 + Math.random() * 22;
      bandAm[i] = 5 + Math.random() * 13;
      bandAl[i] = 0.13 + Math.random() * 0.20;
    }
    for (i = 0; i < NCREST; i++) {
      crX[i] = Math.random() * (W + 160) - 80;
      crY[i] = Math.random() * (H + 60) - 30;
      crD[i] = Math.random();
      crL[i] = 16 + crD[i] * 62;
      crS[i] = 14 + crD[i] * 46;
      crF[i] = (Math.random() < 0.26) ? 1 : 0;
    }
  }

  function seedRain() {
    for (var i = 0; i < MAX_RAIN; i++) {
      var k = i % 3;
      rainK[i] = k;
      rainX[i] = Math.random() * (W + 260) - 130;
      rainY[i] = Math.random() * (H + 40) - 20;
      rainV[i] = LAYER_V[k] * (0.85 + Math.random() * 0.3);
      rainL[i] = (6 + k * 5) * (0.75 + Math.random() * 0.45);
    }
  }

  /* ---------------------------------------------------------------
     Degrades (recrees uniquement quand la taille change)
     --------------------------------------------------------------- */
  function buildGradients(ctx) {
    gSea = ctx.createLinearGradient(0, 0, 0, H);
    gSea.addColorStop(0.00, C_NIGHT);
    gSea.addColorStop(0.42, '#0a1425');
    gSea.addColorStop(0.72, C_DEEP);
    gSea.addColorStop(1.00, '#060b14');

    var cx = W * 0.5, cy = H * 0.5;
    var rMax = Math.sqrt(cx * cx + cy * cy);
    gVign = ctx.createRadialGradient(cx, cy, rMax * 0.34, cx, cy, rMax * 1.02);
    gVign.addColorStop(0.00, 'rgba(4,8,16,0)');
    gVign.addColorStop(0.55, 'rgba(4,8,16,0.30)');
    gVign.addColorStop(1.00, 'rgba(3,6,12,0.80)');

    gHaze = ctx.createLinearGradient(0, 0, 0, H);
    gHaze.addColorStop(0.00, 'rgba(126,163,214,0.55)');
    gHaze.addColorStop(0.45, 'rgba(126,163,214,0.22)');
    gHaze.addColorStop(1.00, 'rgba(126,163,214,0.06)');

    gW = W; gH = H;
  }

  function ensure(ctx, w, h) {
    if (w && h && (w !== W || h !== H)) resize(w, h);
    if (!gSea || gW !== W || gH !== H) buildGradients(ctx);
  }

  /* ---------------------------------------------------------------
     API : reglages
     --------------------------------------------------------------- */
  function resize(w, h) {
    var pw = W, ph = H;
    W = Math.max(1, w | 0);
    H = Math.max(1, h | 0);
    gSea = gVign = gHaze = null;
    if (pw !== W || ph !== H) {
      var sx = W / pw, sy = H / ph, i;
      for (i = 0; i < MAX_RAIN; i++) { rainX[i] *= sx; rainY[i] *= sy; }
      for (i = 0; i < NCREST; i++) { crX[i] *= sx; crY[i] *= sy; }
      for (i = 0; i < NBAND; i++) { bandY[i] *= sy; }
    }
    if (!isFinite(crL[0]) || crL[0] === 0) { seedSea(); seedRain(); }
    updateRainCount();
  }

  function setWind(wx) { wind = (typeof wx === 'number' && isFinite(wx)) ? wx : 0; }

  function setStorm(x) {
    storm = x < 0 ? 0 : (x > 1 ? 1 : x);
    updateRainCount();
  }

  function updateRainCount() {
    rainActive = (MAX_RAIN * (0.05 + 0.95 * storm)) | 0;
    if (rainActive > MAX_RAIN) rainActive = MAX_RAIN;
  }

  /* ---------------------------------------------------------------
     API : emetteurs
     --------------------------------------------------------------- */
  function spark(x, y, n, color, speed) {
    var c = color || C_AMBER;
    var sp = (typeof speed === 'number' && speed > 0) ? speed : 260;
    n = n | 0;
    for (var i = 0; i < n; i++) {
      var p = spawn(); if (!p) return;
      var a = Math.random() * TAU;
      var v = sp * (0.35 + Math.random() * 0.85);
      p.kind = K_SPARK;
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * v;
      p.vy = Math.sin(a) * v;
      p.max = 0.28 + Math.random() * 0.5;
      p.life = p.max;
      p.size = 0.9 + Math.random() * 1.1;
      p.grow = -0.8;
      p.drag = 3.4;
      p.grav = 60;
      p.a0 = 0.9;
      p.rot = 0; p.vrot = 0;
      p.col = (Math.random() < 0.28 && c === C_AMBER) ? C_AMBER_D : c;
    }
  }

  function smoke(x, y, n) {
    n = n | 0;
    for (var i = 0; i < n; i++) {
      var p = spawn(); if (!p) return;
      p.kind = K_SMOKE;
      p.x = x + (Math.random() - 0.5) * 12;
      p.y = y + (Math.random() - 0.5) * 10;
      p.vx = (Math.random() - 0.5) * 22 + wind * 0.10;
      p.vy = -14 - Math.random() * 26;
      p.max = 1.5 + Math.random() * 1.6;
      p.life = p.max;
      p.size = 3 + Math.random() * 4;
      p.grow = 7 + Math.random() * 9;
      p.drag = 0.45;
      p.grav = -5;
      p.a0 = 0.07 + Math.random() * 0.06;
      p.rot = 0; p.vrot = 0;
      p.col = C_SMOKE;
    }
  }

  function debris(x, y, n) {
    n = n | 0;
    for (var i = 0; i < n; i++) {
      var p = spawn(); if (!p) return;
      var a = -Math.PI * 0.5 + (Math.random() - 0.5) * 2.2;
      var v = 90 + Math.random() * 210;
      p.kind = K_DEBRIS;
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * v + wind * 0.06;
      p.vy = Math.sin(a) * v;
      p.max = 0.9 + Math.random() * 1.1;
      p.life = p.max;
      p.size = 3 + Math.random() * 6;
      p.grow = 0;
      p.drag = 0.7;
      p.grav = 420;
      p.a0 = 0.95;
      p.rot = Math.random() * TAU;
      p.vrot = (Math.random() - 0.5) * 9;
      p.col = Math.random() < 0.5 ? C_WOOD_A : C_WOOD_B;
    }
  }

  function splash(x, y, n) {
    n = n | 0;
    for (var i = 0; i < n; i++) {
      var p = spawn(); if (!p) return;
      var a = -Math.PI * 0.5 + (Math.random() - 0.5) * 2.6;
      var v = 70 + Math.random() * 190;
      p.kind = K_SPLASH;
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * v + wind * 0.12;
      p.vy = Math.sin(a) * v;
      p.max = 0.45 + Math.random() * 0.6;
      p.life = p.max;
      p.size = 0.9 + Math.random() * 1.6;
      p.grow = -0.6;
      p.drag = 0.9;
      p.grav = 460;
      p.a0 = 0.55 + Math.random() * 0.35;
      p.rot = 0; p.vrot = 0;
      p.col = C_FOAM;
    }
  }

  function ring(x, y, color, maxR, dur, width) {
    if (rgCount >= MAX_RING) return;
    var r = RG[rgCount++];
    r.x = x; r.y = y;
    r.maxR = (typeof maxR === 'number' && maxR > 0) ? maxR : 90;
    r.max = (typeof dur === 'number' && dur > 0) ? dur : 0.55;
    r.life = r.max;
    r.w = (typeof width === 'number' && width > 0) ? width : 2.5;
    r.col = color || C_FOAM;
  }

  function glowPulse(x, y, color, r, dur) {
    if (glCount >= MAX_GLOW) return;
    var g = GL[glCount++];
    g.x = x; g.y = y;
    g.r = (typeof r === 'number' && r > 0) ? r : 70;
    g.max = (typeof dur === 'number' && dur > 0) ? dur : 0.6;
    g.life = g.max;
    // Un seul degrade alloue par couleur (unite : rayon 1), mis a l'echelle
    // par transform au dessin -> zero allocation par frame.
    g.col = color || C_AMBER;
    g.grad = gradCache(g.col);
  }

  // petit cache de degrades unitaires par couleur (borne)
  var gcKeys = new Array(12), gcVals = new Array(12), gcN = 0;
  var gcCtx = null;
  function gradCache(col) {
    for (var i = 0; i < gcN; i++) if (gcKeys[i] === col) return gcVals[i];
    if (!gcCtx) return null;
    var g = gcCtx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0.00, col);
    g.addColorStop(0.35, col);
    g.addColorStop(1.00, TRANSP);
    if (gcN < 12) { gcKeys[gcN] = col; gcVals[gcN] = g; gcN++; }
    return g;
  }

  function shake(mag) {
    if (!(mag > 0)) return;
    shakeMag += mag;
    if (shakeMag > 42) shakeMag = 42;
  }

  function lightning() {
    // Eclair LOINTAIN : flash bref et volontairement faible.
    var amp = flashPeak * (0.45 + 0.55 * storm);
    if (amp > flashPeak) amp = flashPeak;
    if (flash < amp) flash = amp;
    restrikeT = 0.09 + Math.random() * 0.09;
    restrikeAmp = amp * 0.55;
    buildBolt();
  }

  function buildBolt() {
    var x = W * (0.12 + Math.random() * 0.76);
    var y = -6;
    var span = H * (0.16 + Math.random() * 0.16);   // reste haut = lointain
    var step = span / (BOLT_SEG - 1);
    var drift = (Math.random() - 0.5) * 40;
    for (var i = 0; i < BOLT_SEG; i++) {
      boltPts[i * 2] = x;
      boltPts[i * 2 + 1] = y;
      x += drift * 0.06 + (Math.random() - 0.5) * 26;
      y += step * (0.7 + Math.random() * 0.6);
    }
    // deux ramifications courtes
    for (var b = 0; b < 2; b++) {
      var k = 3 + ((Math.random() * (BOLT_SEG - 5)) | 0);
      var bx = boltPts[k * 2], by = boltPts[k * 2 + 1];
      boltBranch[b * 4] = bx;
      boltBranch[b * 4 + 1] = by;
      boltBranch[b * 4 + 2] = bx + (Math.random() - 0.5) * 60;
      boltBranch[b * 4 + 3] = by + 14 + Math.random() * 34;
    }
    boltDur = 0.26 + Math.random() * 0.14;
    boltLife = boltDur;
  }

  /* ---------------------------------------------------------------
     UPDATE
     --------------------------------------------------------------- */
  function update(dt) {
    if (!(dt > 0)) return;
    if (dt > 0.05) dt = 0.05;
    time += dt;

    /* --- particules --- */
    var i, p;
    for (i = 0; i < pCount; i++) {
      p = P[i];
      p.life -= dt;
      if (p.life <= 0) {
        pCount--;
        var tmp = P[i]; P[i] = P[pCount]; P[pCount] = tmp;
        i--;
        continue;
      }
      var d = 1 - p.drag * dt; if (d < 0) d = 0;
      p.vx *= d; p.vy *= d;
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vrot * dt;
      if (p.grow !== 0) {
        p.size += p.grow * dt;
        if (p.size < 0.2) p.size = 0.2;
      }
      if (p.kind === K_SMOKE) p.vx += wind * 0.30 * dt;
    }

    /* --- embruns : emission continue pilotee par la tempete --- */
    var rate = 8 + storm * storm * 120;
    sprayAcc += rate * dt;
    while (sprayAcc >= 1) {
      sprayAcc -= 1;
      if (spCount >= MAX_SPRAY) { sprayAcc = 0; break; }
      var s = SP[spCount++];
      var fromLeft = wind >= 0;
      s.x = fromLeft ? -20 - Math.random() * 60 : W + 20 + Math.random() * 60;
      s.y = Math.random() * H;
      var base = 40 + Math.random() * 90 + Math.abs(wind) * 0.55;
      s.vx = (fromLeft ? base : -base);
      s.vy = (Math.random() - 0.25) * 40;
      s.max = 1.1 + Math.random() * 1.5;
      s.life = s.max;
      s.size = 0.8 + Math.random() * 1.9;
      s.a0 = (0.10 + Math.random() * 0.22) * (0.35 + 0.65 * storm);
    }
    for (i = 0; i < spCount; i++) {
      var q = SP[i];
      q.life -= dt;
      if (q.life <= 0 || q.x < -140 || q.x > W + 140) {
        spCount--;
        var t2 = SP[i]; SP[i] = SP[spCount]; SP[spCount] = t2;
        i--;
        continue;
      }
      q.vx += (wind * 0.9 - q.vx) * 0.7 * dt;
      q.vy += 26 * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
    }

    /* --- anneaux --- */
    for (i = 0; i < rgCount; i++) {
      RG[i].life -= dt;
      if (RG[i].life <= 0) {
        rgCount--;
        var t3 = RG[i]; RG[i] = RG[rgCount]; RG[rgCount] = t3;
        i--;
      }
    }
    /* --- halos --- */
    for (i = 0; i < glCount; i++) {
      GL[i].life -= dt;
      if (GL[i].life <= 0) {
        glCount--;
        var t4 = GL[i]; GL[i] = GL[glCount]; GL[glCount] = t4;
        i--;
      }
    }

    /* --- pluie --- */
    for (i = 0; i < rainActive; i++) {
      var k = rainK[i];
      rainY[i] += rainV[i] * dt;
      rainX[i] += (wind * LAYER_WF[k] + 245 * LAYER_WF[k]) * dt;
      if (rainY[i] > H + 24) {
        rainY[i] = -20 - Math.random() * 60;
        rainX[i] = Math.random() * (W + 300) - 150;
      }
      if (rainX[i] > W + 150) rainX[i] -= W + 300;
      else if (rainX[i] < -150) rainX[i] += W + 300;
    }

    /* --- houle --- */
    var wd = wind * 0.045;
    for (i = 0; i < NBAND; i++) {
      bandY[i] += bandSp[i] * dt;
      if (bandY[i] > H + 40) bandY[i] -= H + 80;
      bandPh[i] += dt * 0.5;
    }
    for (i = 0; i < NCREST; i++) {
      crY[i] += crS[i] * dt;
      crX[i] += wd * (0.35 + crD[i]) * dt * 4;
      if (crY[i] > H + 30) {
        crY[i] -= H + 60;
        crX[i] = Math.random() * (W + 160) - 80;
      }
      if (crX[i] > W + 80) crX[i] -= W + 160;
      else if (crX[i] < -80) crX[i] += W + 160;
    }

    /* --- eclairs --- */
    if (flash > 0) {
      flash -= flash * 9 * dt + 0.02 * dt;
      if (flash < 0.002) flash = 0;
    }
    if (restrikeT >= 0) {
      restrikeT -= dt;
      if (restrikeT < 0) {
        if (flash < restrikeAmp) flash = restrikeAmp;
        boltLife = boltDur * 0.7;
        restrikeT = -1;
      }
    }
    if (boltLife > 0) boltLife -= dt;
    boltAlpha = boltLife > 0 ? (boltLife / boltDur) : 0;

    if (storm > 0.04) {
      nextBolt -= dt;
      if (nextBolt <= 0) {
        lightning();
        nextBolt = 3.5 + (1 - storm) * 22 + Math.random() * (6 + (1 - storm) * 14);
      }
    }

    /* --- tremblement --- */
    if (shakeMag > 0.01) {
      shakeT += dt;
      shakeMag *= Math.exp(-6.2 * dt);
      var e = shakeMag;
      shOffX = e * Math.sin(shakeT * 47.3 + shPhA) * Math.sin(shakeT * 19.7 + shPhB);
      shOffY = e * Math.sin(shakeT * 53.1 + shPhB) * Math.sin(shakeT * 23.3);
    } else {
      shakeMag = 0; shOffX = 0; shOffY = 0;
    }
  }

  /* ---------------------------------------------------------------
     DRAW : la mer (couche arriere)
     --------------------------------------------------------------- */
  function drawSea(ctx, w, h, t) {
    if (!gcCtx) gcCtx = ctx;
    ensure(ctx, w, h);
    if (typeof t !== 'number') t = time;

    ctx.save();

    // fond
    ctx.fillStyle = gSea;
    ctx.fillRect(0, 0, W, H);

    // houle longue : bandes sinusoidales qui defilent
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = C_CREST;
    ctx.lineWidth = 1.6;
    var step = 26;
    var i, x, y;
    for (i = 0; i < NBAND; i++) {
      var by = bandY[i], ph = bandPh[i], am = bandAm[i];
      ctx.globalAlpha = bandAl[i];
      ctx.beginPath();
      for (x = -20; x <= W + 20; x += step) {
        y = by + Math.sin(x * 0.0125 + ph) * am
               + Math.sin(x * 0.031 - ph * 1.7) * am * 0.35;
        if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // chevrons de crete (deux passes : sombres puis ecume)
    var pass, c0, c1;
    for (pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? C_CREST : C_FOAM;
      ctx.beginPath();
      for (i = 0; i < NCREST; i++) {
        if ((crF[i] === 1) !== (pass === 1)) continue;
        var cxp = crX[i], cyp = crY[i], l = crL[i] * 0.5;
        var bob = Math.sin(t * 1.7 + i * 0.7) * 2.2;
        var amp = 3 + crD[i] * 5;
        c0 = cyp + bob + amp;
        c1 = cyp + bob;
        ctx.moveTo(cxp - l, c0);
        ctx.quadraticCurveTo(cxp, c1 - amp * 0.4, cxp + l, c0);
      }
      if (pass === 0) { ctx.globalAlpha = 0.30; ctx.lineWidth = 1.5; }
      else            { ctx.globalAlpha = 0.24; ctx.lineWidth = 1.2; }
      ctx.stroke();
    }

    // reflets d'ecume ponctuels sur les cretes profondes
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = C_FOAM;
    ctx.beginPath();
    for (i = 0; i < NCREST; i += 3) {
      if (crD[i] < 0.55) continue;
      var rx = crX[i] + Math.sin(t * 2.1 + i) * 4;
      var ry = crY[i] + Math.sin(t * 1.3 + i * 0.5) * 2;
      ctx.moveTo(rx + 1.4, ry);
      ctx.arc(rx, ry, 1.4, 0, TAU);
    }
    ctx.fill();

    // eclairage rasant de l'eclair sur la mer (tres discret)
    if (flash > 0.004) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = flash * 0.5;
      ctx.fillStyle = gHaze;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.restore();
  }

  /* ---------------------------------------------------------------
     DRAW : couche avant
     --------------------------------------------------------------- */
  function drawFront(ctx, w, h) {
    if (!gcCtx) gcCtx = ctx;
    ensure(ctx, w, h);

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var i;

    /* --- embruns (derriere le reste) --- */
    if (spCount > 0) {
      ctx.fillStyle = C_FOAM;
      for (i = 0; i < spCount; i++) {
        var q = SP[i];
        var qt = q.life / q.max;
        ctx.globalAlpha = q.a0 * (qt < 0.3 ? qt / 0.3 : 1);
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.size, 0, TAU);
        ctx.fill();
      }
    }

    /* --- particules opaques : fumee, debris, gouttes --- */
    var last = null, p, lt;
    for (i = 0; i < pCount; i++) {
      p = P[i];
      if (p.kind === K_SPARK) continue;
      lt = p.life / p.max;
      if (p.kind === K_SMOKE) {
        ctx.globalAlpha = p.a0 * lt * lt;
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      } else if (p.kind === K_DEBRIS) {
        ctx.globalAlpha = p.a0 * (lt < 0.25 ? lt / 0.25 : 1);
        ctx.strokeStyle = p.col;
        ctx.lineWidth = 2.2;
        var dx = Math.cos(p.rot) * p.size, dy = Math.sin(p.rot) * p.size;
        ctx.beginPath();
        ctx.moveTo(p.x - dx, p.y - dy);
        ctx.lineTo(p.x + dx, p.y + dy);
        ctx.stroke();
      } else { // K_SPLASH
        ctx.globalAlpha = p.a0 * lt;
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
    }

    /* --- couche additive : etincelles, anneaux, halos --- */
    ctx.globalCompositeOperation = 'lighter';

    last = null;
    for (i = 0; i < pCount; i++) {
      p = P[i];
      if (p.kind !== K_SPARK) continue;
      lt = p.life / p.max;
      ctx.globalAlpha = p.a0 * lt * lt;
      if (last !== p.col) { ctx.strokeStyle = p.col; last = p.col; }
      ctx.lineWidth = p.size;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.012, p.y - p.vy * 0.012);
      ctx.stroke();
    }

    for (i = 0; i < rgCount; i++) {
      var r = RG[i];
      var rt = 1 - r.life / r.max;                  // 0 -> 1
      var rr = r.maxR * (1 - (1 - rt) * (1 - rt));  // ease-out
      if (rr < 0.5) rr = 0.5;
      var fade = (1 - rt) * (1 - rt) * (1 - rt * 0.35);
      ctx.strokeStyle = r.col;
      // halo large et diffus
      ctx.globalAlpha = fade * 0.14;
      ctx.lineWidth = r.w * 3.2 * (1 - rt * 0.5) + 1;
      ctx.beginPath();
      ctx.arc(r.x, r.y, rr, 0, TAU);
      ctx.stroke();
      // trait principal
      ctx.globalAlpha = fade * 0.5;
      ctx.lineWidth = r.w * (1 - rt * 0.8) + 0.25;
      ctx.beginPath();
      ctx.arc(r.x, r.y, rr, 0, TAU);
      ctx.stroke();
    }

    for (i = 0; i < glCount; i++) {
      var g = GL[i];
      if (!g.grad) { g.grad = gradCache(g.col); if (!g.grad) continue; }
      var gt = g.life / g.max;
      var gr = g.r * (1.25 - 0.25 * gt) * (0.35 + 0.65 * (1 - gt * gt));
      ctx.globalAlpha = gt * gt * 0.55;
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.scale(gr, gr);
      ctx.fillStyle = g.grad;
      ctx.beginPath();
      ctx.arc(0, 0, 1, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    /* --- decharge lointaine --- */
    if (boltAlpha > 0.01) {
      ctx.strokeStyle = C_BOLT;
      // halo large
      ctx.globalAlpha = boltAlpha * 0.20;
      ctx.lineWidth = 7;
      strokeBolt(ctx);
      // trait fin
      ctx.globalAlpha = boltAlpha * 0.62;
      ctx.lineWidth = 1.5;
      strokeBolt(ctx);
    }

    /* --- flash global (jamais aveuglant : <= 0.25) --- */
    if (flash > 0.004) {
      ctx.globalAlpha = flash;
      ctx.fillStyle = gHaze;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.globalCompositeOperation = 'source-over';

    /* --- pluie : 3 passes de parallaxe --- */
    ctx.strokeStyle = C_RAIN;
    for (var k = 0; k < 3; k++) {
      ctx.globalAlpha = LAYER_A[k] * (0.35 + 0.65 * storm);
      ctx.lineWidth = LAYER_W[k];
      ctx.beginPath();
      for (i = k; i < rainActive; i += 3) {
        var len = rainL[i];
        var sl = (wind * LAYER_WF[k] + 245 * LAYER_WF[k]) / rainV[i];
        var ex = rainX[i] - sl * len, ey = rainY[i] - len;
        ctx.moveTo(rainX[i], rainY[i]);
        ctx.lineTo(ex, ey);
      }
      ctx.stroke();
    }

    /* --- vignette --- */
    ctx.globalAlpha = 1;
    ctx.fillStyle = gVign;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  function strokeBolt(ctx) {
    var i;
    ctx.beginPath();
    ctx.moveTo(boltPts[0], boltPts[1]);
    for (i = 1; i < BOLT_SEG; i++) ctx.lineTo(boltPts[i * 2], boltPts[i * 2 + 1]);
    for (i = 0; i < 2; i++) {
      ctx.moveTo(boltBranch[i * 4], boltBranch[i * 4 + 1]);
      ctx.lineTo(boltBranch[i * 4 + 2], boltBranch[i * 4 + 3]);
    }
    ctx.stroke();
  }

  /* ---------------------------------------------------------------
     Init
     --------------------------------------------------------------- */
  seedSea();
  seedRain();
  updateRainCount();

  var api = {
    resize: resize,
    setWind: setWind,
    setStorm: setStorm,
    update: update,
    drawSea: drawSea,
    drawFront: drawFront,
    spark: spark,
    smoke: smoke,
    debris: debris,
    splash: splash,
    ring: ring,
    glowPulse: glowPulse,
    shake: shake,
    shakeX: function () { return shOffX; },
    shakeY: function () { return shOffY; },
    lightning: lightning,
    flashAlpha: function () { return flash; },
    count: function () { return pCount + spCount; }
  };
  return api;
}
